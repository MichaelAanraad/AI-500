ize permission changes.","rationale":["Correct: live retrieval with the full SharePoint permission model and labels, without an index.","An indexed SharePoint source generates an indexer pipeline and index, which violates the preference to maintain no index.","ACL ingestion through the SharePoint indexer requires an index and indexer runs to update permissions, which violates the preference to maintain no index.","Security filters are intended for custom access models and do not replicate the SharePoint permission model and labels."],"ref":"https://learn.microsoft.com/azure/search/search-indexer-sharepoint-access-control-lists"},{"id":"2.2.4-08","obj":"2.2.4","difficulty":"hard","type":"single","stem":"Fabrikam Residences pushes documents into an Azure AI Search index that grounds several tenant-facing agents. Authorization comes from a non-Microsoft system, so native ACL integration is unavailable. Each user belongs to up to 2,000 groups. Retrieval must exclude unauthorized documents inside the search pipeline and keep subsecond response times.\n\nWhat should you do?","choices":["Store group identifiers in a filterable string field, and filter queries by using the search.in function with the groups of the user.","Store group identifiers in a filterable string field, and filter queries by using a disjunction of eq expressions for each group.","Return unfiltered results, and remove unauthorized documents in the agent code after retrieval.","Configure an indexer to ingest ADLS Gen2 ACL permission metadata."],"answer":[0],"explanation":"The security filter pattern stores principal identifiers in a field and trims results with an OData filter. With search.in, you get subsecond response times even with thousands of values; a long disjunction of eq expressions is error-prone and slows queries by seconds.","rationale":["Correct: search.in is the recommended, performant form of security trimming with a custom access model.","A disjunction of hundreds or thousands of eq expressions slows the query by seconds and is hard to maintain.","Post-query trimming in the app loads larger result sets and is slower than filtering in the search pipeline.","ADLS Gen2 ACL ingestion requires content and permissions in ADLS Gen2 with Microsoft Entra ID, which does not apply here."],"ref":"https://learn.microsoft.com/azure/search/search-security-trimming-for-azure-search"},{"id":"2.2.4-09","obj":"2.2.4","difficulty":"hard","type":"multi","stem":"Wide World Importers builds a Foundry IQ knowledge base for its procurement agents. Supplier contracts are PDF files in an Azure Blob Storage container, and no search index exists yet. The contracts must be chunked and vectorized automatically. Current stock levels are exposed by an internal inventory system through an MCP-compatible endpoint and must be queried live, without an ingestion pipeline.\n\nWhich two knowledge sources should you add? Each correct answer presents part of the solution.","choices":["an Azure blob knowledge source","an MCP server knowledge source","a search index knowledge source","a web knowledge source","a remote SharePoint knowledge source"],"answer":[0,1],"explanation":"An Azure blob knowledge source automatically generates a complete indexer pipeline (data source, skillset, index, and indexer) that chunks and optionally vectorizes content. An MCP server knowledge source requests live data from any MCP-compatible endpoint at query time, without ingestion.","rationale":["Correct: generates the chunking and vectorization pipeline from the blob container.","Correct: retrieves live, tool-backed results from the MCP endpoint without an ingestion pipeline.","A search index knowledge source wraps an existing index, but no index exists yet.","A web knowledge source retrieves public data from Bing, not internal contracts or stock.","Remote SharePoint retrieves content from SharePoint, while the sources are blob storage and an MCP endpoint."],"ref":"https://learn.microsoft.com/azure/search/agentic-knowledge-source-how-to-mcp-server"},{"id":"2.3.1-01","obj":"2.3.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. is building Agent1 in Foundry Agent Service. Agent1 must look up order status in an internal order system. The order system is reachable from the Fabrikam application code that runs in a private network, and the application must run the lookup logic itself.\n\nWhich tool type should you configure for Agent1?","choices":["Function calling","Code Interpreter","File Search","Grounding with Bing Search"],"answer":[0],"explanation":"With function calling, you define the name, parameters, and description of a function. The model asks your application to call the function; your own code runs the function and sends the output back. Because only the application code can reach the order system, function calling is the correct choice.","rationale":["Correct: the agent supplies the function name and arguments, and your application runs the lookup in its own network.","Code Interpreter runs Python in a sandbox managed by the service and cannot reach the internal order system.","File Search searches uploaded documents, not a live internal system.","Grounding with Bing Search retrieves public web information, not internal order status."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/function-calling"},{"id":"2.3.1-02","obj":"2.3.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank has a compliance agent named Agent2 that has three tools: check_sanctions, check_pep, and check_adverse_media. Every response from Agent2 must be based on at least one tool call, but the model must decide which of the three tools fits the request.\n\nWhich tool_choice value should you use?","choices":["auto","required","none","{\"type\": \"function\", \"name\": \"check_sanctions\"}"],"answer":[1],"explanation":"With tool_choice, you control tool calls deterministically. The value required forces the model to call one or more tools, while the model itself chooses which tool fits. This meets both requirements: always a tool call, but a free choice between the three tools.","rationale":["auto lets the model decide whether to call a tool; a response without a tool call remains possible.","Correct: required enforces at least one tool call and leaves the choice of tool to the model.","none prevents the model from calling tools at all.","A specific function always forces check_sanctions, so the model no longer chooses between the three tools."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/tool-best-practice"},{"id":"2.3.1-03","obj":"2.3.1","difficulty":"easy","type":"single","stem":"Relecloud has an HTTP API that is described by an OpenAPI 3.0 specification and protected by Microsoft Entra ID. A Foundry Agent Service agent must call operations of the API server-side, and you must avoid writing application code that executes the calls.\n\nWhich tool should you add to the agent?","choices":["OpenAPI tool","Function calling","Code Interpreter","Browser Automation"],"answer":[0],"explanation":"The OpenAPI tool loads an OpenAPI 3.0/3.1 specification so the model can call the operations through the service itself. Authentication can be anonymous, API key, or managed identity; managed identity fits an API that accepts Microsoft Entra ID tokens. No custom execution code is needed.","rationale":["Correct: the OpenAPI tool calls the API server-side and supports managed identity for Entra-protected APIs.","With function calling, your own application code must run the function, which violates the requirement.","Code Interpreter runs Python code in a sandbox and is not intended to integrate a specified REST API.","Browser Automation performs browser tasks through natural language, not structured API operations from an OpenAPI specification."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/openapi"},{"id":"2.3.1-04","obj":"2.3.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. builds an agent by using Microsoft Agent Framework for Python. The agent has 60 function tools. Tests show that tool-selection accuracy drops and token costs rise because every request sends all 60 tool schemas to the model. You need the agent to start each run with a small set of tools and to add more tools on demand during the same run, based on earlier tool results.\n\nWhat should you do?","choices":["Register a loader tool that calls add_tools on the FunctionInvocationContext to expose more tools during the run.","Pass the complete list of 60 tools to agent.run by using the tools parameter for each request.","Set tool_choice to required and set required_function_name for each tool.","Set max_function_calls in the function invocation configuration of the chat client."],"answer":[0],"explanation":"Progressive tool exposure lets a run start with a small set of tools; a loader tool calls ctx.add_tools so extra tools become visible in the next iteration of the function-calling loop. This keeps the initial schema small, which improves tool selection and lowers cost.","rationale":["Correct: the loader tool pattern adds tools dynamically within the same run.","Passing tools per run determines the set at the start of the run; all 60 schemas are still sent.","required_function_name forces a specific first call; it does not reduce the set of tools offered.","max_function_calls limits the number of calls, but does not change which tool schemas the model sees."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/controlling-tool-availability"},{"id":"2.3.1-05","obj":"2.3.1","difficulty":"medium","type":"single","stem":"Northwind Traders builds an agent by using Microsoft Agent Framework for Python. The agent has two tools named get_record and update_record. The model must not be offered the update_record tool schema until get_record has run successfully in the current run. You must implement the requirement without adding a workflow.\n\nWhich technique should you use?","choices":["Register get_record at agent creation, and call add_tools from inside get_record to expose update_record.","Add function middleware that rejects update_record calls when the record was not fetched first.","Build a sequential workflow that has one executor for get_record and one for update_record.","Add an agent instruction that tells the model to fetch a record before it updates the record."],"answer":[0],"explanation":"With the gating pattern, you register only the read tool; it adds the write tool after a successful fetch. The model therefore sees update_record only afterward, and because the tool list resets on every run, the gate becomes active again each turn. Pairwise orderings do not require a workflow.","rationale":["Correct: update_record is visible only after get_record has run successfully.","Middleware gating does reject the call, but the model sees the update_record schema from the start.","A workflow is explicitly ruled out and, according to the documentation, is not needed for this ordering.","An instruction is not deterministic and does not hide the schema."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/controlling-tool-availability"},{"id":"2.3.1-06","obj":"2.3.1","difficulty":"medium","type":"single","stem":"Litware, Inc. has a Foundry Agent Service agent that uses function calling. A function named start_reconciliation calls a back-office job that runs for up to 25 minutes. Tests show that the agent runs that call start_reconciliation fail before the job completes. The agent must still report the job outcome to the user.\n\nWhat should you do?","choices":["Return a job status immediately, and add a status function that the agent can poll.","Set tool_choice to required for the runs that call start_reconciliation so that the model waits for the job.","Set strict to true in the start_reconciliation definition so that the run accepts a longer execution.","Submit the function output in a new conversation after the job completes, and reference the original call_id."],"answer":[0],"explanation":"Runs expire 10 minutes after creation, and that limit applies to the total elapsed time, not per function execution. For long-running operations, you return a status immediately and implement polling. This keeps the run within the limit and lets the agent retrieve the outcome later.","rationale":["Correct: returning a status immediately plus polling fits within the run expiration time.","tool_choice determines whether a tool is called, not how long the run may last.","strict guarantees schema-conforming arguments, but does not extend the run.","A new conversation does not contain the original function_call, and the 10-minute expiration of the original run still applies."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/function-calling"},{"id":"2.3.1-07","obj":"2.3.1","difficulty":"hard","type":"single","stem":"Tailspin Toys uses Microsoft Agent Framework for Python. An agent has two tools named get_record and update_record. For a specific request, the first action of the model must be a call to get_record. After that first call, the model must be free to choose its next action.\n\nYou write the following code:\n\n```python\nresult = await agent.run(\n    \"Update record REC-42 to status 'in-progress'.\",\n    options={\"tool_choice\": <value>},\n)\n```\n\nWhich value should you use for <value>?","choices":["{\"mode\": \"required\", \"required_function_name\": \"get_record\"}","\"required\"","\"auto\"","\"none\""],"answer":[0],"explanation":"A ToolMode dict with mode required and required_function_name forces a call to that specific function as the first action. The framework automatically resets tool_choice to None after the first iteration, so the model is free afterward. The shorthand strings do not name a specific function.","rationale":["Correct: forces get_record as the first call, after which the model is free.","required forces a tool call, but the model may then also choose update_record first.","auto leaves the model free, so get_record is not guaranteed to be the first action.","none prevents tool calls entirely."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/controlling-tool-availability"},{"id":"2.3.1-08","obj":"2.3.1","difficulty":"hard","type":"multi","stem":"A. Datum Corporation uses function calling in Foundry Agent Service. Agent1 can call a function named update_shipping_address that writes to the order database. The function authenticates to the database by using DefaultAzureCredential. You need to prevent malformed or malicious values from reaching the order database, and you need to limit the impact if the identity is misused.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Validate and sanitize the function arguments before the function uses them.","Apply least privilege to the identity that DefaultAzureCredential uses.","Return the database connection string in the tool output so that the model can retry the call.","Set tool_choice to none for the runs that might update an address.","Update the function definition in the Foundry portal so that the portal runs the function."],"answer":[0,1],"explanation":"The security guidelines for function calling say: treat tool arguments and output as untrusted input and validate them, and apply least privilege to the identity of DefaultAzureCredential. Together they prevent wrong values in the database and limit the damage in case of misuse.","rationale":["Correct: arguments from the model are untrusted input and must be validated.","Correct: least privilege limits what a misused identity can do.","Secrets such as connection strings never belong in tool output.","none disables tool calls, which makes the function unusable.","The portal cannot add or update function definitions and does not run your functions; your code does that."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/function-calling"},{"id":"2.3.1-09","obj":"2.3.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. creates a prompt agent in Foundry Agent Service that uses function calling to return live delivery estimates from an internal service. You need to implement the function calling flow.\n\nWhich sequence of actions should you perform?","choices":["Define the function tool -> Create the agent with the function definition -> Send the prompt and read the function_call item -> Run the function and send a function_call_output item that references the previous response","Create the agent -> Send the prompt and read the function_call item -> Define the function tool -> Run the function and send a function_call_output item that references the previous response","Define the function tool -> Create the agent with the function definition -> Run the function and send a function_call_output item that references the previous response -> Send the prompt and read the function_call item","Define the function tool -> Send the prompt and read the function_call item -> Create the agent with the function definition -> Run the function and send a function_call_output item that references the previous response"],"answer":[0],"explanation":"The pattern is: define the function, register the agent with the definition, send a prompt (the first response contains a function_call item), run the function with the returned arguments, and send a follow-up request with a function_call_output item that refers to the previous response.","rationale":["Correct: this is the documented sequence for function calling.","The agent must know the function definition at creation; otherwise the model cannot return a function_call.","You can run the function only after the model has returned a function_call with arguments.","Sending a prompt before the agent exists is not possible; the agent with its definition must exist first."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/function-calling"},{"id":"2.3.2-01","obj":"2.3.2","difficulty":"easy","type":"single","stem":"Wide World Importers manages a REST API named Orders API in Azure API Management Standard v2. You need to expose selected operations of Orders API as tools that MCP clients can call, without writing or hosting new server code.\n\nWhat should you do?","choices":["Create an MCP server in API Management by using the Expose an API as an MCP server option.","Create an MCP server in API Management by using the Expose an existing MCP server option.","Build an MCP server by using the Azure Functions MCP extension, and add it as an API backend.","Associate Orders API with a product, and give MCP clients a subscription key for the API."],"answer":[0],"explanation":"API Management can publish a managed REST API as a remote MCP server through the built-in AI gateway; selected API operations become MCP tools. No custom MCP server code needs to be written or hosted.","rationale":["Correct: API Management publishes the selected API operations directly as MCP tools, without custom server code.","This option is for an MCP-compatible server that already runs outside API Management; there is none here.","A Functions-based MCP server is new server code that you must write and host, which violates the requirement.","A product and subscription key control access to the REST API, but do not turn the operations into MCP tools."],"ref":"https://learn.microsoft.com/azure/api-management/export-rest-mcp-server"},{"id":"2.3.2-02","obj":"2.3.2","difficulty":"easy","type":"single","stem":"Coho Winery builds a remote MCP server by using the Azure Functions MCP extension. A function must run each time an MCP client calls a tool named get_vintage.\n\nWhich binding should you use for the function?","choices":["MCP tool trigger","MCP resource trigger","MCP prompt trigger","HTTP trigger"],"answer":[0],"explanation":"The Azure Functions MCP extension offers three triggers: the tool trigger runs a function on an MCP tool call, the resource trigger exposes a function as an MCP resource, and the prompt trigger exposes it as an MCP prompt. For a tool call, you need the tool trigger.","rationale":["Correct: the MCP tool trigger runs the function on a tool call request.","The resource trigger exposes an MCP resource, not a tool.","The prompt trigger exposes a reusable MCP prompt, not a tool.","A regular HTTP trigger is not an MCP binding; the extension then does not handle the MCP protocol."],"ref":"https://learn.microsoft.com/azure/azure-functions/functions-bindings-mcp"},{"id":"2.3.2-03","obj":"2.3.2","difficulty":"easy","type":"single","stem":"A developer at Fourth Coffee builds an agent by using Microsoft Agent Framework for Python. The agent must use a filesystem MCP server that the application starts as a local child process and communicates with over standard input and output.\n\nWhich class should you use to connect the agent to the MCP server?","choices":["MCPStdioTool","MCPStreamableHTTPTool","FunctionTool","MCPTool from azure.ai.projects.models"],"answer":[0],"explanation":"MCPStdioTool connects an Agent Framework agent to a stdio-based MCP server, usually a local process started through command and args. That is exactly the transport described here.","rationale":["Correct: MCPStdioTool starts and connects to a local stdio MCP server.","MCPStreamableHTTPTool connects to an MCP server through an HTTP URL, not through stdin/stdout.","FunctionTool wraps a local function and does not speak the MCP protocol.","MCPTool from azure.ai.projects configures a remote MCP server for Foundry Agent Service; the service runtime accepts only remote endpoints."],"ref":"https://learn.microsoft.com/python/api/agent-framework-core/agent_framework.mcpstdiotool?view=agent-framework-python-latest"},{"id":"2.3.2-04","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Alpine Ski House has Azure Logic Apps workflows that use connectors to create IT tickets. The workflows run in a Consumption logic app and start with a Recurrence trigger. You need to expose the ticket workflows as tools on a remote MCP server that MCP clients can discover, and you want to reuse the existing workflow logic.\n\nWhat should you do?","choices":["Rebuild the workflows in a Standard logic app on a Workflow Service Plan, with a Request trigger and a Response action.","Keep the Consumption logic app, replace the Recurrence trigger with a Request trigger, and add a Response action.","Add the Consumption logic app to Azure API Management by using the Expose an existing MCP server option.","Wrap the workflow actions in a Scope action, and configure run after to return errors to the MCP client."],"answer":[0],"explanation":"Logic Apps can publish workflows as a remote MCP server from a Standard logic app on a Workflow Service Plan or App Service Environment v3. The workflows must start with the Request trigger When an HTTP request is received and end with a Response action.","rationale":["Correct: Standard hosting plus a Request trigger and Response action are the requirements for workflows as MCP tools.","Consumption logic apps do not support the MCP server feature, even with a Request trigger.","That option requires an existing MCP-compatible server; a Consumption workflow is not one.","A Scope with run after handles error handling, but does not expose the workflows as MCP tools."],"ref":"https://learn.microsoft.com/azure/logic-apps/create-model-context-protocol-server-standard"},{"id":"2.3.2-05","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Adventure Works Cycles wants a Foundry Agent Service agent to use an open-source MCP server that developers currently run locally. The server starts with an npx command and depends on Playwright, which requires OS-level dependencies. Foundry Agent Service accepts only remote MCP server endpoints.\n\nWhich hosting approach should you use for the MCP server?","choices":["Package the server in a Linux container and host it in Azure Container Apps.","Host the server in Azure Functions by using the Azure Functions MCP extension.","Host the server in Azure Functions as a self-hosted MCP server.","Connect the agent to the local server by using the stdio transport."],"answer":[0],"explanation":"Agent Service accepts only a remote MCP endpoint, so the local server must be hosted in the cloud. Azure Container Apps supports npx/uvx start commands and all dependencies in the container image, whereas Azure Functions supports neither npx start commands nor OS-level dependencies such as Playwright.","rationale":["Correct: a Linux container in Azure Container Apps supports npx and OS-level dependencies.","Incorrect: Azure Functions does not support OS-level dependencies such as Playwright; npx start commands are not supported either.","Incorrect: self-hosted on Azure Functions also supports neither npx start commands nor OS-level dependencies.","Incorrect: Agent Service accepts only remote MCP endpoints, not a local stdio server."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"2.3.2-06","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Margie's Travel exposes an existing MCP server through Azure API Management. MCP clients send access tokens that are issued by Microsoft Entra ID in the Authorization header. API Management must return a 401 response for requests that have a missing or invalid token before any tool is called, and it must accept tokens for one specific client application.\n\nWhich policy should you add to the inbound section?","choices":["validate-azure-ad-token","get-authorization-context","set-backend-service","rate-limit-by-key"],"answer":[0],"explanation":"For inbound access to an MCP server in API Management, the validate-azure-ad-token policy validates Entra ID tokens from the Authorization header. You configure the tenant, the allowed client application IDs, and the failed-validation-httpcode 401.","rationale":["Correct: validates Entra tokens inbound and rejects invalid requests with 401.","get-authorization-context obtains a token through the credential manager for outbound backend calls; it does not validate inbound tokens.","set-backend-service routes a request to a different backend and does not perform authentication.","rate-limit-by-key limits the number of calls, but does not check tokens."],"ref":"https://learn.microsoft.com/azure/api-management/secure-mcp-servers"},{"id":"2.3.2-07","obj":"2.3.2","difficulty":"hard","type":"multi","stem":"Trey Research exposes a REST API as an MCP server in Azure API Management. After two changes, MCP clients report that tool calls fail and responses no longer stream. The changes are:\n\n- Diagnostic logging to Application Insights was enabled at the All APIs scope, including frontend response payloads.\n- An MCP server policy was added that reads context.Response.Body to log tool output.\n\nYou need to restore MCP server functionality and keep diagnostic logging for the other APIs.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Set Number of payload bytes to log for Frontend Response to 0 at the All APIs scope.","Remove the access to context.Response.Body from the MCP server policy.","Change the MCP server transport from Streamable HTTP to SSE.","Add a retry policy that wraps forward-request in the MCP server policy.","Associate the MCP server with an additional API Management product."],"answer":[0,1],"explanation":"Logging response bodies at All APIs scope and reading context.Response.Body in an MCP policy cause response buffering, which breaks the streaming behavior of MCP. Set the frontend response payload logging to 0 at global scope (and optionally log payloads per API) and remove the body access from the policy.","rationale":["Correct: prevents global response body logging that breaks MCP streaming; per API you can still log selectively.","Correct: reading context.Response.Body triggers buffering and disrupts the MCP transport.","SSE is the deprecated transport; it does not solve the buffering problem.","A retry only repeats the same buffered, failing call.","Products control access and subscriptions, not streaming."],"ref":"https://learn.microsoft.com/azure/api-management/export-rest-mcp-server"},{"id":"2.3.2-08","obj":"2.3.2","difficulty":"hard","type":"single","stem":"Lucerne Publishing connects a Foundry Agent Service prompt agent to a remote MCP server that exposes eight tools. The agent must be able to call get_stock and list_warehouses. The other six tools must be unavailable to the agent.\n\nYou write the following code:\n\n```python\ntool = MCPTool(\n    server_label=\"inventory\",\n    server_url=\"https://mcp.lucernepublishing.com/inventory/mcp\",\n    <parameter>,\n    project_connection_id=MCP_CONNECTION_NAME,\n)\n```\n\nWhich code should you use for <parameter>?","choices":["allowed_tools=[\"get_stock\", \"list_warehouses\"]","require_approval={\"never\": [\"get_stock\", \"list_warehouses\"]}","require_approval={\"always\": [\"get_stock\", \"list_warehouses\"]}","require_approval=\"always\""],"answer":[0],"explanation":"allowed_tools is an optional allow list of tools that the agent may use; without this value, all tools of the MCP server are available. require_approval only controls whether a call needs approval first, not which tools are available.","rationale":["Correct: restricts the agent to the two named tools.","With this, the two tools need no approval, but the other six tools remain available.","With this, the two tools ask for approval; the other six tools remain available.","Approval for every call is also the default value, and all eight tools remain available."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"2.3.2-09","obj":"2.3.2","difficulty":"hard","type":"single","stem":"Graphic Design Institute builds MCP tools by using the Azure Functions MCP extension. You need to make the tools available to an existing Foundry Agent Service agent by using key-based authentication.\n\nWhich sequence of actions should you perform?","choices":["Deploy the MCP server to a function app -> Get the endpoint URL that ends in /runtime/webhooks/mcp -> Copy the mcp_extension system key -> Add an MCP tool to the agent with Key-based authentication and an x-functions-key credential","Deploy the MCP server to a function app -> Disable key-based authentication -> Get the endpoint URL that ends in /runtime/webhooks/mcp -> Add an MCP tool to the agent with Key-based authentication and an x-functions-key credential","Get the endpoint URL that ends in /runtime/webhooks/mcp -> Add an MCP tool to the agent with Key-based authentication and an x-functions-key credential -> Deploy the MCP server to a function app -> Copy the mcp_extension system key","Deploy the MCP server to a function app -> Copy the default host key -> Add an MCP tool to the agent with Key-based authentication and an x-functions-key credential -> Get the endpoint URL that ends in /runtime/webhooks/mcp"],"answer":[0],"explanation":"The documented process: deploy the MCP server, retrieve the endpoint URL (/runtime/webhooks/mcp), retrieve the correct key, and then add an MCP tool connection in the agent. For a server based on the MCP extension, that is the system key mcp_extension; the host key default belongs to a self-hosted MCP server.","rationale":["Correct: the right order and the right key for an MCP extension server.","Disabling key-based authentication makes the x-functions-key-credential unusable.","You cannot use an endpoint URL or key from a server that is not yet deployed.","The default host key is for self-hosted servers, and the endpoint URL is needed before you add the tool."],"ref":"https://learn.microsoft.com/azure/azure-functions/functions-mcp-foundry-tools"},{"id":"2.3.3-01","obj":"2.3.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. builds a Python agent by using Microsoft Agent Framework. The agent uses a Mistral model that is deployed in Microsoft Foundry. The model sometimes passes a string where a tool expects an integer. When the call fails, the model receives only a generic error message and repeats the same mistake. Tool results stay on a trusted channel.\n\nYou need the model to see what went wrong so that it can self-correct. You must not write custom error-handling code.\n\nWhat should you do?","choices":["Set include_detailed_errors to True in function_invocation_configuration.","Add function middleware that catches the exception and sets the result to the error text.","Set terminate_on_unknown_calls to True in function_invocation_configuration.","Increase max_consecutive_errors_per_request in function_invocation_configuration."],"answer":[0],"explanation":"By default, include_detailed_errors is False, so function execution and argument-validation failures return generic results to the model. Setting it to True adds the exception type and message to the function result, so the model can see what went wrong and correct itself. Exception text can contain sensitive data, so use it only on a trusted channel.","rationale":["Correct: detailed errors give the model the information to retry with corrected input, without custom code.","Incorrect: function middleware can also return the error text, but that is custom error-handling code.","Incorrect: this setting controls calls to tools that are not available to the client, not failed calls to known tools.","Incorrect: allowing more consecutive errors gives the model no extra information about the error."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools?pivots=programming-language-python"},{"id":"2.3.3-02","obj":"2.3.3","difficulty":"easy","type":"single","stem":"VanArsdel, Ltd. exposes a Standard logic app workflow as an MCP tool. The workflow calls an HTTP endpoint that sometimes returns 429 and 503 responses. The HTTP action must resend failed requests six times, and it must wait a random interval that is selected from an exponentially growing range, with a custom maximum interval.\n\nWhich retry policy type should you configure on the HTTP action?","choices":["Exponential Interval","Fixed Interval","Default","None (do not retry)"],"answer":[0],"explanation":"The Exponential Interval policy waits a random interval from an exponentially growing range and lets you set count (1 to 90), minimumInterval, and maximumInterval. This satisfies six attempts and a custom maximum interval.","rationale":["Correct: exponential random interval with configurable count and maximum.","Fixed Interval always waits the same interval, not an exponentially growing one.","Default is exponential, but with fixed settings (up to 4 retries); you cannot set six attempts or a custom maximum there.","None does not resend failed requests."],"ref":"https://learn.microsoft.com/azure/logic-apps/error-exception-handling"},{"id":"2.3.3-03","obj":"2.3.3","difficulty":"easy","type":"single","stem":"Wingtip Toys routes agent tool calls through Azure API Management to a pricing backend. When the backend returns repeated 5xx responses, API Management must stop sending requests to it for a defined period and return 503 Service Unavailable to callers so that the backend can recover.\n\nWhich feature should you configure?","choices":["A circuit breaker rule on the backend resource","A retry policy that wraps the forward-request policy","A rate-limit-by-key policy on the pricing API","A limit-concurrency policy around the backend call"],"answer":[0],"explanation":"The circuit breaker on a backend resource trips based on failure conditions (such as 5xx within an interval). Afterward, API Management sends no requests to the backend for a period and returns 503 to clients, so the backend can recover.","rationale":["Correct: exactly the behavior of the backend circuit breaker.","A retry sends extra requests to the failing backend.","rate-limit-by-key limits calls per key, regardless of the health of the backend.","limit-concurrency limits concurrent requests, but does not react to failure rates of the backend."],"ref":"https://learn.microsoft.com/azure/api-management/backends"},{"id":"2.3.3-04","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. builds an MCP server that exposes a tool named get_forecast. When the downstream weather API fails, the agent model must see what went wrong and whether a retry makes sense, and the conversation must continue.\n\nWhat should get_forecast return when the downstream API fails?","choices":["A tool result with isError set to true that describes the failure and gives retry advice","A JSON-RPC protocol error response that has an error code and a failure message","An empty text result so that the model can continue the conversation","An unhandled exception that the MCP client converts into a session error"],"answer":[0],"explanation":"MCP distinguishes protocol errors (unknown tool, invalid arguments) from tool execution errors such as a failing API. You report execution errors in the tool result with isError: true, so the model sees what went wrong. State what failed and whether retrying makes sense.","rationale":["Correct: an execution error belongs in the tool result with isError: true.","Protocol errors are for things such as an unknown tool or invalid arguments, not for a failing downstream API.","An empty result hides the error; the model may answer as if the call succeeded.","An unhandled exception can end the MCP session or the whole conversation; the model receives no usable result."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.3.3-05","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Relecloud builds an agent by using Microsoft Agent Framework for Python. When a dependency is down, the model calls the failing tool repeatedly within one request, which consumes tokens and the rate limit of the tool. You need automatic tool invocation to stop after 20 function calls or 30 seconds, after which the model must produce a final text response.\n\nWhat should you configure on the chat client?","choices":["max_function_calls and max_duration_seconds in function_invocation_configuration","allow_concurrent_invocation set to False in function_invocation_configuration","include_detailed_errors set to True in function_invocation_configuration","tool_choice set to required in the run options"],"answer":[0],"explanation":"With function_invocation_configuration, you set limits on automatic tool calls: max_iterations, max_function_calls, and max_duration_seconds. When a limit is reached, the client stops calling tools and asks the model for a final answer in text.","rationale":["Correct: limits the number of calls and the duration, and forces a final answer.","This only controls whether tools in a batch run concurrently or in sequence.","This adds exception text to the result and does not stop the loop; it can also leak sensitive data.","required forces tool calls and makes the loop worse."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools"},{"id":"2.3.3-06","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a tool named summarize_case that calls an Azure OpenAI deployment. The tool receives two kinds of errors: 429 responses that include a retry-after-ms header, and 400 responses that have the code content_filter. You need a retry strategy that protects throughput and avoids wasted tokens.\n\nWhat should you do?","choices":["Retry 429 responses after the retry-after-ms duration, and log and surface 400 content_filter responses without retrying them.","Retry both error types by using exponential backoff with jitter.","Retry 400 content_filter responses immediately, and fail over 429 responses to a second deployment without waiting.","Retry 429 responses at a fixed 1-second interval, and retry 400 content_filter responses once."],"answer":[0],"explanation":"A 429 with retry-after-ms is retryable: wait the indicated duration. A 400 with content_filter is not retryable, because the same content fails again deterministically; log it, report it to the caller, and stop. Blind retries on rejected content consume tokens and capacity.","rationale":["Correct: honor retry-after-ms for 429 and stop retrying on content_filter.","A content_filter error fails again on every retry and wastes tokens.","A content_filter retry fails again, and the retry-after-ms value of the 429 is ignored.","A fixed backoff replaces the exact retry-after-ms value, and the content_filter retry is pointless."],"ref":"https://learn.microsoft.com/azure/well-architected/design-guides/throttling"},{"id":"2.3.3-07","obj":"2.3.3","difficulty":"hard","type":"single","stem":"Adventure Works Cycles connects a Foundry Agent Service agent to a remote MCP server by using the MCP tool without streaming. A tool named generate_report takes three to four minutes to finish. Every call to generate_report fails after about 100 seconds, while other tools on the same server succeed. You must keep the report generation logic unchanged.\n\nWhat should you do?","choices":["Split generate_report into a start tool that returns a job ID and a status tool.","Increase the retry count in the agent so that it calls generate_report again after each failure.","Set require_approval to never for generate_report.","Change the MCP server transport from Streamable HTTP to SSE."],"answer":[0],"explanation":"Non-streaming MCP tool calls in Foundry Agent Service have a timeout of 100 seconds. Solutions are to run the agent in background mode with a supported model, optimize the server logic, or break the operation into smaller steps. Because the logic must remain the same, you split the operation into a start step and a status step.","rationale":["Correct: each step stays under the 100-second timeout without changing the report logic.","Each retry runs into the same timeout again and wastes capacity.","Approval has no effect on the timeout of the tool call.","Changing the transport does not remove the timeout; SSE is also the deprecated transport."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"2.3.3-08","obj":"2.3.3","difficulty":"hard","type":"multi","stem":"Woodgrove Bank has an agent that calls a third-party HTTP API through a function tool. Production traces show three problems:\n\n- The agent waits indefinitely when the API hangs.\n- After a 429 response, the model repeatedly decides to call the API again.\n- The model answers as if a failed call succeeded.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Set a timeout on the tool call and a time budget for the whole turn.","Handle 429 and 503 responses in the tool code, honor Retry-After, and cap the attempts.","Return failures to the model as clear results that state what failed and whether a retry makes sense.","Return the raw exception to the model so that the model decides when to retry.","Catch the error and return an empty string so that the conversation continues."],"answer":[0,1,2],"explanation":"A timeout per tool call and a budget per turn prevent the agent from hanging. Retries on 429/503 belong in the tool code, with Retry-After and a maximum, so the model does not have to decide itself. You return errors as a clear result, so the model does not hide the error.","rationale":["Correct: solves the endless waiting.","Correct: removes the retry decision from the model and respects backpressure.","Correct: the model sees that the call failed and does not answer as if it succeeded.","Then the model itself decides on retries, which is what causes the loop.","An empty result hides the error and lets the model answer as if the call succeeded."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.3.3-09","obj":"2.3.3","difficulty":"hard","type":"single","stem":"Northwind Traders uses the following function middleware in Microsoft Agent Framework for Python. When the inventory tool raises a TimeoutError, the user must receive a friendly message, the middleware must not call the tool again, and the run must continue.\n\n```python\nasync def exception_handling_middleware(\n    context: FunctionInvocationContext,\n    call_next: Callable[[], Awaitable[None]],\n) -> None:\n    try:\n        await call_next()\n    except TimeoutError:\n        <code>\n```\n\nWhich code should you use for <code>?","choices":["context.result = \"Inventory service timed out. Tell the user to try again later.\"","raise RuntimeError(\"Inventory service timed out. Tell the user to try again later.\")","context.result = await call_next()","return"],"answer":[0],"explanation":"In function middleware, you catch the exception and overwrite context.result with a user-friendly message. The model receives that as the tool result and the run continues, without the raw exception reaching the user.","rationale":["Correct: replaces the result with a fallback message without calling the tool again, and the run continues.","Raising a new exception lets the error propagate; the model does not receive a friendly message as the tool result.","This calls the failing tool again, which is explicitly not allowed; call_next also returns None.","Returning without a result gives the model no usable message for the user."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/exception-handling"},{"id":"2.3.4-01","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Trey Research has a Foundry Agent Service agent that calls a non-Microsoft OpenAPI tool that returns JSON. The agent uses values from the JSON to update records in an internal system. You need to follow the Foundry Agent Service best practices for handling the tool output.\n\nWhat should you do?","choices":["Validate the output against an expected schema, and require user approval before updates.","Pass the raw output directly to the update operation to reduce latency and token use.","Add an agent instruction that asks the model to confirm that the output looks correct.","Log the complete output, including any tokens it contains, to the trace for auditing."],"answer":[0],"explanation":"Treat tool output as untrusted input. Validate structured output against an expected schema, allow only known fields and operations, and ask for user approval for impactful actions.","rationale":["Correct: this is the documented best practice for tool output.","Using raw, unvalidated output for write actions is exactly the risk you want to avoid.","An instruction to the model is not deterministic and does not replace schema validation in code.","Secrets do not belong in traces or logs."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/tool-best-practice"},{"id":"2.3.4-02","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Proseware, Inc. reports that its Foundry Agent Service agent sometimes answers without using data from an attached tool. You need to confirm whether the agent called the tool and inspect the tool inputs and outputs for a specific conversation.\n\nWhat should you use?","choices":["Traces for the agent in Foundry","API Management logs for the connected AI gateway","Azure Monitor metrics for the model deployment","The version history of the agent"],"answer":[0],"explanation":"With traces in Foundry, you confirm whether the agent called a tool and review the inputs and outputs of that tool call. This is the documented way to validate tool calls per conversation.","rationale":["Correct: traces show per conversation whether a tool was called, with inputs and outputs.","API Management logs show only gateway traffic, not whether the model produced a tool call per conversation and with which inputs and outputs.","Metrics are aggregated and show no tool inputs and outputs per conversation.","The version history shows agent definitions, not runtime calls."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/tool-best-practice"},{"id":"2.3.4-03","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Lucerne Publishing builds an agent that uses a local MCP tool in Microsoft Agent Framework for Python. Some tool results contain both content and structuredContent. The model must receive structuredContent when it is present and receive content when structuredContent is absent.\n\nWhich tool_result_content value should you use?","choices":["structured_first","content_first","content_only","both"],"answer":[0],"explanation":"tool_result_content determines which value of an MCP result is visible to the model. structured_first (the default) uses structuredContent if present and otherwise falls back to content.","rationale":["Correct: structuredContent first, otherwise content.","content_first uses non-empty content and falls back to structuredContent only afterward.","content_only ignores structuredContent entirely.","both appends the serialized structuredContent after the content blocks, so the model sees both."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/local-mcp-tools"},{"id":"2.3.4-04","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Alpine Ski House defines a function tool by using the @tool decorator in Microsoft Agent Framework for Python. The tool returns a raw object from a lift status API. You need to convert each return value into a list of Content items before the model receives it. If the conversion fails during automatic function invocation, the model must receive a normal tool-error result instead of the raw value.\n\nWhat should you do?","choices":["Set result_parser on the @tool decorator.","Pass a Pydantic model to the schema parameter of the @tool decorator.","Declare the tool by using FunctionTool with func set to None.","Read the return value from the kwargs of the FunctionInvocationContext inside the tool."],"answer":[0],"explanation":"With result_parser on FunctionTool or @tool, you convert a raw return value to a string or a list of Content items. If the parser fails, automatic function invocation returns a normal tool error result; the raw value is not used as a fallback.","rationale":["Correct: result_parser converts the result and returns a tool error result on failures.","The schema argument describes the input of the tool, not the conversion of the result.","A declaration-only tool has no implementation; the application supplies the result itself.","kwargs contain runtime-only input values, not a converted tool result."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools"},{"id":"2.3.4-05","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Wide World Importers has an agent that uses four price lookup tools. Sometimes a tool returns a negative price or omits the currency. You need to check every price tool result in one place and replace an invalid result with a corrective message before the model uses the result.\n\nWhat should you implement?","choices":["Function middleware that awaits call_next and then validates and overrides context.result","Agent middleware that validates the final agent response after the run completes","An agent instruction that tells the model to ignore negative prices","A context provider that adds the pricing rules to the prompt"],"answer":[0],"explanation":"Function middleware intercepts every tool call. After await call_next(), the tool result is in context.result; you can validate it there centrally and replace it with a corrective message before the model uses it.","rationale":["Correct: central, deterministic validation of every tool result before the model sees it.","After the run ends, the model has already used the invalid result.","An instruction is not deterministic and does not catch a missing currency.","Rules in the prompt do not validate the actual tool results."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/exception-handling"},{"id":"2.3.4-06","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. has a normalizer agent that converts tool results into JSON for a downstream agent. The normalizer uses an Azure OpenAI deployment that supports structured outputs. The JSON must strictly match a schema, and the discount_percent value must be between 0 and 30.\n\nWhat should you do?","choices":["Use structured outputs with strict set to true, and check the discount_percent range in application code.","Use structured outputs with strict set to true, and add minimum and maximum keywords to the schema.","Use JSON mode, and add minimum and maximum keywords to the schema.","Use JSON mode, and add an instruction that keeps discount_percent between 0 and 30."],"answer":[0],"explanation":"Structured outputs with strict: true make the model follow a JSON Schema exactly, but only a subset of JSON Schema is supported: minimum and maximum for numbers are among the unsupported keywords. You therefore perform the range check deterministically in code. JSON mode guarantees only valid JSON, not schema conformance.","rationale":["Correct: strict schema conformance plus a deterministic range check in code.","minimum and maximum are not supported in strict structured outputs.","JSON mode does not guarantee schema conformance, and the keywords are not enforced.","JSON mode does not guarantee a schema, and an instruction does not enforce the range."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/structured-outputs"},{"id":"2.3.4-07","obj":"2.3.4","difficulty":"hard","type":"single","stem":"Tailspin Toys creates version 3 of a Foundry toolbox that several production agents use. Before you promote version 3 to the default version, you test it by using an MCP client. The initialize call returns HTTP 200, but tools/list returns an empty array.\n\nWhat should you do?","choices":["Keep the current default, and validate a corrected version against its version-specific endpoint.","Promote version 3 to the default version, and configure the agents to retry tools/list on failure.","Set allowed_tools on each agent to the tool names from version 2, and then promote version 3.","Set require_approval to never on the toolbox tools in version 3, and run tools/list again."],"answer":[0],"explanation":"Validate a toolbox version through the version-specific endpoint before you promote it to default. An empty tools/list means the version is not provisioned correctly. Leave the current default in place, create a corrected version, and validate that again.","rationale":["Correct: production stays on the working version, and the new version is validated first.","Promoting a version that is not properly provisioned breaks the production agents; retries still produce no tools.","allowed_tools filters existing tools and cannot add tools that the version lacks.","Approval settings do not determine whether tools are provisioned."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/toolbox"},{"id":"2.3.4-08","obj":"2.3.4","difficulty":"hard","type":"multi","stem":"Litware, Inc. uses an MCP client in a custom agent. A tool named shipment_status on a remote MCP server declares an output schema. Incidents show agent answers that are based on malformed tool data and on failed tool calls. You need to prevent the agent from basing answers on malformed or failed tool results.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Validate the structured result against the output schema of the tool before you pass the result to the model.","Check the isError field of each tool result, and tell the user what failed when the field is set.","Pass the text content block to the model and ignore the structured result.","Retry the tool call until the result passes validation, without a retry limit.","Ask the model to repair malformed results before it answers."],"answer":[0,1],"explanation":"Validate tool results before you give them to the model; if the tool has an output schema, validate the structured result against it. Also check isError: an answer based on a failed tool call must report that to the user.","rationale":["Correct: schema validation keeps malformed data out of the context of the model.","Correct: isError signals an execution error; the user should know what did not work.","Ignoring the text bypasses the schema check.","Unbounded retries consume tokens and rate limits; retries must have a maximum.","Letting the model repair it is not deterministic and can invent data."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.3.4-09","obj":"2.3.4","difficulty":"hard","type":"single","stem":"Coho Winery adds the following function middleware in Microsoft Agent Framework for Python. The middleware must run the get_stock tool and then replace an empty result with a corrective message.\n\n```python\nasync def check_stock_result(\n    context: FunctionInvocationContext,\n    call_next: Callable[[], Awaitable[None]],\n) -> None:\n    <code>\n    if context.function.name == \"get_stock\" and not context.result:\n        context.result = \"Error: get_stock returned no data. Tell the user that the stock level is unavailable.\"\n```\n\nWhich code should you use for <code>?","choices":["await call_next()","context.result = await call_next()","call_next()","return"],"answer":[0],"explanation":"call_next takes no arguments and returns nothing; middleware mutates the shared context object and then awaits call_next(). Only after await call_next() has the tool run and the result is in context.result, so you can validate and replace it.","rationale":["Correct: runs the tool and fills context.result, after which the validation follows.","call_next returns None, so context.result is overwritten and the real result is lost.","Without await, the coroutine does not run and the tool is not executed.","Return ends the middleware before the tool runs and before any validation."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.1-01","obj":"2.4.1","difficulty":"easy","type":"single","stem":"Litware, Inc. builds a contract generation solution. A template agent selects a base template, a clause agent customizes the clauses, a compliance agent reviews the result against regulations, and a risk agent rates the final contract. Each agent requires the complete output of the previous agent, and the order of the agents is fixed.\n\nWhich orchestration pattern should you implement?","choices":["Sequential orchestration","Concurrent orchestration","Handoff orchestration","Group chat orchestration"],"answer":[0],"explanation":"Sequential orchestration (pipeline) chains agents in a predefined, linear order in which each agent processes the output of the previous one. The fixed order and the dependency on the complete previous output are the deciding constraints.","rationale":["Correct: a fixed, linear pipeline in which each step builds on the previous one is exactly sequential orchestration.","Incorrect: concurrent orchestration lets agents work independently and simultaneously on the same input; here the steps depend on each other.","Incorrect: handoff is intended for situations in which the right agent only becomes clear during processing; here the order is fixed.","Incorrect: group chat is for discussion and consensus in a shared thread, not for a deterministic pipeline."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.1-02","obj":"2.4.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank needs four specialist agents to analyze the same stock ticker: fundamental, technical, sentiment, and ESG analysis. The agents do not depend on each other's output, and the combined recommendation must be returned with the lowest possible latency.\n\nWhich orchestration pattern should you implement?","choices":["Concurrent orchestration that fans out the ticker and aggregates the results","Sequential orchestration that passes the ticker through each agent in turn","Handoff orchestration that starts with the fundamental analysis agent","Magentic orchestration that builds a task ledger before invoking the agents"],"answer":[0],"explanation":"Concurrent orchestration (parallel, fan-out/fan-in) lets agents perform the same task simultaneously from their own specialization and combines the results. Independent analyses plus the latency requirement make parallel execution the right choice.","rationale":["Correct: independent perspectives on the same input, executed in parallel and then aggregated, reduce the total turnaround time.","Incorrect: running sequentially adds up the latency of all agents even though there are no dependencies.","Incorrect: with handoff only one agent is active at a time; that does not fit four simultaneous analyses.","Incorrect: magentic is intended for open-ended problems without a known plan and is slow to converge."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.1-03","obj":"2.4.1","difficulty":"easy","type":"single","stem":"Tailspin Toys builds a customer support solution by using Microsoft Agent Framework. A triage agent, a refund agent, an order agent, and a return agent must be able to transfer the conversation directly to one another without a central orchestrator. The agent that receives the conversation must take full ownership of the task.\n\nWhich Agent Framework orchestration should you use?","choices":["Handoff orchestration","Magentic orchestration","Sequential orchestration","Concurrent orchestration"],"answer":[0],"explanation":"Handoff orchestration in Agent Framework internally uses a mesh topology (peer-to-peer) in which agents are connected directly to each other without an orchestrator. The receiving agent gets full control and ownership of the task.","rationale":["Correct: handoff fully transfers control between equal agents in a mesh, without a central authority.","Incorrect: magentic uses a central manager agent that assigns tasks and maintains a ledger.","Incorrect: sequential uses a fixed order; agents cannot decide for themselves whom to pass work to.","Incorrect: concurrent lets agents work in parallel and does not transfer ownership between agents."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.1-04","obj":"2.4.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. builds a research assistant by using Microsoft Agent Framework. A coordinator agent must delegate subtasks to a pricing agent and a legal agent, receive their results, and then compose the final answer itself. The coordinator must retain overall responsibility for the task and pass only the relevant context to each specialist.\n\nWhat should you do?","choices":["Expose each specialist agent as a tool of the coordinator agent","Build a handoff workflow that starts with the coordinator agent","Build a concurrent workflow that uses the default aggregator","Build a group chat workflow that uses a round-robin manager"],"answer":[0],"explanation":"With agent-as-tools (orchestrator-subagent), a primary agent delegates subtasks to other agents and control then returns to the primary agent, which keeps ownership and decides for itself which context it passes along. This differs fundamentally from handoff, where the receiver takes over ownership.","rationale":["Correct: agent-as-tools keeps the coordinator responsible, control returns, and only relevant context goes to the subagent.","Incorrect: with handoff the receiving agent fully takes over the task and receives the complete context; the coordinator loses ownership.","Incorrect: concurrent sends the same input to all agents and does not allow targeted, context-dependent delegation.","Incorrect: group chat shares an accumulating thread with all participants instead of selective context per specialist."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.1-05","obj":"2.4.1","difficulty":"medium","type":"single","stem":"Relecloud uses a hub-and-spoke design in which an employee self-service hub agent routes requests to an HR agent, an IT agent, and a procurement agent. A team proposes that the HR agent should route to a new benefits enrollment agent, which in turn routes to a claims agent. Benefits enrollment requires its own routing logic and instructions that are distinct from general HR. You must minimize latency and context loss.\n\nWhat should you do?","choices":["Connect the benefits enrollment agent directly to the hub as a peer of the HR agent","Connect the benefits enrollment agent to the HR agent and the claims agent to the benefits enrollment agent","Add the benefits enrollment topics and knowledge to the existing HR agent","Replace the hub with a concurrent orchestration that sends every request to every agent"],"answer":[0],"explanation":"In a hub-and-spoke architecture, it is recommended not to go deeper than two levels, because each layer adds latency, context loss, and routing confusion. Because benefits enrollment has its own routing logic and instructions, it belongs as a separate connected agent directly on the hub.","rationale":["Correct: an extra spoke at hub level keeps the architecture flat and gives the domain its own instructions and routing.","Incorrect: three or more levels of nesting increase latency, make debugging harder, and degrade context.","Incorrect: extending the existing agent fits closely related scenarios with shared context, not a domain with its own routing logic.","Incorrect: sending every request to all agents wastes resources and does not solve the routing problem."],"ref":"https://learn.microsoft.com/microsoft-365/copilot/employee-self-service/connecting-agents-overview"},{"id":"2.4.1-06","obj":"2.4.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. runs a sequential orchestration of four agents that transform insurance claims. The stages have strict dependencies, so the order must be kept. Occasionally the first agent returns malformed or off-topic output, and the later agents process it and produce incorrect results.\n\nWhat should you do?","choices":["Validate each agent output before it is passed to the next agent, and retry or halt the workflow when validation fails","Convert the workflow to a concurrent orchestration so that every agent receives the original claim","Increase the context window of the later agents so that they can detect the error themselves","Add a fifth agent at the end of the pipeline that rewrites the final result"],"answer":[0],"explanation":"In sequential orchestration, errors from early steps propagate to later steps. The guideline is to validate agent output before it goes to the next agent and, if quality is low, to retry, ask for clarification, or stop the workflow.","rationale":["Correct: validation between steps prevents bad input from cascading through the pipeline, while the required order is preserved.","Incorrect: concurrent orchestration breaks the dependencies between the steps, while the order must be preserved.","Incorrect: a larger context window does not detect faulty input; the problem keeps flowing through.","Incorrect: an extra agent at the end corrects symptoms only after faulty intermediate results have already been processed."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.1-07","obj":"2.4.1","difficulty":"hard","type":"multi","stem":"Northwind Traders implements a peer-to-peer support solution by using the Agent Framework HandoffBuilder in Python. Users report that conversations bounce repeatedly between the order agent and the return agent before a response is produced. Each agent must still be able to transfer control dynamically, and only one agent can be active at a time.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Configure explicit handoff rules by using add_handoff so that the specialist agents can hand off only to the triage agent","Define a termination condition for the handoff workflow","Enable autonomous mode for every participant","Share a single AgentSession instance across all participants","Replace the handoff workflow with a concurrent workflow"],"answer":[0,1],"explanation":"Handoff is prone to infinite handoff loops. With add_handoff you restrict which agents may pass work to whom, and a termination condition ends the workflow when the conversation reaches a certain state; both preserve dynamic routing with one active agent.","rationale":["Correct: explicit handoff rules restrict the routes and prevent bouncing back and forth between specialists.","Correct: a termination condition stops the workflow as soon as an end condition is met.","Incorrect: autonomous mode lets agents continue without user input and actually increases the chance of long-running loops.","Incorrect: in handoff, agents deliberately do not share a session instance; context is synchronized by broadcasting messages.","Incorrect: concurrent lets multiple agents work simultaneously, while only one agent may be active."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.1-08","obj":"2.4.1","difficulty":"hard","type":"single","stem":"Adventure Works Cycles uses an Agent Framework handoff workflow in which a triage agent routes questions to a parts agent and a warranty agent. A new requirement states that the triage agent must combine the results of one or both specialists into a single final answer in the same turn, and it must remain the owner of the conversation. The specialists to call must still be selected dynamically per request.\n\nWhat should you do?","choices":["Expose the parts agent and the warranty agent as tools of the triage agent","Call enable_return_to_previous(False) on the handoff builder","Enable autonomous mode for the triage agent","Replace the handoff workflow with a sequential workflow that runs every specialist"],"answer":[0],"explanation":"With handoff, ownership transfers fully to the receiving agent, so the triage agent cannot compose the final answer itself. With agent-as-tools, the primary agent keeps responsibility, dynamically chooses which subagents it calls, and control returns to it after each subtask.","rationale":["Correct: agent-as-tools lets the triage agent dynamically call specialists and formulate the combined answer itself.","Incorrect: this only routes user replies through the starting agent first; the specialist remains the owner of its answer.","Incorrect: autonomous mode lets an agent continue without user input, but does not change the ownership model of handoff.","Incorrect: a sequential workflow always calls all specialists in a fixed order, while the selection must remain dynamic."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.1-09","obj":"2.4.1","difficulty":"hard","type":"single","stem":"Lucerne Publishing designs a document generation solution. A template must be selected first, and grounded content must then be generated from that template. After generation, five independent compliance checks must run, and their findings must be combined before a final formatting agent runs. The checks write to separate data stores, and you must minimize end-to-end latency.\n\nWhich orchestration design should you implement?","choices":["A sequential pipeline in which the compliance stage fans out to five parallel agents and fans in before the formatting agent","A single concurrent orchestration that runs the template, generation, compliance, and formatting agents in parallel","A handoff orchestration in which each agent decides which agent runs next","A group chat orchestration in which a chat manager selects the next speaker"],"answer":[0],"explanation":"Different phases of a workload can need different patterns; you combine them instead of forcing everything into one pattern. The dependent steps remain sequential, while the independent compliance checks without shared state run in parallel to reduce latency.","rationale":["Correct: sequential where there are dependencies and fan-out/fan-in for the independent checks combines correctness with low latency.","Incorrect: running everything in parallel ignores that generation depends on the template and formatting depends on the findings.","Incorrect: handoff makes routing unpredictable while the order here is deterministic, and only one agent is active at a time.","Incorrect: group chat adds discussion overhead and is not suitable for deterministic pipelines with parallel steps."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.2-01","obj":"2.4.2","difficulty":"easy","type":"single","stem":"Wide World Importers builds a returns agent by using Microsoft Agent Framework in Python. The agent has a process_refund function tool. A human operator must approve every call to process_refund before the function runs.\n\nWhat should you do?","choices":["Decorate the function with @tool(approval_mode=\"always_require\")","Add an instruction to the agent prompt that asks the user to confirm each refund","Set include_detailed_errors to True on the function invocation configuration","Register function middleware that logs each refund call"],"answer":[0],"explanation":"In Agent Framework, you mark a tool with approval_mode=\"always_require\"; the workflow then pauses and emits a request_info event with a function_approval_request that a human approves or rejects. A prompt instruction alone does not enforce approval.","rationale":["Correct: approval_mode always_require makes the framework pause the tool call until there is explicit approval.","Incorrect: a prompt instruction is not enforceable; the model can still call the tool.","Incorrect: include_detailed_errors only determines how much error detail goes to the model.","Incorrect: logging records the call but does not block it until approval."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/sequential"},{"id":"2.4.2-02","obj":"2.4.2","difficulty":"easy","type":"single","stem":"Trey Research connects a Foundry Agent Service agent to a remote MCP server that exposes get_ticket, search_tickets, update_ticket, and close_ticket. The read operations get_ticket and search_tickets must run without approval. The write operations must require developer approval for each call.\n\nWhich value should you configure for the require_approval property of the mcp tool?","choices":["{\"never\": [\"get_ticket\", \"search_tickets\"]}","\"never\"","{\"never\": [\"update_ticket\", \"close_ticket\"]}","Omit require_approval and set allowed_tools to [\"update_ticket\", \"close_ticket\"]"],"answer":[0],"explanation":"require_approval accepts an object with a list of tools that do not need approval; all other tools then require approval. This way the read operations run immediately and the write operations require approval per call.","rationale":["Correct: the read tools are in the never list, so only the write tools produce an mcp_approval_request.","Incorrect: \"never\" disables approval for all tools, including the write operations.","Incorrect: this list reverses the logic and lets the write operations run without approval.","Incorrect: allowed_tools restricts which tools the agent may use; the read tools would then no longer be available at all."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"2.4.2-03","obj":"2.4.2","difficulty":"easy","type":"single","stem":"Margie's Travel uses a Magentic orchestration in Microsoft Agent Framework to plan complex itineraries. Agents in the workflow can book hotels and flights. A travel consultant must review and approve or revise the plan that the manager agent creates before any agent executes tasks.\n\nWhat should you configure?","choices":["Plan review on the Magentic workflow","Tool approval on each booking tool","A max_reset_count value of 0","Intermediate outputs from every participant"],"answer":[0],"explanation":"Magentic offers optional human-in-the-loop plan review: the manager creates a plan and a human can approve or modify it before the agents execute it. This is the right approval point when the entire plan must be reviewed.","rationale":["Correct: plan review pauses after the planning phase so a human can approve or revise the plan.","Incorrect: tool approval approves individual tool calls during execution, not the plan up front.","Incorrect: max_reset_count limits the number of replans and does not add human review.","Incorrect: intermediate outputs make contributions visible but do not let anyone approve the plan."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/magentic"},{"id":"2.4.2-04","obj":"2.4.2","difficulty":"medium","type":"single","stem":"Lamna Healthcare Company runs an Agent Framework workflow that pauses for a manager to approve high-cost procedures. Approvals can arrive several days later, and the host process is restarted nightly. The workflow must resume with the pending approval request intact and without repeating completed agent work.\n\nWhat should you do?","choices":["Configure checkpoint storage, restore the latest checkpoint, and respond to the re-emitted request","Keep the workflow process running and hold the pending request in memory","Rerun the workflow from the beginning with the original input after the approval arrives","Store the approval decision in the agent instructions before the next run"],"answer":[0],"explanation":"With a checkpoint, pending requests are saved along with it. After a checkpoint is restored, they are re-emitted as request events, so you can answer them and the workflow continues without redoing earlier work.","rationale":["Correct: checkpoints preserve the pending request and the progress, which makes resuming after a restart possible.","Incorrect: in-memory state is lost during the nightly restart.","Incorrect: starting over repeats the agent work that was already completed, which is explicitly not allowed.","Incorrect: instructions are not a mechanism for answering a pending workflow request."],"ref":"https://learn.microsoft.com/agent-framework/workflows/human-in-the-loop"},{"id":"2.4.2-05","obj":"2.4.2","difficulty":"medium","type":"single","stem":"Lucerne Publishing builds a Python multi-agent solution by using Microsoft Agent Framework. An intake agent must collect missing manuscript details from an author over several back-and-forth turns, rather than only having the author approve or reject an action. When the details are complete, the intake agent must route the request to either an editing agent or a rights agent.\n\nWhich orchestration should you use?","choices":["Handoff orchestration","Sequential orchestration with an approval-required tool","Concurrent orchestration","Magentic orchestration with plan review"],"answer":[0],"explanation":"For interactive scenarios in which an agent must gather more information from the user and iterate before it proceeds, Microsoft recommends handoff orchestration. Handoff is interactive by default: when an agent responds without handing off, control returns to the user for the next input, and the agent can later hand off to a specialist.","rationale":["Correct: handoff supports multi-turn input from the user and routing to the editing or rights agent.","Incorrect: tool approval only lets a human approve or reject a tool call; sequential orchestration does not pause for free-form input on its own.","Incorrect: concurrent

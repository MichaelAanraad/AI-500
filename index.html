"Fout: de trigger gaat al af; het probleem is dat geen groep in het invoerbudget past.","Fout: het budget van 8.000 tokens wordt door de strategie zelf toegepast, los van het context window van het summarizer-model."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-10","obj":"3.2.2","difficulty":"hard","type":"multi","stem":"Lamna Healthcare Company has a clinical knowledge agent that queries an Azure AI Search index with vector queries only. Clinicians search for drug codes, dates, and physician names, and the agent often misses exact matches. The team also wants the most relevant passages ranked at the top before they are passed to the model.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Send hybrid queries that include both the search parameter and vectorQueries.","Apply semantic ranking to the hybrid results and set k to at least 50.","Increase the dimensions of the document embeddings and keep the current query embeddings.","Switch the vector field from HNSW to exhaustive KNN.","Lower the vector similarity threshold to return more vector matches."],"answer":[0,1],"explanation":"Hybrid search vangt exacte matches op codes, datums en namen via full-text en combineert die met vector search via RRF. Semantic ranking verbetert daarna de volgorde; Microsoft adviseert k op minimaal 50 te zetten zodat de ranker genoeg input heeft.","rationale":["Juist: een hybrid query met search en vectorQueries voegt keyword-precisie toe voor exacte identifiers.","Juist: semantic ranking herordent de beste passages; met k van minstens 50 krijgt de ranker voldoende documenten.","Fout: alleen de documentvectoren wijzigen breekt de vergelijking met queryvectoren en lost exacte matches niet op.","Fout: exhaustive KNN maakt nearest-neighbor zoeken exacter, maar blijft semantisch en mist exacte codes.","Fout: meer vector matches toelaten geeft meer semantische ruis, geen exacte matches."],"ref":"https://learn.microsoft.com/azure/search/hybrid-search-how-to-query#troubleshoot-hybrid-queries"},{"id":"3.2.2-11","obj":"3.2.2","difficulty":"hard","type":"single","stem":"Alpine Ski House uses a TokenBudgetComposedStrategy in Python for an agent with a 16,000-token budget. You must apply compaction from the least aggressive to the most aggressive strategy so that context is lost only when gentler steps fail to meet the budget.\n\nYou plan to include the following strategies:\n\n1. SlidingWindowStrategy(keep_last_groups=20)\n2. ToolResultCompactionStrategy(keep_last_tool_call_groups=1)\n3. SummarizationStrategy(client=summarizer_client, target_count=4, threshold=2)\n\nWhich order should you use in the strategies list?","choices":["2, 3, 1","1, 3, 2","3, 2, 1","2, 1, 3"],"answer":[0],"explanation":"Strategieen in een TokenBudgetComposedStrategy draaien op volgorde; zet de mildste eerst. Eerst tool results inklappen, dan oudere delen samenvatten, dan pas een sliding window. Een ingebouwde fallback verwijdert de oudste groepen als het budget nog niet gehaald wordt.","rationale":["Juist: van mild (tool results) via gemiddeld (summarization) naar agressief (sliding window).","Fout: een sliding window als eerste stap laat direct volledige context vallen.","Fout: samenvatten voordat tool output is ingeklapt kost een onnodige LLM-call en vat verbose tool output mee samen.","Fout: het sliding window voor summarization laat context vallen die de samenvatting had kunnen behouden."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-12","obj":"3.2.2","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines creates a Python harness agent for long-running tool loops by using the following code.\n\n```python\nagent = create_harness_agent(\n    client,\n    max_context_window_tokens=128_000,\n)\n```\n\nDuring long runs, the requests exceed the model context window, and no compaction is observed. You must enable the default context-window compaction with the least configuration.\n\nWhat should you do?","choices":["Add the max_output_tokens parameter to the create_harness_agent call.","Add the disable_compaction parameter set to True.","Lower max_context_window_tokens to 64_000.","Pass a custom history_provider to the create_harness_agent call."],"answer":[0],"explanation":"Bij de harness agent staat compaction standaard uit, tenzij zowel max_context_window_tokens als max_output_tokens zijn ingesteld (of een eigen strategie is opgegeven). Met beide parameters maakt de harness een standaard ContextWindowCompactionStrategy die voor elke model-call in de tool-loop draait.","rationale":["Juist: max_output_tokens ontbreekt; met beide token-instellingen wordt de standaardcompaction ingeschakeld.","Fout: disable_compaction=True schakelt compaction juist volledig uit.","Fout: alleen deze waarde aanpassen schakelt compaction niet in, omdat max_output_tokens nog steeds ontbreekt.","Fout: een andere history provider bepaalt waar history wordt opgeslagen, niet of compaction actief is."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.3-01","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Southridge Video is building a new support agent in Microsoft Foundry. The agent has not been released, so no production traces exist. You must create an evaluation dataset of question-and-answer pairs based on the agent instructions and a policy document.\n\nWhat should you use?","choices":["Synthetic data generation with the Simple QnA task type","Conversion of agent traces into an evaluation dataset","Continuous evaluation on live traffic","Evaluation of interactions by response ID"],"answer":[0],"explanation":"Zonder productieverkeer kun je in Foundry synthetische evaluatiedata genereren op basis van agentinstructies, een prompt en een referentiebestand. Simple QnA levert vraag-antwoordparen voor turn-level evaluatie.","rationale":["Juist: synthetic data generation is bedoeld voor de fase voor de lancering en kan worden gegrond met een referentiebestand.","Fout: trace-conversie vereist bestaande productietraces, die er nog niet zijn.","Fout: continuous evaluation sampelt live verkeer; dat is er nog niet.","Fout: evaluatie per response ID vereist bestaande agent-responses."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/evaluation-dataset-synthetic"},{"id":"3.2.3-02","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Coho Winery wants an LLM judge to check whether each response of its sommelier agent uses a respectful, on-brand tone. The check must return a pass or fail result together with a reason, and it must be defined by a judge prompt that you write. You need to add the check to the evaluator catalog of the Foundry project.\n\nWhich type of evaluator should you create?","choices":["A prompt-based custom evaluator that uses binary scoring","A code-based custom evaluator that uses a grade() function","An endpoint-based custom evaluator hosted on your own service","A human evaluation template with a yes or no question"],"answer":[0],"explanation":"Een prompt-based custom evaluator gebruikt een judge prompt waarmee een LLM elk item beoordeelt; dat past bij subjectieve oordelen zoals toon. Met binary scoring retourneert de evaluator een JSON-object met result (true of false) en reason.","rationale":["Juist: een prompt-based evaluator is een LLM-as-a-judge met je eigen judge prompt, en binary scoring levert pass of fail met een reden.","Een code-based evaluator scoort met deterministische Python-logica en is bedoeld voor regels zoals formaat of lengte, niet voor een LLM-oordeel over toon.","Een endpoint-based evaluator is voor scoring op eigen infrastructuur; de eis is juist een judge prompt in de catalog.","Een human evaluation template laat mensen beoordelen in plaats van een LLM judge."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/custom-evaluators"},{"id":"3.2.3-03","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Lucerne Publishing wants an LLM judge to score its editorial agent against custom, weighted criteria such as house style, citation accuracy, and tone, with a reason for each criterion.\n\nWhich evaluator type should you use?","choices":["Rubric evaluator","Code-based custom evaluator","BLEU evaluator","F1 Score evaluator"],"answer":[0],"explanation":"Een rubric evaluator laat een LLM-judge een response scoren tegen eigen, gewogen dimensies, elk met een score en een reden. Het totaal is een gewogen gemiddelde genormaliseerd naar 0-1.","rationale":["Juist: rubric evaluators combineren eigen gewogen criteria met LLM-as-a-judge-scoring.","Fout: code-based evaluators gebruiken deterministische Python-logica, niet geschikt voor subjectieve criteria zoals toon.","Fout: BLEU meet n-gram-overlap met een ground truth, geen stijl of toon.","Fout: F1 meet tokenoverlap met een ground truth en ondersteunt geen gewogen criteria."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rubric-evaluators"},{"id":"3.2.3-04","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. wants to improve the instructions of a prompt agent automatically. The solution must evaluate the current version against a dataset, generate alternative instructions, score each alternative against the same dataset, and recommend the best one.\n\nWhich Foundry capability should you use?","choices":["Agent optimizer","Prompt Optimizer in the playground","Cluster analysis","Scheduled evaluation"],"answer":[0],"explanation":"De agent optimizer draait een gesloten lus: baseline evalueren, kandidaten genereren, kandidaten op dezelfde dataset evalueren en rangschikken. Dat is een semantic optimization loop gedreven door evaluaties.","rationale":["Juist: de agent optimizer genereert en scoort kandidaatconfiguraties tegen een dataset en markeert de beste.","Fout: Prompt Optimizer herschrijft instructies op basis van best practices, maar scoort ze niet tegen een dataset.","Fout: cluster analysis helpt foutpatronen te vinden, maar genereert geen nieuwe instructies.","Fout: scheduled evaluation meet kwaliteit op een vast schema, maar genereert geen verbeteringen."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-optimizer-overview#how-the-agent-optimizer-works"},{"id":"3.2.3-05","obj":"3.2.3","difficulty":"medium","type":"single","stem":"Tailspin Toys runs nightly evaluations of an order-extraction agent. One check must verify that each response is valid JSON and stays under 500 characters. The check must produce deterministic results, must not incur model inference costs, and must not require you to host additional infrastructure.\n\nWhich evaluator type should you create?","choices":["Code-based custom evaluator","Prompt-based custom evaluator","Rubric evaluator","Endpoint-based custom evaluator"],"answer":[0],"explanation":"Een code-based evaluator is een Python grade()-functie met deterministische logica, geschikt voor format- en lengtecontroles. Er wordt geen LLM-judge aangeroepen, dus geen inferentiekosten per item.","rationale":["Juist: code-based evaluators zijn bedoeld voor regelgebaseerde checks zoals formaatvalidatie en lengtelimieten.","Fout: een prompt-based evaluator gebruikt een LLM-judge en is niet deterministisch of gratis.","Fout: rubric evaluators gebruiken een LLM-judge en kosten inferentie per evaluatie.","Fout: endpoint-based evaluators vereisen eigen gehoste infrastructuur, wat de stam uitsluit."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/custom-evaluators"},{"id":"3.2.3-06","obj":"3.2.3","difficulty":"medium","type":"single","stem":"Trey Research wants to fine-tune a model so that its procurement agent calls the purchasing APIs of the company more reliably. No production conversations exist yet. The only available source is a JSON file that contains an OpenAPI 3.1 specification of the purchasing APIs. You need to generate multi-turn training conversations that include tool calls by using the synthetic data generation feature in Microsoft Foundry.\n\nWhich generator should you use?","choices":["Tool use, with the OpenAPI specification as the reference file","Simple Q&A, with the OpenAPI specification as the reference file","Simulation seed (multi-turn), to create an evaluation dataset","Trace-to-dataset conversion of the agent traces"],"answer":[0],"explanation":"De synthetic data generator Tool use simuleert multi-turn gesprekken met tool calls over je API-oppervlak en gebruikt een OpenAPI 3.0.x- of 3.1.x-specificatie in JSON als reference file. De output is bedoeld als trainingsdata voor fine-tuning, wat precies past bij betrouwbaarder tool-gebruik.","rationale":["Juist: Tool use maakt multi-turn trainingsgesprekken met tool calls op basis van een OpenAPI-specificatie.","Simple Q&A maakt vraag-antwoordparen uit een domeindocument, zonder tool calls.","Simulation seed maakt scenariobeschrijvingen voor conversatiesimulatie in een evaluatie, geen trainingsdata voor fine-tuning.","Trace-to-dataset vereist productie-traces, en die zijn er nog niet."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/data-generation"},{"id":"3.2.3-07","obj":"3.2.3","difficulty":"medium","type":"single","stem":"A. Datum Corporation has deployed a claims agent to production. You must score agent responses with Task Adherence and a rubric evaluator automatically as live traffic occurs, with sampling to control evaluation cost.\n\nWhat should you configure?","choices":["A continuous evaluation that samples live traffic","A scheduled evaluation against a golden dataset","An evaluation quality gate in a GitHub Actions workflow","An AI red teaming scan on a fixed schedule"],"answer":[0],"explanation":"Continuous evaluation sampelt live verkeer terwijl het optreedt (bijvoorbeeld random of intelligent sampling) en draait de gekozen evaluators automatisch. Zo vang je kwaliteitsregressies in productie direct op.","rationale":["Juist: continuous evaluation draait evaluators op gesampled live verkeer.","Fout: scheduled evaluation draait op een vast schema, vaak op een vaste dataset, niet op verkeer zodra het binnenkomt.","Fout: een CI/CD-gate evalueert voor deployment, niet het live productieverkeer.","Fout: red teaming test veiligheidsrisico's, geen taakkwaliteit op live verkeer."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard#set-up-continuous-evaluation"},{"id":"3.2.3-08","obj":"3.2.3","difficulty":"medium","type":"single","stem":"Woodgrove Bank auto-generates a rubric evaluator for its loan advisory agent. Before the rubric is used in continuous evaluation at scale, the team must confirm that the LLM judge distinguishes acceptable from unacceptable responses in the same way that the domain experts do.\n\nWhat should you do first?","choices":["Validate the rubric on a small sample against expert scores and refine the dimensions.","Lower the pass threshold of the rubric to 0.0 so that fewer responses fail.","Set always_applicable to true for every criterion in the rubric.","Enable continuous evaluation now and review the scores after one month."],"answer":[0],"explanation":"Microsoft adviseert de rubric eerst op een kleine sample te valideren en te controleren of de scores overeenkomen met je eigen oordeel. Precieze beschrijvingen en gewichten verbeteren de consistentie van de LLM-judge.","rationale":["Juist: valideren op een sample en itereren op beschrijvingen en gewichten kalibreert de judge voor opschaling.","Fout: een drempel van 0.0 laat alles slagen en maakt de evaluator zinloos.","Fout: elk criterium altijd scoren negeert relevantie en maakt de scores niet beter afgestemd op experts.","Fout: opschalen voor validatie levert een maand onbetrouwbare kwaliteitssignalen op."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rubric-evaluators#review-and-adjust-the-rubric"},{"id":"3.2.3-09","obj":"3.2.3","difficulty":"hard","type":"single","stem":"Contoso, Ltd. plans to run the agent optimizer on a hosted agent that calls a payment API and a CRM API that writes customer records. The evaluation dataset contains 500 tasks, and the optimizer will test four candidates. The team must avoid charges and state changes in production systems during optimization.\n\nWhat should you do before you start the optimization run?","choices":["Point the tools to test endpoints or mock them for the optimization run.","Reduce the number of candidates that the optimizer generates to one.","Disable the tool optimization target for the optimization run.","Set the evaluation model to a smaller model deployment."],"answer":[0],"explanation":"De optimizer roept de agent aan voor elke taak in de dataset, voor de baseline en elke kandidaat. Externe tool calls worden dan echt uitgevoerd. Microsoft adviseert testendpoints of gemockte tools om kosten, statewijzigingen en rate limiting te voorkomen.","rationale":["Juist: met testendpoints of mocks voeren evaluatieruns geen echte betalingen of schrijfacties uit.","Fout: minder kandidaten vermindert het aantal calls, maar baseline en kandidaat roepen nog steeds de productie-API's aan.","Fout: zonder tool optimization worden alleen de tooldescripties niet aangepast; de agent roept tijdens elke evaluatierun nog steeds de echte API's aan.","Fout: het evaluatiemodel scoort alleen responses; de agent roept de tools nog steeds aan."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-optimizer-overview#how-the-agent-optimizer-works"},{"id":"3.2.3-10","obj":"3.2.3","difficulty":"hard","type":"multi","stem":"Northwind Traders runs a trace-to-dataset job each week to refresh the regression dataset of its pricing agent. Three requirements apply. The dataset must contain a representative subset without near-duplicate prompts. Only spans from the current agent version must be used. New rows must be combined with the latest existing dataset version.\n\nWhich three settings should you configure in the data generation job? Each correct answer presents part of the solution.","choices":["Set agent_version to the current version.","Set max_samples to enable intelligent sampling.","Set write_mode to MERGE.","Omit max_samples to process every matching trace.","Set redact_private_content to false."],"answer":[0,1,2],"explanation":"Zonder agent_version mengt de job spans van alle actieve versies. Met max_samples wordt intelligent sampling gebruikt, dat low-intent traces filtert en via MinHash een diverse subset kiest. MERGE combineert nieuwe rijen met de laatste datasetversie en ontdubbelt trace-rijen.","rationale":["Juist: agent_version vastpinnen voorkomt dat oude versies het evaluatiesignaal vervuilen.","Juist: max_samples activeert intelligent sampling voor een representatieve, ontdubbelde subset.","Juist: MERGE voegt nieuwe rijen samen met de laatste versie in plaats van alleen nieuwe rijen te schrijven.","Fout: zonder max_samples is sampling uit en krijg je ook bijna-identieke prompts.","Fout: redactie uitschakelen helpt geen enkele eis en is alleen toegestaan als privacyregels dat toelaten."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/traces-to-dataset#best-practices"},{"id":"3.2.3-11","obj":"3.2.3","difficulty":"hard","type":"single","stem":"Proseware, Inc. sets up an evaluation-driven optimization loop for a prompt agent by using the agent optimizer.\n\nThe loop includes the following actions:\n\n1. Generate candidate configurations such as rewritten instructions and improved tool descriptions.\n2. Score the baseline agent version against the evaluation dataset.\n3. Rank the candidates by composite score and promote the best one to a new agent version.\n4. Score each candidate against the same evaluation dataset.\n\nWhich sequence of actions should the loop follow?","choices":["2, 1, 4, 3","1, 2, 4, 3","1, 4, 2, 3","2, 4, 1, 3"],"answer":[0],"explanation":"De optimizer evalueert eerst de baseline, genereert daarna kandidaten, test elke kandidaat op dezelfde dataset en rangschikt ze op composite score. De beste kandidaat promoot je naar een nieuwe versie.","rationale":["Juist: baseline, kandidaten genereren, kandidaten scoren, rangschikken en promoten.","Fout: zonder baseline-evaluatie eerst is de vergelijking met de huidige agent niet het startpunt van de lus; de optimizer begint met de baseline.","Fout: kandidaten scoren voordat de baseline bekend is, keert de lus om en levert geen referentie voor de vergelijking.","Fout: kandidaten kunnen niet gescoord worden voordat ze gegenereerd zijn."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-optimizer-overview#how-the-agent-optimizer-works"},{"id":"3.2.3-12","obj":"3.2.3","difficulty":"hard","type":"single","stem":"City Power & Light logs thumbs-up and thumbs-down feedback from its outage agent as gen_ai.evaluation.result events. The events arrive in Application Insights, but they do not appear as annotations on the agent traces in Microsoft Foundry. Each event sets gen_ai.evaluation.name to task_completion, a score of 1.0 or 0.0, and the matching pass or fail label. The events are emitted from a background worker that runs after the request completes.\n\nWhat should you do to make the feedback appear on the correct traces?","choices":["Emit each feedback event in the trace context of the agent interaction.","Change gen_ai.evaluation.score.value to a 1 to 5 Likert value.","Set gen_ai.evaluation.name to relevance instead of task_completion.","Send the feedback as a custom Azure Monitor metric instead of an event."],"answer":[0],"explanation":"Een feedback-event moet in dezelfde trace context worden uitgezonden als de agentinteractie die het annoteert (zelfde trace ID en span ID, plus bijvoorbeeld gen_ai.response.id). Een losse background worker zonder die context breekt de correlatie, waardoor de annotatie niet op de trace verschijnt.","rationale":["Juist: correlatie via trace ID en span ID koppelt de annotatie aan de juiste trace.","Fout: binaire thumbs-feedback gebruikt juist 0.0 of 1.0; een Likert-waarde lost de ontbrekende correlatie niet op.","Fout: task_completion is de voorgeschreven naam voor thumbs-up/down; een andere naam breekt het schema.","Fout: een metric verliest de koppeling met individuele traces volledig."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations#log-end-user-feedback-as-trace-annotations"},{"id":"3.3.1-01","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. runs a customer service agent named Agent1 in Foundry Agent Service. The operations team needs one indicator on the Agent Monitoring Dashboard that shows the percentage of agent runs that complete without failing, so that the team can open an investigation when the value drops below 95 percent.\n\nWhich dashboard metric should the team use?","choices":["Red teaming results","Run success rate","Latency","Token usage"],"answer":[1],"explanation":"Run success rate is het percentage runs dat succesvol voltooit. Microsoft Learn noemt een waarde onder 95% expliciet als signaal om mislukte runs te onderzoeken, dus dit is de agent-health-indicator die het team nodig heeft.","rationale":["Red teaming results tonen uitkomsten van adversariele scans, niet het slagingspercentage van productieruns.","Juist: dit metric toont het percentage agent runs dat succesvol voltooit.","Latency meet de responstijd (bijvoorbeeld throttling of trage tools), niet of runs slagen.","Token usage toont tokenaantallen en wijst op uitgebreide prompts of antwoorden, niet op mislukte runs."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.1-02","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Tailspin Toys has a multi-agent solution in which an orchestrator agent calls two subagents hosted in separate Azure Container Apps apps. All components send OpenTelemetry data to the same Application Insights resource. An engineer needs a KQL query that returns every request, dependency, and trace record that belongs to one end-to-end user transaction across the three components.\n\nWhich Application Insights field should the engineer filter on?","choices":["The id field of the request telemetry","operation_Id","operation_ParentId","cloud_RoleName"],"answer":[1],"explanation":"Application Insights gebruikt operation_Id als correlatieveld: alle telemetrie van een distributed trace deelt deze waarde, die overeenkomt met de W3C trace-id. Filteren op operation_Id geeft dus de volledige transactie over orchestrator en subagents.","rationale":["Het id van een request is uniek per request; het koppelt niet alle onderdelen van de end-to-end transactie.","Juist: elk telemetrie-item in een distributed trace deelt dezelfde operation_Id (de W3C trace-id).","operation_ParentId verwijst naar de directe parent van een item en levert dus geen complete transactie op.","cloud_RoleName identificeert de component of service, niet een individuele transactie."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/data-model-complete"},{"id":"3.3.1-03","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Wingtip Toys runs an orchestrator agent and four subagents as separate Azure Container Apps apps. Each app sends telemetry to one Application Insights resource with a distinct cloud role name. The operations team needs a visual topology of the components and the calls between them that shows the health of each component and highlights failure hotspots.\n\nWhich Application Insights feature should you use?","choices":["Application map","Availability tests","Live Metrics","Smart detection"],"answer":[0],"explanation":"Application map toont de componenten van een gedistribueerde applicatie als nodes (op basis van de cloud role name) en de aanroepen ertussen als edges, met health KPI's per node. Zo zie je snel welke agent of afhankelijkheid faalt en kun je doorklikken naar Investigate failures.","rationale":["Juist: Application map visualiseert de topologie en markeert performance bottlenecks en failure hotspots per component.","Availability tests sturen synthetische requests naar een endpoint, maar geven geen topologie van de componenten.","Live Metrics toont realtime telemetrie, maar geen kaart van de aanroepen tussen componenten.","Smart detection stuurt meldingen bij afwijkende failure rates, maar is geen visuele topologie."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-map"},{"id":"3.3.1-04","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank creates a log search alert rule that fires when a loan-processing agent records more than 20 failed tool calls in five minutes. When the alert fires, a predefined remediation script that restarts the tool backend must run automatically, without human intervention.\n\nWhat should you attach to the alert rule?","choices":["A diagnostic setting that sends logs to a Log Analytics workspace","An action group that contains an Automation Runbook action","An Azure Monitor workbook that visualizes failed tool calls","A Cost Management budget with an email notification"],"answer":[1],"explanation":"Azure Monitor alerts starten action groups, en een action group kan een Automation runbook, Azure Function of Logic App aanroepen. Zo wordt de remediatie automatisch uitgevoerd zodra het alert afgaat.","rationale":["Een diagnostic setting verzamelt logs; het reageert niet op een alert.","Juist: action groups kunnen bij een alert automatisch een Azure Automation runbook starten.","Een workbook visualiseert data maar voert geen remediatie uit.","Een budget bewaakt kosten, niet tool-fouten, en een e-mail is geen automatische remediatie."],"ref":"https://learn.microsoft.com/azure/automation/automation-create-alert-triggered-runbook"},{"id":"3.3.1-05","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a claims-triage agent named Agent1. Production traffic changes every week, so the team wants to detect behavioral drift by comparing Agent1 against the same fixed set of reference questions and expected answers every day at 06:00. The results must appear on the Monitor tab of the agent.\n\nWhat should you configure?","choices":["A scheduled evaluation that uses a golden dataset as the data source","A scheduled red team scan that uses an evaluation template","A continuous evaluation that uses live traffic with random sampling","A continuous evaluation that uses live traffic with intelligent sampling"],"answer":[0],"explanation":"Drift ten opzichte van een benchmark meet je met steeds dezelfde invoer: een scheduled evaluation met een golden dataset als data source, dagelijks om 06:00. Continuous evaluation op live traffic mengt veranderend verkeer met gedragsverandering en voldoet niet aan het vaste tijdstip.","rationale":["Juist: een vast schema plus een vaste golden dataset maakt resultaten over tijd vergelijkbaar.","Red team scans zoeken naar veiligheidsrisico's, niet naar afwijking ten opzichte van verwachte antwoorden.","Live traffic verandert wekelijks, dus scoreverschillen zijn dan niet eenduidig aan drift toe te schrijven.","Ook met intelligent sampling blijft de invoer wisselend productieverkeer en draait het niet op een vast tijdstip."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.1-06","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Northwind Traders builds an order-fulfilment workflow by using Microsoft Agent Framework workflows in Python. Instrumentation is enabled and traces are exported to Application Insights. Some orders stall because an executor never receives the message sent by the previous executor. You suspect that the target executor cannot handle the message type.\n\nWhich span attribute should you query to confirm the cause?","choices":["gen_ai.operation.name","gen_ai.tool.call.result","edge_group.delivery_status","code.function.return.value"],"answer":[2],"explanation":"Agent Framework-workflows emitteren edge_group.process-spans met het attribuut edge_group.delivery_status. De waarde 'dropped type mismatch' bevestigt dat het doel-executor het berichttype niet kan verwerken, wat precies het vermoede workflowfalen is.","rationale":["Dit attribuut noemt de GenAI-operatie (zoals chat), niet de afleverstatus van workflowberichten.","Dit attribuut bevat het resultaat van een tool-aanroep, niet de routering tussen executors.","Juist: dit attribuut krijgt de waarde 'dropped type mismatch' wanneer het doel-executor het berichttype niet aankan.","Dit attribuut komt van @trace_function en bevat een returnwaarde, niet de edge-routering."],"ref":"https://learn.microsoft.com/agent-framework/workflows/observability"},{"id":"3.3.1-07","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Adventure Works Cycles runs a LangGraph agent on Azure Kubernetes Service (AKS). The company wants to track the error rate of the agent and run continuous evaluations from Microsoft Foundry, next to the agents that run in Foundry Agent Service. The LangGraph agent already emits traces that follow the OpenTelemetry semantic conventions for generative AI.\n\nWhat should you do?","choices":["Add the llm-emit-token-metric policy to the API Management API that fronts the agent","Register the agent in Foundry Control Plane and send its telemetry to the Application Insights resource of the project","Create a separate Application Insights resource for the agent and add it to an Azure Monitor workbook","Create Resource Health alerts for the AKS cluster that hosts the LangGraph agent"],"answer":[1],"explanation":"Voor agents buiten Foundry registreer je de agent in Foundry Control Plane en stuur je de OpenTelemetry-telemetrie naar dezelfde Application Insights-resource als het project. Daarmee worden error rate en continuous evaluation ook voor externe agents zichtbaar.","rationale":["Die policy meet tokenverbruik; het levert geen agent error rate of evaluaties in Foundry op.","Juist: registratie plus dezelfde Application Insights-resource maakt monitoring en continuous evaluation in Foundry mogelijk.","Een aparte resource ontkoppelt de telemetrie van het Foundry-project, waardoor continuous evaluation niet werkt.","Resource Health meldt platformstatus van het cluster, niet de foutratio of kwaliteit van de agent."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.1-08","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Litware, Inc. exposes a customer service agent through a web API that is instrumented with Application Insights. The failure rate of requests rises and falls with load, so the team cannot choose a fixed alert threshold. The team needs near real-time notification when the failure rate rises abnormally compared to the previous days, including an analysis of the characteristics of the failures. The team does not want to write or configure alert logic.\n\nWhich feature should you use?","choices":["Smart detection of failure anomalies","A metric alert rule with a static failed-requests threshold","An Application Insights standard availability test","A log search alert rule that runs a KQL query every five minutes"],"answer":[0],"explanation":"Smart detection leert met machine learning het normale foutpercentage van de app en meldt bijna realtime een abnormale stijging ten opzichte van de afgelopen dagen. De melding bevat al een analyse van de kenmerken van de failures, en de functie vereist geen configuratie van alert logic.","rationale":["Juist: smart detection vergelijkt het huidige foutpatroon met eerdere dagen, voegt een analyse toe en vereist geen setup.","Een static threshold vereist een vaste waarde, die bij een met load wisselend foutpercentage niet te kiezen is.","Een availability test controleert of het endpoint bereikbaar is, niet of het foutpercentage van echte requests afwijkt.","Een log search alert vereist dat je zelf de query en drempel schrijft en levert geen automatische analyse."],"ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-types#smart-detection-alerts"},{"id":"3.3.1-09","obj":"3.3.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. configured a continuous evaluation rule for a high-traffic support agent by using the Python SDK. The project managed identity has the Foundry User role. Evaluation scores appear on the Monitor tab during most of the day, but the charts show gaps during peak business hours, and the evaluation runs list shows that runs are skipped during those hours.\n\nWhat should you do to remove the gaps?","choices":["Assign the Foundry User role to the project managed identity at the subscription scope","Replace the continuous evaluation rule with a daily scheduled evaluation","Increase the max_hourly_runs value of the evaluation rule","Expand the time range of the Monitor tab and refresh the dashboard"],"answer":[2],"explanation":"De buried constraint is dat runs alleen tijdens piekuren worden overgeslagen terwijl permissies kloppen. Volgens de troubleshooting-tabel is de oorzaak het hourly run limit; verhoog max_hourly_runs in de evaluation rule (standaard 100 runs per uur).","rationale":["De rol is al aanwezig en resultaten verschijnen buiten de piek, dus permissies zijn niet de oorzaak.","Een dagelijkse evaluatie mist juist de piekuren en detecteert regressies niet meer op live traffic.","Juist: overgeslagen runs betekenen dat het uurlimiet (standaard 100) bereikt is.","Dat helpt bij lege grafieken door ingestievertraging, niet bij runs die expliciet worden overgeslagen."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.1-10","obj":"3.3.1","difficulty":"hard","type":"single","stem":"Fourth Coffee needs automated remediation for an ordering agent. When a log search alert detects repeated tool-call failures, an Azure Automation runbook must restart the backend that hosts the tools. You have an Automation account that has a user-assigned managed identity.\n\nWhich sequence of actions should you perform?","choices":["Create the alert rule and add an email action -> create and publish the runbook -> create an action group that references the runbook -> delete the email action","Create the alert rule -> create and publish the runbook -> test the action group -> create an action group that references the runbook","Create and publish the runbook -> create an action group that has an Automation Runbook action that references the runbook -> create the alert rule and add the action group -> test the action group","Create an action group that has an Automation Runbook action -> test the action group -> create and publish the runbook -> create the alert rule"],"answer":[2],"explanation":"Bij het configureren van een Automation Runbook-actie selecteer je een bestaand runbook, dus dat maak je eerst. Daarna maak je de action group, koppel je die bij het aanmaken van de alert rule onder Actions en test je de action group.","rationale":["Deze volgorde koppelt de runbook-action group nooit aan de alert rule, dus er vindt geen automatische remediatie plaats.","Je kunt geen action group testen die nog niet bestaat, en de alert rule heeft dan geen remediatie-actie.","Juist: het runbook moet bestaan voordat de action group ernaar kan verwijzen, en de action group wordt aan de alert rule gekoppeld.","De Runbook-actie vereist dat je een bestaand runbook selecteert; dat runbook bestaat hier nog niet."],"ref":"https://learn.microsoft.com/azure/automation/automation-create-alert-triggered-runbook"},{"id":"3.3.1-11","obj":"3.3.1","difficulty":"hard","type":"single","stem":"Margie's Travel monitors a booking agent. The Agent Monitoring Dashboard shows a run success rate of 99 percent and latency below three seconds. However, customers report that the agent often books flights that do not match the requested dates. The team needs its monitoring strategy to detect this kind of problem automatically in production.\n\nWhat should you add to the monitoring strategy?","choices":["Continuous evaluation with agent evaluators such as task adherence and intent resolution","An alert rule on token usage for the agent","An Application Insights Standard availability test for the agent endpoint","An alert rule on run success rate with a threshold of 99.5 percent"],"answer":[0],"explanation":"Operationele metrics (success rate, latency) zijn gezond, dus het probleem is kwaliteit. Continuous evaluation met agent evaluators zoals task adherence en intent resolution scoort live antwoorden op correctheid en detecteert deze regressie automatisch.","rationale":["Juist: deze evaluators meten of de agent de taak en de intentie van de gebruiker correct uitvoert.","Tokenverbruik zegt niets over of de geboekte datums kloppen.","Een availability test controleert bereikbaarheid, niet de kwaliteit van het antwoord.","Runs voltooien technisch succesvol; een strengere drempel detecteert geen inhoudelijk foute boekingen."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.3.1-12","obj":"3.3.1","difficulty":"hard","type":"multi","stem":"A. Datum Corporation runs an orchestrator agent that invokes three remote subagents over HTTP. Each subagent calls tools. All components export OpenTelemetry data to one Application Insights resource, but in the Foundry portal each subagent invocation appears as a separate, unrelated trace. You need a single trace tree that shows the orchestrator, each subagent invocation, and each tool execution.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Enable baggage propagation so that user identifiers flow to each subagent","Enable content recording for message contents in each subagent","Record each subagent invocation as an invoke_agent child span and each tool call as an execute_tool child span","Propagate W3C Trace Context headers, such as traceparent, on calls from the orchestrator to the subagents","Send the telemetry of each subagent to a separate Application Insights resource"],"answer":[2,3],"explanation":"Een enkele trace-boom vereist twee dingen: W3C Trace Context-propagatie over de HTTP-grens, en spans volgens de multi-agent GenAI-conventies (invoke_agent als child van invoke_agent, execute_tool als child span). Samen geven ze de volledige hierarchie.","rationale":["Baggage draagt key-value-data mee maar is geen vervanging voor traceparent, en kan PII lekken.","Content recording voegt berichtinhoud toe aan spans maar koppelt geen traces aan elkaar.","Juist: de OpenTelemetry GenAI-conventies modelleren agent- en tool-aanroepen als geneste child spans.","Juist: zonder doorgegeven trace context start elke remote subagent een nieuwe trace.","Aparte resources versplinteren de telemetrie verder in plaats van die te correleren."],"ref":"https://learn.microsoft.com/azure/foundry/observability/concepts/trace-agent-concept"},{"id":"3.3.2-01","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Litware, Inc. exposes a multi-agent solution through a public HTTPS endpoint. The operations team needs synthetic checks that send a request to the endpoint every five minutes from several Azure regions and validate the response code and the TLS certificate.\n\nWhich monitoring feature should the team use?","choices":["A Service Health alert","An Application Insights Standard test","A Resource Health alert","The Application Insights application map"],"answer":[1],"explanation":"Een Application Insights Standard test controleert de beschikbaarheid van een endpoint vanaf meerdere locaties en valideert onder meer statuscode en TLS/SSL-certificaat. Dat is synthetische availability-monitoring zoals gevraagd.","rationale":["Service Health meldt brede Azure-incidenten, niet de bereikbaarheid van jouw endpoint.","Juist: een Standard test stuurt periodiek requests vanaf meerdere locaties en valideert ook het TLS-certificaat.","Resource Health meldt de platformstatus van een resource, maar voert geen synthetische requests uit.","De application map visualiseert afhankelijkheden van echte telemetrie, zonder synthetische checks."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/availability"},{"id":"3.3.2-02","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Coho Winery streams responses from a chat agent that uses an Azure OpenAI model on a provisioned deployment. The team needs to monitor how quickly users see the first part of each streamed response after they send a prompt.\n\nWhich metric should the team monitor?","choices":["Time Between Tokens","Time to Last Byte","Latency in the Cognitive Services - HTTP Requests category","Time to Response"],"answer":[3],"explanation":"Time to Response is volgens de monitoring reference de aanbevolen latency-metric voor streaming: de tijd tot de eerste respons na een prompt. Gebruik niet de legacy Latency-metric uit Cognitive Services - HTTP Requests.","rationale":["Time Between Tokens meet de generatiesnelheid tussen tokens, niet de tijd tot de eerste output.","Time to Last Byte meet de tijd tot het laatste byte, dus de totale responstijd.","Deze legacy-metric is niet ontworpen voor Azure OpenAI en geeft misleidende resultaten.","Juist: dit is de aanbevolen responsiveness-metric voor streaming requests (tijd tot de eerste respons)."],"ref":"https://learn.microsoft.com/azure/foundry/openai/monitor-openai-reference"},{"id":"3.3.2-03","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Humongous Insurance needs to be notified when the Foundry resource that hosts its agents becomes Unavailable or Degraded, even when no broader Azure platform incident is published for the region.\n\nWhat should you create?","choices":["A Service Health alert for the region","A Cost Management budget alert","A metric alert on Processed Prompt Tokens","A Resource Health alert"],"answer":[3],"explanation":"Resource Health alerts melden statuswijzigingen (Available, Unavailable, Degraded, Unknown) van een individuele resource en detecteren problemen ook als er geen breder Azure-incident is. Service Health is voor platformbrede issues.","rationale":["Service Health alerts gaan over bekende platformbrede incidenten, wat hier expliciet niet de trigger is.","Een budget alert reageert op uitgaven, niet op beschikbaarheid.","Een daling in tokens kan veel oorzaken hebben en meldt geen Unavailable- of Degraded-status.","Juist: Resource Health alerts zijn resource-specifiek en werken ook zonder breder Azure-incident."],"ref":"https://learn.microsoft.com/azure/service-health/resource-health-alert-monitor-guide"},{"id":"3.3.2-04","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines runs its flight-status agents on a Global Provisioned deployment. The team needs an alert when the deployment approaches full capacity so that it can act before requests are throttled.\n\nWhich metric should the alert use?","choices":["Processed Prompt Tokens","Provisioned-managed Utilization","Azure OpenAI Requests","Provisioned-managed Utilization V2"],"answer":[3],"explanation":"Voor PTU-capaciteit gebruik je Provisioned-managed Utilization V2; de oorspronkelijke metric is deprecated. Bij 100% utilization retourneert de deployment 429, dus een alert hierop geeft tijdig een waarschuwing.","rationale":["Dit telt inputtokens per request, maar toont niet hoeveel van de PTU-capaciteit benut is.","Deze oudere metric is deprecated en vervangen door de V2-variant.","Dit toont requestvolume en fouten, niet de capaciteitsbenutting van de deployment.","Juist: dit is de aanbevolen metric voor PTU-capaciteitsbenutting."],"ref":"https://learn.microsoft.com/azure/foundry/openai/monitor-openai-reference"},{"id":"3.3.2-05","obj":"3.3.2","difficulty":"medium","type":"single","stem":"Wide World Importers sees the average Time to Last Byte of its Azure OpenAI deployment increase by 40 percent over one week. The team must decide whether this indicates a real service problem or expected behavior caused by the agents producing longer answers.\n\nWhich metric should the team chart next to Time to Last Byte?","choices":["Blocked Volume","Prompt Token Cache Match Rate","Potential Abusive User Count","Generated Completion Tokens"],"answer":[3],"explanation":"Microsoft Learn adviseert een latency-metric altijd te combineren met een token count-metric. Stijgt latency proportioneel met Generated Completion Tokens, dan is dat verwacht; stijgt latency zonder tokenstijging, dan is er mogelijk een echt probleem.","rationale":["Blocked Volume is een Content Safety-metric en verklaart geen latencytrend.","Dit toont prompt cache hits, maar zegt niet of de antwoorden langer zijn geworden.","Dit is een Content Safety-metric over misbruik, niet over outputlengte.","Juist: een proportionele stijging van output tokens verklaart een hogere latency als verwacht gedrag."],"ref":"https://learn.microsoft.com/azure/foundry/openai/monitor-openai-reference"},{"id":"3.3.2-06","obj":"3.3.2","difficulty":"medium","type":"single","stem":"Trey Research hosts its agent API in Azure Container Apps. The API is reachable through a private endpoint, and inbound traffic from the internet is blocked by policy. The team needs availability monitoring that raises an alert when the API stops responding.\n\nWhat should you recommend?","choices":["Create a URL ping test that targets the private endpoint IP address","Emit an internal health signal from inside the virtual network and create log or metric alerts on that signal","Create an Application Insights Standard test that runs from five public test locations every five minutes","Create a Service Health alert for Azure Container Apps in the region"],"answer":[1],"explanation":"Standard tests vereisen dat het endpoint bereikbaar is vanaf de testlocaties. Voor niet-publieke endpoints zonder ingress adviseert de documentatie een intern health signal vanuit het netwerk te monitoren en daarop log- of metric-alerts te maken.","rationale":["URL ping tests zijn deprecated en hebben eveneens bereikbaarheid vanaf het internet nodig.","Juist: voor niet-publieke endpoints adviseert Microsoft een intern health signal met log- of metric-alerts.","Standard tests vereisen netwerkbereikbaarheid; publieke testlocaties bereiken het private endpoint niet.","Service Health meldt platformincidenten, niet dat jouw API niet meer reageert."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/availability"},{"id":"3.3.2-07","obj":"3.3.2","difficulty":"medium","type":"single","stem":"City Power & Light uses Azure OpenAI Data Zone Standard deployments for an outage-reporting agent. The company requires the agent to keep working during a regional outage of the Azure OpenAI endpoint, with minimal disruption to consuming applications and no code changes in the agents.\n\nWhat should you recommend?","choices":["Deploy resources in two regions behind an API Management backend pool that has circuit breaker rules","Configure spillover from the primary deployment to a standard deployment in the same resource","Request a quota increase for the deployment in the primary region","Add retry logic that honors the retry-after-ms header in each agent"],"answer":[0],"explanation":"De BCDR-richtlijn voor Standard deployments is twee resources (primaire en secundaire regio) achter een Generative AI Gateway zoals API Management met load balancing en circuit breaker. Zo merken consumerende applicaties minimaal van een regionale storing.","rationale":["Juist: een gateway met load balancing en circuit breaker vangt een regionale storing op zonder codewijziging.","Spillover is bedoeld voor provisioned deployments en werkt binnen dezelfde resource, dus niet over regio's.","Meer quota in dezelfde regio helpt niet als die regio onbereikbaar is.","Retry-logica vereist codewijzigingen in de agents en helpt niet zolang de regio onbereikbaar blijft."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/high-availability-resiliency"},{"id":"3.3.2-08","obj":"3.3.2","difficulty":"medium","type":"single","stem":"Graphic Design Institute creates an Application Insights Standard test for its tutoring agent endpoint. The test runs from five test locations. The team wants to reduce false alerts caused by transient network problems at a single location while following the recommended configuration.\n\nWhat alert location threshold should you set?","choices":["3 locations","1 location","5 locations","2 locations"],"answer":[0],"explanation":"Microsoft adviseert alert location threshold = aantal testlocaties - 2, met minimaal vijf testlocaties. Bij vijf locaties is dat 3, wat ruis van een enkele locatie filtert maar echte storingen wel meldt.","rationale":["Juist: de aanbeveling is aantal testlocaties min 2, dus 5 - 2 = 3.","Bij 1 locatie leidt elk tijdelijk probleem op een enkele locatie tot een alert.","Bij 5 locaties alarmeert de test pas als elke locatie faalt, wat echte storingen kan maskeren.","2 locaties wijkt af van de aanbevolen formule en blijft gevoelig voor lokale netwerkproblemen."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/availability"},{"id":"3.3.2-09","obj":"3.3.2","difficulty":"hard","type":"single","stem":"Alpine Ski House runs a booking agent on a Global Provisioned deployment of gpt-4.1 in a Foundry resource named Foundry1. During weekend peaks, the deployment returns HTTP 429 responses because utilization reaches 100 percent. The company must process the overflow requests instead of failing them, keep the provisioned deployment as the primary target, and avoid changing the agent code. Foundry1 contains a Global Standard deployment of the same model version. A second resource named Foundry2 in another region also contains a Global Standard deployment of that model version.\n\nWhat should you do?","choices":["Set spilloverDeploymentName on the provisioned deployment to the Global Standard deployment in Foundry1","Set spilloverDeploymentName on the provisioned deployment to the Global Standard deployment in Foundry2","Increase max_retries on the OpenAI client so that throttled agent requests are retried later","Add the x-ms-spillover-deployment header with the Foundry1 deployment name to each agent request"],"answer":[0],"explanation":"Spillover routeert overflow-requests (zoals 429 bij volle PTU) automatisch naar een standard deployment, terwijl de provisioned deployment voorrang houdt. Instellen via de deploymenteigenschap spilloverDeploymentName vermijdt codewijzigingen, en die eigenschap moet verwijzen naar een standard deployment in dezelfde resource.","rationale":["Juist: spillover op deploymentniveau vereist geen codewijziging en de standard deployment staat in dezelfde resource.","spilloverDeploymentName moet verwijzen naar een standard deployment in dezelfde resource als de provisioned deployment.","Retries wachten op vrije PTU-capaciteit, verhogen latency en vereisen een codewijziging.","Spillover per request via de header vereist een wijziging in de agentcode."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/spillover-traffic-management"},{"id":"3.3.2-10","obj":"3.3.2","difficulty":"hard","type":"single","stem":"VanArsdel, Ltd. runs agents on a Standard deployment that has 300,000 TPM assigned. During a sustained burst, the agents receive HTTP 429 responses. Azure Monitor shows billed token usage at about half of the assigned TPM, requests are spread evenly over each minute, and max_tokens is sized to the expected answers. The x-ratelimit-limit-tokens response header reports a value lower than 300,000.\n\nWhat should you do first?","choices":["Increase the TPM allocated to the deployment from the unused subscription quota","Retry the throttled requests by honoring the retry-after-ms header","Submit a quota increase request for the model in the region","Reduce the max_tokens value in each request"],"answer":[1],"explanation":"Burst-patronen en max_tokens zijn uitgesloten, en de header toont een effectieve limiet onder de geconfigureerde TPM. Dat is een tijdelijke rate limit adjustment van de gedeelde Standard-pool; eerst retry met retry-after-ms backoff. Bij aanhoudende problemen is PTU de aanbevolen vervolgstap.","rationale":["Meer TPM toewijzen verandert de tijdelijk verlaagde effectieve limiet van de gedeelde pool niet.","Juist: een lagere x-ratelimit-limit-tokens dan de geconfigureerde TPM wijst op een tijdelijke rate limit adjustment.","Het geconfigureerde quotum is niet veranderd; een quotumverhoging lost een tijdelijke aanpassing niet op.","max_tokens is al afgestemd op de verwachte antwoorden, dus dat is niet de oorzaak."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota"},{"id":"3.3.2-11","obj":"3.3.2","difficulty":"hard","type":"multi","stem":"Southridge Video must report monthly whether Azure met its service-level agreement (SLA) for the Foundry resource that hosts its agents. The on-call engineer must also be notified when the resource becomes unavailable because of an Azure platform event rather than an action by the team.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Review the token usage chart on the Agent Monitoring Dashboard","Create a Resource Health alert that filters on the User initiated reason type","Create a Resource Health alert that filters on the Platform initiated reason type","Create a metric alert on Prompt Token Cache Match Rate","Review the Resource Health history of the Foundry resource"],"answer":[2,4],"explanation":"Resource Health houdt de huidige en historische gezondheid bij en laat zien wanneer een resource door Azure-problemen onbeschikbaar was, zodat je SLA-schending kunt aantonen. Een Resource Health alert met reason type Platform initiated waarschuwt specifiek bij platformgebeurtenissen.","rationale":["Tokenverbruik zegt niets over platformbeschikbaarheid ten opzichte van de SLA.","User initiated meldt juist acties van het eigen team, zoals stoppen of dealloceren.","Juist: Platform initiated filtert op Azure-onderhoud of -incidenten in plaats van eigen acties.","Deze metric gaat over prompt caching, niet over beschikbaarheid of SLA.","Juist: Resource Health toont alle momenten van onbeschikbaarheid door Azure-problemen, wat SLA-controle eenvoudig maakt."],"ref":"https://learn.microsoft.com/azure/service-health/resource-health-alert-monitor-guide"},{"id":"3.3.2-12","obj":"3.3.2","difficulty":"hard","type":"single","stem":"Wingtip Toys runs a latency-critical pricing agent on a Global Standard deployment. Traffic is high and sustained. During business hours, response latency becomes more than two times higher than at night, and occasional HTTP 429 responses occur. The business requires consistent, predictable latency at scale.\n\nWhat should you recommend?","choices":["Implement retry logic with exponential backoff in the pricing agent","Submit a quota increase request for the Global Standard deployment","Move the workload to a provisioned throughput (PTU) deployment","Switch to a Data Zone Standard deployment"],"answer":[2],"explanation":"Overschrijdt verkeer de usage tier van een Standard deployment, dan kan latency meer dan verdubbelen. Voor latency-kritische of high-volume workloads adviseert Microsoft PTU, met dedicated resources, gegarandeerde capaciteit en voorspelbare latency.","rationale":["Retries vangen 429-responses op, maar verhogen de latency verder en maken die niet voorspelbaar.","Meer quota vermindert 429's maar maakt de latency in de gedeelde pool niet consistent.","Juist: PTU biedt dedicated capaciteit en voorspelbare latency, ook op schaal.","Data Zone Standard is ook gedeelde capaciteit en heeft dezelfde variabiliteit bij hoge, aanhoudende belasting."],"ref":"https://learn.microsoft.com/azure/foundry/openai/quotas-limits"},{"id":"3.3.3-01","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. builds a research agent by using Microsoft Agent Framework in Python. When the model keeps requesting tools, a single request can trigger many model round trips. You need to limit the number of model and tool round trips that the chat client performs for each request.\n\nWhich function invocation setting should you configure?","choices":["allow_concurrent_invocation","max_function_calls","max_duration_seconds","max_iterations"],"answer":[3],"explanation":"In FunctionInvocationConfiguration begrenst max_iterations hoe vaak de client een functie-aanroep uitvoert en het resultaat terugstuurt naar het model (standaard 40). Zo voorkom je dat een enkel request onbeperkt tokens verbruikt.","rationale":["Deze instelling bepaalt of tool-aanroepen parallel lopen, niet hoeveel roundtrips er zijn.","max_function_calls begrenst het totale aantal tool-aanroepen, niet het aantal model-roundtrips.","max_duration_seconds begrenst de verstreken tijd, niet het aantal roundtrips.","Juist: max_iterations begrenst het aantal roundtrips tussen model en function invocation per request."],"ref":"https://learn.microsoft.com/python/api/agent-framework-core/agent_framework.functioninvocationconfiguration?view=agent-framework-python-latest"},{"id":"3.3.3-02","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. calls a reasoning model through the Azure OpenAI Responses API. You need to cap the total number of tokens that the model generates for each request, including reasoning tokens and visible output tokens.\n\nWhich parameter should you set?","choices":["max_completion_tokens","max_output_tokens","reasoning.context","reasoning.effort"],"answer":[1],"explanation":"Reasoning tokens worden als output tokens gefactureerd. Met de Responses API begrens je het totaal met max_output_tokens; met Chat Completions zou dat max_completion_tokens zijn. Beide omvatten reasoning- en zichtbare output-tokens.","rationale":["max_completion_tokens is de equivalente parameter voor de Chat Completions API, niet de Responses API.","Juist: in de Responses API begrenst max_output_tokens reasoning-, output- en formatting-tokens samen.","reasoning.context bepaalt welke eerdere reasoning wordt meegenomen, niet een tokenlimiet.","reasoning.effort stuurt hoeveel het model redeneert, maar legt geen harde bovengrens op het aantal gegenereerde tokens."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/reasoning"},{"id":"3.3.3-03","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Tailspin Toys has a Foundry toolbox that contains 35 tools shared by several agents. Token costs grow with each tool that is added because every tool definition is passed to the model on each turn.\n\nWhat should you enable to keep token costs flat as the toolbox grows?","choices":["Tool search in the toolbox","Concurrent tool invocation","Content recording for tool call arguments","A higher max_function_calls value"],"answer":[0],"explanation":"Met tool search krijgt het model de meta-tools tool_search en call_tool in plaats van elke tooldefinitie, zodat de kosten vlak blijven ongeacht de grootte van de toolbox. Microsoft adviseert dit vanaf ongeveer 10 tot 15 tools.","rationale":["Juist: tool search vervangt de volledige toollijst door twee meta-tools, zodat de kosten vlak blijven.","Parallelle uitvoering versnelt tool-aanroepen maar verkleint de toolbeschrijvingen in de context niet.","Content recording legt tracedata vast en verlaagt geen tokens.","Een hogere limiet staat juist meer tool-aanroepen en dus meer tokens toe."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/tool-search"},{"id":"3.3.3-04","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Relecloud wraps a C# agent in LoopAgent to refine a report until a CompletionMarkerLoopEvaluator finds the marker DONE. You need to guarantee that the loop stops after five agent invocations, regardless of what the evaluator decides.\n\nWhich LoopAgentOptions property should you set?","choices":["FreshContextPerIteration","ExcludeOnBehalfOfMessages","NonStreamingReturnsLastResponseOnly","MaxIterations"],"answer":[3],"explanation":"LoopAgent wordt begrensd door een globale safety cap, LoopAgentOptions.MaxIterations, ongeacht wat de evaluators besluiten (standaard 10). Microsoft adviseert autonome loops altijd te begrenzen omdat een completion condition kan falen.","rationale":["Deze optie herstart elke iteratie met de oorspronkelijke input, maar begrenst het aantal iteraties niet.","Deze optie verbergt geinjecteerde feedbackberichten, maar beperkt de loop niet.","Deze optie bepaalt welke output terugkomt, niet hoe vaak de loop draait.","Juist: MaxIterations is de globale veiligheidslimiet die de loop altijd begrenst, los van de evaluators."],"ref":"https://learn.microsoft.com/dotnet/api/microsoft.agents.ai.loopagent?view=agent-framework-dotnet-latest"},{"id":"3.3.3-05","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Graphic Design Institute calls a model through the Azure OpenAI Responses API with the file search and code interpreter built-in tools enabled. For some requests, the model calls the built-in tools many times within a single response, which increases token usage. You need to cap the total number of built-in tool calls per response at four, across all built-in tools. The model must still be able to use both tools.\n\nWhich request parameter should you set?","choices":["max_tool_calls set to 4","parallel_tool_calls set to false","max_output_tokens set to 4000","tool_choice set to none"],"answer":[0],"explanation":"max_tool_calls bepaalt het maximale totale aantal calls naar built-in tools dat in één response wordt verwerkt. De limiet geldt over alle built-in tools samen, niet per tool, en verdere tool-pogingen van het model worden genegeerd.","rationale":["Juist: max_tool_calls begrenst het totaal aantal built-in tool calls per response.","parallel_tool_calls op false voorkomt alleen parallelle calls; het aantal opeenvolgende calls blijft onbegrensd.","max_output_tokens begrenst de gegenereerde tokens en kan het antwoord afkappen, maar telt geen tool calls.","tool_choice none schakelt tools helemaal uit, terwijl het model beide tools moet kunnen blijven gebruiken."],"ref":"https://learn.microsoft.com/rest/api/microsoft-foundry/azureopenai/responses"},{"id":"3.3.3-06","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Northwind Traders configures a Microsoft Agent Framework chat client in Python. Each request must stop invoking tools after five model round trips, after 20 tool calls in total, or after 30 seconds, whichever comes first.\n\n```python\nclient = OpenAIChatCompletionClient()\nclient.function_invocation_configuration.update(\n    {\n        \"max_iterations\": 5,\n        <setting A>: 20,\n        <setting B>: 30.0,\n    }\n)\n```\n\nWhich values should you use for setting A and setting B?","choices":["Setting A: \"max_function_calls\"; setting B: \"max_duration_seconds\"","Setting A: \"max_duration_seconds\"; setting B: \"max_function_calls\"","Setting A: \"max_iterations\"; setting B: \"max_duration_seconds\"","Setting A: \"max_function_calls\"; setting B: \"allow_concurrent_invocation\""],"answer":[0],"explanation":"max_function_calls en max_duration_seconds staan standaard op None (onbeperkt). Bereikt de client een limiet, dan stopt hij met tools aanroepen en vraagt hij het model om een eindantwoord. De limieten zijn best effort en worden na elke batch gecontroleerd.","rationale":["Juist: max_function_calls begrenst het totaal aantal calls en max_duration_seconds de wandkloktijd.","De sleutels zijn verwisseld: 20 seconden en 30 tool calls voldoen niet aan de eisen.","max_iterations staat er al en begrenst roundtrips, niet het totale aantal tool calls.","allow_concurrent_invocation is een boolean voor parallelle uitvoering, geen tijdslimiet."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools"},{"id":"3.3.3-07","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Proseware, Inc. sends 40 function definitions in each Azure OpenAI Responses API request and adds the tool_search tool to reduce input tokens. You need the greatest token savings while the functions remain discoverable.\n\nWhat should you do?","choices":["Group the deferred functions into namespaces that have clear high-level descriptions","Insert newly discovered tools at the beginning of the context","Mark each function individually with defer_loading set to true without grouping them","Set tool_choice to required for each request"],"answer":[0],"explanation":"Tool search laadt uitgestelde tools pas wanneer het model ze nodig heeft. De grootste besparing krijg je door functies te groeperen in namespaces of MCP-servers met een duidelijke beschrijving; houd elke namespace onder 10 functies.","rationale":["Juist: bij namespaces ziet het model eerst alleen naam en beschrijving van de namespace.","Nieuwe tools horen aan het eind van de context zodat de prompt cache behouden blijft.","Bij individueel uitgestelde functies blijven naam en beschrijving zichtbaar; vooral het schema wordt uitgesteld.","tool_choice forceert een tool-aanroep maar vermindert het aantal tooldefinities in de context niet."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/tool-search"},{"id":"3.3.3-08","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Lucerne Publishing has five agents that share one Azure OpenAI deployment through Azure API Management. One agent occasionally enters a runaway state and consumes most of the deployment TPM, which throttles the other agents. Each agent sends a unique x-agent-id header. You need to cap token consumption per agent per minute so that a runaway agent receives HTTP 429 responses while the other agents continue to work.\n\nWhich policy should you configure?","choices":["rate-limit-by-key with calls and a counter-key based on the x-agent-id header","llm-emit-token-metric with a dimension based on the x-agent-id header","llm-token-limit with tokens-per-minute and a counter-key based on the x-agent-id header","quota-by-key with calls and a counter-key based on the x-agent-id header"],"answer":[2],"explanation":"llm-token-limit dwingt per counter-key een tokens-per-minute-limiet af; bij overschrijding krijgt de aanroeper 429 Too Many Requests. Met de x-agent-id als sleutel wordt alleen de runaway-agent geremd.","rationale":["rate-limit-by-key telt aantallen calls, niet tokens, dus grote prompts blijven ongelimiteerd.","Deze policy meet tokenverbruik per agent maar dwingt geen limiet af.","Juist: deze policy begrenst tokens per minuut per sleutel en geeft 429 bij overschrijding.","quota-by-key telt calls over een langere periode en beperkt geen tokens per minuut."],"ref":"https://learn.microsoft.com/azure/api-management/llm-token-limit-policy"},{"id":"3.3.3-09","obj":"3.3.3","difficulty":"hard","type":"single","stem":"Trey Research uses AgentLoopMiddleware in Python to re-run a coding agent until its output contains the word DONE. The middleware is configured with max_iterations=None. On some tasks the model never writes DONE, and token usage for those sessions grows until the session is stopped manually. The loop must keep its completion predicate.\n\nWhat should you do?","choices":["Set inject_progress to True so that progress is added to the next input","Set max_iterations to a bounded value, such as 5","Set fresh_context to True so that each iteration restarts from the task","Set return_final_only to True so that the middleware returns the last response"],"answer":[1],"explanation":"Microsoft Learn waarschuwt dat max_iterations=None alleen mag als het completion-predicaat gegarandeerd termineert. Omdat het model DONE soms nooit schrijft, moet de loop een harde bovengrens krijgen; het predicaat blijft dan gewoon actief.","rationale":["Voortgang injecteren voegt context toe en kan tokens verhogen, zonder de loop te begrenzen.","Juist: een begrensde max_iterations stopt de loop ook als het predicaat nooit waar wordt.","fresh_context herstart elke iteratie vanaf de oorspronkelijke taak, maar de loop blijft onbegrensd.","Dit bepaalt alleen welke response terugkomt bij non-streaming runs, niet het aantal iteraties."],"ref":"https://learn.microsoft.com/agent-framework/agents/looping"},{"id":"3.3.3-10","obj":"3.3.3","difficulty":"hard","type":"multi","stem":"Margie's Travel calls a reasoning model through the Responses API with max_output_tokens set to 2,000 for an itinerary-planning agent. For complex requests, some responses have status incomplete with incomplete_details.reason set to max_output_tokens and contain no visible output. The company is billed for these requests, and the agent shows them to users as empty answers. You need to reduce how often this occurs and prevent the agent from presenting incomplete responses as answers.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Set reasoning.context to all_turns so that earlier reasoning carries forward","Decrease max_output_tokens so that the model produces shorter reasoning","Set reasoning.effort to high for complex itinerary requests","Raise max_output_tokens to reserve enough room for reasoning and output","Check the status of each response and handle incomplete responses explicitly"],"answer":[3,4],"explanation":"Een incomplete response met reason max_output_tokens kan optreden voordat er zichtbare output is; je betaalt dan input- en reasoning-tokens zonder antwoord. Reserveer voldoende ruimte (Microsoft noemt aanvankelijk minstens 25.000 tokens) en controleer status op elke response, zodat de applicatie dit geval afhandelt in plaats van een leeg antwoord te tonen.","rationale":["all_turns voegt eerdere reasoning toe en verhoogt het tokenverbruik, zonder meer ruimte voor output te reserveren.","Een lagere limiet maakt het probleem erger: de limiet wordt nog eerder bereikt.","Meer reasoning effort verbruikt meer reasoning tokens binnen dezelfde limiet en vergroot de kans op incomplete responses.","Juist: reasoning tokens delen de limiet met de zichtbare output, dus een hogere limiet laat ruimte voor een antwoord.","Juist: door status te controleren behandelt de agent incomplete responses niet als een leeg antwoord."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/reasoning"},{"id":"3.3.3-11","obj":"3.3.3","difficulty":"hard","type":"multi","stem":"A. Datum Corporation runs a multi-turn agent on a reasoning model by using the Responses API. The agent declares 30 functions in each request and often calls several functions in a row before it answers. Input and reasoning tokens are higher than budgeted. You need to reduce token consumption without removing functions.\n\nWhich two actions should you perform? Each correct answer presents a complete solution.","choices":["Declare the functions with defer_loading set to true and add the tool_search tool","Pass the reasoning items, function call items, and function call outputs from the previous response into the next request","Set allow_concurrent_invocation to False","Set reasoning.context to all_turns","Increase max_output_tokens"],"answer":[0,1],"explanation":"Door reasoning-items met function outputs terug te sturen (bijvoorbeeld via previous_response_id) begint het model niet opnieuw te redeneren en zijn er minder tokens nodig. Tool search met defer_loading voorkomt dat alle 30 definities steeds in de context staan.","rationale":["Juist: uitgestelde tooldefinities worden pas geladen wanneer nodig, wat inputtokens bespaart.","Juist: het model zet dan dezelfde redenering voort en komt met minder tokens tot een antwoord.","Dit bepaalt de uitvoeringsvolgorde van tools, niet het tokenverbruik.","all_turns neemt eerdere reasoning-items mee en verhoogt het verbruik.","Een hogere limiet staat meer generatie toe en verlaagt het verbruik niet."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/reasoning"},{"id":"3.3.3-12","obj":"3.3.3","difficulty":"hard","type":"single","stem":"Fourth Coffee fronts a shared Azure OpenAI deployment with Azure API Management. A subagent sometimes sends very large prompts after its token limit is already exceeded, and those prompts still reach the backend. You need API Management to reject such requests before they are sent to the backend. A small performance cost is acceptable. The API does not use streaming.\n\n```xml\n<llm-token-limit\n    counter-key=\"@(context.Request.Headers.GetValueOrDefault(\"x-agent-id\",\"\"))\"\n    tokens-per-minute=\"20000\"\n    estimate-prompt-tokens=\"false\" />\n```\n\nWhat should you change in the policy?","choices":["Set estimate-prompt-tokens to true","Replace tokens-per-minute with token-quota and token-quota-period","Add a tokens-consumed-header-name attribute","Add a retry-after-header-name attribute"],"answer":[0],"explanation":"Met estimate-prompt-tokens=\"false\" gebruikt de policy de werkelijke usage uit de response, waardoor prompts de backend nog bereiken nadat de limiet is overschreden. Met true schat API Management de prompttokens vooraf en blokkeert onnodige backend-requests, tegen een kleine performancekost.","rationale":["Juist: met schatting vooraf kan API Management requests blokkeren voordat ze de backend bereiken.","Een quotum over een langere periode gebruikt nog steeds de werkelijke usage achteraf zonder schatting.","Deze header rapporteert verbruikte tokens achteraf en blokkeert niets vooraf.","Dit verandert alleen de naam van de retry-header, niet wanneer de limiet wordt gecontroleerd."],"ref":"https://learn.microsoft.com/azure/api-management/llm-token-limit-policy"},{"id":"3.3.4-01","obj":"3.3.4","difficulty":"easy","type":"single","stem":"Litware, Inc. has four Foundry projects that share one Foundry resource and use Azure OpenAI models. The finance team needs to allocate the shared model spend to the business unit that owns each project, without adding tags manually.\n\nWhat should the finance team do in Cost Management?","choices":["Filter the cost analysis view by the project tag","Group the cost analysis view by Meter","Group the cost analysis view by Resource","Filter the cost analysis view by Service tier: Azure OpenAI"],"answer":[0],"explanation":"Foundry ondersteunt chargeback op projectniveau: het verbruik van elk project krijgt automatisch een project-tag. Filteren op die tag in Cost analysis verdeelt gedeelde kosten per project zonder handmatige tagging (voor Models sold by Azure).","rationale":["Juist: elk Foundry-project wordt automatisch getagd met een project-tag op het onderliggende verbruik.","Groeperen op Meter toont modelseries, niet welk project de kosten maakte.","De projecten delen een resource, dus groeperen op resource geeft een totaal.","Dit filter isoleert Azure OpenAI-gebruik, maar splitst niet per project."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-02","obj":"3.3.4","difficulty":"easy","type":"single","stem":"Tailspin Toys wants a financial analyst named User1 to view costs and usage data for the Foundry resources in a resource group. User1 must not receive permissions to manage resources.\n\nWhich role should you assign to User1?","choices":["Cognitive Services Usages Reader","Foundry User","Log Analytics Reader","Cost Management Reader"],"answer":[3],"explanation":"Voor kostenrapportage adviseert Microsoft de rol Cost Management Reader op de benodigde scope. Foundry User wijs je alleen extra toe als iemand ook Foundry-resources en usage-context moet inspecteren.","rationale":["Deze rol is bedoeld om quotagebruik te bekijken, niet kostengegevens.","Foundry User geeft toegang tot Foundry-resources en context, maar is niet de rol voor kostenrapportage.","Deze rol geeft toegang tot logs en traces, niet tot Cost Management-data.","Juist: deze rol geeft leestoegang tot kosten- en usagegegevens."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-03","obj":"3.3.4","difficulty":"easy","type":"single","stem":"Relecloud plans capacity for several agents that use gpt-4o. Before the team creates deployments, an architect must explain how Azure OpenAI Standard quota is granted.\n\nWhich scope should the architect use to plan Azure OpenAI quota?","choices":["Per Azure OpenAI resource, shared by the deployments in that resource","Per subscription, per region, per model, and per deployment type","Per Microsoft Entra tenant, shared by every subscription in the tenant","Per Foundry project, shared by the deployments in that project"],"answer":[1],"explanation":"Azure OpenAI-quota wordt per subscription, per regio, per model en per deployment type toegewezen in Tokens-per-Minute. Elke deployment krijgt een deel van dat quotum, tot de limiet bereikt is.","rationale":["Meerdere resources in dezelfde regio delen hetzelfde subscription-quotum.","Juist: quota wordt in TPM toegewezen per subscription, regio, model en deployment type.","Quota wordt niet op tenantniveau toegekend.","Projecten krijgen geen eigen quota; ze gebruiken quota van de subscription in die regio."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota"},{"id":"3.3.4-04","obj":"3.3.4","difficulty":"easy","type":"single","stem":"Woodgrove Bank wants to be warned when monthly Foundry spending for a resource group reaches 80 percent of a planned amount, and to start an automated workflow at 100 percent.\n\nWhat should you create?","choices":["A scheduled export of cost data to a storage account","A Cost Management budget with alert thresholds and an action group","An accumulated costs view in cost analysis","An llm-emit-token-metric policy in Azure API Management"],"answer":[1],"explanation":"Azure OpenAI heeft geen harde uitgave

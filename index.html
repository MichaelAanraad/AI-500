harness_agent call."],"answer":[0],"explanation":"For the harness agent, compaction is off by default unless both max_context_window_tokens and max_output_tokens are set (or a custom strategy is provided). With both parameters, the harness creates a default ContextWindowCompactionStrategy that runs before each model call in the tool loop.","rationale":["Correct: max_output_tokens is missing; with both token settings, the default compaction is enabled.","Incorrect: disable_compaction=True turns compaction off completely.","Incorrect: changing only this value does not enable compaction, because max_output_tokens is still missing.","Incorrect: a different history provider determines where history is stored, not whether compaction is active."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.3-01","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Southridge Video is building a new support agent in Microsoft Foundry. The agent has not been released, so no production traces exist. You must create an evaluation dataset of question-and-answer pairs based on the agent instructions and a policy document.\n\nWhat should you use?","choices":["Synthetic data generation with the Simple QnA task type","Conversion of agent traces into an evaluation dataset","Continuous evaluation on live traffic","Evaluation of interactions by response ID"],"answer":[0],"explanation":"Without production traffic, you can generate synthetic evaluation data in Foundry based on agent instructions, a prompt, and a reference file. Simple QnA produces question-and-answer pairs for turn-level evaluation.","rationale":["Correct: synthetic data generation is intended for the pre-launch phase and can be grounded with a reference file.","Incorrect: trace conversion requires existing production traces, which do not exist yet.","Incorrect: continuous evaluation samples live traffic, which does not exist yet.","Incorrect: evaluation by response ID requires existing agent responses."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/evaluation-dataset-synthetic"},{"id":"3.2.3-02","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Coho Winery wants an LLM judge to check whether each response of its sommelier agent uses a respectful, on-brand tone. The check must return a pass or fail result together with a reason, and it must be defined by a judge prompt that you write. You need to add the check to the evaluator catalog of the Foundry project.\n\nWhich type of evaluator should you create?","choices":["A prompt-based custom evaluator that uses binary scoring","A code-based custom evaluator that uses a grade() function","An endpoint-based custom evaluator hosted on your own service","A human evaluation template with a yes or no question"],"answer":[0],"explanation":"A prompt-based custom evaluator uses a judge prompt with which an LLM assesses each item; this fits subjective judgments such as tone. With binary scoring, the evaluator returns a JSON object with result (true or false) and reason.","rationale":["Correct: a prompt-based evaluator is an LLM-as-a-judge with your own judge prompt, and binary scoring gives pass or fail with a reason.","A code-based evaluator scores with deterministic Python logic and is intended for rules such as format or length, not for an LLM judgment about tone.","An endpoint-based evaluator is for scoring on your own infrastructure; the requirement is specifically a judge prompt in the catalog.","A human evaluation template has people assess the output instead of an LLM judge."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/custom-evaluators"},{"id":"3.2.3-03","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Lucerne Publishing wants an LLM judge to score its editorial agent against custom, weighted criteria such as house style, citation accuracy, and tone, with a reason for each criterion.\n\nWhich evaluator type should you use?","choices":["Rubric evaluator","Code-based custom evaluator","BLEU evaluator","F1 Score evaluator"],"answer":[0],"explanation":"A rubric evaluator lets an LLM judge score a response against custom, weighted dimensions, each with a score and a reason. The total is a weighted average normalized to 0-1.","rationale":["Correct: rubric evaluators combine custom weighted criteria with LLM-as-a-judge scoring.","Incorrect: code-based evaluators use deterministic Python logic, which is not suitable for subjective criteria such as tone.","Incorrect: BLEU measures n-gram overlap with a ground truth, not style or tone.","Incorrect: F1 measures token overlap with a ground truth and does not support weighted criteria."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rubric-evaluators"},{"id":"3.2.3-04","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. wants to improve the instructions of a prompt agent automatically. The solution must evaluate the current version against a dataset, generate alternative instructions, score each alternative against the same dataset, and recommend the best one.\n\nWhich Foundry capability should you use?","choices":["Agent optimizer","Prompt Optimizer in the playground","Cluster analysis","Scheduled evaluation"],"answer":[0],"explanation":"The agent optimizer runs a closed loop: evaluate the baseline, generate candidates, evaluate the candidates on the same dataset, and rank them. This is a semantic optimization loop driven by evaluations.","rationale":["Correct: the agent optimizer generates and scores candidate configurations against a dataset and marks the best one.","Incorrect: Prompt Optimizer rewrites instructions based on best practices, but it does not score them against a dataset.","Incorrect: cluster analysis helps find failure patterns, but it does not generate new instructions.","Incorrect: scheduled evaluation measures quality on a fixed schedule, but it does not generate improvements."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-optimizer-overview#how-the-agent-optimizer-works"},{"id":"3.2.3-05","obj":"3.2.3","difficulty":"medium","type":"single","stem":"Tailspin Toys runs nightly evaluations of an order-extraction agent. One check must verify that each response is valid JSON and stays under 500 characters. The check must produce deterministic results, must not incur model inference costs, and must not require you to host additional infrastructure.\n\nWhich evaluator type should you create?","choices":["Code-based custom evaluator","Prompt-based custom evaluator","Rubric evaluator","Endpoint-based custom evaluator"],"answer":[0],"explanation":"A code-based evaluator is a Python grade() function with deterministic logic, suitable for format and length checks. No LLM judge is called, so there are no inference costs per item.","rationale":["Correct: code-based evaluators are intended for rule-based checks such as format validation and length limits.","Incorrect: a prompt-based evaluator uses an LLM judge and is neither deterministic nor free.","Incorrect: rubric evaluators use an LLM judge and incur inference costs per evaluation.","Incorrect: endpoint-based evaluators require your own hosted infrastructure, which the stem rules out."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/custom-evaluators"},{"id":"3.2.3-06","obj":"3.2.3","difficulty":"medium","type":"single","stem":"Trey Research wants to fine-tune a model so that its procurement agent calls the purchasing APIs of the company more reliably. No production conversations exist yet. The only available source is a JSON file that contains an OpenAPI 3.1 specification of the purchasing APIs. You need to generate multi-turn training conversations that include tool calls by using the synthetic data generation feature in Microsoft Foundry.\n\nWhich generator should you use?","choices":["Tool use, with the OpenAPI specification as the reference file","Simple Q&A, with the OpenAPI specification as the reference file","Simulation seed (multi-turn), to create an evaluation dataset","Trace-to-dataset conversion of the agent traces"],"answer":[0],"explanation":"The Tool use synthetic data generator simulates multi-turn conversations with tool calls over your API surface and uses an OpenAPI 3.0.x or 3.1.x specification in JSON as the reference file. The output is intended as training data for fine-tuning, which is exactly what fits more reliable tool use.","rationale":["Correct: Tool use creates multi-turn training conversations with tool calls based on an OpenAPI specification.","Simple Q&A creates question-and-answer pairs from a domain document, without tool calls.","Simulation seed creates scenario descriptions for conversation simulation in an evaluation, not training data for fine-tuning.","Trace-to-dataset requires production traces, and those do not exist yet."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/data-generation"},{"id":"3.2.3-07","obj":"3.2.3","difficulty":"medium","type":"single","stem":"A. Datum Corporation has deployed a claims agent to production. You must score agent responses with Task Adherence and a rubric evaluator automatically as live traffic occurs, with sampling to control evaluation cost.\n\nWhat should you configure?","choices":["A continuous evaluation that samples live traffic","A scheduled evaluation against a golden dataset","An evaluation quality gate in a GitHub Actions workflow","An AI red teaming scan on a fixed schedule"],"answer":[0],"explanation":"Continuous evaluation samples live traffic as it occurs (for example random or intelligent sampling) and runs the selected evaluators automatically. This way you catch quality regressions in production immediately.","rationale":["Correct: continuous evaluation runs evaluators on sampled live traffic.","Incorrect: scheduled evaluation runs on a fixed schedule, often on a fixed dataset, not on traffic as it arrives.","Incorrect: a CI/CD gate evaluates before deployment, not the live production traffic.","Incorrect: red teaming tests safety risks, not task quality on live traffic."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard#set-up-continuous-evaluation"},{"id":"3.2.3-08","obj":"3.2.3","difficulty":"medium","type":"single","stem":"Woodgrove Bank auto-generates a rubric evaluator for its loan advisory agent. Before the rubric is used in continuous evaluation at scale, the team must confirm that the LLM judge distinguishes acceptable from unacceptable responses in the same way that the domain experts do.\n\nWhat should you do first?","choices":["Validate the rubric on a small sample against expert scores and refine the dimensions.","Lower the pass threshold of the rubric to 0.0 so that fewer responses fail.","Set always_applicable to true for every criterion in the rubric.","Enable continuous evaluation now and review the scores after one month."],"answer":[0],"explanation":"Microsoft recommends validating the rubric on a small sample first and checking that the scores match your own judgment. Precise descriptions and weights improve the consistency of the LLM judge.","rationale":["Correct: validating on a sample and iterating on descriptions and weights calibrates the judge before scaling up.","Incorrect: a threshold of 0.0 lets everything pass and makes the evaluator pointless.","Incorrect: always scoring every criterion ignores relevance and does not align the scores better with experts.","Incorrect: scaling up for validation produces a month of unreliable quality signals."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rubric-evaluators#review-and-adjust-the-rubric"},{"id":"3.2.3-09","obj":"3.2.3","difficulty":"hard","type":"single","stem":"Contoso, Ltd. plans to run the agent optimizer on a hosted agent that calls a payment API and a CRM API that writes customer records. The evaluation dataset contains 500 tasks, and the optimizer will test four candidates. The team must avoid charges and state changes in production systems during optimization.\n\nWhat should you do before you start the optimization run?","choices":["Point the tools to test endpoints or mock them for the optimization run.","Reduce the number of candidates that the optimizer generates to one.","Disable the tool optimization target for the optimization run.","Set the evaluation model to a smaller model deployment."],"answer":[0],"explanation":"The optimizer calls the agent for every task in the dataset, for the baseline and for each candidate. External tool calls are then actually executed. Microsoft recommends test endpoints or mocked tools to prevent costs, state changes, and rate limiting.","rationale":["Correct: with test endpoints or mocks, evaluation runs do not perform real payments or write actions.","Incorrect: fewer candidates reduce the number of calls, but the baseline and each candidate still call the production APIs.","Incorrect: without tool optimization, only the tool descriptions are not modified; the agent still calls the real APIs during every evaluation run.","Incorrect: the evaluation model only scores responses; the agent still calls the tools."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-optimizer-overview#how-the-agent-optimizer-works"},{"id":"3.2.3-10","obj":"3.2.3","difficulty":"hard","type":"multi","stem":"Northwind Traders runs a trace-to-dataset job each week to refresh the regression dataset of its pricing agent. Three requirements apply. The dataset must contain a representative subset without near-duplicate prompts. Only spans from the current agent version must be used. New rows must be combined with the latest existing dataset version.\n\nWhich three settings should you configure in the data generation job? Each correct answer presents part of the solution.","choices":["Set agent_version to the current version.","Set max_samples to enable intelligent sampling.","Set write_mode to MERGE.","Omit max_samples to process every matching trace.","Set redact_private_content to false."],"answer":[0,1,2],"explanation":"Without agent_version, the job mixes spans from all active versions. With max_samples, intelligent sampling is used, which filters low-intent traces and selects a diverse subset through MinHash. MERGE combines new rows with the latest dataset version and deduplicates trace rows.","rationale":["Correct: pinning agent_version prevents old versions from polluting the evaluation signal.","Correct: max_samples enables intelligent sampling for a representative, deduplicated subset.","Correct: MERGE combines new rows with the latest version instead of writing only new rows.","Incorrect: without max_samples, sampling is off and you also get near-identical prompts.","Incorrect: disabling redaction does not help any requirement and is allowed only if privacy rules permit it."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/traces-to-dataset#best-practices"},{"id":"3.2.3-11","obj":"3.2.3","difficulty":"hard","type":"single","stem":"Proseware, Inc. sets up an evaluation-driven optimization loop for a prompt agent by using the agent optimizer.\n\nThe loop includes the following actions:\n\n1. Generate candidate configurations such as rewritten instructions and improved tool descriptions.\n2. Score the baseline agent version against the evaluation dataset.\n3. Rank the candidates by composite score and promote the best one to a new agent version.\n4. Score each candidate against the same evaluation dataset.\n\nWhich sequence of actions should the loop follow?","choices":["2, 1, 4, 3","1, 2, 4, 3","1, 4, 2, 3","2, 4, 1, 3"],"answer":[0],"explanation":"The optimizer first evaluates the baseline, then generates candidates, tests each candidate on the same dataset, and ranks them by composite score. You promote the best candidate to a new version.","rationale":["Correct: baseline, generate candidates, score candidates, rank, and promote.","Incorrect: without evaluating the baseline first, the comparison with the current agent is not the starting point of the loop; the optimizer starts with the baseline.","Incorrect: scoring candidates before the baseline is known reverses the loop and gives no reference for the comparison.","Incorrect: candidates cannot be scored before they are generated."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-optimizer-overview#how-the-agent-optimizer-works"},{"id":"3.2.3-12","obj":"3.2.3","difficulty":"hard","type":"single","stem":"City Power & Light logs thumbs-up and thumbs-down feedback from its outage agent as gen_ai.evaluation.result events. The events arrive in Application Insights, but they do not appear as annotations on the agent traces in Microsoft Foundry. Each event sets gen_ai.evaluation.name to task_completion, a score of 1.0 or 0.0, and the matching pass or fail label. The events are emitted from a background worker that runs after the request completes.\n\nWhat should you do to make the feedback appear on the correct traces?","choices":["Emit each feedback event in the trace context of the agent interaction.","Change gen_ai.evaluation.score.value to a 1 to 5 Likert value.","Set gen_ai.evaluation.name to relevance instead of task_completion.","Send the feedback as a custom Azure Monitor metric instead of an event."],"answer":[0],"explanation":"A feedback event must be emitted in the same trace context as the agent interaction it annotates (same trace ID and span ID, plus for example gen_ai.response.id). A separate background worker without that context breaks the correlation, so the annotation does not appear on the trace.","rationale":["Correct: correlation through trace ID and span ID links the annotation to the correct trace.","Incorrect: binary thumbs feedback uses 0.0 or 1.0 by design; a Likert value does not fix the missing correlation.","Incorrect: task_completion is the prescribed name for thumbs-up/down; a different name breaks the schema.","Incorrect: a metric loses the link to individual traces entirely."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations#log-end-user-feedback-as-trace-annotations"},{"id":"3.3.1-01","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. runs a customer service agent named Agent1 in Foundry Agent Service. The operations team needs one indicator on the Agent Monitoring Dashboard that shows the percentage of agent runs that complete without failing, so that the team can open an investigation when the value drops below 95 percent.\n\nWhich dashboard metric should the team use?","choices":["Red teaming results","Run success rate","Latency","Token usage"],"answer":[1],"explanation":"Run success rate is the percentage of runs that complete successfully. Microsoft Learn explicitly names a value below 95% as a signal to investigate failed runs, so this is the agent health indicator the team needs.","rationale":["Red teaming results show the outcomes of adversarial scans, not the success rate of production runs.","Correct: this metric shows the percentage of agent runs that complete successfully.","Latency measures response time (for example throttling or slow tools), not whether runs succeed.","Token usage shows token counts and points to verbose prompts or responses, not to failed runs."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.1-02","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Tailspin Toys has a multi-agent solution in which an orchestrator agent calls two subagents hosted in separate Azure Container Apps apps. All components send OpenTelemetry data to the same Application Insights resource. An engineer needs a KQL query that returns every request, dependency, and trace record that belongs to one end-to-end user transaction across the three components.\n\nWhich Application Insights field should the engineer filter on?","choices":["The id field of the request telemetry","operation_Id","operation_ParentId","cloud_RoleName"],"answer":[1],"explanation":"Application Insights uses operation_Id as the correlation field: all telemetry of a distributed trace shares this value, which matches the W3C trace ID. Filtering on operation_Id therefore returns the complete transaction across the orchestrator and subagents.","rationale":["The ID of a request is unique per request; it does not link all parts of the end-to-end transaction.","Correct: every telemetry item in a distributed trace shares the same operation_Id (the W3C trace ID).","operation_ParentId refers to the direct parent of an item and therefore does not return a complete transaction.","cloud_RoleName identifies the component or service, not an individual transaction."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/data-model-complete"},{"id":"3.3.1-03","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Wingtip Toys runs an orchestrator agent and four subagents as separate Azure Container Apps apps. Each app sends telemetry to one Application Insights resource with a distinct cloud role name. The operations team needs a visual topology of the components and the calls between them that shows the health of each component and highlights failure hotspots.\n\nWhich Application Insights feature should you use?","choices":["Application map","Availability tests","Live Metrics","Smart detection"],"answer":[0],"explanation":"Application map shows the components of a distributed application as nodes (based on the cloud role name) and the calls between them as edges, with health KPIs per node. This lets you quickly see which agent or dependency is failing and drill into Investigate failures.","rationale":["Correct: Application map visualizes the topology and highlights performance bottlenecks and failure hotspots per component.","Availability tests send synthetic requests to an endpoint, but do not provide a topology of the components.","Live Metrics shows real-time telemetry, but not a map of the calls between components.","Smart detection sends notifications for abnormal failure rates, but is not a visual topology."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/app-map"},{"id":"3.3.1-04","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank creates a log search alert rule that fires when a loan-processing agent records more than 20 failed tool calls in five minutes. When the alert fires, a predefined remediation script that restarts the tool backend must run automatically, without human intervention.\n\nWhat should you attach to the alert rule?","choices":["A diagnostic setting that sends logs to a Log Analytics workspace","An action group that contains an Automation Runbook action","An Azure Monitor workbook that visualizes failed tool calls","A Cost Management budget with an email notification"],"answer":[1],"explanation":"Azure Monitor alerts trigger action groups, and an action group can call an Automation runbook, Azure Function, or Logic App. This runs the remediation automatically as soon as the alert fires.","rationale":["A diagnostic setting collects logs; it does not react to an alert.","Correct: action groups can automatically start an Azure Automation runbook when an alert fires.","A workbook visualizes data but does not perform remediation.","A budget monitors costs, not tool errors, and an email is not automatic remediation."],"ref":"https://learn.microsoft.com/azure/automation/automation-create-alert-triggered-runbook"},{"id":"3.3.1-05","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a claims-triage agent named Agent1. Production traffic changes every week, so the team wants to detect behavioral drift by comparing Agent1 against the same fixed set of reference questions and expected answers every day at 06:00. The results must appear on the Monitor tab of the agent.\n\nWhat should you configure?","choices":["A scheduled evaluation that uses a golden dataset as the data source","A scheduled red team scan that uses an evaluation template","A continuous evaluation that uses live traffic with random sampling","A continuous evaluation that uses live traffic with intelligent sampling"],"answer":[0],"explanation":"You measure drift against a benchmark with the same input every time: a scheduled evaluation with a golden dataset as the data source, daily at 06:00. Continuous evaluation on live traffic mixes changing traffic with behavior change and does not meet the fixed time requirement.","rationale":["Correct: a fixed schedule plus a fixed golden dataset makes results comparable over time.","Red team scans look for safety risks, not for deviation from expected answers.","Live traffic changes weekly, so score differences cannot be attributed unambiguously to drift.","Even with intelligent sampling, the input remains varying production traffic and it does not run at a fixed time."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.1-06","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Northwind Traders builds an order-fulfilment workflow by using Microsoft Agent Framework workflows in Python. Instrumentation is enabled and traces are exported to Application Insights. Some orders stall because an executor never receives the message sent by the previous executor. You suspect that the target executor cannot handle the message type.\n\nWhich span attribute should you query to confirm the cause?","choices":["gen_ai.operation.name","gen_ai.tool.call.result","edge_group.delivery_status","code.function.return.value"],"answer":[2],"explanation":"Agent Framework workflows emit edge_group.process spans with the attribute edge_group.delivery_status. The value 'dropped type mismatch' confirms that the target executor cannot process the message type, which is exactly the suspected workflow failure.","rationale":["This attribute names the GenAI operation (such as chat), not the delivery status of workflow messages.","This attribute contains the result of a tool call, not the routing between executors.","Correct: this attribute gets the value 'dropped type mismatch' when the target executor cannot handle the message type.","This attribute comes from @trace_function and contains a return value, not the edge routing."],"ref":"https://learn.microsoft.com/agent-framework/workflows/observability"},{"id":"3.3.1-07","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Adventure Works Cycles runs a LangGraph agent on Azure Kubernetes Service (AKS). The company wants to track the error rate of the agent and run continuous evaluations from Microsoft Foundry, next to the agents that run in Foundry Agent Service. The LangGraph agent already emits traces that follow the OpenTelemetry semantic conventions for generative AI.\n\nWhat should you do?","choices":["Add the llm-emit-token-metric policy to the API Management API that fronts the agent","Register the agent in Foundry Control Plane and send its telemetry to the Application Insights resource of the project","Create a separate Application Insights resource for the agent and add it to an Azure Monitor workbook","Create Resource Health alerts for the AKS cluster that hosts the LangGraph agent"],"answer":[1],"explanation":"For agents outside Foundry, you register the agent in Foundry Control Plane and send the OpenTelemetry telemetry to the same Application Insights resource as the project. This makes error rate and continuous evaluation visible for external agents too.","rationale":["That policy measures token consumption; it does not provide agent error rate or evaluations in Foundry.","Correct: registration plus the same Application Insights resource enables monitoring and continuous evaluation in Foundry.","A separate resource decouples the telemetry from the Foundry project, so continuous evaluation does not work.","Resource Health reports the platform status of the cluster, not the error rate or quality of the agent."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.1-08","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Litware, Inc. exposes a customer service agent through a web API that is instrumented with Application Insights. The failure rate of requests rises and falls with load, so the team cannot choose a fixed alert threshold. The team needs near real-time notification when the failure rate rises abnormally compared to the previous days, including an analysis of the characteristics of the failures. The team does not want to write or configure alert logic.\n\nWhich feature should you use?","choices":["Smart detection of failure anomalies","A metric alert rule with a static failed-requests threshold","An Application Insights standard availability test","A log search alert rule that runs a KQL query every five minutes"],"answer":[0],"explanation":"Smart detection uses machine learning to learn the normal failure rate of the app and reports an abnormal increase compared with the past days in near real time. The notification already includes an analysis of the characteristics of the failures, and the feature requires no alert logic configuration.","rationale":["Correct: smart detection compares the current failure pattern with earlier days, adds an analysis, and requires no setup.","A static threshold requires a fixed value, which cannot be chosen for a failure rate that varies with load.","An availability test checks whether the endpoint is reachable, not whether the failure rate of real requests deviates.","A log search alert requires you to write the query and threshold yourself and provides no automatic analysis."],"ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-types#smart-detection-alerts"},{"id":"3.3.1-09","obj":"3.3.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. configured a continuous evaluation rule for a high-traffic support agent by using the Python SDK. The project managed identity has the Foundry User role. Evaluation scores appear on the Monitor tab during most of the day, but the charts show gaps during peak business hours, and the evaluation runs list shows that runs are skipped during those hours.\n\nWhat should you do to remove the gaps?","choices":["Assign the Foundry User role to the project managed identity at the subscription scope","Replace the continuous evaluation rule with a daily scheduled evaluation","Increase the max_hourly_runs value of the evaluation rule","Expand the time range of the Monitor tab and refresh the dashboard"],"answer":[2],"explanation":"The buried constraint is that runs are skipped only during peak hours while permissions are correct. According to the troubleshooting table, the cause is the hourly run limit; increase max_hourly_runs in the evaluation rule (default 100 runs per hour).","rationale":["The role is already present and results appear outside the peak, so permissions are not the cause.","A daily evaluation misses the peak hours and no longer detects regressions on live traffic.","Correct: skipped runs mean the hourly limit (default 100) has been reached.","That helps with empty charts caused by ingestion delay, not with runs that are explicitly skipped."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.1-10","obj":"3.3.1","difficulty":"hard","type":"single","stem":"Fourth Coffee needs automated remediation for an ordering agent. When a log search alert detects repeated tool-call failures, an Azure Automation runbook must restart the backend that hosts the tools. You have an Automation account that has a user-assigned managed identity.\n\nWhich sequence of actions should you perform?","choices":["Create the alert rule and add an email action -> create and publish the runbook -> create an action group that references the runbook -> delete the email action","Create the alert rule -> create and publish the runbook -> test the action group -> create an action group that references the runbook","Create and publish the runbook -> create an action group that has an Automation Runbook action that references the runbook -> create the alert rule and add the action group -> test the action group","Create an action group that has an Automation Runbook action -> test the action group -> create and publish the runbook -> create the alert rule"],"answer":[2],"explanation":"When you configure an Automation Runbook action, you select an existing runbook, so you create that first. Then you create the action group, attach it under Actions when creating the alert rule, and test the action group.","rationale":["This order never attaches the runbook action group to the alert rule, so no automatic remediation takes place.","You cannot test an action group that does not exist yet, and the alert rule then has no remediation action.","Correct: the runbook must exist before the action group can reference it, and the action group is attached to the alert rule.","The Runbook action requires you to select an existing runbook; that runbook does not exist yet here."],"ref":"https://learn.microsoft.com/azure/automation/automation-create-alert-triggered-runbook"},{"id":"3.3.1-11","obj":"3.3.1","difficulty":"hard","type":"single","stem":"Margie's Travel monitors a booking agent. The Agent Monitoring Dashboard shows a run success rate of 99 percent and latency below three seconds. However, customers report that the agent often books flights that do not match the requested dates. The team needs its monitoring strategy to detect this kind of problem automatically in production.\n\nWhat should you add to the monitoring strategy?","choices":["Continuous evaluation with agent evaluators such as task adherence and intent resolution","An alert rule on token usage for the agent","An Application Insights Standard availability test for the agent endpoint","An alert rule on run success rate with a threshold of 99.5 percent"],"answer":[0],"explanation":"The operational metrics (success rate, latency) are healthy, so the problem is quality. Continuous evaluation with agent evaluators such as task adherence and intent resolution scores live responses for correctness and detects this regression automatically.","rationale":["Correct: these evaluators measure whether the agent correctly performs the task and the intent of the user.","Token consumption says nothing about whether the booked dates are correct.","An availability test checks reachability, not the quality of the response.","Runs complete technically successfully; a stricter threshold does not detect substantively wrong bookings."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.3.1-12","obj":"3.3.1","difficulty":"hard","type":"multi","stem":"A. Datum Corporation runs an orchestrator agent that invokes three remote subagents over HTTP. Each subagent calls tools. All components export OpenTelemetry data to one Application Insights resource, but in the Foundry portal each subagent invocation appears as a separate, unrelated trace. You need a single trace tree that shows the orchestrator, each subagent invocation, and each tool execution.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Enable baggage propagation so that user identifiers flow to each subagent","Enable content recording for message contents in each subagent","Record each subagent invocation as an invoke_agent child span and each tool call as an execute_tool child span","Propagate W3C Trace Context headers, such as traceparent, on calls from the orchestrator to the subagents","Send the telemetry of each subagent to a separate Application Insights resource"],"answer":[2,3],"explanation":"A single trace tree requires two things: W3C Trace Context propagation across the HTTP boundary, and spans that follow the multi-agent GenAI conventions (invoke_agent as a child of invoke_agent, execute_tool as a child span). Together they provide the full hierarchy.","rationale":["Baggage carries key-value data but is not a replacement for traceparent, and it can leak PII.","Content recording adds message content to spans but does not link traces together.","Correct: the OpenTelemetry GenAI conventions model agent and tool calls as nested child spans.","Correct: without propagated trace context, every remote subagent starts a new trace.","Separate resources fragment the telemetry further instead of correlating it."],"ref":"https://learn.microsoft.com/azure/foundry/observability/concepts/trace-agent-concept"},{"id":"3.3.2-01","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Litware, Inc. exposes a multi-agent solution through a public HTTPS endpoint. The operations team needs synthetic checks that send a request to the endpoint every five minutes from several Azure regions and validate the response code and the TLS certificate.\n\nWhich monitoring feature should the team use?","choices":["A Service Health alert","An Application Insights Standard test","A Resource Health alert","The Application Insights application map"],"answer":[1],"explanation":"An Application Insights Standard test checks the availability of an endpoint from multiple locations and validates, among other things, the status code and the TLS/SSL certificate. That is synthetic availability monitoring as requested.","rationale":["Service Health reports broad Azure incidents, not the reachability of your endpoint.","Correct: a Standard test periodically sends requests from multiple locations and also validates the TLS certificate.","Resource Health reports the platform status of a resource, but does not run synthetic requests.","The application map visualizes dependencies from real telemetry, without synthetic checks."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/availability"},{"id":"3.3.2-02","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Coho Winery streams responses from a chat agent that uses an Azure OpenAI model on a provisioned deployment. The team needs to monitor how quickly users see the first part of each streamed response after they send a prompt.\n\nWhich metric should the team monitor?","choices":["Time Between Tokens","Time to Last Byte","Latency in the Cognitive Services - HTTP Requests category","Time to Response"],"answer":[3],"explanation":"According to the monitoring reference, Time to Response is the recommended latency metric for streaming: the time to the first response after a prompt. Do not use the legacy Latency metric from Cognitive Services - HTTP Requests.","rationale":["Time Between Tokens measures the generation speed between tokens, not the time to the first output.","Time to Last Byte measures the time to the last byte, so the total response time.","This legacy metric was not designed for Azure OpenAI and gives misleading results.","Correct: this is the recommended responsiveness metric for streaming requests (time to the first response)."],"ref":"https://learn.microsoft.com/azure/foundry/openai/monitor-openai-reference"},{"id":"3.3.2-03","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Humongous Insurance needs to be notified when the Foundry resource that hosts its agents becomes Unavailable or Degraded, even when no broader Azure platform incident is published for the region.\n\nWhat should you create?","choices":["A Service Health alert for the region","A Cost Management budget alert","A metric alert on Processed Prompt Tokens","A Resource Health alert"],"answer":[3],"explanation":"Resource Health alerts report status changes (Available, Unavailable, Degraded, Unknown) of an individual resource and detect problems even when there is no broader Azure incident. Service Health is for platform-wide issues.","rationale":["Service Health alerts concern known platform-wide incidents, which is explicitly not the trigger here.","A budget alert reacts to spending, not to availability.","A drop in tokens can have many causes and does not report an Unavailable or Degraded status.","Correct: Resource Health alerts are resource-specific and also work without a broader Azure incident."],"ref":"https://learn.microsoft.com/azure/service-health/resource-health-alert-monitor-guide"},{"id":"3.3.2-04","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines runs its flight-status agents on a Global Provisioned deployment. The team needs an alert when the deployment approaches full capacity so that it can act before requests are throttled.\n\nWhich metric should the alert use?","choices":["Processed Prompt Tokens","Provisioned-managed Utilization","Azure OpenAI Requests","Provisioned-managed Utilization V2"],"answer":[3],"explanation":"For PTU capacity, you use Provisioned-managed Utilization V2; the original metric is deprecated. At 100% utilization the deployment returns 429, so an alert on this gives a timely warning.","rationale":["This counts input tokens per request, but does not show how much of the PTU capacity is used.","This older metric is deprecated and replaced by the V2 variant.","This shows request volume and errors, not the capacity utilization of the deployment.","Correct: this is the recommended metric for PTU capacity utilization."],"ref":"https://learn.microsoft.com/azure/foundry/openai/monitor-openai-reference"},{"id":"3.3.2-05","obj":"3.3.2","difficulty":"medium","type":"single","stem":"Wide World Importers sees the average Time to Last Byte of its Azure OpenAI deployment increase by 40 percent over one week. The team must decide whether this indicates a real service problem or expected behavior caused by the agents producing longer answers.\n\nWhich metric should the team chart next to Time to Last Byte?","choices":["Blocked Volume","Prompt Token Cache Match Rate","Potential Abusive User Count","Generated Completion Tokens"],"answer":[3],"explanation":"Microsoft Learn recommends always combining a latency metric with a token count metric. If latency rises proportionally with Generated Completion Tokens, that is expected; if latency rises without a token increase, there may be a real problem.","rationale":["Blocked Volume is a Content Safety metric and does not explain a latency trend.","This shows prompt cache hits, but does not say whether the responses have become longer.","This is a Content Safety metric about abuse, not about output length.","Correct: a proportional increase in output tokens explains higher latency as expected behavior."],"ref":"https://learn.microsoft.com/azure/foundry/openai/monitor-openai-reference"},{"id":"3.3.2-06","obj":"3.3.2","difficulty":"medium","type":"single","stem":"Trey Research hosts its agent API in Azure Container Apps. The API is reachable through a private endpoint, and inbound traffic from the internet is blocked by policy. The team needs availability monitoring that raises an alert when the API stops responding.\n\nWhat should you recommend?","choices":["Create a URL ping test that targets the private endpoint IP address","Emit an internal health signal from inside the virtual network and create log or metric alerts on that signal","Create an Application Insights Standard test that runs from five public test locations every five minutes","Create a Service Health alert for Azure Container Apps in the region"],"answer":[1],"explanation":"Standard tests require the endpoint to be reachable from the test locations. For non-public endpoints without ingress, the documentation recommends monitoring an internal health signal from within the network and creating log or metric alerts on it.","rationale":["URL ping tests are deprecated and also require reachability from the internet.","Correct: for non-public endpoints, Microsoft recommends an internal health signal with log or metric alerts.","Standard tests require network reachability; public test locations cannot reach the private endpoint.","Service Health reports platform incidents, not that your API has stopped responding."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/availability"},{"id":"3.3.2-07","obj":"3.3.2","difficulty":"medium","type":"single","stem":"City Power & Light uses Azure OpenAI Data Zone Standard deployments for an outage-reporting agent. The company requires the agent to keep working during a regional outage of the Azure OpenAI endpoint, with minimal disruption to consuming applications and no code changes in the agents.\n\nWhat should you recommend?","choices":["Deploy resources in two regions behind an API Management backend pool that has circuit breaker rules","Configure spillover from the primary deployment to a standard deployment in the same resource","Request a quota increase for the deployment in the primary region","Add retry logic that honors the retry-after-ms header in each agent"],"answer":[0],"explanation":"The BCDR guidance for Standard deployments is two resources (primary and secondary region) behind a Generative AI Gateway such as API Management with load balancing and a circuit breaker. This way consuming applications notice a regional outage as little as possible.","rationale":["Correct: a gateway with load balancing and a circuit breaker absorbs a regional outage without code changes.","Spillover is intended for provisioned deployments and works within the same resource, so not across regions.","More quota in the same region does not help if that region is unreachable.","Retry logic requires code changes in the agents and does not help while the region remains unreachable."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/high-availability-resiliency"},{"id":"3.3.2-08","obj":"3.3.2","difficulty":"medium","type":"single","stem":"Graphic Design Institute creates an Application Insights Standard test for its tutoring agent endpoint. The test runs from five test locations. The team wants to reduce false alerts caused by transient network problems at a single location while following the recommended configuration.\n\nWhat alert location threshold should you set?","choices":["3 locations","1 location","5 locations","2 locations"],"answer":[0],"explanation":"Microsoft recommends an alert location threshold = number of test locations - 2, with at least five test locations. With five locations that is 3, which filters out noise from a single location but still reports real outages.","rationale":["Correct: the recommendation is number of test locations minus 2, so 5 - 2 = 3.","With 1 location, every temporary problem at a single location triggers an alert.","With 5 locations, the test alerts only when every location fails, which can mask real outages.","2 locations deviates from the recommended formula and remains sensitive to local network problems."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/availability"},{"id":"3.3.2-09","obj":"3.3.2","difficulty":"hard","type":"single","stem":"Alpine Ski House runs a booking agent on a Global Provisioned deployment of gpt-4.1 in a Foundry resource named Foundry1. During weekend peaks, the deployment returns HTTP 429 responses because utilization reaches 100 percent. The company must process the overflow requests instead of failing them, keep the provisioned deployment as the primary target, and avoid changing the agent code. Foundry1 contains a Global Standard deployment of the same model version. A second resource named Foundry2 in another region also contains a Global Standard deployment of that model version.\n\nWhat should you do?","choices":["Set spilloverDeploymentName on the provisioned deployment to the Global Standard deployment in Foundry1","Set spilloverDeploymentName on the provisioned deployment to the Global Standard deployment in Foundry2","Increase max_retries on the OpenAI client so that throttled agent requests are retried later","Add the x-ms-spillover-deployment header with the Foundry1 deployment name to each agent request"],"answer":[0],"explanation":"Spillover automatically routes overflow requests (such as a 429 when the PTU is full) to a standard deployment, while the provisioned deployment keeps priority. Setting it through the deployment property spilloverDeploymentName avoids code changes, and that property must point to a standard deployment in the same resource.","rationale":["Correct: deployment-level spillover requires no code change and the standard deployment is in the same resource.","spilloverDeploymentName must point to a standard deployment in the same resource as the provisioned deployment.","Retries wait for free PTU capacity, increase latency, and require a code change.","Per-request spillover through the header requires a change in the agent code."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/spillover-traffic-management"},{"id":"3.3.2-10","obj":"3.3.2","difficulty":"hard","type":"single","stem":"VanArsdel, Ltd. runs agents on a Standard deployment that has 300,000 TPM assigned. During a sustained burst, the agents receive HTTP 429 responses. Azure Monitor shows billed token usage at about half of the assigned TPM, requests are spread evenly over each minute, and max_tokens is sized to the expected answers. The x-ratelimit-limit-tokens response header reports a value lower than 300,000.\n\nWhat should you do first?","choices":["Increase the TPM allocated to the deployment from the unused subscription quota","Retry the throttled requests by honoring the retry-after-ms header","Submit a quota increase request for the model in the region","Reduce the max_tokens value in each request"],"answer":[1],"explanation":"Burst patterns and max_tokens are excluded, and the header shows an effective limit below the configured TPM. That is a temporary rate limit adjustment of the shared Standard pool; first retry with retry-after-ms backoff. If the problems persist, PTU is the recommended next step.","rationale":["Allocating more TPM does not change the temporarily lowered effective limit of the shared pool.","Correct: an x-ratelimit-limit-tokens lower than the configured TPM points to a temporary rate limit adjustment.","The configured quota has not changed; a quota increase does not solve a temporary adjustment.","max_tokens is already aligned with the expected responses, so that is not the cause."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota"},{"id":"3.3.2-11","obj":"3.3.2","difficulty":"hard","type":"multi","stem":"Southridge Video must report monthly whether Azure met its service-level agreement (SLA) for the Foundry resource that hosts its agents. The on-call engineer must also be notified when the resource becomes unavailable because of an Azure platform event rather than an action by the team.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Review the token usage chart on the Agent Monitoring Dashboard","Create a Resource Health alert that filters on the User initiated reason type","Create a Resource Health alert that filters on the Platform initiated reason type","Create a metric alert on Prompt Token Cache Match Rate","Review the Resource Health history of the Foundry resource"],"answer":[2,4],"explanation":"Resource Health tracks current and historical health and shows when a resource was unavailable due to Azure problems, so you can demonstrate an SLA breach. A Resource Health alert with reason type Platform initiated warns specifically about platform events.","rationale":["Token consumption says nothing about platform availability relative to the SLA.","User initiated reports actions of your own team, such as stopping or deallocating.","Correct: Platform initiated filters on Azure maintenance or incidents instead of your own actions.","This metric concerns prompt caching, not availability or the SLA.","Correct: Resource Health shows all moments of unavailability due to Azure problems, which makes SLA verification straightforward."],"ref":"https://learn.microsoft.com/azure/service-health/resource-health-alert-monitor-guide"},{"id":"3.3.2-12","obj":"3.3.2","difficulty":"hard","type":"single","stem":"Wingtip Toys runs a latency-critical pricing agent on a Global Standard deployment. Traffic is high and sustained. During business hours, response latency becomes more than two times higher than at night, and occasional HTTP 429 responses occur. The business requires consistent, predictable latency at scale.\n\nWhat should you recommend?","choices":["Implement retry logic with exponential backoff in the pricing agent","Submit a quota increase request for the Global Standard deployment","Move the workload to a provisioned throughput (PTU) deployment","Switch to a Data Zone Standard deployment"],"answer":[2],"explanation":"If traffic exceeds the usage tier of a Standard deployment, latency can more than double. For latency-critical or high-volume workloads, Microsoft recommends PTU, with dedicated resources, guaranteed capacity, and predictable latency.","rationale":["Retries absorb 429 responses, but increase latency further and make it unpredictable.","More quota reduces 429s but does not make latency in the shared pool consistent.","Correct: PTU provides dedicated capacity and predictable latency, also at scale.","Data Zone Standard is also shared capacity and has the same variability under high, sustained load."],"ref":"https://learn.microsoft.com/azure/foundry/openai/quotas-limits"},{"id":"3.3.3-01","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. builds a research agent by using Microsoft Agent Framework in Python. When the model keeps requesting tools, a single request can trigger many model round trips. You need to limit the number of model and tool round trips that the chat client performs for each request.\n\nWhich function invocation setting should you configure?","choices":["allow_concurrent_invocation","max_function_calls","max_duration_seconds","max_iterations"],"answer":[3],"explanation":"In FunctionInvocationConfiguration, max_iterations limits how often the client executes a function call and sends the result back to the model (default 40). This prevents a single request from consuming unlimited tokens.","rationale":["This setting determines whether tool calls run in parallel, not how many roundtrips there are.","max_function_calls limits the total number of tool calls, not the number of model roundtrips.","max_duration_seconds limits the elapsed time, not the number of roundtrips.","Correct: max_iterations limits the number of roundtrips between model and function invocation per request."],"ref":"https://learn.microsoft.com/python/api/agent-framework-core/agent_framework.functioninvocationconfiguration?view=agent-framework-python-latest"},{"id":"3.3.3-02","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. calls a reasoning model through the Azure OpenAI Responses API. You need to cap the total number of tokens that the model generates for each request, including reasoning tokens and visible output tokens.\n\nWhich parameter should you set?","choices":["max_completion_tokens","max_output_tokens","reasoning.context","reasoning.effort"],"answer":[1],"explanation":"Reasoning tokens are billed as output tokens. With the Responses API, you limit the total with max_output_tokens; with Chat Completions it would be max_completion_tokens. Both include reasoning and visible output tokens.","rationale":["max_completion_tokens is the equivalent parameter for the Chat Completions API, not the Responses API.","Correct: in the Responses API, max_output_tokens limits reasoning, output, and formatting tokens together.","reasoning.context determines which earlier reasoning is included, not a token limit.","reasoning.effort controls how much the model reasons, but does not impose a hard upper bound on the number of generated tokens."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/reasoning"},{"id":"3.3.3-03","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Tailspin Toys has a Foundry toolbox that contains 35 tools shared by several agents. Token costs grow with each tool that is added because every tool definition is passed to the model on each turn.\n\nWhat should you enable to keep token costs flat as the toolbox grows?","choices":["Tool search in the toolbox","Concurrent tool invocation","Content recording for tool call arguments","A higher max_function_calls value"],"answer":[0],"explanation":"With tool search, the model receives the meta-tools tool_search and call_tool instead of every tool definition, so the cost stays flat regardless of the size of the toolbox. Microsoft recommends this from roughly 10 to 15 tools.","rationale":["Correct: tool search replaces the full tool list with two meta-tools, so the cost stays flat.","Parallel execution speeds up tool calls but does not reduce the tool descriptions in the context.","Content recording captures trace data and does not reduce tokens.","A higher limit allows more tool calls and therefore more tokens."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/tool-search"},{"id":"3.3.3-04","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Relecloud builds a Python agent by using Microsoft Agent Framework. When a downstream service is unavailable, the tool that calls it fails, and the model keeps calling the tool again within the same request, which wastes tokens. You need automatic function calling to stop for the request after two consecutive tool errors.\n\nWhich function invocation setting should you configure?","choices":["include_detailed_errors","terminate_on_unknown_calls","max_iterations","max_consecutive_errors_per_request"],"answer":[3],"explanation":"max_consecutive_errors_per_request sets the maximum number of consecutive function call errors that are allowed before the client stops further function calls for the request. The default is 3.","rationale":["This setting adds error details to the function result, but does not stop repeated calls.","This setting ends the loop when the model calls a tool that is not available, not when a known tool fails.","This setting limits model round trips in total, regardless of whether tool calls fail.","Correct: it stops further function calls after the configured number of consecutive errors."],"ref":"https://learn.microsoft.com/python/api/agent-framework-core/agent_framework.functioninvocationconfiguration?view=agent-framework-python-latest"},{"id":"3.3.3-05","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Graphic Design Institute calls a model through the Azure OpenAI Responses API with the file search and code interpreter built-in tools enabled. For some requests, the model calls the built-in tools many times within a single response, which increases token usage. You need to cap the total number of built-in tool calls per response at four, across all built-in tools. The model must still be able to use both tools.\n\nWhich request parameter should you set?","choices":["max_tool_calls set to 4","parallel_tool_calls set to false","max_output_tokens set to 4000","tool_choice set to none"],"answer":[0],"explanation":"max_tool_calls sets the maximum total number of calls to built-in tools processed in a single response. The limit applies across all built-in tools together, not per tool, and further tool attempts by the model are ignored.","rationale":["Correct: max_tool_calls limits the total number of built-in tool calls per response.","parallel_tool_calls set to false only prevents parallel calls; the number of sequential calls remains unbounded.","max_output_tokens limits the generated tokens and can truncate the response, but does not count tool calls.","tool_choice none disables tools entirely, whereas the model must remain able to use both tools."],"ref":"https://learn.microsoft.com/rest/api/microsoft-foundry/azureopenai/responses"},{"id":"3.3.3-06","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Northwind Traders configures a Microsoft Agent Framework chat client in Python. Each request must stop invoking tools after five model round trips, after 20 tool calls in total, or after 30 seconds, whichever comes first.\n\n```python\nclient = OpenAIChatCompletionClient()\nclient.function_invocation_configuration.update(\n    {\n        \"max_iterations\": 5,\n        <setting A>: 20,\n        <setting B>: 30.0,\n    }\n)\n```\n\nWhich values should you use for setting A and setting B?","choices":["Setting A: \"max_function_calls\"; setting B: \"max_duration_seconds\"","Setting A: \"max_duration_seconds\"; setting B: \"max_function_calls\"","Setting A: \"max_iterations\"; setting B: \"max_duration_seconds\"","Setting A: \"max_function_calls\"; setting B: \"allow_concurrent_invocation\""],"answer":[0],"explanation":"max_function_calls and max_duration_seconds default to None (unlimited). When the client reaches a limit, it stops calling tools and asks the model for a final answer. The limits are best effort and are checked after each batch.","rationale":["Correct: max_function_calls limits the total number of calls and max_duration_seconds limits the wall-clock time.","The keys are swapped: 20 seconds and 30 tool calls do not meet the requirements.","max_iterations is already present and limits roundtrips, not the total number of tool calls.","allow_concurrent_invocation is a boolean for parallel execution, not a time limit."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools"},{"id":"3.3.3-07","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Proseware, Inc. sends 40 function definitions in each Azure OpenAI Responses API request and adds the tool_search tool to reduce input tokens. You need the greatest token savings while the functions remain discoverable.\n\nWhat should you do?","choices":["Group the deferred functions into namespaces that have clear high-level descriptions","Insert newly discovered tools at the beginning of the context","Mark each function individually with defer_loading set to true without grouping them","Set tool_choice to required for each request"],"answer":[0],"explanation":"Tool search loads deferred tools only when the model needs them. You get the biggest saving by grouping functions into namespaces or MCP servers with a clear description; keep each namespace under 10 functions.","rationale":["Correct: with namespaces, the model initially sees only the name and description of the namespace.","New tools belong at the end of the context so that the prompt cache is preserved.","With individually deferred functions, the name and description remain visible; mainly the schema is deferred.","tool_choice forces a tool call but does not reduce the number of tool definitions in the context."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/tool-search"},{"id":"3.3.3-08","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Lucerne Publishing has five agents that share one Azure OpenAI deployment through Azure API Management. One agent occasionally enters a runaway state and consumes most of the deployment TPM, which throttles the other agents. Each agent sends a unique x-agent-id header. You need to cap token consumption per agent per minute so that a runaway agent receives HTTP 429 responses while the other agents continue to work.\n\nWhich policy should you configure?","choices":["rate-limit-by-key with calls and a counter-key based on the x-agent-id header","llm-emit-token-metric with a dimension based on the x-agent-id header","llm-token-limit with tokens-per-minute and a counter-key based on the x-agent-id header","quota-by-key with calls and a counter-key based on the x-agent-id header"],"answer":[2],"explanation":"llm-token-limit enforces a tokens-per-minute limit per counter key; when it is exceeded, the caller receives 429 Too Many Requests. With the x-agent-id as the key, only the runaway agent is throttled.","rationale":["rate-limit-by-key counts the number of calls, not tokens, so large prompts remain unlimited.","This policy measures token consumption per agent but does not enforce a limit.","Correct: this policy limits tokens per minute per key and returns 429 when exceeded.","quota-by-key counts calls over a longer period and does not limit tokens per minute."],"ref":"https://learn.microsoft.com/azure/api-management/llm-token-limit-policy"},{"id":"3.3.3-09","obj":"3.3.3","difficulty":"hard","type":"single","stem":"Trey Research uses AgentLoopMiddleware in Python to re-run a coding agent until its output contains the word DONE. The middleware is configured with max_iterations=None. On some tasks the model never writes DONE, and token usage for those sessions grows until the session is stopped manually. The loop must keep its completion predicate.\n\nWhat should you do?","choices":["Set inject_progress to True so that progress is added to the next input","Set max_iterations to a bounded value, such as 5","Set fresh_context to True so that each iteration restarts from the task","Set return_final_only to True so that the middleware returns the last response"],"answer":[1],"explanation":"Microsoft Learn warns that max_iterations=None is allowed only if the completion predicate is guaranteed to terminate. Because the model sometimes never writes DONE, the loop must get a hard upper bound; the predicate then simply remains active.","rationale":["Injecting progress adds context and can increase tokens, without bounding the loop.","Correct: a bounded max_iterations stops the loop even if the predicate never becomes true.","fresh_context restarts each iteration from the original task, but the loop remains unbounded.","This only determines which response is returned for non-streaming runs, not the number of iterations."],"ref":"https://learn.microsoft.com/agent-framework/agents/looping"},{"id":"3.3.3-10","obj":"3.3.3","difficulty":"hard","type":"multi","stem":"Margie's Travel calls a reasoning model through the Responses API with max_output_tokens set to 2,000 for an itinerary-planning agent. For complex requests, some responses have status incomplete with incomplete_details.reason set to max_output_tokens and contain no visible output. The company is billed for these requests, and the agent shows them to users as empty answers. You need to reduce how often this occurs and prevent the agent from presenting incomplete responses as answers.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Set reasoning.context to all_turns so that earlier reasoning carries forward","Decrease max_output_tokens so that the model produces shorter reasoning","Set reasoning.effort to high for complex itinerary requests","Raise max_output_tokens to reserve enough room for reasoning and output","Check the status of each response and handle incomplete responses explicitly"],"answer":[3,4],"explanation":"An incomplete response with reason max_output_tokens can occur before any visible output exists; you then pay for input and reasoning tokens without an answer. Reserve enough room (Microsoft initially mentions at least 25,000 tokens) and check status on every response, so the application handles this case instead of showing an empty answer.","rationale":["all_turns adds earlier reasoning and increases token consumption, without reserving more room for output.","A lower limit makes the problem worse: the limit is reached even sooner.","More reasoning effort consumes more reasoning tokens within the same limit and increases the chance of incomplete responses.","Correct: reasoning tokens share the limit with the visible output, so a higher limit leaves room for an answer.","Correct: by checking status, the agent does not treat incomplete responses as an empty answer."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/reasoning"},{"id":"3.3.3-11","obj":"3.3.3","difficulty":"hard","type":"multi","stem":"A. Datum Corporation runs a multi-turn agent on a reasoning model by using the Responses API. The agent declares 30 functions in each request and often calls several functions in a row before it answers. Input and reasoning tokens are higher than budgeted. You need to reduce token consumption without removing functions.\n\nWhich two actions should you perform? Each correct answer presents a complete solution.","choices":["Declare the functions with defer_loading set to true and add the tool_search tool","Pass the reasoning items, function call items, and function call outputs from the previous response into the next request","Set allow_concurrent_invocation to False","Set reasoning.context to all_turns","Increase max_output_tokens"],"answer":[0,1],"explanation":"By sending reasoning items back together with function outputs (for example through previous_response_id), the model does not start reasoning again and fewer tokens are needed. Tool search with defer_loading prevents all 30 definitions from being in the context every time.","rationale":["Correct: deferred tool definitions are loaded only when needed, which saves input tokens.","Correct: the model then continues the same reasoning and reaches an answer with fewer tokens.","This determines the execution order of tools, not token consumption.","all_turns includes earlier reasoning items and increases consumption.","A higher limit allows more generation and does not reduce consumption."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/reasoning"},{"id":"3.3.3-12","obj":"3.3.3","difficulty":"hard","type":"single","stem":"Fourth Coffee fronts a shared Azure OpenAI deployment with Azure API Management. A subagent sometimes sends very large prompts after its token limit is already exceeded, and those prompts still reach the backend. You need API Management to reject such requests before they are sent to the backend. A small performance cost is acceptable. The API does not use streaming.\n\n```xml\n<llm-token-limit\n    counter-key=\"@(context.Request.Headers.GetValueOrDefault(\"x-agent-id\",\"\"))\"\n    tokens-per-minute=\"20000\"\n    estimate-prompt-tokens=\"false\" />\n```\n\nWhat should you change in the policy?","choices":["Set estimate-prompt-tokens to true","Replace tokens-per-minute with token-quota and token-quota-period","Add a tokens-consumed-header-name attribute","Add a retry-after-header-name attribute"],"answer":[0],"explanation":"With estimate-prompt-tokens=\"false\", the policy uses the actual usage from the response, so prompts still reach the backend after the limit has been exceeded. With true, API Management estimates the prompt tokens up front and blocks unnecessary backend requests, at a small performance cost.","rationale":["Correct: with up-front estimation, API Management can block requests before they reach the backend.","A quota over a longer period still uses the actual usage afterward, without estimation.","This header reports consumed tokens afterward and blocks nothing up front.","This only changes the name of the retry header, not when the limit is checked."],"ref":"https://learn.microsoft.com/azure/api-management/llm-token-limit-policy"},{"id":"3.3.4-01","obj":"3.3.4","difficulty":"easy","type":"single","stem":"Litware, Inc. has four Foundry projects that share one Foundry resource and use Azure OpenAI models. The finance team needs to allocate the shared model spend to the business unit that owns each project, without adding tags manually.\n\nWhat should the finance team do in Cost Management?","choices":["Filter the cost analysis view by the project tag","Group the cost analysis view by Meter","Group the cost analysis view by Resource","Filter the cost analysis view by Service tier: Azure OpenAI"],"answer":[0],"explanation":"Foundry supports chargeback at the project level: the consumption of each project automatically gets a project tag. Filtering on that tag in Cost analysis allocates shared costs per project without manual tagging (for Models sold by Azure).","rationale":["Correct: every Foundry project is automatically tagged with a project tag on the underlying consumption.","Grouping by Meter shows model series, not which project incurred the costs.","The projects share one resource, so grouping by resource gives a total.","This filter isolates Azure OpenAI usage but does not split by project."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-02","obj":"3.3.4","difficulty":"easy","type":"single","stem":"Tailspin Toys wants a financial analyst named User1 to view costs and usage data for the Foundry resources in a resource group. User1 must not receive permissions to manage resources.\n\nWhich role should you assign to User1?","choices":["Cognitive Services Usages Reader","Foundry User","Log Analytics Reader","Cost Management Reader"],"answer":[3],"explanation":"For cost reporting, Microsoft recommends the Cost Management Reader role at the required scope. You assign Foundry User additionally only if someone also needs to inspect Foundry resources and usage context.","rationale":["This role is intended for viewing quota usage, not cost data.","Foundry User grants access to Foundry resources and context, but is not the role for cost reporting.","This role grants access to logs and traces, not to Cost Management data.","Correct: this role grants read access to cost and usage data."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-03","obj":"3.3.4","difficulty":"easy","type":"single","stem":"Relecloud plans capacity for several agents that use gpt-4o. Before the team creates deployments, an architect must explain how Azure OpenAI Standard quota is granted.\n\nWhich scope should the architect use to plan Azure OpenAI quota?","choices":["Per Azure OpenAI resource, shared by the deployments in that resource","Per subscription, per region, per model, and per deployment type","Per Microsoft Entra tenant, shared by every subscription in the tenant","Per Foundry project, shared by the deployments in that project"],"answer":[1],"explanation":"Azure OpenAI quota is assigned in Tokens-per-Minute per subscription, per region, per model, and per deployment type. Each deployment receives a portion of that quota, until the limit is reached.","rationale":["Multiple resources in the same region share the same subscription quota.","Correct: quota is assigned in TPM per subscription, region, model, and deployment type.","Quota is not granted at the tenant level.","Projects do not receive their own quota; they use the quota of the subscription in that region."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota"},{"id":"3.3.4-04","obj":"3.3.4","difficulty":"easy","type":"single","stem":"Woodgrove Bank wants to be warned when monthly Foundry spending for a resource group reaches 80 percent of a planned amount, and to start an automated workflow at 100 percent.\n\nWhat should you create?","choices":["A scheduled export of cost data to a storage account","A Cost Management budget with alert thresholds and an action group","An accumulated costs view in cost analysis","An llm-emit-token-metric policy in Azure API Management"],"answer":[1],"explanation":"Azure OpenAI has no hard spending limit. Microsoft recommends budgets with alerts at the subscription or resource group level; through action groups you can start automation when a threshold is reached.","rationale":["An export provides data for analysis but gives no threshold alerts.","Correct: budgets give alerts at thresholds and can start automation through action groups.","This view shows costs but does not automatically warn at a threshold.","This policy measures tokens, not the spending of the resource group relative to a budget."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-05","obj":"3.3.4","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has three internal teams that call the same Azure OpenAI deployment from one Foundry project through Azure API Management. Each team sends a team identifier in an x-team-id header. Finance needs monthly token consumption per team for internal chargeback.\n\nWhat should you configure?","choices":["The llm-token-limit policy with a counter-key based on the x-team-id header","A cost analysis filter on the project tag","A metric alert on Processed Prompt Tokens split by deployment","The llm-emit-token-metric policy with a custom dimension based on the x-team-id header"],"answer":[3],"explanation":"llm-emit-token-metric sends prompt, completion, and total tokens as a custom metric to Application Insights, with custom dimensions such as a header value. That is the basis for internal chargeback when teams share a project and deployment.","rationale":["This policy limits consumption but provides no reportable metrics per team.","The teams share a project, so the project tag does not split by team.","The teams share a deployment, so splitting by deployment makes no distinction.","Correct: token metrics with a team dimension enable aggregation per team."],"ref":"https://learn.microsoft.com/azure/api-management/genai-gateway-capabilities"},{"id":"3.3.4-06","obj":"3.3.4","difficulty":"medium","type":"single","stem":"Northwind Traders gives each partner a monthly allowance of 5 million tokens for an agent API in Azure API Management. When a partner exceeds its allowance, requests must be rejected until the next month starts. Partners use separate subscription keys.\n\nWhich configuration should you use?","choices":["A separate TPM allocation for each partner on the shared Azure OpenAI deployment","llm-token-limit with token-quota and a Monthly token-quota-period per subscription ID","quota-by-key with calls and renewal-period, keyed on the subscription ID","llm-token-limit with a tokens-per-minute rate limit, keyed on the subscription ID"],"answer":[1],"explanation":"In addition to a rate limit, llm-token-limit also supports a quota: token-quota over token-quota-period (Hourly to Yearly). When it is exceeded, the caller receives 403 Forbidden until the quota resets; with the subscription ID as the counter key, this applies per partner.","rationale":["A TPM allocation is a rate limit per deployment, not a monthly quota per partner.","Correct: a token-quota over a monthly period rejects requests with 403 until the period resets.","quota-by-key counts calls, not tokens, so the token allowance is not monitored.","A TPM limit resets every minute and does not enforce a monthly allowance."],"ref":"https://learn.microsoft.com/azure/api-management/llm-token-limit-policy"},{"id":"3.3.4-07","obj":"3.3.4","difficulty":"medium","type":"single","stem":"Adventure Works Cycles has 240,000 TPM of gpt-4o Standard quota in East US. Two existing deployments use 120,000 TPM each. Azure Monitor shows that one of them, Deployment2, uses less than 10 percent of its allocation over the last seven days. A new agent needs a gpt-4o deployment in East US with 60,000 TPM today, and a quota increase cannot be approved in time.\n\nWhat should you do?","choices":["Create the new deployment in a new Azure OpenAI resource in East US","Delete the resource that hosts Deployment2 by using the REST API and redeploy","Submit a quota increase request for gpt-4o in East US","Reduce the TPM assigned to Deployment2 and assign the freed TPM to the new deployment"],"answer":[3],"explanation":"Quota is shared across deployments per region and model. Microsoft recommends redistributing quota based on observed usage: lower the TPM of underused deployments to make room for new ones. A new resource in the same region does not help.","rationale":["A new resource in the same region shares the same subscription quota, which is al

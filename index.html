 de modelpool niet.","Een subset met een enkel model schakelt routingoptimalisatie en failover uit.","Juist: alleen long-context modellen in de subset, en minstens twee voor failover en kostenbewuste routing.","Session affinity houdt een gesprek op hetzelfde model, maar lost de contextlimiet van het kleinste model niet op."],"ref":"https://learn.microsoft.com/azure/foundry/openai/concepts/model-router-how-it-works"},{"id":"1.1.8-04","obj":"1.1.8","difficulty":"medium","type":"single","stem":"Alpine Ski House uses GPT-5 for a triage agent. Responses must be as fast as possible, and the agent must make parallel tool calls to check lift status and weather at the same time. Triage requires only light reasoning.\n\nWhich reasoning_effort value should you use?","choices":["minimal","low","medium","high"],"answer":[1],"explanation":"Minimal is het snelst, maar ondersteunt geen parallel tool calls. Low geeft lichte redenering met snelle respons en past bij triage, en ondersteunt parallel tool calls wel.","rationale":["Minimal ondersteunt geen parallel tool calls, wat hier een harde eis is.","Juist: low is de snelste waarde die parallel tool calls ondersteunt en past bij triage.","Medium is trager dan nodig voor lichte triage.","High is de traagste en duurste waarde; die is bedoeld voor complexe planning en analyse."],"ref":"https://learn.microsoft.com/azure/foundry/foundry-models/how-to/model-choice-guide"},{"id":"1.1.8-05","obj":"1.1.8","difficulty":"hard","type":"single","stem":"Lucerne Publishing runs several Foundry agents that receive a diverse mix of simple and complex prompts. Management wants to minimize cost and accepts a somewhat larger quality trade-off than the default routing behavior. One compliance agent must use the same model for every request so that audits can reproduce its behavior.\n\nWhat should you do?","choices":["Deploy model router in Quality mode for every agent, including the compliance agent.","Deploy model router in Balanced mode for every agent, including the compliance agent.","Use a direct deployment of a frontier model for every agent.","Use model router in Cost mode, and a direct deployment for the compliance agent."],"answer":[3],"explanation":"Cost mode van model router gebruikt een bredere kwaliteitsband (ongeveer 5 tot 6 procent) dan Balanced (1 tot 2 procent) en kiest het goedkoopste model. Als een workflow hetzelfde model voor elke request vereist, gebruik je een directe deployment; dit is het hybride patroon.","rationale":["Quality mode negeert kosten, en router kan per prompt een ander model kiezen voor de compliance-agent.","Balanced is de standaard met een smallere kwaliteitsband en kan ook voor compliance verschillende modellen kiezen.","Een frontier-model voor alles maximaliseert kosten voor eenvoudige prompts.","Juist: Cost mode voor gevarieerd verkeer en een vaste deployment voor de compliance-agent."],"ref":"https://learn.microsoft.com/azure/foundry/openai/concepts/model-router-how-it-works"},{"id":"1.1.8-06","obj":"1.1.8","difficulty":"hard","type":"single","stem":"Wingtip Toys equips field technicians with an assistant agent. Technicians often work offline at customer sites. Customer data must stay on the device during inspections. Inspection tasks are short and focused, and results are synchronized to the cloud for central processing when a connection is available.\n\nWhich model approach should you use?","choices":["a model router in a Data Zone Standard deployment","a fine-tuned GPT model in a serverless cloud deployment","a small language model on the device, with periodic cloud processing","a frontier reasoning model in a Global Standard deployment"],"answer":[2],"explanation":"Lokale of on-device modellen ondersteunen offline- en edge-scenario's en verbeteren privacy door data op het apparaat te houden. In hybride architecturen combineer je lokale inferentie met periodieke cloudverwerking voor centrale governance.","rationale":["Data Zone Standard bewaakt de datazone, maar vereist nog steeds connectiviteit en verplaatst data naar de cloud.","Fine-tuning verandert niets aan de eis van offline werken en data op het apparaat.","Juist: een lokaal klein model werkt offline, houdt data op het apparaat en past bij korte taken.","Een cloudmodel werkt niet offline en verplaatst klantdata van het apparaat."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/choose-ai-model"},{"id":"1.2.1-01","obj":"1.2.1","difficulty":"easy","type":"single","stem":"Trey Research has prompt agents in Foundry Agent Service that use MCP tools to call MCP servers that are hosted by several teams. The security team requires one governed entry point for all agent-to-tool traffic, with rate limits, IP restrictions, and audit logging. The MCP servers and the agent code must not be modified.\n\nWhat should you do?","choices":["Connect an AI gateway to the Foundry resource, and then create the MCP tools.","Import each MCP server as an A2A agent API in Azure API Management, and use the A2A tool.","Replace the MCP tools with OpenAPI tools that call the MCP servers directly.","Add each MCP server as a knowledge source in a Foundry IQ knowledge base."],"answer":[0],"explanation":"Door MCP-verkeer via een AI gateway in Microsoft Foundry te routeren, krijgt u een centraal punt voor authenticatie, rate limits, IP-restricties en logging zonder MCP servers of agentcode te wijzigen. De routering wordt toegepast bij het aanmaken van de tool, dus bestaande tools moeten na het koppelen van de gateway opnieuw worden aangemaakt.","rationale":["Juist: een AI gateway is het beheerde toegangspunt voor agent-to-tool verkeer naar MCP servers.","Fout: A2A agent API's zijn bedoeld voor agent-to-agent verkeer, niet voor MCP tools.","Fout: OpenAPI tools worden niet via de AI gateway beheerd en MCP servers zijn geen OpenAPI-endpoints.","Fout: een knowledge base routeert retrieval naar kennisbronnen, niet tool-aanroepen naar MCP servers."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/governance"},{"id":"1.2.1-02","obj":"1.2.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank has a Foundry Agent Service agent named Agent1. Agent1 must delegate loan pre-screening to a remote agent that another team built with LangGraph. The remote agent publishes an agent card and a JSON-RPC endpoint that implements Agent2Agent (A2A) protocol version 1.0. The integration will run in production.\n\nWhich tool type should you add to Agent1?","choices":["the A2A tool (a2a)","the A2A preview tool (a2a_preview)","the MCP tool","the OpenAPI tool"],"answer":[0],"explanation":"Het generally available a2a tooltype ondersteunt A2A-protocolversie 1.0 en is bedoeld voor nieuwe en productie-integraties met remote agents. Het remote agent beheert zijn eigen tools; Agent1 blijft het gesprek sturen.","rationale":["Juist: het GA a2a tooltype spreekt A2A 1.0 en is geschikt voor productie.","a2a_preview gebruikt A2A 0.3, is preview en wordt niet aanbevolen voor productie.","Het MCP tool verbindt een agent met tools van een MCP server, niet met een ander agent via een agent card.","Het OpenAPI tool roept een HTTP API aan op basis van een OpenAPI-spec, niet een A2A-agent met agent card en taken."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/agent-to-agent"},{"id":"1.2.1-03","obj":"1.2.1","difficulty":"medium","type":"single","stem":"Contoso Pharmaceuticals is building five agents in Foundry Agent Service. Each agent must be grounded on content in SharePoint, Azure Blob Storage, and OneLake. The architects want to avoid connecting every agent to every data source individually. Responses must include citations and must honor source access control lists and Microsoft Purview sensitivity labels for the calling user.\n\nWhich component should you specify for agent-to-knowledge-source routing?","choices":["a Foundry IQ knowledge base that contains one knowledge source per data store","a separate Azure AI Search index for each agent that is queried by the Azure AI Search tool","a Foundry Agent Service memory store that is scoped to each user","a file search vector store that is attached to each agent"],"answer":[0],"explanation":"Een Foundry IQ knowledge base bundelt meerdere knowledge sources, kan door meerdere agents gedeeld worden en gebruikt agentic retrieval om bronnen te kiezen. Het synchroniseert ACL's, respecteert Purview sensitivity labels en geeft antwoorden met citaties terug.","rationale":["Juist: een gedeelde knowledge base met meerdere knowledge sources voorkomt per-agent koppelingen en dwingt permissies af bij query time.","Een index per agent betekent opnieuw per-agent en per-bron koppelen, precies wat de architecten willen vermijden.","Een memory store bewaart gebruikersvoorkeuren en samenvattingen, geen enterprise-documentbronnen met ACL's.","Een file search vector store per agent dupliceert content per agent en synchroniseert geen bron-ACL's of sensitivity labels."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-foundry-iq"},{"id":"1.2.1-04","obj":"1.2.1","difficulty":"medium","type":"single","stem":"Tailspin Toys runs A2A-compatible agents in three business units. The agents are hosted outside Foundry. The company needs to govern agent-to-agent traffic centrally by requiring subscription keys and applying rate-limit policies. Operations also needs telemetry in Application Insights that includes the agent ID attribute defined by the OpenTelemetry GenAI semantic conventions.\n\nWhat should you do?","choices":["Expose each agent as an MCP server in Azure API Management.","Import each agent as an A2A agent API in Azure API Management.","Place Azure Front Door in front of each agent endpoint.","Register each agent in Azure API Center."],"answer":[1],"explanation":"API Management kan A2A agent API's importeren: het medieert de JSON-RPC-operaties, past policies toe, herschrijft de agent card met de subscription key-vereiste en voegt bij Application Insights de attributen genai.agent.id en genai.agent.name toe. Dat dekt governance en observability voor agent-to-agent verkeer.","rationale":["Een MCP server is bedoeld voor tools; A2A-verkeer met agent cards en taken past niet in het MCP-model.","Juist: een A2A agent API in API Management biedt policies, subscription keys en GenAI-telemetrie voor A2A-verkeer.","Azure Front Door is een globale load balancer en WAF zonder A2A-bewuste policies of GenAI-agentattributen.","API Center registreert en catalogiseert API's, maar handhaaft geen runtime policies of rate limits."],"ref":"https://learn.microsoft.com/azure/api-management/agent-to-agent-api"},{"id":"1.2.1-05","obj":"1.2.1","difficulty":"hard","type":"multi","stem":"Relecloud uses a Foundry IQ knowledge base that contains two indexed knowledge sources: an employee handbook index and a health insurance index. The retrieval reasoning effort is set to minimal. Users report two problems:\n\n- Questions about medical coverage are often answered from the employee handbook.\n- Multi-part questions are processed as a single query instead of being broken into focused subqueries.\n\nYou need to improve knowledge source selection and enable query decomposition without adding agents.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Add descriptions to each knowledge source and add retrieval instructions to the knowledge base.","Set the retrieval reasoning effort of the knowledge base to medium.","Keep the retrieval reasoning effort at minimal and increase the number of indexer runs.","Create a separate agent for each knowledge source.","Attach a memory search tool to the agent."],"answer":[0,1],"explanation":"Bronselectie beinvloed je met beschrijvingen op knowledge sources en retrieval instructions op de knowledge base. Query planning, waarbij een LLM complexe vragen opsplitst in subqueries, wordt pas aangeroepen bij reasoning effort low of medium; minimal doet geen query planning.","rationale":["Juist: beschrijvingen en retrieval instructions sturen welke knowledge source voor welk type vraag gekozen wordt.","Juist: medium activeert LLM-gebaseerde query planning en iteratieve retrieval, zodat vragen in subqueries worden opgesplitst.","Bij minimal wordt geen query planning gedaan; vaker indexeren ververst alleen data en lost routing niet op.","Extra agents per bron zijn expliciet uitgesloten en ondermijnen het voordeel van een gedeelde knowledge base.","Een memory search tool haalt gebruikersgeheugen op en verbetert geen bronselectie in de knowledge base."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/foundry-iq-faq"},{"id":"1.2.1-06","obj":"1.2.1","difficulty":"hard","type":"single","stem":"Northwind Traders operates 12 agents: some are Foundry prompt agents and some are hosted agents built with LangGraph. All agents use the same MCP server, the same OpenAPI tool, and the same A2A tool. Today each agent stores its own tool credentials, and every tool change requires redeploying each agent.\n\nThe new design must meet the following requirements:\n\n- Define the tools once and expose them through one MCP-compatible endpoint.\n- Centralize credential injection and apply guardrails to tool inputs and outputs.\n- Release a new tool configuration by promoting a version, without changing agent code.\n\nWhich component should you specify?","choices":["a shared agent that owns the tools and that each agent calls through the A2A tool","an Azure API Center inventory that lists the tools","a Foundry toolbox","an MCP-enabled session pool in Azure Container Apps dynamic sessions"],"answer":[2],"explanation":"Een Foundry toolbox groepeert MCP-, OpenAPI- en A2A-tools achter een beheerd MCP-compatibel endpoint dat elk framework kan gebruiken. Het centraliseert authenticatie, past guardrails toe op tool-in- en output en ondersteunt versies die je naar default promoveert zonder agentcode te wijzigen.","rationale":["Elk agent moet dan nog steeds een eigen A2A-koppeling met credentials configureren, en er is geen gedeeld MCP-endpoint met guardrails en versiepromotie.","API Center helpt bij discovery, maar injecteert geen credentials en past geen runtime guardrails of versies toe.","Juist: een toolbox levert een enkel MCP-endpoint, centrale credential-injectie, guardrails en versiepromotie.","Een dynamic sessions MCP-endpoint biedt vooraf gedefinieerde shell- en Python-tools voor sandboxed code, geen federatie van bestaande tools."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/toolbox-overview"},{"id":"1.2.2-01","obj":"1.2.2","difficulty":"easy","type":"single","stem":"Lamna Healthcare Company built Agent1 in a Foundry project. During development, Agent1 used the shared project agent identity. Before Agent1 moves to production, the security team requires that Agent1 has its own permission set and an independent audit trail in Microsoft Entra ID.\n\nWhat should you do?","choices":["Assign the required roles to the project managed identity.","Create a user-assigned managed identity and share it with the other agents.","Give Agent1 its own distinct agent identity and assign roles to it.","Configure the tools of Agent1 to use API key authentication."],"answer":[2],"explanation":"Een gedeelde project agent identity geeft een grotere blast radius en geen aparte audit trail. Agent1 moet daarom onder een eigen (distinct) agent identity draaien met eigen least-privilege rollen. Hoe je die krijgt hangt af van het model: in het legacy Agent Application-model door te publiceren, in het nieuwe agent object model door een nieuwe agent te maken (die krijgt bij het aanmaken een unieke identity). Rollen gaan niet mee, dus wijs ze opnieuw toe.","rationale":["De project managed identity authenticeert alleen de blueprint en is niet de principal die per agent rechten en auditing krijgt.","Een identity die tussen agents wordt gedeeld is precies het tegenovergestelde van per-agent scoping.","Juist: een eigen agent identity met eigen rollen geeft per-agent permissies en een onafhankelijke audit trail.","API keys zijn gedeelde secrets zonder identiteitsgebonden auditing en passen niet bij Zero Trust."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"1.2.2-02","obj":"1.2.2","difficulty":"medium","type":"single","stem":"Humongous Insurance has hundreds of Microsoft Entra agent identities across development, test, and production environments. The security team must prevent non-production agents from accessing production resources and wants to manage this control at scale. Agents cannot complete interactive controls such as multifactor authentication.\n\nWhat should you do?","choices":["Add the agent identities to the existing Conditional Access policy that requires multifactor authentication for all users.","Assign custom security attributes such as Environment to the agent identities and use them in a Conditional Access policy for agents.","Create an Azure Policy assignment that denies resource creation in production subscriptions.","Configure Microsoft Entra Privileged Identity Management for each agent identity."],"answer":[1],"explanation":"Microsoft Entra Agent ID raadt aan agents te segmenteren met custom security attributes (zoals Environment) en die te gebruiken in agent-specifieke Conditional Access policies. Zo blokkeer je op schaal non-production agents voor productie, zonder interactieve controls die agents niet kunnen uitvoeren.","rationale":["Agents kunnen geen MFA uitvoeren; user-gerichte MFA-policies blokkeren agent flows onbedoeld en segmenteren niet op omgeving.","Juist: custom security attributes in Conditional Access for agents geven fijnmazige, schaalbare segmentatie.","Azure Policy regelt resourceconfiguratie, niet welke identiteit toegang krijgt tot bestaande resources.","PIM geeft tijdgebonden elevatie voor privileges, maar segmenteert agents niet per omgeving."],"ref":"https://learn.microsoft.com/entra/agent-id/best-practices-agent-id"},{"id":"1.2.2-03","obj":"1.2.2","difficulty":"medium","type":"single","stem":"A. Datum Corporation runs prompt agents and hosted agents in a Foundry account that uses the Standard setup. To prevent lateral movement and data exfiltration, agent traffic to Azure Cosmos DB, Azure AI Search, and Azure Storage must stay on the private network, and outbound internet traffic must be inspected by a central firewall. The network team plans to add a private endpoint to the Foundry account and disable public network access.\n\nWhat else should you include in the design?","choices":["the Enabled from selected IP addresses setting on the Foundry account","a second private endpoint for the Foundry account in another subnet","virtual network injection, with egress routed through Azure Firewall","the Basic setup with platform-managed storage for agent data"],"answer":[2],"explanation":"Een private endpoint beveiligt alleen het inbound pad; agent-egress blijft dan publiek. Met virtual network injection in een subnet gedelegeerd aan Microsoft.App/environments blijft outbound verkeer privaat, en een hub-and-spoke ontwerp met Azure Firewall inspecteert internetverkeer.","rationale":["Selected IP addresses beperkt alleen wie het Foundry-endpoint inbound mag aanroepen.","Een extra private endpoint verandert niets aan de egress van agents.","Juist: VNet-injectie isoleert egress en de gepeerde hub met Azure Firewall inspecteert outbound verkeer.","Platform-managed opslag vervangt de eigen Cosmos DB, AI Search en Storage en isoleert op zichzelf de agent-egress niet."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/configure-private-link"},{"id":"1.2.2-04","obj":"1.2.2","difficulty":"hard","type":"single","stem":"Contoso, Ltd. runs a claims triage agent type in many business units. All 40 agent identities of this type were created from one agent identity blueprint in Microsoft Entra ID, and new instances are created automatically during peak load. A security incident affects this agent type. You must meet the following requirements:\n\n- Block every existing identity of this agent type from authenticating immediately.\n- Prevent new identities of this agent type from being created during the incident.\n- Leave other agents in the tenant unaffected.\n- Restore access after the incident without re-creating identities.\n\nWhat should you do?","choices":["Disable the agent identity blueprint of the claims triage agent type.","Disable each of the 40 agent identities in the Microsoft Entra admin center.","Create a Conditional Access policy that blocks every agent identity in the tenant.","Delete the blueprint by using the Remove-EntraAgentIdentityBlueprint cmdlet."],"answer":[0],"explanation":"Een agent identity blueprint is het beheerobject voor alle agent identities van een agent type. Door de blueprint uit te schakelen kunnen bestaande identities niet meer authenticeren en kunnen er geen nieuwe worden aangemaakt; opnieuw inschakelen herstelt de toegang. Zo beperk je het incident tot dit ene agent type.","rationale":["Juist: blueprint-level disable blokkeert bestaande identities, voorkomt nieuwe en is omkeerbaar.","Onjuist: individueel uitschakelen schaalt slecht en blokkeert niet de nieuwe instances die tijdens piekbelasting worden aangemaakt.","Onjuist: een tenantbrede blokkade raakt ook alle andere agents in de tenant.","Onjuist: deze cmdlet verwijdert de blueprint met al zijn agent identities en agent users cascaderend. Dat is bedoeld voor permanent uitfaseren; herstel vraagt een soft-delete restore binnen 30 dagen in plaats van simpelweg opnieuw inschakelen."],"ref":"https://learn.microsoft.com/entra/agent-id/manage-agent-identities-admin"},{"id":"1.2.2-05","obj":"1.2.2","difficulty":"hard","type":"multi","stem":"Woodgrove Bank is deploying a remediation agent that runs scripts and runbooks to fix misconfigured resources in a regulated environment. The agent has a dedicated Microsoft Entra agent identity. The security team requires Zero Trust controls that minimize standing privilege and limit the blast radius if the agent is compromised.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Use Microsoft Entra Privileged Identity Management for approval-based, time-bound elevation of the agent.","Scope the role assignments of the agent to specific resource groups instead of the subscription.","Assign the Contributor role to the agent at the subscription scope.","Run the agent under the shared project agent identity.","Store a client secret in the agent identity blueprint."],"answer":[0,1],"explanation":"Voor remediatie-agents adviseert de least-privilege guidance JIT-elevatie of approval gates (PIM) en scoping naar specifieke resource groups in plaats van subscription-brede rechten. Dat beperkt zowel staande privileges als laterale beweging.","rationale":["Juist: PIM geeft goedgekeurde, tijdgebonden elevatie in plaats van permanente rechten.","Juist: resource group-scope beperkt de blast radius ten opzichte van subscription-scope.","Contributor op subscription-niveau is een brede staande rol en vergroot de blast radius.","De gedeelde project identity heeft een grotere blast radius en geen eigen audit trail.","Een client secret moet geroteerd en bewaard worden; een federated credential via managed identity is de aanbevolen productieoptie."],"ref":"https://learn.microsoft.com/security/zero-trust/sfi/least-privilege-for-ai-agents"},{"id":"1.2.2-06","obj":"1.2.2","difficulty":"easy","type":"single","stem":"Coho Winery runs a multi-agent solution on Azure that processes card payments for its online store. Auditors require continuous automated assessment of the Azure resources against the Payment Card Industry Data Security Standard (PCI DSS) v4, with a view of passed and failed compliance controls.\n\nWhich component should you use?","choices":["Azure Advisor recommendations for the subscription","Microsoft Entra audit logs in a Log Analytics workspace","the Notification Center in the Foundry portal","the Defender for Cloud regulatory compliance dashboard"],"answer":[3],"explanation":"Het regulatory compliance dashboard in Defender for Cloud beoordeelt resources continu tegen standaarden zoals PCI DSS en toont per control of resources compliant zijn. De data stroomt ook door naar Microsoft Purview Compliance Manager voor centraal compliancebeheer.","rationale":["Advisor geeft best-practice aanbevelingen, maar mapt niet naar regulatory controls zoals PCI DSS.","Audit logs registreren directory-activiteit, maar beoordelen geen resources tegen compliance controls.","Het Notification Center toont alerts in de Foundry-portal, geen compliance-assessments per standaard.","Juist: het dashboard mapt resource-assessments continu naar de controls van PCI DSS v4."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-regulatory-compliance-standards"},{"id":"1.2.3-01","obj":"1.2.3","difficulty":"easy","type":"single","stem":"Bellows College deploys Foundry Agent Service by using the Standard setup with bring-your-own resources. Compliance requires that all messages and conversation history stay in a resource that the college owns.\n\nWhich resource should you specify for the conversation history?","choices":["Azure AI Search","Azure Cosmos DB","Azure Managed Redis","Azure Storage"],"answer":[1],"explanation":"In de Standard setup slaat een Azure Cosmos DB for NoSQL-account (BYO thread storage) berichten, conversatiegeschiedenis en agentmetadata op. Azure Storage bevat bestanden en Azure AI Search de vector stores.","rationale":["Azure AI Search bevat de vector stores die de agent maakt.","Juist: Cosmos DB is de BYO thread storage voor conversaties.","Azure Managed Redis maakt geen deel uit van de Standard setup van Agent Service.","Azure Storage bevat bestanden die door ontwikkelaars en gebruikers zijn geupload."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/standard-agent-setup"},{"id":"1.2.3-02","obj":"1.2.3","difficulty":"easy","type":"single","stem":"Fourth Coffee is building session memory for a custom agent. For each session, the agent stores the most recent chat turns, the current plan, and references to tool outputs. Reads and writes must have low latency, and inactive sessions must age out automatically. Vector search is not required for session memory.\n\nWhich component should you use?","choices":["Azure Managed Redis with TTL-based keys","a Foundry Agent Service memory store","an Azure AI Search vector index","Azure Blob Storage with lifecycle management policies"],"answer":[0],"explanation":"Azure Managed Redis is geschikt voor begrensd short-term sessiegeheugen: lists voor recente turns, hashes voor state en TTL plus trimming zodat inactieve sessies automatisch verlopen. Hiervoor zijn geen modules nodig.","rationale":["Juist: Redis-lists en -hashes met TTL en trimming bij elke write leveren snel, zelfopruimend sessiegeheugen.","Een memory store is bedoeld voor long-term geheugen, zoals voorkeuren over sessies heen.","Een vectorindex is bedoeld voor semantisch zoeken, wat hier niet nodig is.","Blob lifecycle policies werken op dagen-niveau en leveren niet de lage latency voor sessiestate."],"ref":"https://learn.microsoft.com/azure/redis/tutorial-agent-memory"},{"id":"1.2.3-03","obj":"1.2.3","difficulty":"medium","type":"single","stem":"Litware, Inc. offers a multitenant agent platform that stores conversation turns in Azure Cosmos DB for NoSQL. The platform has thousands of tenants. Each tenant runs many concurrent conversation threads, and the largest tenants exceed 20 GB of data. Tenant-level queries must avoid full cross-partition scans, and the cost per tenant must stay low.\n\nWhich partition strategy should you use?","choices":["a partition key of /threadId","a partition key of /tenantId","a hierarchical partition key of /tenantId and then /threadId","a separate Azure Cosmos DB account for each tenant"],"answer":[2],"explanation":"Een hierarchische partition key met tenantId als eerste en threadId als tweede niveau houdt threads bij elkaar, groepeert ze per tenant voor isolatie en tenant-queries, en schaalt voorbij de logische limiet van 20 GB. Een account per tenant is duurder.","rationale":["Alleen /threadId maakt tenant-queries cross-partition en geeft geen tenant-isolatie.","Alleen /tenantId loopt vast op de logische partitielimiet van 20 GB voor grote tenants.","Juist: hierarchische partitionering combineert tenant-isolatie, thread-localiteit en schaal voorbij 20 GB.","Account-per-tenant is bedoeld voor tenants met sterke isolatie-eisen en is te duur voor duizenden tenants."],"ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/agentic-memories"},{"id":"1.2.3-04","obj":"1.2.3","difficulty":"medium","type":"single","stem":"Margie's Travel has a Foundry agent that plans trips. The agent must remember each user's travel preferences across sessions and devices. Memories must be isolated per user, managed by the platform, and users must be able to ask the agent to forget specific information immediately.\n\nWhich component should you use?","choices":["a Foundry Agent Service memory store with the scope set to the user ID","the Cosmos DB chat history provider in Microsoft Agent Framework","Microsoft Agent Framework workflow checkpoints","a Foundry IQ knowledge base"],"answer":[0],"explanation":"Memory in Foundry Agent Service is een managed long-term geheugen dat continuiteit over sessies en apparaten geeft. De scope-parameter segmenteert geheugen per gebruiker, en directe remember-or-forget commando's ondersteunen expliciete vergeetverzoeken.","rationale":["Juist: een memory store met user-scope geeft beheerd, geisoleerd long-term geheugen met forget-ondersteuning.","De chat history provider bewaart exacte transcripts, geen geextraheerde voorkeuren.","Checkpoints bewaren workflow-state voor hervatten, geen gebruikersgeheugen over sessies.","Een knowledge base levert enterprise-content voor grounding, geen persoonlijke voorkeuren."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"1.2.3-05","obj":"1.2.3","difficulty":"hard","type":"single","stem":"Litware, Inc. stores two tiers of agent state in one Azure Cosmos DB for NoSQL container:\n\n- Session state items, which must be deleted 24 hours after their last update. The application writes each session item with a ttl property of 86400.\n- Shared team state items, which have no ttl property and must be kept until the application deletes them.\n\nThe DefaultTimeToLive property of the container is not set. After a week, none of the session state items have been deleted. You must not modify the shared team state items.\n\nWhat should you do?","choices":["Set DefaultTimeToLive on the container to -1.","Set DefaultTimeToLive on the container to 86400.","Remove the ttl property from the session state items.","Set the ttl property of the shared team state items to -1."],"answer":[0],"explanation":"Een ttl op itemniveau werkt alleen als DefaultTimeToLive op de container aanwezig is en niet null is. Met DefaultTimeToLive op -1 verlopen items standaard niet, maar items met een eigen ttl verlopen na die waarde. Zo verdwijnen de sessie-items na 24 uur en blijft de teamstate zonder wijziging bewaard.","rationale":["Juist: -1 schakelt TTL in zonder standaardverloop, zodat alleen items met een eigen ttl verlopen.","Fout: dan verloopt ook de teamstate zonder ttl na 24 uur, tenzij u die items wijzigt.","Fout: zonder container-TTL verlopen de items dan nog steeds niet.","Fout: dit wijzigt de teamstate, en zolang de container-TTL niet is ingesteld heeft een item-ttl geen effect."],"ref":"https://learn.microsoft.com/azure/cosmos-db/time-to-live"},{"id":"1.2.3-06","obj":"1.2.3","difficulty":"hard","type":"single","stem":"Graphic Design Institute uses an existing Azure Managed Redis instance for short-term agent session memory. The instance was created without Redis modules. The team now needs long-term semantic memory in the same data platform, storing extracted facts as JSON documents with embeddings and retrieving them by vector similarity with metadata filters.\n\nWhat should you do?","choices":["Enable the RediSearch and RedisJSON modules on the existing instance.","Scale the existing instance to a larger SKU.","Create a new instance with RediSearch and RedisJSON, and migrate the data.","Store the embeddings in Redis Streams that are capped by MAXLEN."],"answer":[2],"explanation":"Long-term semantisch geheugen vereist RediSearch voor vectoren en RedisJSON voor JSON-documenten. Modules kunnen alleen bij het aanmaken van een Azure Managed Redis-instantie worden ingeschakeld en niet later worden toegevoegd, dus is een nieuwe instantie nodig.","rationale":["Modules kunnen niet aan een bestaande instantie worden toegevoegd.","Een grotere SKU voegt geen modules toe.","Juist: alleen een nieuwe instantie met RediSearch en RedisJSON ondersteunt vector search op JSON-documenten.","Streams zijn bedoeld voor tool-events en ondersteunen geen vector similarity search."],"ref":"https://learn.microsoft.com/azure/redis/tutorial-agent-memory"},{"id":"1.2.4-01","obj":"1.2.4","difficulty":"easy","type":"single","stem":"Alpine Ski House has an agent that generates Python code to analyze files that users upload. The generated code is untrusted. Each execution must run in a Hyper-V isolated sandbox that starts in milliseconds from a prewarmed pool and blocks outbound network requests by default.\n\nWhich compute component should you use?","choices":["Azure Container Apps dynamic sessions","Azure Container Instances","Azure Functions on the Flex Consumption plan","an Azure Kubernetes Service (AKS) user node pool"],"answer":[0],"explanation":"Dynamic sessions in Azure Container Apps bieden Hyper-V geisoleerde sandboxes uit prewarmed session pools, bedoeld voor LLM-gegenereerde of andere untrusted code. Outbound netwerkverkeer is standaard geblokkeerd.","rationale":["Juist: dynamic sessions combineren Hyper-V-isolatie, prewarmed pools en standaard geblokkeerde egress.","Container Instances hebben geen prewarmed session pool voor milliseconde-allocatie per uitvoering.","Functions zijn event-driven compute, niet bedoeld als Hyper-V-sandbox voor untrusted code.","Een AKS node pool vereist clusterbeheer en biedt geen Hyper-V-sessie per uitvoering uit een pool."],"ref":"https://learn.microsoft.com/azure/container-apps/sessions"},{"id":"1.2.4-02","obj":"1.2.4","difficulty":"easy","type":"single","stem":"Trey Research has agent orchestration code written with LangGraph. The team wants to run it on a Microsoft-managed platform without configuring containers, web servers, or scaling rules. Each deployed agent must receive a dedicated Microsoft Entra identity, and files written during a session must survive idle periods.\n\nWhich compute option should you use?","choices":["a prompt agent in Foundry Agent Service","a hosted agent in Foundry Agent Service","Azure App Service","Azure Kubernetes Service (AKS)"],"answer":[1],"explanation":"Hosted agents draaien eigen frameworkcode (zoals LangGraph) als container op beheerde infrastructuur. Het platform regelt schaling, een eigen Entra agent identity en persistente sessiestate in $HOME over idle-periodes.","rationale":["Een prompt agent wordt alleen met prompts en toolconfiguratie gedefinieerd en draait geen eigen LangGraph-code.","Juist: hosted agents combineren eigen code met beheerde schaling, identity en sessiepersistentie.","App Service vereist eigen webserver- en schaalconfiguratie en geeft geen agent identity.","AKS vereist clusterbeheer en eigen schaalregels."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agents"},{"id":"1.2.4-03","obj":"1.2.4","difficulty":"medium","type":"single","stem":"Wide World Importers runs a hosted agent version that is allocated 2 vCPU and 4 GiB of memory. The agent handles high concurrency. In the linked Application Insights resource, a representative workload shows sustained CPU peaks of 25 percent and memory peaks of 30 percent of the allocation. Finance asks you to reduce compute cost without reducing throughput.\n\nWhat should you do?","choices":["Edit the cpu and memory values of the current agent version.","Configure a lower maximum replica count for the agent.","Increase the idle timeout of the agent to 60 minutes.","Create a new agent version with smaller cpu and memory values."],"answer":[3],"explanation":"Hosted agents schalen per sessie; cpu en memory gelden per sessie en de kosten vermenigvuldigen met de concurrency. Bij pieken ver onder de allocatie verlaag je die in een nieuwe versie, omdat versies immutable zijn, en test je opnieuw.","rationale":["Agentversies zijn immutable; een wijziging vereist een nieuwe versie.","Hosted agents hebben geen replica count; ze schalen per sessie.","Een langere idle timeout houdt compute langer actief en verhoogt de kosten.","Juist: een nieuwe versie met kleinere allocatie verlaagt de kosten per sessie; test daarna opnieuw."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agents"},{"id":"1.2.4-04","obj":"1.2.4","difficulty":"medium","type":"single","stem":"City Power & Light runs a customer service agent in production. Traffic is predictable and the agent is latency-sensitive. Occasionally, traffic bursts exceed the planned capacity, and requests during these bursts must not fail with HTTP 429 errors.\n\nWhich model deployment configuration should you specify?","choices":["a provisioned deployment with spillover","a provisioned deployment without spillover","a standard deployment","a global batch deployment"],"answer":[0],"explanation":"Provisioned throughput geeft gereserveerde capaciteit en een latency-target voor voorspelbaar productieverkeer. Spillover stuurt overflow-requests (zoals bij een 429) automatisch naar een standard deployment, zodat bursts niet falen.","rationale":["Juist: PTU voor voorspelbare latency plus spillover naar een standard deployment voor bursts.","Zonder spillover leveren bursts boven de PTU-capaciteit 429-fouten op.","Standard heeft geen latency-SLA en variabele latency bij hoge, consistente volumes.","Batch is asynchroon zonder latency-eisen en ongeschikt voor interactieve agents."],"ref":"https://learn.microsoft.com/azure/foundry/openai/concepts/provisioned-throughput"},{"id":"1.2.4-05","obj":"1.2.4","difficulty":"hard","type":"multi","stem":"Consolidated Messenger is designing compute for two components of a multi-agent solution:\n\n- Orchestrator: an HTTP service that coordinates agents, uses Dapr for service invocation, and must scale to zero per app. The operations team does not want to manage clusters.\n- Ingestion: code that runs when new documents arrive, has sporadic traffic with sudden spikes, must use scale-to-zero billing, and is deployed as code without containers.\n\nWhich two compute choices should you recommend? Each correct answer presents part of the solution.","choices":["Azure Container Apps for the orchestrator","Azure Functions on the Flex Consumption plan for ingestion","Azure Kubernetes Service (AKS) for the orchestrator","Azure App Service for ingestion","Azure Container Instances for the orchestrator"],"answer":[0,1],"explanation":"Container Apps biedt ingebouwde microservice-primitieven zoals Dapr en per-app scale to zero zonder clusterbeheer. Functions op Flex Consumption past bij event-driven, piekerig verkeer met scale-to-zero facturering en draait code zonder containers.","rationale":["Juist: Container Apps levert Dapr en scale to zero zonder clusterbeheer.","Juist: Flex Consumption is serverless, trigger-gebaseerd en schaalt naar nul.","AKS vereist clusterbeheer, wat het team expliciet wil vermijden.","App Service schaalt niet naar nul.","Container Instances bieden geen Dapr-integratie of per-app microservice-schaling."],"ref":"https://learn.microsoft.com/azure/architecture/microservices/design/compute-options"},{"id":"1.2.4-06","obj":"1.2.4","difficulty":"hard","type":"single","stem":"Contoso Suites runs an agent fleet that uses a workload-dedicated provisioned (PTU) deployment in Region A. The company also has an enterprise PTU pool in Region B and a Standard deployment. Reliability requirements state that if the workload PTU deployment is unavailable, requests must fail over first to the enterprise PTU pool and then to the Standard deployment. An engineer proposes enabling spillover on the workload PTU deployment and targeting the enterprise PTU pool.\n\nWhat should you do instead?","choices":["Move the enterprise PTU pool to Region A.","Configure the failover chain in Azure API Management by using priority-based backend load balancing.","Replace both PTU deployments with a Data Zone Batch deployment.","Enable spillover on the enterprise PTU pool and target the workload PTU deployment."],"answer":[1],"explanation":"Spillover routeert overflow alleen naar een overeenkomstige Standard deployment; automatische PTU-naar-PTU failover is niet gedocumenteerd. Configureer de failoverketen in een gateway zoals API Management met priority-based load balancing en circuit breakers, en houd PTU-pools in verschillende regio's.","rationale":["Beide PTU-pools in dezelfde regio verliezen bij een regionale storing tegelijk capaciteit.","Juist: API Management-backends met prioriteiten realiseren workload PTU -> enterprise PTU -> Standard.","Batch is asynchroon en voldoet niet aan interactieve latency-eisen.","Spillover kan niet naar een andere PTU-deployment wijzen; het richt zich op een Standard deployment."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/high-availability-resiliency"},{"id":"1.2.5-01","obj":"1.2.5","difficulty":"easy","type":"single","stem":"Coho Vineyard is enabling tracing for prompt agents and hosted agents in a Foundry project. Developers must be able to inspect the traces in the Foundry portal and query them later by using Kusto Query Language (KQL).\n\nWhich component should you connect to the Foundry project?","choices":["an Azure Data Explorer cluster","an Azure Event Hubs namespace","an Application Insights resource","an Azure Storage account"],"answer":[2],"explanation":"Foundry slaat traces op in Azure Monitor Application Insights volgens de OpenTelemetry semantic conventions. Na het koppelen van Application Insights aan het project zie je traces in de portal en kun je ze met KQL bevragen.","rationale":["Azure Data Explorer is niet de trace-store die Foundry gebruikt.","Event Hubs is een streaming-ingestieservice, geen trace-viewer voor de Foundry-portal.","Juist: Application Insights is de trace-backend van Foundry.","Een storage account is geen ondersteunde trace-backend voor de Foundry-portal."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-setup"},{"id":"1.2.5-02","obj":"1.2.5","difficulty":"easy","type":"single","stem":"Wingtip Toys runs a multi-agent solution in which an orchestrator in Azure Container Apps calls a hosted agent in Foundry Agent Service, which calls an MCP server in Azure Functions. Operations needs one end-to-end trace that correlates spans across all three services.\n\nWhich standard should the services use to propagate trace context?","choices":["CloudEvents","JSON-RPC 2.0","the Azure Monitor common alert schema","W3C Trace Context"],"answer":[3],"explanation":"De multi-agent semantic conventions in Foundry bouwen voort op OpenTelemetry en W3C Trace Context. Door traceparent-headers te propageren worden spans van verschillende services aan elkaar gekoppeld in een trace.","rationale":["CloudEvents beschrijft event-payloads, geen trace-correlatie.","JSON-RPC 2.0 is een berichtformaat (gebruikt door MCP en A2A), geen standaard voor trace context.","Het common alert schema beschrijft alert-payloads in Azure Monitor.","Juist: W3C Trace Context propageert trace-ID's tussen services."],"ref":"https://learn.microsoft.com/azure/foundry/observability/concepts/trace-agent-concept"},{"id":"1.2.5-03","obj":"1.2.5","difficulty":"medium","type":"single","stem":"Southridge Video has agents built with Microsoft Agent Framework and LangGraph that emit OpenTelemetry GenAI spans to Application Insights. Engineers need structured queries over the reasoning path of each run, including the exact arguments that an agent passed to each tool. The query must work for both frameworks.\n\nWhich span attribute should the query target?","choices":["gen_ai.agent.id on invoke_agent spans","gen_ai.tool.call.arguments on execute_tool spans","gen_ai.tool.call.result on execute_tool spans","gen_ai.tool.definitions on invoke_agent spans"],"answer":[1],"explanation":"Volgens de OpenTelemetry GenAI conventions registreert gen_ai.tool.call.arguments op execute_tool spans de argumenten van een toolaanroep. Omdat beide frameworks deze conventies volgen, werkt de query over frameworks heen; planning zie je in plan-spans.","rationale":["gen_ai.agent.id identificeert de agent, niet de toolargumenten.","Juist: dit attribuut bevat de argumenten die aan de tool zijn doorgegeven.","gen_ai.tool.call.result bevat het resultaat van de tool, niet de input.","gen_ai.tool.definitions beschrijft beschikbare tools, niet wat in een run werd aangeroepen."],"ref":"https://learn.microsoft.com/azure/foundry/observability/concepts/trace-agent-concept"},{"id":"1.2.5-04","obj":"1.2.5","difficulty":"medium","type":"single","stem":"Litware, Inc. has a planner agent that calls a GPT-5 series reasoning model through the Azure OpenAI Responses API. Engineers must keep a structured log of how the planner agent reasoned before it chose each tool, so that they can review the reasoning path of failed runs. The logged reasoning must be human-readable, and the solution must use a supported method.\n\nWhat should you do?","choices":["Set reasoning.summary to auto and log the reasoning summary items of each response.","Add reasoning.encrypted_content to the include parameter and log the returned items.","Instruct the model in the developer message to output its full chain of thought.","Set reasoning_effort to high and log the reasoning_tokens value of each response."],"answer":[0],"explanation":"De reasoning summary parameter (auto, concise of detailed) is de ondersteunde manier om een leesbare samenvatting van de redenering van een reasoning model te krijgen, die je per stap kunt loggen voor debugging. Andere methoden om ruwe reasoning te extraheren worden niet ondersteund en kunnen de Acceptable Use Policy schenden.","rationale":["Juist: reasoning summaries geven een leesbare weergave van de redenering en zijn de ondersteunde methode.","Encrypted reasoning items zijn versleuteld en dienen om reasoning-context door te geven in stateless gesprekken, niet om leesbaar te loggen.","Ruwe reasoning opvragen via de prompt wordt niet ondersteund en kan leiden tot throttling of schorsing.","reasoning_tokens is alleen een aantal tokens; het laat niet zien hoe het model heeft geredeneerd."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/reasoning"},{"id":"1.2.5-05","obj":"1.2.5","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines is debugging a Foundry agent in a development environment by using client-side tracing in Python. Engineers must see the message contents and the tool call parameters in each span so that they can reconstruct the reasoning path. The baggage header must not be propagated.\n\n```python\nimport os\nfrom azure.ai.projects.telemetry import AIProjectInstrumentor\n\nos.environ[\"AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING\"] = \"true\"\nos.environ[\"<setting>\"] = \"true\"\n\nAIProjectInstrumentor().instrument()\n```\n\nWhich value should you use for <setting>?","choices":["AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA","AZURE_TRACING_GEN_AI_INSTRUMENT_RESPONSES_API","AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE","OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT"],"answer":[3],"explanation":"OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT legt berichtinhoud en toolparameters vast in traces en staat standaard uit. Gebruik dit alleen in development; in productie kan het persoonsgegevens vastleggen.","rationale":["Deze instelling voegt afbeeldingen en bestandsdata toe aan spans, niet berichtinhoud en toolparameters.","Deze instelling staat standaard al aan en regelt auto-instrumentatie van de Responses API, niet content recording.","Deze instelling propageert juist de baggage-header, wat expliciet niet mag.","Juist: deze variabele schakelt content recording van berichten en toolparameters in."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"1.2.5-06","obj":"1.2.5","difficulty":"hard","type":"multi","stem":"Fabrikam Residences runs a multi-agent workflow built with Microsoft Agent Framework for Python. Some production runs fail intermittently. Engineers must be able to:\n\n- Reproduce a failing run from its recorded input and intermediate state on a different instance.\n- Turn the failing production interactions into a reusable test set for regression checks.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Configure the workflow with durable checkpoint storage, such as CosmosCheckpointStorage, and rehydrate runs from checkpoints.","Add the failing traces to an evaluation dataset from the trace view in the Foundry portal.","Configure the workflow with in-memory checkpoint storage.","Enable baggage propagation for outbound requests.","Lower the Azure Monitor sampling ratio to 0.1."],"answer":[0,1],"explanation":"Checkpoints in duurzame opslag leggen de volledige workflowstate per superstep vast; vanaf Python 1.13 maken entry checkpoints de complete run replaybaar en kun je een nieuwe instantie rehydrateren. Traces toevoegen aan een dataset levert een herbruikbare testset voor regressie-evaluaties.","rationale":["Juist: duurzame checkpoints maken reproduceerbare replay op een andere instantie mogelijk.","Juist: falende traces worden een geversioneerde dataset voor regressietests.","In-memory opslag gaat verloren bij een herstart en werkt niet over instanties heen.","Baggage propageert extra context en kan PII blootstellen; het legt geen replaybare state vast.","Een lagere sampling ratio laat juist meer falende runs weg."],"ref":"https://learn.microsoft.com/agent-framework/workflows/checkpoints"},{"id":"1.2.6-01","obj":"1.2.6","difficulty":"easy","type":"single","stem":"Adventure Works Cycles runs a customer support agent in Foundry Agent Service. The team needs to detect quality regressions in production as they happen by evaluating a sample of live agent traffic.\n\nWhich monitoring capability should you configure?","choices":["cluster analysis","continuous evaluation","red team scans","scheduled evaluation with a golden dataset"],"answer":[1],"explanation":"Continuous evaluation sampled live traffic terwijl het binnenkomt en draait evaluators op productie-output, zodat kwaliteitsregressie direct zichtbaar wordt in het Agent Monitoring Dashboard.","rationale":["Cluster analysis groepeert resultaten van bestaande evaluaties; het samplet geen live traffic.","Juist: continuous evaluation evalueert live traffic doorlopend.","Red team scans testen adversariaal op veiligheidsrisico's, niet op kwaliteitsregressie van echte traffic.","Een scheduled evaluation draait op een vast schema tegen een vaste dataset, niet op live traffic."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"1.2.6-02","obj":"1.2.6","difficulty":"easy","type":"single","stem":"The Phone Company has an Azure Monitor log alert rule that fires when the error rate of an agent exceeds a threshold. When the alert fires, a workflow must automatically disable the failing agent endpoint and post a message to Microsoft Teams.\n\nWhich component should you attach to the alert rule?","choices":["an action group with a Logic Apps workflow action","an alert processing rule that suppresses duplicate alerts","a diagnostic setting that streams the logs to Event Hubs","an Azure Monitor workbook that visualizes the error rate"],"answer":[0],"explanation":"Action groups definieren wie een melding krijgt en welke automatische acties starten wanneer een alert afgaat, zoals een Logic Apps-workflow, Azure Function of runbook. Zo realiseer je geautomatiseerde remediatie.","rationale":["Juist: een action group start de Logic Apps-workflow voor remediatie en de Teams-melding.","Een alert processing rule bewerkt gefirede alerts (onderdrukken of action groups toevoegen), maar voert zelf geen workflow uit.","Een diagnostic setting routeert logs en metrics, maar reageert niet op alerts.","Een workbook visualiseert data en voert geen acties uit."],"ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/action-groups"},{"id":"1.2.6-03","obj":"1.2.6","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. sends a custom metric named TokensPerRun to Azure Monitor for each of its 30 agents, with the agent name as a dimension. Normal values follow daily and weekly traffic patterns, and the team does not know which fixed value indicates abnormal behavior for each agent. You need an alert that detects significant deviations from the learned behavior of every agent by using a single alert rule.\n\nWhich alert configuration should you use?","choices":["A metric alert rule that uses dynamic thresholds","A metric alert rule that uses a static threshold","Application Insights smart detection","A Resource Health alert on the Foundry resource"],"answer":[0],"explanation":"Dynamic thresholds gebruiken machine learning op historische data om per tijdreeks seizoenspatronen (per uur, dag en week) te leren en afwijkingen te detecteren. Eén regel kan honderden tijdreeksen over dimensies bewaken, zodat je geen drempel per agent hoeft te kennen.","rationale":["Juist: dynamic thresholds leren het normale gedrag per tijdreeks en werken met één regel over meerdere dimensies.","Een static threshold vereist een vaste waarde die het team juist niet kent en past niet bij de seizoenspatronen.","Smart detection richt zich op afwijkingen in failure rates en performance van requests, niet op een eigen custom metric zoals TokensPerRun.","Resource Health meldt platformproblemen met de resource zelf, niet afwijkend gedrag van agents."],"ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-dynamic-thresholds"},{"id":"1.2.6-04","obj":"1.2.6","difficulty":"medium","type":"single","stem":"First Up Consultants ran several evaluation runs for a multi-agent solution. Hundreds of samples failed. The team needs to group the failures by similar problems, see the distribution across error categories, and get recommended next steps for each group.\n\nWhich capability should you use?","choices":["the Agent Monitoring Dashboard","cluster analysis","intelligent sampling","a scheduled red team scan"],"answer":[1],"explanation":"Cluster analysis groepeert evaluatiesamples met vergelijkbare problemen via embedding-based clustering, toont de verdeling per foutcategorie en geeft per cluster een diagnose en aanbevelingen.","rationale":["Het dashboard toont metrics en trends, maar groepeert falende samples niet per probleemtype.","Juist: cluster analysis identificeert terugkerende faalpatronen met aanbevelingen.","Intelligent sampling selecteert representatieve traces, maar analyseert geen faalpatronen.","Een red team scan zoekt beveiligingsrisico's, geen groepering van evaluatiefouten."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/cluster-analysis"},{"id":"1.2.6-05","obj":"1.2.6","difficulty":"hard","type":"single","stem":"Contoso, Ltd. runs a multi-agent app on Azure App Service. A Coordinator agent delegates to four specialist agents. Each agent is built with Microsoft Agent Framework, is wrapped with UseOpenTelemetry, and exports to Application Insights. To track cross-agent coordination, operations uses the Agents view in Application Insights.\n\nAfter each app restart, the specialists appear as new rows, and their call and token metrics are split across many entries. Each agent ID is generated as a new GUID when the application starts.\n\nWhat should you do?","choices":["Enable sensitive data capture on each agent.","Set the Azure Monitor exporter sampling ratio to 1.0.","Enable the codeless Application Insights agent on the web app.","Assign each agent a stable, unique ID that is read from configuration."],"answer":[3],"explanation":"Per-agent metrics in de Agents-view hangen af van gen_ai.agent.id en gen_ai.agent.name. Een ID die bij elke start opnieuw wordt gegenereerd versplintert de telemetrie; gebruik een stabiele, unieke ID uit configuratie.","rationale":["Sensitive data capture voegt berichtinhoud toe, maar verandert de agentidentificatie niet.","Sampling op 1.0 voorkomt ontbrekende rijen bij laag volume, maar lost wisselende ID's niet op.","De codeless agent moet juist uit staan bij in-code OpenTelemetry om conflicten te voorkomen.","Juist: stabiele ID's uit configuratie houden metrics per agent bij elkaar."],"ref":"https://learn.microsoft.com/azure/app-service/tutorial-ai-agent-monitoring-dotnet"},{"id":"1.2.6-06","obj":"1.2.6","difficulty":"hard","type":"single","stem":"Contoso, Ltd. has one log search alert rule that monitors five agent apps named Agent1 to Agent5 in a resource group. The rule splits alerts by resource so that each fired alert targets the affected app. The alert rule uses an action group with an Automation Runbook action that restarts the failing agent.\n\nAgent3 and Agent4 have a planned maintenance window every Sunday from 01:00 to 05:00. During that window, the following requirements apply:\n\n- The runbook must not run for alerts from Agent3 and Agent4.\n- Alerts from the other three agents must still trigger remediation.\n- Fired alerts from Agent3 and Agent4 must remain visible for later review.\n\nYou need to meet the requirements by using the least administrative effort.\n\nWhat should you do?","choices":["Create an alert processing rule that is scoped to Agent3 and Agent4 and suppresses notifications on a weekly schedule.","Disable the alert rule at the start of each maintenance window and enable it again after the window ends.","Remove the Automation Runbook action from the action group at the start of each maintenance window.","Create an alert processing rule that is scoped to Agent3 and Agent4 and applies a second action group on a weekly schedule."],"answer":[0],"explanation":"Een alert processing rule met de actie Suppress notifications verwijdert alle action groups van de fired alerts binnen de scope, terwijl de alerts zelf zichtbaar blijven. Met een recurring schedule en een scope op alleen Agent3 en Agent4 blijft remediation voor de andere agents werken, zonder handmatige stappen per venster.","rationale":["Juist: suppression op een terugkerend schema en beperkte scope voorkomt de runbook-run, terwijl alerts zichtbaar blijven en de andere agents gewoon remediation krijgen.","Het uitschakelen van de regel raakt alle vijf agents en zorgt dat er helemaal geen alerts fired worden, dus ook geen zichtbare alerts.","Het verwijderen van de runbook-actie stopt remediation ook voor Agent1, Agent2 en Agent5 en vereist elke week handwerk.","Apply action groups voegt action groups toe; de bestaande runbook-actie blijft dan gewoon draaien."],"ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-processing-rules"},{"id":"1.2.7-01","obj":"1.2.7","difficulty":"easy","type":"single","stem":"Wide World Importers has a team of developers who build hosted agents. Every developer must get an identical containerized development environment in Visual Studio Code and GitHub Codespaces. The Azure Developer CLI (azd) and its Foundry extensions must be available as soon as the container starts.\n\nWhat should you add to the repository?","choices":["an azure.yaml file that defines the agent services","a devcontainer.json file that adds the azd feature with the extensions option","a Python virtual environment that is committed to the repository","a setup script that installs the Foundry Dev Pack on each workstation"],"answer":[1],"explanation":"Een dev container definieert een reproduceerbare omgeving in .devcontainer/devcontainer.json. De azd Dev Container Feature installeert azd en via de optie extensions ook de opgegeven azd-extensies tijdens de containerbuild.","rationale":["azure.yaml beschrijft services en deployment voor azd, maar levert geen ontwikkelomgeving.","Juist: de azd feature met extensions maakt een identieke container met voorgeinstalleerde tools.","Een virtual environment isoleert Python-packages, maar is geen container en hoort niet in source control.","DevPack per werkstation installeren levert geen identieke containeromgeving en werkt niet in Codespaces."],"ref":"https://learn.microsoft.com/azure/developer/azure-developer-cli/install-azd"},{"id":"1.2.7-02","obj":"1.2.7","difficulty":"easy","type":"single","stem":"Developers at Bellows College want to browse the Foundry model catalog, create hosted agent projects, test agents locally with Agent Inspector, inspect local traces, and deploy hosted agents without leaving Visual Studio Code.\n\nWhich Visual Studio Code extension should they install?","choices":["C# Dev Kit","GitHub Codespaces","Microsoft Foundry Toolkit for Visual Studio Code","Python extension for Visual Studio Code"],"answer":[2],"explanation":"Microsoft Foundry Toolkit for Visual Studio Code brengt Foundry-resources, de model catalog, hosted-agent deployment, Agent Inspector, lokale tracing en playgrounds naar VS Code.","rationale":["C# Dev Kit biedt taalondersteuning voor C#, geen Foundry-functies.","De Codespaces-extensie opent cloud-ontwikkelomgevingen, maar levert geen Foundry-tooling.","Juist: Foundry Toolkit dekt model catalog, agentcreatie, lokale tests, tracing en deployment.","De Python-extensie biedt taalondersteuning, geen Foundry-integratie."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/install-foundry-toolkit-visual-studio-code"},{"id":"1.2.7-03","obj":"1.2.7","difficulty":"medium","type":"single","stem":"Best For You Organics Company uses GitHub Copilot in Visual Studio Code to write agent code in Python and infrastructure in Bicep in the same repository. The team wants Copilot to apply its Python conventions for agent code automatically in ask, agent, and inline completion modes, but the conventions must not apply to the Bicep files.\n\nWhich file should you create?","choices":[".github/agents/python.agent.md",".github/copilot-instructions.md",".github/instructions/python.instructions.md","custom-instructions.md in the repository root"],"answer":[2],"explanation":"Custom instructions in .github/instructions/<naam>.instructions.md worden via de front matter-key applyTo gescoped op een glob zoals **/*.py. Copilot past ze automatisch toe op alle matchende bestanden, en de Bicep-bestanden vallen erbuiten.","rationale":["Een .agent.md definieert een custom agent die je moet selecteren; het past niet automatisch toe per bestandstype.","copilot-instructions.md is repository-breed en zou ook voor Bicep gelden.","Juist: een scoped instructions-bestand met applyTo: **/*.py geldt alleen voor Python-bestanden.","Een bestand met die naam wordt niet herkend als Copilot-instructiebestand."],"ref":"https://learn.microsoft.com/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions"},{"id":"1.2.7-04","obj":"1.2.7","difficulty":"medium","type":"single","stem":"A developer at Proseware, Inc. deploys a Python hosted agent by calling create_version_from_code in the Azure AI Projects SDK. The code is packaged as a zip file of the project folder, so main.py and requirements.txt are located in a src/agent subfolder inside the zip. Provisioning fails with \"Hosted agent provisioning failed\". The model deployment name in the .env file exists in the target project.\n\nWhat should you do?","choices":["Install the dependencies globally by using sudo pip install before you create the zip.","Increase the cpu allocation in the hosted agent definition.","Request the Contributor role on the resource group.","Rebuild the zip so that main.py and requirements.txt are at the root."],"answer":[3],"explanation":"Bij code-deployment lost Foundry de dependencies op uit requirements.txt en bouwt het agent remote. Daarvoor moeten main.py en requirements.txt in de root van de zip staan; dat is de gedocumenteerde oorzaak van deze fout wanneer de modelnaam klopt.","rationale":["Globale installatie met sudo wordt afgeraden (gebruik een virtual environment) en de remote build gebruikt lokale packages niet.","Meer cpu lost een verkeerde zipstructuur niet op.","Contributor lost AuthorizationFailed tijdens provisioning op, niet een mislukte provisioning door een verkeerde zipstructuur.","Juist: de entry point en het dependencybestand moeten in de root van de zip staan."],"ref":"https://learn.microsoft.com/azure/foundry/agents/quickstarts/quickstart-hosted-agent"},{"id":"1.2.7-05","obj":"1.2.7","difficulty":"hard","type":"single","stem":"Margie's Travel is starting a new hosted agent from a Foundry sample by using the Azure Developer CLI (azd). The agent must use a new Foundry project and a new model deployment. Developers must test the agent locally against the new model deployment before they deploy it, and then invoke the deployed agent.\n\nWhich sequence of commands should you run?","choices":["azd ai agent init -> azd provision -> azd ai agent run -> azd deploy -> azd ai agent invoke","azd provision -> azd ai agent init -> azd deploy -> azd ai agent run -> azd ai agent invoke","azd ai agent init -> azd deploy -> azd provision -> azd ai agent invoke -> azd ai agent run","azd ai agent init -> azd ai agent run -> azd ai agent invoke -> azd provision -> azd deploy"],"answer":[0],"explanation":"Eerst scaffold azd ai agent init het project en de agentdefinitie, daarna maakt azd provision het Foundry-project en de modeldeployment aan. azd ai agent run test lokaal tegen die resources, azd deploy uploadt en bouwt het agent, en azd ai agent invoke roept het gedeployde agent aan.","rationale":["Juist: init, provision, lokaal testen, deployen en daarna aanroepen.","Provisionen voor init heeft geen azure.yaml-definitie, en lokaal testen na deploy schendt de eis.","Deployen voor provision faalt omdat de doelresources nog niet bestaan.","Lokaal draaien voor provision werkt niet, omdat de nieuwe modeldeployment nog niet bestaat."],"ref":"https://learn.microsoft.com/azure/foundry/agents/quickstarts/quickstart-hosted-agent"},{"id":"1.2.7-06","obj":"1.2.7","difficulty":"hard","type":"single","stem":"Developers at Lucerne Publishing use GitHub Copilot CLI as their coding agent. They need the Microsoft Foundry Skill so that Copilot follows Foundry workflows for deployment, evaluation, and troubleshooting. The same installation must also configure the Azure MCP Server and the Foundry MCP Server, and the team must be able to update all three together later.\n\nWhat should you do?","choices":["Add the microsoft/azure-skills plugin marketplace in Copilot CLI and install the azure@azure-skills plugin.","Run npx skills add https://github.com/microsoft/azure-skills --skill microsoft-foundry.","Install Microsoft Foundry Toolkit for Visual Studio Code.","Add a .github/copilot-instructions.md file that describes the Foundry workflows."],"answer":[0],"explanation":"De Azure Skills Plugin bundelt de Foundry Skill, de Azure MCP Server-configuratie en de Foundry MCP Server in een installatie, en is samen bij te werken met /plugin update. Het skill-only pad installeert alleen de workflow-instructies.","rationale":["Juist: de plugin installeert en updatet skill en beide MCP-configuraties samen in Copilot CLI.","npx skills add installeert alleen de skill-inhoud, zonder MCP server-configuratie.","Foundry Toolkit levert de skill in VS Code, niet in Copilot CLI.","Een instructiebestand beschrijft conventies, maar configureert geen MCP servers en levert geen Foundry-subskills."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/use-microsoft-foundry-skill"},{"id":"2.1.1-01","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. is building a classification agent named Agent1 that calls a chat model by using a messages array. Agent1 labels incoming support tickets, and the team wants to show the model three labeled sample tickets so that it infers the expected label format for the current request only, without changing the model weights.\n\nWhich placement should you use for the sample tickets?","choices":["As metadata attached to the request","As a series of example user and assistant messages after the system message","As an assistant message appended after the current user message","As the description field of a function tool definition"],"answer":[1],"explanation":"Few-shot examples worden bij de Chat Completions-structuur toegevoegd als voorbeeld-interacties tussen user en assistant direct na de system message. Ze conditioneren het model alleen voor de huidige inference; de gewichten veranderen niet.","rationale":["Metadata wordt niet als prompttekst aan het model gegeven en stuurt het gedrag dus niet.","Correct: few-shot voorbeelden horen als user/assistant-paren na de system message in de messages array.","Een assistant-bericht na de huidige vraag wordt gezien als het antwoord zelf of als prime, niet als set gelabelde voorbeelden.","Een tool-beschrijving vertelt het model wanneer het een tool moet aanroepen, niet hoe het een ticket moet labelen."],"ref":"https://learn.microsoft.com/azure/foundry/openai/concepts/prompt-engineering"},{"id":"2.1.1-02","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has an agent that summarizes documents uploaded by external partners. A security review finds that partner documents can contain hidden instructions that try to override the agent behavior. You need a prompt technique that transforms the untrusted document text by interleaving a special token throughout the entire text, and warns the model about this transformation in the system message.\n\nWhich technique should you use?","choices":["Chain-of-thought prompting","Few-shot learning","Data marking","Output priming with a cue"],"answer":[2],"explanation":"Data marking is een spotlighting-techniek: een speciaal token wordt door de hele onbetrouwbare tekst heen geplaatst, zodat het model systeeminstructies kan onderscheiden van externe input. Dit helpt tegen indirect prompt injection.","rationale":["Chain-of-thought laat het model stapsgewijs redeneren, maar markeert geen onbetrouwbare input.","Few-shot voorbeelden tonen gewenst gedrag maar transformeren de externe documenttekst niet.","Correct: data marking (spotlighting) interleaved een token door de volledige input en wordt in de system message uitgelegd.","Een cue zet de output in gang in een bepaald formaat, maar beschermt niet tegen ingebedde instructies."],"ref":"https://learn.microsoft.com/security/zero-trust/sfi/defend-indirect-prompt-injection"},{"id":"2.1.1-03","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank publishes a prompt agent named Agent1 in Foundry Agent Service to employees in Microsoft Teams. Prompt engineers save new versions of Agent1 several times per day while they experiment. You need to ensure that employees keep receiving the approved version until a release manager explicitly changes it.\n\nWhat should you configure for the agent endpoint?","choices":["Keep the default version selector that routes traffic to the latest version","Edit the approved version in place for each change","Create a new agent name for each experiment","Pin the version selector to the approved agent version"],"answer":[3],"explanation":"Standaard routeert de version selector 100% van het verkeer naar de nieuwste versie, ook in Teams. Door de selector te pinnen op een specifieke actieve versie veranderen nieuwe versies niets aan wat gebruikers zien totdat je de selector bijwerkt.","rationale":["Always use latest is de default en zou elke opgeslagen experimentversie direct naar Teams pushen.","Agent-versies zijn immutable; je kunt een opgeslagen versie niet in place wijzigen.","Een nieuwe agentnaam per experiment breekt de stabiele identiteit en endpoint en is geen release-control.","Correct: pinnen op een specifieke versie houdt productie stabiel terwijl nieuwe versies worden opgeslagen."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/configure-agent"},{"id":"2.1.1-04","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. builds a support agent by using Microsoft Agent Framework. On every invocation the agent must know the current user's contract tier and preferred language, which are stored in a CRM system. Testing shows that when this information is exposed as a function tool, the model sometimes answers without calling the tool. The information differs per user, and the agent instructions must stay unchanged.\n\nWhat should you implement?","choices":["A context provider that loads the tier and language and injects them before each invocation","A function tool with a more detailed description that tells the model to call it first","Few-shot examples that show answers for each contract tier","Hard-coded tier and language values in the agent instructions"],"answer":[0],"explanation":"Context providers draaien proactief voor elke invocation en injecteren context zonder dat het model hoeft te beslissen. Tools zijn reactief: het model moet zelf besluiten ze aan te roepen. Vuistregel: informatie die er elke keer moet zijn hoort in een context provider.","rationale":["Correct: een context provider injecteert de per-gebruiker data automatisch voor elke run, zonder instructiewijziging.","Een betere tool-beschrijving blijft reactief; het model kan de aanroep nog steeds overslaan.","Few-shot voorbeelden tonen gedrag maar leveren niet de actuele gegevens van de specifieke gebruiker.","Hard-coderen werkt niet omdat de waarden per gebruiker verschillen en de instructies ongewijzigd moeten blijven."],"ref":"https://learn.microsoft.com/agent-framework/journey/adding-context-providers"},{"id":"2.1.1-05","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Relecloud has a research agent that receives retrieved chunks from Azure AI Search and passes them to a chat model. The current prompt places the user question first, then appends all returned chunks, and ends with the instruction \"Use the context if helpful.\" Evaluations show low groundedness, and when the chunks do not contain the answer, the model answers from its training data.\n\nWhich prompt change should you make?","choices":["Move the grounding instructions into the context block and repeat them next to each chunk","Place labeled chunks before the question, require answers from the context only, and define a fallback","Include every returned chunk regardless of relevance score so that the model has more context","Repeat the user question at the end of the prompt and keep the instruction to use the context if helpful"],"answer":[1],"explanation":"Vage grounding-instructies, context na de vraag en geen fallback zijn bekende RAG-anti-patterns. Plaats gelabelde chunks voor de vraag, gebruik een expliciete 'alleen uit context'-instructie en definieer wat het model doet als de context onvoldoende is.","rationale":["Instructies mengen met context is juist een anti-pattern; houd ze in aparte secties.","Correct: context voor de vraag, expliciete grounding-constraint en een fallback adresseren beide symptomen.","Alle chunks zonder relevantiefilter toevoegen introduceert ruis en vergroot het probleem.","De vraag herhalen en de vage instructie behouden verbetert de grounding niet en voegt geen fallback toe."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/rag/rag-prompt-engineering"},{"id":"2.1.1-06","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Tailspin Toys runs a prompt agent named Agent1 in Foundry Agent Service. The instructions were handcrafted, and manual prompt tuning is slow. You need an evaluation-driven process that generates improved instructions and tool descriptions, scores them against a dataset created from Agent1 traces, and keeps the current version available for rollback. The solution must not require code changes.\n\nWhat should you do?","choices":["Create prompt variants in prompt flow and compare them in a batch run","Fine-tune the model deployment by using supervised fine-tuning on the traces","Run the agent optimizer from the Optimize tab and promote the best candidate to a new agent version","Open the current agent version and overwrite its instructions with the best-performing prompt"],"answer":[2],"explanation":"De agent optimizer evalueert een baseline-versie, genereert kandidaten (instructies, tool-beschrijvingen, modelkeuze), scoort ze en laat je de winnaar promoveren naar een nieuwe agent-versie, zonder codewijziging voor prompt agents. De oude versie blijft beschikbaar.","rationale":["Prompt flow wordt uitgefaseerd en is niet het mechanisme voor Foundry prompt agents.","Fine-tuning verandert modelgewichten en is geen prompt-lifecycle-oplossing voor instructies en tool-beschrijvingen.","Correct: optimizer met dataset uit traces en promotie naar een nieuwe versie behoudt rollback.","Agent-versies zijn immutable; overschrijven kan niet en zou rollback onmogelijk maken."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-optimizer-overview"},{"id":"2.1.1-07","obj":"2.1.1","difficulty":"hard","type":"multi","stem":"Proseware, Inc. has an email triage agent that reads inbound messages from external vendors and drafts summaries for a finance team. A red team shows that a vendor email containing hidden text can make the agent reveal its instructions. The agent has read-only access to the mailbox.\n\nWhich three actions should you perform to reduce the risk? Each correct answer presents part of the solution.","choices":["Add a system message instruction to treat the delimited email content as data only and to ignore instructions inside it","Apply spotlighting by using delimiters and data marking on the email text","Screen the email content by using Azure AI Content Safety before it enters the prompt","Insert the email body into the system message so the model processes it with higher priority","Grant the agent write access to the mailbox so that it can quarantine suspicious emails"],"answer":[0,1,2],"explanation":"Tegen indirect prompt injection combineer je een defensieve instructie ('behandel context als data'), spotlighting (delimiters en data marking) en screening van de content met Content Safety. Dit is defense in depth.","rationale":["Correct: een defensieve instructie in de system message is een aanbevolen mitigatie.","Correct: spotlighting helpt het model onderscheid te maken tussen instructies en onbetrouwbare input.","Correct: Content Safety-screening van externe content voordat deze de prompt ingaat is aanbevolen.","Onbetrouwbare content in de system message zetten geeft aanvallersinstructies juist de hoogste prioriteit.","Extra schrijfrechten vergroten het aanvalsoppervlak en botsen met least privilege."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/rag/rag-prompt-engineering"},{"id":"2.1.1-08","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders implements a custom context provider in Microsoft Agent Framework for Python. The provider must add the user's support tier to the agent instructions before the model is called. The same provider instance is attached to one agent that serves many concurrent sessions, and the tier must never leak between sessions.\n\n```python\nclass TierProvider(Context

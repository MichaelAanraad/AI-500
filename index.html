nlimiet. Microsoft adviseert budgets met alerts op subscription- of resource-groupniveau; via action groups kun je bij een drempel automatisering starten.","rationale":["Een export levert data voor analyse, maar geeft geen drempelalerts.","Juist: budgets geven alerts bij drempels en kunnen via action groups automatisering starten.","Deze view toont kosten, maar waarschuwt niet automatisch bij een drempel.","Deze policy meet tokens, niet de uitgaven van de resource group ten opzichte van een budget."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-05","obj":"3.3.4","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has three internal teams that call the same Azure OpenAI deployment from one Foundry project through Azure API Management. Each team sends a team identifier in an x-team-id header. Finance needs monthly token consumption per team for internal chargeback.\n\nWhat should you configure?","choices":["The llm-token-limit policy with a counter-key based on the x-team-id header","A cost analysis filter on the project tag","A metric alert on Processed Prompt Tokens split by deployment","The llm-emit-token-metric policy with a custom dimension based on the x-team-id header"],"answer":[3],"explanation":"llm-emit-token-metric stuurt prompt-, completion- en totale tokens als custom metric naar Application Insights, met custom dimensies zoals een header-waarde. Dat is de basis voor interne chargeback wanneer teams een project en deployment delen.","rationale":["Deze policy begrenst verbruik, maar levert geen rapporteerbare metrics per team.","De teams delen een project, dus de project-tag splitst niet per team.","De teams delen een deployment, dus splitsen op deployment maakt geen onderscheid.","Juist: token-metrics met een team-dimensie maken aggregatie per team mogelijk."],"ref":"https://learn.microsoft.com/azure/api-management/genai-gateway-capabilities"},{"id":"3.3.4-06","obj":"3.3.4","difficulty":"medium","type":"single","stem":"Northwind Traders gives each partner a monthly allowance of 5 million tokens for an agent API in Azure API Management. When a partner exceeds its allowance, requests must be rejected until the next month starts. Partners use separate subscription keys.\n\nWhich configuration should you use?","choices":["A separate TPM allocation for each partner on the shared Azure OpenAI deployment","llm-token-limit with token-quota and a Monthly token-quota-period per subscription ID","quota-by-key with calls and renewal-period, keyed on the subscription ID","llm-token-limit with a tokens-per-minute rate limit, keyed on the subscription ID"],"answer":[1],"explanation":"llm-token-limit ondersteunt naast een rate limit ook een quotum: token-quota over token-quota-period (Hourly tot Yearly). Bij overschrijding krijgt de aanroeper 403 Forbidden tot het quotum reset; met de subscription ID als counter-key geldt dit per partner.","rationale":["TPM-toewijzing is een rate limit per deployment, geen maandquotum per partner.","Juist: token-quota over een maandperiode weigert requests met 403 tot de periode reset.","quota-by-key telt calls, geen tokens, dus het tokentegoed wordt niet bewaakt.","Een TPM-limiet reset elke minuut en dwingt geen maandtegoed af."],"ref":"https://learn.microsoft.com/azure/api-management/llm-token-limit-policy"},{"id":"3.3.4-07","obj":"3.3.4","difficulty":"medium","type":"single","stem":"Adventure Works Cycles has 240,000 TPM of gpt-4o Standard quota in East US. Two existing deployments use 120,000 TPM each. Azure Monitor shows that one of them, Deployment2, uses less than 10 percent of its allocation over the last seven days. A new agent needs a gpt-4o deployment in East US with 60,000 TPM today, and a quota increase cannot be approved in time.\n\nWhat should you do?","choices":["Create the new deployment in a new Azure OpenAI resource in East US","Delete the resource that hosts Deployment2 by using the REST API and redeploy","Submit a quota increase request for gpt-4o in East US","Reduce the TPM assigned to Deployment2 and assign the freed TPM to the new deployment"],"answer":[3],"explanation":"Quota is per regio en model gedeeld over deployments. Microsoft adviseert quota te herverdelen op basis van waargenomen gebruik: verlaag de TPM van onderbenutte deployments om ruimte te maken voor nieuwe. Een nieuwe resource in dezelfde regio helpt niet.","rationale":["Een nieuwe resource in dezelfde regio deelt hetzelfde subscription-quotum, dat al volledig toegewezen is.","Bij verwijderen via de REST API blijft het quotum 48 uur onbeschikbaar tot de resource gepurged is.","Een quotumverhoging wordt niet op tijd goedgekeurd, dus dit voldoet niet aan de eis om vandaag te deployen.","Juist: door ongebruikte TPM vrij te maken kun je binnen het bestaande quotum een nieuwe deployment maken."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota"},{"id":"3.3.4-08","obj":"3.3.4","difficulty":"medium","type":"single","stem":"Alpine Ski House deployed a fine-tuned Azure OpenAI model that the marketing agent uses during a two-week campaign each quarter. Cost analysis shows a steady charge for the model every day, including weeks with no inference calls.\n\nWhat should you do to reduce this cost?","choices":["Delete the deployment after each campaign and redeploy it before the next one","Reduce the TPM assigned to the fine-tuned deployment between campaigns","Configure spillover from the fine-tuned deployment to a standard deployment","Add an llm-token-limit policy with a monthly token quota for the marketing agent"],"answer":[0],"explanation":"Fine-tuned modellen kosten training, inferentie en hosting per uur zolang ze gedeployd zijn, ook bij laag gebruik. Verwijder of schaal deployments die je niet nodig hebt; dat is hier de enige maatregel die de dagelijkse charge stopt.","rationale":["Juist: een fine-tuned deployment kost per uur hosting, ook zonder gebruik.","TPM beinvloedt de rate limit, niet de vaste hostingkosten per uur.","Spillover is voor provisioned deployments en verlaagt hostingkosten niet.","Een tokenlimiet beperkt inferentiekosten, maar de kosten hier zijn hosting zonder inferentie."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-09","obj":"3.3.4","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. emits token metrics from Azure API Management by using llm-emit-token-metric with three custom dimensions: API ID, Cost Center, and User ID. The company has 4,000 users. The monthly chargeback report sums the metric by Cost Center, but token totals from newer users are missing, and the gap grows each week. No errors are returned to callers.\n\nWhat should you do?","choices":["Increase the retention period of the Application Insights resource","Add Client IP as a fourth custom dimension","Set estimate-prompt-tokens to true in the llm-token-limit policy","Remove the User ID dimension so that the metric uses low-cardinality dimensions"],"answer":[3],"explanation":"API Management limiteert elke dimensie tot 100 unieke waarden en elke metric namespace tot 1.000 actieve time series; daarboven worden nieuwe waarden stil weggegooid. Met 4.000 users is User ID de oorzaak; verwijder die dimensie zodat de rapportage per Cost Center volledig is.","rationale":["Retentie bepaalt hoe lang data blijft, niet of nieuwe dimensiewaarden worden geregistreerd.","Nog een hoge-cardinaliteitsdimensie vergroot het aantal time series en verergert het dataverlies.","Dit beinvloedt limiethandhaving, niet het verzamelen van custom metrics.","Juist: met minder unieke waarden blijven dimensies en time series binnen de limieten."],"ref":"https://learn.microsoft.com/azure/api-management/llm-emit-token-metric-policy"},{"id":"3.3.4-10","obj":"3.3.4","difficulty":"hard","type":"single","stem":"Coho Winery wants to reduce billing surprises before it moves a multi-agent solution to production. You need to estimate costs and verify the estimate against actual charges.\n\nWhich sequence of actions should you perform?","choices":["Group costs by Resource and then by Meter in Cost Management -> build an estimate in the Azure pricing calculator -> deploy a small test workload with representative traffic -> compare meter charges to the estimate and adjust the budget","Build an estimate in the Azure pricing calculator -> group costs by Resource and then by Meter in Cost Management -> deploy a small test workload with representative traffic -> compare meter charges to the estimate and adjust the budget","Build an estimate in the Azure pricing calculator -> deploy a small test workload with representative traffic -> compare meter charges to the estimate and adjust the budget -> group costs by Resource and then by Meter in Cost Management","Build an estimate in the Azure pricing calculator -> deploy a small test workload with representative traffic -> group costs by Resource and then by Meter in Cost Management -> compare meter charges to the estimate and adjust the budget"],"answer":[3],"explanation":"Microsoft beschrijft de volgorde: schatting maken in de pricing calculator, kleine testworkload met representatief verkeer, in Cost Management groeperen op Resource en dan Meter, en tot slot vergelijken met de aannames en de baseline budget bijstellen.","rationale":["Kosten groeperen voordat er testverkeer is, levert geen werkelijke meterdata op.","Je groepeert kosten voordat de testworkload draait, dus er is nog niets te analyseren.","Je vergelijkt met de schatting voordat je de kosten per Resource en Meter hebt uitgesplitst.","Juist: dit is de aanbevolen workflow 'estimate and verify'."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-11","obj":"3.3.4","difficulty":"hard","type":"multi","stem":"Wide World Importers enabled spillover from a Global Provisioned deployment to a Global Standard deployment. Finance reports pay-as-you-go token charges that are higher than expected and asks the team to identify how much of the Global Standard traffic arrived through spillover.\n\nWhich two actions should you perform? Each correct answer presents a complete solution.","choices":["Log the x-ms-spillover-from-deployment response header in the agent application and count the requests that contain it","Count the HTTP 429 responses of the provisioned deployment in the Azure OpenAI Requests metric","Group cost analysis by Meter for the Foundry resource","Split the Azure OpenAI Requests metric of the Global Standard deployment by the IsSpillover dimension","Chart the Provisioned-managed Utilization V2 metric of the provisioned deployment"],"answer":[0,3],"explanation":"Spillover-requests worden op de standard deployment gefactureerd tegen standaard tokentarieven. Je identificeert ze via de IsSpillover-split op de metric van de standard deployment, of per request via de header x-ms-spillover-from-deployment. Ze verschijnen niet als 429 op de provisioned deployment.","rationale":["Juist: de aanwezigheid van deze header markeert een spillover-request.","Spillover-requests worden niet als 429 op de provisioned deployment geteld.","Meters tonen tokenkosten per model, maar onderscheiden spillover niet van direct verkeer.","Juist: met de IsSpillover-split zie je welke requests via spillover op de standard deployment kwamen.","Utilization toont capaciteitsbenutting, niet hoeveel requests zijn doorgestuurd."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/spillover-traffic-management"},{"id":"3.3.4-12","obj":"3.3.4","difficulty":"hard","type":"single","stem":"Graphic Design Institute scopes Cost analysis to its Foundry resource to track the cost of a tutoring agent. The agent uses Azure OpenAI models and a partner model from Azure Marketplace, and tracing sends telemetry to Application Insights. The monthly invoice is consistently higher than the Foundry resource view shows.\n\nWhat should you do to see the full cost of the solution?","choices":["Wait for cost ingestion and compare the same time window again","Scope Cost analysis to the resource group or subscription of the solution","Add a filter for the Azure OpenAI service in the Foundry resource view","Assign the Cost Management Reader role at the Foundry resource scope"],"answer":[1],"explanation":"Meters van partner- en communitymodellen verschijnen onder de resource group in plaats van de Foundry-resource, en kosten voor Azure Monitor Logs en alerts zijn niet zichtbaar op resourcescope. Scope daarom op resource group of subscription om de volledige kosten te zien.","rationale":["Het verschil is structureel elke maand, dus ingestievertraging is niet de oorzaak.","Juist: partner-modelmeters en Azure Monitor-kosten zijn niet zichtbaar op Foundry-resourcescope.","Azure OpenAI staat niet als service in de lijst, en filteren verbergt nog meer kosten.","Het probleem is de scope van de analyse, niet ontbrekende leesrechten."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.5-01","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a planning agent whose runs include several model calls and tool calls. A developer needs to identify which model call in one specific run consumed the most tokens and how long each step took.\n\nWhat should the developer use?","choices":["The Processed Prompt Tokens metric of the model deployment in Azure Monitor","The trace of the run in the Foundry portal, stepping through each span","The token usage chart on the Agent Monitoring Dashboard of the agent","Cost analysis in Cost Management, grouped by Meter for the project"],"answer":[1],"explanation":"Foundry-tracing legt per run inputs, outputs, tool-aanroepen, tokenverbruik en duur vast als geneste spans. Door door de spans van een trace te stappen zie je welke modelaanroep de meeste tokens gebruikte en waar tijd verloren ging.","rationale":["Deze metric aggregeert over requests en koppelt tokens niet aan een specifieke run.","Juist: een trace toont per span invoer, uitvoer, tokenverbruik en duur, in de volgorde van uitvoering.","Deze grafiek aggregeert tokens over een tijdsperiode en toont geen afzonderlijke stappen van een run.","Cost analysis toont gefactureerde kosten per meter, niet per stap van een run."],"ref":"https://learn.microsoft.com/azure/foundry/observability/concepts/trace-agent-concept"},{"id":"3.3.5-02","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Litware, Inc. instruments a Python agent application with the Microsoft Foundry SDK. Tracing is already enabled and spans appear in Application Insights. In the development environment, developers need the built-in traces to include message contents and tool call arguments.\n\nWhich environment variable should you set to true?","choices":["AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA","OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT","AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING","AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE"],"answer":[1],"explanation":"Content recording staat standaard uit en wordt ingeschakeld met OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true. Microsoft adviseert dit alleen in development, omdat prompts en tool-argumenten gevoelige gegevens kunnen bevatten.","rationale":["Deze variabele voegt afbeeldingen en bestandsdata toe en werkt pas als content recording al aan staat.","Juist: deze variabele schakelt content recording in voor berichten en tool call-argumenten.","Deze variabele schakelt GenAI-tracing zelf in; die werkt al.","Deze variabele propageert de baggage-header en legt geen berichtinhoud vast."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-03","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Tailspin Toys wants Foundry to notify the team when the token usage or latency of an agent shows an anomaly, or when evaluation scores drop.\n\nWhich setting on the Monitor tab of the agent should you configure?","choices":["Red team scans","Recurring evaluations","Traces","Alerts"],"answer":[3],"explanation":"In de Monitor settings van een agent configureer je Alerts (preview) voor latency, token usage, evaluatiescores of red team-bevindingen. Dat is het alerting-onderdeel naast recurring evaluations en red team scans.","rationale":["Red team scans voeren adversariele tests uit, maar waarschuwen niet bij latency of tokenanomalieen.","Recurring evaluations produceren scores, maar sturen zelf geen meldingen.","Traces tonen individuele runs voor debugging en bevatten geen alertconfiguratie.","Juist: Alerts detecteert anomalieen in latency, token usage, evaluatiescores en red team-bevindingen."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.5-04","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Relecloud connected an Application Insights resource to its Foundry project. A developer named User1 has the Contributor role on the project but receives authorization errors when opening traces in the Foundry portal. The trace tables are not protected.\n\nWhich role should you assign to User1 on the connected Application Insights resource?","choices":["Log Analytics Reader","Privileged Monitoring Data Reader","Cost Management Reader","Cognitive Services Usages Reader"],"answer":[0],"explanation":"Naast een rol op het project vereist het bekijken van traces Log Analytics Reader op de gekoppelde Application Insights-resource. Privileged Monitoring Data Reader is pas aanvullend nodig als de tabellen protected zijn.","rationale":["Juist: deze rol is nodig om traces en log-gebaseerde monitoring te bekijken.","Deze rol is alleen extra nodig voor protected tables, wat hier niet van toepassing is.","Deze rol geeft toegang tot kostendata, niet tot telemetrie.","Deze rol toont quotagebruik, geen tracedata."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-05","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Woodgrove Bank calls a Foundry agent from a Python application that is instrumented for tracing. Traces reach Application Insights, but they are not correlated with the agent in the Foundry portal.\n\n```python\nresponse = openai.responses.create(\n    conversation=conversation.id,\n    extra_body={\"agent_reference\": {<value>, \"type\": \"agent_reference\"}},\n    input=\"What is my current balance?\",\n)\n```\n\nWhich value should you use for <value>?","choices":["\"name\": agent.name, \"version\": agent.version","\"name\": agent.name, \"id\": agent.id","\"agent_name\": agent.name","\"id\": conversation.id"],"answer":[1],"explanation":"Om traces aan een specifieke agent in de Foundry-portal te koppelen, neem je in responses.create() een agent_reference op met zowel name als id. Traces verschijnen doorgaans binnen 2 tot 5 minuten.","rationale":["De versie identificeert de agentversie, maar de correlatie vereist het id.","Juist: Microsoft Learn vereist zowel name als id in agent_reference om traces aan de agent te koppelen.","agent_name is niet de sleutel die agent_reference verwacht, en het id ontbreekt.","Het conversation-id identificeert het gesprek, niet de agent."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-06","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Contoso, Ltd. needs every span that a Python agent application emits, including spans created by the Foundry SDK instrumentation, to carry the current session identifier as a session.id attribute. Developers must not modify each traced function.\n\nWhat should you implement?","choices":["The OTEL_SERVICE_NAME environment variable set to the session identifier","The @trace_function decorator on each function","A custom SpanProcessor that sets the attribute in on_start and is registered with the global tracer provider","Baggage propagation by setting AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE to true"],"answer":[2],"explanation":"Microsoft Learn toont een custom SpanProcessor die in on_start session.id instelt en wordt geregistreerd bij de globale tracer provider. Zo krijgt elke span, inclusief de SDK-instrumentatie, de correlatie-ID zonder functies aan te passen.","rationale":["De service name identificeert de applicatie en is procesbreed, niet per sessie.","De decorator vereist aanpassing van elke functie en voegt het attribuut niet aan SDK-spans toe.","Juist: een SpanProcessor voegt het attribuut toe aan elke span die start, ook SDK-spans.","Baggage wordt als header naar Azure OpenAI gestuurd, maar zet geen attribuut op elke span."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-07","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Northwind Traders has two agent applications, App1 and App2, that send OpenTelemetry traces to the same Application Insights resource. The team needs to filter the traces of each application in KQL queries without creating another Application Insights resource.\n\nWhat should you do?","choices":["Set a unique OTEL_SERVICE_NAME for each application and filter on cloud_RoleName","Create a separate Foundry project for each application that shares the resource","Add a session.id attribute that identifies the application to every span","Set the gen_ai.operation.name attribute to the application name on each span"],"answer":[0],"explanation":"Als meerdere applicaties naar dezelfde Application Insights-resource loggen, geef je elke applicatie een eigen OpenTelemetry service name, bijvoorbeeld via OTEL_SERVICE_NAME. Application Insights zet die waarde om naar cloud_RoleName, waarop je in KQL filtert.","rationale":["Juist: de service name onderscheidt applicaties en wordt in KQL opgevraagd via cloud_RoleName.","Een apart project is niet nodig en lost het filteren binnen een gedeelde resource niet op.","session.id onderscheidt sessies, niet applicaties.","gen_ai.operation.name hoort de operatie te beschrijven, zoals chat, volgens de semantic conventions."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-configuration"},{"id":"3.3.5-08","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Proseware, Inc. adds client-side tracing to a Python agent. The code calls AIProjectInstrumentor().instrument() at startup and later sets AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING to true before it creates the first agent. No GenAI spans are produced, and a warning is logged at startup.\n\nWhat should you do?","choices":["Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true at startup","Set AZURE_TRACING_GEN_AI_INSTRUMENT_RESPONSES_API to false at startup","Move the AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING assignment before instrument()","Assign the Log Analytics Reader role on Application Insights to the developer"],"answer":[2],"explanation":"GenAI-tracing is een experimentele opt-in. Als AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING niet op true staat op het moment van AIProjectInstrumentor().instrument(), wordt instrumentatie niet ingeschakeld en verschijnt een waarschuwing.","rationale":["Dit voegt berichtinhoud toe aan bestaande spans, maar schakelt tracing niet in.","Dit schakelt auto-instrumentatie juist uit, waardoor er nog minder spans komen.","Juist: de variabele moet gezet zijn voordat instrument() wordt aangeroepen.","Rechten beinvloeden het bekijken, niet of de applicatie spans produceert."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-09","obj":"3.3.5","difficulty":"hard","type":"single","stem":"Humongous Insurance traces a claims agent in production. OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT is set to false. A helper function named lookup_policy is decorated with @trace_function and accepts a policy_number parameter. A compliance review finds policy numbers in the span attributes of production traces. The team must keep a span for lookup_policy.\n\nWhat should you do?","choices":["Set AZURE_TRACING_GEN_AI_ENABLE_TRACE_CONTEXT_PROPAGATION to false","Set AZURE_TRACING_GEN_AI_INSTRUMENT_RESPONSES_API to false","Replace the decorator with a manual span that omits policy_number","Set AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA to false"],"answer":[2],"explanation":"De buried constraint: content recording staat al uit. @trace_function legt parameters en returnwaarden echter altijd vast, ongeacht OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT. Gebruik daarom een handmatige span (tracer.start_as_current_span) zonder het gevoelige attribuut.","rationale":["Dit stopt het doorgeven van trace-ID's, maar parameters blijven in de span staan.","Dit schakelt auto-instrumentatie van de Responses API uit, niet het tracen van gedecoreerde functies.","Juist: een handmatige span bepaalt zelf welke attributen worden vastgelegd.","Deze instelling gaat over binaire data en heeft geen invloed op functieparameters."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-10","obj":"3.3.5","difficulty":"hard","type":"single","stem":"Trey Research stores clinical prompts in Foundry traces. Members of an auditor group must be able to read prompts, responses, and tool call content, while other engineers keep access to the non-sensitive trace data.\n\nWhich sequence of actions should you perform?","choices":["Assign Privileged Monitoring Data Reader to the auditor group -> verify access with an account that has Log Analytics Reader -> register the protectGenAISensitiveData feature flag -> set the AppGenAIContent table to Protected","Register the protectGenAISensitiveData feature flag -> assign Privileged Monitoring Data Reader to the auditor group -> verify access with an account that has Log Analytics Reader -> set the AppGenAIContent table to Protected","Verify access with an account that has Log Analytics Reader -> register the protectGenAISensitiveData feature flag -> set the AppGenAIContent table to Protected -> assign Privileged Monitoring Data Reader to the auditor group","Register the protectGenAISensitiveData feature flag -> set the AppGenAIContent table to Protected -> assign Privileged Monitoring Data Reader to the auditor group -> verify access with an account that has Log Analytics Reader"],"answer":[3],"explanation":"Foundry routeert gevoelige content naar de tabel AppGenAIContent na registratie van protectGenAISensitiveData. Zet die tabel op Protected (deny-by-default), wijs Privileged Monitoring Data Reader toe aan geautoriseerde identiteiten en verifieer dat een gebruiker met alleen Log Analytics Reader de content niet ziet.","rationale":["Verificatie gebeurt voordat content naar AppGenAIContent wordt gerouteerd en voordat de tabel beschermd is.","Je verifieert voordat de tabel protected is, dus een gewone reader ziet de content dan nog.","Verificatie als eerste stap test een configuratie die nog niet bestaat.","Juist: eerst routeren naar de dedicated table, dan beschermen, dan toegang verlenen en verifieren."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/traces-sensitive-content"},{"id":"3.3.5-11","obj":"3.3.5","difficulty":"hard","type":"multi","stem":"Wingtip Toys deploys a hosted agent in Foundry Agent Service. Execution telemetry must flow to the Application Insights resource of the project and, at the same time, to the company's Datadog OTLP endpoint. The agent code must not contain telemetry setup code.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Set APPLICATIONINSIGHTS_CONNECTION_STRING in agent.yaml","Install the Azure Monitor OpenTelemetry distro and call configure_azure_monitor in the agent code","Enable monitoring for the Foundry project so that Foundry injects the Application Insights connection string","Set the OTEL_EXPORTER_OTLP_ENDPOINT environment variable on the agent to the Datadog endpoint","Register the hosted agent as a custom agent in Foundry Control Plane"],"answer":[2,3],"explanation":"Hosted agents bundelen de OpenTelemetry-distro. De runtime exporteert naar Application Insights als Foundry de connection string injecteert (projectmonitoring aan) en daarnaast via OTLP als OTEL_EXPORTER_OTLP_ENDPOINT gezet is; beide exporters werken tegelijk.","rationale":["Deze instelling is platform-reserved en kan niet in agent.yaml worden gezet of overschreven.","Hosted agent-libraries bevatten de distro al, en de eis is geen telemetry-code in de agent.","Juist: bij projectmonitoring injecteert Foundry APPLICATIONINSIGHTS_CONNECTION_STRING in de container.","Juist: de runtime exporteert dan ook via OTLP naar dat endpoint.","Registratie als custom agent is bedoeld voor agents buiten Foundry, niet voor hosted agents."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/configure-hosted-agent-telemetry"},{"id":"3.3.5-12","obj":"3.3.5","difficulty":"hard","type":"single","stem":"Margie's Travel enables Foundry SDK tracing in a Python application. Client-side spans and server-side spans from Azure OpenAI appear as separate traces. Trace context propagation is at its default value. During startup, the application obtains an OpenAI client by calling get_openai_client() and then calls AIProjectInstrumentor().instrument().\n\nWhat should you do to correlate the spans?","choices":["Obtain the OpenAI client by calling get_openai_client() after the instrumentation call","Call instrument() with enable_trace_context_propagation set to False","Set AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE to true","Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true"],"answer":[0],"explanation":"Trace context propagation (standaard aan) injecteert traceparent en tracestate in requests van OpenAI-clients via get_openai_client(). Wijzigingen gelden alleen voor clients die daarna zijn verkregen, dus de client moet na instrument() worden opgehaald.","rationale":["Juist: trace context propagation geldt voor clients die na de instrumentatie zijn verkregen.","Dit schakelt de propagatie uit die correlatie mogelijk maakt.","Baggage voegt extra key-value-data toe, maar de traceparent-header ontbreekt nog steeds.","Content recording voegt berichtinhoud toe, maar correleert geen spans."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"4.1.1-01","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. publishes a customer-support agent in a Microsoft Foundry project. A service principal named App1 must call the agent endpoint by using the Responses API. App1 must not create, modify, or delete agents.\n\nYou need to grant App1 access by following the principle of least privilege.\n\nWhich role should you assign to App1?","choices":["Foundry Agent Consumer","Foundry User","Foundry Project Manager","Foundry Owner"],"answer":[0],"explanation":"Foundry Agent Consumer is de least-privilege rol voor principals die alleen met agent endpoints hoeven te communiceren. App1 hoeft niets te bouwen of te beheren, dus een rol met data actions voor ontwikkeling is te breed.","rationale":["Juist: deze rol geeft alleen toegang om met agent endpoints te interacteren.","Foundry User geeft ook data actions om agents te bouwen en te testen; dat is meer dan App1 nodig heeft.","Foundry Project Manager kan projecten beheren, agents publiceren en rollen toewijzen; veel te breed.","Foundry Owner is een zeer geprivilegieerde rol met volledig beheer; strijdig met least privilege."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/rbac-foundry"},{"id":"4.1.1-02","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a Microsoft Foundry resource that contains a project named Project1. Developers must build and test agents in Project1 by using pre-deployed models and existing connections. Developers must not create projects or deploy models.\n\nWhich role should you assign to the developers at the Project1 scope?","choices":["Foundry User","Foundry Account Owner","Azure AI Developer","Cognitive Services Contributor"],"answer":[0],"explanation":"Foundry User is de least-privilege rol voor ontwikkelaars die agents bouwen en testen: reader-toegang plus data actions in het project. Accounts aanmaken of modellen beheren valt buiten deze rol.","rationale":["Juist: data actions voor bouwen en testen zonder beheer van projecten of modellen.","Foundry Account Owner kan projecten en accounts beheren en modellen deployen, maar heeft geen data actions om te bouwen.","Azure AI Developer is bedoeld voor Azure Machine Learning workspaces en Foundry hubs, niet voor Foundry projects.","Rollen die met Cognitive Services beginnen zijn niet bedoeld voor Foundry-scenario's en geven bovendien beheerrechten."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/rbac-foundry"},{"id":"4.1.1-03","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Tailspin Toys builds an agent named Agent1 in a Microsoft Foundry project. Agent1 calls an MCP server that reads and writes blobs in a storage account named storage1. The MCP connection uses Microsoft Entra agent identity authentication.\n\nYou need to grant the required access to storage1.\n\nWhich principal should you assign the Storage Blob Data Contributor role?","choices":["the agent identity that Agent1 uses at runtime","the project managed identity","the agent identity blueprint","the user principal of the developer who created Agent1"],"answer":[0],"explanation":"Bij agent identity-authenticatie is de agent identity (een service principal, aangeduid met agentIdentityId) de principal die RBAC-rollen op de doelresource nodig heeft. De project managed identity authenticeert alleen de blueprint bij Microsoft Entra ID en benadert storage1 niet zelf.","rationale":["Juist: de agent identity waarmee Agent1 de toolaanroep doet, wordt door storage1 gecontroleerd op RBAC-rollen.","De project managed identity authenticeert alleen de blueprint bij Entra ID en benadert de downstream resource niet zelf.","De blueprint is een beheerobject (template) voor agent identities en krijgt geen RBAC-rollen op downstream resources.","De toolaanroep draait niet onder de identiteit van de ontwikkelaar; die rol heeft geen effect op de agent."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.1-04","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank prototypes agents in Foundry Agent Service. The security team requires that only callers from the corporate virtual network can reach the Foundry endpoint. Agent egress to public endpoints remains acceptable during the prototype phase.\n\nWhich networking option should you configure?","choices":["public egress with a private endpoint","public egress with public inbound access","a bring-your-own virtual network","a managed virtual network"],"answer":[0],"explanation":"Met public egress en een private endpoint beveilig je alleen het inbound pad: callers bereiken de Foundry endpoint privaat, terwijl agent egress publiek blijft. Dat past precies bij de eis zonder volledige isolatie te bouwen.","rationale":["Juist: beperkt wie de endpoint kan aanroepen terwijl publieke egress toegestaan blijft.","Publieke inbound toegang laat callers van buiten het virtuele netwerk toe; dat voldoet niet aan de eis.","BYO virtual network geeft volledige isolatie zonder publieke egress; meer dan nodig voor dit prototype.","Een managed virtual network isoleert ook egress; dat is niet vereist en voegt overhead toe."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/networking-options"},{"id":"4.1.1-05","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Contoso Pharmaceuticals plans a new Foundry Agent Service deployment for regulated workloads. The requirements are:\n\n- Agents must have no public egress.\n- The network team must control IP ranges, peering, and routing.\n- Conversation history, files, and vector stores must be stored in Azure resources that Contoso Pharmaceuticals owns.\n\nWhich networking option should you deploy?","choices":["a BYO virtual network with bring-your-own data resources","a BYO virtual network with platform-managed data resources","a managed virtual network","public egress with a private endpoint"],"answer":[0],"explanation":"Volledige isolatie waarbij het netwerkteam zelf IP-ranges en routing beheert vraagt om een BYO virtual network. Omdat de agentdata in eigen Storage, Azure AI Search en Azure Cosmos DB moet staan, kies je de variant met bring-your-own data resources (network-secured standard).","rationale":["Juist: volledige isolatie, eigen netwerkbeheer en agentdata in eigen resources.","Platform-managed data resources zijn multitenant en Microsoft-beheerd; de data staat dan niet in eigen resources.","Een managed virtual network is bedoeld als je geen IP-ranges wilt of kunt beheren; hier wil het netwerkteam juist controle.","Met public egress blijft uitgaand verkeer publiek; dat schendt de eis van geen publieke egress."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/networking-options"},{"id":"4.1.1-06","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Relecloud has a legacy agent named Agent1 in a Microsoft Foundry project. Agent1 reads blobs from storage1 because the shared project agent identity has the Storage Blob Data Reader role on storage1. To adopt the new agent object model, you create a new agent named Agent2 that uses the same definition as Agent1. Every tool call from Agent2 to storage1 fails with HTTP 403.\n\nWhat should you do?","choices":["Assign the Storage Blob Data Reader role on storage1 to the unique agent identity of Agent2.","Assign the Storage Blob Data Reader role on storage1 to the project managed identity.","Assign the Foundry User role on the Foundry resource to the shared project agent identity.","Change the MCP connection to use key-based authentication with a storage account key."],"answer":[0],"explanation":"Een nieuwe agent in het nieuwe agent object model krijgt bij het aanmaken een eigen, unieke agent identity die verschilt van de gedeelde project identity. Roltoewijzingen gaan niet mee, dus je moet de RBAC-toewijzing op storage1 opnieuw maken voor de agent identity van Agent2.","rationale":["Juist: Agent2 gebruikt zijn eigen unieke agent identity, die de rol op storage1 nog niet heeft.","De project managed identity authenticeert de blueprint en heeft geen invloed op de toegang van de agent identity tot storage1.","Foundry User op de Foundry resource geeft geen data-plane rechten op storage1 en de gedeelde identity wordt niet meer gebruikt.","Een storage account key introduceert een gedeeld geheim en lost het identiteitsprobleem niet op een least-privilege manier op."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/migrate-agent-applications"},{"id":"4.1.1-07","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders hosts five agents in a single Microsoft Foundry project. A partner service principal named SP1 must call the endpoint of an agent named OrderAgent. SP1 must not be able to call the endpoints of the other four agents.\n\nWhich role assignment should you create?","choices":["Foundry Agent Consumer at the OrderAgent agent scope","Foundry Agent Consumer at the project scope","Foundry Agent Consumer at the Foundry resource scope","Foundry User at the project scope"],"answer":[0],"explanation":"Een roltoewijzing op agent-scope wordt geevalueerd voor toegang tot de endpoint van die ene agent. Project-scope geeft toegang tot alle agent endpoints in het project. Let op: de Azure portal ondersteunt dit alleen op account-scope, dus gebruik Azure CLI.","rationale":["Juist: agent-scope geeft endpoint-toegang tot alleen OrderAgent.","Project-scope geeft toegang tot elke agent endpoint in het project, ook de andere vier.","Resource-scope is nog breder en dekt alle projecten en agents in de Foundry resource.","Foundry User op project-scope geeft ontwikkelrechten en toegang tot alle agents; te breed."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/rbac-foundry"},{"id":"4.1.1-08","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Adventure Works Cycles has 12 teams that create Foundry resources in one Azure subscription. Security requires that every current and future Foundry resource in the subscription accepts only Microsoft Entra ID authentication. Teams must not be able to create resources that accept API keys.\n\nWhat should you do?","choices":["Assign the Azure Policy definition that requires key access to be disabled for Azure AI Services resources at the subscription scope.","Set the disableLocalAuth property to true in a shared Bicep template, and ask each team to deploy by using the template.","Create a Conditional Access policy that blocks key-based sign-ins for the agent identities in the tenant.","Run Set-AzCognitiveServicesAccount with -DisableLocalAuth $true against each existing Foundry resource."],"answer":[0],"explanation":"De Azure Policy 'Azure AI Services resources should have key access disabled (disable local authentication)' op subscription-niveau dwingt Entra ID af voor bestaande en nieuwe resources. Een template of script handhaaft niets voor resources die teams later zelf aanmaken.","rationale":["Juist: Azure Policy handhaaft de eis centraal voor huidige en toekomstige resources.","Een gedeeld template is vrijwillig; teams kunnen nog steeds resources met key-toegang aanmaken.","Conditional Access stuurt toegang van agent identities, niet of een resource API keys accepteert.","Het script werkt per bestaande resource en voorkomt niet dat nieuwe resources met keys worden aangemaakt."],"ref":"https://learn.microsoft.com/azure/ai-services/disable-local-auth"},{"id":"4.1.1-09","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company has a Foundry account named Account1 that was created six months ago with public networking. Account1 contains two projects with hosted agents and prompt agents. A new compliance rule requires that all agent compute is injected into a delegated subnet in a virtual network that Lamna Healthcare Company manages.\n\nYou create a subnet named Subnet1 that is delegated to Microsoft.App/environments and sized /27.\n\nWhat should you do next?","choices":["Create a new Foundry account that uses Subnet1 for virtual network injection, and then migrate the projects and agents.","Update the networking settings of Account1 to inject agent compute into Subnet1, and then restart the hosted agents.","Add a private endpoint for Account1 in the virtual network, and then disable public network access on Account1.","Configure a managed virtual network for each existing project in Account1, and then peer it with the virtual network."],"answer":[0],"explanation":"Network injection maakt deel uit van de create-flow van het Foundry account en kan niet aan een bestaand account worden toegevoegd. Na het eerste hosted agent is de configuratie vast; je moet dus een nieuw account met Subnet1 aanmaken en de workloads verhuizen.","rationale":["Juist: VNet-injectie moet bij het aanmaken van het account worden ingesteld.","Een bestaand account kan achteraf geen network injection krijgen.","Een private endpoint beveiligt alleen inbound verkeer; agent compute wordt niet in Subnet1 geinjecteerd.","Netwerkisolatie geldt op account-niveau en de compliance-eis vraagt om een door Lamna beheerd subnet, niet een Microsoft-managed netwerk."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/networking-options"},{"id":"4.1.1-10","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"Proseware, Inc. runs a multi-agent solution in one Microsoft Foundry project. An orchestrator agent named Agent1 must read a Cosmos DB container. A billing agent named Agent2 must write to a storage account. Both agents are legacy agents that use the shared project agent identity, which has both permissions. Auditors require that each agent has only its own permissions and an independent audit trail.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Re-create Agent1 and Agent2 as new agents with the same definitions so that each agent receives a unique agent identity.","Assign each required role to the agentIdentityId of the corresponding new agent, scoped to the target resource.","Assign the required roles to the shared project agent identity at the subscription scope.","Assign the Owner role on the resource group to the project managed identity.","Store a storage account key in a project connection that Agent2 uses."],"answer":[0,1],"explanation":"Legacy agents delen de project identity, met een grotere blast radius. Een in-place upgrade bestaat nog niet, dus je maakt nieuwe agents met dezelfde definitie; die krijgen elk een unieke agent identity en blueprint. Daarna maak je per identity smalle roltoewijzingen op resource-scope, zodat elke agent alleen eigen rechten en een eigen audit trail heeft.","rationale":["Juist: nieuwe agents krijgen bij het aanmaken elk een unieke agent identity.","Juist: rollen per agentIdentityId op resource-scope realiseren least privilege per agent; rollen gaan niet automatisch mee.","Subscription-scope op de gedeelde identity vergroot de rechten en scheidt de agents niet.","Owner voor de managed identity is excessief en de managed identity is niet de principal voor toolaanroepen.","Een gedeelde key is toegankelijk voor iedereen met projecttoegang en geeft geen per-agent audit trail."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/migrate-agent-applications"},{"id":"4.1.1-11","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Alpine Ski House configures a project connection for an MCP server that Agent1 uses. The MCP server reads files from an Azure Storage account. The connection uses the AgenticIdentityToken authentication type with the audience set to https://mcp1.alpineskihouse.com. The agent identity was assigned the Storage Blob Data Reader role on the storage account two days ago. Every tool call fails with HTTP 401.\n\nWhat should you do?","choices":["Change the audience of the connection to https://storage.azure.com.","Assign the Storage Blob Data Reader role to the project managed identity.","Change the connection to OAuth identity passthrough.","Wait up to 10 minutes for the role assignment to propagate, and then retry."],"answer":[0],"explanation":"De audience moet overeenkomen met de resource identifier van de downstream service, niet met de URL van de MCP server. Een verkeerde audience geeft authenticatiefouten, zelfs als de RBAC-rollen correct zijn. Voor Azure Storage is de audience https://storage.azure.com.","rationale":["Juist: de token moet voor de audience van Azure Storage worden uitgegeven.","De agent identity, niet de project managed identity, is de principal die de rol nodig heeft; de rol is al correct toegewezen.","OAuth identity passthrough is voor per-user context; dat is hier niet gevraagd en lost de audience-fout niet op.","De rol is twee dagen geleden toegewezen; propagatie is niet de oorzaak."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.2-01","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Tailspin Toys registers a client app named App1 in Microsoft Entra ID. App1 hosts an agent that calls a custom web API named API1. The agent must call API1 on behalf of the signed-in user and must be able to access only the data that the signed-in user can access.\n\nWhich type of permission should you configure for App1 on API1?","choices":["delegated permissions","application permissions","an Azure RBAC role assignment for App1 at the API1 scope","an API key that API1 issues to App1"],"answer":[0],"explanation":"Delegated permissions (scopes) laten een app namens een aangemelde gebruiker handelen; de app kan nooit meer benaderen dan de gebruiker zelf mag. Dat is precies de eis van user impersonation: gebruiker aangemeld en toegang begrensd tot de rechten van die gebruiker.","rationale":["Juist: delegated permissions vereisen een aangemelde gebruiker en beperken toegang tot wat die gebruiker mag.","Onjuist: application permissions (app roles) gelden zonder gebruiker en geven toegang tot alle data van die permissie, niet alleen die van de gebruiker.","Onjuist: een RBAC-roltoewijzing aan App1 geeft App1 eigen rechten, los van de aangemelde gebruiker.","Onjuist: een API key identificeert alleen de app en draagt geen gebruikerscontext mee."],"ref":"https://learn.microsoft.com/entra/identity-platform/permissions-consent-overview"},{"id":"4.1.2-02","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Wide World Importers connects an agent to a third-party weather MCP server. The server supports only API keys. Every user of the agent can see the same weather data.\n\nYou need to provide the API key to the MCP server without passing it at runtime.\n\nWhat should you configure?","choices":["key-based authentication that stores the key in a project connection","OAuth identity passthrough by using custom OAuth","unauthenticated access with the key in the agent instructions","Microsoft Entra agent identity authentication"],"answer":[0],"explanation":"Voor een server die alleen API keys ondersteunt en waarbij geen user context nodig is, gebruik je key-based authenticatie. Agent Service haalt de credential uit de project connection en stuurt die mee naar de MCP server.","rationale":["Juist: gedeelde key veilig opgeslagen in een project connection.","OAuth identity passthrough vereist OAuth-ondersteuning en per-user consent; de server ondersteunt alleen keys.","Een key in instructies is onveilig en unauthenticated access stuurt geen credential mee.","De server accepteert geen Microsoft Entra-tokens, dus agent identity werkt niet."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"4.1.2-03","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Consolidated Messenger has a middle-tier orchestrator API named API1. A client app calls API1 with an access token for the signed-in user. API1 must call a downstream API named API2 with the delegated identity and permissions of the same user. API1 cannot interact with the user.\n\nWhich OAuth 2.0 flow should API1 use to obtain a token for API2?","choices":["on-behalf-of","client credentials","authorization code","device code"],"answer":[0],"explanation":"De on-behalf-of (OBO) flow is bedoeld voor een web API die met de identiteit van de gebruiker een andere web API aanroept. API1 wisselt token A in voor token B met alleen de gedelegeerde scopes van de gebruiker, zonder gebruikersinteractie.","rationale":["Juist: OBO propageert gedelegeerde gebruikersidentiteit door de request-keten.","Client credentials gebruikt de eigen identiteit van de app, niet die van de gebruiker.","De authorization code flow vereist interactieve aanmelding; API1 heeft geen gebruikersinteractie.","De device code flow is voor apparaten met beperkte invoer en vereist ook gebruikersinteractie."],"ref":"https://learn.microsoft.com/entra/identity-platform/v2-oauth2-on-behalf-of-flow"},{"id":"4.1.2-04","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Fourth Coffee runs a nightly reconciliation agent in Foundry Agent Service. No user is signed in when the agent runs. The agent must access Azure Cosmos DB by using permissions that are assigned directly to the agent.\n\nWhich authentication approach should the agent use?","choices":["the unattended application-only flow with the agent identity","the attended on-behalf-of flow with the agent identity","OAuth identity passthrough","key-based authentication with a personal access token"],"answer":[0],"explanation":"Bij unattended scenario's handelt de agent onder eigen autoriteit via de OAuth 2.0 client credentials flow. Toegang wordt dan volledig bepaald door de roltoewijzingen van de agent identity; er is geen gebruiker bij betrokken.","rationale":["Juist: application-only flow met eigen RBAC-rechten van de agent identity.","OBO vereist een gebruikerstoken; 's nachts is er geen aangemelde gebruiker.","Passthrough vraagt een gebruiker om in te loggen en toestemming te geven.","Een PAT is een gedeeld geheim en geen identiteitsgebaseerde toegang tot Cosmos DB."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.2-05","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Humongous Insurance builds a conversational agent workflow in Azure Logic Apps (Standard). An agent tool reads the mailbox of the person who is chatting. Compliance requires that resource access and audit logs are linked to that person and that the tool respects the person's own licenses and data access rights.\n\nWhich connection configuration should you use for the tool?","choices":["Use a per-user connection that has on-behalf-of authorization.","Use a shared connection that authenticates by using the logic app managed identity.","Use a shared connection that is created by the workflow author.","Use a connection that authenticates by using a service principal with application permissions."],"answer":[0],"explanation":"Met OBO-autorisatie en per-user connections gebruikt de tool de identiteit en rechten van de aangemelde chatgebruiker, niet van de maker van de connection. Daardoor zijn toegang en audit logs aan die persoon gekoppeld.","rationale":["Juist: delegated permissions via OBO met per-user connections.","Een managed identity handelt als de app zelf; audit logs zijn niet aan de gebruiker gekoppeld.","Een gedeelde connection draait met de credentials van de maker, niet van de chatgebruiker.","Application permissions negeren de licenties en rechten van de individuele gebruiker."],"ref":"https://learn.microsoft.com/azure/logic-apps/set-up-on-behalf-of-user-flow"},{"id":"4.1.2-06","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Relecloud runs an agent in Foundry Agent Service that reads documents from a line-of-business API that is protected by Microsoft Entra ID. Users sign in to a web app, and the web app passes the user token to Agent Service when it calls the agent. The following requirements apply:\n\n- The agent must access only the documents that the signed-in user is authorized to access.\n- Sign-in logs must show the agent identity as an actor, separate from the user.\n- Users must not receive a separate consent link inside the agent conversation.\n\nWhich authentication approach should the agent use?","choices":["the attended on-behalf-of flow with the agent identity","the unattended application-only flow with the agent identity","OAuth identity passthrough with a custom OAuth app","Microsoft Entra authentication with the project managed identity"],"answer":[0],"explanation":"In de attended (OBO) flow geeft de app het gebruikerstoken door aan Agent Service, die het inwisselt voor een token dat zowel de agent identity als de gedelegeerde rechten van de gebruiker bevat. De agent kan dus alleen bij wat de gebruiker mag, terwijl de agent identity als aparte actor zichtbaar blijft.","rationale":["Juist: OBO met de agent identity combineert gebruikersrechten met de agent als zelfstandige actor, zonder extra consent link.","Onjuist: de application-only flow gebruikt alleen de rechten van de agent identity en negeert de rechten van de gebruiker.","Onjuist: OAuth identity passthrough toont bij eerste gebruik een consent link in de conversatie en gebruikt het token van de gebruiker, niet de agent identity.","Onjuist: de project managed identity is een gedeelde identiteit zonder gebruikerscontext."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.2-07","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Margie's Travel uses Azure API Management to front a SaaS API that agents call through MCP tools. The SaaS API returns user-specific itineraries and requires an OAuth 2.0 token for each Microsoft Entra user. Each user must sign in and consent only once.\n\nWhat should you configure in API Management?","choices":["a credential manager connection that is enabled for user-delegated access and the get-authorization-context policy","a credential manager connection that uses the access policy of the API Management managed identity","the authentication-managed-identity policy for the SaaS backend","a subscription key that is passed in the Ocp-Apim-Subscription-Key header"],"answer":[0],"explanation":"In het attended (user-delegated) scenario van credential manager logt elke gebruiker eenmaal in en geeft toestemming, waarna API Management de connection beheert. get-authorization-context haalt het token op en vernieuwt het indien nodig.","rationale":["Juist: user-delegated connections leveren per-user tokens met eenmalige consent.","Een connection voor de managed identity is unattended en geeft alle gebruikers dezelfde data.","De managed identity van API Management representeert geen individuele gebruiker.","Een subscription key authenticeert de client bij API Management, niet de gebruiker bij de SaaS API."],"ref":"https://learn.microsoft.com/azure/api-management/credentials-overview"},{"id":"4.1.2-08","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Lucerne Publishing connects an agent to a custom MCP server that is protected by Microsoft Entra ID. Each user must authorize access with the user's own account. You plan to use OAuth identity passthrough with a custom OAuth app registration.\n\nYou need to configure the solution.\n\nWhich sequence of actions should you perform?","choices":["Register an app in Microsoft Entra ID -> create the MCP connection with OAuth identity passthrough by using the client ID and secret of the app -> add the redirect URL that Foundry returns to the app registration -> test the tool by using a user account that has not yet consented","Create the MCP connection with OAuth identity passthrough -> register an app in Microsoft Entra ID -> test the tool by using a user account that has not yet consented -> add the redirect URL that Foundry returns to the app registration","Register an app in Microsoft Entra ID -> add the redirect URL that Foundry returns to the app registration -> test the tool by using a user account that has not yet consented -> create the MCP connection with OAuth identity passthrough","Register an app in Microsoft Entra ID -> create the MCP connection with key-based authentication by using the client secret -> add the redirect URL to the app registration -> test the tool by using a user account that has not yet consented"],"answer":[0],"explanation":"Voor custom OAuth heb je eerst een app registration nodig om client ID en secret in de connection in te vullen. Pas na het aanmaken van de connection krijg je een redirect URL, die je aan de app registration toevoegt. Daarna valideer je met een testgebruiker die nog geen consent gaf.","rationale":["Juist: app registration, connection, redirect URL toevoegen, dan valideren.","De connection vereist de client ID uit een bestaande app registration, en testen voor de redirect URL faalt.","De redirect URL bestaat pas nadat de connection is aangemaakt.","Key-based authenticatie levert geen per-user consent en behoudt geen user context."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"4.1.2-09","obj":"4.1.2","difficulty":"hard","type":"single","stem":"Wingtip Toys configures an MCP project connection for Agent1 that uses agent identity authentication with the audience https://storage.azure.com. The MCP server reads blobs from a storage account. The security team asks you to document how Foundry Agent Service authenticates each tool call at runtime.\n\nWhich sequence should you document?","choices":["Agent Service authenticates the agent identity blueprint by using the project managed identity -> Microsoft Entra ID issues a token for the agent identity -> Agent Service exchanges that token for an access token for https://storage.azure.com -> Storage checks the RBAC roles of the agent identity","Agent Service requests an access token for https://storage.azure.com by using the project managed identity -> The MCP server exchanges the token for an agent identity token -> Microsoft Entra ID authenticates the blueprint -> Storage checks the RBAC roles of the project managed identity","Microsoft Entra ID issues a token for the agent identity -> Agent Service authenticates the agent identity blueprint by using the project managed identity -> Agent Service passes the agent identity token to the MCP server -> The MCP server requests an access token for https://storage.azure.com","Agent Service authenticates the agent identity blueprint by using a client secret that is stored in the project connection -> Microsoft Entra ID issues an access token for the MCP server URL -> The MCP server forwards the token to storage -> Storage checks the RBAC roles of the blueprint"],"answer":[0],"explanation":"De runtime token exchange verloopt in vier stappen: blueprint authentication (via de federated credential met de project managed identity), uitgifte van een agent identity token, een scoped token request voor de audience van de downstream service, en de geauthenticeerde tool call waarbij de resource de RBAC-rollen van de agent identity controleert. De managed identity authenticeert alleen de blueprint en heeft zelf geen toegang tot de resource nodig.","rationale":["Juist: dit is de volgorde blueprint authentication -> agent identity token -> scoped token voor de audience -> RBAC-controle op de agent identity.","Onjuist: de project managed identity vraagt geen storage-token aan, en het is de agent identity, niet de managed identity, die RBAC-rollen op storage nodig heeft.","Onjuist: een agent identity token kan pas worden uitgegeven na blueprint authentication, en Agent Service, niet de MCP server, vraagt het scoped token aan.","Onjuist: Foundry gebruikt een federated credential in plaats van een opgeslagen secret, en de audience moet de storage-resource zijn, niet de URL van de MCP server."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.2-10","obj":"4.1.2","difficulty":"hard","type":"multi","stem":"VanArsdel, Ltd. has a calling agent named Agent1 in Project1. Agent1 uses an A2A tool with OAuth identity passthrough to invoke a remote Foundry agent named Agent2 in Project2. User1 completes the consent flow, but every A2A tool call that User1 triggers fails. Other users can use the tool successfully.\n\nYou need to resolve the issue by following the principle of least privilege.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Assign User1 the Foundry Agent Consumer role on Project1 or on Agent1.","Grant User1 access to the remote target project or agent that hosts Agent2.","Assign User1 the Foundry Owner role on Project1.","Set send_credentials_for_agent_card to true in the A2A tool definition.","Assign the Foundry Agent Consumer role to the project managed identity of Project1."],"answer":[0,1],"explanation":"Bij OAuth identity passthrough hebben gebruikers de Foundry Agent Consumer-rol nodig op het project of de agent die de aanroepende agent host. Is het remote endpoint een andere Foundry agent, dan heeft de gebruiker ook toegang tot dat doelproject of die agent nodig.","rationale":["Juist: least-privilege rol voor de gebruiker op de aanroepende agent.","Juist: de gebruiker heeft ook toegang tot de remote Foundry agent nodig.","Foundry Owner is sterk geprivilegieerd en schendt least privilege.","Dit lost alleen een mislukte agent card-ophaling op; andere gebruikers slagen, dus de agent card is niet het probleem.","Bij passthrough wordt de identiteit van de gebruiker gebruikt, niet de project managed identity."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"4.1.2-11","obj":"4.1.2","difficulty":"hard","type":"single","stem":"City Power & Light hosts an MCP server on Azure Functions that agents in a Microsoft Foundry project call. Agents currently authenticate by using a function key (x-functions-key) that is stored in a key-based project connection. Auditors report that anyone with access to the project can access the key. The requirements are:\n\n- Remove the need to manage and rotate secrets.\n- All users can share a single identity for the tool.\n- The Function App supports Microsoft Entra authentication.\n\nWhat should you do?","choices":["Enable Azure Functions authentication with Microsoft Entra ID and change the connection to Microsoft Entra project managed identity authentication.","Change the connection to OAuth identity passthrough by using a custom app registration.","Rotate the function key every 30 days by using an Azure Key Vault rotation function.","Change the connection to unauthenticated access, and restrict the Function App to the Foundry outbound IP addresses."],"answer":[0],"explanation":"Microsoft Entra-authenticatie elimineert secrets en heeft ingebouwde tokenrotatie. Voor Azure Functions MCP servers raadt Learn aan om Functions-authenticatie in te schakelen en in Foundry de project managed identity te gebruiken. Een gedeelde identiteit volstaat volgens de eisen.","rationale":["Juist: geen secrets, gedeelde identiteit en ondersteund door de Function App.","Passthrough is per gebruiker en vereist consent; niet nodig en bevat nog een client secret.","Rotatie verkleint het risico, maar het secret blijft bestaan en blijft zichtbaar voor projectleden.","Unauthenticated access wordt niet aanbevolen voor productie en vervangt geen authenticatie van de aanroeper."],"ref":"https://learn.microsoft.com/azure/foundry/mcp/build-your-own-mcp-server"},{"id":"4.1.3-01","obj":"4.1.3","difficulty":"easy","type":"single","stem":"A. Datum Corporation runs a hosted agent that reads an API key from an Azure Key Vault that uses the Azure RBAC permission model. The managed identity of the agent must read secret values. The identity must not create, update, or delete secrets.\n\nWhich role should you assign to the managed identity?","choices":["Key Vault Secrets User","Key Vault Secrets Officer","Key Vault Reader","Key Vault Crypto User"],"answer":[0],"explanation":"Key Vault Secrets User geeft leesrechten op de inhoud van secrets. Dat is precies wat de agent nodig heeft, zonder beheerrechten.","rationale":["Juist: leest secret contents en niets meer.","Secrets Officer kan alle acties op secrets uitvoeren, inclusief aanmaken en verwijderen.","Key Vault Reader leest alleen metadata en kan secret values niet lezen.","Crypto User is voor cryptografische operaties met keys, niet voor secrets."],"ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.3-02","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. plans to encrypt a Microsoft Foundry resource by using customer-managed keys. The key vault is in the same region as the Foundry resource and has no firewall rules.\n\nWhich key vault setting should you enable before you configure the customer-managed key?","choices":["soft delete and purge protection","a private endpoint","the trusted Microsoft services firewall exception","the Premium pricing tier"],"answer":[0],"explanation":"Voor CMK met Foundry vereist Azure dat soft delete en purge protection op de key store zijn ingeschakeld, om sleutels te beschermen tegen onbedoeld of kwaadwillend verwijderen.","rationale":["Juist: verplichte voorwaarde voor customer-managed keys.","Een private endpoint is geen vereiste voor CMK.","Deze uitzondering is alleen nodig als de Key Vault firewall actief is; die is hier niet ingesteld.","Premium (HSM-backed keys) is niet vereist voor CMK."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/encryption-keys-portal"},{"id":"4.1.3-03","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Bellows College stores a TLS certificate in Azure Key Vault for an MCP endpoint. The certificate is issued by DigiCert through the Key Vault partnership. The certificate must renew without manual action at 80 percent of its lifetime.\n\nWhat should you configure?","choices":["a lifetime action that automatically renews the certificate at a percentage of its lifetime","a lifetime action that sends email notifications to the certificate contacts at a percentage of its lifetime","a key rotation policy on the certificate key","an Event Grid subscription for the SecretNearExpiry event that triggers a function"],"answer":[0],"explanation":"Key Vault vernieuwt certificaten van partner-CA's zoals DigiCert automatisch via de lifetime action 'Automatically renew at a given time'. Standaard staat die op 80 procent van de levensduur.","rationale":["Juist: zet autorotatie aan voor certificaten van een partner-CA.","E-mailen waarschuwt alleen contactpersonen en vernieuwt niets.","Een key rotation policy geldt voor Key Vault keys, niet voor de vernieuwing van certificaten.","Een custom functie is onnodig; de partner-CA-integratie vernieuwt zelf."],"ref":"https://learn.microsoft.com/azure/key-vault/certificates/tutorial-rotate-certificates"},{"id":"4.1.3-04","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Graphic Design Institute creates a new Microsoft Foundry resource. Security requires that secrets for connections that do not use Microsoft Entra ID are stored in a key vault that Graphic Design Institute manages, instead of in a Microsoft-managed key vault.\n\nWhat should you do before you create any connections?","choices":["Create an Azure Key Vault connection on the Foundry resource.","Configure customer-managed keys on the Foundry resource.","Assign the Key Vault Secrets User role to each project managed identity.","Store the secrets as Key Vault references in the Foundry project settings."],"answer":[0],"explanation":"Zonder Key Vault connection slaat Foundry connection-gegevens op in een Microsoft-managed Key Vault buiten je subscription. Met een eigen Key Vault connection beheer je de secrets zelf; dit moet voordat er andere connections bestaan, want migratie wordt niet ondersteund.","rationale":["Juist: koppelt een eigen (BYO) Key Vault voor connection secrets.","CMK versleutelt data at rest maar bepaalt niet waar connection secrets worden opgeslagen.","Een roltoewijzing verplaatst de opslag van connection secrets niet.","Key Vault references is een App Service- en Container Apps-functie, geen Foundry projectinstelling."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/set-up-key-vault-connection"},{"id":"4.1.3-05","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Southridge Video uses a customer-managed key in Azure Key Vault to encrypt agent data. Compliance requires a new key version every 90 days. The solution must require no custom code, and the encrypting services must start to use the new version without configuration changes.\n\nWhat should you do?","choices":["Configure a key rotation policy on the key, and configure the services to use the versionless key URI.","Create an Event Grid subscription for the key near expiry event that triggers an Azure Functions app to create a new key version.","Import a new key every 90 days and update each service to use the versioned key URI.","Configure a certificate lifetime action that renews the key every 90 days."],"answer":[0],"explanation":"Een key rotation policy maakt automatisch nieuwe keyversies aan (minimaal 7 dagen interval). Services die de versionless key URI gebruiken, pakken automatisch de nieuwste versie. Zo voldoe je zonder custom code aan beide eisen.","rationale":["Juist: native autorotatie plus versionless URI.","Event Grid met een functie is custom code; nodig als autorotatie niet kan, zoals bij geimporteerde HSM-keys.","Handmatig importeren en versioned URI's bijwerken vereist steeds configuratiewijzigingen.","Certificate lifetime actions gelden voor certificaten, niet voor losse CMK keys."],"ref":"https://learn.microsoft.com/azure/key-vault/keys/how-to-configure-key-rotation"},{"id":"4.1.3-06","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Nod Publishers has an agent tool that connects to a SQL Server instance by using a password stored as a secret in Azure Key Vault. SQL Server supports only one set of credentials for the login. The password must be rotated automatically before it expires.\n\nWhat should you implement?","choices":["an Event Grid SecretNearExpiry subscription that triggers a function to create a password, store a new secret version, and update SQL Server","a key rotation policy on the secret that generates a new version of the secret every 60 days","a certificate lifetime action that automatically renews the secret before it expires","an alternating primary and secondary credential pattern that stores each credential as a version of the same secret"],"answer":[0],"explanation":"Secret-autorotatie werkt via Event Grid: Key Vault publiceert dertig dagen voor expiratie een near expiry event, waarna een functie een nieuw wachtwoord maakt, een nieuwe secretversie opslaat en SQL Server bijwerkt. Rotation policies bestaan alleen voor keys.","rationale":["Juist: het patroon voor resources met een set credentials.","Key rotation policies gelden voor cryptografische keys, niet voor secrets.","Lifetime actions gelden voor certificaten.","Het dual-credential patroon vereist een resource met twee sets credentials; SQL Server heeft er hier een."],"ref":"https://learn.microsoft.com/azure/key-vault/secrets/tutorial-rotation"},{"id":"4.1.3-07","obj":"4.1.3","difficulty":"medium","type":"single","stem":"First Up Consultants deploys an agent to Azure Container Apps. The agent reads an MCP API key from Azure Key Vault through a Container Apps secret. When the key is rotated in Key Vault, the agent must pick up the new value without a new deployment.\n\nWhich configuration should you use for the Container Apps secret?","choices":["as a Key Vault reference that uses a versionless secret URI and a managed identity that has the Key Vault Secrets User role","as a Key Vault reference that uses a versioned secret URI and a managed identity that has the Key Vault Secrets User role","as a secret value that a CI/CD pipeline copies from Key Vault during each deployment","as a Key Vault reference that uses a versionless secret URI and a managed identity that has the Key Vault Reader role"],"answer":[0],"explanation":"Met een versionless URI haalt Container Apps binnen 30 minuten de nieuwste versie op en herstart actieve revisions. De managed identity heeft Key Vault Secrets User nodig om de waarde te lezen.","rationale":["Juist: versionless URI plus leesrechten op de secret value.","Een versioned URI pint een specifieke versie; rotatie wordt niet opgepikt.","Kopieren tijdens deployment vereist juist een nieuwe deployment bij elke rotatie.","Key Vault Reader leest alleen metadata en kan de secret value niet lezen."],"ref":"https://learn.microsoft.com/azure/container-apps/manage-secrets"},{"id":"4.1.3-08","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Best For You Organics Company has an operations team that rotates connection secrets for agents. The team must create, update, and delete secrets in a key vault that uses the Azure RBAC permission model. The team must not be able to manage role assignments or work with keys and certificates.\n\nWhich role should you assign to the operations team?","choices":["Key Vault Secrets Officer","Key Vault Administrator","Key Vault Data Access Administrator","Key Vault Secrets User"],"answer":[0],"explanation":"Key Vault Secrets Officer mag elke actie op secrets uitvoeren, behalve permissies beheren. Dat dekt aanmaken, bijwerken en verwijderen zonder toegang tot keys, certificates of roltoewijzingen.","rationale":["Juist: volledig secretbeheer zonder permissiebeheer.","Administrator geeft ook rechten op keys en certificates; te breed.","Data Access Administrator beheert roltoewijzingen, precies wat het team niet mag.","Secrets User kan secrets alleen lezen, niet aanmaken of bijwerken."],"ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.3-09","obj":"4.1.3","difficulty":"hard","type":"single","stem":"Wingtip Toys must encrypt a new Microsoft Foundry resource by using a customer-managed key. The key vault will use the Azure RBAC permission model. You use a user-assigned managed identity for the Foundry resource.\n\nWhich sequence of actions should you perform?","choices":["Create a key vault in the Foundry region with soft delete and purge protection -> create an RSA key -> assign the Key Vault Crypto User role on the key vault to the managed identity -> configure customer-managed key encryption on the Foundry resource by using the key and the managed identity","Configure customer-managed key encryption on the Foundry resource -> create a key vault in the Foundry region with soft delete and purge protection -> create an RSA key -> assign the Key Vault Crypto User role on the key vault to the managed identity","Create a key vault in the Foundry region with soft delete and purge protection -> create an RSA key -> assign the Key Vault Secrets User role on the key vault to the managed identity -> configure customer-managed key encryption on the Foundry resource by using the key and the managed identity","Create a key vault in a paired region without purge protection -> create an RSA key -> configure customer-managed key encryption on the Foundry resource -> assign the Key Vault Crypto User role on the key vault to the managed identity"],"answer":[0],"explanation":"De key store moet in dezelfde regio staan met soft delete en purge protection. De managed identity heeft bij RBAC de rol Key Vault Crypto User nodig voordat Foundry de key kan gebruiken; pas daarna configureer je de encryptie.","rationale":["Juist: voorwaarden eerst, dan key, dan rechten, dan encryptie configureren.","Encryptie configureren voordat de key en rechten bestaan, faalt.","Secrets User geeft geen wrap- en unwrap-operaties op keys.","Een andere regio en het ontbreken van purge protection schenden de vereisten, en rechten komen te laat."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/encryption-keys-portal"},{"id":"4.1.3-10","obj":"4.1.3","difficulty":"hard","type":"multi","stem":"The Phone Company runs five agents. Each agent has its own managed identity and reads its own secrets. All secrets are currently stored in one shared key vault that uses the Azure RBAC permission model. Security requires that each identity can read only the values of its own secrets.\n\nWhich two solutions should you implement? Each correct answer presents a complete solution.","choices":["Move the secrets of each agent to a dedicated key vault, and assign the Key Vault Secrets User role to the agent identity at the scope of that key vault.","Assign the Key Vault Secrets User role to each identity at the scope of each individual secret that the agent uses.","Assign the Key Vault Reader role to each identity at the scope of the shared key vault.","Assign the Key Vault Secrets Officer role to each identity at the scope of each individual secret.","Create a vault access policy with the Get secret permission for each identity in the shared key vault."],"answer":[0,1],"explanation":"Microsoft raadt een key vault per applicatie per omgeving aan, met rollen op vault-scope. Key Vault RBAC ondersteunt ook roltoewijzingen op een individueel secret. Beide geven elke identiteit alleen leesrechten op de eigen secrets.","rationale":["Juist: een vault per agent met Secrets User op vault-scope is de aanbevolen isolatie.","Juist: Secrets User op secret-scope beperkt het lezen tot de eigen secrets.","R

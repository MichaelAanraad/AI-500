[0,1],"explanation":"Blue-green in Container Apps combineert revisies, traffic weights en revisielabels. Multiple revision mode houdt beide revisies actief; een label geeft de groene revisie een eigen FQDN voor testers, waarna je met label-gewichten het verkeer omzet.","rationale":["Juist: multiple revision mode is nodig om beide revisies actief te houden en verkeer te verdelen.","Juist: labels geven elke revisie een vaste URL en maken omschakelen via label-gewichten mogelijk.","Onjuist: single revision mode stuurt automatisch al het verkeer naar de nieuwste revisie, zonder gecontroleerde test vooraf.","Onjuist: de blauwe revisie moet actief blijven voor rollback; vroeg deactiveren maakt terugschakelen onmogelijk.","Onjuist: een tweede omgeving is niet nodig; beide revisies leven binnen dezelfde container app."],"ref":"https://learn.microsoft.com/azure/container-apps/blue-green-deployment"},{"id":"4.3.1-11","obj":"4.3.1","difficulty":"hard","type":"single","stem":"Adatum Corporation adopts a Development-Test-Acceptance-Production (DTAP) methodology combined with a canary release for its multi-agent research solution. Every change must pass automated regression and integration tests before business validation, and production exposure must start with a small user group.\n\nWhich sequence of actions should you perform?","choices":["Deploy to development -> run regression and integration tests in test -> obtain business approval in acceptance -> release to a small production group and expand","Deploy to development -> obtain business approval in acceptance -> run regression and integration tests in test -> release to every production user","Run regression and integration tests in test -> deploy to development -> release to a small production group -> obtain business approval in acceptance","Deploy to development -> release to a small production group -> run regression and integration tests in test -> obtain business approval in acceptance"],"answer":[0],"explanation":"DTAP promoveert een release in vaste volgorde: bouwen in Development, technische tests in Test, business-acceptatie in Acceptance en pas dan Production. De canary start in productie met een kleine groep en breidt daarna uit.","rationale":["Juist: dit volgt D-T-A-P en start productie met een kleine groep.","Onjuist: de business keurt hier goed voordat de geautomatiseerde tests zijn uitgevoerd, en productie gaat direct naar iedereen.","Onjuist: tests vinden plaats voor de development-deploy, en acceptatie komt pas na de productierelease.","Onjuist: productie wordt bereikt voordat test en acceptance zijn doorlopen."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ready/considerations/environments"},{"id":"4.3.2-01","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Litware, Inc. deploys a hosted agent in Foundry Agent Service. The agent endpoint uses the default routing policy. Litware wants to deploy a candidate version and test it before production consumers receive it.\n\nWhat should you do before you deploy the candidate version?","choices":["Pin the endpoint to the current version by using one FixedRatio rule set to 100 percent","Disable the agent endpoint until the candidate version is tested","Delete the previous version after the candidate version becomes active","Deploy the candidate version and then run smoke tests against the default endpoint"],"answer":[0],"explanation":"Standaard volgt een Foundry-agentendpoint de nieuwste versie, dus een nieuwe versie kan productie direct veranderen. Door vooraf te pinnen op de huidige versie met een FixedRatio-regel op 100 procent scheid je deployment van promotie.","rationale":["Juist: pinnen voorkomt dat de nieuwe versie automatisch productieverkeer krijgt.","Onjuist: uitschakelen haalt productie offline in plaats van productie ongewijzigd te laten draaien.","Onjuist: de vorige versie verwijderen schrapt juist het rollbackdoel; verwijderen is geen rollback.","Onjuist: zonder pin krijgt productie de kandidaat al voordat de smoke test draait."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/manage-hosted-agent"},{"id":"4.3.2-02","obj":"4.3.2","difficulty":"easy","type":"single","stem":"Coho Winery hosts its agents in Azure Container Apps and uses blue-green deployment. After production traffic is switched to the green revision, error rates increase. The blue revision is still active.\n\nWhat should you do to roll back?","choices":["Set the traffic weights so that the blue revision receives 100 percent of the traffic","Build the previous container image again and deploy it as a new revision","Delete the green revision and wait for a new revision to be created","Restore the container app from a backup of the previous day"],"answer":[0],"explanation":"Bij blue-green in Container Apps draai je de verkeerswissel terug, zodat het verkeer weer naar de stabiele blauwe revisie gaat. De groene revisie blijft beschikbaar voor een volgende poging.","rationale":["Juist: verkeer terugzetten naar blue is de snelste rollback zonder redeploy.","Onjuist: opnieuw bouwen en deployen kost tijd en is onnodig omdat blue nog actief is.","Onjuist: verwijderen van green zet niet expliciet al het verkeer op blue en vernietigt de revisie voor analyse.","Onjuist: een back-up terugzetten is traag en niet nodig bij een verkeerswissel."],"ref":"https://learn.microsoft.com/azure/container-apps/blue-green-deployment"},{"id":"4.3.2-03","obj":"4.3.2","difficulty":"easy","type":"single","stem":"Trey Research defines a rollback strategy for its multi-agent analytics solution. The team must agree on the target state that a rollback restores.\n\nWhich state should the team define as the rollback target?","choices":["The last healthy workload state before deployment","The immediately prior application version","The most recent build that passed unit tests","The first production release of the solution"],"answer":[0],"explanation":"Rollback herstelt de last-known-good configuratie: de laatste gezonde staat van de workload voor de deployment begon. Dat is niet per se de direct vorige applicatieversie.","rationale":["Juist: last known good is de laatste gezonde staat voor de deployment.","Onjuist: de vorige applicatieversie is niet noodzakelijk gezond geweest of omvat niet alle configuratie.","Onjuist: een build die unit tests haalt, is nooit gezond in productie bewezen.","Onjuist: de eerste release negeert alle latere gezonde wijzigingen."],"ref":"https://learn.microsoft.com/azure/well-architected/design-guides/incident-management"},{"id":"4.3.2-04","obj":"4.3.2","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. promoted version 7 of a hosted agent to production by updating the agent endpoint selector. Production checks fail. Version 6 is retained in the project. The rollback must not rebuild code or create another agent version.\n\nWhat should you do?","choices":["Set the endpoint selector to version 6 at 100 percent","Delete version 7 of the agent","Run azd deploy with the source code of version 6","Disable the agent endpoint"],"answer":[0],"explanation":"Een rollback voor een hosted agent herstelt de vorige concrete versieselector. Deze bewerking bouwt geen code en maakt geen nieuwe versie aan. Een versie verwijderen is volgens de documentatie geen rollback-operatie.","rationale":["Juist: de selector terugzetten naar versie 6 is direct en maakt geen nieuwe versie.","Onjuist: het verwijderen van een versie is expliciet geen rollback-operatie.","Onjuist: azd deploy bouwt de code opnieuw en maakt een nieuwe versie, wat de eis schendt.","Onjuist: uitschakelen haalt het endpoint offline in plaats van de gezonde versie te serveren."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/deploy-hosted-agent-production"},{"id":"4.3.2-05","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Proseware, Inc. rolled back a hosted agent from version 9 to version 8 by updating the endpoint selector. The endpoint show command confirms that version 8 receives 100 percent of the traffic, and new sessions behave as expected. Users who started conversations before the rollback still receive responses with the version 9 behavior.\n\nWhat should you identify as the cause?","choices":["Existing sessions remain bound to the version that they were created with","The selector update requires a redeployment of the agent code to apply","The azd deploy command overwrote the production pin with stale endpoint settings","The version 9 container image is still stored in the container registry"],"answer":[0],"explanation":"Een bestaande sessie wordt bij aanmaak aan een versie gebonden; het wijzigen van de endpoint-selector migreert die sessies niet. Daarom moet je vorige versies behouden zolang sessies ervan afhangen en gebruikers nieuwe sessies laten starten.","rationale":["Juist: sessies blijven gebonden aan hun versie, alleen nieuwe sessies volgen de selector.","Onjuist: een endpoint-update wijzigt de routering zonder redeploy; endpoint show en het gedrag van nieuwe sessies bevestigen dat de selector al actief is.","Onjuist: er is geen deploy uitgevoerd en de selector staat aantoonbaar op versie 8.","Onjuist: een bewaard image bepaalt niet welke versie een sessie gebruikt; vorige versies en images bewaren is juist aanbevolen voor rollback."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/manage-hosted-agent"},{"id":"4.3.2-06","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. pinned the production endpoint of a hosted agent to version 4 and promoted version 5 manually after approval. A later routine pipeline run with azd deploy changed the production routing back to an outdated configuration.\n\nWhat should you do to prevent this issue?","choices":["Keep the final routing configuration in the production agentEndpoint settings","Remove the version selector so that the endpoint follows the latest version","Add the --no-prompt flag to the azd deploy command","Move the pipeline from GitHub Actions to Azure Pipelines"],"answer":[0],"explanation":"Tijdens azd deploy past azd ook de endpoint-instellingen toe die voor de agent zijn geconfigureerd. Bewaar daarom de definitieve routeringsconfiguratie bij de productie-releaseinstellingen, zodat een latere run geen verouderde configuratie terugzet.","rationale":["Juist: de opgeslagen definitieve routering voorkomt dat een pipeline een oude selector opnieuw toepast.","Onjuist: de latest-versie volgen laat elke nieuwe deploy direct productie veranderen.","Onjuist: --no-prompt voorkomt hangende prompts, maar verandert niet welke endpoint-instellingen worden toegepast.","Onjuist: de CI/CD-provider wisselen lost niet op dat azd de geconfigureerde endpoint-instellingen toepast."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/deploy-hosted-agent-production"},{"id":"4.3.2-07","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Relecloud uses source-code deployment for a hosted agent in Foundry Agent Service across development, test, and production. Each environment is bound to its own Foundry project. Auditors require that the code released to production is exactly the code that passed regression and integration tests in test.\n\nWhich release approach should you use?","choices":["Record the tested source commit and deploy that same commit separately to each environment","Build one package in development and copy that package to the test and production projects","Deploy the latest commit on the main branch to each environment at release time","Trigger production from the main branch and test from the develop branch"],"answer":[0],"explanation":"Voor hosted agents adviseert Microsoft dezelfde bronrevisie te promoveren, maar de broncode per omgeving afzonderlijk te packagen en deployen in plaats van een gedeeld build-artefact te gebruiken. Door de geteste commit vast te leggen is aantoonbaar dezelfde code in productie beland.","rationale":["Juist: dezelfde vastgelegde commit, per omgeving apart gedeployed, volgt de richtlijn en voldoet aan de audit.","Onjuist: de documentatie zegt expliciet geen gedeeld build-artefact te gebruiken tussen omgevingen.","Onjuist: de nieuwste commit op main kan verschillen van wat in test is gevalideerd.","Onjuist: verschillende branches per omgeving betekent dat productie andere code kan krijgen dan test."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/deploy-hosted-agent-production"},{"id":"4.3.2-08","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Tailspin Toys deploys a hosted agent from GitHub Actions. Two workflow runs recently changed the production agent at the same time. A deployment that is already running must finish before the next one starts.\n\nYou need to complete the workflow definition.\n\n```yaml\nname: Azure Developer CLI\non:\n  push:\n    branches: [main]\npermissions:\n  id-token: write\n  contents: read\n# ...\njobs:\n  build:\n    runs-on: ubuntu-latest\n```\n\nWhich setting should you add at the top level of the workflow?","choices":["concurrency: with group: hosted-agent-deployment and cancel-in-progress: false","concurrency: with group: hosted-agent-deployment and cancel-in-progress: true","permissions: with deployments: write","strategy: with max-parallel: 1"],"answer":[0],"explanation":"Een concurrency group serialiseert de deployments van deze workflow. Met cancel-in-progress op false maakt een lopende deployment eerst zijn werk af. Let op: een GitHub concurrency group is geen service-brede lock; andere tools moeten apart worden gecoordineerd.","rationale":["Juist: dit serialiseert runs zonder een lopende deployment af te breken.","Onjuist: cancel-in-progress true breekt de lopende deployment af, wat de eis schendt.","Onjuist: permissions regelt tokenrechten en serialiseert geen runs.","Onjuist: max-parallel beperkt matrix-jobs binnen een run, niet gelijktijdige workflow-runs."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.2-09","obj":"4.3.2","difficulty":"hard","type":"multi","stem":"Woodgrove Bank releases a new version of a hosted agent to production in Foundry Agent Service. Production consumers must keep receiving the current version until the exact candidate version is validated and approved.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Pin the production endpoint to the current concrete version before deploying the candidate","Test the candidate in a fresh session that is pinned to the captured candidate version","Resolve the latest version again after approval and promote that version","Treat the version activation reported by azd deploy as a passing test","Delete the current version after the candidate is deployed"],"answer":[0,1],"explanation":"De documentatie scheidt deployment van promotie: pin eerst productie op de huidige versie, maak de kandidaat en test die in een nieuwe sessie die aan de vastgelegde kandidaatversie is gepind. Pas na goedkeuring zet je de selector op die geteste versie.","rationale":["Juist: pinnen houdt productie stabiel tijdens de release.","Juist: een versiegepinde sessie test exact de kandidaat die je wilt promoveren.","Onjuist: latest opnieuw resolven kan een andere versie opleveren dan je hebt getest.","Onjuist: activatie betekent alleen gereedheid, niet dat de agent correct werkt.","Onjuist: de huidige versie is je rollbackdoel en moet behouden blijven."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/manage-hosted-agent"},{"id":"4.3.2-10","obj":"4.3.2","difficulty":"easy","type":"single","stem":"Contoso, Ltd. deploys its multi-agent solution by using GitHub Actions. Release management requires that a designated reviewer approve each deployment to production before it runs.\n\nWhat should you configure?","choices":["Required reviewers on the production GitHub environment","A branch protection rule on the main branch","A concurrency group for the deployment workflow","A repository secret that stores the production subscription ID"],"answer":[0],"explanation":"GitHub-environments met protection rules en required reviewers zorgen dat een productie-deployment pas start na goedkeuring. Je kunt de environment ook beperken tot de main branch.","rationale":["Juist: environment protection rules met reviewers vormen de approval gate voor productie.","Onjuist: branch protection regelt merges naar main, niet het goedkeuren van een deployment-job.","Onjuist: concurrency serialiseert runs maar vraagt niemand om goedkeuring.","Onjuist: een secret parametriseert de identiteit, maar dwingt geen goedkeuring af."],"ref":"https://learn.microsoft.com/devops/deliver/iac-github-actions"},{"id":"4.3.2-11","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Adatum Corporation stores agent conversation state in Azure Cosmos DB. The next release changes the shape of the stored records. The release must remain safe to roll back if the new agent version fails in production.\n\nWhich approach should you use to implement the data change?","choices":["Add the new record shape alongside the old records and deprecate the old ones later","Replace the existing records with records in the new schema during the deployment","Plan to roll forward with a hotfix because rollback is not possible after schema changes","Restore a database backup as a standard step in every rollback"],"answer":[0],"explanation":"Rollback is complex bij schema- en datawijzigingen. Het advies is schemawijzigingen additief te maken: oude records worden deprecated en bestaan naast nieuwe records tot ze veilig kunnen worden verwijderd.","rationale":["Juist: additieve wijzigingen laten de vorige versie blijven werken na een rollback.","Onjuist: records vervangen maakt de oude versie incompatibel en de rollback riskant.","Onjuist: roll forward is een optie, maar het advies is juist rollback mogelijk te houden via additieve wijzigingen.","Onjuist: een back-up terugzetten bij elke rollback is traag en kan recente data laten verdwijnen."],"ref":"https://learn.microsoft.com/azure/well-architected/design-guides/incident-management"},{"id":"4.3.3-01","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Litware, Inc. builds a multi-agent solution in which a deterministic router selects the next agent based on parsed user intent. The team needs fast tests that validate the routing logic and prompt templates in isolation on every build.\n\nWhich type of test should you use?","choices":["Unit tests","Integration tests","End-to-end tests","Load tests"],"answer":[0],"explanation":"Unit tests vormen de basis van de testpiramide: ze testen afzonderlijke componenten geisoleerd en snel. Het Well-Architected Framework adviseert unit tests voor deterministische onderdelen zoals prompt templates en tool-selectielogica.","rationale":["Juist: geisoleerde, snelle tests van deterministische logica zijn unit tests.","Onjuist: integratietests valideren interacties tussen componenten en zijn trager.","Onjuist: end-to-end tests doorlopen het hele systeem en zijn het traagst.","Onjuist: load tests meten schaalbaarheid, niet de correctheid van routeringslogica."],"ref":"https://learn.microsoft.com/azure/well-architected/ai/test"},{"id":"4.3.3-02","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. deploys an orchestrator agent that calls a retrieval agent and an MCP server in the test environment. The team needs tests that verify that these components interact correctly with each other and with their shared services.\n\nWhich type of test should you add?","choices":["Integration tests","Unit tests","Manual exploratory tests","Stress tests"],"answer":[0],"explanation":"Integratietests valideren interacties tussen componenten, API's, contracten en gedeelde services. Ze vormen de middelste laag van de testpiramide en vangen configuratie- en interactiefouten vroeg.","rationale":["Juist: interacties tussen agents en services testen is integratietesten.","Onjuist: unit tests isoleren een component en testen geen echte interacties.","Onjuist: handmatig verkennend testen is duur en niet bedoeld als herhaalbare interactietest.","Onjuist: stress tests zoeken capaciteitsgrenzen, niet functionele interactie."],"ref":"https://learn.microsoft.com/azure/well-architected/operational-excellence/testing"},{"id":"4.3.3-03","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Northwind Traders had a production incident in which its billing agent selected the wrong tool for refund requests. The bug is now fixed. Northwind wants to make sure that the same defect is caught automatically in future releases.\n\nWhat should you do?","choices":["Add a test case that reproduces the incident to the automated regression suite","Add the scenario to the load test plan","Remove the existing tool-selection tests because they missed the defect","Rely on manual testing before each release"],"answer":[0],"explanation":"Het Well-Architected Framework adviseert de regressiesuite gericht te laten groeien: voeg tests toe bij productie-incidenten en kritieke bugfixes, en automatiseer de suite zodat die consequent draait.","rationale":["Juist: een incident omzetten naar een geautomatiseerde regressietest voorkomt herhaling.","Onjuist: load tests richten zich op prestaties, niet op het juiste toolgebruik.","Onjuist: tests verwijderen verkleint de dekking; je vult de suite juist aan.","Onjuist: handmatig testen is duur en niet consequent; regressie moet geautomatiseerd zijn."],"ref":"https://learn.microsoft.com/azure/well-architected/operational-excellence/testing"},{"id":"4.3.3-04","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Relecloud must probe its travel agents for prompt injection and jailbreak vulnerabilities at scale before each deployment. The results must include an attack success rate.\n\nWhich tool should you use?","choices":["AI Red Teaming Agent","Continuous evaluation","Groundedness evaluator","Azure Load Testing"],"answer":[0],"explanation":"De AI Red Teaming Agent simuleert adversarial probing met PyRIT en scoort elk aanval-antwoordpaar, met metrics zoals Attack Success Rate. Het is bedoeld voor ontwerp, ontwikkeling en pre-deployment.","rationale":["Juist: geautomatiseerde adversarial scans met ASR zijn de kern van de AI Red Teaming Agent.","Onjuist: continuous evaluation beoordeelt een steekproef van productieverkeer na deployment.","Onjuist: groundedness meet of antwoorden door context worden ondersteund, niet aanvalsweerbaarheid.","Onjuist: load testing meet prestaties onder belasting, niet beveiligingsrisico's."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/ai-red-teaming-agent"},{"id":"4.3.3-05","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Tailspin Toys builds agents with Microsoft Agent Framework. The answers of a support agent vary in wording between runs. The test suite must determine whether each answer follows the instructions and constraints of the agent, and exact text assertions keep failing.\n\nWhich evaluator should you use?","choices":["The Foundry task adherence evaluator","The keyword_check local evaluator","The tool_called_check local evaluator","An exact-match comparison against expected output"],"answer":[0],"explanation":"Bij non-deterministische output zijn exacte tekstvergelijkingen broos. Task adherence is een LLM-as-judge-evaluator die beoordeelt of de agent instructies en beperkingen volgt, onafhankelijk van de formulering.","rationale":["Juist: task adherence beoordeelt semantisch of instructies zijn gevolgd.","Onjuist: keyword_check controleert alleen of bepaalde woorden voorkomen, niet of instructies zijn gevolgd.","Onjuist: tool_called_check controleert alleen of een tool is aangeroepen.","Onjuist: exacte vergelijking faalt juist door de variatie in formulering."],"ref":"https://learn.microsoft.com/agent-framework/agents/evaluation"},{"id":"4.3.3-06","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Contoso, Ltd. runs CI smoke tests for an inventory agent built with Microsoft Agent Framework in Python. The check must confirm that the agent called the search_inventory tool. The check must run locally without calling a cloud evaluation service, and the test data does not include expected tool calls.\n\nYou need to complete the code.\n\n```python\nfrom agent_framework import LocalEvaluator, evaluate_agent\n\nlocal = LocalEvaluator(\n    ________(\"search_inventory\"),\n)\nresults = await evaluate_agent(agent=agent, queries=queries, evaluators=local)\n```\n\nWhich function should you use to complete the code?","choices":["tool_called_check","keyword_check","tool_calls_present","evaluator"],"answer":[0],"explanation":"LocalEvaluator draait checks lokaal zonder API-calls, ideaal voor CI smoke tests. tool_called_check(\"search_inventory\") eist dat de agent die tool heeft aangeroepen, zonder dat expected tool calls nodig zijn.","rationale":["Juist: tool_called_check neemt toolnamen en controleert of ze zijn aangeroepen.","Onjuist: keyword_check controleert of de response bepaalde woorden bevat, niet of een tool is aangeroepen.","Onjuist: tool_calls_present vergelijkt met expected_tool_calls, die hier ontbreken, en wordt zonder argumenten gebruikt.","Onjuist: evaluator is een decorator om eigen checkfuncties te maken, geen ingebouwde tool-check."],"ref":"https://learn.microsoft.com/agent-framework/agents/evaluation"},{"id":"4.3.3-07","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Woodgrove Bank deploys a hosted agent by using the Azure Developer CLI. An evaluation suite was generated earlier and is stored in eval.yaml. The release pipeline must run that stored suite against the current agent and fail the job if scores drop below the threshold, without regenerating datasets or evaluators.\n\nWhich command should you add to the pipeline?","choices":["azd ai agent eval run --no-prompt","azd ai agent eval generate --no-prompt","azd ai agent invoke my-agent \"ping\" --no-prompt","azd ai agent monitor"],"answer":[0],"explanation":"azd ai agent eval run voert een opgeslagen eval (standaard eval.yaml) uit tegen de huidige agent voor regressiecontroles en regenereert geen datasets of evaluators. Zo faalt de job als scores onder de drempel zakken.","rationale":["Juist: eval run voert de opgeslagen suite uit zonder regeneratie.","Onjuist: eval generate maakt de suite aan; dat is niet nodig en verandert de baseline.","Onjuist: invoke stuurt een enkele prompt en beoordeelt geen scores tegen een drempel.","Onjuist: monitor toont status en logs, maar evalueert geen kwaliteit."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.3-08","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Alpine Ski House needs to test how its agent orchestration code handles HTTP 429 throttling and timeouts from the model inference endpoint. The tests must exercise the real retry and backoff behavior of the HTTP client, and the team wants to avoid paying for large numbers of model calls.\n\nWhat should you use to simulate the inference endpoint?","choices":["Dev Proxy","Unused provisioned throughput units in the production deployment","Azure Load Testing against the production model deployment","Unit tests that replace the client with an in-memory stub"],"answer":[0],"explanation":"Het Well-Architected Framework noemt Dev Proxy om het inference endpoint te simuleren, zodat je throttling en fouten kunt testen zonder kosten per call. De echte HTTP-client met retry en backoff wordt zo realistisch getest.","rationale":["Juist: Dev Proxy simuleert Azure OpenAI-responses zoals 429 zonder echte modelkosten.","Onjuist: productie-PTU's gebruiken voor tests raakt productie; het advies noemt ongebruikte PTU's in een testomgeving.","Onjuist: load testing tegen het echte endpoint kost per call en raakt productie.","Onjuist: een in-memory stub vervangt de HTTP-client en test dus niet het echte retry- en backoffgedrag."],"ref":"https://learn.microsoft.com/azure/well-architected/ai/test"},{"id":"4.3.3-09","obj":"4.3.3","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company compares two versions of a Foundry agent by using the AI agent evaluation GitHub Action with a dataset of five test queries. Version B scores 0.1 higher than version A on task adherence. The team must decide whether the difference is meaningful and must keep evaluation costs under control.\n\nWhat should you do?","choices":["Expand the dataset for confidence intervals and compare both agents in one run","Run the five-query evaluation on every commit and average the results","Repeat the five-query evaluation once and keep the version with the higher score","Replace the automated evaluation with human review of the five responses"],"answer":[0],"explanation":"De GitHub Action geeft confidence intervals en een paarsgewijze statistische vergelijking wanneer je meerdere agents evalueert, mits de dataset genoeg queries bevat. De documentatie adviseert ook om evaluatie niet op elke commit te draaien om kosten te beperken.","rationale":["Juist: voldoende queries plus paarsgewijze vergelijking toont of het verschil significant is.","Onjuist: evaluatie op elke commit verhoogt de kosten en lost de te kleine dataset niet op.","Onjuist: een herhaling met vijf queries geeft geen statistische zekerheid.","Onjuist: menselijke review van vijf antwoorden geeft evenmin een statistisch onderbouwd oordeel."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/evaluation-github-action"},{"id":"4.3.3-10","obj":"4.3.3","difficulty":"hard","type":"multi","stem":"Wide World Importers runs a multi-agent workflow built with Microsoft Agent Framework. Overall quality scores dropped after a release. The team must identify which sub-agent causes the drop, and must detect whether the agents behave inconsistently across repeated runs of the same query.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Evaluate the workflow by using evaluate_workflow and review the per-agent sub-results","Set num_repetitions so that each query runs multiple times independently","Evaluate the final output of the orchestrator agent by using evaluate_agent","Use the full conversation split strategy on the final output","Add keyword_check to the local evaluator"],"answer":[0,1],"explanation":"evaluate_workflow extraheert de interacties van elke sub-agent en geeft per agent resultaten, zodat je de oorzaak vindt. num_repetitions voert elke query meerdere keren onafhankelijk uit om non-deterministisch gedrag te detecteren.","rationale":["Juist: per-agent sub-results tonen welke sub-agent de daling veroorzaakt.","Juist: herhalingen meten de consistentie van het gedrag.","Onjuist: alleen de orchestrator evalueren geeft geen uitsplitsing per sub-agent.","Onjuist: de full split beoordeelt het totale traject, maar splitst niet uit per sub-agent.","Onjuist: keyword_check controleert woorden en helpt niet bij oorzaak of consistentie."],"ref":"https://learn.microsoft.com/agent-framework/agents/evaluation"},{"id":"4.3.3-11","obj":"4.3.3","difficulty":"hard","type":"single","stem":"Trey Research tuned the instructions of its research agents by iterating against a golden dataset. The same golden dataset is now used as the release gate, and every release passes with high scores. However, quality regressions keep appearing in production.\n\nWhat should you change in the testing strategy?","choices":["Use a separate test dataset that is distinct from the evaluation dataset used during tuning","Raise the pass threshold on the existing golden dataset","Add more evaluators to the release gate that use the same golden dataset","Replace the golden dataset with raw production conversations that are not anonymized"],"answer":[0],"explanation":"Het Well-Architected Framework scheidt evaluatie (iteratief tunen) en testen (systeemvalidatie bij elke wijziging) en zegt dat ze verschillende datasets moeten gebruiken. Een gate op de tuning-dataset geeft een vertekend, te optimistisch beeld.","rationale":["Juist: een aparte testdataset voorkomt dat de gate meet waar al op is geoptimaliseerd.","Onjuist: een hogere drempel op dezelfde dataset blijft vertekend.","Onjuist: meer evaluators op dezelfde dataset lossen de overlap niet op.","Onjuist: productiedata moet geanonimiseerd zijn; ruwe gesprekken gebruiken schendt privacy-richtlijnen."],"ref":"https://learn.microsoft.com/azure/well-architected/ai/test"},{"id":"4.3.4-01","obj":"4.3.4","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. deploys Bicep templates and agent code from GitHub Actions to Azure. Security policy prohibits storing client secrets or other long-lived credentials in GitHub.\n\nWhich authentication method should the workflow use to connect to Azure?","choices":["By using OpenID Connect with a federated identity credential","By using a service principal and a client secret","By using a personal access token stored as a repository secret","By using a storage account access key"],"answer":[0],"explanation":"OpenID Connect met een federated identity credential op een Microsoft Entra-applicatie of user-assigned managed identity laat de workflow aanmelden zonder opgeslagen geheimen. Service principal met secret wordt expliciet afgeraden.","rationale":["Juist: OIDC met workload identity federation vereist geen opgeslagen geheim.","Onjuist: een client secret is een lang levende credential en wordt niet aanbevolen.","Onjuist: een PAT is ook een opgeslagen geheim en geen Azure-aanmeldmethode voor de Azure Login action.","Onjuist: een storage key is een gedeeld geheim en geeft geen deploymentrechten op Azure."],"ref":"https://learn.microsoft.com/azure/developer/github/connect-from-azure"},{"id":"4.3.4-02","obj":"4.3.4","difficulty":"easy","type":"single","stem":"Contoso, Ltd. deploys the infrastructure for its multi-agent solution by using Bicep. Before each production deployment, an operator must review a list of the resources that will be created, modified, or deleted.\n\nWhich operation should you add to the pipeline?","choices":["What-if","Bicep linter","Bicep build","Deployment create without confirmation"],"answer":[0],"explanation":"De what-if-operatie toont welke wijzigingen een Bicep-deployment zal maken, zodat je ze kunt beoordelen voor de echte deployment. Met --no-pretty-print krijg je JSON voor programmatische controle.","rationale":["Juist: what-if toont de geplande wijzigingen per resource.","Onjuist: de linter controleert code offline op regels, maar toont geen wijzigingen in Azure.","Onjuist: build compileert naar ARM JSON en toont geen effect op bestaande resources.","Onjuist: direct deployen geeft geen kans om de wijzigingen vooraf te beoordelen."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-what-if"},{"id":"4.3.4-03","obj":"4.3.4","difficulty":"easy","type":"single","stem":"Tailspin Toys wants the continuous integration stage of its pipeline to detect Bicep best-practice violations, such as insecure handling of secure inputs. The check must run without connecting to Azure.\n\nWhat should you use?","choices":["The Bicep linter","The what-if operation","Preflight validation","A post-deployment smoke test"],"answer":[0],"explanation":"De Bicep-linter voert offline validatie uit op basis van regels, bijvoorbeeld use-secure-value-for-secure-inputs. Je kunt bicep lint of bicep build in CI draaien zodat fouten de pipeline laten falen.","rationale":["Juist: de linter controleert regels offline in CI.","Onjuist: what-if communiceert met Azure om wijzigingen te berekenen.","Onjuist: preflight-validatie draait tegen Azure Resource Manager.","Onjuist: een smoke test vereist een gedeployde omgeving."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/linter"},{"id":"4.3.4-04","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Relecloud provisions the infrastructure for a hosted agent by using Terraform through the Azure Developer CLI. The pipeline deploys to development, test, and production. Terraform state must be shared by pipeline runs, must be kept separate per environment, and must not be exposed in the repository.\n\nWhich Terraform state configuration should you use?","choices":["Use a remote azurerm backend with a separate state key per environment","Commit the terraform.tfstate file to the repository after each run","Use one shared state key in the storage account for every environment","Upload the state file as an unrestricted workflow artifact after each run"],"answer":[0],"explanation":"De documentatie adviseert remote state in een Azure Storage blob container buiten de workload-deployment, met een aparte state key per omgeving. State en plans kunnen gevoelige waarden bevatten en mogen niet worden gecommit of als onbeperkt artefact worden geupload.","rationale":["Juist: remote backend met een key per omgeving deelt state veilig en houdt omgevingen gescheiden.","Onjuist: state committen is expliciet afgeraden omdat het gevoelige waarden kan bevatten.","Onjuist: een gedeelde key mengt de state van omgevingen.","Onjuist: state als onbeperkt artefact uploaden stelt gevoelige data bloot."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-05","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Adatum Corporation runs azd ai commands in an unattended CI job for a hosted agent. When a required value is missing from the environment, the job hangs until it times out. The job must fail fast with an error instead.\n\nWhich flag should you add to the azd ai commands?","choices":["--no-prompt","--debug","--output json","--project-endpoint"],"answer":[0],"explanation":"--no-prompt schakelt interactieve prompts uit, zodat de opdracht direct faalt met een duidelijke fout in plaats van te wachten op invoer. Microsoft adviseert dit altijd in CI te zetten.","rationale":["Juist: --no-prompt laat de job snel falen in plaats van te hangen.","Onjuist: --debug geeft extra diagnostiek maar voorkomt geen prompt.","Onjuist: --output json structureert uitvoer en verandert het promptgedrag niet.","Onjuist: --project-endpoint pint het project, maar lost een ontbrekende andere waarde niet op en stopt geen prompts."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-06","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Northwind Traders releases a code change to a hosted agent. The infrastructure configuration is unchanged, and a platform team owns the lifecycle of the shared Foundry resources.\n\nWhich command should the application release pipeline run?","choices":["azd deploy","azd up","azd provision","azd pipeline config"],"answer":[0],"explanation":"Voor een applicatie-release tegen bestaande infrastructuur draai je azd deploy zonder provisioning te herhalen. Provisioning van gedeelde resources hoort in de workflow van het platformteam.","rationale":["Juist: azd deploy maakt een nieuwe agentversie zonder infrastructuur te wijzigen.","Onjuist: azd up voert ook provisioning uit, wat de verantwoordelijkheid van het platformteam raakt.","Onjuist: azd provision wijzigt infrastructuur en deployt de code niet.","Onjuist: azd pipeline config stelt de pipeline eenmalig in en deployt niets."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-07","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Proseware, Inc. has a pipeline step that runs azd ai agent invoke after each deployment and marks the release as successful when the command returns any output. A defective agent version passed this step and reached users.\n\nWhat should you change in the smoke test?","choices":["Assert the expected response content in a fresh version-pinned session","Mark the step as successful when the command exits with code 0","Rely on azd deploy to wait for version activation","Check that the agent session log stream is not empty"],"answer":[0],"explanation":"azd deploy wacht op activatie, maar gereedheid zegt niets over correct gedrag. De documentatie zegt een nieuwe versiegepinde sessie te gebruiken en de verwachte inhoud te controleren; niet-lege output is geen geslaagde smoke test.","rationale":["Juist: controle van verwachte inhoud in een gepinde sessie test echt gedrag.","Onjuist: exitcode 0 zegt alleen dat de opdracht draaide, niet dat het antwoord klopt.","Onjuist: activatie is gereedheid, geen functionele validatie.","Onjuist: niet-lege logs bewijzen geen correct gedrag."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-08","obj":"4.3.4","difficulty":"hard","type":"single","stem":"Woodgrove Bank deploys Bicep templates for its agent platform from GitHub Actions. The pipeline must catch syntax and best-practice issues first, then catch issues such as unregistered resource providers without making changes, then let an approver review planned changes, and finally verify the deployed resources.\n\nWhich sequence of actions should you perform?","choices":["Run the Bicep linter -> run preflight validation -> run what-if and wait for approval -> deploy and run post-deployment tests","Run preflight validation -> run the Bicep linter -> deploy -> run what-if and wait for approval","Run what-if and wait for approval -> run the Bicep linter -> deploy -> run preflight validation","Deploy -> run post-deployment tests -> run the Bicep linter -> run what-if and wait for approval"],"answer":[0],"explanation":"De aanbevolen pipeline lint eerst offline, voert dan preflight-validatie uit tegen Azure (zonder te deployen), toont daarna what-if met handmatige goedkeuring en test na de deployment de resources.","rationale":["Juist: van goedkoop en offline naar Azure-validatie, goedkeuring, deployment en tests.","Onjuist: de linter hoort voor preflight, en what-if na de deployment is zinloos.","Onjuist: preflight-validatie na de deployment voorkomt geen mislukte deployment.","Onjuist: deployen voordat er is gelint of goedgekeurd, draait de volgorde om."],"ref":"https://learn.microsoft.com/training/modules/test-bicep-code-using-github-actions/"},{"id":"4.3.4-09","obj":"4.3.4","difficulty":"hard","type":"single","stem":"Fourth Coffee configured a pipeline by using azd pipeline config. The service principal created for the pipeline has the Contributor role on the subscription. The azd provision step for the Foundry resources of a hosted agent fails with an AuthorizationFailed error.\n\nWhich additional role should you assign to the service principal?","choices":["Foundry Owner","Foundry User","Reader","Storage Blob Data Contributor"],"answer":[0],"explanation":"Voor CI-provisioning van Foundry-resources heeft de pipeline-identiteit naast Contributor ook de rol Foundry Owner nodig. De troubleshootingtabel noemt precies deze combinatie bij AuthorizationFailed.","rationale":["Juist: Contributor plus Foundry Owner lost AuthorizationFailed bij provisioning op.","Onjuist: Foundry User is voor het gebruiken van projectresources, niet voor provisioning.","Onjuist: Reader voegt alleen leesrechten toe.","Onjuist: Storage Blob Data Contributor is nodig voor bijvoorbeeld Terraform-state, niet voor Foundry-provisioning."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-10","obj":"4.3.4","difficulty":"hard","type":"multi","stem":"Litware, Inc. defines CI/CD requirements for a multi-agent solution whose infrastructure is deployed by using infrastructure as code. In a recent release, every infrastructure test passed, but the agents could not use the deployed Azure AI Search index. Litware must catch this class of issue before release while keeping fast feedback in continuous integration.\n\nWhich two requirements should you include? Each correct answer presents part of the solution.","choices":["Run unit tests and validation on the IaC templates during continuous integration","Add a cross-layer smoke test that deploys the application and exercises the provisioned resources","Assign different Azure Policy definitions to each environment","Skip infrastructure tests when the application tests pass","Make emergency changes in the Azure portal and add them to the templates later"],"answer":[0,1],"explanation":"Het Well-Architected Framework zegt unit tests op alle code toe te passen, inclusief templates, en cross-layer tests toe te voegen. Infrastructuurtests alleen geven vals vertrouwen; een smoke test tegen de gedeployde applicatie vangt dat gat snel.","rationale":["Juist: IaC-unit tests en validatie in CI geven snelle feedback.","Juist: een cross-layer smoke test bewijst dat de applicatie de resources echt kan gebruiken.","Onjuist: verschillende policies per omgeving veroorzaken juist fouten bij promotie.","Onjuist: infrastructuurtests overslaan verkleint de dekking.","Onjuist: handmatige portalwijzigingen veroorzaken drift en omzeilen de pipeline."],"ref":"https://learn.microsoft.com/azure/well-architected/operational-excellence/testing"}]};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives;
const $app = document.getElementById("app");

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get("ai500.history", {}); // id -> true/false (last result)

const theme = store.get("ai500.theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("ai500.theme", next);
};

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dom = q => q.obj.split(".")[0];

let S = null; // current session

function home() {
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = store.get("ai500.cfg", { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all" });
  $app.innerHTML = `
  <div class="card">
    <h2>Nieuwe sessie</h2>
    <fieldset><legend>Domeinen</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${k}. ${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} vragen)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Niveau</legend><div class="row">
      ${[["easy", "Makkelijk"], ["medium", "Gemiddeld"], ["hard", "Moeilijk"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Vragenpool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> Alles</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Nog niet gezien</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Eerder fout (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Sessie</legend><div class="row">
      <label>Aantal <select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "Alle" : v}</option>`).join("")}</select></label>
      <label>Modus <select id="mode">
        <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Oefenen (direct feedback)</option>
        <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Examen (feedback aan het eind)</option>
      </select></label>
    </div></fieldset>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Voortgang op dit apparaat</h2>
    <p>${seen} van ${Q.length} vragen beantwoord, ${seen - wrong} laatst goed, ${wrong} laatst fout.</p>
    ${statsTable()}
    <div class="actions"><button class="ghost" id="reset" type="button">Voortgang wissen</button></div>
  </div>`;
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Alle voortgang wissen?")) { history = {}; store.set("ai500.history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${k}. ${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domein</th><th>Gedaan</th><th>Goed</th></tr>${rows}</table>`;
}

function start() {
  const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
  const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode: document.getElementById("mode").value };
  store.set("ai500.cfg", cfg);
  let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
  if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
  if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
  if (!pool.length) { document.getElementById("msg").textContent = "Geen vragen voor deze selectie."; return; }
  pool = shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n);
  S = { mode: cfg.mode, items: pool.map(q => ({ q, order: shuffle(q.choices.map((_, i) => i)), picked: null })), i: 0 };
  show();
}

function show() {
  const it = S.items[S.i], q = it.q, multi = q.type === "multi", done = it.picked !== null;
  const reveal = done && S.mode === "practice";
  const levels = { easy: "Makkelijk", medium: "Gemiddeld", hard: "Moeilijk" };
  $app.innerHTML = `
  <div class="bar"><div style="width:${100 * S.i / S.items.length}%"></div></div>
  <div class="card">
    <div class="chips">
      <span class="chip">Vraag ${S.i + 1} / ${S.items.length}</span>
      <span class="chip">${q.obj} ${esc(OBJ[q.obj])}</span>
      <span class="chip ${q.difficulty}">${levels[q.difficulty]}</span>
      ${multi ? `<span class="chip">Kies ${q.answer.length}</span>` : ""}
    </div>
    <div class="stem">${md(q.stem)}</div>
    <div id="choices">${it.order.map(ci => {
      const cls = reveal ? (q.answer.includes(ci) ? "correct" : it.picked.includes(ci) ? "wrong" : "") : "";
      return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" value="${ci}" ${done ? "disabled" : ""} ${done && it.picked.includes(ci) ? "checked" : ""}>
        <span>${inline(q.choices[ci])}${reveal ? `<div class="why">${inline(q.rationale[ci])}</div>` : ""}</span></label>`;
    }).join("")}</div>
    ${reveal ? feedback(it) : ""}
    <div class="actions">
      ${S.i > 0 ? `<button class="ghost" id="prev" type="button">Vorige</button>` : ""}
      ${done ? `<button id="next" type="button">${S.i + 1 < S.items.length ? "Volgende" : "Resultaat"}</button>` : `<button id="check" type="button" disabled>${S.mode === "practice" ? "Controleer" : "Bevestig"}</button>`}
      <button class="ghost" id="quit" type="button">Stoppen</button>
    </div>
  </div>`;
  const boxes = [...document.querySelectorAll("input[name=c]")];
  const btn = document.getElementById("check");
  if (btn) {
    boxes.forEach(b => b.onchange = () => {
      const n = boxes.filter(x => x.checked).length;
      if (multi && n > q.answer.length) { b.checked = false; return; }
      btn.disabled = multi ? n !== q.answer.length : n !== 1;
    });
    btn.onclick = () => {
      it.picked = boxes.filter(b => b.checked).map(b => +b.value);
      it.ok = it.picked.length === q.answer.length && it.picked.every(p => q.answer.includes(p));
      history[q.id] = it.ok; store.set("ai500.history", history);
      if (S.mode === "exam") return next();
      show();
    };
  }
  const nx = document.getElementById("next"); if (nx) nx.onclick = next;
  const pv = document.getElementById("prev"); if (pv) pv.onclick = () => { S.i--; show(); };
  document.getElementById("quit").onclick = () => S.items.some(x => x.picked) ? result() : home();
  window.scrollTo(0, 0);
}

function feedback(it) {
  const q = it.q;
  return `<p class="verdict ${it.ok ? "ok" : "bad"}">${it.ok ? "Goed!" : "Fout."}</p>
    <div>${md(q.explanation)}</div>
    <p class="muted">Bron: <a href="${esc(q.ref)}" target="_blank" rel="noopener">${esc(q.ref.replace("https://", ""))}</a></p>`;
}

function next() { if (S.i + 1 < S.items.length) { S.i++; show(); } else result(); }

function result() {
  const ans = S.items.filter(x => x.picked), ok = ans.filter(x => x.ok).length;
  const pct = ans.length ? Math.round(100 * ok / ans.length) : 0;
  const per = Object.entries(DOMAINS).map(([k, d]) => {
    const xs = ans.filter(x => dom(x.q) === k); if (!xs.length) return "";
    const g = xs.filter(x => x.ok).length;
    return `<tr><td>${k}. ${esc(d.title)}</td><td>${g}/${xs.length}</td><td>${Math.round(100 * g / xs.length)}%</td></tr>`;
  }).join("");
  const wrong = ans.filter(x => !x.ok);
  $app.innerHTML = `
  <div class="card">
    <h2>Resultaat</h2>
    <div class="big">${pct}%</div>
    <p>${ok} van ${ans.length} goed. ${pct >= 70 ? "Op examenniveau (slagen = 700/1000, ongeveer 70%)." : "Nog onder examenniveau (slagen = 700/1000, ongeveer 70%)."}</p>
    <table><tr><th>Domein</th><th>Goed</th><th>%</th></tr>${per}</table>
    <div class="actions">
      ${wrong.length ? `<button id="review" type="button">Bekijk ${wrong.length} fouten</button>` : ""}
      <button class="ghost" id="home" type="button">Nieuwe sessie</button>
    </div>
  </div>`;
  document.getElementById("home").onclick = home;
  const rv = document.getElementById("review");
  if (rv) rv.onclick = () => { S = { mode: "practice", items: wrong, i: 0 }; show(); };
}

home();
</script>
</body>
</html>

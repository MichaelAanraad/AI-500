ready fully allocated.","When deleting through the REST API, the quota remains unavailable for 48 hours until the resource is purged.","A quota increase is not approved in time, so this does not meet the requirement to deploy today.","Correct: by freeing unused TPM, you can create a new deployment within the existing quota."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota"},{"id":"3.3.4-08","obj":"3.3.4","difficulty":"medium","type":"single","stem":"Alpine Ski House deployed a fine-tuned Azure OpenAI model that the marketing agent uses during a two-week campaign each quarter. Cost analysis shows a steady charge for the model every day, including weeks with no inference calls.\n\nWhat should you do to reduce this cost?","choices":["Delete the deployment after each campaign and redeploy it before the next one","Reduce the TPM assigned to the fine-tuned deployment between campaigns","Configure spillover from the fine-tuned deployment to a standard deployment","Add an llm-token-limit policy with a monthly token quota for the marketing agent"],"answer":[0],"explanation":"Fine-tuned models incur training, inference, and hosting costs per hour as long as they are deployed, even with low usage. Delete or scale deployments you do not need; that is the only measure here that stops the daily charge.","rationale":["Correct: a fine-tuned deployment costs hosting per hour, even without usage.","TPM affects the rate limit, not the fixed hosting costs per hour.","Spillover is for provisioned deployments and does not reduce hosting costs.","A token limit restricts inference costs, but the costs here are hosting without inference."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-09","obj":"3.3.4","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. emits token metrics from Azure API Management by using llm-emit-token-metric with three custom dimensions: API ID, Cost Center, and User ID. The company has 4,000 users. The monthly chargeback report sums the metric by Cost Center, but token totals from newer users are missing, and the gap grows each week. No errors are returned to callers.\n\nWhat should you do?","choices":["Increase the retention period of the Application Insights resource","Add Client IP as a fourth custom dimension","Set estimate-prompt-tokens to true in the llm-token-limit policy","Remove the User ID dimension so that the metric uses low-cardinality dimensions"],"answer":[3],"explanation":"API Management limits each dimension to 100 unique values and each metric namespace to 1,000 active time series; above that, new values are silently dropped. With 4,000 users, User ID is the cause; remove that dimension so the reporting per Cost Center is complete.","rationale":["Retention determines how long data is kept, not whether new dimension values are recorded.","Another high-cardinality dimension increases the number of time series and worsens the data loss.","This affects limit enforcement, not the collection of custom metrics.","Correct: with fewer unique values, dimensions and time series stay within the limits."],"ref":"https://learn.microsoft.com/azure/api-management/llm-emit-token-metric-policy"},{"id":"3.3.4-10","obj":"3.3.4","difficulty":"hard","type":"single","stem":"Coho Winery wants to reduce billing surprises before it moves a multi-agent solution to production. You need to estimate costs and verify the estimate against actual charges.\n\nWhich sequence of actions should you perform?","choices":["Group costs by Resource and then by Meter in Cost Management -> build an estimate in the Azure pricing calculator -> deploy a small test workload with representative traffic -> compare meter charges to the estimate and adjust the budget","Build an estimate in the Azure pricing calculator -> group costs by Resource and then by Meter in Cost Management -> deploy a small test workload with representative traffic -> compare meter charges to the estimate and adjust the budget","Build an estimate in the Azure pricing calculator -> deploy a small test workload with representative traffic -> compare meter charges to the estimate and adjust the budget -> group costs by Resource and then by Meter in Cost Management","Build an estimate in the Azure pricing calculator -> deploy a small test workload with representative traffic -> group costs by Resource and then by Meter in Cost Management -> compare meter charges to the estimate and adjust the budget"],"answer":[3],"explanation":"Microsoft describes the order: make an estimate in the pricing calculator, run a small test workload with representative traffic, group by Resource and then Meter in Cost Management, and finally compare with the assumptions and adjust the baseline budget.","rationale":["Grouping costs before there is test traffic yields no actual meter data.","You group costs before the test workload runs, so there is nothing to analyze yet.","You compare with the estimate before you have broken down the costs by Resource and Meter.","Correct: this is the recommended 'estimate and verify' workflow."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.4-11","obj":"3.3.4","difficulty":"hard","type":"multi","stem":"Wide World Importers enabled spillover from a Global Provisioned deployment to a Global Standard deployment. Finance reports pay-as-you-go token charges that are higher than expected and asks the team to identify how much of the Global Standard traffic arrived through spillover.\n\nWhich two actions should you perform? Each correct answer presents a complete solution.","choices":["Log the x-ms-spillover-from-deployment response header in the agent application and count the requests that contain it","Count the HTTP 429 responses of the provisioned deployment in the Azure OpenAI Requests metric","Group cost analysis by Meter for the Foundry resource","Split the Azure OpenAI Requests metric of the Global Standard deployment by the IsSpillover dimension","Chart the Provisioned-managed Utilization V2 metric of the provisioned deployment"],"answer":[0,3],"explanation":"Spillover requests are billed on the standard deployment at standard token rates. You identify them through the IsSpillover split on the metric of the standard deployment, or per request through the header x-ms-spillover-from-deployment. They do not appear as 429 on the provisioned deployment.","rationale":["Correct: the presence of this header marks a spillover request.","Spillover requests are not counted as 429 on the provisioned deployment.","Meters show token costs per model, but do not distinguish spillover from direct traffic.","Correct: with the IsSpillover split, you see which requests arrived through spillover on the standard deployment.","Utilization shows capacity utilization, not how many requests were forwarded."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/spillover-traffic-management"},{"id":"3.3.4-12","obj":"3.3.4","difficulty":"hard","type":"single","stem":"Graphic Design Institute scopes Cost analysis to its Foundry resource to track the cost of a tutoring agent. The agent uses Azure OpenAI models and a partner model from Azure Marketplace, and tracing sends telemetry to Application Insights. The monthly invoice is consistently higher than the Foundry resource view shows.\n\nWhat should you do to see the full cost of the solution?","choices":["Wait for cost ingestion and compare the same time window again","Scope Cost analysis to the resource group or subscription of the solution","Add a filter for the Azure OpenAI service in the Foundry resource view","Assign the Cost Management Reader role at the Foundry resource scope"],"answer":[1],"explanation":"Meters for partner and community models appear under the resource group instead of the Foundry resource, and costs for Azure Monitor Logs and alerts are not visible at resource scope. Therefore scope to the resource group or subscription to see the full costs.","rationale":["The difference is structural every month, so ingestion delay is not the cause.","Correct: partner model meters and Azure Monitor costs are not visible at Foundry resource scope.","Azure OpenAI is not in the list as a service, and filtering hides even more costs.","The problem is the scope of the analysis, not missing read permissions."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/manage-costs"},{"id":"3.3.5-01","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a planning agent whose runs include several model calls and tool calls. A developer needs to identify which model call in one specific run consumed the most tokens and how long each step took.\n\nWhat should the developer use?","choices":["The Processed Prompt Tokens metric of the model deployment in Azure Monitor","The trace of the run in the Foundry portal, stepping through each span","The token usage chart on the Agent Monitoring Dashboard of the agent","Cost analysis in Cost Management, grouped by Meter for the project"],"answer":[1],"explanation":"Foundry tracing captures inputs, outputs, tool calls, token consumption, and duration per run as nested spans. By stepping through the spans of a trace, you see which model call used the most tokens and where time was lost.","rationale":["This metric aggregates across requests and does not link tokens to a specific run.","Correct: a trace shows per span the input, output, token consumption, and duration, in order of execution.","This chart aggregates tokens over a time period and does not show individual steps of a run.","Cost analysis shows billed costs per meter, not per step of a run."],"ref":"https://learn.microsoft.com/azure/foundry/observability/concepts/trace-agent-concept"},{"id":"3.3.5-02","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Litware, Inc. instruments a Python agent application with the Microsoft Foundry SDK. Tracing is already enabled and spans appear in Application Insights. In the development environment, developers need the built-in traces to include message contents and tool call arguments.\n\nWhich environment variable should you set to true?","choices":["AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA","OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT","AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING","AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE"],"answer":[1],"explanation":"Content recording is off by default and is enabled with OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true. Microsoft recommends this only in development, because prompts and tool arguments can contain sensitive data.","rationale":["This variable adds images and file data and works only when content recording is already on.","Correct: this variable enables content recording for messages and tool call arguments.","This variable enables GenAI tracing itself; that already works.","This variable propagates the baggage header and does not capture message content."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-03","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Tailspin Toys wants Foundry to notify the team when the token usage or latency of an agent shows an anomaly, or when evaluation scores drop.\n\nWhich setting on the Monitor tab of the agent should you configure?","choices":["Red team scans","Recurring evaluations","Traces","Alerts"],"answer":[3],"explanation":"In the Monitor settings of an agent, you configure Alerts (preview) for latency, token usage, evaluation scores, or red team findings. That is the alerting component alongside recurring evaluations and red team scans.","rationale":["Red team scans run adversarial tests, but do not warn about latency or token anomalies.","Recurring evaluations produce scores, but do not send notifications themselves.","Traces show individual runs for debugging and contain no alert configuration.","Correct: Alerts detects anomalies in latency, token usage, evaluation scores, and red team findings."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"3.3.5-04","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Relecloud connected an Application Insights resource to its Foundry project. A developer named User1 has the Contributor role on the project but receives authorization errors when opening traces in the Foundry portal. The trace tables are not protected.\n\nWhich role should you assign to User1 on the connected Application Insights resource?","choices":["Log Analytics Reader","Privileged Monitoring Data Reader","Cost Management Reader","Cognitive Services Usages Reader"],"answer":[0],"explanation":"In addition to a role on the project, viewing traces requires Log Analytics Reader on the linked Application Insights resource. Privileged Monitoring Data Reader is needed additionally only if the tables are protected.","rationale":["Correct: this role is needed to view traces and log-based monitoring.","This role is needed additionally only for protected tables, which does not apply here.","This role grants access to cost data, not to telemetry.","This role shows quota usage, not trace data."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-05","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Woodgrove Bank calls a Foundry agent from a Python application that is instrumented for tracing. Traces reach Application Insights, but they are not correlated with the agent in the Foundry portal.\n\n```python\nresponse = openai.responses.create(\n    conversation=conversation.id,\n    extra_body={\"agent_reference\": {<value>, \"type\": \"agent_reference\"}},\n    input=\"What is my current balance?\",\n)\n```\n\nWhich value should you use for <value>?","choices":["\"name\": agent.name, \"version\": agent.version","\"name\": agent.name, \"id\": agent.id","\"agent_name\": agent.name","\"id\": conversation.id"],"answer":[1],"explanation":"To link traces to a specific agent in the Foundry portal, you include an agent_reference with both name and id in responses.create(). Traces usually appear within 2 to 5 minutes.","rationale":["The version identifies the agent version, but correlation requires the id.","Correct: Microsoft Learn requires both name and id in agent_reference to link traces to the agent.","agent_name is not the key that agent_reference expects, and the id is missing.","The conversation ID identifies the conversation, not the agent."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-06","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Contoso, Ltd. needs every span that a Python agent application emits, including spans created by the Foundry SDK instrumentation, to carry the current session identifier as a session.id attribute. Developers must not modify each traced function.\n\nWhat should you implement?","choices":["The OTEL_SERVICE_NAME environment variable set to the session identifier","The @trace_function decorator on each function","A custom SpanProcessor that sets the attribute in on_start and is registered with the global tracer provider","Baggage propagation by setting AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE to true"],"answer":[2],"explanation":"Microsoft Learn shows a custom SpanProcessor that sets session.id in on_start and is registered with the global tracer provider. This gives every span, including the SDK instrumentation, the correlation ID without modifying functions.","rationale":["The service name identifies the application and is process-wide, not per session.","The decorator requires modifying every function and does not add the attribute to SDK spans.","Correct: a SpanProcessor adds the attribute to every span that starts, including SDK spans.","Baggage is sent as a header to Azure OpenAI, but does not set an attribute on every span."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-07","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Northwind Traders has two agent applications, App1 and App2, that send OpenTelemetry traces to the same Application Insights resource. The team needs to filter the traces of each application in KQL queries without creating another Application Insights resource.\n\nWhat should you do?","choices":["Set a unique OTEL_SERVICE_NAME for each application and filter on cloud_RoleName","Create a separate Foundry project for each application that shares the resource","Add a session.id attribute that identifies the application to every span","Set the gen_ai.operation.name attribute to the application name on each span"],"answer":[0],"explanation":"When multiple applications log to the same Application Insights resource, you give each application its own OpenTelemetry service name, for example through OTEL_SERVICE_NAME. Application Insights maps that value to cloud_RoleName, which you filter on in KQL.","rationale":["Correct: the service name distinguishes applications and is queried in KQL through cloud_RoleName.","A separate project is not needed and does not solve filtering within a shared resource.","session.id distinguishes sessions, not applications.","gen_ai.operation.name should describe the operation, such as chat, according to the semantic conventions."],"ref":"https://learn.microsoft.com/azure/azure-monitor/app/opentelemetry-configuration"},{"id":"3.3.5-08","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Proseware, Inc. adds client-side tracing to a Python agent. The code calls AIProjectInstrumentor().instrument() at startup and later sets AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING to true before it creates the first agent. No GenAI spans are produced, and a warning is logged at startup.\n\nWhat should you do?","choices":["Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true at startup","Set AZURE_TRACING_GEN_AI_INSTRUMENT_RESPONSES_API to false at startup","Move the AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING assignment before instrument()","Assign the Log Analytics Reader role on Application Insights to the developer"],"answer":[2],"explanation":"GenAI tracing is an experimental opt-in. If AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING is not set to true at the time of AIProjectInstrumentor().instrument(), instrumentation is not enabled and a warning appears.","rationale":["This adds message content to existing spans, but does not enable tracing.","This actually disables auto-instrumentation, resulting in even fewer spans.","Correct: the variable must be set before instrument() is called.","Permissions affect viewing, not whether the application produces spans."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-09","obj":"3.3.5","difficulty":"hard","type":"single","stem":"Humongous Insurance traces a claims agent in production. OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT is set to false. A helper function named lookup_policy is decorated with @trace_function and accepts a policy_number parameter. A compliance review finds policy numbers in the span attributes of production traces. The team must keep a span for lookup_policy.\n\nWhat should you do?","choices":["Set AZURE_TRACING_GEN_AI_ENABLE_TRACE_CONTEXT_PROPAGATION to false","Set AZURE_TRACING_GEN_AI_INSTRUMENT_RESPONSES_API to false","Replace the decorator with a manual span that omits policy_number","Set AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA to false"],"answer":[2],"explanation":"The buried constraint: content recording is already off. However, @trace_function always captures parameters and return values, regardless of OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT. Therefore use a manual span (tracer.start_as_current_span) without the sensitive attribute.","rationale":["This stops the propagation of trace IDs, but parameters remain in the span.","This disables auto-instrumentation of the Responses API, not the tracing of decorated functions.","Correct: a manual span decides itself which attributes are captured.","This setting concerns binary data and has no effect on function parameters."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"3.3.5-10","obj":"3.3.5","difficulty":"hard","type":"single","stem":"Trey Research stores clinical prompts in Foundry traces. Members of an auditor group must be able to read prompts, responses, and tool call content, while other engineers keep access to the non-sensitive trace data.\n\nWhich sequence of actions should you perform?","choices":["Assign Privileged Monitoring Data Reader to the auditor group -> verify access with an account that has Log Analytics Reader -> register the protectGenAISensitiveData feature flag -> set the AppGenAIContent table to Protected","Register the protectGenAISensitiveData feature flag -> assign Privileged Monitoring Data Reader to the auditor group -> verify access with an account that has Log Analytics Reader -> set the AppGenAIContent table to Protected","Verify access with an account that has Log Analytics Reader -> register the protectGenAISensitiveData feature flag -> set the AppGenAIContent table to Protected -> assign Privileged Monitoring Data Reader to the auditor group","Register the protectGenAISensitiveData feature flag -> set the AppGenAIContent table to Protected -> assign Privileged Monitoring Data Reader to the auditor group -> verify access with an account that has Log Analytics Reader"],"answer":[3],"explanation":"Foundry routes sensitive content to the table AppGenAIContent after registration of protectGenAISensitiveData. Set that table to Protected (deny-by-default), assign Privileged Monitoring Data Reader to authorized identities, and verify that a user with only Log Analytics Reader does not see the content.","rationale":["Verification happens before content is routed to AppGenAIContent and before the table is protected.","You verify before the table is protected, so an ordinary reader still sees the content.","Verification as the first step tests a configuration that does not exist yet.","Correct: first route to the dedicated table, then protect it, then grant access and verify."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/traces-sensitive-content"},{"id":"3.3.5-11","obj":"3.3.5","difficulty":"hard","type":"multi","stem":"Wingtip Toys deploys a hosted agent in Foundry Agent Service. Execution telemetry must flow to the Application Insights resource of the project and, at the same time, to the company's Datadog OTLP endpoint. The agent code must not contain telemetry setup code.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Set APPLICATIONINSIGHTS_CONNECTION_STRING in agent.yaml","Install the Azure Monitor OpenTelemetry distro and call configure_azure_monitor in the agent code","Enable monitoring for the Foundry project so that Foundry injects the Application Insights connection string","Set the OTEL_EXPORTER_OTLP_ENDPOINT environment variable on the agent to the Datadog endpoint","Register the hosted agent as a custom agent in Foundry Control Plane"],"answer":[2,3],"explanation":"Hosted agents bundle the OpenTelemetry distro. The runtime exports to Application Insights when Foundry injects the connection string (project monitoring on) and additionally through OTLP when OTEL_EXPORTER_OTLP_ENDPOINT is set; both exporters work at the same time.","rationale":["This setting is platform-reserved and cannot be set or overridden in agent.yaml.","Hosted agent libraries already include the distro, and the requirement is no telemetry code in the agent.","Correct: with project monitoring, Foundry injects APPLICATIONINSIGHTS_CONNECTION_STRING into the container.","Correct: the runtime then also exports through OTLP to that endpoint.","Registration as a custom agent is intended for agents outside Foundry, not for hosted agents."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/configure-hosted-agent-telemetry"},{"id":"3.3.5-12","obj":"3.3.5","difficulty":"hard","type":"single","stem":"Margie's Travel enables Foundry SDK tracing in a Python application. Client-side spans and server-side spans from Azure OpenAI appear as separate traces. Trace context propagation is at its default value. During startup, the application obtains an OpenAI client by calling get_openai_client() and then calls AIProjectInstrumentor().instrument().\n\nWhat should you do to correlate the spans?","choices":["Obtain the OpenAI client by calling get_openai_client() after the instrumentation call","Call instrument() with enable_trace_context_propagation set to False","Set AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE to true","Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true"],"answer":[0],"explanation":"Trace context propagation (on by default) injects traceparent and tracestate into requests from OpenAI clients obtained through get_openai_client(). Changes apply only to clients obtained afterward, so the client must be retrieved after instrument().","rationale":["Correct: trace context propagation applies to clients obtained after the instrumentation.","This disables the propagation that enables correlation.","Baggage adds extra key-value data, but the traceparent header is still missing.","Content recording adds message content, but does not correlate spans."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"4.1.1-01","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. publishes a customer-support agent in a Microsoft Foundry project. A service principal named App1 must call the agent endpoint by using the Responses API. App1 must not create, modify, or delete agents.\n\nYou need to grant App1 access by following the principle of least privilege.\n\nWhich role should you assign to App1?","choices":["Foundry Agent Consumer","Foundry User","Foundry Project Manager","Foundry Owner"],"answer":[0],"explanation":"Foundry Agent Consumer is the least-privilege role for principals that only need to communicate with agent endpoints. App1 does not need to build or manage anything, so a role with data actions for development is too broad.","rationale":["Correct: this role only grants access to interact with agent endpoints.","Foundry User also grants data actions to build and test agents; that is more than App1 needs.","Foundry Project Manager can manage projects, publish agents, and assign roles; far too broad.","Foundry Owner is a highly privileged role with full management; it conflicts with least privilege."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/rbac-foundry"},{"id":"4.1.1-02","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a Microsoft Foundry resource that contains a project named Project1. Developers must build and test agents in Project1 by using pre-deployed models and existing connections. Developers must not create projects or deploy models.\n\nWhich role should you assign to the developers at the Project1 scope?","choices":["Foundry User","Foundry Account Owner","Azure AI Developer","Cognitive Services Contributor"],"answer":[0],"explanation":"Foundry User is the least-privilege role for developers who build and test agents: reader access plus data actions in the project. Creating accounts or managing models falls outside this role.","rationale":["Correct: data actions for building and testing without managing projects or models.","Foundry Account Owner can manage projects and accounts and deploy models, but has no data actions to build.","Azure AI Developer is intended for Azure Machine Learning workspaces and Foundry hubs, not for Foundry projects.","Roles that start with Cognitive Services are not intended for Foundry scenarios and also grant management rights."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/rbac-foundry"},{"id":"4.1.1-03","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Tailspin Toys builds an agent named Agent1 in a Microsoft Foundry project. Agent1 calls an MCP server that reads and writes blobs in a storage account named storage1. The MCP connection uses Microsoft Entra agent identity authentication.\n\nYou need to grant the required access to storage1.\n\nWhich principal should you assign the Storage Blob Data Contributor role?","choices":["the agent identity that Agent1 uses at runtime","the project managed identity","the agent identity blueprint","the user principal of the developer who created Agent1"],"answer":[0],"explanation":"With agent identity authentication, the agent identity (a service principal, indicated by agentIdentityId) is the principal that needs RBAC roles on the target resource. The project managed identity only authenticates the blueprint with Microsoft Entra ID and does not access storage1 itself.","rationale":["Correct: storage1 checks the agent identity, which Agent1 uses to make the tool call, for RBAC roles.","The project managed identity only authenticates the blueprint with Entra ID and does not access the downstream resource itself.","The blueprint is a management object (template) for agent identities and receives no RBAC roles on downstream resources.","The tool call does not run under the identity of the developer; that role has no effect on the agent."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.1-04","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank prototypes agents in Foundry Agent Service. The security team requires that only callers from the corporate virtual network can reach the Foundry endpoint. Agent egress to public endpoints remains acceptable during the prototype phase.\n\nWhich networking option should you configure?","choices":["public egress with a private endpoint","public egress with public inbound access","a bring-your-own virtual network","a managed virtual network"],"answer":[0],"explanation":"With public egress and a private endpoint, you secure only the inbound path: callers reach the Foundry endpoint privately, while agent egress remains public. This matches the requirement exactly without building full isolation.","rationale":["Correct: restricts who can call the endpoint while public egress remains allowed.","Public inbound access allows callers from outside the virtual network; that does not meet the requirement.","BYO virtual network provides full isolation without public egress; more than this prototype needs.","A managed virtual network also isolates egress; that is not required and adds overhead."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/networking-options"},{"id":"4.1.1-05","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Contoso Pharmaceuticals plans a new Foundry Agent Service deployment for regulated workloads. The requirements are:\n\n- Agents must have no public egress.\n- The network team must control IP ranges, peering, and routing.\n- Conversation history, files, and vector stores must be stored in Azure resources that Contoso Pharmaceuticals owns.\n\nWhich networking option should you deploy?","choices":["a BYO virtual network with bring-your-own data resources","a BYO virtual network with platform-managed data resources","a managed virtual network","public egress with a private endpoint"],"answer":[0],"explanation":"Full isolation in which the network team manages IP ranges and routing itself requires a BYO virtual network. Because the agent data must reside in your own Storage, Azure AI Search, and Azure Cosmos DB, you choose the variant with bring-your-own data resources (network-secured standard).","rationale":["Correct: full isolation, own network management, and agent data in own resources.","Platform-managed data resources are multitenant and Microsoft-managed; the data then does not reside in your own resources.","A managed virtual network is intended for when you do not want or cannot manage IP ranges; here the network team specifically wants control.","With public egress, outbound traffic remains public; that violates the requirement of no public egress."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/networking-options"},{"id":"4.1.1-06","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Relecloud has a legacy agent named Agent1 in a Microsoft Foundry project. Agent1 reads blobs from storage1 because the shared project agent identity has the Storage Blob Data Reader role on storage1. To adopt the new agent object model, you create a new agent named Agent2 that uses the same definition as Agent1. Every tool call from Agent2 to storage1 fails with HTTP 403.\n\nWhat should you do?","choices":["Assign the Storage Blob Data Reader role on storage1 to the unique agent identity of Agent2.","Assign the Storage Blob Data Reader role on storage1 to the project managed identity.","Assign the Foundry User role on the Foundry resource to the shared project agent identity.","Change the MCP connection to use key-based authentication with a storage account key."],"answer":[0],"explanation":"A new agent in the new agent object model receives its own unique agent identity at creation, which differs from the shared project identity. Role assignments do not carry over, so you must recreate the RBAC assignment on storage1 for the agent identity of Agent2.","rationale":["Correct: Agent2 uses its own unique agent identity, which does not yet have the role on storage1.","The project managed identity authenticates the blueprint and has no effect on the access of the agent identity to storage1.","Foundry User on the Foundry resource grants no data-plane rights on storage1, and the shared identity is no longer used.","A storage account key introduces a shared secret and does not solve the identity problem in a least-privilege way."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/migrate-agent-applications"},{"id":"4.1.1-07","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders hosts five agents in a single Microsoft Foundry project. A partner service principal named SP1 must call the endpoint of an agent named OrderAgent. SP1 must not be able to call the endpoints of the other four agents.\n\nWhich role assignment should you create?","choices":["Foundry Agent Consumer at the OrderAgent agent scope","Foundry Agent Consumer at the project scope","Foundry Agent Consumer at the Foundry resource scope","Foundry User at the project scope"],"answer":[0],"explanation":"A role assignment at agent scope is evaluated for access to the endpoint of that one agent. Project scope grants access to all agent endpoints in the project. Note: the Azure portal supports this only at account scope, so use Azure CLI.","rationale":["Correct: agent scope grants endpoint access to OrderAgent only.","Project scope grants access to every agent endpoint in the project, including the other four.","Resource scope is even broader and covers all projects and agents in the Foundry resource.","Foundry User at project scope grants development rights and access to all agents; too broad."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/rbac-foundry"},{"id":"4.1.1-08","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Adventure Works Cycles has 12 teams that create Foundry resources in one Azure subscription. Security requires that every current and future Foundry resource in the subscription accepts only Microsoft Entra ID authentication. Teams must not be able to create resources that accept API keys.\n\nWhat should you do?","choices":["Assign the Azure Policy definition that requires key access to be disabled for Azure AI Services resources at the subscription scope.","Set the disableLocalAuth property to true in a shared Bicep template, and ask each team to deploy by using the template.","Create a Conditional Access policy that blocks key-based sign-ins for the agent identities in the tenant.","Run Set-AzCognitiveServicesAccount with -DisableLocalAuth $true against each existing Foundry resource."],"answer":[0],"explanation":"The Azure Policy 'Azure AI Services resources should have key access disabled (disable local authentication)' at subscription level enforces Entra ID for existing and new resources. A template or script enforces nothing for resources that teams create later on their own.","rationale":["Correct: Azure Policy enforces the requirement centrally for current and future resources.","A shared template is voluntary; teams can still create resources with key access.","Conditional Access controls access by agent identities, not whether a resource accepts API keys.","The script works per existing resource and does not prevent new resources from being created with keys."],"ref":"https://learn.microsoft.com/azure/ai-services/disable-local-auth"},{"id":"4.1.1-09","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company has a Foundry account named Account1 that was created six months ago with public networking. Account1 contains two projects with hosted agents and prompt agents. A new compliance rule requires that all agent compute is injected into a delegated subnet in a virtual network that Lamna Healthcare Company manages.\n\nYou create a subnet named Subnet1 that is delegated to Microsoft.App/environments and sized /27.\n\nWhat should you do next?","choices":["Create a new Foundry account that uses Subnet1 for virtual network injection, and then migrate the projects and agents.","Update the networking settings of Account1 to inject agent compute into Subnet1, and then restart the hosted agents.","Add a private endpoint for Account1 in the virtual network, and then disable public network access on Account1.","Configure a managed virtual network for each existing project in Account1, and then peer it with the virtual network."],"answer":[0],"explanation":"Network injection is part of the create flow of the Foundry account and cannot be added to an existing account. After the first hosted agent, the configuration is fixed; you must therefore create a new account with Subnet1 and move the workloads.","rationale":["Correct: VNet injection must be configured when the account is created.","An existing account cannot receive network injection afterward.","A private endpoint only secures inbound traffic; agent compute is not injected into Subnet1.","Network isolation applies at account level, and the compliance requirement calls for a subnet managed by Lamna, not a Microsoft-managed network."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/networking-options"},{"id":"4.1.1-10","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"Proseware, Inc. runs a multi-agent solution in one Microsoft Foundry project. An orchestrator agent named Agent1 must read a Cosmos DB container. A billing agent named Agent2 must write to a storage account. Both agents are legacy agents that use the shared project agent identity, which has both permissions. Auditors require that each agent has only its own permissions and an independent audit trail.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Re-create Agent1 and Agent2 as new agents with the same definitions so that each agent receives a unique agent identity.","Assign each required role to the agentIdentityId of the corresponding new agent, scoped to the target resource.","Assign the required roles to the shared project agent identity at the subscription scope.","Assign the Owner role on the resource group to the project managed identity.","Store a storage account key in a project connection that Agent2 uses."],"answer":[0,1],"explanation":"Legacy agents share the project identity, with a larger blast radius. An in-place upgrade does not exist yet, so you create new agents with the same definition; each receives a unique agent identity and blueprint. Then you create narrow role assignments per identity at resource scope, so that each agent has only its own rights and its own audit trail.","rationale":["Correct: new agents each receive a unique agent identity at creation.","Correct: roles per agentIdentityId at resource scope achieve least privilege per agent; roles do not carry over automatically.","Subscription scope on the shared identity increases the rights and does not separate the agents.","Owner for the managed identity is excessive, and the managed identity is not the principal for tool calls.","A shared key is accessible to everyone with project access and provides no per-agent audit trail."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/migrate-agent-applications"},{"id":"4.1.1-11","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Alpine Ski House configures a project connection for an MCP server that Agent1 uses. The MCP server reads files from an Azure Storage account. The connection uses the AgenticIdentityToken authentication type with the audience set to https://mcp1.alpineskihouse.com. The agent identity was assigned the Storage Blob Data Reader role on the storage account two days ago. Every tool call fails with HTTP 401.\n\nWhat should you do?","choices":["Change the audience of the connection to https://storage.azure.com.","Assign the Storage Blob Data Reader role to the project managed identity.","Change the connection to OAuth identity passthrough.","Wait up to 10 minutes for the role assignment to propagate, and then retry."],"answer":[0],"explanation":"The audience must match the resource identifier of the downstream service, not the URL of the MCP server. A wrong audience causes authentication errors, even if the RBAC roles are correct. For Azure Storage, the audience is https://storage.azure.com.","rationale":["Correct: the token must be issued for the Azure Storage audience.","The agent identity, not the project managed identity, is the principal that needs the role; the role is already assigned correctly.","OAuth identity passthrough is for per-user context; that is not requested here and does not fix the audience error.","The role was assigned two days ago; propagation is not the cause."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.2-01","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Tailspin Toys registers a client app named App1 in Microsoft Entra ID. App1 hosts an agent that calls a custom web API named API1. The agent must call API1 on behalf of the signed-in user and must be able to access only the data that the signed-in user can access.\n\nWhich type of permission should you configure for App1 on API1?","choices":["delegated permissions","application permissions","an Azure RBAC role assignment for App1 at the API1 scope","an API key that API1 issues to App1"],"answer":[0],"explanation":"Delegated permissions (scopes) let an app act on behalf of a signed-in user; the app can never access more than the user is allowed to. That is exactly the user impersonation requirement: user signed in and access limited to the rights of that user.","rationale":["Correct: delegated permissions require a signed-in user and limit access to what that user is allowed.","Incorrect: application permissions (app roles) apply without a user and grant access to all data covered by that permission, not only that of the user.","Incorrect: an RBAC role assignment to App1 gives App1 its own rights, independent of the signed-in user.","Incorrect: an API key only identifies the app and carries no user context."],"ref":"https://learn.microsoft.com/entra/identity-platform/permissions-consent-overview"},{"id":"4.1.2-02","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Wide World Importers connects an agent to a third-party weather MCP server. The server supports only API keys. Every user of the agent can see the same weather data.\n\nYou need to provide the API key to the MCP server without passing it at runtime.\n\nWhat should you configure?","choices":["key-based authentication that stores the key in a project connection","OAuth identity passthrough by using custom OAuth","unauthenticated access with the key in the agent instructions","Microsoft Entra agent identity authentication"],"answer":[0],"explanation":"For a server that supports only API keys and where no user context is needed, you use key-based authentication. Agent Service retrieves the credential from the project connection and sends it along to the MCP server.","rationale":["Correct: shared key stored securely in a project connection.","OAuth identity passthrough requires OAuth support and per-user consent; the server supports only keys.","A key in instructions is insecure, and unauthenticated access sends no credential.","The server does not accept Microsoft Entra tokens, so agent identity does not work."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"4.1.2-03","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Consolidated Messenger has a middle-tier orchestrator API named API1. A client app calls API1 with an access token for the signed-in user. API1 must call a downstream API named API2 with the delegated identity and permissions of the same user. API1 cannot interact with the user.\n\nWhich OAuth 2.0 flow should API1 use to obtain a token for API2?","choices":["on-behalf-of","client credentials","authorization code","device code"],"answer":[0],"explanation":"The on-behalf-of (OBO) flow is intended for a web API that calls another web API using the identity of the user. API1 exchanges token A for token B with only the delegated scopes of the user, without user interaction.","rationale":["Correct: OBO propagates the delegated user identity through the request chain.","Client credentials uses the own identity of the app, not that of the user.","The authorization code flow requires interactive sign-in; API1 has no user interaction.","The device code flow is for input-constrained devices and also requires user interaction."],"ref":"https://learn.microsoft.com/entra/identity-platform/v2-oauth2-on-behalf-of-flow"},{"id":"4.1.2-04","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Fourth Coffee runs a nightly reconciliation agent in Foundry Agent Service. No user is signed in when the agent runs. The agent must access Azure Cosmos DB by using permissions that are assigned directly to the agent.\n\nWhich authentication approach should the agent use?","choices":["the unattended application-only flow with the agent identity","the attended on-behalf-of flow with the agent identity","OAuth identity passthrough","key-based authentication with a personal access token"],"answer":[0],"explanation":"In unattended scenarios, the agent acts under its own authority through the OAuth 2.0 client credentials flow. Access is then fully determined by the role assignments of the agent identity; no user is involved.","rationale":["Correct: application-only flow with the own RBAC rights of the agent identity.","OBO requires a user token; at night there is no signed-in user.","Passthrough asks a user to sign in and give consent.","A PAT is a shared secret and not identity-based access to Cosmos DB."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.2-05","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Humongous Insurance builds a conversational agent workflow in Azure Logic Apps (Standard). An agent tool reads the mailbox of the person who is chatting. Compliance requires that resource access and audit logs are linked to that person and that the tool respects the person's own licenses and data access rights.\n\nWhich connection configuration should you use for the tool?","choices":["Use a per-user connection that has on-behalf-of authorization.","Use a shared connection that authenticates by using the logic app managed identity.","Use a shared connection that is created by the workflow author.","Use a connection that authenticates by using a service principal with application permissions."],"answer":[0],"explanation":"With OBO authorization and per-user connections, the tool uses the identity and rights of the signed-in chat user, not of the creator of the connection. As a result, access and audit logs are tied to that person.","rationale":["Correct: delegated permissions through OBO with per-user connections.","A managed identity acts as the app itself; audit logs are not tied to the user.","A shared connection runs with the credentials of the creator, not of the chat user.","Application permissions ignore the licenses and rights of the individual user."],"ref":"https://learn.microsoft.com/azure/logic-apps/set-up-on-behalf-of-user-flow"},{"id":"4.1.2-06","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Relecloud runs an agent in Foundry Agent Service that reads documents from a line-of-business API that is protected by Microsoft Entra ID. Users sign in to a web app, and the web app passes the user token to Agent Service when it calls the agent. The following requirements apply:\n\n- The agent must access only the documents that the signed-in user is authorized to access.\n- Sign-in logs must show the agent identity as an actor, separate from the user.\n- Users must not receive a separate consent link inside the agent conversation.\n\nWhich authentication approach should the agent use?","choices":["the attended on-behalf-of flow with the agent identity","the unattended application-only flow with the agent identity","OAuth identity passthrough with a custom OAuth app","Microsoft Entra authentication with the project managed identity"],"answer":[0],"explanation":"In the attended (OBO) flow, the app passes the user token to Agent Service, which exchanges it for a token that contains both the agent identity and the delegated rights of the user. The agent can therefore only reach what the user is allowed to, while the agent identity remains visible as a separate actor.","rationale":["Correct: OBO with the agent identity combines user rights with the agent as an independent actor, without an extra consent link.","Incorrect: the application-only flow uses only the rights of the agent identity and ignores the rights of the user.","Incorrect: OAuth identity passthrough shows a consent link in the conversation on first use and uses the token of the user, not the agent identity.","Incorrect: the project managed identity is a shared identity without user context."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.2-07","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Margie's Travel uses Azure API Management to front a SaaS API that agents call through MCP tools. The SaaS API returns user-specific itineraries and requires an OAuth 2.0 token for each Microsoft Entra user. Each user must sign in and consent only once.\n\nWhat should you configure in API Management?","choices":["a credential manager connection that is enabled for user-delegated access and the get-authorization-context policy","a credential manager connection that uses the access policy of the API Management managed identity","the authentication-managed-identity policy for the SaaS backend","a subscription key that is passed in the Ocp-Apim-Subscription-Key header"],"answer":[0],"explanation":"In the attended (user-delegated) scenario of credential manager, each user signs in and gives consent once, after which API Management manages the connection. get-authorization-context retrieves the token and refreshes it when needed.","rationale":["Correct: user-delegated connections deliver per-user tokens with one-time consent.","A connection for the managed identity is unattended and gives all users the same data.","The managed identity of API Management does not represent an individual user.","A subscription key authenticates the client to API Management, not the user to the SaaS API."],"ref":"https://learn.microsoft.com/azure/api-management/credentials-overview"},{"id":"4.1.2-08","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Lucerne Publishing connects an agent to a custom MCP server that is protected by Microsoft Entra ID. Each user must authorize access with the user's own account. You plan to use OAuth identity passthrough with a custom OAuth app registration.\n\nYou need to configure the solution.\n\nWhich sequence of actions should you perform?","choices":["Register an app in Microsoft Entra ID -> create the MCP connection with OAuth identity passthrough by using the client ID and secret of the app -> add the redirect URL that Foundry returns to the app registration -> test the tool by using a user account that has not yet consented","Create the MCP connection with OAuth identity passthrough -> register an app in Microsoft Entra ID -> test the tool by using a user account that has not yet consented -> add the redirect URL that Foundry returns to the app registration","Register an app in Microsoft Entra ID -> add the redirect URL that Foundry returns to the app registration -> test the tool by using a user account that has not yet consented -> create the MCP connection with OAuth identity passthrough","Register an app in Microsoft Entra ID -> create the MCP connection with key-based authentication by using the client secret -> add the redirect URL to the app registration -> test the tool by using a user account that has not yet consented"],"answer":[0],"explanation":"For custom OAuth, you first need an app registration to fill in the client ID and secret in the connection. Only after creating the connection do you receive a redirect URL, which you add to the app registration. Then you validate with a test user who has not yet given consent.","rationale":["Correct: app registration, connection, add redirect URL, then validate.","The connection requires the client ID from an existing app registration, and testing before the redirect URL fails.","The redirect URL exists only after the connection is created.","Key-based authentication provides no per-user consent and does not preserve user context."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"4.1.2-09","obj":"4.1.2","difficulty":"hard","type":"single","stem":"Wingtip Toys configures an MCP project connection for Agent1 that uses agent identity authentication with the audience https://storage.azure.com. The MCP server reads blobs from a storage account. The security team asks you to document how Foundry Agent Service authenticates each tool call at runtime.\n\nWhich sequence should you document?","choices":["Agent Service authenticates the agent identity blueprint by using the project managed identity -> Microsoft Entra ID issues a token for the agent identity -> Agent Service exchanges that token for an access token for https://storage.azure.com -> Storage checks the RBAC roles of the agent identity","Agent Service requests an access token for https://storage.azure.com by using the project managed identity -> The MCP server exchanges the token for an agent identity token -> Microsoft Entra ID authenticates the blueprint -> Storage checks the RBAC roles of the project managed identity","Microsoft Entra ID issues a token for the agent identity -> Agent Service authenticates the agent identity blueprint by using the project managed identity -> Agent Service passes the agent identity token to the MCP server -> The MCP server requests an access token for https://storage.azure.com","Agent Service authenticates the agent identity blueprint by using a client secret that is stored in the project connection -> Microsoft Entra ID issues an access token for the MCP server URL -> The MCP server forwards the token to storage -> Storage checks the RBAC roles of the blueprint"],"answer":[0],"explanation":"The runtime token exchange proceeds in four steps: blueprint authentication (through the federated credential with the project managed identity), issuance of an agent identity token, a scoped token request for the audience of the downstream service, and the authenticated tool call in which the resource checks the RBAC roles of the agent identity. The managed identity only authenticates the blueprint and does not itself need access to the resource.","rationale":["Correct: this is the sequence blueprint authentication -> agent identity token -> scoped token for the audience -> RBAC check on the agent identity.","Incorrect: the project managed identity does not request a storage token, and it is the agent identity, not the managed identity, that needs RBAC roles on storage.","Incorrect: an agent identity token can only be issued after blueprint authentication, and Agent Service, not the MCP server, requests the scoped token.","Incorrect: Foundry uses a federated credential instead of a stored secret, and the audience must be the storage resource, not the URL of the MCP server."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"4.1.2-10","obj":"4.1.2","difficulty":"hard","type":"multi","stem":"VanArsdel, Ltd. has a calling agent named Agent1 in Project1. Agent1 uses an A2A tool with OAuth identity passthrough to invoke a remote Foundry agent named Agent2 in Project2. User1 completes the consent flow, but every A2A tool call that User1 triggers fails. Other users can use the tool successfully.\n\nYou need to resolve the issue by following the principle of least privilege.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Assign User1 the Foundry Agent Consumer role on Project1 or on Agent1.","Grant User1 access to the remote target project or agent that hosts Agent2.","Assign User1 the Foundry Owner role on Project1.","Set send_credentials_for_agent_card to true in the A2A tool definition.","Assign the Foundry Agent Consumer role to the project managed identity of Project1."],"answer":[0,1],"explanation":"With OAuth identity passthrough, users need the Foundry Agent Consumer role on the project or the agent that hosts the calling agent. If the remote endpoint is another Foundry agent, the user also needs access to that target project or agent.","rationale":["Correct: least-privilege role for the user on the calling agent.","Correct: the user also needs access to the remote Foundry agent.","Foundry Owner is highly privileged and violates least privilege.","This only fixes a failed agent card retrieval; other users succeed, so the agent card is not the problem.","With passthrough, the identity of the user is used, not the project managed identity."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"4.1.2-11","obj":"4.1.2","difficulty":"hard","type":"single","stem":"City Power & Light hosts an MCP server on Azure Functions that agents in a Microsoft Foundry project call. Agents currently authenticate by using a function key (x-functions-key) that is stored in a key-based project connection. Auditors report that anyone with access to the project can access the key. The requirements are:\n\n- Remove the need to manage and rotate secrets.\n- All users can share a single identity for the tool.\n- The Function App supports Microsoft Entra authentication.\n\nWhat should you do?","choices":["Enable Azure Functions authentication with Microsoft Entra ID and change the connection to Microsoft Entra project managed identity authentication.","Change the connection to OAuth identity passthrough by using a custom app registration.","Rotate the function key every 30 days by using an Azure Key Vault rotation function.","Change the connection to unauthenticated access, and restrict the Function App to the Foundry outbound IP addresses."],"answer":[0],"explanation":"Microsoft Entra authentication eliminates secrets and has built-in token rotation. For Azure Functions MCP servers, Learn recommends enabling Functions authentication and using the project managed identity in Foundry. A shared identity is sufficient according to the requirements.","rationale":["Correct: no secrets, shared identity, and supported by the Function App.","Passthrough is per user and requires consent; not needed and still contains a client secret.","Rotation reduces the risk, but the secret remains and stays visible to project members.","Unauthenticated access is not recommended for production and does not replace authentication of the caller."],"ref":"https://learn.microsoft.com/azure/foundry/mcp/build-your-own-mcp-server"},{"id":"4.1.3-01","obj":"4.1.3","difficulty":"easy","type":"single","stem":"A. Datum Corporation runs a hosted agent that reads an API key from an Azure Key Vault that uses the Azure RBAC permission model. The managed identity of the agent must read secret values. The identity must not create, update, or delete secrets.\n\nWhich role should you assign to the managed identity?","choices":["Key Vault Secrets User","Key Vault Secrets Officer","Key Vault Reader","Key Vault Crypto User"],"answer":[0],"explanation":"Key Vault Secrets User grants read rights on the contents of secrets. That is exactly what the agent needs, without management rights.","rationale":["Correct: reads secret contents and nothing more.","Secrets Officer can perform all actions on secrets, including creating and deleting.","Key Vault Reader reads only metadata and cannot read secret values.","Crypto User is for cryptographic operations with keys, not for secrets."],"ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.3-02","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. plans to encrypt a Microsoft Foundry resource by using customer-managed keys. The key vault is in the same region as the Foundry resource and has no firewall rules.\n\nWhich key vault setting should you enable before you configure the customer-managed key?","choices":["soft delete and purge protection","a private endpoint","the trusted Microsoft services firewall exception","the Premium pricing tier"],"answer":[0],"explanation":"For CMK with Foundry, Azure requires that soft delete and purge protection are enabled on the key store, to protect keys against accidental or malicious deletion.","rationale":["Correct: mandatory prerequisite for customer-managed keys.","A private endpoint is not a requirement for CMK.","This exception is only needed if the Key Vault firewall is active; it is not configured here.","Premium (HSM-backed keys) is not required for CMK."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/encryption-keys-portal"},{"id":"4.1.3-03","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Bellows College stores a TLS certificate in Azure Key Vault for an MCP endpoint. The certificate is issued by DigiCert through the Key Vault partnership. The certificate must renew without manual action at 80 percent of its lifetime.\n\nWhat should you configure?","choices":["a lifetime action that automatically renews the certificate at a percentage of its lifetime","a lifetime action that sends email notifications to the certificate contacts at a percentage of its lifetime","a key rotation policy on the certificate key","an Event Grid subscription for the SecretNearExpiry event that triggers a function"],"answer":[0],"explanation":"Key Vault automatically renews certificates from partner CAs such as DigiCert through the lifetime action 'Automatically renew at a given time'. By default, this is set at 80 percent of the lifetime.","rationale":["Correct: enables auto-rotation for certificates from a partner CA.","Emailing only warns contacts and renews nothing.","A key rotation policy applies to Key Vault keys, not to certificate renewal.","A custom function is unnecessary; the partner CA integration renews on its own."],"ref":"https://learn.microsoft.com/azure/key-vault/certificates/tutorial-rotate-certificates"},{"id":"4.1.3-04","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Graphic Design Institute creates a new Microsoft Foundry resource. Security requires that secrets for connections that do not use Microsoft Entra ID are stored in a key vault that Graphic Design Institute manages, instead of in a Microsoft-managed key vault.\n\nWhat should you do before you create any connections?","choices":["Create an Azure Key Vault connection on the Foundry resource.","Configure customer-managed keys on the Foundry resource.","Assign the Key Vault Secrets User role to each project managed identity.","Store the secrets as Key Vault references in the Foundry project settings."],"answer":[0],"explanation":"Without a Key Vault connection, Foundry stores connection data in a Microsoft-managed Key Vault outside your subscription. With your own Key Vault connection, you manage the secrets yourself; this must be done before other connections exist, because migration is not supported.","rationale":["Correct: links your own (BYO) Key Vault for connection secrets.","CMK encrypts data at rest but does not determine where connection secrets are stored.","A role assignment does not move the storage of connection secrets.","Key Vault references is an App Service and Container Apps feature, not a Foundry project setting."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/set-up-key-vault-connection"},{"id":"4.1.3-05","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Southridge Video uses a customer-managed key in Azure Key Vault to encrypt agent data. Compliance requires a new key version every 90 days. The solution must require no custom code, and the encrypting services must start to use the new version without configuration changes.\n\nWhat should you do?","choices":["Configure a key rotation policy on the key, and configure the services to use the versionless key URI.","Create an Event Grid subscription for the key near expiry event that triggers an Azure Functions app to create a new key version.","Import a new key every 90 days and update each service to use the versioned key URI.","Configure a certificate lifetime action that renews the key every 90 days."],"answer":[0],"explanation":"A key rotation policy automatically creates new key versions (minimum 7-day interval). Services that use the versionless key URI automatically pick up the latest version. This meets both requirements without custom code.","rationale":["Correct: native auto-rotation plus versionless URI.","Event Grid with a function is custom code; needed when auto-rotation is not possible, such as with imported HSM keys.","Importing manually and updating versioned URIs requires configuration changes every time.","Certificate lifetime actions apply to certificates, not to standalone CMK keys."],"ref":"https://learn.microsoft.com/azure/key-vault/keys/how-to-configure-key-rotation"},{"id":"4.1.3-06","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Nod Publishers has an agent tool that connects to a SQL Server instance by using a password stored as a secret in Azure Key Vault. SQL Server supports only one set of credentials for the login. The password must be rotated automatically before it expires.\n\nWhat should you implement?","choices":["an Event Grid SecretNearExpiry subscription that triggers a function to create a password, store a new secret version, and update SQL Server","a key rotation policy on the secret that generates a new version of the secret every 60 days","a certificate lifetime action that automatically renews the secret before it expires","an alternating primary and secondary credential pattern that stores each credential as a version of the same secret"],"answer":[0],"explanation":"Secret auto-rotation works through Event Grid: Key Vault publishes a near expiry event thirty days before expiration, after which a function creates a new password, stores a new secret version, and updates SQL Server. Rotation policies exist only for keys.","rationale":["Correct: the pattern for resources with one set of credentials.","Key rotation policies apply to cryptographic keys, not to secrets.","Lifetime actions apply to certificates.","The dual-credential pattern requires a resource with two sets of credentials; SQL Server has one here."],"ref":"https://learn.microsoft.com/azure/key-vault/secrets/tutorial-rotation"},{"id":"4.1.3-07","obj":"4.1.3","difficulty":"medium","type":"single","stem":"First Up Consultants deploys an agent to Azure Container Apps. The agent reads an MCP API key from Azure Key Vault through a Container Apps secret. When the key is rotated in Key Vault, the agent must pick up the new value without a new deployment.\n\nWhich configuration should you use for the Container Apps secret?","choices":["as a Key Vault reference that uses a versionless secret URI and a managed identity that has the Key Vault Secrets User role","as a Key Vault reference that uses a versioned secret URI and a managed identity that has the Key Vault Secrets User role","as a secret value that a CI/CD pipeline copies from Key Vault during each deployment","as a Key Vault reference that uses a versionless secret URI and a managed identity that has the Key Vault Reader role"],"answer":[0],"explanation":"With a versionless URI, Container Apps retrieves the latest version within 30 minutes and restarts active revisions. The managed identity needs Key Vault Secrets User to read the value.","rationale":["Correct: versionless URI plus read rights on the secret value.","A versioned URI pins a specific version; rotation is not picked up.","Copying during deployment requires a new deployment for every rotation.","Key Vault Reader reads only metadata and cannot read the secret value."],"ref":"https://learn.microsoft.com/azure/container-apps/manage-secrets"},{"id":"4.1.3-08","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Best For You Organics Company has an operations team that rotates connection secrets for agents. The team must create, update, and delete secrets in a key vault that uses the Azure RBAC permission model. The team must not be able to manage role assignments or work with keys and certificates.\n\nWhich role should you assign to the operations team?","choices":["Key Vault Secrets Officer","Key Vault Administrator","Key Vault Data Access Administrator","Key Vault Secrets User"],"answer":[0],"explanation":"Key Vault Secrets Officer can perform any action on secrets, except managing permissions. That covers creating, updating, and deleting without access to keys, certificates, or role assignments.","rationale":["Correct: full secret management without permission management.","Administrator also grants rights on keys and certificates; too broad.","Data Access Administrator manages role assignments, exactly what the team must not do.","Secrets User can only read secrets, not create or update them."],"ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.3-09","obj":"4.1.3","difficulty":"hard","type":"single","stem":"Wingtip Toys must encrypt a new Microsoft Foundry resource by using a customer-managed key. The key vault will use the Azure RBAC permission model. You use a user-assigned managed identity for the Foundry resource.\n\nWhich sequence of actions should you perform?","choices":["Create a key vault in the Foundry region with soft delete and purge protection -> create an RSA key -> assign the Key Vault Crypto User role on the key vault to the managed identity -> configure customer-managed key encryption on the Foundry resource by using the key and the managed identity","Configure customer-managed key encryption on the Foundry resource -> create a key vault in the Foundry region with soft delete and purge protection -> create an RSA key -> assign the Key Vault Crypto User role on the key vault to the managed identity","Create a key vault in the Foundry region with soft delete and purge protection -> create an RSA key -> assign the Key Vault Secrets User role on the key vault to the managed identity -> configure customer-managed key encryption on the Foundry resource by using the key and the managed identity","Create a key vault in a paired region without purge protection -> create an RSA key -> configure customer-managed key encryption on the Foundry resource -> assign the Key Vault Crypto User role on the key vault to the managed identity"],"answer":[0],"explanation":"The key store must be in the same region with soft delete and purge protection. With RBAC, the managed identity needs the Key Vault Crypto User role before Foundry can use the key; only then do you configure the encryption.","rationale":["Correct: prerequisites first, then key, then permissions, then configure encryption.","Configuring encryption before the key and permissions exist fails.","Secrets User does not grant wrap and unwrap operations on keys.","A different region and missing purge protection violate the requirements, and permissions come too late."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/encryption-keys-portal"},{"id":"4.1.3-10","obj":"4.1.3","difficulty":"hard","type":"multi","stem":"The Phone Company runs five agents. Each agent has its own managed identity and reads its own secrets. All secrets are currently stored in one shared key vault that uses the Azure RBAC permission model. Security requires that each identity can read only the values of its own secrets.\n\nWhich two solutions should you implement? Each correct answer presents a complete solution.","choices":["Move the secrets of each agent to a dedicated key vault, and assign the Key Vault Secrets User role to the agent identity at the scope of that key vault.","Assign the Key Vault Secrets User role to each identity at the scope of each individual secret that the agent uses.","Assign the Key Vault Reader role to each identity at the scope of the shared key vault.","Assign the Key Vault Secrets Officer role to each identity at the scope of each individual secret.","Create a vault access policy with the Get secret permission for each identity in the shared key vault."],"answer":[0,1],"explanation":"Microsoft recommends one key vault per application per environment, with roles at vault scope. Key Vault RBAC also supports role assignments on an individual secret. Both give each identity read rights on only its own secrets.","rationale":["Correct: one vault per agent with Secrets User at vault scope is the recommended isolation.","Correct: Secrets User at secret scope limits reading to its own secrets.","Reader reads only metadata, not the secret values that the agents need.","Secrets Officer also grants write and delete rights and violates least privilege.","The vault uses the RBAC model, and an access policy also applies to all secrets in the vault."],"ref":"https://learn.microsoft.com/azure/key-vault/general/rbac-guide"},{"id":"4.1.3-11","obj":"4.1.3","difficulty":"hard","type":"single","stem":"Coho Vineyard has an agent tool that calls a partner API. The tool runs the following Python code on every invocation:\n\n```python\ndef call_partner(query: str) -> str:\n    credential = DefaultAzureCredential()\n    client = SecretClient(vault_url=VAULT_URL, credential=credential)\n    api_key = client.get_secret(\"partner-api-key\").value\n    return invoke_partner_api(query, api_key)\n```\n\nDuring load tests with hundreds of concurrent agent runs, Key Vault returns HTTP 429 responses and tool calls fail. The partner key is rotated every 60 days.\n\nWhat should you do?","choices":["Retrieve the secret once at startup, cache the value in memory, and refresh the cached value when the secret is rotated.","Replace DefaultAzureCredential with ManagedIdentityCredential to reduce the authentication overhead of each call.","Change the code to request the secret by using a versioned secret identifier on every call.","Move the secret to a separate key vault for each agent run, and keep the per-call retrieval."],"answer":[0],"explanation":"Key Vault enforces service limits; every tool call that retrieves a secret causes throttling. Cache the secret in memory, use retry with exponential back-off, and refresh the cache on rotation.","rationale":["Correct: fewer API calls prevent throttling, and refreshing keeps rotation working.","A different credential class does not change the number of Key Vault calls, so the throttling remains.","A versioned identifier does not reduce the number of calls and breaks picking up rotation.","A vault per run is unmanageable and does not solve the pattern of repeated calls."],"ref":"https://learn.microsoft.com/azure/key-vault/secrets/secure-secrets"},{"id":"4.1.4-01","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. runs an automated scan by using the AI Red Teaming Agent in Microsoft Foundry against a support agent. Management asks for one key metric that shows the percentage of attacks that elicited undesirable responses.\n\nWhich metric should you report?","choices":["attack success rate","groundedness score","relevance score","coherence score"],"answer":[0],"explanation":"Attack Success Rate (ASR) is the core metric of the AI Red Teaming Agent: the percentage of successful attacks relative to the total number of attacks.","rationale":["Correct: ASR measures the percentage of attacks that produce unwanted output.","Groundedness measures whether answers are based on the source, not attack success.","Relevance measures how well an answer fits the question.","Coherence measures the readability and coherence of an answer."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/ai-red-teaming-agent"},{"id":"4.1.4-02","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Woodgrove Bank wants to shift left by automating adversarial probing of its generative AI agents before deployment. The security team wants to reuse the open-source framework that the AI Red Teaming Agent in Microsoft Foundry builds on.\n\nWhich framework should the team use?","choices":["PyRIT","Prompt flow","Semantic Kernel","AutoGen"],"answer":[0],"explanation":"The AI Red Teaming Agent uses the red teaming capabilities of PyRIT (Python Risk Identification Tool), together with the Risk and Safety Evaluations of Foundry.","rationale":["Correct: PyRIT provides the attack strategies of the AI Red Teaming Agent.","Prompt flow is a tool for building and evaluating LLM flows, not a red teaming framework.","Semantic Kernel is an SDK for building AI agents and apps.","AutoGen is a framework for multi-agent conversations, not for adversarial probing."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/ai-red-teaming-agent"},{"id":"4.1.4-03","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Relecloud is in the design stage of a new agent solution and has not written any application code yet. The team wants to scan three candidate base model deployments for safety risks to pick the safest model.\n\nWhich target should you pass to the scan method of the AI Red Teaming Agent?","choices":["a model configuration for each Azure OpenAI deployment","a simple callback that calls the application","a Foundry hosted agent","a complex callback that follows the OpenAI Chat Protocol"],"answer":[0],"explanation":"In the design phase, you choose the safest foundation model. Because there is no application yet, you pass the model configuration directly as the target to scan().","rationale":["Correct: scans a base model without application code.","A callback calls an application, and that does not exist yet.","No agent has been built yet, so there is no hosted agent to scan.","A complex callback also presupposes an application with conversation state."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/run-scan

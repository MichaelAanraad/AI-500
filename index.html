 of a claims agent and wants to manage it as a testable artifact across its lifecycle. You need to minimize regressions and the leakage of unsafe responses when the prompt changes.\n\nWhich sequence of actions should you perform?","choices":["Identify the risks -> Define the scenario -> Evaluate and iterate -> Create a test set with benign and adversarial prompts","Define the scenario -> Identify the risks -> Create a test set with benign and adversarial prompts -> Evaluate and iterate on the system message","Define the scenario -> Evaluate and iterate on the system message -> Identify the risks -> Create a test set with benign and adversarial prompts","Create a test set with benign and adversarial prompts -> Evaluate and iterate on the system message -> Define the scenario -> Identify the risks"],"answer":[1],"explanation":"The recommended approach: first define the scenario, identify the RAI risks, build a test set with benign and adversarial prompts, and then evaluate and iterate. This way you measure regressions and leakage with every change.","rationale":["Identifying risks without a defined scenario lacks context, and evaluating before there is a test set is not possible.","Correct: scenario, risks, test set, then evaluate and iterate.","Evaluating before the risks and the test set exist provides no measurable basis.","Building a test set before the scenario and risks are known leads to a non-representative set."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/concepts/system-message"},{"id":"2.1.2-01","obj":"2.1.2","difficulty":"easy","type":"single","stem":"Lucerne Publishing builds a content workflow by using Microsoft Agent Framework. A writer agent and a reviewer agent take turns improving an article for several rounds. Each agent must see the full conversation history, including every earlier draft and review comment, before it responds.\n\nWhich orchestration should you use?","choices":["Concurrent orchestration","Group chat orchestration","Agent-as-tools with the writer as the primary agent","Sequential orchestration with chain_only_agent_responses enabled"],"answer":[1],"explanation":"In a group chat, every participant sees the full conversation history; the orchestrator broadcasts every response to all agents for iterative refinement. This fits writer-reviewer rounds.","rationale":["Concurrent lets agents work independently without seeing each other's output.","Correct: group chat synchronizes the full history to all participants.","With agent-as-tools, the primary agent manages the context and the tool agent may receive only relevant parts.","chain_only_agent_responses lets agents see only the previous response, not the full history."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/group-chat"},{"id":"2.1.2-02","obj":"2.1.2","difficulty":"easy","type":"single","stem":"Margie's Travel builds a sequential translation pipeline in Microsoft Agent Framework for Python: a writer agent, a translator agent, and a style reviewer agent. Testing shows that the translator is influenced by the original user prompt and sometimes answers it instead of translating the writer output. Each agent must consume only the previous agent's response messages.\n\nWhat should you configure?","choices":["Set chain_only_agent_responses=True on the SequentialBuilder","Keep the default context behavior of the SequentialBuilder","Replace the pipeline with a handoff orchestration","Add the user prompt to the translator instructions"],"answer":[0],"explanation":"By default, each agent in a sequential workflow consumes the full conversation of the previous agent (input and response). With chain_only_agent_responses=True, each agent consumes only the response of the previous one, which is ideal for translation pipelines.","rationale":["Correct: this setting makes all participants use only the previous agent response.","The default passes on the full conversation and causes the problem.","With handoff, the receiving agent gets the full context, which does not solve the problem.","Adding the user prompt reinforces the unwanted influence."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/sequential"},{"id":"2.1.2-03","obj":"2.1.2","difficulty":"easy","type":"single","stem":"A. Datum Corporation has a primary planning agent that delegates subtasks to a pricing agent and a compliance agent. The planning agent must keep ownership of the overall task and the full conversation, and it must pass only the information relevant to each subtask to the other agents.\n\nWhich pattern should you use?","choices":["Handoff orchestration","Group chat orchestration","Agent-as-tools","Concurrent orchestration with result aggregation"],"answer":[2],"explanation":"With agent-as-tools, the primary agent retains responsibility and the context, and passes only relevant information to tool agents; control then returns. With handoff, the entire conversation transfers with full context.","rationale":["With handoff, the receiving agent takes over ownership and receives the full context.","In group chat, all agents see the full history, so there is no selective context.","Correct: the primary agent manages the context and shares only what is needed per subtask.","Concurrent sends the same input to all agents and does not let the planner remain the owner of the conversation."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.1.2-04","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank builds a workflow in Microsoft Agent Framework for Python. A downstream audit agent must receive the user's original request and the upstream agent responses, but it must not receive any message that contains an account number. You already wrote a function named drop_account_messages that receives a list of messages and returns the filtered list.\n\n```python\naudit_executor = AgentExecutor(\n    audit_agent,\n    [CODE]\n)\n```\n\nWhich code should you insert at [CODE]?","choices":["context_mode=\"last_agent\", id=\"audit\"","context_mode=\"full\", session=audit_agent.create_session()","chain_only_agent_responses=True, id=\"audit\"","context_mode=\"custom\", context_filter=drop_account_messages"],"answer":[3],"explanation":"context_mode=\"custom\" with a context_filter function determines exactly which messages the agent consumes. last_agent would omit the original user input and full would also pass on the messages with account numbers.","rationale":["last_agent excludes the input of the upstream agent, so the original request is missing.","full passes on the complete conversation, including messages with account numbers; a custom session filters nothing.","chain_only_agent_responses is a parameter of SequentialBuilder, not of AgentExecutor.","Correct: custom with context_filter lets the original request through and filters out sensitive messages."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/advanced/agent-executor"},{"id":"2.1.2-05","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Fourth Coffee builds a Python workflow in Microsoft Agent Framework with a researcher agent and a writer agent. Every tool in the workflow needs the tenant ID of the request. Only the tools of the researcher agent need a database configuration object, and the writer agent must not receive it. The values must flow to the tools for one run without becoming shared workflow state.\n\nWhat should you pass to workflow.run()?","choices":["function_invocation_kwargs=WorkflowInvocationKwargs(global_kwargs={\"tenant\": ...}, executor_kwargs={\"researcher\": {\"db_config\": ...}})","function_invocation_kwargs={\"tenant\": ..., \"db_config\": ...}","client_kwargs={\"tenant\": ..., \"db_config\": ...}","An initial message after which the start executor stores both values by calling ctx.set_state()"],"answer":[0],"explanation":"Workflow-scoped runtime kwargs flow to agents and tools without becoming shared workflow state. WorkflowInvocationKwargs combines global values that every agent executor receives with executor-specific entries, keyed by executor ID or unique agent name, so only the researcher receives db_config.","rationale":["Correct: the tenant ID is global, and db_config targets only the researcher executor.","Incorrect: a plain mapping without executor ID keys is global, so the writer agent also receives db_config.","Incorrect: client_kwargs are runtime values for chat clients, not for tools, and a plain mapping is global.","Incorrect: set_state writes shared workflow state that downstream executors can read, which violates the requirement."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/state?pivots=programming-language-python"},{"id":"2.1.2-06","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a conversational front-end agent that delegates product lookups to a retrieval agent. The retrieval agent receives only the latest user message. When a user asks a follow-up question such as \"What about its pricing?\", the retrieval agent returns irrelevant results. The final answer must still be generated from the user's original question.\n\nWhat should you do?","choices":["Rewrite the follow-up into a self-contained query before retrieval","Increase the number of chunks that the retrieval agent returns","Send the full conversation history to the search index as the query","Use the rewritten query instead of the original question for generation"],"answer":[0],"explanation":"With multi-turn context, you rewrite the current question into a standalone query that resolves references (for example, 'its' becomes the product name). The original request remains the basis for generating the answer.","rationale":["Correct: query rewriting resolves coreferences so that the retrieval agent searches correctly without history.","More chunks do not resolve the unclear reference and add noise.","Using the entire history as search text produces a blurry query and more irrelevant results.","The guideline is to send the original question to the model for generating the answer."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/rag/rag-prompt-engineering"},{"id":"2.1.2-07","obj":"2.1.2","difficulty":"hard","type":"single","stem":"Adventure Works Cycles runs a handoff orchestration in Microsoft Agent Framework with a triage agent, an order agent, and a returns agent. The order agent calls a tool that returns the order status and then hands off to the returns agent. The returns agent sees the user messages and the order agent's text replies, but it has no access to the order status that the tool returned. Each agent has its own AgentSession.\n\nWhat should you identify as the cause?","choices":["Handoff orchestration uses a central orchestrator that summarizes context before each turn","The returns agent shares the same AgentSession instance as the order agent","Tool-related content is not broadcast to other agents; only user and agent messages are synchronized","Context compaction removed the tool result because the session exceeded the context window"],"answer":[2],"explanation":"In a handoff orchestration, participants broadcast their responses and user input to each other, but tool-related content (including handoff tool calls) is not broadcast. As a result, the returns agent does not see the tool output unless it is in an agent message.","rationale":["Handoff uses a mesh topology without a central orchestrator.","In handoff, agents do not share a session instance; each agent has its own session.","Correct: only user and agent messages are synchronized, not tool content.","There is no indication of an overfull context window; the behavior follows from the synchronization design."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.1.2-08","obj":"2.1.2","difficulty":"hard","type":"single","stem":"Contoso Pharmaceuticals builds a Python group chat by using Microsoft Agent Framework with a research agent and a writer agent. The writer agent uses a model from an external provider and must never receive patient identifiers. The research agent sometimes includes patient identifiers in its response text.\n\nA developer removes the identifiers from the events that are returned by workflow.run() before they are shown in the UI. An audit shows that the writer agent still receives the identifiers in its prompts.\n\nWhat should you do?","choices":["Filter the research agent text in a participant-response handler of a custom GroupChatOrchestrator.","Add the research agent to intermediate_output_from, and filter the intermediate events.","Pass the same AgentSession instance to both participants so that they share the filtered history.","Use an orchestrator_agent whose instructions tell the writer agent to ignore patient identifiers."],"answer":[0],"explanation":"In a group chat, the orchestrator broadcasts every response to all other participants after an agent's turn. Filtering events from workflow.run() is too late, because the original response is then already in the shared history and has been broadcast. You stop text in a participant-response handler of a custom GroupChatOrchestrator.","rationale":["Correct: filtering at the boundary of shared history and broadcast prevents the writer from seeing the identifiers.","Incorrect: intermediate_output_from only determines which output becomes visible as events, not what is broadcast.","Incorrect: participants do not share a session instance; the orchestrator synchronizes every session, and the identifiers are then still in the history.","Incorrect: instructions do not prevent the identifiers from ending up in the writer's prompt."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/group-chat"},{"id":"2.1.2-09","obj":"2.1.2","difficulty":"hard","type":"multi","stem":"Graphic Design Institute builds a Python tutoring solution by using Microsoft Agent Framework. A tutor agent and a quiz agent both use FileMemoryProvider over the same FileSystemAgentFileStore, so the model can store and recall each student's learning goals through the file_memory_* tools. The solution has the following requirements:\n\n- Goals that a student mentions in one session must be available in later sessions and to both agents.\n- One student's goals must never be visible to another student.\n- The web client sends the student ID in the request body.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Create FileMemoryProvider with a stable per-student scope, such as scope=f\"student-{student_id}\".","Verify that the student ID belongs to the authenticated caller before you use it as the scope.","Omit the scope so that the provider derives the working folder from the session ID.","Use a per-class scope, such as scope=f\"class-{class_id}\", so that both agents find the goals.","Pass one AgentSession instance to both agents so that they share the memory files."],"answer":[0,1],"explanation":"FileMemoryProvider derives its working folder from the session ID when scope is omitted, so memory is isolated per session. A stable scope, such as a student identifier, shares the same memory files across sessions and agents. The scope is an opaque namespace key, so the application must authorize externally supplied scopes.","rationale":["Correct: a stable per-student scope makes the goals durable across sessions and shared by both agents that use the same store.","Correct: the student ID comes from the client, so the application must authorize it to prevent access to another student's memory.","Incorrect: a session-derived folder isolates memory to one session, so goals are not available in later sessions.","Incorrect: a per-class scope shares one student's goals with every student in the class.","Incorrect: memory files are selected by scope, not by sharing a session, and participants should not share one session instance."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers?pivots=programming-language-python"},{"id":"2.1.3-01","obj":"2.1.3","difficulty":"easy","type":"single","stem":"Alpine Ski House wants its customer service agent to respond in a warmer, more concise brand tone. There is no single correct answer per request, but the company has A/B test logs in which reviewers marked one of two responses to the same prompt as better.\n\nWhich customization method should you use?","choices":["Reinforcement fine-tuning (RFT)","Supervised fine-tuning (SFT)","Few-shot examples in the system message","Direct preference optimization (DPO)"],"answer":[3],"explanation":"DPO trains on pairs of preferred and non-preferred responses to the same input and fits subjective qualities such as tone. Existing A/B logs provide exactly that type of data.","rationale":["RFT requires a grader that scores responses reliably, typically in objective domains.","SFT requires a desired response per prompt instead of preference pairs.","Few-shot examples do not use the collected preference data and lengthen every prompt.","Correct: DPO learns from preferred versus rejected responses for tone and style."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-02","obj":"2.1.3","difficulty":"easy","type":"single","stem":"Coho Winery has an agent that answers questions about product availability and prices. The underlying catalog changes several times per day. A developer proposes fine-tuning the model every night on the latest catalog.\n\nWhat should you recommend?","choices":["Ground the agent on the live catalog by using retrieval instead","Fine-tune the model every hour so that the catalog stays current","Use continuous fine-tuning on the previous fine-tuned model each night","Use reinforcement fine-tuning with a grader that checks prices"],"answer":[0],"explanation":"Fine-tuning does not replace retrieval for current information. Fast-changing knowledge belongs in the context via retrieval or tools; fine-tuning is intended for stable behavior such as format, tone, and terminology.","rationale":["Correct: retrieval supplies current data; fine-tuning remains intended for stable patterns such as format and tone.","Training more often increases cost and still lags behind a catalog that changes several times a day.","Continuous fine-tuning is intended for iterative refinement with new examples, not for daily knowledge updates.","RFT optimizes reasoning behavior with a grader and does not make the model current."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-03","obj":"2.1.3","difficulty":"easy","type":"single","stem":"Wingtip Toys plans its first supervised fine-tuning job in Microsoft Foundry to teach a model a structured output format. The team has thousands of raw chat logs of mixed quality, including duplicates and some sensitive information.\n\nWhat should you recommend for preparing the training data?","choices":["Upload all raw chat logs, because a larger dataset always improves quality","Curate accurate, consistent, representative examples and hold out validation and test data","Reuse the validation set as training data to maximize the number of examples","Put the best chat logs into the system message as few-shot examples instead"],"answer":[2],"explanation":"Fine-tuning is iterative and not a guaranteed improvement: the quality and coverage of the data determine the result. Microsoft advises accurate, consistent, and representative examples, checking for duplicates, bias, and sensitive information before upload, and keeping training, validation, and test data separate.","rationale":["Unfiltered data with duplicates and sensitive information can worsen quality and is a governance risk.","Correct: curated, representative examples with separate validation and test data follow the Foundry guidelines.","Using validation data as training data causes evaluation leakage.","Few-shot in the prompt is an alternative to fine-tuning, not a way to prepare the training data for the job."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-04","obj":"2.1.3","difficulty":"medium","type":"single","stem":"Trey Research uses a fine-tuned model to power a report-writing agent. Each month, analysts curate new high-quality examples, and the team runs a new supervised fine-tuning job. The team must be able to tell the resulting models apart and must deploy the best candidate, not just the most recent one.\n\nWhat should you do?","choices":["Deploy the final checkpoint of each job because it has the lowest training loss","Set a suffix on each job and compare checkpoints on held-out tasks before deploying","Add the new examples to the validation file of the previous job and redeploy it","Add the new examples to the system message of the deployed model each month"],"answer":[3],"explanation":"With a suffix, you make the resulting model recognizable per job. Foundry advises inspecting the checkpoint identifiers and metrics instead of assuming the latest version is the best, and comparing candidates on held-out tasks before you deploy one.","rationale":["A low training loss says nothing about generalization; the last checkpoint is not automatically the best.","Correct: a suffix per iteration plus comparison on held-out tasks yields recognizable models and the best candidate.","Validation data measures the training but does not teach the model anything; the previous model does not change because of it.","Hundreds of examples in the prompt increase tokens and latency and do not replace a fine-tuning iteration."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/fine-tuning"},{"id":"2.1.3-05","obj":"2.1.3","difficulty":"medium","type":"single","stem":"Blue Yonder Airlines runs a high-volume routing agent on a large model. The quality is acceptable, but cost and latency are too high. The task is narrow and stable, and the team can generate high-quality outputs for representative prompts by using the large model.\n\nWhich approach should you use?","choices":["Fine-tune the large model by using direct preference optimization","Fine-tune a smaller model on outputs generated by the large model","Add more few-shot examples generated by the large model to its prompt","Switch the agent to a smaller base model without any fine-tuning"],"answer":[1],"explanation":"Distillation uses teacher-generated examples from a large model to specialize a smaller model through SFT, with lower cost and latency at comparable task performance.","rationale":["DPO on the large model improves preferences but does not reduce cost and latency.","Correct: distillation to a smaller model with teacher-generated SFT data.","More few-shot examples increase token usage and latency.","A smaller base model without training probably does not reach the quality."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-06","obj":"2.1.3","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. must fine-tune a model on regulated customer data. Policy requires that the training data stays in the region of the Foundry resource. The fine-tuning job runs monthly, and queue time is less important than compliance.\n\nWhich training type should you use?","choices":["Global","Developer","Standard","Data zone"],"answer":[2],"explanation":"Standard training runs in the region of the current Foundry resource and offers data residency guarantees. Global is cheaper but copies data to other regions, and Developer has no residency or SLA guarantees.","rationale":["Global copies data and weights to the region where training takes place, so there is no data residency.","Developer uses idle capacity without guarantees for data residency or SLA.","Correct: Standard keeps training in the region of the resource.","Data zone keeps training within a data zone (currently only the US), not within the region of the resource."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-07","obj":"2.1.3","difficulty":"hard","type":"single","stem":"Litware, Inc. fine-tuned a chat model by using training examples that all start with the system message \"You are the Litware claims assistant. Respond in JSON.\" Validation results were strong. After deployment, the agent team uses a new, longer system message that adds tool guidance, and the fine-tuned model now often ignores the JSON format.\n\nWhat should you do first?","choices":["Align the inference system message with the one used in training","Increase the number of training epochs and retrain on the same data","Switch the fine-tuning method to reinforcement fine-tuning","Redeploy the fine-tuned model to a Global Standard deployment"],"answer":[0],"explanation":"For chat models, the system message at inference must match the one in the training data; a different system message can cause unexpected behavior. Use the same system message or retrain with the new one.","rationale":["Correct: the mismatch between the training and inference system message is the cause; use the same system message or retrain with the new one.","More epochs increase the chance of overfitting and do not solve the mismatch.","Switching methods does not address the cause.","The deployment type affects where inference runs, not how the model responds to a different system message."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/fine-tuning-troubleshoot"},{"id":"2.1.3-08","obj":"2.1.3","difficulty":"hard","type":"multi","stem":"School of Fine Art reviews the metrics of a supervised fine-tuning job. Training loss keeps decreasing, but validation loss starts to rise after the first epochs, and the fine-tuned model performs worse than the baseline on held-out test prompts.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Retrain with fewer epochs","Retrain with a smaller learning rate multiplier","Move the validation examples into the training file","Retrain with more epochs so the validation loss can recover","Remove the held-out test set to speed up the next iteration"],"answer":[0,1],"explanation":"Divergence between training and validation loss indicates overfitting. The recommended adjustments are fewer epochs or a smaller learning rate multiplier; keep training, validation, and test data separate.","rationale":["Correct: fewer epochs limits overfitting.","Correct: a smaller learning rate multiplier makes the training less aggressive.","Putting validation data into training causes evaluation leakage and hides overfitting.","More epochs worsens the overfitting.","Without a held-out test set, you cannot compare with the baseline."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/fine-tuning"},{"id":"2.1.3-09","obj":"2.1.3","difficulty":"hard","type":"single","stem":"Relecloud wants a specialized model for a travel-planning agent. The team has curated prompt and ideal response pairs for the core task, and separately has reviewer preference pairs for tone. You need to stack customization methods and be able to detect regressions.\n\nWhich sequence of actions should you perform?","choices":["Run DPO on the base model -> Run SFT on the DPO model -> Measure a baseline -> Compare on held-out data","Run SFT on the base model -> Measure a baseline on held-out data -> Run DPO on the SFT model -> Compare on the training data","Measure the base model on held-out data -> Run SFT with the curated pairs -> Run DPO on the SFT model with the preference pairs -> Compare the result with the baseline on held-out data","Measure the base model on held-out data -> Run DPO with the curated pairs -> Run SFT with the preference pairs -> Compare the result with the baseline on held-out data"],"answer":[2],"explanation":"You can stack techniques: first SFT for the task, then DPO for preferences. A baseline without fine-tuning is essential to detect regressions, and comparison is done on held-out data.","rationale":["The order is reversed and the baseline is measured only after training.","The baseline comes after the first training, and comparing on training data says nothing about generalization.","Correct: baseline, SFT, DPO on the SFT model, and comparison on held-out data.","The datasets are swapped: DPO requires preference pairs and SFT requires prompt-response pairs."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/fine-tuning-direct-preference-optimization"},{"id":"2.2.1-01","obj":"2.2.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. builds a research agent named Agent1 in Python by using Microsoft Agent Framework. Agent1 keeps its conversation history in memory. Agent1 calls tools that return large JSON payloads, and these tool results consume most of the context window. You need to reclaim context space while preserving as much of the user and assistant conversation as possible.\n\nWhich compaction strategy should you use?","choices":["ToolResultCompactionStrategy","SummarizationStrategy","SlidingWindowStrategy","TruncationStrategy"],"answer":[0],"explanation":"ToolResultCompactionStrategy is the least aggressive strategy: it collapses older tool-call groups into compact summary messages and does not touch user messages or plain assistant responses. Because the verbose tool output is the problem and the conversation context must be preserved, this strategy fits best.","rationale":["Correct: collapses only tool results, low aggressiveness and high context retention, intended for verbose tool output.","Replaces older history with a summary and requires an LLM; it suits long conversations, but loses more detail than necessary.","Keeps only the most recent groups and drops older ones; suitable for hard group-count limits, not for preserving conversation context.","Drops the oldest groups as a backstop on the message or token budget; it preserves little context."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction?pivots=programming-language-python"},{"id":"2.2.1-02","obj":"2.2.1","difficulty":"easy","type":"single","stem":"Tailspin Toys builds a customer service agent by using Microsoft Agent Framework in Python. Before each agent run, the agent must receive the current order status of the customer from an internal API. The order status must be added to the prompt for that run, and the agent must be able to process data after the run completes.\n\nWhich component should you implement?","choices":["a custom context provider","a history provider with load_messages set to True","a compaction strategy","a workflow checkpoint"],"answer":[0],"explanation":"Context providers run around every invocation: they add context before the run and can process data after the run. This is exactly the pattern for dynamic context injection, such as the current order status from an API.","rationale":["Correct: a custom context provider injects dynamic instructions or messages before the run and can process state after the run.","A history provider loads and stores chat messages; it is intended for conversation history, not for external live data.","A compaction strategy reduces existing history; it does not add new context.","A checkpoint stores workflow state for resumption; it does not inject context per run."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers"},{"id":"2.2.1-03","obj":"2.2.1","difficulty":"easy","type":"single","stem":"Relecloud builds a Microsoft Agent Framework workflow in Python. An extraction executor reads a document, and a later summarization executor needs the extracted text. The data is large, and the team prefers that the executors share it without sending it as a message between them.\n\nWhich mechanism should you use?","choices":["workflow state by using set_state and get_state on the workflow context","a single AgentSession instance shared by both executors","a checkpoint that is restored before the summarization executor runs","a memory store in Foundry Agent Service with a static scope"],"answer":[0],"explanation":"Workflow state lets multiple executors within a workflow read and write shared data when direct message passing is inconvenient or inefficient. With consistent keys, one executor writes and the next executor reads the same value.","rationale":["Correct: set_state and get_state share data between executors during workflow execution.","AgentSession manages the conversation context of an agent; executors in a workflow do not share data through a shared session.","Checkpoints are used to pause a workflow or resume it after a failure, not to pass data between steps.","A memory store is for long-term memory across sessions, not for temporary data within a workflow run."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/state"},{"id":"2.2.1-04","obj":"2.2.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank builds Agent1 in Python by using Microsoft Agent Framework. Agent1 is backed by a Foundry agent, and the service manages the conversation state. To lower token cost, a developer passes compaction_strategy=SlidingWindowStrategy(keep_last_groups=20) to the Agent constructor. After 50 turns, the input token count per request is unchanged.\n\nWhat should you identify as the cause?","choices":["Compaction applies to agents that manage their own in-memory history, and the service manages the context of Agent1.","The window of 20 groups is larger than the context window of the model.","No tokenizer was passed, so the sliding window counts characters instead of groups.","The sliding window strategy requires a separate summarization client."],"answer":[0],"explanation":"Compaction is relevant only for agents that manage their own in-memory message list. For Foundry agents, the service manages the context server-side, so configuring a compaction strategy has no effect.","rationale":["Correct: for service-managed agents such as Foundry agents, configuring compaction has no effect.","A group count is independent of the size of the context window; with local history, a window of 20 groups would reduce the input after 50 turns.","SlidingWindowStrategy keeps the last keep_last_groups non-system groups; a tokenizer is not needed to count groups.","Only SummarizationStrategy needs an LLM client; a sliding window drops groups without a model."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction?pivots=programming-language-python"},{"id":"2.2.1-05","obj":"2.2.1","difficulty":"medium","type":"single","stem":"Lucerne Publishing builds an editorial assistant in Python by using Microsoft Agent Framework with in-memory history. Editing sessions last for hours. Decisions made early in a session must still influence later answers, and the token count must stay within the context window. Dropping complete early turns is unacceptable.\n\nWhich compaction strategy should you use?","choices":["SummarizationStrategy","ToolResultCompactionStrategy","SlidingWindowStrategy","TruncationStrategy"],"answer":[0],"explanation":"SummarizationStrategy replaces older history with a summary, so early decisions are preserved while the token count drops. Microsoft recommends using a smaller, cheaper model for the summarization client.","rationale":["Correct: moderately aggressive, preserves the meaning of long conversations through a summary.","Collapses only tool results; the problem here is a long conversation history, not tool output.","Drops older groups, which violates the requirement that early decisions must keep counting.","Drops the oldest groups as a backstop; early decisions are then lost."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction?pivots=programming-language-python"},{"id":"2.2.1-06","obj":"2.2.1","difficulty":"medium","type":"single","stem":"Wide World Importers builds a Python support agent by using Microsoft Agent Framework. An AzureAISearchContextProvider in semantic mode is attached through context_providers. Telemetry shows that a search runs on every agent invocation, including greetings and small talk, which adds tokens and latency.\n\nThe agent must retrieve content only when the model decides that it needs more information, and the model must be able to choose its own search string.\n\nWhat should you do?","choices":["Replace the context provider with a search tool created by create_vector_search_tool() and pass it in tools.","Keep the context provider and change its mode from semantic to agentic.","Keep the context provider and lower top_k to 1.","Keep the context provider and add an embedding_function for hybrid search."],"answer":[0],"explanation":"A context provider retrieves content before every model invocation. create_vector_search_tool() turns a vector store collection into a function tool, so the model calls it only when it needs grounding data, and the generated tool always includes a query string that the model supplies.","rationale":["Correct: on-demand retrieval through a function tool lets the model decide when and what to search for.","Incorrect: agentic mode adds query planning and multi-hop retrieval, but the provider still retrieves before each invocation.","Incorrect: fewer results reduce tokens per search, but a search still runs on every invocation.","Incorrect: hybrid search changes how results are ranked, not when a search runs."],"ref":"https://learn.microsoft.com/agent-framework/agents/rag?pivots=programming-language-python"},{"id":"2.2.1-07","obj":"2.2.1","difficulty":"hard","type":"single","stem":"Contoso, Ltd. builds a Python agent by using Microsoft Agent Framework with in-memory history. The agent is created as follows:\n\n```python\nagent = Agent(\n    client=client,\n    compaction_strategy=ToolResultCompactionStrategy(keep_last_tool_call_groups=1),\n    tokenizer=CharacterEstimatorTokenizer(),\n)\n```\n\nOne bulk-export request regularly exceeds the context window. For that request only, you need oldest-first truncation to 8,000 tokens. All other requests must keep the current compaction behavior, and you must not change the defaults of the chat client that other agents share.\n\nWhat should you do?","choices":["Pass compaction_strategy=TruncationStrategy(max_n=8_000, compact_to=4_000) and the tokenizer to agent.run() for that request.","Replace the strategy in the Agent constructor with TruncationStrategy(max_n=8_000, compact_to=4_000).","Configure TruncationStrategy(max_n=8_000, compact_to=4_000) as the default compaction strategy on the chat client.","Call apply_compaction() with a TruncationStrategy on the session messages after the bulk-export run completes."],"answer":[0],"explanation":"Agent-level compaction values override defaults on the chat client, and a single agent.run() call can override both again. Passing a TruncationStrategy and tokenizer to agent.run() applies the aggressive policy to that request only, while every other run keeps the agent-level ToolResultCompactionStrategy.","rationale":["Correct: a per-run override changes compaction for one request without affecting other runs or the shared client.","Incorrect: the agent-level strategy applies to every run of the agent, not only to the bulk-export request.","Incorrect: this changes the shared client defaults, and the agent-level strategy overrides client defaults anyway.","Incorrect: ad-hoc compaction after the run does not reduce the input of the request that already exceeded the context window."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction?pivots=programming-language-python"},{"id":"2.2.1-08","obj":"2.2.1","difficulty":"hard","type":"multi","stem":"Northwind Traders builds a Python agent by using Microsoft Agent Framework. A custom context provider derived from ContextProvider must meet the following requirements for each invocation:\n\n- Add a short summary of the customer's stored preferences to the agent instructions before the model is called.\n- Expose a restricted refund_lookup tool only to premium customers, and only for the current invocation.\n\nThe agent is shared by premium and standard customers.\n\nWhich two actions should you perform in the before_run method? Each correct answer presents part of the solution.","choices":["Call context.extend_instructions(self.source_id, summary).","Call context.extend_tools(self.source_id, [refund_lookup]) when the customer is a premium customer.","Add refund_lookup to the tools parameter of the Agent constructor.","Add the summary as an input message in an InMemoryHistoryProvider with load_messages=True.","Move the summary logic to after_run so that it runs once the model has responded."],"answer":[0,1],"explanation":"Custom context providers inject dynamic instructions, messages, or tools before execution. In before_run, context.extend_instructions adds the preference summary, and context.extend_tools adds refund_lookup for the current invocation only, so the tool is exposed conditionally per customer.","rationale":["Correct: extend_instructions adds the summary to the instructions for this invocation.","Correct: extend_tools adds the tool for the current invocation only, so it can be limited to premium customers.","Incorrect: a tool in the Agent constructor is available on every run, including runs for standard customers.","Incorrect: a history provider loads and stores conversation messages; storing the summary there persists it as history and does not add it to the instructions.","Incorrect: after_run runs after execution, so it cannot enrich the input of that model call."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers?pivots=programming-language-python"},{"id":"2.2.1-09","obj":"2.2.1","difficulty":"medium","type":"single","stem":"Proseware, Inc. builds a Python agent by using Microsoft Agent Framework. DatabaseHistoryProvider is the primary history provider. You add a second provider to capture an evaluation log that includes the context injected by other providers. Messages must not be loaded twice into the same invocation.\n\n```python\nprimary = DatabaseHistoryProvider(db)\naudit = InMemoryHistoryProvider(\"audit\", ______)\nagent = Agent(client=OpenAIChatClient(), context_providers=[primary, audit])\n```\n\nWhich arguments should you use to complete the code?","choices":["load_messages=False, store_context_messages=True","load_messages=True, store_context_messages=True","load_messages=True, store_context_messages=False","load_messages=False, store_context_messages=False"],"answer":[0],"explanation":"In Python, only one history provider may use load_messages=True, otherwise messages are loaded twice into the invocation. An additional provider for diagnostics or evals uses load_messages=False and store_context_messages=True, so that it also captures the context of other providers.","rationale":["Correct: loads no messages and does capture the enriched context plus input and output.","Two providers with load_messages=True load the same history twice into the invocation.","Double loading, and in addition no capture of the injected context.","Prevents double loading, but does not capture the context of other providers for the evaluation log."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers"},{"id":"2.2.2-01","obj":"2.2.2","difficulty":"easy","type":"single","stem":"Fourth Coffee builds an operations agent in Foundry Agent Service. Users often ask the agent to repeat a multistep routine that the agent previously performed for them, such as preparing a weekly supplier report. The agent must recall how it handled that routine before.\n\nWhich memory type should you rely on?","choices":["procedural memory","user profile memory","chat summary memory","a Foundry IQ knowledge base"],"answer":[0],"explanation":"Procedural memory stores reusable how-to routines and work patterns derived from earlier interactions. You retrieve them when the user asks for a recurring workflow that the agent has performed before.","rationale":["Correct: procedural memory is intended for recurring routines and tasks that the agent has handled before.","User profile memory contains durable preferences such as language or accessibility needs, not work routines.","Chat summary memory contains summaries of earlier conversation topics for continuity, not reusable procedures.","A Foundry IQ knowledge base grounds the agent on curated organizational content, not on learned user-specific routines."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-memory"},{"id":"2.2.2-02","obj":"2.2.2","difficulty":"easy","type":"single","stem":"Humongous Insurance uses a single memory store in Foundry Agent Service for a claims agent. Memories are partitioned by a scope per customer. A customer submits a data deletion request. Memories of other customers must remain available.\n\nWhat should you do?","choices":["Delete the memories for the scope of that customer.","Delete the memory store.","Set a default TTL on the memory store.","Update the user_profile_details option of the memory store."],"answer":[0],"explanation":"Deleting by scope removes all memories of a specific user or group and leaves the memory store structure intact. Microsoft explicitly names this for handling user deletion requests.","rationale":["Correct: deleting a scope removes all memories of that customer and leaves other scopes untouched.","Deleting the store irreversibly erases the memories of all customers.","A TTL lets memories expire over time, but does not directly satisfy a specific deletion request.","user_profile_details controls what is extracted going forward; it does not delete existing memories."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-03","obj":"2.2.2","difficulty":"easy","type":"single","stem":"Coho Winery has a Foundry Agent Service prompt agent that has the memory search tool attached. A user tells the agent, \"Forget my home address.\" The privacy policy requires that this request takes effect immediately and that all other memories of the user remain available. You want to avoid writing custom memory-management code.\n\nWhat should you do?","choices":["Rely on the memory search tool to apply the forget command directly.","Delete the memories for the scope of the user.","Set user_profile_details to exclude home addresses.","Set default_ttl_seconds on the memory store to a short value."],"answer":[0],"explanation":"When a user explicitly asks to remember or forget something, the memory search tool applies that command directly and returns the result as memory command items. No additional tool configuration is needed, and the other memories of the user remain.","rationale":["Correct: direct remember-or-forget behavior carries out the request immediately without custom code.","Incorrect: deleting by scope erases all memories of the user, while the rest must remain available.","Incorrect: user_profile_details controls future extraction, but does not delete the address that is already stored.","Incorrect: a TTL makes all memories expire over time and does not act immediately on this one item."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-04","obj":"2.2.2","difficulty":"medium","type":"single","stem":"Wide World Importers attaches the memory search tool to a prompt agent in Foundry Agent Service. A backend service named App1 calls the agent on behalf of about 80 end users in a pilot program by using its own managed identity. Each end user must have isolated memories, and identifiers must not be hard-coded in the tool definition.\n\nWhat should you do?","choices":["Set scope to {{$userId}} in the tool definition, and send the x-memory-user-id header with the end user ID on each response call.","Set scope to {{$userId}} in the tool definition, and rely on the Microsoft Entra token of App1 to resolve the user.","Set scope to a static value in the tool definition, and filter memories by user in App1.","Create a separate agent version for each end user with the user ID as a static scope."],"answer":[0],"explanation":"With scope {{$userId}}, the service resolves the user per response call. In proxy or backend scenarios you use the x-memory-user-id header; without the header, the service falls back to the TID and OID of the caller, which here is the identity of App1 and would put all users in one scope.","rationale":["Correct: the header supplies the actual end user per call, without hard-coded identifiers.","Without the header, the Entra identity of App1 is used, so all end users share the same scope.","A static scope shares memories across all users; filtering in the app provides no real isolation.","A separate agent version per user with a hard-coded scope does not scale and violates the requirement not to hard-code identifiers."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-05","obj":"2.2.2","difficulty":"medium","type":"single","stem":"Coho Winery creates a new memory store in Foundry Agent Service. The retention policy states that memory entries must expire 30 days after they were last updated.\n\n```python\noptions = MemoryStoreDefaultOptions(\n    chat_summary_enabled=True,\n    user_profile_enabled=True,\n    ______=timedelta(days=30),\n)\n```\n\nWhich option should you use to complete the code?","choices":["default_ttl_seconds","update_delay","user_profile_details","procedural_memory_enabled"],"answer":[0],"explanation":"default_ttl_seconds sets the default retention for new memory entries in the store. TTL applies to all memories, and an update and consolidation resets the last-updated time. You set this default when you create the store.","rationale":["Correct: the store-level default TTL controls the expiration of memory entries.","update_delay is a setting of the memory search tool that determines after how much inactivity memories are updated.","user_profile_details determines which profile information is extracted, not how long it is retained.","procedural_memory_enabled turns procedural memory on or off, not the retention."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-06","obj":"2.2.2","difficulty":"medium","type":"single","stem":"Best For You Organics Company uses memory in Foundry Agent Service for a nutrition agent. The agent must keep personalizing answers based on dietary preferences. The privacy officer requires that the memory system does not store financial data, age, precise location, or credentials that users mention in conversations.\n\nWhat should you do?","choices":["Set user_profile_details to exclude those data categories.","Set user_profile_enabled to False on the memory store.","Set a default TTL of one day on the memory store.","Use one static scope for all users of the agent."],"answer":[0],"explanation":"With user_profile_details, you specify which categories of profile information are or are not extracted, for example avoiding age, finances, precise location, and credentials. This keeps personalization working while the memory remains compliant.","rationale":["Correct: user_profile_details excludes sensitive categories and preserves personalization.","Disabling user profile memory also stops the storage of dietary preferences, so personalization disappears.","A short TTL still stores sensitive data temporarily and undermines long-term personalization.","A shared scope increases the privacy risk; scope controls isolation, not which data is stored."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-07","obj":"2.2.2","difficulty":"hard","type":"single","stem":"Graphic Design Institute tests a Foundry Agent Service prompt agent that has the memory search tool attached with the default configuration. In a test script, User1 states a preference, and the script immediately starts a new conversation with the same scope to ask a related question. The agent does not recall the preference. The memory store name and scope are verified as correct.\n\nWhat should you do to make the test pass?","choices":["Set update_delay to 0 on the memory search tool.","Use a new stable identifier as the scope in the second conversation.","Enable chat_summary_enabled on the memory store.","Attach the file search tool to the agent."],"answer":[0],"explanation":"After each response, the service calls update_memories, but the actual write to long-term memory is debounced by update_delay (default 300 seconds). A new conversation started immediately therefore does not yet see the preference; with update_delay set to 0, the update is processed immediately (in production you can also wait longer).","rationale":["Correct: the debounce of update_delay explains why the memories have not yet been written.","A different scope ensures that the stored memories are never found.","Chat summary memory is already enabled by default and determines which type of memory is extracted, not when the write occurs.","File search searches uploaded documents and does not write user preferences to memory."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-08","obj":"2.2.2","difficulty":"hard","type":"single","stem":"Trey Research hosts a Microsoft Agent Framework agent that uses service-managed storage through the OpenAI Responses API. One Foundry project and one backing key serve all end users of a multi-tenant portal. Users resume conversations after they sign in again. A security review flags that a user who obtains another conversation ID can resume that conversation.\n\nWhat should you do?","choices":["Map your own session IDs to server-stored conversation IDs and verify ownership on resume.","Return the serialized AgentSession to the browser and restore it from the next request.","Rely on the opaque, unguessable format of the service conversation IDs.","Add a local history provider alongside the service-managed session."],"answer":[0],"explanation":"By default, Responses and Conversations IDs are scoped to the backing key or project, not to the end user. With a shared project for multiple users, you store those IDs in trusted server-side storage, map them from your own session IDs, and verify ownership before resuming.","rationale":["Correct: server-side mapping plus an ownership check binds each session to the authenticated user or tenant.","A serialized session should be kept as trusted application state; returning it to the client allows tampering.","Opaque IDs are not bound to the user; anyone who obtains an ID can still resume the conversation.","Combining local history with service-managed sessions is discouraged and does not solve the authorization issue."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/storage"},{"id":"2.2.2-09","obj":"2.2.2","difficulty":"hard","type":"multi","stem":"Consolidated Messenger runs a multi-agent workflow by using Microsoft Agent Framework. To save startup time, one workflow instance is built at application start and reused for every customer request. Checkpoints are written so that long-running requests can resume after a failure. Testers find content from a previous customer in the answers to a new customer. You need to isolate agent state per request and protect the persisted workflow state.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Wrap agent creation and workflow building in a helper method that is called for each request.","Store checkpoints in private storage that only authorized services can read and write.","Share one AgentSession instance across all agents in the workflow.","Restore the most recent checkpoint at the start of every new request.","Use one static memory scope for all customers."],"answer":[0,1],"explanation":"Agent threads persist across runs of the same workflow instance, so reuse leads to unintentionally shared state. A helper that builds new agents and a new workflow per request isolates the state. Checkpoint storage is a trust boundary and belongs in secured, private storage.","rationale":["Correct: each call produces new agent instances with their own threads, so there is no leakage between customers.","Correct: checkpoints are trusted application state; never load them from untrusted sources and restrict access.","A shared session actually increases the risk of inconsistent and leaked context between agents.","Restoring the checkpoint of another request introduces exactly the state of a previous customer.","A shared memory scope shares memories between customers and violates isolation."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/state"},{"id":"2.2.3-01","obj":"2.2.3","difficulty":"easy","type":"single","stem":"City Power & Light builds a multi-agent RAG solution over long technical manuals in Azure AI Search. You choose fixed-size chunking for a first iteration. You need a starting configuration that maintains continuity between chunks without excessive duplication.\n\nWhich chunking configuration should you start with?","choices":["512 tokens per chunk with an overlap of 128 tokens","512 tokens per chunk with no overlap","8,000 tokens per chunk with no overlap","512 tokens per chunk with an overlap of 384 tokens"],"answer":[0],"explanation":"Microsoft recommends starting with chunks of 512 tokens (about 2,000 characters) and an overlap of 25 percent, so 128 tokens. This overlap provides smooth transitions between chunks without excessive duplication.","rationale":["Correct: this is the recommended starting point of 512 tokens with 25 percent overlap.","Without overlap, meaning can be lost at chunk boundaries.","Very large chunks approach the input limit of embedding models and dilute the embedding.","An overlap of 75 percent causes excessive duplication; in addition, the Text Split skill requires the overlap to be smaller than half of the chunk length."],"ref":"https://learn.microsoft.com/azure/search/vector-search-how-to-chunk-documents"},{"id":"2.2.3-02","obj":"2.2.3","difficulty":"easy","type":"single","stem":"Nod Publishers indexes book excerpts in Azure AI Search by using an Azure OpenAI Embedding skill that calls a text-embedding-3-small deployment. A retrieval agent submits text queries, and the index converts them to vectors by using a vectorizer that points to a text-embedding-3-large deployment. Relevance is poor.\n\nWhat should you do?","choices":["Point the vectorizer to the model deployment of the embedding skill.","Increase the k value of the vector query to return more matches.","Enable semantic ranking on the index for the agent queries.","Add a scoring profile that boosts the title field."],"answer":[0],"explanation":"For correct results, you must use the same embedding model for indexing and for queries. The skill generates embeddings during indexing and the vectorizer during queries; therefore choose a skill-vectorizer pair that points to the same model deployment.","rationale":["Correct: query vectors and document vectors must come from the same model to be comparable.","Retrieving more results does not fix the fact that the vectors are in different spaces.","Semantic ranking reranks results, but cannot repair poorly retrieved L1 results.","A scoring profile boosts fields, but does not resolve the mismatch between models."],"ref":"https://learn.microsoft.com/azure/search/vector-search-how-to-configure-vectorizer"},{"id":"2.2.3-03","obj":"2.2.3","difficulty":"easy","type":"single","stem":"Southridge Video runs a hybrid query in Azure AI Search for a research agent. The initial results are relevant to the keywords, but the top results do not best match the intent of the question. You need a secondary ranking step that uses language understanding to rescore the initial results.\n\nWhich feature should you enable?","choices":["semantic ranking","a scoring profile","vector weighting","a synonym map"],"answer":[0],"explanation":"The semantic ranker adds L2 ranking over an initial result set scored with BM25 or RRF. It uses deep learning models from Microsoft Bing to surface the semantically most relevant results.","rationale":["Correct: semantic ranking rescores L1 results based on the meaning of the query.","A scoring profile boosts scores based on fields or criteria, not on language understanding.","Vector weighting changes the weight of vector queries within RRF, but does not add semantic reranking.","A synonym map broadens keyword matching, but does not rerank results by intent."],"ref":"https://learn.microsoft.com/azure/search/semantic-search-overview"},{"id":"2.2.3-04","obj":"2.2.3","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. indexes PDF policy documents that use deep heading structures. The existing skillset already calls the Document Layout skill, and the team must use only generally available features. Agents retrieve passages that are often cut off in the middle of a section, and the chunks lose their section context. You need chunks that follow document structure and stay within a maximum size.\n\nWhat should you do?","choices":["Apply the Text Split skill to each Markdown section from the Document Layout skill.","Apply the Text Split skill in pages mode to the full extracted document content.","Apply the Text Split skill in sentences mode to the full extracted document content.","Index the PDF files by using the Markdown parsing mode of the blob indexer."],"answer":[0],"explanation":"The Document Layout skill recognizes document structure (headings and content) through the layout model of Azure Document Intelligence and returns Markdown sections. By running the Text Split skill per Markdown section, you limit the chunk size within each section and chunks stay semantically coherent. For new skillsets, Microsoft recommends the Azure Content Understanding skill, but its semantic chunking is still in preview.","rationale":["Correct: structure-based chunking per section with a maximum size, based on the existing Document Layout output.","Pages mode over the full content splits by length and ignores headings, which causes the current cut-off sections.","Sentences mode creates chunks of individual sentences; these lack section context.","The Markdown parsing mode is intended for Markdown files, not for recognizing headings in PDF files."],"ref":"https://learn.microsoft.com/azure/search/search-how-to-semantic-chunking"},{"id":"2.2.3-05","obj":"2.2.3","difficulty":"hard","type":"single","stem":"A. Datum Corporation stores 200 million chunks in Azure AI Search, embedded by text-embedding-3-large. Vector index memory is the main cost driver. You need the largest reduction in vector index size while keeping the loss in result quality minimal. You create new vector fields that use the HNSW algorithm.\n\nWhich compression configuration should you use?","choices":["binary quantization with truncationDimension set to 1,024 and rescoring with the original vectors","binary quantization with truncationDimension set to 1,024 and no rescoring","scalar quantization to int8 with no truncation and rescoring with the original vectors","no quantization, with the stored property of the vector fields set to false"],"answer":[0],"explanation":"Binary quantization with MRL truncation delivers the largest reduction of the vector index. With binary quantization, Microsoft recommends a truncationDimension of 1,024 or higher; below that, quality drops. Rescoring with the original vectors and oversampling compensate for the information loss.","rationale":["Correct: maximum reduction with MRL plus binary, with a dimension that preserves quality and rescoring as compensation.","The same index reduction, but without rescoring and oversampling the information loss of binary compression is not compensated.","Scalar int8 reduces the vector index about four times, which is much less than binary with truncation.","Setting stored to false saves only disk storage, not the more expensive memory of the vector index."],"ref":"https://learn.microsoft.com/azure/search/vector-search-how-to-truncate-dimensions"},{"id":"2.2.3-06","obj":"2.2.3","difficulty":"medium","type":"single","stem":"Blue Yonder Airlines grounds a baggage policy agent on an Azure AI Search index whose vector fields use the HNSW algorithm. Before tuning HNSW parameters, the team must measure the recall of the current approximate results against the exact nearest neighbors for a set of test queries. The index definition must not be changed.\n\nWhat should you do?","choices":["Set exhaustive to true on the vector queries of the test set.","Change the algorithm of the vector fields to exhaustiveKnn.","Increase the k value on the vector queries of the test set.","Set vectorFilterMode to preFilter on the test set queries."],"answer":[0],"explanation":"Fields indexed with HNSW also support exhaustive KNN through the query parameter exhaustive: true. Exhaustive KNN returns the exact k nearest neighbors and is therefore suitable for building a ground truth set to measure the recall of ANN, without changing the index.","rationale":["Correct: exhaustive: true runs a brute-force KNN per query over an HNSW field and returns the exact nearest neighbors.","This changes the index definition, and fields with exhaustiveKnn no longer support HNSW queries, so you could no longer compare.","A larger k returns more approximate results, but no exact ground truth.","vectorFilterMode determines when an OData filter is applied and does not return exact nearest neighbors."],"ref":"https://learn.microsoft.com/azure/search/vector-search-ranking"},{"id":"2.2.3-07","obj":"2.2.3","difficulty":"medium","type":"single","stem":"Adventure Works Cycles shares one Azure AI Search index among several specialist agents. Each agent filters vector queries on a department field, and some departments contain very few documents. With the current filter mode, agents for small departments sometimes receive fewer than k results, although matching documents exist. Recall matters more than latency.\n\nWhich vectorFilterMode should you use?","choices":["preFilter","postFilter","strictPostFilter","no filter mode, with a threshold parameter instead"],"answer":[0],"explanation":"preFilter applies the filter during the HNSW traversal and guarantees that k results are returned if they exist. This increases recall but costs more CPU and latency with highly selective filters; with very few matches you can also consider exhaustive search.","rationale":["Correct: preFilter maximizes recall and returns k results if they exist.","postFilter can produce false negatives with highly selective filters or a small k, exactly the reported problem.","strictPostFilter first determines the unfiltered global top-k and has the highest risk of false negatives.","A threshold removes weak results and does not solve the problem of missing filtered results."],"ref":"https://learn.microsoft.com/azure/search/vector-search-filters"},{"id":"2.2.3-08","obj":"2.2.3","difficulty":"hard","type":"single","stem":"Northwind Traders builds an Azure AI Search pipeline for a multi-agent RAG solution. Documents are in Azure Blob Storage. Content must be chunked and vectorized during indexing, and agents must submit plain-text queries against the vector fields. Changed documents must be picked up on a schedule.\n\nWhich sequence of actions should you perform?","choices":["Create a data source -> create a skillset with the Text Split skill and an embedding skill -> create an index with a vectorizer assigned to the vector fields -> create an indexer that runs on a schedule","Create an index with a vectorizer -> create an indexer that runs on a schedule -> create a data source -> create a skillset with the Text Split skill and an embedding skill","Create a skillset with an embedding skill -> create an indexer that runs on a schedule -> create a data source -> create an index with a vectorizer","Create a data source -> create an indexer that runs on a schedule -> create an index with a vectorizer -> create a skillset with the Text Split skill and an embedding skill"],"answer":[0],"explanation":"For chunking and vectorization during indexing, you first create a data source, then a skillset with Text Split and an embedding skill, then an index with a vectorizer for query time, and finally an indexer that drives everything. The indexer references the other objects and therefore comes last; schedule it for changed documents.","rationale":["Correct: this follows the documented order, with the indexer last because it uses the other objects.","The indexer references the data source and skillset, which do not exist yet at that point.","The indexer is created before the data source and index exist; in addition, chunking is missing.","The indexer is created before the index and skillset that it references exist."],"ref":"https://learn.microsoft.com/azure/search/vector-search-integrated-vectorization"},{"id":"2.2.3-09","obj":"2.2.3","difficulty":"hard","type":"multi","stem":"Wingtip Toys has a retrieval agent that serves several other agents. The agent sends hybrid queries with semantic ranking to an Azure AI Search index. The vector query sets k to 10. Two issues are reported:\n\n- The semantic ranker returns fewer results than expected and misses relevant passages.\n- For questions that contain exact part numbers, such as WT-4471-B, vector matches dominate the fused results and push the keyword matches down.\n\nThe agent must keep using hybrid queries with semantic ranking.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Set k on the vector query to at least 50, and use top to limit the returned results.","Set the weight of the vector query to a value below 1.0.","Apply a minimum threshold to the fused RRF scores.","Replace the hybrid query with a vector query that uses exhaustive KNN.","Set vectorFilterMode to postFilter on the vector query."],"answer":[0,1],"explanation":"Semantic ranking operates on the candidates that hybrid retrieval supplies; Microsoft recommends setting k to at least 50 and limiting the number of returned results with top. When vector results dominate, you lower the weight of the vector query (weight, default 1.0) so that the keyword matches count more heavily in RRF.","rationale":["Correct: with k = 10 the semantic ranker gets too little input; k at 50 and top for the response solves that.","Correct: weight is a multiplier in the RRF calculation; a value below 1.0 reduces the influence of the vector query.","RRF scores are small and volatile, so minimum thresholds do not fit hybrid queries.","A pure vector query drops the keyword matches on part numbers entirely and violates the requirement to keep using hybrid.","vectorFilterMode determines when a filter is applied and does not change the balance between keyword and vector results."],"ref":"https://learn.microsoft.com/azure/search/hybrid-search-how-to-query"},{"id":"2.2.4-01","obj":"2.2.4","difficulty":"easy","type":"single","stem":"Contoso Suites builds a Foundry IQ knowledge base for its concierge agents. The agents must ground answers on real-time public information, such as current local events, retrieved at query time from Microsoft Bing.\n\nWhich knowledge source should you add?","choices":["a web knowledge source","an MCP server knowledge source","a remote SharePoint knowledge source","a search index knowledge source"],"answer":[0],"explanation":"A web knowledge source is a remote knowledge source that retrieves real-time grounding data from Microsoft Bing. Content is not ingested into Azure AI Search but retrieved at query time.","rationale":["Correct: the web knowledge source retrieves real-time public data through Bing.","An MCP server knowledge source retrieves live results from your own MCP endpoint, not from Bing.","Remote SharePoint retrieves content from SharePoint in Microsoft 365, not from the public web.","A search index knowledge source wraps an existing index with pre-indexed content."],"ref":"https://learn.microsoft.com/azure/search/agentic-knowledge-source-overview"},{"id":"2.2.4-02","obj":"2.2.4","difficulty":"easy","type":"single","stem":"First Up Consultants builds an agent in Foundry Agent Service. During a conversation, consultants upload their own PDF and Word files and ask questions about them. The team does not want to manage search infrastructure or ingestion pipelines.\n\nWhich tool should you add to the agent?","choices":["the file search tool","the Azure AI Search tool","a Foundry IQ knowledge base","the web search tool"],"answer":[0],"explanation":"File search searches documents that you upload directly, without managing external search infrastructure. The service handles parsing, chunking, embeddings, and hybrid retrieval. Microsoft also explicitly names file search for user-provided documents during an interaction.","rationale":["Correct: file search processes uploaded files automatically and searches them during the interaction.","The Azure AI Search tool is intended for searching existing indexes that you manage yourself.","A Foundry IQ knowledge base grounds agents on curated organizational content from knowledge sources.","Web search retrieves current public information, not uploaded files."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/file-search"},{"id":"2.2.4-03","obj":"2.2.4","difficulty":"easy","type":"single","stem":"Bellows College runs five agents that answer questions about admissions, finance, and housing. Content is spread across Azure Blob Storage, SharePoint, and OneLake. All agents must reuse one governed, permission-aware knowledge layer that returns answers with citations.\n\nWhat should you use?","choices":["a Foundry IQ knowledge base shared by the agents","a file search tool with a separate vector store for each agent","a memory store in Foundry Agent Service shared by the agents","an Azure AI Search tool that points to a separate index for each agent"],"answer":[0],"explanation":"A Foundry IQ knowledge base consists of knowledge sources across multiple data stores and can be shared by multiple agents. Agentic retrieval processes the query, enforces user permissions, and returns grounded answers with citations.","rationale":["Correct: a knowledge base is reusable across agents, multi-source, and permission-aware.","A vector store per agent duplicates content and provides no central governance or permission model.","A memory store contains learned user context, not curated organizational content.","Separate indexes per agent fragment the knowledge and require separate pipelines for each source."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-foundry-iq"},{"id":"2.2.4-04","obj":"2.2.4","difficulty":"medium","type":"single","stem":"The Phone Company queries a Foundry IQ knowledge base from a support agent. Responses must contain a grounded natural-language answer with inline citations. Within that requirement, retrieval must have the lowest latency and a predictable cost per request.\n\nWhich retrieval reasoning effort should you set?","choices":["low","minimal","medium","auto"],"answer":[0],"explanation":"Answer synthesis requires low or medium; minimal disables LLM processing and supports only extractiveData. Low performs a single pass of LLM-based query planning and is the cheapest and fastest option that supports answer synthesis.","rationale":["Correct: low supports answer synthesis with the least latency.","minimal is incompatible with answer synthesis because it disables LLM processing.","medium adds iterative search, which increases latency and cost.","With auto, the service chooses the level, so the cost per request is less predictable."],"ref":"https://learn.microsoft.com/azure/search/agentic-retrieval-how-to-set-retrieval-reasoning-effort"},{"id":"2.2.4-05","obj":"2.2.4","difficulty":"medium","type":"single","stem":"Woodgrove Bank connects a Foundry IQ knowledge base to an agent in Foundry Agent Service as an MCP tool. One knowledge source contains permission-protected documents. Testing shows that every user receives every document, regardless of the permissions in the source.\n\nWhat should you do?","choices":["Pass the token of the signed-in user in the x-ms-query-source-authorization header.","Authenticate the project connection by using the managed identity of the agent.","Instruct the agent in its system prompt to filter results on a security field.","Set the retrieval reasoning effort of the knowledge base to minimal."],"answer":[0],"explanation":"To enforce permissions, you pass the identity token of the signed-in user in the x-ms-query-source-authorization header of the MCP tool connection. Without that token, permission-enabled sources return unfiltered results.","rationale":["Correct: with the user token, the retrieval engine filters on what that user is allowed to see.","The managed identity of the agent authenticates the agent itself and provides no per-user filtering.","Instructions in the prompt are not a security mechanism and are not executed as a query filter.","The reasoning effort affects query planning, not the enforcement of document permissions."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/foundry-iq-connect"},{"id":"2.2.4-06","obj":"2.2.4","difficulty":"medium","type":"single","stem":"Litware, Inc. connects an existing Azure AI Search index to a Foundry agent by using the Azure AI Search tool. The index has vector fields with a vectorizer and a semantic configuration. Agents must match exact keywords and conceptual meaning, and results must be reranked by semantic relevance.\n\nWhich query_type should you configure?","choices":["vector_semantic_hybrid","vector_simple_hybrid","semantic","vector"],"answer":[0],"explanation":"vector_semantic_hybrid combines keyword and vector searches and adds semantic reranking; it is also the default value of the tool. This covers exact keywords, conceptual meaning, and reranking by semantic relevance.","rationale":["Correct: hybrid plus semantic reranking meets all three requirements.","vector_simple_hybrid combines keyword and vector, but without semantic reranking.","semantic uses keyword search with semantic ranking, but without vector search for conceptual matches.","vector searches only on similarity and lacks exact keyword precision and semantic reranking."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/ai-search"},{"id":"2.2.4-07","obj":"2.2.4","difficulty":"hard","type":"single","stem":"Contoso Pharmaceuticals grounds research agents on SharePoint in Microsoft 365. Document permissions change daily, and documents carry Microsoft Purview sensitivity labels. Governance must remain in SharePoint, results must respect current permissions and labels without reindexing, and the team prefers to maintain no search index for this content.\n\nWhich knowledge source should you use?","choices":["a remote SharePoint knowledge source","an indexed SharePoint knowledge source","a search index knowledge source over an index built by the SharePoint indexer with ACL ingestion","a search index knowledge source with security filters on a group field"],"answer":[0],"explanation":"A remote SharePoint knowledge source calls SharePoint directly through the Copilot Retrieval API at query time. Governance remains in SharePoint and results automatically respect all current permissions and Purview labels, without an index. Index-based options require an index and indexer runs to synchron

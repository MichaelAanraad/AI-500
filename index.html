 orchestration runs agents in parallel and does not route a request to one specialist after a dialog.","Incorrect: plan review lets a human review the manager's plan, not provide multi-turn input to an intake agent."],"ref":"https://learn.microsoft.com/agent-framework/workflows/human-in-the-loop?pivots=programming-language-python"},{"id":"2.4.2-06","obj":"2.4.2","difficulty":"medium","type":"single","stem":"Proseware, Inc. runs a hosted agent that uses tools from a Foundry toolbox. The tools/list response marks a payment tool with require_approval set to always. The agent instructions tell the model to ask the user before calling the tool, but audits show that the tool was invoked without user approval.\n\nWhat should you do?","choices":["Enforce the approval in the agent runtime before each invocation of the tool","Strengthen the agent instructions so that the model asks for confirmation before each call","Rely on the toolbox MCP endpoint to block tools/call until approval is granted","Change the require_approval value of the payment tool to never in the toolbox"],"answer":[0],"explanation":"The toolbox MCP endpoint does not block tools/call when require_approval is set to always; the agent runtime must enforce the setting for every call. A system prompt alone does not enforce approval.","rationale":["Correct: the runtime must pause the exact pending call, retrieve the decision, and only then execute or reject it.","Incorrect: a prompt instruction is not an enforceable control, as the audit already shows.","Incorrect: the toolbox endpoint does not block the call; relying on it is the cause of the problem.","Incorrect: disabling approval for a payment tool removes the required human control."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/use-toolbox-hosted-agent"},{"id":"2.4.2-07","obj":"2.4.2","difficulty":"hard","type":"single","stem":"Coho Winery creates a Foundry Agent Service agent that uses an MCP tool. Write operations on the MCP server must be approved by a developer before they run.\n\nYou need to implement the approval flow.\n\nWhich sequence of actions should you perform?","choices":["Create the agent with an mcp tool that requires approval -> Send the user request -> Review the tool name and arguments in the mcp_approval_request output item -> Submit the approval by using previous_response_id with approve set to true","Send the user request -> Create the agent with an mcp tool that requires approval -> Submit the approval by using previous_response_id with approve set to true -> Review the tool name and arguments in the mcp_approval_request output item","Create the agent with an mcp tool that requires approval -> Submit the approval by using previous_response_id with approve set to true -> Send the user request -> Review the tool name and arguments in the mcp_approval_request output item","Create the agent with an mcp tool that requires approval -> Send the user request -> Submit the approval by using previous_response_id with approve set to true -> Review the tool name and arguments in the mcp_approval_request output item"],"answer":[0],"explanation":"First you configure the mcp tool with require_approval. When the model wants to call a tool, you receive an output item of type mcp_approval_request with the tool name and arguments; only after review do you send the approval with previous_response_id and approve set to true.","rationale":["Correct: configure, request, review the approval request, and then approve is the documented sequence.","Incorrect: you cannot send a request to an agent that does not exist yet, and approving before review is unsafe.","Incorrect: an approval in advance has no previous response to refer to; there is no approval request yet.","Incorrect: approving before you review the tool name and arguments makes the human control pointless."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"2.4.2-08","obj":"2.4.2","difficulty":"hard","type":"multi","stem":"Alpine Ski House designs a multi-agent maintenance solution. Agents read telemetry continuously, and some agents can shut down ski lifts. Low-risk actions must proceed without waiting for people. A maker-checker loop drafts shutdown plans and must not loop indefinitely when the checker keeps rejecting the plan. When a mandatory approval is pending, the orchestration must resume without replaying earlier agent work.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Scope human approval gates to the specific shutdown tool invocations","Set an iteration cap on the maker-checker loop and escalate to a human reviewer when the cap is reached","Persist the orchestration state at each mandatory approval checkpoint","Require human approval of every agent output before the next agent runs","Keep the orchestration state in memory until the approver responds"],"answer":[0,1,2],"explanation":"You can limit HITL gates to sensitive tool calls so the orchestration continues autonomously for low-risk actions. A maker-checker loop needs an iteration limit with a fallback such as escalation to a human, and mandatory gates make the step synchronous, so you persist the state to resume without replay.","rationale":["Correct: gates on specific tool calls keep low-risk actions autonomous.","Correct: an iteration limit with escalation prevents endless refinement loops.","Correct: persisting state at mandatory gates makes resuming without repetition possible.","Incorrect: requiring approval of every output also blocks low-risk actions, which conflicts with the requirement.","Incorrect: in-memory state does not survive an interruption and forces replay of earlier work."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.2-09","obj":"2.4.2","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines builds a Python booking solution by using SequentialBuilder with a booking agent and a confirmation agent. The reservation tool is decorated with @tool(approval_mode=\"always_require\"). A new edge case requires the workflow to ask the user a typed question to collect missing passenger details at a fixed point before the booking agent runs, and the explicit order of executors must be preserved.\n\nWhat should you do?","choices":["Build a WorkflowBuilder workflow in which an executor before the booking agent calls ctx.request_info() and handles the answer in a @response_handler method","Decorate the passenger lookup tool with @tool(approval_mode=\"always_require\")","Rebuild the workflow as a handoff workflow with autonomous mode enabled","Increase max_iterations in the function_invocation_configuration of the chat client"],"answer":[0],"explanation":"Sequential orchestration supports tool approval, but does not pause for free-form user input between agents on its own. In a custom WorkflowBuilder workflow, an executor calls ctx.request_info() with a typed request, the workflow emits a request_info event, and the framework routes the response to the executor's @response_handler method, while the explicit order is preserved.","rationale":["Correct: a typed request at a fixed place in a custom workflow collects the missing data and preserves the executor order.","Incorrect: tool approval only allows approving or rejecting a tool call, not collecting missing data.","Incorrect: autonomous mode lets agents continue without waiting for the user.","Incorrect: more function invocation iterations do not solve the lack of user input."],"ref":"https://learn.microsoft.com/agent-framework/workflows/human-in-the-loop?pivots=programming-language-python"},{"id":"2.4.3-01","obj":"2.4.3","difficulty":"easy","type":"single","stem":"Fourth Coffee runs five agents on Azure OpenAI in Microsoft Foundry Models. Every request from an agent starts with the same 3,000-token block of instructions and tool definitions, followed by a unique user question. You need to reduce input token cost and latency without changing the model output.\n\nWhat should you do?","choices":["Keep the static instructions and tool definitions first and the user question last","Place the user question first so that the model reads it before the instructions","Add an llm-semantic-cache-lookup policy in Azure API Management in front of the deployment","Move the agent traffic to a Global Batch deployment that processes the requests"],"answer":[0],"explanation":"Prompt caching reuses the processing of an identical prefix of at least 1,024 tokens and has no effect on the output, only on latency and cost. Static content at the front and dynamic content at the end maximizes cache hits.","rationale":["Correct: a stable prefix with variable content at the end yields prompt cache hits without changing the output.","Incorrect: variable content at the front causes a cache miss because the first tokens differ per request.","Incorrect: semantic caching returns stored answers; with unique questions that helps little and it changes the output.","Incorrect: Global Batch is asynchronous with a turnaround time of up to 24 hours and does not fit interactive agents."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/prompt-caching"},{"id":"2.4.3-02","obj":"2.4.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. exposes a Foundry chat model to an FAQ agent through Azure API Management. Users ask the same questions with different wording, for example \"How do I reset my badge?\" and \"What are the steps to reset a badge?\". You need to return a stored response for prompts that are similar in meaning.\n\nWhich policy should you add to the inbound section?","choices":["llm-semantic-cache-lookup","cache-lookup-value","llm-token-limit","rate-limit-by-key"],"answer":[0],"explanation":"With semantic caching in API Management, you return cached answers for identical prompts and also for prompts that are similar in meaning. The llm-semantic-cache-lookup policy in the inbound section performs the lookup based on embeddings.","rationale":["Correct: this policy searches by semantic similarity through an embeddings backend.","Incorrect: cache-lookup-value retrieves a specific value through a key of your choice, without semantic comparison.","Incorrect: llm-token-limit limits token usage per key and does not cache answers.","Incorrect: rate limiting limits the number of calls but does not cache answers."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-03","obj":"2.4.3","difficulty":"easy","type":"single","stem":"Graphic Design Institute has several agents that call a product catalog tool through Azure API Management. The tool is an HTTP GET operation that returns the complete catalog, which changes once per day. Agents send identical requests many times per hour.\n\nWhich caching policies should you configure?","choices":["cache-lookup in the inbound section and cache-store in the outbound section","llm-semantic-cache-lookup in the inbound section and llm-semantic-cache-store in the outbound section","cache-store-value in the inbound section and cache-lookup-value in the outbound section","cache-store in the inbound section and cache-lookup in the outbound section"],"answer":[0],"explanation":"Response caching with the cache-lookup and cache-store pair returns a complete API response for an identical GET request without a backend call. Lookup belongs in inbound and store in outbound.","rationale":["Correct: identical GET requests with a complete, slowly changing response fit response caching exactly.","Incorrect: the semantic cache policies are intended for LLM requests, not for a REST tool with identical GET calls.","Incorrect: value caching is for individual values with their own keys, and lookup belongs in inbound, not in outbound.","Incorrect: the sections are swapped; lookup must be in inbound and store in outbound."],"ref":"https://learn.microsoft.com/azure/api-management/caching-overview"},{"id":"2.4.3-04","obj":"2.4.3","difficulty":"medium","type":"single","stem":"Humongous Insurance enables prompt caching for an agent that uses an Azure OpenAI deployment. Each prompt is longer than 4,000 tokens, but cached_tokens in prompt_tokens_details is 0 for every request. The system message starts with the current timestamp and the user ID, followed by a long, static policy document.\n\nWhat should you do?","choices":["Move the timestamp and user ID to the end of the prompt","Set prompt_cache_retention to 24h on each request","Shorten the static policy document to fewer than 1,024 tokens","Move the deployment to a provisioned throughput deployment type"],"answer":[0],"explanation":"For a cache hit, the first 1,024 tokens must be identical; a difference of a single character causes a cache miss with cached_tokens 0. Dynamic values such as timestamp and user ID belong at the end.","rationale":["Correct: with the dynamic values at the end, the static policy becomes the reusable prefix.","Incorrect: longer retention does not help if the prefix differs on every request.","Incorrect: prompts under 1,024 tokens are not eligible for prompt caching at all.","Incorrect: the deployment type does not change the varying prefix that causes the cache miss."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/prompt-caching"},{"id":"2.4.3-05","obj":"2.4.3","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. hosts a multi-tenant support agent. Each tenant calls the LLM API through Azure API Management by using its own subscription. You enable semantic caching, and a tenant reports receiving an answer that was generated for another tenant.\n\nWhat should you do?","choices":["Add a vary-by element that uses the subscription ID to the lookup policy","Lower the score-threshold value of the llm-semantic-cache-lookup policy","Set ignore-system-messages to true on the llm-semantic-cache-lookup policy","Increase the duration value of the llm-semantic-cache-store policy"],"answer":[0],"explanation":"With vary-by you partition the semantic cache, for example per subscription ID, so cache entries are not shared between tenants. A different threshold value or TTL does not solve the leaking between tenants.","rationale":["Correct: vary-by on the subscription separates the cache per tenant.","Incorrect: a lower threshold requires more similarity but can still return an answer from another tenant.","Incorrect: ignoring system messages actually makes the match broader and does not separate tenants.","Incorrect: a longer TTL keeps entries longer and increases the problem."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-06","obj":"2.4.3","difficulty":"medium","type":"single","stem":"Wingtip Toys uses semantic caching in Azure API Management for a product advice agent. Users report that the agent sometimes returns answers to questions that are related to, but different from, the question they asked. You need cached responses to be returned only when prompts are very close in meaning.\n\nWhat should you do?","choices":["Decrease the score-threshold value of the llm-semantic-cache-lookup policy","Increase the score-threshold value of the llm-semantic-cache-lookup policy","Increase the duration value of the llm-semantic-cache-store policy","Increase the max-message-count value of the llm-semantic-cache-lookup policy"],"answer":[0],"explanation":"The score-threshold attribute determines how close a prompt must be to a cached prompt. A lower threshold means prompts must be semantically more similar to get a cached answer.","rationale":["Correct: a lower score-threshold requires higher semantic similarity.","Incorrect: a higher threshold actually lets fewer similar prompts match and worsens the problem.","Incorrect: the TTL determines how long entries are kept, not how strictly matching is done.","Incorrect: including more messages changes the comparison basis but does not make the match stricter."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-07","obj":"2.4.3","difficulty":"hard","type":"single","stem":"Consolidated Messenger configures semantic caching for an LLM API in Azure API Management. If the cache is unavailable, the backend model deployment must be protected from overload. Successful responses must be stored for 60 seconds.\n\n```xml\n<policies>\n  <inbound>\n    <llm-semantic-cache-lookup score-threshold=\"0.15\" embeddings-backend-id=\"embeddings-backend\" embeddings-backend-auth=\"system-assigned\">\n      <vary-by>@(context.Subscription.Id)<\/vary-by>\n    <\/llm-semantic-cache-lookup>\n    <!-- Slot 1 -->\n  <\/inbound>\n  <outbound>\n    <!-- Slot 2 -->\n  <\/outbound>\n<\/policies>\n```\n\nWhich elements should you insert at Slot 1 and Slot 2?","choices":["Slot 1: <rate-limit calls=\"10\" renewal-period=\"60\" /> Slot 2: <llm-semantic-cache-store duration=\"60\" />","Slot 1: <llm-semantic-cache-store duration=\"60\" /> Slot 2: <rate-limit calls=\"10\" renewal-period=\"60\" />","Slot 1: <rate-limit calls=\"10\" renewal-period=\"60\" /> Slot 2: <cache-store duration=\"60\" />","Slot 1: <cache-lookup vary-by-developer=\"false\" vary-by-developer-groups=\"false\" /> Slot 2: <llm-semantic-cache-store duration=\"60\" />"],"answer":[0],"explanation":"After the cache lookup you place a rate-limit policy so the backend is protected if the cache is unavailable. The llm-semantic-cache-store policy belongs in the outbound section and stores the answer with the specified duration.","rationale":["Correct: rate limiting directly after the lookup and semantic cache store in outbound meet both requirements.","Incorrect: the store policy belongs in outbound, where the response is available; rate limiting belongs in inbound.","Incorrect: cache-store goes with cache-lookup for GET requests and is not the counterpart of the semantic lookup.","Incorrect: an extra cache-lookup does not protect the backend and is not needed alongside the semantic lookup."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-08","obj":"2.4.3","difficulty":"hard","type":"multi","stem":"Datum Corporation plans to enable semantic caching for a Foundry chat model API that is imported into Azure API Management. Azure API Management already authenticates to the model by using a managed identity. The company has an existing Azure Managed Redis instance that was created without any modules.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Create a new Azure Managed Redis instance with the RediSearch module enabled and configure it as an external cache in Azure API Management","Create a backend in Azure API Management for an embeddings model deployment","Add llm-semantic-cache-lookup to the inbound section and llm-semantic-cache-store to the outbound section","Add the RediSearch module to the existing Azure Managed Redis instance","Add cache-lookup to the inbound section and cache-store to the outbound section of the chat completion operation"],"answer":[0,1,2],"explanation":"Semantic caching requires an embeddings deployment as a backend, an Azure Managed Redis with RediSearch configured as an external cache, and the llm-semantic-cache-lookup/store pair. RediSearch can only be enabled when creating a new cache.","rationale":["Correct: RediSearch is required and can only be enabled on a new cache; that cache must be attached as an external cache.","Correct: the lookup policy refers through embeddings-backend-id to a backend for the embeddings API.","Correct: lookup in inbound and store in outbound together form the semantic cache.","Incorrect: a module cannot be added to an existing Azure Managed Redis cache.","Incorrect: cache-lookup and cache-store only work for identical GET requests and not semantically for chat completions."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-09","obj":"2.4.3","difficulty":"hard","type":"single","stem":"Woodgrove Bank builds an advisory agent whose answers must reflect the current account data of each customer. The agent sends a long, static compliance preamble with every request. The finance team wants to reduce model cost, but the risk team prohibits any cache that might return a response that was generated for a different request.\n\nWhich caching strategy should you implement?","choices":["Prompt caching with the static compliance preamble at the start of each prompt","Semantic caching in Azure API Management with vary-by set to the subscription ID","Response caching in Azure API Management by using cache-lookup and cache-store","Semantic caching in Azure API Management with a very low score-threshold value"],"answer":[0],"explanation":"Prompt caching only reuses the processing of identical input tokens and has no effect on the generated output. Semantic caching returns stored answers based on similarity and can yield incorrect or outdated answers, which violates the risk requirement.","rationale":["Correct: prompt caching lowers cost for the static prefix while every answer is generated fresh.","Incorrect: even when partitioned per subscription, semantic caching returns stored answers from other requests.","Incorrect: response caching also returns a previously stored response instead of a new answer.","Incorrect: a stricter threshold reduces the risk but still returns answers from earlier requests."],"ref":"https://learn.microsoft.com/azure/api-management/llm-semantic-cache-store-policy"},{"id":"2.4.4-01","obj":"2.4.4","difficulty":"easy","type":"single","stem":"Relecloud runs a nightly job in which a summarization agent processes 200,000 documents. Results are needed by the next business day. The job must cost as little as possible and must not consume the quota of the online agent deployments.\n\nWhich deployment type should you use for the summarization model?","choices":["Global Batch","Global Standard","Global Provisioned","Data Zone Standard"],"answer":[0],"explanation":"Global Batch processes asynchronous groups of requests with its own enqueued token quota, a target turnaround time of 24 hours, and 50% lower cost than Global Standard. Online workloads are therefore not disrupted.","rationale":["Correct: separate quota, lower cost, and a turnaround time within 24 hours fit a nightly bulk job.","Incorrect: Global Standard is real-time, more expensive, and uses the same quota as online workloads.","Incorrect: provisioned capacity is intended for predictable, high real-time throughput and is not the cheapest option.","Incorrect: Data Zone Standard is a real-time deployment type without a batch discount."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/batch"},{"id":"2.4.4-02","obj":"2.4.4","difficulty":"easy","type":"single","stem":"Southridge Video uses a Magentic orchestration in Microsoft Agent Framework. The manager agent sometimes keeps invoking participant agents for a long time. You need to cap the total number of coordination rounds, regardless of whether the team is making progress.\n\nWhich setting should you configure?","choices":["max_round_count","max_stall_count","max_reset_count","intermediate_output_from"],"answer":[0],"explanation":"The Magentic builder offers inner-loop limits: maximum number of coordination rounds, maximum number of consecutive stalls before replanning, and maximum number of plan resets. max_round_count limits the total number of rounds.","rationale":["Correct: max_round_count sets a hard upper limit on the number of coordination rounds.","Incorrect: max_stall_count only counts consecutive rounds without progress and then triggers a replan.","Incorrect: max_reset_count limits the number of replans, not the number of rounds.","Incorrect: intermediate_output_from determines which participants show intermediate output."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/magentic"},{"id":"2.4.4-03","obj":"2.4.4","difficulty":"easy","type":"single","stem":"Northwind Traders builds an inventory agent by using Microsoft Agent Framework in Python. The model often returns several tool calls in one assistant message. The tools update the same in-memory reservation object, and concurrent execution corrupts the object. The tools must still run in the order that the model requested.\n\nWhat should you do?","choices":["Set allow_concurrent_invocation to False in the function invocation configuration","Set max_iterations to 1 in the function invocation configuration","Set max_function_calls to 1 in the function invocation configuration","Set include_detailed_errors to True in the function invocation configuration"],"answer":[0],"explanation":"Function calls from a single assistant message are executed concurrently by default. With allow_concurrent_invocation set to False, they run in the order of the model, which is needed when tools have shared mutable state.","rationale":["Correct: this disables parallel execution and preserves the order of the model.","Incorrect: max_iterations set to 1 limits the number of model round trips and prevents the agent from reasoning further after tool results.","Incorrect: max_function_calls set to 1 limits the total number of calls, while multiple calls are needed.","Incorrect: detailed error messages do not change anything about concurrent execution."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools"},{"id":"2.4.4-04","obj":"2.4.4","difficulty":"medium","type":"single","stem":"Tailspin Toys deploys an Agent Framework workflow as a Foundry hosted agent. During a promotion, the agent must serve about 500 concurrent sessions. An engineer plans to configure minimum and maximum replica counts and a warm pool. Costs must stay proportional to actual usage.\n\nWhat should you do?","choices":["Right-size the per-session CPU and memory of the agent version","Set the minimum replica count to 500 before the promotion starts","Configure a warm pool that is sized for 500 concurrent sessions","Increase the maximum replica count of the hosted agent deployment"],"answer":[0],"explanation":"Hosted agents scale per session: each session gets its own VM-isolated sandbox, and there are no replica counts or warm pools to configure. The CPU and memory settings apply per session, so overprovisioning multiplies the cost by the concurrency.","rationale":["Correct: sizing correctly per session based on Application Insights keeps cost in line with usage.","Incorrect: hosted agents have no replica count to configure.","Incorrect: there is no warm pool to size; sessions are created on demand.","Incorrect: explicit replica scaling has been replaced by automatic scaling per session."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agents"},{"id":"2.4.4-05","obj":"2.4.4","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. runs a concurrent orchestration that fans out each request to six analysis agents. All six agents call the same Global Standard model deployment, and the deployment returns HTTP 429 errors during peak hours. Results must still be produced in parallel to meet the latency target.\n\nWhat should you do?","choices":["Assign the agents to separate model deployments with their own quota","Convert the concurrent orchestration to a sequential orchestration","Increase the max_iterations value of the chat client of each agent","Move the six analysis agents to a single Global Batch deployment"],"answer":[0],"explanation":"A shared model endpoint can become a single point of failure and a rate limit when agents run in parallel. Isolation, such as separate deployments with their own quotas, preserves parallel execution without throttling.","rationale":["Correct: separate deployments spread the load over multiple quotas and preserve parallelism.","Incorrect: running sequentially reduces throttling but violates the latency requirement.","Incorrect: more iterations per agent actually increases the number of model calls.","Incorrect: Global Batch has no real-time SLA and does not fit a latency target."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.4-06","obj":"2.4.4","difficulty":"medium","type":"single","stem":"Coho Winery uses a Magentic orchestration for supply chain planning. When the team makes no progress for two consecutive rounds, the manager must automatically replan. The workflow must replan at most once before it stops.\n\nWhich configuration should you use?","choices":["max_stall_count=2 and max_reset_count=1","max_round_count=2 and max_reset_count=1","max_stall_count=1 and max_reset_count=2","max_round_count=2 and max_stall_count=1"],"answer":[0],"explanation":"Consecutive rounds without progress increase a stall counter; when max_stall_count is exceeded, an automatic reset and replan follow. max_reset_count limits the number of plan resets.","rationale":["Correct: two stalls trigger a replan and a reset limit of 1 allows at most one replan.","Incorrect: max_round_count limits the total number of rounds, not the consecutive stalls.","Incorrect: the values are swapped: replan after one stall and allow two resets.","Incorrect: this limits rounds and stalls, but not the number of replans."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/magentic"},{"id":"2.4.4-07","obj":"2.4.4","difficulty":"hard","type":"single","stem":"Alpine Ski House builds a Python handoff workflow with a triage agent, a rental agent, and a lessons agent. The triage agent must continue autonomously when the user does not respond, but for no more than three autonomous turns. The rental and lessons agents must return control to the user after each response.\n\n```python\nworkflow = (\n    HandoffBuilder(\n        name=\"ski_support\",\n        participants=[triage_agent, rental_agent, lessons_agent],\n    )\n    .with_start_agent(triage_agent)\n    .with_autonomous_mode(\n        agents=[triage_agent],\n        ____________________\n    )\n    .build()\n)\n```\n\nWhich argument should you add?","choices":["turn_limits={triage_agent.name: 3}","max_round_count=3","prompts={triage_agent.name: 3}","termination_condition=3"],"answer":[0],"explanation":"with_autonomous_mode accepts a list of agents and a turn limit per agent; without an explicit limit, the default is 50 autonomous turns. Agents that are not in the list return control after each response.","rationale":["Correct: turn_limits per agent name limits the autonomous turns of the triage agent to three.","Incorrect: max_round_count is a setting of the Magentic builder, not of autonomous mode.","Incorrect: prompts defines the follow-up prompt per agent, not a number of turns.","Incorrect: termination_condition is a function over the conversation and belongs on the HandoffBuilder, not as a number in autonomous mode."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.4-08","obj":"2.4.4","difficulty":"hard","type":"multi","stem":"Trey Research submits very large Azure OpenAI batch jobs for an agent evaluation pipeline. The jobs fail to start because they reach the enqueued token limit, even though the deployment quota is already at its maximum. Online agent traffic must not be affected, and the pipeline must remain as cheap as possible.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Split the input into multiple smaller batch jobs","Queue the batch jobs by using automatic retries with exponential backoff so that the next job starts when enqueued token quota becomes available","Send the requests one at a time to the online Global Standard deployment","Cancel running jobs and resubmit all requests as a single larger file","Enable prompt caching on the batch deployment"],"answer":[0,1],"explanation":"Batch requests have a separate enqueued token quota. When that limit is reached, you can queue multiple batch jobs with exponential backoff in supported regions, so the next job starts automatically as soon as quota becomes available.","rationale":["Correct: smaller jobs fit within the enqueued token quota and can be processed one after another.","Correct: automatic retries with exponential backoff start the next job as soon as quota is available.","Incorrect: submitting online disrupts the online workloads and costs more than batch.","Incorrect: a larger single file exceeds the enqueued limit even more.","Incorrect: prompt caching lowers cost per token but does not solve the enqueued token limit."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/batch"},{"id":"2.4.4-09","obj":"2.4.4","difficulty":"hard","type":"single","stem":"Contoso, Ltd. runs a concurrent orchestration in which four agents evaluate a loan application in parallel. Each agent writes its findings directly to the same Azure Cosmos DB document. Reviewers find that the document sometimes contains inconsistent or overwritten findings. The agents must keep running in parallel.\n\nWhat should you do?","choices":["Have each agent return its findings to an aggregator that performs a single write after fan-in","Set allow_concurrent_invocation to False for each agent","Convert the orchestration to a group chat so that the agents can discuss their updates","Add retry logic to each agent for failed writes"],"answer":[0],"explanation":"Shared mutable state between concurrent agents is a known antipattern that yields transactionally inconsistent data. Let the agents return results independently and let an aggregator perform a single, consistent write after the fan-in.","rationale":["Correct: aggregation after fan-in removes simultaneous writes to the same state and preserves parallelism.","Incorrect: this setting controls tool calls within an agent, not simultaneous writes by different agents.","Incorrect: group chat is intended for discussion in a shared thread and does not solve the write conflict.","Incorrect: retries do not make overwrites consistent; the conflict between simultaneous writes remains."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.5-01","obj":"2.4.5","difficulty":"easy","type":"single","stem":"Northwind Traders enables incoming A2A on a Foundry prompt agent named Agent1. A partner service will call Agent1 through its A2A base path. The partner team asks which credential its client must present on each request, including the request for the agent card.\n\nWhich credential should the partner client present?","choices":["a Microsoft Entra ID token for https://ai.azure.com","an API key that is sent in the x-api-key header","no credential, because the agent card is public","a personal access token in the Authorization header"],"answer":[0],"explanation":"Incoming A2A on a Foundry agent requires Microsoft Entra ID authentication on all A2A URLs, including the agent card. Key-based authentication and anonymous access are not supported; the caller requests a token for the scope https://ai.azure.com/.default.","rationale":["Correct: all A2A URLs of a Foundry agent require a Microsoft Entra token for https://ai.azure.com.","Incorrect: key-based authentication is not supported for incoming A2A.","Incorrect: anonymous access to the agent card of a Foundry agent is not supported.","Incorrect: a personal access token is key-based and is not accepted by the incoming A2A endpoint."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/enable-agent-to-agent-endpoint"},{"id":"2.4.5-02","obj":"2.4.5","difficulty":"easy","type":"single","stem":"Alpine Ski House connects a Foundry agent to a partner A2A endpoint. Each user must sign in with the user's own account, so the team selects OAuth identity passthrough for the connection. The endpoint publisher already provides a managed OAuth option in the Foundry tool catalog. The team wants the simplest setup and does not want to maintain its own OAuth app registration.\n\nWhich OAuth option should the team configure?","choices":["managed OAuth","custom OAuth with a Microsoft Entra app registration","custom OAuth with an app in a third-party identity provider","key-based authentication with a shared token"],"answer":[0],"explanation":"With managed OAuth, Microsoft or the publisher of the A2A endpoint manages the OAuth app registration. Microsoft recommends this option when it is available, because the setup is simpler and produces fewer configuration errors.","rationale":["Correct: managed OAuth requires no app registration of your own and is the recommended option when available.","Incorrect: custom OAuth requires you to manage an app registration, client ID, URLs, and redirect URL yourself.","Incorrect: custom OAuth with an external identity provider also means managing your own OAuth app.","Incorrect: a shared token does not preserve the identity of the individual user."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"2.4.5-03","obj":"2.4.5","difficulty":"easy","type":"single","stem":"Lucerne Publishing has an existing Microsoft Agent Framework agent in Python that summarizes manuscripts. Developers want to call the agent as a tool from GitHub Copilot in Visual Studio Code and from other MCP-compatible agent hosts.\n\nWhat should you do?","choices":["Call as_mcp_server() on the agent and run the server over an MCP transport","Wrap the agent in an A2AAgent instance","Add an MCPStreamableHTTPTool instance to the agent","Register the agent in Foundry Control Plane by using the A2A protocol"],"answer":[0],"explanation":"With .as_mcp_server() you expose an Agent Framework agent as an MCP server; the name and description of the agent become the server metadata. MCP clients can then call the agent as a tool.","rationale":["Correct: as_mcp_server makes the agent usable as a tool for any MCP client.","Incorrect: A2AAgent is a client wrapper for calling a remote A2A agent, not for exposing an agent.","Incorrect: MCPStreamableHTTPTool lets the agent itself consume an MCP server; it does not expose the agent.","Incorrect: registering as an A2A agent makes the agent reachable for A2A clients, not for MCP clients."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/local-mcp-tools"},{"id":"2.4.5-04","obj":"2.4.5","difficulty":"medium","type":"single","stem":"Contoso, Ltd. adds a Foundry Agent Service A2A tool that uses key-based authentication to call a supplier agent endpoint. Tool calls fail with the message \"Failed to fetch agent card\" and HTTP 401. The supplier confirms that the agent card path requires the same API key as the tool calls.\n\nWhat should you do?","choices":["Set send_credentials_for_agent_card to true in the A2A tool definition","Regenerate the API key and update the project connection","Assign roles to the agent identity on the supplier service","Change the credential name of the project connection to x-api-key"],"answer":[0],"explanation":"The chosen authentication applies by default only to tool calls; the agent card is retrieved anonymously. If the endpoint protects the agent card, you set send_credentials_for_agent_card to true so the connection credentials are also sent with that request.","rationale":["Correct: this way the credentials are also used to retrieve the protected agent card.","Incorrect: the key is valid; the problem is that it is not sent with the agent card request.","Incorrect: the connection uses key-based authentication, so roles on an agent identity have no effect.","Incorrect: a different header name does not fix the fact that the agent card request is sent without credentials."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"2.4.5-05","obj":"2.4.5","difficulty":"medium","type":"single","stem":"Woodgrove Bank runs several Foundry agents in one project. All agents were created by using the new agent object model. One agent must call an A2A endpoint whose underlying service is Azure Cosmos DB, which supports Microsoft Entra ID. The solution must avoid managing secrets, and access must be granted to this agent without granting the same access to the other agents in the project.\n\nWhich authentication method should you use?","choices":["Microsoft Entra ID agent identity with role assignments on Azure Cosmos DB","Microsoft Entra ID project managed identity with role assignments on Azure Cosmos DB","Key-based authentication that stores a Cosmos DB key in a project connection","Unauthenticated access combined with a private endpoint"],"answer":[0],"explanation":"In the new agent object model, each agent gets its own unique agent identity (Microsoft Entra ID) when it is created, so you can assign roles per agent. With Microsoft Entra authentication and roles on the underlying service, you do not need to manage secrets.","rationale":["Correct: the agent's own identity is the only one that gets the required Cosmos DB roles, without secrets.","Incorrect: the project managed identity is shared by all agents in the project, which violates the isolation requirement.","Incorrect: key-based authentication requires secret management and anyone with project access can read the secret.","Incorrect: without authentication there is no identity-based access control per agent."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"2.4.5-06","obj":"2.4.5","difficulty":"medium","type":"single","stem":"Best For You Organics Company wants Agent1, a Foundry agent in Project1, to call Agent2, a Foundry agent in Project2, by using the A2A protocol.\n\nYou need to configure the integration.\n\nWhich sequence of actions should you perform?","choices":["Enable incoming A2A on Agent2 -> Create an A2A project connection whose target is the A2A base path of Agent2 with the audience https://ai.azure.com -> Add an a2a tool that references the connection to Agent1 -> Test the delegation from Agent1","Add an a2a tool to Agent1 -> Enable incoming A2A on Agent2 -> Create an A2A project connection whose target is the agent card path of Agent2 -> Test the delegation from Agent1","Create an A2A project connection whose target is the A2A base path of Agent2 -> Add an a2a tool that references the connection to Agent1 -> Test the delegation from Agent1 -> Enable incoming A2A on Agent2","Enable incoming A2A on Agent1 -> Create an A2A project connection whose target is the A2A base path of Agent1 -> Add an a2a tool that references the connection to Agent2 -> Test the delegation from Agent2"],"answer":[0],"explanation":"The target agent must have incoming A2A enabled. Then you create a project connection with the A2A base path of the target agent as target and audience https://ai.azure.com, without an agent card path; Foundry determines that path itself. Only then do you add the a2a tool to the calling agent and test.","rationale":["Correct: enable the target, create the connection, attach the tool, and test follows the dependencies.","Incorrect: the tool needs an existing connection, and for a Foundry target you do not set an agent card path.","Incorrect: testing before incoming A2A is enabled on the target fails.","Incorrect: the direction is reversed; incoming A2A must be on the agent being called, Agent2."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/agent-to-agent"},{"id":"2.4.5-07","obj":"2.4.5","difficulty":"hard","type":"multi","stem":"Litware, Inc. connects a Foundry agent to a third-party A2A endpoint that accepts only a static API key. All users of the agent share the same level of access. The security team requires that exposure of the shared secret is minimized.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Store the API key in a project connection and restrict who can access the project","Request a least-privilege key from the endpoint publisher and rotate it before it expires","Set send_credentials_for_agent_card to true so that every request carries the key","Pass the API key to the agent at run time in the user message","Store each user's personal access token in the shared project connection"],"answer":[0,1],"explanation":"For key-based authentication, you store shared credentials in a project connection, and because anyone with project access can see those secrets, you restrict project access. In addition, use least-privilege credentials and rotate tokens regularly.","rationale":["Correct: a project connection prevents passing credentials at runtime and restricted project access reduces exposure.","Correct: least privilege and regular rotation limit the impact of a leaked key.","Incorrect: sending credentials for the agent card without need actually increases the exposure of the secret.","Incorrect: a key in a user message ends up in the conversation and logs.","Incorrect: personal tokens do not belong in a shared connection; OAuth identity passthrough is intended for that."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"2.4.5-08","obj":"2.4.5","difficulty":"hard","type":"single","stem":"Graphic Design Institute has a Foundry prompt agent named ReviewAgent that has incoming A2A enabled. An existing partner agent that is built with the open-source A2A SDK calls ReviewAgent by using A2A v1.0 over JSONRPC. Integration tests show the following behavior:\n\n- Requests that contain only text parts succeed.\n- Requests that attach design files as file parts fail.\n- The partner client is configured to receive server-sent events and never receives incremental updates.\n\nYou need to make the integration work without changing how ReviewAgent is hosted.\n\nWhat should you do?","choices":["Send the design content as text and configure the partner client for non-streaming requests.","Switch the partner client to A2A v0.3 with the HTTP+JSON transport to support file parts.","Switch the partner client to the gRPC transport to support streaming and binary parts.","Assign the partner identity the Foundry User role instead of the Foundry Agent Consumer role."],"answer":[0],"explanation":"Incoming A2A on a Foundry agent only supports the text modality and no streaming responses (server-sent events). The partner must therefore send text and use a non-streaming client. The text requests already succeed, so authentication and authorization are not the problem.","rationale":["Correct: only text is supported and streaming responses are not, so text content and non-streaming solve both errors.","Incorrect: even with v0.3, file data and streaming remain unsupported, and v0.3 is in preview.","Incorrect: gRPC is not supported by the incoming A2A endpoint of Foundry for any version.","Incorrect: text requests already succeed, so the role is sufficient; a broader role violates least privilege and does not solve the modality problem."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/enable-agent-to-agent-endpoint"},{"id":"2.4.5-09","obj":"2.4.5","difficulty":"hard","type":"single","stem":"Humongous Insurance builds an orchestrator agent that must select, invoke, filter, and weigh the results of internal claims capabilities, and then synthesize the final answer itself. The capabilities are owned by the same engineering team as the orchestrator. The architects prefer control over the reasoning to flexibility, and they require authenticated access to the underlying tools and data.\n\nWhich integration approach should you use?","choices":["Expose the claims capabilities through MCP servers that the orchestrator calls as tools","Expose each claims capability as an A2A agent that uses its own orchestration","Register each claims capability in Foundry Control Plane as a custom A2A agent","Connect the claims capabilities as handoff targets that take ownership of the conversation"],"answer":[0],"explanation":"MCP gives a single orchestrator strong control to select, call, filter, and reason about tools and compose the outcome, and provides authenticated access to tools and data. A2A fits better when agents must be opaque to each other, such as with other organizations.","rationale":["Correct: MCP keeps the reasoning and synthesis with the orchestrator for capabilities of the same team.","Incorrect: A2A agents use their own orchestration, so the orchestrator loses control over the reasoning.","Incorrect: registering as a custom A2A agent provides governance, but the capabilities remain opaque agents with their own reasoning.","Incorrect: with handoff the receiver takes over ownership, while the orchestrator must synthesize itself."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-patterns"},{"id":"2.4.6-01","obj":"2.4.6","difficulty":"easy","type":"single","stem":"Adventure Works Cycles automates warranty processing. The process has well-defined steps, and several agents and deterministic functions must coordinate in an explicit order that the developers control.\n\nWhich Microsoft Agent Framework component should you use?","choices":["A workflow","A single agent with function tools","Agent middleware","A context provider"],"answer":[0],"explanation":"Agent Framework recommends a workflow when the process has well-defined steps, you need explicit control over the execution order, and multiple agents or functions must work together. An agent fits open-ended, conversational tasks with autonomous planning.","rationale":["Correct: a workflow gives explicit, inspectable execution paths between agents and functions.","Incorrect: a single agent plans autonomously and gives no explicit control over the order.","Incorrect: middleware intercepts agent runs for cross-cutting concerns but does not orchestrate steps.","Incorrect: a context provider supplies context to an agent and does not coordinate multiple agents."],"ref":"https://learn.microsoft.com/agent-framework/overview/"},{"id":"2.4.6-02","obj":"2.4.6","difficulty":"easy","type":"single","stem":"Trey Research has production multi-agent solutions built with Semantic Kernel and AutoGen. The company wants to standardize on the framework that the same Microsoft teams created as the direct successor to both, including graph-based workflows.\n\nWhich framework should you choose?","choices":["Microsoft Agent Framework","LangGraph","Microsoft 365 Agents SDK","LangChain"],"answer":[0],"explanation":"Agent Framework is the direct successor to Semantic Kernel and AutoGen, built by the same teams. It combines the simple agent abstractions of AutoGen with the enterprise features of Semantic Kernel and adds graph-based workflows.","rationale":["Correct: Agent Framework is the next generation of both Semantic Kernel and AutoGen.","Incorrect: LangGraph is an open-source graph framework from another party, not a successor to Semantic Kernel.","Incorrect: the Microsoft 365 Agents SDK focuses on channels and hosting and can use Agent Framework as an orchestrator.","Incorrect: LangChain is an open-source framework and not a successor to Semantic Kernel and AutoGen."],"ref":"https://learn.microsoft.com/agent-framework/overview/"},{"id":"2.4.6-03","obj":"2.4.6","difficulty":"easy","type":"single","stem":"Fourth Coffee configures its agents centrally in the Foundry portal. A developer is building a LangGraph application by using the langchain-azure-ai package and must use an existing Foundry agent named menu-agent as a node in the graph without redefining the agent in code.\n\nWhich AgentServiceFactory method should you use?","choices":["get_agent_node","create_prompt_agent","get_agents_id_from_graph","delete_agent"],"answer":[0],"explanation":"With get_agent_node, you retrieve an existing Foundry agent as a LangGraph-compatible node. This is recommended because the agent configuration then stays centrally in Foundry and your code focuses on orchestration.","rationale":["Correct: get_agent_node references an existing agent as a node by name and version.","Incorrect: create_prompt_agent creates a new agent in code, while the agent already exists centrally.","Incorrect: this method reads the name and version from a compiled graph and does not create a node.","Incorrect: delete_agent deletes an agent."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/langchain-agents"},{"id":"2.4.6-04","obj":"2.4.6","difficulty":"medium","type":"single","stem":"Alpine Ski House builds a LangGraph StateGraph with a local router_node and an expert_node that runs a Foundry agent. The function route_decision returns either \"expert_node\" or END based on the last message. The graph must call expert_node only when the router decides to delegate.\n\n```python\nworkflow = StateGraph(RouterState)\nworkflow.add_node(\"router_node\", router_node)\nworkflow.add_node(\"expert_node\", echo_node)\nworkflow.add_edge(START, \"router_node\")\n# missing line\nworkflow.add_edge(\"expert_node\", END)\napp = workflow.compile()\n```\n\nWhich line should you add?","choices":["workflow.add_conditional_edges(\"router_node\", route_decision)","workflow.add_edge(\"router_node\", \"expert_node\")","workflow.add_node(\"route_decision\", route_decision)","workflow.add_edge(\"router_node\", END)"],"answer":[0],"explanation":"In LangGraph, you route dynamically with add_conditional_edges: the routing function determines, based on the state, which node follows. A regular edge always follows the same path.","rationale":["Correct: conditional edges let route_decision choose between expert_node and END.","Incorrect: a fixed edge calls expert_node on every request, even if the router handles it itself.","Incorrect: the routing function is not a node; this way nothing is routed conditionally.","Incorrect: a fixed edge to END never delegates to the expert."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/langchain-agents"},{"id":"2.4.6-05","obj":"2.4.6","difficulty":"medium","type":"single","stem":"Relecloud creates a LangGraph agent by using AgentServiceFactory.create_prompt_agent with an MCPTool whose require_approval is set to always and a MemorySaver checkpointer. The first invoke call uses config = {\"configurable\": {\"thread_id\": \"session-7\"}} and returns an interrupt for an MCP approval request. The reviewer approves the call.\n\nWhat should you do to resume the run?","choices":["Invoke the agent with Command(resume={\"approve\": True}) and the same config","Invoke the agent with a new HumanMessage that contains the text approve and no config","Invoke the agent with Command(resume={\"approve\": True}) and a new thread_id","Send a new request that sets previous_response_id to the interrupt ID"],"answer":[0],"explanation":"create_prompt_agent adds an approval node following the LangGraph pattern. After the interrupt, you resume with a Command(resume=...) in the same thread, so the checkpointer can find the paused state.","rationale":["Correct: Command resume with the same thread_id resumes the paused graph with the approval.","Incorrect: a new message without config starts a new run and does not answer the interrupt.","Incorrect: a new thread_id refers to a different checkpoint thread without the pending interrupt.","Incorrect: previous_response_id belongs to the Responses API, not to resuming a LangGraph interrupt."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/langchain-agents"},{"id":"2.4.6-06","obj":"2.4.6","difficulty":"medium","type":"single","stem":"Graphic Design Institute builds a long-running Agent Framework workflow in which an AgentExecutor wraps a FoundryAgent that uses server-side sessions. After restoring a checkpoint, the agent behaves as though its conversation state changed since the checkpoint was taken. The workflow must resume reliably from checkpoints.\n\nWhat should you do?","choices":["Implement a custom executor that manages the agent state","Share a single session between all AgentExecutor instances","Increase the frequency at which checkpoints are created","Switch the checkpoint storage to FileCheckpointStorage"],"answer":[0],"explanation":"An AgentExecutor serializes the message cache, conversation history, and session state, but server-side session state, such as with FoundryAgent, is not captured in checkpoints and can be changed by later runs. For reliable checkpointing, a custom executor is recommended.","rationale":["Correct: a custom executor can manage the state itself so recovery becomes reliable.","Incorrect: a shared session does not change the fact that server-side state falls outside the checkpoint.","Incorrect: checkpointing more often still does not capture the server-side state.","Incorrect: the storage type of checkpoints does not solve the absence of server-side state."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/advanced/agent-executor"},{"id":"2.4.6-07","obj":"2.4.6","difficulty":"hard","type":"single","stem":"Wide World Importers uses the langchain-azure-ai package to compose a LangGraph solution with Foundry Agent Service. A developer adds the CodeInterpreterTool from langchain_azure_ai.agents.prebuilt.tools to a generic LangGraph tool node, and the graph fails when the model requests code execution. Data analysis must run in the Foundry sandbox.\n\nWhat should you do?","choices":["Pass the CodeInterpreterTool in the tools list of factory.create_prompt_agent","Wrap the CodeInterpreterTool in a local Python function and add it to the tool node","Retrieve the agent by using get_agent_node and add the CodeInterpreterTool to the tool node","Replace the CodeInterpreterTool with AzureAIDocumentIntelligenceTool"],"answer":[0],"explanation":"Built-in tools from langchain_azure_ai.agents.prebuilt.tools run server-side in Foundry Agent Service and only work with create_prompt_agent. They do not add a tool node; local tools run in a tool node where the agent code runs.","rationale":["Correct: via create_prompt_agent, the built-in tool is executed server-side in the service.","Incorrect: a local wrapper does not execute code in the Foundry sandbox.","Incorrect: an existing agent node still does not make the built-in tool usable in a generic tool node.","Incorrect: Document Intelligence analyzes documents and does not execute code."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/langchain-agents"},{"id":"2.4.6-08","obj":"2.4.6","difficulty":"hard","type":"multi","stem":"Northwind Traders migrates an AutoGen GraphFlow solution to Microsoft Agent Framework workflows. The new workflow must pause to wait for a credit officer decision, and it must continue from the same point after the host process restarts.\n\nWhich two workflow capabilities should you use? Each correct answer presents part of the solution.","choices":["Request and response handling","Checkpointing","Message broadcast to every executor","Per-edge activation_condition settings","A distributed runtime that spans several processes"],"answer":[0,1],"explanation":"Agent Framework workflows route typed messages along edges. With request/response, a workflow pauses for external input, and checkpointing saves the progress so you can resume.","rationale":["Correct: request/response lets the workflow wait for the decision of the credit officer.","Correct: checkpointing persists the progress and makes resuming after a restart possible.","Incorrect: broadcast is the GraphFlow model; workflows route data explicitly along edges.","Incorrect: activation_condition is a GraphFlow setting for join behavior and is not a pause or resume mechanism.","Incorrect: Agent Framework currently focuses on single-process composition; distributed execution is planned."],"ref":"https://learn.microsoft.com/agent-framework/migration-guide/from-autogen/"},{"id":"2.4.6-09","obj":"2.4.6","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company has a validated patient-consent process that consists of three executors. The process must be reused inside several larger Agent Framework workflows. Each reuse must keep isolated input and output and its own independent state, and messages must not be broadcast between the outer and inner levels.\n\nWhat should you do?","choices":["Compose the consent process as a sub-workflow that runs as an executor in each larger workflow","Copy the three executors into each larger workflow and connect them with edges","Run the consent process as a group chat participant in each larger workflow","Expose the consent process as an A2A agent and call it from each larger workflow"],"answer":[0],"explanation":"With nesting in Agent Framework, a nested workflow runs via a WorkflowExecutor with isolated input and output, without broadcasting between levels and with independent state per level. This makes reuse of a validated process easy.","rationale":["Correct: a sub-workflow as an executor provides isolation of input, output, and state.","Incorrect: copying loses the isolation and doubles the maintenance of a validated process.","Incorrect: group chat shares an accumulating thread and does not isolate the state.","Incorrect: A2A adds a network hop and an opaque agent while the process must be locally reusable."],"ref":"https://learn.microsoft.com/agent-framework/migration-guide/from-autogen/"},{"id":"2.4.7-01","obj":"2.4.7","difficulty":"easy","type":"single","stem":"Contoso, Ltd. adds a sentiment pre-check in front of its support agents so that angry customers are routed to an escalation agent. The team wants to use a pre-trained Hugging Face model without additional training, and inference must use a GPU with batching when one is available.\n\nWhich Hugging Face Transformers component should you use?","choices":["A Transformers pipeline for the sentiment analysis task","The Trainer class with TrainingArguments","The load_dataset function from the datasets library","DataCollatorWithPadding"],"answer":[0],"explanation":"Transformers pipelines contain best practices and default models per task, make it easy to use GPUs, and support batching for better throughput. For tasks such as sentiment analysis, pretrained models often work without extra training.","rationale":["Correct: a pipeline delivers inference directly with a pretrained model, including GPU usage and batching.","Incorrect: Trainer is for training or fine-tuning, which is not needed here.","Incorrect: load_dataset loads data and does not perform inference.","Incorrect: a data collator batches training input and is not an inference component."],"ref":"https://learn.microsoft.com/azure/databricks/machine-learning/train-model/huggingface/"},{"id":"2.4.7-02","obj":"2.4.7","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. wants a small intent classifier that decides which specialist agent receives each request. The team has labeled examples and will fine-tune an open-source base model by using Hugging Face Transformers.\n\nWhich class should you use to load the base model for this task?","choices":["AutoModelForSequenceClassification","AutoModelForTokenClassification","DataCollatorWithPadding","AutoModelForCausalLM"],"answer":[0],"explanation":"For text classification, you load a base model with AutoModelForSequenceClassification, specifying the number of classes and the label mappings. The other classes support training or tokenization but do not load a classification model.","rationale":["Correct: this Auto Model class loads a base model with a classification head for the intents.","Incorrect: token classification labels individual tokens, as in named entity recognition, not an entire request.","Incorrect: a data collator batches and pads input during training and does not load a model.","Incorrect: a causal language model generates text and has no classification head for intents."],"ref":"https://learn.microsoft.com/azure/databricks/machine-learning/train-model/huggingface/fine-tune-model"},{"id":"2.4.7-03","obj":"2.4.7","difficulty":"easy","type":"single","stem":"Relecloud wants a retrieval agent to use an open-source Sentence-Transformers embedding model from the Hugging Face collection in the Foundry model catalog. The model is available in the current Foundry project.\n\nWhich deployment option should you use?","choices":["Foundry Managed Compute","Global Batch","Global Provisioned","Data Zone Standard"],"answer":[0],"explanation":"Hugging Face models in the current Foundry experience use Foundry Managed Compute, which creates dedicated GPU compute and an endpoint for inference. The other options are deployment types for Foundry Models that are hosted by Microsoft.","rationale":["Correct: Hugging Face models are deployed in Foundry on managed compute with dedicated GPUs.","Incorrect: Global Batch is for asynchronous bulk processing of supported models, not for Hugging Face models.","Incorrect: provisioned throughput applies to supported Foundry Models, not to the Hugging Face collection.","Incorrect: Data Zone Standard is a pay-as-you-go type for supported Foundry Models."],"ref":"https://learn.microsoft.com/azure/foundry/foundry-models/how-to/hugging-face-models"},{"id":"2.4.7-04","obj":"2.4.7","difficulty":"medium","type":"single","stem":"Lucerne Publishing wants to deploy a permissively licensed Hugging Face chat model in the current Foundry experience for an editing agent. The model meets the Foundry support criteria and the project region supports it, but the model does not appear when the Available in my Project filter is enabled in the model catalog.\n\nWhat should you do first?","choices":["Request GPU quota for Foundry Managed Compute for a compatible accelerator type","Request a virtual machine core quota increase for the subscription","Assign the Foundry User role on the Foundry account to the developers","Change the deployment option filter of the model catalog to Global Batch"],"answer":[0],"explanation":"The Available in my Project filter only shows models for which your subscription has available GPU managed compute quota for at least one compatible accelerator type, and that are available in the region of the project. Because the region and support criteria are already correct, you first check and increase the Foundry Managed Compute quota.","rationale":["Correct: without Foundry Managed Compute GPU quota for a compatible accelerator type, the model does not appear in the filtered overview.","Incorrect: the quota for Foundry Managed Compute is separate from Azure VM quota and is requested through a different path.","Incorrect: the Foundry User role is needed to call the deployment, not to make the model appear in the catalog.","Incorrect: Hugging Face models in Foundry use managed compute, not the Global Batch deployment type."],"ref":"https://learn.microsoft.com/azure/foundry/foundry-models/how-to/hugging-face-models"},{"id":"2.4.7-05","obj":"2.4.7","difficulty":"medium","type":"single","stem":"Wingtip Toys tries to deploy a Hugging Face model from the Azure Machine Learning model catalog for a product description agent. The deployment fails with an error that states that loading the model requires executing the configuration file in the model repository and setting trust_remote_code=True.\n\nWhat should you do?","choices":["Select an alternative model that uses Safetensors weights and does not require remote code","Set trust_remote_code to True in an environment variable of the deployment","Select a larger instance_type for the deployment","Add the missing Python libraries to a custom environment"],"answer":[0],"explanation":"Models that need to execute code from the model repository with trust_remote_code are not supported for security reasons. Supported models have Safetensors weights and require no remote code.","rationale":["Correct: a model without remote code and with Safetensors weights meets the supported criteria.","Incorrect: remote code is not supported for security reasons, so this setting does not work.","Incorrect: a larger instance solves memory problems, not the restriction on remote code.","Incorrect: missing libraries produce a ModuleNotFoundError or ImportError, which is a different problem."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-deploy-models-from-huggingface?view=azureml-api-2"},{"id":"2.4.7-06","obj":"2.4.7","difficulty":"medium","type":"single","stem":"Trey Research fine-tunes a Hugging Face model on a single GPU to act as a domain classifier for its agents. Training fails with \"OutOfMemoryError: CUDA out of memory\". You need to resolve the error while keeping the same effective batch size.\n\nWhat should you do?","choices":["Lower per_device_train_batch_size and raise gradient_accumulation_steps","Increase per_device_train_batch_size in TrainingArguments","Set fp16 to False in TrainingArguments for full precision","Increase the learning_rate value in TrainingArguments"],"answer":[0],"explanation":"A smaller per-device batch size lowers GPU memory usage, and gradient_accumulation_steps increases the effective batch size again. This way you solve the out-of-memory error without strongly changing the training behavior.","rationale":["Correct: smaller batches with gradient accumulation lower memory usage at the same effective batch size.","Incorrect: a larger batch size increases memory usage.","Incorrect: lower precision with fp16 actually saves memory; turning it off increases usage.","Incorrect: the learning rate does not affect memory usage."],"ref":"https://learn.microsoft.com/azure/databricks/machine-learning/train-model/huggingface/fine-tune-model"},{"id":"2.4.7-07","obj":"2.4.7","difficulty":"hard","type":"multi","stem":"Tailspin Toys uses a Hugging Face Transformers classifier on Azure Databricks to label millions of support transcripts. The labels feed an agent analytics dashboard daily. The input data is read several times for different experiments, and the scoring must scale across the cluster at low cost.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Run a preprocessing job that writes the cleaned transcripts to a Delta Lake table before the inference job","Apply the model by using an iterator pandas UDF that loads the model once and scores batches of rows","Apply the model by using a row-at-a-time Python UDF","Deploy the model from the HuggingFace registry to an Azure Machine Learning batch endpoint","Load the model inside the UDF for every row"],"answer":[0,1],"explanation":"If you read the data more often, you spread the cost of ingestion and preparation by first running ETL to Delta Lake, and you can choose different hardware per job. Spark pandas UDFs scale batch inference; an iterator UDF loads the model once and processes batches.","rationale":["Correct: separate preprocessing to Delta spreads the cost and allows CPU for ETL and GPU for inference.","Correct: an iterator pandas UDF initializes the model once and processes vectorized batches across the cluster.","Incorrect: row-at-a-time Python UDFs are much slower than vectorized pandas UDFs.","Incorrect: models from the HuggingFace registry cannot be deployed to batch endpoints.","Incorrect: loading the model per row is extremely costly and slow."],"ref":"https://learn.microsoft.com/azure/databricks/machine-learning/train-model/dl-best-practices"},{"id":"2.4.7-08","obj":"2.4.7","difficulty":"hard","type":"single","stem":"Datum Corporation wants to summarize long documents overnight by using a Hugging Face summarization model in Azure Machine Learning. A summarization agent reads the results the next morning. The team first tried to deploy the model from the HuggingFace registry to a batch endpoint, and then tried to use the registry model as an input to a job.\n\nWhat should you do?","choices":["Register the model in the workspace and deploy it to a batch endpoint","Deploy the HuggingFace registry model to a batch endpoint on larger VMs","Use the HuggingFace registry model as an input to a pipeline job","Deploy the registry model to a managed online endpoint and call it in a loop"],"answer":[0],"explanation":"Hugging Face models from the registry cannot be deployed to batch endpoints, and because the weights are not stored in the registry, you cannot use them as job input. You therefore register the model yourself and deploy it to a batch endpoint with a GPU cluster and an environment with transformers.","rationale":["Correct: a self-registered model on a batch endpoint with a transformers environment supports nightly batch processing.","Incorrect: the restriction applies regardless of instance type; registry models are not supported on batch endpoints.","Incorrect: registry models cannot be used as job input because the weights are not stored there.","Incorrect: an online endpoint in a loop is intended for real-time inference and is more expensive and less scalable for bulk."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-nlp-processing-batch?view=azureml-api-2"},{"id":"2.4.7-09","obj":"2.4.7","difficulty":"hard","type":"single","stem":"Woodgrove Bank adds a Hugging Face model as a specialist in a multi-agent solution. Compliance requires that model weights are stored on Azure and are not downloaded from Hugging Face Hub at deployment time. The model is not gated, it is available in the current Foundry project, and the agent must call it through an OpenAI-compatible endpoint.\n\nWhich deployment approach should you use?","choices":["Deploy the model to Foundry Managed Compute in Foundry","Deploy the model to a managed online endpoint in Foundry (classic)","Deploy the model from the HuggingFace registry to an Azure Machine Learning managed online endpoint","Deploy the model to Azure Databricks Model Serving by loading it from Hugging Face Hub"],"answer":[0],"explanation":"In the current Foundry, the weights of Hugging Face models are stored on Azure, while Foundry (classic) and Azure Machine Learning download the weights from Hugging Face Hub at deployment. The deployment is called through the unified OpenAI-compatible Foundry endpoint.","rationale":["Correct: Foundry Managed Compute hosts the weights on Azure and provides an OpenAI-compatible endpoint.","Incorrect: Foundry (classic) downloads the weights from Hugging Face Hub at deployment.","Incorrect: the HuggingFace registry in Azure Machine Learning does not host weights; endpoints download them from the Hub.","Incorrect: loading from Hugging Face Hub violates the requirement that weights are not downloaded from the Hub."],"ref":"https://learn.microsoft.com/azure/foundry/foundry-models/how-to/hugging-face-models"},{"id":"2.4.8-01","obj":"2.4.8","difficulty":"easy","type":"single","stem":"Proseware, Inc. runs several Microsoft Agent Framework agents in Python. The operations team needs a log entry with the name and duration of every tool call that the agents make, without modifying the tool functions.\n\nWhich type of middleware should you implement?","choices":["Function middleware","Chat middleware","Agent middleware","A context provider"],"answer":[0],"explanation":"Function middleware intercepts every function or tool call of the agent and has access to the function, arguments, and result through FunctionInvocationContext. This way you log name and duration without modifying the tools themselves.","rationale":["Correct: function middleware runs around every tool call and can measure name and duration.","Incorrect: chat middleware intercepts requests to the model, not the individual tool execution.","Incorrect: agent middleware wraps the entire agent run and does not see the individual tool calls as separate steps.","Incorrect: a context provider supplies context to the agent and does not intercept tool calls."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.8-02","obj":"2.4.8","difficulty":"easy","type":"single","stem":"Contoso, Ltd. must audit the exact messages that its Agent Framework agents send to the AI model. The audit must include every model call, including the calls that send tool results back to the model during a multi-turn tool calling sequence.\n\nWhich type of middleware should you implement?","choices":["Chat middleware","Function middleware","Agent middleware registered at the run level","Agent middleware registered at the agent level"],"answer":[0],"explanation":"Chat middleware intercepts the underlying chat requests to the model and runs inside the function invocation loop. As a result, it is executed for every model call, including calls that send tool results back.","rationale":["Correct: chat middleware sees the raw messages of every individual model call.","Incorrect: function middleware intercepts tool calls, not the requests to the model.","Incorrect: agent middleware runs once per run and does not see the intermediate model calls separately.","Incorrect: at agent level too, agent middleware wraps the run and not every model call."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.8-03","obj":"2.4.8","difficulty":"easy","type":"single","stem":"Wide World Importers has many Agent Framework agents that call an unstable shipping tool. When the tool raises a transient exception, every agent must return a consistent, user-friendly fallback response. The behavior must be reusable across the solution.\n\nWhat should you do?","choices":["Implement middleware that catches the exception and sets a fallback result","Add exception handling and a fallback message inside each tool function","Set include_detailed_errors to True on the chat client of each agent","Increase max_iterations on the chat client of each agent"],"answer":[0],"explanation":"Middleware is the natural place for error handling, retry logic, and graceful degradation across all agents. By placing call_next in exception handling and setting a fallback result, you implement this once and reusably.","rationale":["Correct: reusable middleware catches the exception centrally and delivers a consistent fallback.","Incorrect: error handling per tool is not centrally reusable and leads to inconsistent behavior.","Incorrect: detailed errors show more error information to the model but provide no fallback.","Incorrect: more iterations does not change anything about the exception from the tool."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/exception-handling"},{"id":"2.4.8-04","obj":"2.4.8","difficulty":"medium","type":"single","stem":"Adventure Works Cycles adds agent middleware in Python to an agent built with Microsoft Agent Framework. After call_next(), the middleware redacts account numbers by replacing context.result with a new AgentResponse. Non-streaming runs work as expected. After deployment, the chat UI, which calls agent.run(..., stream=True), fails to render streamed answers. One middleware function must handle both streaming and non-streaming runs.\n\nWhat should you do?","choices":["Check context.stream and, for streaming runs, set context.result to an async generator that yields AgentResponseUpdate chunks.","Move the redaction logic to function middleware so that it runs on each tool result.","Set context.result and raise MiddlewareTermination so that the rest of the chain is skipped.","Pass the middleware in the middleware parameter of agent.run() instead of the Agent constructor."],"answer":[0],"explanation":"The type of context.result depends on the invocation: an AgentResponse for non-streaming runs and an async generator of AgentResponseUpdate chunks for streaming runs. Middleware that overrides results must use context.stream to produce the right type for each case.","rationale":["Correct: the middleware returns a streaming result for streaming runs and an AgentResponse for

:"2.2.4-06","obj":"2.2.4","difficulty":"medium","type":"single","stem":"Litware, Inc. connects an existing Azure AI Search index to a Foundry agent by using the Azure AI Search tool. The index has vector fields with a vectorizer and a semantic configuration. Agents must match exact keywords and conceptual meaning, and results must be reranked by semantic relevance.\n\nWhich query_type should you configure?","choices":["vector_semantic_hybrid","vector_simple_hybrid","semantic","vector"],"answer":[0],"explanation":"vector_semantic_hybrid combineert keyword- en vectorzoekopdrachten en voegt semantic reranking toe; het is ook de standaardwaarde van de tool. Dat dekt exacte keywords, conceptuele betekenis en herrangschikking op semantische relevantie.","rationale":["Juist: hybrid plus semantic reranking voldoet aan alle drie eisen.","vector_simple_hybrid combineert keyword en vector, maar zonder semantic reranking.","semantic gebruikt keyword search met semantic ranking, maar zonder vectorzoekopdracht voor conceptuele matches.","vector zoekt alleen op similarity en mist exacte keyword-precisie en semantic reranking."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/ai-search"},{"id":"2.2.4-07","obj":"2.2.4","difficulty":"hard","type":"single","stem":"Contoso Pharmaceuticals grounds research agents on SharePoint in Microsoft 365. Document permissions change daily, and documents carry Microsoft Purview sensitivity labels. Governance must remain in SharePoint, results must respect current permissions and labels without reindexing, and the team prefers to maintain no search index for this content.\n\nWhich knowledge source should you use?","choices":["a remote SharePoint knowledge source","an indexed SharePoint knowledge source","a search index knowledge source over an index built by the SharePoint indexer with ACL ingestion","a search index knowledge source with security filters on a group field"],"answer":[0],"explanation":"Een remote SharePoint knowledge source roept SharePoint direct aan via de Copilot Retrieval API op query time. Governance blijft in SharePoint en resultaten respecteren automatisch alle geldende rechten en Purview-labels, zonder index. Indexgebaseerde opties vereisen een index en indexer-runs om permissiewijzigingen te synchroniseren.","rationale":["Juist: live retrieval met het volledige SharePoint-rechtenmodel en labels, zonder index.","Een indexed SharePoint source genereert een indexerpipeline en index, wat de voorkeur om geen index te beheren schendt.","ACL-ingestion via de SharePoint indexer vereist een index en indexer-runs om rechten bij te werken, wat de voorkeur om geen index te beheren schendt.","Security filters zijn bedoeld voor eigen toegangsmodellen en repliceren het SharePoint-rechtenmodel en labels niet."],"ref":"https://learn.microsoft.com/azure/search/search-indexer-sharepoint-access-control-lists"},{"id":"2.2.4-08","obj":"2.2.4","difficulty":"hard","type":"single","stem":"Fabrikam Residences pushes documents into an Azure AI Search index that grounds several tenant-facing agents. Authorization comes from a non-Microsoft system, so native ACL integration is unavailable. Each user belongs to up to 2,000 groups. Retrieval must exclude unauthorized documents inside the search pipeline and keep subsecond response times.\n\nWhat should you do?","choices":["Store group identifiers in a filterable string field, and filter queries by using the search.in function with the groups of the user.","Store group identifiers in a filterable string field, and filter queries by using a disjunction of eq expressions for each group.","Return unfiltered results, and remove unauthorized documents in the agent code after retrieval.","Configure an indexer to ingest ADLS Gen2 ACL permission metadata."],"answer":[0],"explanation":"Het security filter-patroon slaat principal-identifiers op in een veld en trimt resultaten met een OData-filter. Met search.in krijg je ook bij duizenden waarden subseconde responstijden; een lange disjunctie van eq-expressies is foutgevoelig en vertraagt queries met seconden.","rationale":["Juist: search.in is de aanbevolen, performante vorm van security trimming bij een eigen toegangsmodel.","Een disjunctie van honderden of duizenden eq-expressies vertraagt de query met seconden en is lastig te onderhouden.","Post-query trimming in de app laadt grotere resultaatsets en is trager dan filteren in de search pipeline.","ADLS Gen2 ACL-ingestion vereist content en rechten in ADLS Gen2 met Microsoft Entra ID, wat hier niet geldt."],"ref":"https://learn.microsoft.com/azure/search/search-security-trimming-for-azure-search"},{"id":"2.2.4-09","obj":"2.2.4","difficulty":"hard","type":"multi","stem":"Wide World Importers builds a Foundry IQ knowledge base for its procurement agents. Supplier contracts are PDF files in an Azure Blob Storage container, and no search index exists yet. The contracts must be chunked and vectorized automatically. Current stock levels are exposed by an internal inventory system through an MCP-compatible endpoint and must be queried live, without an ingestion pipeline.\n\nWhich two knowledge sources should you add? Each correct answer presents part of the solution.","choices":["an Azure blob knowledge source","an MCP server knowledge source","a search index knowledge source","a web knowledge source","a remote SharePoint knowledge source"],"answer":[0,1],"explanation":"Een Azure blob knowledge source genereert automatisch een volledige indexerpipeline (data source, skillset, index en indexer) die content chunkt en optioneel vectoriseert. Een MCP server knowledge source vraagt live data op bij elk MCP-compatibel endpoint op query time, zonder ingestion.","rationale":["Juist: genereert de chunking- en vectorisatiepipeline vanuit de blob container.","Juist: haalt live, tool-backed resultaten op uit het MCP-endpoint zonder ingestion pipeline.","Een search index knowledge source verpakt een bestaande index, maar er bestaat nog geen index.","Een web knowledge source haalt publieke data uit Bing, geen interne contracten of voorraad.","Remote SharePoint haalt content uit SharePoint, terwijl de bronnen blob storage en een MCP-endpoint zijn."],"ref":"https://learn.microsoft.com/azure/search/agentic-knowledge-source-how-to-mcp-server"},{"id":"2.3.1-01","obj":"2.3.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. is building Agent1 in Foundry Agent Service. Agent1 must look up order status in an internal order system. The order system is reachable from the Fabrikam application code that runs in a private network, and the application must run the lookup logic itself.\n\nWhich tool type should you configure for Agent1?","choices":["Function calling","Code Interpreter","File Search","Grounding with Bing Search"],"answer":[0],"explanation":"Bij function calling definieert u de naam, parameters en beschrijving van een functie. Het model vraagt uw applicatie de functie aan te roepen; uw eigen code voert de functie uit en stuurt de uitvoer terug. Omdat alleen de applicatiecode het ordersysteem kan bereiken, is function calling de juiste keuze.","rationale":["Juist: de agent levert functienaam en argumenten, uw applicatie voert de lookup uit in het eigen netwerk.","Code Interpreter voert Python uit in een door de service beheerde sandbox en kan het interne ordersysteem niet bereiken.","File Search doorzoekt geuploade documenten, geen live intern systeem.","Grounding with Bing Search haalt openbare webinformatie op, geen interne orderstatus."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/function-calling"},{"id":"2.3.1-02","obj":"2.3.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank has a compliance agent named Agent2 that has three tools: check_sanctions, check_pep, and check_adverse_media. Every response from Agent2 must be based on at least one tool call, but the model must decide which of the three tools fits the request.\n\nWhich tool_choice value should you use?","choices":["auto","required","none","{\"type\": \"function\", \"name\": \"check_sanctions\"}"],"answer":[1],"explanation":"Met tool_choice stuurt u tool-aanroepen deterministisch. De waarde required dwingt het model om een of meer tools aan te roepen, terwijl het model zelf kiest welke tool past. Dat voldoet aan beide eisen: altijd een tool-aanroep, maar vrije keuze tussen de drie tools.","rationale":["auto laat het model beslissen of het een tool aanroept; een antwoord zonder tool-aanroep blijft mogelijk.","Juist: required verplicht minstens een tool-aanroep en laat de keuze van de tool aan het model.","none voorkomt juist dat het model tools aanroept.","Een specifieke functie forceert altijd check_sanctions, waardoor het model niet meer kiest tussen de drie tools."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/tool-best-practice"},{"id":"2.3.1-03","obj":"2.3.1","difficulty":"easy","type":"single","stem":"Relecloud has an HTTP API that is described by an OpenAPI 3.0 specification and protected by Microsoft Entra ID. A Foundry Agent Service agent must call operations of the API server-side, and you must avoid writing application code that executes the calls.\n\nWhich tool should you add to the agent?","choices":["OpenAPI tool","Function calling","Code Interpreter","Browser Automation"],"answer":[0],"explanation":"De OpenAPI tool laadt een OpenAPI 3.0/3.1-specificatie zodat het model de operaties zelf via de service aanroept. Authenticatie kan anonymous, API key of managed identity zijn; managed identity past bij een API die Microsoft Entra ID-tokens accepteert. Er is geen eigen uitvoeringscode nodig.","rationale":["Juist: de OpenAPI tool roept de API server-side aan en ondersteunt managed identity voor Entra-beveiligde API's.","Bij function calling moet uw eigen applicatiecode de functie uitvoeren, wat de eis schendt.","Code Interpreter voert Python-code uit in een sandbox en is niet bedoeld om een gespecificeerde REST API te integreren.","Browser Automation voert browsertaken uit via natuurlijke taal, niet gestructureerde API-operaties uit een OpenAPI-specificatie."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/openapi"},{"id":"2.3.1-04","obj":"2.3.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. builds an agent by using Microsoft Agent Framework for Python. The agent has 60 function tools. Tests show that tool-selection accuracy drops and token costs rise because every request sends all 60 tool schemas to the model. You need the agent to start each run with a small set of tools and to add more tools on demand during the same run, based on earlier tool results.\n\nWhat should you do?","choices":["Register a loader tool that calls add_tools on the FunctionInvocationContext to expose more tools during the run.","Pass the complete list of 60 tools to agent.run by using the tools parameter for each request.","Set tool_choice to required and set required_function_name for each tool.","Set max_function_calls in the function invocation configuration of the chat client."],"answer":[0],"explanation":"Progressive tool exposure laat een run starten met een kleine set tools; een loader-tool roept ctx.add_tools aan zodat extra tools bij de volgende iteratie van de function-calling-loop zichtbaar worden. Dat houdt het initiele schema klein, wat de tool-selectie verbetert en kosten verlaagt.","rationale":["Juist: het loader-tool-patroon voegt tools dynamisch toe binnen dezelfde run.","Tools per run meegeven bepaalt de set bij de start van de run; alle 60 schema's gaan dan nog steeds mee.","required_function_name forceert een specifieke eerste aanroep; het verkleint de set aangeboden tools niet.","max_function_calls begrenst het aantal aanroepen, maar verandert niet welke tool-schema's het model ziet."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/controlling-tool-availability"},{"id":"2.3.1-05","obj":"2.3.1","difficulty":"medium","type":"single","stem":"Northwind Traders builds an agent by using Microsoft Agent Framework for Python. The agent has two tools named get_record and update_record. The model must not be offered the update_record tool schema until get_record has run successfully in the current run. You must implement the requirement without adding a workflow.\n\nWhich technique should you use?","choices":["Register get_record at agent creation, and call add_tools from inside get_record to expose update_record.","Add function middleware that rejects update_record calls when the record was not fetched first.","Build a sequential workflow that has one executor for get_record and one for update_record.","Add an agent instruction that tells the model to fetch a record before it updates the record."],"answer":[0],"explanation":"Bij het gating-patroon registreert u alleen de lees-tool; die voegt de schrijf-tool toe na een geslaagde fetch. Het model ziet update_record dus pas daarna, en omdat de toollijst bij elke run reset, wordt de gate per beurt opnieuw actief. Pairwise volgordes vereisen geen workflow.","rationale":["Juist: update_record is pas zichtbaar nadat get_record succesvol is uitgevoerd.","Middleware gating weigert de aanroep wel, maar het model ziet het schema van update_record vanaf het begin.","Een workflow is expliciet uitgesloten en is volgens de documentatie niet nodig voor deze volgorde.","Een instructie is niet deterministisch en verbergt het schema niet."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/controlling-tool-availability"},{"id":"2.3.1-06","obj":"2.3.1","difficulty":"medium","type":"single","stem":"Litware, Inc. has a Foundry Agent Service agent that uses function calling. A function named start_reconciliation calls a back-office job that runs for up to 25 minutes. Tests show that the agent runs that call start_reconciliation fail before the job completes. The agent must still report the job outcome to the user.\n\nWhat should you do?","choices":["Return a job status immediately, and add a status function that the agent can poll.","Set tool_choice to required for the runs that call start_reconciliation so that the model waits for the job.","Set strict to true in the start_reconciliation definition so that the run accepts a longer execution.","Submit the function output in a new conversation after the job completes, and reference the original call_id."],"answer":[0],"explanation":"Runs verlopen 10 minuten na aanmaak, en die limiet geldt voor de totale verstreken tijd, niet per functie-uitvoering. Voor langlopende operaties retourneert u direct een status en implementeert u polling. Zo blijft de run binnen de limiet en kan de agent later de uitkomst ophalen.","rationale":["Juist: direct een status teruggeven plus polling past binnen de vervaltijd van de run.","tool_choice bepaalt of een tool wordt aangeroepen, niet hoe lang de run mag duren.","strict garandeert schema-conforme argumenten, maar verlengt de run niet.","Een nieuwe conversatie bevat de oorspronkelijke function_call niet, en de vervaltijd van 10 minuten van de oorspronkelijke run blijft gelden."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/function-calling"},{"id":"2.3.1-07","obj":"2.3.1","difficulty":"hard","type":"single","stem":"Tailspin Toys uses Microsoft Agent Framework for Python. An agent has two tools named get_record and update_record. For a specific request, the first action of the model must be a call to get_record. After that first call, the model must be free to choose its next action.\n\nYou write the following code:\n\n```python\nresult = await agent.run(\n    \"Update record REC-42 to status 'in-progress'.\",\n    options={\"tool_choice\": <value>},\n)\n```\n\nWhich value should you use for <value>?","choices":["{\"mode\": \"required\", \"required_function_name\": \"get_record\"}","\"required\"","\"auto\"","\"none\""],"answer":[0],"explanation":"Een ToolMode-dict met mode required en required_function_name dwingt een aanroep van die specifieke functie als eerste actie. Het framework zet tool_choice na de eerste iteratie automatisch terug naar None, zodat het model daarna vrij is. De shorthand-strings noemen geen specifieke functie.","rationale":["Juist: forceert get_record als eerste aanroep, daarna is het model vrij.","required forceert een tool-aanroep, maar het model mag dan ook update_record als eerste kiezen.","auto laat het model vrij, dus get_record is niet gegarandeerd de eerste actie.","none verhindert tool-aanroepen volledig."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/controlling-tool-availability"},{"id":"2.3.1-08","obj":"2.3.1","difficulty":"hard","type":"multi","stem":"A. Datum Corporation uses function calling in Foundry Agent Service. Agent1 can call a function named update_shipping_address that writes to the order database. The function authenticates to the database by using DefaultAzureCredential. You need to prevent malformed or malicious values from reaching the order database, and you need to limit the impact if the identity is misused.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Validate and sanitize the function arguments before the function uses them.","Apply least privilege to the identity that DefaultAzureCredential uses.","Return the database connection string in the tool output so that the model can retry the call.","Set tool_choice to none for the runs that might update an address.","Update the function definition in the Foundry portal so that the portal runs the function."],"answer":[0,1],"explanation":"De security-richtlijnen voor function calling zeggen: behandel tool-argumenten en -uitvoer als onvertrouwde input en valideer ze, en pas least privilege toe op de identiteit van DefaultAzureCredential. Samen voorkomen ze foute waarden in de database en beperken ze de schade bij misbruik.","rationale":["Juist: argumenten van het model zijn onvertrouwde input en moeten worden gevalideerd.","Juist: least privilege beperkt wat een misbruikte identiteit kan doen.","Geheimen zoals connection strings horen nooit in tool-uitvoer.","none schakelt tool-aanroepen uit, waardoor de functie onbruikbaar wordt.","De portal kan functiedefinities niet toevoegen of bijwerken en voert uw functies niet uit; dat doet uw code."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/function-calling"},{"id":"2.3.1-09","obj":"2.3.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. creates a prompt agent in Foundry Agent Service that uses function calling to return live delivery estimates from an internal service. You need to implement the function calling flow.\n\nWhich sequence of actions should you perform?","choices":["Define the function tool -> Create the agent with the function definition -> Send the prompt and read the function_call item -> Run the function and send a function_call_output item that references the previous response","Create the agent -> Send the prompt and read the function_call item -> Define the function tool -> Run the function and send a function_call_output item that references the previous response","Define the function tool -> Create the agent with the function definition -> Run the function and send a function_call_output item that references the previous response -> Send the prompt and read the function_call item","Define the function tool -> Send the prompt and read the function_call item -> Create the agent with the function definition -> Run the function and send a function_call_output item that references the previous response"],"answer":[0],"explanation":"Het patroon is: functie definieren, agent registreren met de definitie, prompt sturen (het eerste antwoord bevat een function_call-item), de functie uitvoeren met de geretourneerde argumenten en een vervolgrequest sturen met een function_call_output-item dat naar het vorige antwoord verwijst.","rationale":["Juist: dit is de gedocumenteerde volgorde voor function calling.","De agent moet de functiedefinitie bij aanmaak kennen; anders kan het model geen function_call teruggeven.","U kunt de functie pas uitvoeren nadat het model een function_call met argumenten heeft geretourneerd.","Een prompt sturen voordat de agent bestaat is niet mogelijk; de agent met definitie moet eerst bestaan."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/function-calling"},{"id":"2.3.2-01","obj":"2.3.2","difficulty":"easy","type":"single","stem":"Wide World Importers manages a REST API named Orders API in Azure API Management Standard v2. You need to expose selected operations of Orders API as tools that MCP clients can call, without writing or hosting new server code.\n\nWhat should you do?","choices":["Create an MCP server in API Management by using the Expose an API as an MCP server option.","Create an MCP server in API Management by using the Expose an existing MCP server option.","Build an MCP server by using the Azure Functions MCP extension, and add it as an API backend.","Associate Orders API with a product, and give MCP clients a subscription key for the API."],"answer":[0],"explanation":"API Management kan een beheerde REST API via de ingebouwde AI gateway als remote MCP server publiceren; geselecteerde API-operaties worden MCP-tools. Er hoeft geen eigen MCP-servercode te worden geschreven of gehost.","rationale":["Juist: API Management publiceert de geselecteerde API-operaties direct als MCP-tools, zonder eigen servercode.","Deze optie is voor een MCP-compatibele server die al buiten API Management draait; die is er hier niet.","Een Functions-gebaseerde MCP server is nieuwe servercode die u moet schrijven en hosten, wat de eis schendt.","Een product en subscription key regelen toegang tot de REST API, maar maken de operaties geen MCP-tools."],"ref":"https://learn.microsoft.com/azure/api-management/export-rest-mcp-server"},{"id":"2.3.2-02","obj":"2.3.2","difficulty":"easy","type":"single","stem":"Coho Winery builds a remote MCP server by using the Azure Functions MCP extension. A function must run each time an MCP client calls a tool named get_vintage.\n\nWhich binding should you use for the function?","choices":["MCP tool trigger","MCP resource trigger","MCP prompt trigger","HTTP trigger"],"answer":[0],"explanation":"De Azure Functions MCP-extensie biedt drie triggers: de tool trigger voert een functie uit bij een MCP tool-call, de resource trigger stelt een functie beschikbaar als MCP-resource en de prompt trigger als MCP-prompt. Voor een tool-aanroep is de tool trigger nodig.","rationale":["Juist: de MCP tool trigger draait de functie bij een tool-call-request.","De resource trigger stelt een MCP-resource beschikbaar, geen tool.","De prompt trigger stelt een herbruikbare MCP-prompt beschikbaar, geen tool.","Een gewone HTTP trigger is geen MCP-binding; het MCP-protocol wordt dan niet door de extensie afgehandeld."],"ref":"https://learn.microsoft.com/azure/azure-functions/functions-bindings-mcp"},{"id":"2.3.2-03","obj":"2.3.2","difficulty":"easy","type":"single","stem":"A developer at Fourth Coffee builds an agent by using Microsoft Agent Framework for Python. The agent must use a filesystem MCP server that the application starts as a local child process and communicates with over standard input and output.\n\nWhich class should you use to connect the agent to the MCP server?","choices":["MCPStdioTool","MCPStreamableHTTPTool","FunctionTool","MCPTool from azure.ai.projects.models"],"answer":[0],"explanation":"MCPStdioTool verbindt een Agent Framework-agent met een stdio-gebaseerde MCP server, meestal een lokaal proces dat via command en args wordt gestart. Dat is precies het transport dat hier wordt beschreven.","rationale":["Juist: MCPStdioTool start en verbindt met een lokale stdio MCP server.","MCPStreamableHTTPTool verbindt met een MCP server via een HTTP-URL, niet via stdin/stdout.","FunctionTool verpakt een lokale functie en spreekt het MCP-protocol niet.","MCPTool uit azure.ai.projects configureert een remote MCP server voor Foundry Agent Service; de service-runtime accepteert alleen remote endpoints."],"ref":"https://learn.microsoft.com/python/api/agent-framework-core/agent_framework.mcpstdiotool?view=agent-framework-python-latest"},{"id":"2.3.2-04","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Alpine Ski House has Azure Logic Apps workflows that use connectors to create IT tickets. The workflows run in a Consumption logic app and start with a Recurrence trigger. You need to expose the ticket workflows as tools on a remote MCP server that MCP clients can discover, and you want to reuse the existing workflow logic.\n\nWhat should you do?","choices":["Rebuild the workflows in a Standard logic app on a Workflow Service Plan, with a Request trigger and a Response action.","Keep the Consumption logic app, replace the Recurrence trigger with a Request trigger, and add a Response action.","Add the Consumption logic app to Azure API Management by using the Expose an existing MCP server option.","Wrap the workflow actions in a Scope action, and configure run after to return errors to the MCP client."],"answer":[0],"explanation":"Logic Apps kan workflows als remote MCP server publiceren vanuit een Standard logic app op een Workflow Service Plan of App Service Environment v3. De workflows moeten starten met de Request-trigger When an HTTP request is received en eindigen met een Response-actie.","rationale":["Juist: Standard-hosting plus Request-trigger en Response-actie zijn de vereisten voor workflows als MCP-tools.","Consumption logic apps ondersteunen de MCP server-functie niet, ook niet met een Request-trigger.","Die optie vereist een bestaande MCP-compatibele server; een Consumption-workflow is dat niet.","Een Scope met run after regelt foutafhandeling, maar maakt de workflows niet beschikbaar als MCP-tools."],"ref":"https://learn.microsoft.com/azure/logic-apps/create-model-context-protocol-server-standard"},{"id":"2.3.2-05","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Adventure Works Cycles wants a Foundry Agent Service agent to use an open-source MCP server that developers currently run locally. The server starts with an npx command and depends on Playwright, which requires OS-level dependencies. Foundry Agent Service accepts only remote MCP server endpoints.\n\nWhich hosting approach should you use for the MCP server?","choices":["Package the server in a Linux container and host it in Azure Container Apps.","Host the server in Azure Functions by using the Azure Functions MCP extension.","Host the server in Azure Functions as a self-hosted MCP server.","Connect the agent to the local server by using the stdio transport."],"answer":[0],"explanation":"Agent Service accepteert alleen een remote MCP-endpoint, dus de lokale server moet in de cloud worden gehost. Azure Container Apps ondersteunt npx/uvx-startcommando's en alle dependencies in de container image, terwijl Azure Functions geen npx-startcommando's en geen OS-level dependencies zoals Playwright ondersteunt.","rationale":["Juist: een Linux-container in Azure Container Apps ondersteunt npx en OS-level dependencies.","Onjuist: Azure Functions ondersteunt geen OS-level dependencies zoals Playwright; npx-startcommando's worden evenmin ondersteund.","Onjuist: ook self-hosted op Azure Functions ondersteunt geen npx-startcommando's en geen OS-level dependencies.","Onjuist: Agent Service accepteert alleen remote MCP-endpoints, geen lokale stdio-server."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"2.3.2-06","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Margie's Travel exposes an existing MCP server through Azure API Management. MCP clients send access tokens that are issued by Microsoft Entra ID in the Authorization header. API Management must return a 401 response for requests that have a missing or invalid token before any tool is called, and it must accept tokens for one specific client application.\n\nWhich policy should you add to the inbound section?","choices":["validate-azure-ad-token","get-authorization-context","set-backend-service","rate-limit-by-key"],"answer":[0],"explanation":"Voor inkomende toegang tot een MCP server in API Management valideert de policy validate-azure-ad-token Entra ID-tokens uit de Authorization-header. U stelt tenant, toegestane client-application-ids en de failed-validation-httpcode 401 in.","rationale":["Juist: valideert Entra-tokens inbound en weigert ongeldige requests met 401.","get-authorization-context haalt via credential manager een token op voor uitgaande backend-aanroepen; het valideert geen inkomende tokens.","set-backend-service routeert een request naar een andere backend en doet geen authenticatie.","rate-limit-by-key beperkt het aantal aanroepen, maar controleert geen tokens."],"ref":"https://learn.microsoft.com/azure/api-management/secure-mcp-servers"},{"id":"2.3.2-07","obj":"2.3.2","difficulty":"hard","type":"multi","stem":"Trey Research exposes a REST API as an MCP server in Azure API Management. After two changes, MCP clients report that tool calls fail and responses no longer stream. The changes are:\n\n- Diagnostic logging to Application Insights was enabled at the All APIs scope, including frontend response payloads.\n- An MCP server policy was added that reads context.Response.Body to log tool output.\n\nYou need to restore MCP server functionality and keep diagnostic logging for the other APIs.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Set Number of payload bytes to log for Frontend Response to 0 at the All APIs scope.","Remove the access to context.Response.Body from the MCP server policy.","Change the MCP server transport from Streamable HTTP to SSE.","Add a retry policy that wraps forward-request in the MCP server policy.","Associate the MCP server with an additional API Management product."],"answer":[0,1],"explanation":"Het loggen van response bodies op All APIs-scope en het lezen van context.Response.Body in een MCP-policy veroorzaken response-buffering, wat het streaminggedrag van MCP verstoort. Zet de frontend response payload-logging op 0 op globale scope (en log payloads eventueel per API) en verwijder de body-toegang uit de policy.","rationale":["Juist: voorkomt globale response body-logging die MCP-streaming breekt; per API kunt u gericht blijven loggen.","Juist: lezen van context.Response.Body triggert buffering en verstoort de MCP-transport.","SSE is het verouderde transport; het lost het buffering-probleem niet op.","Een retry herhaalt alleen dezelfde gebufferde, falende aanroep.","Producten regelen toegang en abonnementen, geen streaming."],"ref":"https://learn.microsoft.com/azure/api-management/export-rest-mcp-server"},{"id":"2.3.2-08","obj":"2.3.2","difficulty":"hard","type":"single","stem":"Lucerne Publishing connects a Foundry Agent Service prompt agent to a remote MCP server that exposes eight tools. The agent must be able to call get_stock and list_warehouses. The other six tools must be unavailable to the agent.\n\nYou write the following code:\n\n```python\ntool = MCPTool(\n    server_label=\"inventory\",\n    server_url=\"https://lucerne-mcp.azurewebsites.net/runtime/webhooks/mcp\",\n    <parameter>,\n    project_connection_id=MCP_CONNECTION_NAME,\n)\n```\n\nWhich code should you use for <parameter>?","choices":["allowed_tools=[\"get_stock\", \"list_warehouses\"]","require_approval={\"never\": [\"get_stock\", \"list_warehouses\"]}","require_approval={\"always\": [\"get_stock\", \"list_warehouses\"]}","require_approval=\"always\""],"answer":[0],"explanation":"allowed_tools is een optionele allow list van tools die de agent mag gebruiken; zonder deze waarde zijn alle tools van de MCP server beschikbaar. require_approval regelt alleen of een aanroep eerst goedkeuring nodig heeft, niet welke tools beschikbaar zijn.","rationale":["Juist: beperkt de agent tot de twee genoemde tools.","Hiermee hebben de twee tools geen goedkeuring nodig, maar de andere zes tools blijven beschikbaar.","Hiermee vragen de twee tools om goedkeuring; de andere zes tools blijven beschikbaar.","Goedkeuring voor elke aanroep is ook de standaardwaarde, en alle acht tools blijven beschikbaar."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"2.3.2-09","obj":"2.3.2","difficulty":"hard","type":"single","stem":"Graphic Design Institute builds MCP tools by using the Azure Functions MCP extension. You need to make the tools available to an existing Foundry Agent Service agent by using key-based authentication.\n\nWhich sequence of actions should you perform?","choices":["Deploy the MCP server to a function app -> Get the endpoint URL that ends in /runtime/webhooks/mcp -> Copy the mcp_extension system key -> Add an MCP tool to the agent with Key-based authentication and an x-functions-key credential","Deploy the MCP server to a function app -> Disable key-based authentication -> Get the endpoint URL that ends in /runtime/webhooks/mcp -> Add an MCP tool to the agent with Key-based authentication and an x-functions-key credential","Get the endpoint URL that ends in /runtime/webhooks/mcp -> Add an MCP tool to the agent with Key-based authentication and an x-functions-key credential -> Deploy the MCP server to a function app -> Copy the mcp_extension system key","Deploy the MCP server to a function app -> Copy the default host key -> Add an MCP tool to the agent with Key-based authentication and an x-functions-key credential -> Get the endpoint URL that ends in /runtime/webhooks/mcp"],"answer":[0],"explanation":"Het gedocumenteerde proces: MCP server deployen, de endpoint-URL ophalen (/runtime/webhooks/mcp), de juiste key ophalen en daarna een MCP-toolverbinding toevoegen in de agent. Voor een server op basis van de MCP-extensie is dat de system key mcp_extension; de host key default hoort bij een self-hosted MCP server.","rationale":["Juist: juiste volgorde en de juiste key voor een MCP-extensieserver.","Key-based authenticatie uitschakelen maakt de x-functions-key-credential onbruikbaar.","U kunt geen endpoint-URL of key gebruiken van een server die nog niet is gedeployed.","De default host key is voor self-hosted servers, en de endpoint-URL is nodig voordat u de tool toevoegt."],"ref":"https://learn.microsoft.com/azure/azure-functions/functions-mcp-foundry-tools"},{"id":"2.3.3-01","obj":"2.3.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. builds a C# agent by using Microsoft.Extensions.AI with a FunctionInvokingChatClient. The agent uses a Mistral model that is deployed in Microsoft Foundry. The model sometimes passes a string where a tool expects an integer. When the call fails, the model receives only a generic error message and repeats the same mistake.\n\nYou need the model to see what went wrong so that it can self-correct. You must not write custom error-handling code.\n\nWhat should you do?","choices":["Set IncludeDetailedErrors to true on the FunctionInvokingChatClient.","Set a custom FunctionInvoker delegate that catches the exception and returns a message.","Add the Strict additional property to the metadata of the function.","Increase MaximumConsecutiveErrorsPerRequest on the FunctionInvokingChatClient."],"answer":[0],"explanation":"Standaard krijgt het model bij een mislukte function call een generieke foutmelding. Met IncludeDetailedErrors op true wordt de volledige exceptiemelding aan de chat history toegevoegd, zodat het model kan zien wat er misging en zichzelf kan corrigeren. Let op dat exceptieteksten geen gevoelige gegevens mogen bevatten.","rationale":["Juist: gedetailleerde fouten geven het model de informatie om met gecorrigeerde input opnieuw te proberen, zonder eigen code.","Fout: een custom FunctionInvoker werkt ook, maar dat is eigen foutafhandelingscode.","Fout: strict JSON schema mode werkt alleen met OpenAI-modellen, niet met een Mistral-model.","Fout: meer opeenvolgende fouten toestaan geeft het model geen extra informatie over de fout."],"ref":"https://learn.microsoft.com/dotnet/ai/how-to/handle-invalid-tool-input"},{"id":"2.3.3-02","obj":"2.3.3","difficulty":"easy","type":"single","stem":"VanArsdel, Ltd. exposes a Standard logic app workflow as an MCP tool. The workflow calls an HTTP endpoint that sometimes returns 429 and 503 responses. The HTTP action must resend failed requests six times, and it must wait a random interval that is selected from an exponentially growing range, with a custom maximum interval.\n\nWhich retry policy type should you configure on the HTTP action?","choices":["Exponential Interval","Fixed Interval","Default","None (do not retry)"],"answer":[0],"explanation":"De Exponential Interval-policy wacht een willekeurig interval uit een exponentieel groeiend bereik en laat u count (1 tot 90), minimumInterval en maximumInterval instellen. Daarmee voldoet u aan zes pogingen en een eigen maximaal interval.","rationale":["Juist: exponentieel willekeurig interval met instelbaar aantal en maximum.","Fixed Interval wacht steeds hetzelfde interval, niet exponentieel groeiend.","Default is exponentieel, maar met vaste instellingen (tot 4 retries); u kunt daar geen zes pogingen of eigen maximum instellen.","None verstuurt mislukte requests niet opnieuw."],"ref":"https://learn.microsoft.com/azure/logic-apps/error-exception-handling"},{"id":"2.3.3-03","obj":"2.3.3","difficulty":"easy","type":"single","stem":"Wingtip Toys routes agent tool calls through Azure API Management to a pricing backend. When the backend returns repeated 5xx responses, API Management must stop sending requests to it for a defined period and return 503 Service Unavailable to callers so that the backend can recover.\n\nWhich feature should you configure?","choices":["A circuit breaker rule on the backend resource","A retry policy that wraps the forward-request policy","A rate-limit-by-key policy on the pricing API","A limit-concurrency policy around the backend call"],"answer":[0],"explanation":"De circuit breaker op een backend-resource tript op basis van foutcondities (zoals 5xx binnen een interval). Daarna stuurt API Management een tijd lang geen requests naar de backend en retourneert 503 aan clients, zodat de backend kan herstellen.","rationale":["Juist: precies het gedrag van de backend circuit breaker.","Een retry stuurt juist extra requests naar de falende backend.","rate-limit-by-key beperkt aanroepen per sleutel, ongeacht de gezondheid van de backend.","limit-concurrency beperkt gelijktijdige requests, maar reageert niet op foutpercentages van de backend."],"ref":"https://learn.microsoft.com/azure/api-management/backends"},{"id":"2.3.3-04","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. builds an MCP server that exposes a tool named get_forecast. When the downstream weather API fails, the agent model must see what went wrong and whether a retry makes sense, and the conversation must continue.\n\nWhat should get_forecast return when the downstream API fails?","choices":["A tool result with isError set to true that describes the failure and gives retry advice","A JSON-RPC protocol error response that has an error code and a failure message","An empty text result so that the model can continue the conversation","An unhandled exception that the MCP client converts into a session error"],"answer":[0],"explanation":"MCP onderscheidt protocolfouten (onbekende tool, ongeldige argumenten) van tool-uitvoeringsfouten zoals een falende API. Uitvoeringsfouten rapporteert u in het tool-resultaat met isError: true, zodat het model ziet wat er misging. Vermeld wat faalde en of opnieuw proberen zin heeft.","rationale":["Juist: een uitvoeringsfout hoort in het tool-resultaat met isError: true.","Protocolfouten zijn voor zaken als een onbekende tool of ongeldige argumenten, niet voor een falende downstream-API.","Een leeg resultaat verbergt de fout; het model kan antwoorden alsof de aanroep slaagde.","Een onafgehandelde exceptie kan de MCP-sessie of het hele gesprek beeindigen; het model krijgt geen bruikbaar resultaat."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.3.3-05","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Relecloud builds an agent by using Microsoft Agent Framework for Python. When a dependency is down, the model calls the failing tool repeatedly within one request, which consumes tokens and the rate limit of the tool. You need automatic tool invocation to stop after 20 function calls or 30 seconds, after which the model must produce a final text response.\n\nWhat should you configure on the chat client?","choices":["max_function_calls and max_duration_seconds in function_invocation_configuration","allow_concurrent_invocation set to False in function_invocation_configuration","include_detailed_errors set to True in function_invocation_configuration","tool_choice set to required in the run options"],"answer":[0],"explanation":"Met function_invocation_configuration stelt u limieten in op automatische tool-aanroepen: max_iterations, max_function_calls en max_duration_seconds. Bij het bereiken van een limiet stopt de client met tools aanroepen en vraagt het model om een eindantwoord in tekst.","rationale":["Juist: begrenst het aantal aanroepen en de duur, en dwingt een eindantwoord af.","Dit regelt alleen of tools in een batch gelijktijdig of op volgorde draaien.","Dit voegt exceptietekst toe aan het resultaat en stopt de lus niet; bovendien kan het gevoelige data lekken.","required dwingt juist tool-aanroepen af en verergert de lus."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools"},{"id":"2.3.3-06","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a tool named summarize_case that calls an Azure OpenAI deployment. The tool receives two kinds of errors: 429 responses that include a retry-after-ms header, and 400 responses that have the code content_filter. You need a retry strategy that protects throughput and avoids wasted tokens.\n\nWhat should you do?","choices":["Retry 429 responses after the retry-after-ms duration, and log and surface 400 content_filter responses without retrying them.","Retry both error types by using exponential backoff with jitter.","Retry 400 content_filter responses immediately, and fail over 429 responses to a second deployment without waiting.","Retry 429 responses at a fixed 1-second interval, and retry 400 content_filter responses once."],"answer":[0],"explanation":"Een 429 met retry-after-ms is retrybaar: wacht de aangegeven duur. Een 400 met content_filter is niet retrybaar, omdat dezelfde content deterministisch opnieuw faalt; log het, meld het aan de aanroeper en stop. Blind retries op geweigerde content verbruiken tokens en capaciteit.","rationale":["Juist: honoreer retry-after-ms voor 429 en stop met retries bij content_filter.","Een content_filter-fout faalt bij elke retry opnieuw en verspilt tokens.","Een content_filter-retry faalt opnieuw, en de retry-after-ms-waarde van de 429 wordt genegeerd.","Een vaste backoff vervangt de precieze retry-after-ms-waarde, en de content_filter-retry is zinloos."],"ref":"https://learn.microsoft.com/azure/well-architected/design-guides/throttling"},{"id":"2.3.3-07","obj":"2.3.3","difficulty":"hard","type":"single","stem":"Adventure Works Cycles connects a Foundry Agent Service agent to a remote MCP server by using the MCP tool without streaming. A tool named generate_report takes three to four minutes to finish. Every call to generate_report fails after about 100 seconds, while other tools on the same server succeed. You must keep the report generation logic unchanged.\n\nWhat should you do?","choices":["Split generate_report into a start tool that returns a job ID and a status tool.","Increase the retry count in the agent so that it calls generate_report again after each failure.","Set require_approval to never for generate_report.","Change the MCP server transport from Streamable HTTP to SSE."],"answer":[0],"explanation":"Niet-streamende MCP tool-calls in Foundry Agent Service hebben een timeout van 100 seconden. Oplossingen zijn de agent in background mode draaien met een ondersteund model, de serverlogica optimaliseren of de operatie in kleinere stappen opdelen. Omdat de logica gelijk moet blijven, splitst u de operatie in een start- en een statusstap.","rationale":["Juist: elke stap blijft onder de timeout van 100 seconden zonder de rapportlogica te wijzigen.","Elke retry loopt opnieuw tegen dezelfde timeout aan en verspilt capaciteit.","Goedkeuring heeft geen invloed op de timeout van de tool-call.","Het transport wijzigen heft de timeout niet op; SSE is bovendien het verouderde transport."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"2.3.3-08","obj":"2.3.3","difficulty":"hard","type":"multi","stem":"Woodgrove Bank has an agent that calls a third-party HTTP API through a function tool. Production traces show three problems:\n\n- The agent waits indefinitely when the API hangs.\n- After a 429 response, the model repeatedly decides to call the API again.\n- The model answers as if a failed call succeeded.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Set a timeout on the tool call and a time budget for the whole turn.","Handle 429 and 503 responses in the tool code, honor Retry-After, and cap the attempts.","Return failures to the model as clear results that state what failed and whether a retry makes sense.","Return the raw exception to the model so that the model decides when to retry.","Catch the error and return an empty string so that the conversation continues."],"answer":[0,1,2],"explanation":"Een timeout per tool-aanroep en een budget per beurt voorkomen dat de agent blijft hangen. Retries op 429/503 horen in de toolcode, met Retry-After en een maximum, zodat het model niet zelf hoeft te beslissen. Fouten geeft u als duidelijk resultaat terug, zodat het model de fout niet verbergt.","rationale":["Juist: lost het eindeloze wachten op.","Juist: haalt de retry-beslissing weg bij het model en respecteert de backpressure.","Juist: het model ziet dat de aanroep faalde en antwoordt niet alsof die slaagde.","Dan beslist het model juist zelf over retries, wat de lus veroorzaakt.","Een leeg resultaat verbergt de fout en laat het model antwoorden alsof de aanroep slaagde."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.3.3-09","obj":"2.3.3","difficulty":"hard","type":"single","stem":"Northwind Traders uses the following function middleware in Microsoft Agent Framework for Python. When the inventory tool raises a TimeoutError, the user must receive a friendly message, the middleware must not call the tool again, and the run must continue.\n\n```python\nasync def exception_handling_middleware(\n    context: FunctionInvocationContext,\n    call_next: Callable[[], Awaitable[None]],\n) -> None:\n    try:\n        await call_next()\n    except TimeoutError:\n        <code>\n```\n\nWhich code should you use for <code>?","choices":["context.result = \"Inventory service timed out. Tell the user to try again later.\"","raise RuntimeError(\"Inventory service timed out. Tell the user to try again later.\")","context.result = await call_next()","return"],"answer":[0],"explanation":"In function middleware vangt u de exceptie op en overschrijft u context.result met een gebruikersvriendelijke melding. Het model krijgt dat als tool-resultaat en de run gaat door, zonder dat de ruwe exceptie de gebruiker bereikt.","rationale":["Juist: vervangt het resultaat door een fallback-melding zonder de tool opnieuw aan te roepen, en de run gaat door.","Een nieuwe exceptie raisen laat de fout doorgaan; het model krijgt geen vriendelijke melding als tool-resultaat.","Dit roept de falende tool opnieuw aan, wat expliciet niet mag; call_next retourneert bovendien None.","Return zonder resultaat geeft het model geen bruikbare melding voor de gebruiker."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/exception-handling"},{"id":"2.3.4-01","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Trey Research has a Foundry Agent Service agent that calls a non-Microsoft OpenAPI tool that returns JSON. The agent uses values from the JSON to update records in an internal system. You need to follow the Foundry Agent Service best practices for handling the tool output.\n\nWhat should you do?","choices":["Validate the output against an expected schema, and require user approval before updates.","Pass the raw output directly to the update operation to reduce latency and token use.","Add an agent instruction that asks the model to confirm that the output looks correct.","Log the complete output, including any tokens it contains, to the trace for auditing."],"answer":[0],"explanation":"Behandel tool-uitvoer als onvertrouwde input. Valideer gestructureerde uitvoer tegen een verwacht schema, sta alleen bekende velden en operaties toe en vraag goedkeuring van de gebruiker voor ingrijpende acties.","rationale":["Juist: dit is de gedocumenteerde best practice voor tool-uitvoer.","Ruwe, ongevalideerde uitvoer gebruiken voor schrijfacties is precies het risico dat u wilt vermijden.","Een instructie aan het model is niet deterministisch en vervangt geen schemavalidatie in code.","Geheimen horen niet in traces of logs."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/tool-best-practice"},{"id":"2.3.4-02","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Proseware, Inc. reports that its Foundry Agent Service agent sometimes answers without using data from an attached tool. You need to confirm whether the agent called the tool and inspect the tool inputs and outputs for a specific conversation.\n\nWhat should you use?","choices":["Traces for the agent in Foundry","API Management logs for the connected AI gateway","Azure Monitor metrics for the model deployment","The version history of the agent"],"answer":[0],"explanation":"Met traces in Foundry bevestigt u of de agent een tool aanriep en bekijkt u de inputs en outputs van die tool-aanroep. Dat is de gedocumenteerde manier om tool-aanroepen per conversatie te valideren.","rationale":["Juist: traces tonen per conversatie of een tool werd aangeroepen, met inputs en outputs.","API Management-logs tonen alleen gatewayverkeer, niet of het model per conversatie een tool-aanroep produceerde en met welke inputs en outputs.","Metrics zijn geaggregeerd en tonen geen tool-inputs en -outputs per conversatie.","De versiegeschiedenis toont agentdefinities, geen runtime-aanroepen."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/tool-best-practice"},{"id":"2.3.4-03","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Lucerne Publishing builds an agent that uses a local MCP tool in Microsoft Agent Framework for Python. Some tool results contain both content and structuredContent. The model must receive structuredContent when it is present and receive content when structuredContent is absent.\n\nWhich tool_result_content value should you use?","choices":["structured_first","content_first","content_only","both"],"answer":[0],"explanation":"tool_result_content bepaalt welke waarde van een MCP-resultaat zichtbaar is voor het model. structured_first (de standaard) gebruikt structuredContent als dat aanwezig is en valt anders terug op content.","rationale":["Juist: structuredContent eerst, anders content.","content_first gebruikt niet-lege content en valt pas terug op structuredContent.","content_only negeert structuredContent volledig.","both voegt geserialiseerde structuredContent toe na de content-blokken, waardoor het model beide ziet."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/local-mcp-tools"},{"id":"2.3.4-04","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Alpine Ski House defines a function tool by using the @tool decorator in Microsoft Agent Framework for Python. The tool returns a raw object from a lift status API. You need to convert each return value into a list of Content items before the model receives it. If the conversion fails during automatic function invocation, the model must receive a normal tool-error result instead of the raw value.\n\nWhat should you do?","choices":["Set result_parser on the @tool decorator.","Pass a Pydantic model to the schema parameter of the @tool decorator.","Declare the tool by using FunctionTool with func set to None.","Read the return value from the kwargs of the FunctionInvocationContext inside the tool."],"answer":[0],"explanation":"Met result_parser op FunctionTool of @tool zet u een ruwe returnwaarde om naar een string of een lijst Content-items. Als de parser faalt, retourneert automatische function invocation een normaal tool-error-resultaat; de ruwe waarde wordt niet als fallback gebruikt.","rationale":["Juist: result_parser converteert het resultaat en levert bij fouten een tool-error-resultaat.","Het schema-argument beschrijft de input van de tool, niet de conversie van het resultaat.","Een declaration-only tool heeft geen implementatie; de applicatie levert het resultaat zelf.","kwargs bevatten runtime-only invoerwaarden, geen geconverteerd tool-resultaat."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools"},{"id":"2.3.4-05","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Wide World Importers has an agent that uses four price lookup tools. Sometimes a tool returns a negative price or omits the currency. You need to check every price tool result in one place and replace an invalid result with a corrective message before the model uses the result.\n\nWhat should you implement?","choices":["Function middleware that awaits call_next and then validates and overrides context.result","Agent middleware that validates the final agent response after the run completes","An agent instruction that tells the model to ignore negative prices","A context provider that adds the pricing rules to the prompt"],"answer":[0],"explanation":"Function middleware onderschept elke tool-aanroep. Na await call_next() staat het tool-resultaat in context.result; u kunt het daar centraal valideren en vervangen door een corrigerende melding voordat het model het gebruikt.","rationale":["Juist: centrale, deterministische validatie van elk tool-resultaat voordat het model het ziet.","Na afloop van de run heeft het model het ongeldige resultaat al gebruikt.","Een instructie is niet deterministisch en vangt een ontbrekende valuta niet op.","Regels in het prompt valideren de daadwerkelijke tool-resultaten niet."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/exception-handling"},{"id":"2.3.4-06","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. has a normalizer agent that converts tool results into JSON for a downstream agent. The normalizer uses an Azure OpenAI deployment that supports structured outputs. The JSON must strictly match a schema, and the discount_percent value must be between 0 and 30.\n\nWhat should you do?","choices":["Use structured outputs with strict set to true, and check the discount_percent range in application code.","Use structured outputs with strict set to true, and add minimum and maximum keywords to the schema.","Use JSON mode, and add minimum and maximum keywords to the schema.","Use JSON mode, and add an instruction that keeps discount_percent between 0 and 30."],"answer":[0],"explanation":"Structured outputs met strict: true laten het model een JSON Schema exact volgen, maar slechts een subset van JSON Schema wordt ondersteund: minimum en maximum voor numbers horen bij de niet-ondersteunde keywords. De bereikcontrole doet u daarom deterministisch in code. JSON mode garandeert alleen geldige JSON, geen schemaconformiteit.","rationale":["Juist: strikte schemaconformiteit plus deterministische bereikcontrole in code.","minimum en maximum worden niet ondersteund in strict structured outputs.","JSON mode garandeert geen schemaconformiteit, en de keywords worden niet afgedwongen.","JSON mode garandeert geen schema en een instructie dwingt het bereik niet af."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/structured-outputs"},{"id":"2.3.4-07","obj":"2.3.4","difficulty":"hard","type":"single","stem":"Tailspin Toys creates version 3 of a Foundry toolbox that several production agents use. Before you promote version 3 to the default version, you test it by using an MCP client. The initialize call returns HTTP 200, but tools/list returns an empty array.\n\nWhat should you do?","choices":["Keep the current default, and validate a corrected version against its version-specific endpoint.","Promote version 3 to the default version, and configure the agents to retry tools/list on failure.","Set allowed_tools on each agent to the tool names from version 2, and then promote version 3.","Set require_approval to never on the toolbox tools in version 3, and run tools/list again."],"answer":[0],"explanation":"Valideer een toolbox-versie via het versiespecifieke endpoint voordat u die als default promoot. Een lege tools/list betekent dat de versie niet correct is geprovisioned. Laat de huidige default staan, maak een gecorrigeerde versie en valideer die opnieuw.","rationale":["Juist: productie blijft op de werkende versie, en de nieuwe versie wordt eerst gevalideerd.","Een niet goed geprovisionede versie promoten breekt de productie-agents; retries leveren nog steeds geen tools op.","allowed_tools filtert bestaande tools en kan geen tools toevoegen die de versie mist.","Goedkeuringsinstellingen bepalen niet of tools worden geprovisioned."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/toolbox"},{"id":"2.3.4-08","obj":"2.3.4","difficulty":"hard","type":"multi","stem":"Litware, Inc. uses an MCP client in a custom agent. A tool named shipment_status on a remote MCP server declares an output schema. Incidents show agent answers that are based on malformed tool data and on failed tool calls. You need to prevent the agent from basing answers on malformed or failed tool results.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Validate the structured result against the output schema of the tool before you pass the result to the model.","Check the isError field of each tool result, and tell the user what failed when the field is set.","Pass the text content block to the model and ignore the structured result.","Retry the tool call until the result passes validation, without a retry limit.","Ask the model to repair malformed results before it answers."],"answer":[0,1],"explanation":"Valideer tool-resultaten voordat u ze aan het model geeft; heeft de tool een output schema, valideer dan het gestructureerde resultaat daartegen. Controleer daarnaast isError: een antwoord dat op een mislukte tool-aanroep is gebaseerd moet dat aan de gebruiker melden.","rationale":["Juist: schemavalidatie houdt misvormde data uit de context van het model.","Juist: isError signaleert een uitvoeringsfout; de gebruiker hoort te weten wat niet werkte.","De tekst negeren omzeilt juist de schemacontrole.","Onbegrensde retries verbruiken tokens en rate limits; retries moeten een maximum hebben.","Het model laten repareren is niet deterministisch en kan data verzinnen."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.3.4-09","obj":"2.3.4","difficulty":"hard","type":"single","stem":"Coho Winery adds the following function middleware in Microsoft Agent Framework for Python. The middleware must run the get_stock tool and then replace an empty result with a corrective message.\n\n```python\nasync def check_stock_result(\n    context: FunctionInvocationContext,\n    call_next: Callable[[], Awaitable[None]],\n) -> None:\n    <code>\n    if context.function.name == \"get_stock\" and not context.result:\n        context.result = \"Error: get_stock returned no data. Tell the user that the stock level is unavailable.\"\n```\n\nWhich code should you use for <code>?","choices":["await call_next()","context.result = await call_next()","call_next()","return"],"answer":[0],"explanation":"call_next neemt geen argumenten en retourneert niets; middleware muteert het gedeelde context-object en wacht daarna op call_next(). Pas na await call_next() is de tool uitgevoerd en staat het resultaat in context.result, zodat u het kunt valideren en vervangen.","rationale":["Juist: voert de tool uit en vult context.result, waarna de validatie volgt.","call_next retourneert None, waardoor context.result wordt overschreven en het echte resultaat verloren gaat.","Zonder await draait de coroutine niet en wordt de tool niet uitgevoerd.","Return beeindigt de middleware voordat de tool draait en voordat er gevalideerd wordt."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.1-01","obj":"2.4.1","difficulty":"easy","type":"single","stem":"Litware, Inc. builds a contract generation solution. A template agent selects a base template, a clause agent customizes the clauses, a compliance agent reviews the result against regulations, and a risk agent rates the final contract. Each agent requires the complete output of the previous agent, and the order of the agents is fixed.\n\nWhich orchestration pattern should you implement?","choices":["Sequential orchestration","Concurrent orchestration","Handoff orchestration","Group chat orchestration"],"answer":[0],"explanation":"Sequential orchestration (pipeline) koppelt agents in een vooraf bepaalde, lineaire volgorde waarbij elke agent de output van de vorige verwerkt. De vaste volgorde en de afhankelijkheid van de volledige vorige output zijn de doorslaggevende constraints.","rationale":["Juist: een vaste, lineaire pipeline waarin elke stap voortbouwt op de vorige is precies sequential orchestration.","Onjuist: concurrent orchestration laat agents onafhankelijk en tegelijk op dezelfde input werken; hier hangen stappen van elkaar af.","Onjuist: handoff is bedoeld voor situaties waarin de juiste agent pas tijdens verwerking duidelijk wordt; hier ligt de volgorde vast.","Onjuist: group chat is voor discussie en consensus in een gedeelde thread, niet voor een deterministische pipeline."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.1-02","obj":"2.4.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank needs four specialist agents to analyze the same stock ticker: fundamental, technical, sentiment, and ESG analysis. The agents do not depend on each other's output, and the combined recommendation must be returned with the lowest possible latency.\n\nWhich orchestration pattern should you implement?","choices":["Concurrent orchestration that fans out the ticker and aggregates the results","Sequential orchestration that passes the ticker through each agent in turn","Handoff orchestration that starts with the fundamental analysis agent","Magentic orchestration that builds a task ledger before invoking the agents"],"answer":[0],"explanation":"Concurrent orchestration (parallel, fan-out/fan-in) laat agents tegelijk dezelfde taak uitvoeren vanuit hun eigen specialisatie en voegt de resultaten samen. Onafhankelijke analyses plus de latency-eis maken parallelle uitvoering de juiste keuze.","rationale":["Juist: onafhankelijke perspectieven op dezelfde input, parallel uitgevoerd en daarna geaggregeerd, verlaagt de totale doorlooptijd.","Onjuist: sequentieel uitvoeren telt de latency van alle agents bij elkaar op terwijl er geen afhankelijkheden zijn.","Onjuist: bij handoff is er steeds maar een actieve agent; dat past niet bij vier gelijktijdige analyses.","Onjuist: magentic is bedoeld voor open problemen zonder vooraf bekend plan en is traag om te convergeren."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.1-03","obj":"2.4.1","difficulty":"easy","type":"single","stem":"Tailspin Toys builds a customer support solution by using Microsoft Agent Framework. A triage agent, a refund agent, an order agent, and a return agent must be able to transfer the conversation directly to one another without a central orchestrator. The agent that receives the conversation must take full ownership of the task.\n\nWhich Agent Framework orchestration should you use?","choices":["Handoff orchestration","Magentic orchestration","Sequential orchestration","Concurrent orchestration"],"answer":[0],"explanation":"Handoff orchestration in Agent Framework gebruikt intern een mesh-topologie (peer-to-peer) waarin agents rechtstreeks met elkaar verbonden zijn zonder orchestrator. De ontvangende agent krijgt volledige controle en eigenaarschap van de taak.","rationale":["Juist: handoff draagt de controle volledig over tussen gelijkwaardige agents in een mesh, zonder centrale autoriteit.","Onjuist: magentic gebruikt juist een centrale manager-agent die taken toewijst en een ledger bijhoudt.","Onjuist: sequential gebruikt een vaste volgorde; agents kunnen niet zelf bepalen naar wie ze doorzetten.","Onjuist: concurrent laat agents parallel werken en draagt geen eigenaarschap over tussen agents."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.1-04","obj":"2.4.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. builds a research assistant by using Microsoft Agent Framework. A coordinator agent must delegate subtasks to a pricing agent and a legal agent, receive their results, and then compose the final answer itself. The coordinator must retain overall responsibility for the task and pass only the relevant context to each specialist.\n\nWhat should you do?","choices":["Expose each specialist agent as a tool of the coordinator agent","Build a handoff workflow that starts with the coordinator agent","Build a concurrent workflow that uses the default aggregator","Build a group chat workflow that uses a round-robin manager"],"answer":[0],"explanation":"Bij agent-as-tools (orchestrator-subagent) delegeert een primaire agent subtaken aan andere agents en keert de controle daarna terug naar de primaire agent, die het eigenaarschap houdt en zelf bepaalt welke context hij meegeeft. Dat verschilt fundamenteel van handoff, waar de ontvanger het eigenaarschap overneemt.","rationale":["Juist: agent-as-tools houdt de coordinator verantwoordelijk, de controle keert terug en alleen relevante context gaat mee naar de subagent.","Onjuist: bij handoff neemt de ontvangende agent de taak volledig over en krijgt die de volledige context; de coordinator verliest eigenaarschap.","Onjuist: concurrent stuurt dezelfde input naar alle agents en laat geen gerichte, contextafhankelijke delegatie toe.","Onjuist: group chat deelt een accumulerende thread met alle deelnemers in plaats van selectieve context per specialist."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.1-05","obj":"2.4.1","difficulty":"medium","type":"single","stem":"Relecloud uses a hub-and-spoke design in which an employee self-service hub agent routes requests to an HR agent, an IT agent, and a procurement agent. A team proposes that the HR agent should route to a new benefits enrollment agent, which in turn routes to a claims agent. Benefits enrollment requires its own routing logic and instructions that are distinct from general HR. You must minimize latency and context loss.\n\nWhat should you do?","choices":["Connect the benefits enrollment agent directly to the hub as a peer of the HR agent","Connect the benefits enrollment agent to the HR agent and the claims agent to the benefits enrollment agent","Add the benefits enrollment topics and knowledge to the existing HR agent","Replace the hub with a concurrent orchestration that sends every request to every agent"],"answer":[0],"explanation":"In een hub-and-spoke-architectuur wordt aangeraden niet dieper dan twee niveaus te gaan, omdat elke laag latency, contextverlies en routeringsverwarring toevoegt. Omdat benefits enrollment eigen routeringslogica en instructies heeft, hoort het als aparte connected agent direct aan de hub.","rationale":["Juist: een extra spoke op hubniveau houdt de architectuur plat en geeft het domein eigen instructies en routering.","Onjuist: drie of meer niveaus nesting verhoogt latency, maakt debuggen lastiger en laat context degraderen.","Onjuist: de bestaande agent uitbreiden past bij nauw verwante scenario's met gedeelde context, niet bij een domein met eigen routeringslogica.","Onjuist: elk verzoek naar alle agents sturen verspilt resources en lost het routeringsprobleem niet op."],"ref":"https://learn.microsoft.com/microsoft-365/copilot/employee-self-service/connecting-agents-overview"},{"id":"2.4.1-06","obj":"2.4.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. runs a sequential orchestration of four agents that transform insurance claims. The stages have strict dependencies, so the order must be kept. Occasionally the first agent returns malformed or off-topic output, and the later agents process it and produce incorrect results.\n\nWhat should you do?","choices":["Validate each agent output before it is passed to the next agent, and retry or halt the workflow when validation fails","Convert the workflow to a concurrent orchestration so that every agent receives the original claim","Increase the context window of the later agents so that they can detect the error themselves","Add a fifth agent at the end of the pipeline that rewrites the final result"],"answer":[0],"explanation":"Bij sequential orchestration propageren fouten uit vroege stappen naar latere stappen. De richtlijn is om agent-output te valideren voordat die naar de volgende agent gaat en bij lage kwaliteit te retryen, verduidelijking te vragen of de workflow te stoppen.","rationale":["Juist: validatie tussen stappen voorkomt dat slechte input door de pipeline cascadeert, terwijl de vereiste volgorde blijft.","Onjuist: concurrent orchestration breekt de afhankelijkheden tussen de stappen, terwijl de volgorde behouden moet blijven.","Onjuist: een groter context window detecteert geen foutieve input; het probleem blijft doorstromen.","Onjuist: een extra agent aan het einde corrigeert symptomen pas nadat foutieve tussenresultaten al verwerkt zijn."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.1-07","obj":"2.4.1","difficulty":"hard","type":"multi","stem":"Northwind Traders implements a peer-to-peer support solution by using the Agent Framework HandoffBuilder in Python. Users report that conversations bounce repeatedly between the order agent and the return agent before a response is produced. Each agent must still be able to transfer control dynamically, and only one agent can be active at a time.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Configure explicit handoff rules by using add_handoff so that the specialist agents can hand off only to the triage agent","Define a termination condition for the handoff workflow","Enable autonomous mode for every participant","Share a single AgentSession instance across all participants","Replace the handoff workflow with a concurrent workflow"],"answer":[0,1],"explanation":"Handoff is gevoelig voor oneindige handoff-loops. Met add_handoff beperk je welke agents naar wie mogen doorzetten, en een termination condition beeindigt de workflow wanneer het gesprek een bepaalde toestand bereikt; beide behouden dynamische routering met een actieve agent.","rationale":["Juist: expliciete handoff-regels beperken de routes en voorkomen het heen-en-weer kaatsen tussen specialisten.","Juist: een termination condition stopt de workflow zodra aan een eindvoorwaarde is voldaan.","Onjuist: autonomous mode laat agents doorgaan zonder gebruikersinput en vergroot juist de kans op langdurige loops.","Onjuist: in handoff delen agents bewust geen sessie-instantie; context wordt gesynchroniseerd door berichten te broadcasten.","Onjuist: concurrent laat meerdere agents tegelijk werken, terwijl er maar een actieve agent mag zijn."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.1-08","obj":"2.4.1","difficulty":"hard","type":"single","stem":"Adventure Works Cycles uses an Agent Framework handoff workflow in which a triage agent routes questions to a parts agent and a warranty agent. A new requirement states that the triage agent must combine the results of one or both specialists into a single final answer in the same turn, and it must remain the owner of the conversation. The specialists to call must still be selected dynamically per request.\n\nWhat should you do?","choices":["Expose the parts agent and the warranty agent as tools of the triage agent","Call enable_return_to_previous(False) on the handoff builder","Enable autonomous mode for the triage agent","Replace the handoff workflow with a sequential workflow that runs every specialist"],"answer":[0],"explanation":"Bij handoff gaat het eigenaarschap volledig over naar de ontvangende agent, dus de triage-agent kan het eindantwoord niet zelf samenstellen. Met agent-as-tools houdt de primaire agent de verantwoordelijkheid, kiest hij dynamisch welke subagents hij aanroept en keert de controle na elke subtaak naar hem terug.","rationale":["Juist: agent-as-tools laat de triage-agent dynamisch specialisten aanroepen en zelf het gecombineerde antwoord formuleren.","Onjuist: dit stuurt alleen gebruikersantwoorden eerst via de startagent; de specialist blijft eigenaar van zijn antwoord.","Onjuist: autonomous mode laat een agent doorgaan zonder gebruikersinput, maar verandert het eigenaarschapsmodel van handoff niet.","Onjuist: een sequentiele workflow roept altijd alle specialisten aan in vaste volgorde, terwijl de selectie dynamisch moet blijven."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.1-09","obj":"2.4.1","difficulty":"hard","type":"single","stem":"Lucerne Publishing designs a document generation solution. A template must be selected first, and grounded content must then be generated from that template. After generation, five independent compliance checks must run, and their findings must be combined before a final formatting agent runs. The checks write to separate data stores, and you must minimize end-to-end latency.\n\nWhich orchestration design should you implement?","choices":["A sequential pipeline in which the compliance stage fans out to five parallel agents and fans in before the formatting agent","A single concurrent orchestration that runs the template, generation, compliance, and formatting agents in parallel","A handoff orchestration in which each agent decides which agent runs next","A group chat orchestration in which a chat manager selects the next speaker"],"answer":[0],"explanation":"Verschillende fasen van een workload kunnen verschillende patronen nodig hebben; je combineert ze in plaats van alles in een patroon te dwingen. De afhankelijke stappen blijven sequentieel, terwijl de onafhankelijke compliance-checks zonder gedeelde state parallel lopen om latency te verlagen.","rationale":["Juist: sequentieel waar afhankelijkheden zijn en fan-out/fan-in voor de onafhankelijke checks combineert correctheid met lage latency.","Onjuist: alles parallel uitvoeren negeert dat generatie afhangt van het template en formattering van de bevindingen.","Onjuist: handoff maakt de routering onvoorspelbaar terwijl de volgorde hier deterministisch vastligt, en er is steeds maar een actieve agent.","Onjuist: group chat voegt discussie-overhead toe en is niet geschikt voor deterministische pipelines met parallelle stappen."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.2-01","obj":"2.4.2","difficulty":"easy","type":"single","stem":"Wide World Importers builds a returns agent by using Microsoft Agent Framework in Python. The agent has a process_refund function tool. A human operator must approve every call to process_refund before the function runs.\n\nWhat should you do?","choices":["Decorate the function with @tool(approval_mode=\"always_require\")","Add an instruction to the agent prompt that asks the user to confirm each refund","Set include_detailed_errors to True on the function invocation configuration","Register function middleware that logs each refund call"],"answer":[0],"explanation":"In Agent Framework markeer je een tool met approval_mode=\"always_require\"; de workflow pauzeert dan en emit een request_info-event met een function_approval_request dat een mens goed- of afkeurt. Een promptinstructie alleen dwingt geen goedkeuring af.","rationale":["Juist: approval_mode always_require laat de framework de tool-call pauzeren tot er een expliciete goedkeuring is.","Onjuist: een promptinstructie is niet afdwingbaar; het model kan de tool alsnog aanroepen.","Onjuist: include_detailed_errors bepaalt alleen hoeveel foutdetails naar het model gaan.","Onjuist: loggen registreert de aanroep maar blokkeert die niet tot goedkeuring."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/sequential"},{"id":"2.4.2-02","obj":"2.4.2","difficulty":"easy","type":"single","stem":"Trey Research connects a Foundry Agent Service agent to a remote MCP server that exposes get_ticket, search_tickets, update_ticket, and close_ticket. The read operations get_ticket and search_tickets must run without approval. The write operations must require developer approval for each call.\n\nWhich value should you configure for the require_approval property of the mcp tool?","choices":["{\"never\": [\"get_ticket\", \"search_tickets\"]}","\"never\"","{\"never\": [\"update_ticket\", \"close_ticket\"]}","Omit require_approval and set allowed_tools to [\"update_ticket\", \"close_ticket\"]"],"answer":[0],"explanation":"require_approval accepteert een object met een lijst tools die geen goedkeuring nodig hebben; alle andere tools vallen dan onder goedkeuring. Zo draaien de leesoperaties direct en vereisen de schrijfoperaties per aanroep approval.","rationale":["Juist: de leestools staan in de never-lijst, waardoor alleen de schrijftools een mcp_approval_request opleveren.","Onjuist: \"never\" schakelt goedkeuring uit voor alle tools, ook voor de schrijfoperaties.","Onjuist: deze lijst draait de logica om en laat juist de schrijfoperaties zonder goedkeuring lopen.","Onjuist: allowed_tools beperkt welke tools de agent mag gebruiken; de leestools zouden dan helemaal niet meer beschikbaar zijn."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"2.4.2-03","obj":"2.4.2","difficulty":"easy","type":"single","stem":"Margie's Travel uses a Magentic orchestration in Microsoft Agent Framework to plan complex itineraries. Agents in the workflow can book hotels and flights. A travel consultant must review and approve or revise the plan that the manager agent creates before any agent executes tasks.\n\nWhat should you configure?","choices":["Plan review on the Magentic workflow","Tool approval on each booking tool","A max_reset_count value of 0","Intermediate outputs from every participant"],"answer":[0],"explanation":"Magentic biedt optionele human-in-the-loop plan review: de manager maakt een plan en een mens kan dat goedkeuren of aanpassen voordat de agents het uitvoeren. Dit is het juiste goedk

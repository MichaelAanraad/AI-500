sults back to the model during a multi-turn tool calling sequence.\n\nWhich type of middleware should you implement?","choices":["Chat middleware","Function middleware","Agent middleware registered at the run level","Agent middleware registered at the agent level"],"answer":[0],"explanation":"Chat middleware onderschept de onderliggende chat-requests naar het model en draait binnen de function invocation loop. Daardoor wordt het voor elke model-call uitgevoerd, ook voor calls die tool-resultaten terugsturen.","rationale":["Juist: chat middleware ziet de ruwe berichten van elke afzonderlijke model-call.","Onjuist: function middleware onderschept tool-calls, niet de requests naar het model.","Onjuist: agent middleware draait eenmaal per run en ziet de tussenliggende model-calls niet afzonderlijk.","Onjuist: ook op agentniveau wikkelt agent middleware de run en niet elke model-call."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.8-03","obj":"2.4.8","difficulty":"easy","type":"single","stem":"Wide World Importers has many Agent Framework agents that call an unstable shipping tool. When the tool raises a transient exception, every agent must return a consistent, user-friendly fallback response. The behavior must be reusable across the solution.\n\nWhat should you do?","choices":["Implement middleware that catches the exception and sets a fallback result","Add exception handling and a fallback message inside each tool function","Set include_detailed_errors to True on the chat client of each agent","Increase max_iterations on the chat client of each agent"],"answer":[0],"explanation":"Middleware is de natuurlijke plek voor foutafhandeling, retry-logica en graceful degradation over alle agents heen. Door call_next in exception handling te plaatsen en een fallback-resultaat te zetten, implementeer je dit eenmalig en herbruikbaar.","rationale":["Juist: herbruikbare middleware vangt de exception centraal af en levert een consistente fallback.","Onjuist: foutafhandeling per tool is niet centraal herbruikbaar en leidt tot inconsistent gedrag.","Onjuist: gedetailleerde fouten tonen meer foutinformatie aan het model maar leveren geen fallback.","Onjuist: meer iteraties verandert niets aan de exception van de tool."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/exception-handling"},{"id":"2.4.8-04","obj":"2.4.8","difficulty":"medium","type":"single","stem":"Adventure Works Cycles adds audit logging to a C# agent built with Microsoft Agent Framework. The middleware only needs to log the incoming messages of each run before they reach the agent. The developer registers it as follows.\n\n```csharp\nvar auditedAgent = baseAgent\n    .AsBuilder()\n    .Use(runFunc: AuditInputMiddleware, runStreamingFunc: null)\n    .Build();\n```\n\nAfter deployment, users of the chat UI report that streamed answers now appear all at once. One middleware function must handle both streaming and non-streaming runs.\n\nWhat should you do?","choices":["Register the logging logic by using the Use(sharedFunc: ...) overload.","Register the logging logic as function calling middleware on the agent.","Register the logging logic as IChatClient middleware on the chat client of the agent.","Keep the registration and call RunStreamingAsync on the inner agent inside AuditInputMiddleware."],"answer":[0],"explanation":"Als alleen runFunc wordt opgegeven, gebruikt de agent die middleware voor beide aanroepvormen en draait streaming in non-streaming modus. De overload Use(sharedFunc: ...) gebruikt dezelfde middleware voor streaming en non-streaming zonder streaming te blokkeren; die kan de output niet onderscheppen, wat voor alleen invoer loggen ook niet nodig is.","rationale":["Juist: shared middleware inspecteert de invoer en laat streaming intact.","Fout: function calling middleware ziet alleen tool-aanroepen, niet de invoerberichten van elke run.","Fout: IChatClient middleware onderschept elke inference-aanroep naar het model, ook binnen de tool-loop, en niet de invoer van elke agent run.","Fout: zonder runStreamingFunc draait een streaming-aanroep nog steeds in non-streaming modus, ongeacht wat de middleware intern aanroept."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.8-05","obj":"2.4.8","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. registers agent middleware A1 and A2 at the agent level of an Agent Framework agent in Python. For one specific request, the developer also passes run middleware R1 and R2 to agent.run().\n\nWhich execution order should you expect?","choices":["A1 -> A2 -> R1 -> R2 -> Agent -> R2 -> R1 -> A2 -> A1","R1 -> R2 -> A1 -> A2 -> Agent -> A2 -> A1 -> R2 -> R1","A1 -> R1 -> A2 -> R2 -> Agent -> R2 -> A2 -> R1 -> A1","A1 -> A2 -> R1 -> R2 -> Agent -> A1 -> A2 -> R1 -> R2"],"answer":[0],"explanation":"Agent-level middleware wikkelt run-level middleware: agent middleware is de buitenste laag, run middleware de binnenste. Na de agent wordt de keten in omgekeerde volgorde afgewikkeld.","rationale":["Juist: eerst de agent-level keten, dan de run-level keten, en daarna in spiegelbeeld terug.","Onjuist: run-level middleware is de binnenste laag, niet de buitenste.","Onjuist: de lagen worden niet afwisselend genest; elke scope vormt een eigen keten.","Onjuist: middleware wordt op de terugweg in omgekeerde volgorde afgewikkeld, niet in dezelfde volgorde."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.8-06","obj":"2.4.8","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. hosts a multi-tenant Agent Framework solution. Tools must receive the tenant ID of the authenticated caller for authorization checks. The model must not be able to supply or change the tenant ID, and the solution must work for every agent.\n\nWhat should you do?","choices":["Set the tenant ID in context.function_invocation_kwargs in agent middleware","Add a tenant_id parameter to each tool so that the model supplies the value","Add the tenant ID of the caller to the instructions of each agent","Append a message that contains the tenant ID in chat middleware"],"answer":[0],"explanation":"function_invocation_kwargs in agent middleware zijn runtimewaarden die naar tools worden doorgestuurd en via FunctionInvocationContext beschikbaar zijn. Die context-parameter is verborgen in het schema dat het model ziet, zodat het model de waarde niet kan aanleveren of wijzigen.","rationale":["Juist: runtime-only waarden via middleware bereiken de tools zonder dat het model ze ziet of beinvloedt.","Onjuist: normale functieparameters worden door het model ingevuld en kunnen dus gemanipuleerd worden.","Onjuist: instructies zijn zichtbaar voor het model en geen betrouwbare autorisatiebron.","Onjuist: een extra bericht maakt de tenant-ID onderdeel van de prompt, waar het model het kan herhalen of aanpassen."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/runtime-context"},{"id":"2.4.8-07","obj":"2.4.8","difficulty":"hard","type":"single","stem":"Humongous Insurance registers two function middleware components on an Agent Framework agent in Python, in this order: SecurityPolicyMiddleware, which approves tool arguments against policy, and ArgumentRepairMiddleware, which fixes malformed JSON arguments from the model. Tool calls with repaired arguments now fail with MiddlewareFailure.\n\nWhat should you do?","choices":["Register ArgumentRepairMiddleware before SecurityPolicyMiddleware","Remove SecurityPolicyMiddleware from the agent","Set include_detailed_errors to True on the chat client","Move ArgumentRepairMiddleware to chat middleware"],"answer":[0],"explanation":"Middleware die argumenten repareert moet voor security- of policy-middleware draaien. Argumentwijzigingen na de securityverwerking falen gesloten met MiddlewareFailure, omdat de goedgekeurde argumenten dan niet meer overeenkomen.","rationale":["Juist: eerst repareren en daarna de beveiligingscontrole uitvoeren op de definitieve argumenten.","Onjuist: de securitycontrole verwijderen lost de fout op door een vereiste beveiliging op te heffen.","Onjuist: meer foutdetails veranderen de fail-closed controle niet.","Onjuist: chat middleware onderschept model-requests en heeft geen toegang tot de tool-argumenten in de function context."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/runtime-context"},{"id":"2.4.8-08","obj":"2.4.8","difficulty":"hard","type":"multi","stem":"Northwind Traders needs audit logging for every run of its Agent Framework agents. For one troubleshooting session, the support team also wants verbose diagnostic logging that applies to a single request only. The solution must keep the agent logic unchanged.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Register the audit logging middleware at the agent level when you create the agent","Pass the diagnostic logging middleware in the middleware parameter of agent.run() for the request","Add audit logging code to each tool function","Register the diagnostic logging middleware at the agent level and remove it after the session","Set FunctionInvocationContext.Terminate to true when diagnostic logging is active"],"answer":[0,1],"explanation":"Agent-level middleware geldt persistent voor alle runs en wordt eenmalig geconfigureerd. Run-level middleware geef je mee aan een specifieke run voor maatwerk per request, zonder de agentlogica te wijzigen.","rationale":["Juist: audit logging op agentniveau is van toepassing op elke run.","Juist: run-level middleware geldt alleen voor het specifieke request.","Onjuist: logging in elke tool wijzigt de agentlogica en is niet herbruikbaar.","Onjuist: agent-level registratie geldt voor alle runs en treft ook andere requests.","Onjuist: Terminate beeindigt de function calling loop en kan de chatgeschiedenis inconsistent maken."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"3.1.1-01","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has a claims-triage agent in a Microsoft Foundry project. The compliance team wants to review agent responses by answering a fixed set of questions for each response, including a 1-5 helpfulness slider, a multiple-choice correctness rating, and a free-form comment.\n\nWhich Foundry feature should you configure?","choices":["A human evaluation template for the agent","Thumbs up or thumbs down trace annotations","A continuous evaluation rule for the agent","A custom prompt-based evaluator"],"answer":[0],"explanation":"Een human evaluation template in het Human Evaluation-tabblad laat de agent builder vragen definieren van het type thumbs up/down, slider, multiple choice en free-form text. Reviewers vullen het actieve template per agent response in. De eis van gestructureerde vragen met meerdere vraagtypen wijst naar dit template.","rationale":["Juist: templates ondersteunen precies slider, multiple choice en free-form vragen die door mensen worden ingevuld.","Trace annotations gebruiken het standaard binaire thumbs up/down scoring template en ondersteunen geen slider of multiple choice vragenlijst.","Continuous evaluation scoort productieverkeer automatisch met evaluators, niet met menselijke beoordelaars.","Een prompt-based evaluator gebruikt een LLM als judge en is dus geen menselijk reviewproces."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-02","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. created an active human evaluation template for Agent1 in a Microsoft Foundry project. User1 is a data scientist who must open the agent preview web app and submit feedback. You must follow the principle of least privilege.\n\nWhich role should you assign to User1 on the Foundry project?","choices":["Foundry User","Foundry Owner","Foundry Project Manager","Monitoring Metrics Publisher"],"answer":[0],"explanation":"Human reviewers hebben minimaal de rol Foundry User op het Foundry project nodig (plus Reader op het account) om de preview web app te openen en feedback in te dienen. Foundry Project Manager is nodig voor het maken en beheren van templates, niet voor het beoordelen.","rationale":["Juist: Foundry User is de minimale rol voor reviewers van de preview web app.","Foundry Owner geeft veel meer rechten dan nodig en schendt least privilege.","Foundry Project Manager is de rol voor de agent builder die templates maakt en beheert; voor een reviewer is dat te veel.","Monitoring Metrics Publisher is nodig voor een identiteit die telemetry via Entra ID naar Application Insights stuurt, niet voor een reviewer."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-03","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Tailspin Toys has set a human evaluation template as active for a support agent in Microsoft Foundry. Reviewers must chat with the agent and complete the template questions for each response they receive during the chat.\n\nWhich experience should the reviewers use to perform the evaluation?","choices":["The preview web app, by selecting Feedback after each response","The trace detail page, by selecting Annotate on each trace","The Evaluation page, by creating an evaluation run for the agent","The Application Insights Logs blade, by running a KQL query"],"answer":[0],"explanation":"Na activering van een template openen reviewers via Preview in de agent builder een browser-based chat interface. Na elk antwoord selecteren ze Feedback, waarna een zijpaneel het actieve template toont. Dat combineert chatten en het invullen van de vragen.","rationale":["Juist: de preview web app toont het actieve template in een zijpaneel via de Feedback-knop.","Annotate op de trace detail page voegt een thumbs up/down annotation toe aan bestaande traces, niet de templatevragen tijdens een chat.","De Create evaluation wizard start een geautomatiseerde evaluatierun met evaluators, geen menselijke review per antwoord.","KQL in Application Insights is bedoeld om feedback te analyseren, niet om die in te voeren."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-04","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Relecloud has a multi-agent travel solution that sends traces to Application Insights connected to a Microsoft Foundry project. Domain experts want to mark individual historical agent interactions as helpful or unhelpful starting today, without creating any configuration first.\n\nWhat should the domain experts use?","choices":["The Annotate button on the trace detail page","A new human evaluation template in the agent builder","A gen_ai.evaluation.result event emitted from application code","A Task Completion evaluator run over the existing traces"],"answer":[0],"explanation":"Elk Foundry project heeft een vooraf aangemaakt standaard thumbs up/down scoring template, zodat builders en domeinexperts direct traces kunnen annoteren via Tracing en de Annotate-knop. Er is geen extra setup nodig en het werkt op bestaande traces.","rationale":["Juist: de Annotate-knop gebruikt het vooraf aangemaakte standaard thumbs up/down scoring template en werkt direct op bestaande traces.","Een human evaluation template moet eerst gemaakt en geactiveerd worden en werkt in de preview web app op nieuwe antwoorden, niet op historische traces.","Een gen_ai.evaluation.result event vanuit code is bedoeld voor end-user feedback en vereist code-aanpassingen.","Task Completion is een geautomatiseerde LLM-judge evaluator, geen menselijk oordeel."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.1-05","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank created two human evaluation templates for Agent1 in Microsoft Foundry: Template1 contains accuracy questions and Template2 contains compliance questions. After you set Template2 as active, reviewers report that the accuracy questions no longer appear. Reviewers must answer both sets of questions for every response in the same session.\n\nWhat should you do?","choices":["Merge both sets of questions into one template and set it as active","Set both Template1 and Template2 as active for Agent1","Assign the reviewers the Foundry Project Manager role on the project","Create a second agent version and assign Template1 to that version"],"answer":[0],"explanation":"Er kan maar een template tegelijk actief zijn; het activeren van een nieuw template deactiveert automatisch het vorige. Om beide vragensets in dezelfde sessie te tonen, moeten de vragen in een enkel template staan dat actief is.","rationale":["Juist: een gecombineerd actief template toont alle vragen tegelijk aan reviewers.","Twee templates tegelijk actief zetten kan niet; activeren van het ene deactiveert het andere.","Rollen beinvloeden het beheer van templates, niet hoeveel templates actief kunnen zijn.","Een tweede agent version splitst de review over twee agents en voldoet niet aan beide sets per antwoord in dezelfde sessie."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-06","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Litware, Inc. runs a human evaluation program for a contract-review agent in Microsoft Foundry. Auditors require that all reviewer answers be kept for three years. The connected Application Insights resource is shared with other teams, and you must not change its retention configuration.\n\nWhat should you do?","choices":["Use Download Results for each template and store the CSV files in Azure Blob Storage","Increase the data retention period of the Application Insights resource","Set the evaluation template as inactive to freeze the stored results","Export the template definition and store it in Azure Blob Storage"],"answer":[0],"explanation":"Human evaluation data wordt opgeslagen in Application Insights en volgt de retentie daarvan. Microsoft adviseert de data te downloaden en elders te bewaren als je die lang nodig hebt. Download Results exporteert een CSV met timestamp, prompt, response, vragen en antwoorden per instantie.","rationale":["Juist: de CSV-export bevat alle resultaten en kan buiten Application Insights langdurig worden bewaard.","Retentie aanpassen werkt technisch, maar de stem verbiedt wijziging van de gedeelde resource.","Inactief zetten stopt alleen het verzamelen van nieuwe resultaten; bestaande data blijft onder de retentie van Application Insights vallen.","De templatedefinitie bevat alleen de vragen, niet de antwoorden van reviewers."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-07","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders has a customer-facing web app that calls a Foundry agent and has OpenTelemetry tracing to Application Insights. End users can select thumbs up or thumbs down on each answer. The feedback must appear as annotations on the matching trace in the Foundry portal, next to builder annotations, and must be filterable by source.\n\nWhat should you do?","choices":["Emit a gen_ai.evaluation.result event in the same trace context, with the source set to end_user","Create a human evaluation template and embed the preview web app in the customer-facing app","Store the feedback in Azure Cosmos DB and join it to the traces by using the conversation ID","Send the feedback to the agent as a new user message in the same conversation thread"],"answer":[0],"explanation":"End-user feedback wordt gelogd als een gen_ai.evaluation.result OpenTelemetry event dat binnen dezelfde trace context wordt uitgestuurd, zodat het op de juiste trace verschijnt. De source-attribuut end_user maakt het filterbaar naast builder annotations.","rationale":["Juist: het OTel event in dezelfde trace context koppelt de feedback aan de trace en markeert de bron als end_user.","De preview web app is bedoeld voor interne reviewers met een Foundry-rol, niet voor eindgebruikers van een publieke app.","Een losse database levert geen annotations op de trace in de Foundry portal op.","Feedback als bericht naar de agent sturen verandert het gesprek en maakt geen annotation."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.1-08","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Adatum Corporation logs end-user feedback from App1 as trace annotations. The connected Application Insights resource requires Microsoft Entra ID authentication for ingestion. App1 runs with a managed identity, and each programmatic annotation fails with a 403 error. Traces from other components arrive correctly.\n\nWhich role should you assign to the managed identity of App1 on the Application Insights resource?","choices":["Monitoring Metrics Publisher","Log Analytics Reader","Privileged Monitoring Data Reader","Reader"],"answer":[0],"explanation":"Voor programmatic annotations met Entra-geauthenticeerde ingestion heeft de identiteit die telemetry uitstuurt de rol Monitoring Metrics Publisher nodig op de verbonden Application Insights resource. Een 401/403 wijst op ontbrekende schrijfrechten, niet op leesrechten.","rationale":["Juist: Monitoring Metrics Publisher geeft de schrijfrechten voor telemetry-ingestion via Entra ID.","Log Analytics Reader geeft alleen leesrechten om traces te bekijken.","Privileged Monitoring Data Reader is voor het lezen van beschermde trace-inhoud, niet voor schrijven.","Reader geeft leesrechten op de resource; de documentatie waarschuwt dat een extra reader-rol geen telemetry-write toegang geeft."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.1-09","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Contoso, Ltd. is piloting human evaluation for Agent1 in Microsoft Foundry. Application Insights is connected to the project. A template named Template1 was created and appears in the template table. Two reviewers report issues:\n\n- User1 cannot open the agent preview web app.\n- User2 opens the preview web app and receives agent responses, but no Feedback button appears after the responses.\n\nYou must follow the principle of least privilege.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Assign User1 the Foundry User role on the Foundry project.","Select Set as active for Template1 in the template table.","Assign User1 the Monitoring Metrics Publisher role on the Application Insights resource.","Assign User2 the Log Analytics Reader role on the Application Insights resource.","Increase the data retention period of the Application Insights resource."],"answer":[0,1],"explanation":"Een reviewer zonder toegang tot de preview web app mist de rol Foundry User op het project. Als de Feedback-knop ontbreekt, is er geen actief template: een nieuw template staat standaard op Inactive en moet met Set as active worden geactiveerd.","rationale":["Juist: Foundry User is de minimale rol om de preview web app te openen en feedback in te dienen.","Juist: nieuwe templates zijn Inactive; zonder actief template verschijnt de Feedback-knop niet.","Monitoring Metrics Publisher is voor telemetry-emitting identiteiten, niet voor toegang tot de preview web app.","Log Analytics Reader helpt bij het bekijken van traces, maar laat de Feedback-knop niet verschijnen.","Retentie bepaalt hoe lang data bewaard blijft en heeft geen invloed op de Feedback-knop."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/troubleshooting"},{"id":"3.1.1-10","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. is setting up a new Foundry project for a procurement agent. Compliance team members must review agent responses by using structured questions, and the results must be exported for offline analysis. Application Insights is not yet connected to the project.\n\nWhich sequence of actions should you perform?","choices":["Connect Application Insights to the project -> Create a template in the Human Evaluation tab -> Set the template as active -> Reviewers submit Feedback in the preview web app -> Select Download Results","Create a template in the Human Evaluation tab -> Reviewers submit Feedback in the preview web app -> Set the template as active -> Connect Application Insights to the project -> Select Download Results","Create a template in the Human Evaluation tab -> Set the template as active -> Reviewers submit Feedback in the preview web app -> Select Download Results -> Connect Application Insights to the project","Connect Application Insights to the project -> Reviewers submit Feedback in the preview web app -> Create a template in the Human Evaluation tab -> Set the template as active -> Select Download Results"],"answer":[0],"explanation":"Application Insights is een prerequisite omdat human evaluation data daar wordt opgeslagen. Daarna maak je het template, activeer je het (nieuwe templates zijn Inactive), laten reviewers via Feedback in de preview web app hun antwoorden achter en download je de resultaten als CSV.","rationale":["Juist: dit volgt prerequisites, template maken, activeren, reviewen en exporteren.","Reviewers kunnen geen feedback geven voordat het template actief is, en zonder Application Insights wordt niets opgeslagen.","Application Insights moet als eerste verbonden zijn; anders zijn er geen resultaten om te downloaden.","Zonder actief template verschijnt de Feedback-knop niet, dus reviewen voor het maken van het template werkt niet."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-11","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys emits end-user thumbs-down feedback from App1 by using the following event attributes.\n\n```json\n{\n  \"gen_ai.evaluation.name\": \"task_completion\",\n  \"gen_ai.evaluation.score.value\": 0.0,\n  \"gen_ai.evaluation.score.label\": \"fail\",\n  \"microsoft.gen_ai.human_evaluation.source\": \"end_user\",\n  \"microsoft.gen_ai.evaluation.actor.type\": \"human\",\n  \"gen_ai.response.id\": \"<response id>\",\n  \"operation_Id\": \"<value 1>\",\n  \"operation_ParentId\": \"<value 2>\"\n}\n```\n\nThe events are ingested, but the annotations appear on unrelated traces in the Foundry portal.\n\nWhat should you use for value 1 and value 2?","choices":["The trace ID of the annotated interaction for value 1, and the span ID of the annotated span for value 2","The span ID of the annotated span for value 1, and the trace ID of the annotated interaction for value 2","The agent ID for value 1, and the agent version for value 2","The conversation ID for value 1, and the response ID for value 2"],"answer":[0],"explanation":"operation_Id koppelt de annotation aan de oorspronkelijke trace (trace ID) en operation_ParentId aan de specifieke span (span ID). Het event moet in dezelfde trace context worden uitgestuurd; bij annotations op de verkeerde trace moet je operation_Id, operation_ParentId en gen_ai.response.id controleren.","rationale":["Juist: operation_Id = trace ID en operation_ParentId = span ID volgens het annotation attribute schema.","Dit verwisselt trace ID en span ID, waardoor de correlatie niet klopt.","Agent ID en versie horen in gen_ai.agent.id en gen_ai.agent.version, niet in de operation-velden.","Een conversation ID is geen trace ID, en de response ID heeft al een eigen attribuut gen_ai.response.id."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.1-12","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank collects thumbs up or thumbs down annotations from both builders in the Foundry portal and end users in App1. The quality lead needs an hourly pass rate split by feedback source, displayed on an Azure dashboard, and an automated alert when the end-user pass rate drops. Reviewers must not perform manual exports.\n\nWhat should you do?","choices":["Run a KQL query on gen_ai.evaluation.result events in Application Insights, grouped by source","Select Download Results in the Human Evaluation tab every hour and load the CSV into the dashboard","Filter the trace list in the Foundry portal by source and by score label every hour","Run a Customer Satisfaction evaluator every hour over the traces of the agent"],"answer":[0],"explanation":"Alle annotations worden gepubliceerd naar Azure Monitor / Application Insights als gen_ai.evaluation.result events. Met KQL kun je per bron en per tijdsinterval pass rates berekenen en daarop dashboards en alerts bouwen, zonder handmatige stappen.","rationale":["Juist: KQL op Application Insights ondersteunt aggregatie per source, dashboards en alerts.","Handmatige CSV-exports zijn verboden door de stem en zijn bovendien voor template-resultaten, niet voor trace annotations.","Filteren in de trace-lijst is handmatig en levert geen dashboard of alert op.","Customer Satisfaction is een LLM-judge die tevredenheid voorspelt; het meet niet de menselijke feedback zelf."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.2-01","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Litware, Inc. has a payments agent that calls a function tool to create refunds. A test must confirm that every tool call parameter is grounded, has the correct type and format, includes the required parameters, and contains no unexpected parameters.\n\nWhich evaluator should you use?","choices":["Tool Input Accuracy","Tool Selection","Tool Call Success","Tool Output Utilization"],"answer":[0],"explanation":"Tool Input Accuracy controleert alle tool call parameters op zes strikte criteria: groundedness, type compliance, format compliance, required parameters, geen onverwachte parameters en value appropriateness. Dat sluit precies aan bij de eis.","rationale":["Juist: Tool Input Accuracy valideert de parameters strikt.","Tool Selection beoordeelt of de juiste tools zijn gekozen, niet de parameters.","Tool Call Success detecteert technische fouten bij uitvoering, niet de juistheid van parameters.","Tool Output Utilization beoordeelt hoe de agent tool-resultaten gebruikt."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.1.2-02","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Relecloud has an inventory agent that calls an MCP tool to get stock levels. Traces show that the tool calls succeed with correct parameters, but the final answers often state stock numbers that differ from the values returned by the tool. You need an evaluator that detects this specific failure.\n\nWhich evaluator should you use?","choices":["Tool Output Utilization","Tool Call Success","Tool Input Accuracy","Intent Resolution"],"answer":[0],"explanation":"Tool Output Utilization meet of de agent de resultaten van tool calls correct interpreteert en gebruikt in de redenering en het eindantwoord. De tool calls zelf slagen en hebben juiste parameters, dus het probleem zit in het gebruik van de output.","rationale":["Juist: dit evaluator detecteert verkeerd gebruik van tool-resultaten in het antwoord.","Tool Call Success zou slagen omdat de calls technisch lukken.","Tool Input Accuracy zou slagen omdat de parameters correct zijn.","Intent Resolution meet of de gebruikersintentie juist is herkend, niet of tool-data juist is overgenomen."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.1.2-03","obj":"3.1.2","difficulty":"hard","type":"single","stem":"Tailspin Toys has a booking orchestrator agent. A regression test must confirm that the agent calls search_flights before book_flight. Extra calls such as get_weather between or around them are acceptable. You configure the following testing criteria.\n\n```python\n{\n    \"type\": \"azure_ai_evaluator\",\n    \"name\": \"task_navigation_efficiency\",\n    \"evaluator_name\": \"builtin.task_navigation_efficiency\",\n    \"initialization_parameters\": {\n        \"matching_mode\": \"<value>\"\n    },\n    \"data_mapping\": {\n        \"actions\": \"{{item.actions}}\",\n        \"expected_actions\": \"{{item.expected_actions}}\"\n    },\n}\n```\n\nWhat should you do?","choices":["Set matching_mode to in_order_match.","Set matching_mode to exact_match.","Set matching_mode to any_order_match.","Replace the evaluator with builtin.tool_selection."],"answer":[0],"explanation":"Task Navigation Efficiency vergelijkt het traject van de agent met expected_actions. in_order_match vereist dat alle verwachte stappen in de juiste volgorde voorkomen, terwijl extra stappen zijn toegestaan. Dat past bij de eis van volgorde plus toegestane extra calls.","rationale":["Juist: in_order_match controleert de volgorde en staat extra stappen toe.","exact_match eist exacte overeenkomst in volgorde en inhoud, dus get_weather zou de test laten falen.","any_order_match controleert de volgorde niet, terwijl search_flights voor book_flight moet komen.","Tool Selection beoordeelt of de juiste tools zijn gekozen, maar niet de volgorde ten opzichte van een verwacht traject."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.1.2-04","obj":"3.1.2","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. has a Foundry agent that uses the built-in Azure AI Search tool to retrieve policy documents. You plan to add Tool Call Accuracy and Groundedness evaluators to the evaluation runs. The evaluation results for the retrieval step must be reliable, and the agent must keep querying the same Azure AI Search index.\n\nWhat should you do?","choices":["Call the index through a function tool instead of the built-in Azure AI Search tool","Keep the built-in Azure AI Search tool and use a reasoning model as the LLM judge","Keep the built-in Azure AI Search tool and replace Tool Call Accuracy with Tool Call Success","Keep the built-in Azure AI Search tool and use Tool Selection instead of Tool Call Accuracy"],"answer":[0],"explanation":"Agent evaluators ondersteunen File Search, Function Tool, MCP en Knowledge-based MCP. Azure AI Search heeft beperkte ondersteuning: vermijd tool_call_accuracy, tool_call_success en groundedness bij gesprekken met deze tool. Door de index via een function tool aan te roepen wordt de tool call wel evalueerbaar.","rationale":["Juist: een function tool (user-defined tool) wordt volledig ondersteund en blijft dezelfde index bevragen.","Het judge-model wijzigen lost de beperkte toolondersteuning niet op.","Tool Call Success staat ook op de lijst van evaluators die je moet vermijden bij Azure AI Search.","Tool Selection staat niet op de vermijdlijst, maar meet alleen de toolkeuze en niet de parameters; bovendien blijft Groundedness onbetrouwbaar zolang de ingebouwde Azure AI Search tool wordt gebruikt."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.1.2-05","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Woodgrove Bank has a knowledge agent that retrieves documents from a vector index. Subject matter experts have labeled the relevance of each document for every test query. You need search quality metrics such as NDCG and Fidelity.\n\nWhich evaluator should you use?","choices":["Document Retrieval","Retrieval","Groundedness","Relevance"],"answer":[0],"explanation":"Document Retrieval vergelijkt opgehaalde documenten met ground truth relevance labels (qrels) en berekent Fidelity, NDCG, XDCG, Max Relevance en Holes. De gelabelde data en de gevraagde metrics wijzen naar dit evaluator.","rationale":["Juist: Document Retrieval gebruikt retrieval_ground_truth labels voor zoekkwaliteitmetrics.","Retrieval gebruikt een LLM judge zonder ground truth en levert geen NDCG.","Groundedness beoordeelt het eindantwoord ten opzichte van de context, niet de rangschikking van documenten.","Relevance beoordeelt of het antwoord de vraag beantwoordt."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"id":"3.1.2-06","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a research subagent that retrieves context chunks from a knowledge base. You need to assess whether the retrieved chunks are relevant to each query before the response is generated. No relevance labels or expected answers exist for the test queries.\n\nWhich evaluator should you use?","choices":["Retrieval","Document Retrieval","Response Completeness","Groundedness Pro"],"answer":[0],"explanation":"Retrieval is een process evaluator die met een LLM judge meet hoe relevant de opgehaalde context chunks zijn voor de query, zonder ground truth. Het vereist alleen query en context.","rationale":["Juist: Retrieval beoordeelt de opgehaalde context zonder ground truth.","Document Retrieval vereist retrieval_ground_truth labels, die ontbreken.","Response Completeness vereist ground_truth en beoordeelt het eindantwoord, niet de retrieval.","Groundedness Pro beoordeelt of het antwoord strikt consistent is met de context, niet de relevantie van de chunks."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"id":"3.1.2-07","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Adatum Corporation has a benefits agent grounded on HR documents. Groundedness scores are high, but HR reports that answers often omit critical eligibility conditions. Each test query has an expected answer written by HR.\n\nWhich evaluator should you add?","choices":["Response Completeness","Retrieval","Coherence","Fluency"],"answer":[0],"explanation":"Groundedness meet het precision-aspect (geen inhoud buiten de context), terwijl Response Completeness het recall-aspect meet: mist het antwoord kritieke informatie ten opzichte van de ground truth. Met verwachte antwoorden van HR is dit evaluator passend.","rationale":["Juist: Response Completeness vergelijkt het antwoord met de ground truth en detecteert ontbrekende informatie.","Retrieval beoordeelt de opgehaalde chunks, niet of het antwoord volledig is.","Coherence meet logische samenhang, niet volledigheid ten opzichte van een verwacht antwoord.","Fluency meet taalkwaliteit."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"id":"3.1.2-08","obj":"3.1.2","difficulty":"hard","type":"multi","stem":"Northwind Traders wants to choose the chunk size, top_k value, and search algorithm for the knowledge source used by its multi-agent support solution. You have a test set with human-labeled document relevance for each query. The decision must use the most precise retrieval quality measurement and must show whether differences from the current configuration are statistically significant.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Generate retrieval results for each configuration and run the Document Retrieval evaluator with the labeled data as retrieval_ground_truth.","Select the evaluation runs in the Foundry portal, select Compare, and set the run of the current configuration as the baseline.","Run the Groundedness Pro evaluator on the responses of each configuration.","Run the Task Navigation Efficiency evaluator for each configuration.","Run the Fluency evaluator on the responses of each configuration."],"answer":[0,1],"explanation":"Een parameter sweep gebruikt Document Retrieval met ground truth labels om de zoekparameters met de beste retrievalkwaliteit te vinden; dat is volgens Learn de meest precieze meting. De Compare-functie met een baseline run gebruikt statistische t-tests om significante verbeteringen of verslechteringen te tonen.","rationale":["Juist: Document Retrieval met qrels is de meest precieze retrievalmeting voor een parameter sweep.","Juist: Compare met een baseline toont stat-sig verschillen per run.","Groundedness Pro beoordeelt het antwoord ten opzichte van de context, niet de retrievalkwaliteit.","Task Navigation Efficiency vergelijkt toolstappen met een verwacht traject, niet zoekresultaten.","Fluency meet taalkwaliteit en zegt niets over retrieval."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"id":"3.1.2-09","obj":"3.1.2","difficulty":"hard","type":"single","stem":"Relecloud builds a concierge agent by using Microsoft Agent Framework. The agent calls a retrieve_memory function tool to load stored user preferences. You need to evaluate only the agent behavior from the memory retrieval onward, while all earlier messages serve as query context. You create a function named split_before_memory that returns the messages before the retrieve_memory function call as the query and the messages from that call onward as the response. You write the following code.\n\n```python\nresults = await evaluate_agent(\n    agent=agent,\n    queries=queries,\n    evaluators=evals,\n    <setting>,\n)\n```\n\nWhat should you use for the setting?","choices":["conversation_split=split_before_memory","conversation_split=ConversationSplit.FULL","No conversation_split argument (default last-turn split)","num_repetitions=3"],"answer":[0],"explanation":"De split strategy bepaalt wat je evalueert. Een custom splitter is een callable die de conversatie splitst in query- en response-berichten; door te splitsen voor de retrieve_memory call wordt alles daarvoor context en wordt het gedrag vanaf geheugenophaling beoordeeld.","rationale":["Juist: een custom splitter op de retrieve_memory call isoleert het gedrag vanaf de memory retrieval.","FULL neemt het eerste gebruikersbericht als query en de rest als response, dus niet vanaf de memory call.","De default splitst bij het laatste gebruikersbericht, wat niet samenvalt met de memory retrieval.","num_repetitions meet consistentie door queries te herhalen en verandert de split niet."],"ref":"https://learn.microsoft.com/agent-framework/agents/evaluation"},{"id":"3.1.2-10","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Litware, Inc. has an onboarding agent that must remember facts the user provides early in a multi-turn chat and use them later in the same chat. You plan an evaluation in the Foundry portal that scores the complete interaction from start to finish.\n\nWhich evaluation scope should you select?","choices":["Full conversations","Individual turns","Individual turns with existing traces","Individual turns with synthetic data"],"answer":[0],"explanation":"De scope Full conversations evalueert complete multi-turn gesprekken van begin tot eind, waardoor je ziet of eerder gegeven informatie later correct wordt gebruikt. Individual turns scoort losse antwoorden en mist het verloop over het hele gesprek.","rationale":["Juist: Full conversations beoordeelt de hele interactie, inclusief continuiteit van informatie.","Individual turns scoort losse antwoorden en past bij debugging van specifieke turns.","Existing traces is een databron binnen de scope Individual turns en scoort nog steeds per turn.","Synthetic data binnen Individual turns genereert single-turn queries, wat niet past bij een multi-turn geheugentest."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/evaluate-generative-ai-app"},{"id":"3.1.2-11","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Tailspin Toys rewrote the system prompt of a sales agent and ran the same evaluation dataset against the old and the new agent versions. You must determine whether the new prompt produced a statistically significant change for each evaluator.\n\nWhat should you do?","choices":["Select both runs, select Compare, and set the old run as the baseline","Create a human evaluation template and ask reviewers to rate both versions","Enable continuous evaluation on the new agent version","Annotate the traces of both versions with thumbs up or thumbs down"],"answer":[0],"explanation":"De Compare-functie toont geselecteerde runs naast elkaar en gebruikt statistische t-tests. Met een baseline run zie je per evaluator of de nieuwe prompt significant verbetert of verslechtert, inclusief p-waarde en sample size.","rationale":["Juist: Compare met baseline geeft stat-sig resultaten per evaluator.","Een human evaluation levert menselijke oordelen maar geen statistische vergelijking van de twee runs.","Continuous evaluation monitort productieverkeer en vergelijkt geen promptversies op dezelfde dataset.","Trace annotations geven losse menselijke signalen, geen statistische vergelijking."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/evaluate-results"},{"id":"3.1.2-12","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank has an advisor agent whose system prompt forbids recommending specific stocks and requires a referral to a licensed advisor for investment questions. Before each prompt change is released, you must verify that the responses follow these instructions. The test dataset includes the system message.\n\nWhich evaluator should you use?","choices":["Task Adherence","Intent Resolution","Relevance","Customer Satisfaction"],"answer":[0],"explanation":"Task Adherence meet of de acties van de agent voldoen aan de regels, procedures en beleidsbeperkingen uit de system message en is bedoeld voor compliance in gereguleerde omgevingen. Het meegeven van de system message verbetert deze beoordeling.","rationale":["Juist: Task Adherence controleert naleving van de instructies en beperkingen in de system prompt.","Intent Resolution meet of de intentie van de gebruiker juist is herkend, niet of instructies worden nageleefd.","Relevance meet of het antwoord de vraag adresseert; een relevant antwoord kan alsnog een aandeel aanbevelen.","Customer Satisfaction voorspelt tevredenheid en controleert geen beleidsregels."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.2.1-01","obj":"3.2.1","difficulty":"easy","type":"single","stem":"Litware, Inc. runs a contract review solution in which an orchestrator calls a legal agent, a finance agent, and a compliance agent one after another. Each agent analyzes the same contract independently and none of them uses the output of another agent. End-to-end task duration is too long.\n\nWhich orchestration pattern should you use to reduce the task duration?","choices":["Concurrent orchestration","Sequential orchestration","Handoff orchestration","Group chat orchestration"],"answer":[0],"explanation":"De drie agents werken onafhankelijk op dezelfde input, dus ze kunnen parallel draaien (fan-out/fan-in). Concurrent orchestration verlaagt de totale run time omdat de agents tegelijk werken en de resultaten daarna worden samengevoegd.","rationale":["Juist: concurrent orchestration laat onafhankelijke agents parallel op dezelfde taak werken en is bedoeld voor tijdkritische scenario's.","Fout: sequential is de huidige situatie; dat past wanneer agents op elkaars output voortbouwen, wat hier niet zo is.","Fout: handoff draagt de controle dynamisch over aan een andere agent; de agents werken dan nog steeds een voor een.","Fout: group chat laat agents in een gedeeld gesprek om de beurt reageren; dat versnelt onafhankelijke analyses niet."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns#concurrent-orchestration"},{"id":"3.2.1-02","obj":"3.2.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a planner agent that calls an Azure OpenAI deployment in Microsoft Foundry. During peak load, the deployment returns HTTP 429 responses. You implement custom retry logic.\n\nWhich response header should the retry logic use to decide how long to wait before the next attempt?","choices":["retry-after-ms","x-ratelimit-remaining-tokens","x-ratelimit-limit-tokens","x-ms-spillover-from-deployment"],"answer":[0],"explanation":"Bij een 429 stuurt Azure OpenAI de header retry-after-ms mee: het aantal milliseconden dat je moet wachten voor een nieuwe poging. Zonder die header gebruik je exponential backoff met jitter.","rationale":["Juist: retry-after-ms geeft bij een 429 aan hoeveel milliseconden je moet wachten.","Fout: deze header toont hoeveel tokens er nog over zijn voor een 429 optreedt; nuttig voor proactief afremmen, maar geen wachttijd.","Fout: deze header toont de huidige limiet van de deployment, niet de wachttijd.","Fout: deze header geeft aan dat een request via spillover van een provisioned deployment kwam."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota#understanding-rate-limits"},{"id":"3.2.1-03","obj":"3.2.1","difficulty":"easy","type":"single","stem":"Alpine Ski House has a booking agent that calls a chat completions deployment with n set to 5 so that the agent can pick the best of five drafts. Logs show that the agent always uses the first choice and discards the other four. Each call takes much longer than the team expects. You need to reduce the duration of each call without changing the model.\n\nWhat should you do?","choices":["Remove n from the request or set it to 1.","Set stream to true on each request.","Increase the TPM allocation of the deployment.","Raise max_tokens so each draft finishes in one call."],"answer":[0],"explanation":"Met de n-parameter genereert het model meerdere antwoorden per request, wat de latency verhoogt. Learn adviseert voor de snelste respons n niet te zetten of op 1 te houden. Omdat de agent alleen de eerste keuze gebruikt, levert dit dezelfde uitkomst in minder tijd.","rationale":["Juist: minder gegenereerde antwoorden per request verkort de doorlooptijd van elke call zonder ander model.","Onjuist: streaming verkort alleen de tijd tot het eerste token; de totale generatietijd van vijf antwoorden blijft gelijk.","Onjuist: meer TPM helpt tegen 429-throttling, maar maakt een afzonderlijke call die vijf antwoorden genereert niet sneller.","Onjuist: een hogere max_tokens laat het model eerder meer tokens genereren en verlaagt de latency niet."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/latency"},{"id":"3.2.1-04","obj":"3.2.1","difficulty":"easy","type":"single","stem":"Relecloud has a travel agent that calls a get_weather function. When a user asks for the weather in three cities, the agent makes three separate model round trips, one function call per round trip. You use a model deployment that supports multiple tool calls in one response.\n\nWhat should you use to reduce the number of round trips?","choices":["Parallel function calling","The tool_choice parameter set to none","Streaming with stream set to true","A higher max_tokens value"],"answer":[0],"explanation":"Met parallel function calling vraagt het model meerdere functieaanroepen in een enkele response aan. De resultaten gaan samen terug, waardoor er minder API-calls nodig zijn en de taak sneller klaar is.","rationale":["Juist: parallel function calling bundelt meerdere tool calls in een antwoord en vermindert het aantal round trips.","Fout: tool_choice none dwingt het model juist om geen functie aan te roepen.","Fout: streaming verkort alleen de tijd tot het eerste token, niet het aantal round trips.","Fout: een hogere max_tokens verandert het aantal functieaanroepen niet en verhoogt de rate-limit-schatting."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/function-calling#function-calling-support"},{"id":"3.2.1-05","obj":"3.2.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank runs a classification agent that sets max_tokens to 4000 on every request. Actual responses are about 150 tokens. Azure Monitor shows billed token usage at 40 percent of the deployment TPM limit, yet the agent receives frequent HTTP 429 responses. You must reduce the 429 responses without requesting more quota.\n\nWhat should you do?","choices":["Lower max_tokens to a value close to the expected response size.","Enable streaming on every request.","Increase the SDK max_retries value to 10.","Move the deployment to a different region in the same subscription."],"answer":[0],"explanation":"De TPM-check gebruikt bij ontvangst een schatting die de prompt plus max_tokens bevat, niet het gefactureerde verbruik. Een max_tokens van 4000 telt dus volledig mee, ook bij korte antwoorden. Door max_tokens dicht bij de verwachte grootte te zetten daalt de geschatte belasting.","rationale":["Juist: de rate limit rekent met prompt plus max_tokens; een lagere max_tokens verlaagt de geschatte tokens per request.","Fout: streaming verkort alleen de tijd tot het eerste token en verandert de TPM-schatting op basis van max_tokens niet.","Fout: meer retries verhogen het aantal requests en mislukte requests tellen ook mee voor de limiet.","Fout: een andere regio vereist een nieuwe deployment en quota-toewijzing en pakt de oorzaak niet aan."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/quota#understanding-rate-limits"},{"id":"3.2.1-06","obj":"3.2.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has an orchestrator agent that fans out to 40 subagents at the same instant when a research task starts. The shared deployment has a 600 RPM limit, and the solution sends about 200 requests per minute in total. The subagents still receive HTTP 429 responses at the start of each task. The parallel design must be kept to minimize task duration.\n\nWhat should you do?","choices":["Cap concurrent subagent calls and spread the requests over each minute.","Convert the fan-out to a sequential chain of subagents that run one at a time.","Increase max_tokens on each subagent request so fewer calls are needed.","Submit the subagent requests to a Global Batch deployment instead."],"answer":[0],"explanation":"Azure OpenAI controleert RPM over korte intervallen van 1 of 10 seconden en verwacht een gelijkmatige verdeling. 40 requests in een seconde overschrijdt de 10 requests per seconde van een 600-RPM deployment. Begrensde concurrency en pacing behoudt het parallellisme zonder de burst-limiet te raken.","rationale":["Juist: door gelijktijdige calls te begrenzen blijft het verkeer onder de korte-interval-limiet terwijl de taak parallel blijft.","Fout: sequentieel uitvoeren voorkomt bursts, maar verlengt de taakduur en schendt de eis om het parallelle ontwerp te behouden.","Fout: een hogere max_tokens verhoogt de TPM-schatting en verergert throttling.","Fout: Global Batch heeft een doel van 24 uur en past niet bij een interactieve researchtaak."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/quota#understanding-rate-limits"},{"id":"3.2.1-07","obj":"3.2.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank routes all model calls from its agents through Azure API Management. The agents use one Standard deployment in East US that is already assigned the full quota for the model in that region, and HTTP 429 responses still occur at peak load. You add a deployment of the same model in a second region. You need to increase the total throughput available to the agents by using both deployments at the same time.\n\nWhich API Management configuration should you use?","choices":["A backend pool that uses round-robin load balancing across both deployments","A backend pool that uses priority-based load balancing with East US as the top priority","A circuit breaker rule on the East US backend that trips on HTTP 429 responses","A retry policy that retries throttled requests against the East US backend"],"answer":[0],"explanation":"Azure OpenAI quota geldt per regio, dus een tweede regio levert extra TPM en RPM op. Een backend pool met round-robin verdeelt de requests gelijkmatig over beide deployments, zodat beide tegelijk throughput leveren.","rationale":["Juist: round-robin verdeelt de load over beide regionale deployments en telt hun quota bij elkaar op.","Priority-based gebruikt de lagere prioriteitsgroep alleen als alle backends met hogere prioriteit onbeschikbaar zijn; dat is failover, geen gelijktijdig gebruik.","Een circuit breaker haalt een backend tijdelijk uit roulatie, maar verdeelt op zichzelf geen load over beide deployments.","Retries op dezelfde volle deployment verhogen de totale throughput niet."],"ref":"https://learn.microsoft.com/azure/api-management/backends"},{"id":"3.2.1-08","obj":"3.2.1","difficulty":"medium","type":"single","stem":"Margie's Travel has a research agent that calls a reasoning model through the Azure OpenAI Responses API. Complex requests take several minutes. A network gateway between the agent and the model closes connections that stay open for longer than 100 seconds, so these requests fail. The reasoning depth must not be reduced, and the agent must be able to retrieve the result after the request is accepted.\n\nWhat should you do?","choices":["Set background to true and poll the response until it reaches a terminal state.","Set stream to true without background mode and reconnect when the connection drops.","Set reasoning_effort to minimal so that each response finishes within 100 seconds.","Set parallel_tool_calls to true so that the model finishes each request faster."],"answer":[0],"explanation":"Background mode verwerkt langlopende taken asynchroon: de service retourneert direct een response-ID met status queued, en je pollt tot een terminal state. Zo vermijd je timeouts zonder de redenering in te korten; background mode vereist wel store=true.","rationale":["Juist: met background=true blijft er geen verbinding minutenlang open en haal je het resultaat later op via de response-ID.","Streaming zonder background mode kan na een verbroken verbinding niet worden hervat; hervatten werkt alleen voor background responses die met stream=true zijn gestart.","Minimal reasoning effort verkort de verwerking, maar vermindert de redeneerdiepte, wat niet is toegestaan.","Parallel tool calls verkorten de doorlooptijd niet betrouwbaar tot onder de 100 seconden en lossen het timeoutprobleem niet op."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/responses#background-tasks"},{"id":"3.2.1-09","obj":"3.2.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. wraps every model call of its research agent in a custom retry library that retries up to five times with exponential backoff. The Azure OpenAI Python SDK client is created with default settings. During throttling events, the deployment receives far more requests than five attempts per call, and the throttling lasts longer.\n\nWhat should you do?","choices":["Set max_retries to 0 on the SDK client.","Increase max_retries on the SDK client to match the custom library.","Remove the random jitter from the custom backoff.","Retry immediately in the custom library and skip the backoff delay."],"answer":[0],"explanation":"De openai SDK heeft standaard twee ingebouwde retries. Elke poging van de eigen retry-library kan dus zelf nog twee SDK-retries veroorzaken, waardoor het aantal requests vermenigvuldigt. Mislukte requests tellen mee voor de limiet, dus zet max_retries=0 als je eigen retry-logica gebruikt.","rationale":["Juist: Microsoft adviseert de ingebouwde SDK-retry uit te zetten bij een eigen retry-library, anders stapelen de pogingen op.","Fout: meer SDK-retries vermenigvuldigen het aantal requests nog verder.","Fout: zonder jitter proberen alle clients tegelijk opnieuw, wat throttling erger maakt.","Fout: direct opnieuw proberen zonder backoff verergert throttling omdat mislukte requests ook meetellen."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota#understanding-rate-limits"},{"id":"3.2.1-10","obj":"3.2.1","difficulty":"hard","type":"multi","stem":"A. Datum Corporation has a back-office workflow with five steps. Steps 2, 3, and 4 each call a separate agent that reads the output of step 1 and generates a long report. Step 5 merges the three reports. Today all steps run in sequence, and no user watches the output while it is generated. Results are needed within two minutes of the request.\n\nWhich two actions should you perform to reduce the end-to-end task duration? Each correct answer presents part of the solution.","choices":["Run steps 2, 3, and 4 concurrently and merge their results in step 5.","Reduce the generated output size by lowering max_tokens and adding stop sequences.","Enable streaming on the requests of steps 2, 3, and 4.","Submit steps 2, 3, and 4 to a Global Batch deployment.","Run step 5 concurrently with steps 2, 3, and 4."],"answer":[0,1],"explanation":"Onafhankelijke stappen parallel uitvoeren (fan-out/fan-in) verkort de totale duur. Omdat het genereren van tokens de traagste stap is, verlaagt minder output (lagere max_tokens, stop sequences) de latency per call. Streaming verandert de totale tijd niet en Batch haalt de twee minuten niet.","rationale":["Juist: stap 2, 3 en 4 zijn onafhankelijk van elkaar en kunnen parallel draaien met een fan-in in stap 5.","Juist: minder gegenereerde tokens betekent kortere generatie, want generatie verloopt token voor token.","Fout: streaming verkort alleen de tijd tot het eerste token; zonder kijkende gebruiker levert dat niets op.","Fout: Global Batch heeft een doel van 24 uur en haalt de eis van twee minuten niet.","Fout: stap 5 heeft de drie rapporten nodig en kan pas na de fan-in draaien."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/latency#improve-performance"},{"id":"3.2.1-11","obj":"3.2.1","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. has a Global Provisioned deployment named Deploy1 that serves its agents. You plan to configure spillover for all requests on Deploy1 and then confirm that spillover works. The Foundry resource has no other deployments yet.\n\nYou need to perform the following actions:\n\n1. Create a Global Standard deployment of the same model and version in the same Foundry resource.\n2. Set the spilloverDeploymentName property on Deploy1.\n3. Send test traffic and check responses for the x-ms-spillover-from-deployment header.\n4. Review the standard deployment metrics by using the IsSpillover split.\n\nWhich sequence of actions should you perform?","choices":["1, 2, 3, 4","2, 1, 3, 4","1, 3, 2, 4","4, 1, 2, 3"],"answer":[0],"explanation":"Spillover vereist eerst een pay-as-you-go deployment met hetzelfde model en dezelfde versie in dezelfde resource. Daarna zet je spilloverDeploymentName op de provisioned deployment. Pas daarna kun je spillover-requests herkennen via de header en monitoren met de IsSpillover-split.","rationale":["Juist: eerst het doel aanmaken, dan spillover inschakelen, dan valideren en monitoren.","Fout: spilloverDeploymentName moet verwijzen naar een bestaande standard deployment; die bestaat nog niet.","Fout: voordat spillover is ingeschakeld verschijnt de spillover-header niet, dus deze test bewijst niets.","Fout: metrics bekijken voordat de standard deployment en spillover bestaan levert geen spillover-data op."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/spillover-traffic-management"},{"id":"3.2.1-12","obj":"3.2.1","difficulty":"hard","type":"single","stem":"Wide World Importers routes six agent applications through Azure API Management to one Azure OpenAI deployment. All applications run in the same Azure Container Apps environment and reach API Management through one shared outbound IP address. Each application has its own API Management subscription. You must enforce a tokens-per-minute limit per application and reduce requests that reach the backend when the prompt already exceeds the limit. You start with the following policy.\n\n```xml\n<llm-token-limit\n    counter-key=\"KEY\"\n    tokens-per-minute=\"20000\"\n    estimate-prompt-tokens=\"ESTIMATE\" />\n```\n\nWhich values should you use for KEY and ESTIMATE?","choices":["KEY: @(context.Subscription.Id) -- ESTIMATE: true","KEY: @(context.Subscription.Id) -- ESTIMATE: false","KEY: @(context.Request.IpAddress) -- ESTIMATE: true","KEY: @(context.Request.IpAddress) -- ESTIMATE: false"],"answer":[0],"explanation":"Alle apps delen een uitgaand IP-adres, dus het IP is geen bruikbare sleutel; de subscription ID onderscheidt de apps wel. Met estimate-prompt-tokens=true schat API Management de prompt-tokens vooraf en blokkeert het requests die de limiet al overschrijden, zodat minder requests de backend bereiken (ten koste van wat performance).","rationale":["Juist: per subscription tellen en prompt-tokens vooraf schatten voldoet aan beide eisen.","Fout: zonder schatting worden prompts naar de backend gestuurd en pas na de response geblokkeerd.","Fout: met een gedeeld IP-adres delen alle apps een teller en is er geen limiet per app.","Fout: een gedeeld IP-adres geeft geen limiet per app en zonder schatting bereiken requests nog steeds de backend."],"ref":"https://learn.microsoft.com/azure/api-management/llm-token-limit-policy#considerations-for-token-counts-and-estimation"},{"id":"3.2.2-01","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Lucerne Publishing has an editorial assistant built with Microsoft Agent Framework that keeps its own in-memory chat history. The agent uses SlidingWindowStrategy with keep_last_groups set to 20. In long sessions, the agent forgets the style rules that the user stated early in the conversation. You must keep the earlier context in condensed form while staying within the token budget.\n\nWhich compaction strategy should you use instead?","choices":["SummarizationStrategy","TruncationStrategy","SlidingWindowStrategy with keep_last_groups set to 10","SelectiveToolCallCompactionStrategy"],"answer":[0],"explanation":"Dit is sliding-window amnesia: een sliding window gooit oudere groepen volledig weg, inclusief de vroege stijlregels. SummarizationStrategy vervangt oudere delen door een samenvatting via een LLM en behoudt zo key facts en voorkeuren met minder tokens.","rationale":["Juist: summarization comprimeert oudere context tot een samenvatting in plaats van die weg te gooien.","Fout: truncation verwijdert de oudste groepen eveneens volledig en is bedoeld als noodrem voor het tokenbudget.","Fout: een kleiner venster laat nog meer vroege context vallen en verergert de amnesia.","Fout: deze strategie verwijdert alleen oude tool-call-groepen en raakt gebruikersberichten niet."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-02","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Trey Research has a support agent that retrieves knowledge from an Azure AI Search index by using vector queries only. Users often search for part numbers such as PN-7731-B and for engineer names. The agent frequently retrieves semantically similar but wrong documents for these queries.\n\nWhat should you use to improve retrieval for these queries?","choices":["A hybrid query that combines full-text search and vector search","A vector query with a higher k value","Exhaustive KNN instead of HNSW for the vector field","A larger embedding model for the document vectors while the query vectors keep the current model"],"answer":[0],"explanation":"Dit is vector-only recall: embeddings matchen exacte identifiers en namen slecht. Hybrid search voert full-text en vector search parallel uit en voegt de resultaten samen met RRF, zodat exacte matches op productcodes en namen worden gevonden.","rationale":["Juist: hybrid search combineert de precisie van keyword search met de semantiek van vector search.","Fout: meer vector-resultaten ophalen lost niet op dat embeddings exacte codes slecht representeren.","Fout: exhaustive KNN verbetert de nauwkeurigheid van nearest neighbors, maar blijft semantische gelijkenis meten.","Fout: query- en documentvectoren moeten hetzelfde model gebruiken; een ander model alleen voor documenten breekt de vergelijking."],"ref":"https://learn.microsoft.com/azure/search/hybrid-search-overview"},{"id":"3.2.2-03","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Tailspin Toys has a code review agent built with Microsoft Agent Framework for Python. The agent keeps its own in-memory history and uses a TruncationStrategy with max_n=100_000, compact_to=80_000, and the CharacterEstimatorTokenizer. The model has a 128,000-token context window. Most content is source code and JSON.\n\nRequests intermittently fail because the context window is exceeded. The usage data shows that the actual prompt token counts are much higher than the estimates of the strategy. The agent must keep using as much of the context window as possible.\n\nWhat should you do?","choices":["Pass a tokenizer that implements TokenizerProtocol for the encoding of the model.","Lower max_n to 50_000 and compact_to to 40_000 in the TruncationStrategy.","Replace the TruncationStrategy with SlidingWindowStrategy(keep_last_groups=20).","Add a ToolResultCompactionStrategy before the TruncationStrategy."],"answer":[0],"explanation":"De CharacterEstimatorTokenizer schat tokens met een heuristiek van 4 tekens per token. Voor code en JSON wijkt die schatting sterk af, waardoor de strategie te laat compacteert. Met een eigen tokenizer voor de encoding van het model telt de strategie nauwkeurig en blijft het context window optimaal benut.","rationale":["Juist: een model-specifieke tokenizer geeft nauwkeurige token counts, zodat de drempels van de strategie kloppen.","Fout: lagere drempels voorkomen de fout misschien, maar laten een groot deel van het context window ongebruikt.","Fout: een sliding window telt groepen en geen tokens, dus het budget wordt niet betrouwbaar bewaakt.","Fout: extra compaction van tool results lost de onjuiste tokenmeting niet op."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-04","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a C# agent built with Microsoft Agent Framework that keeps its conversation history in memory and calls several tools. A custom reducer keeps only the 30 most recent messages. Since the reducer was added, some model calls fail because a tool result message remains in the history without the assistant message that contains the matching tool call.\n\nYou need a hard token-budget backstop that removes the oldest content first, keeps tool calls and their results together, and does not require an extra LLM call.\n\nWhich compaction strategy should you use?","choices":["TruncationCompactionStrategy","SummarizationCompactionStrategy","ToolResultCompactionStrategy","ChatReducerCompactionStrategy that wraps the custom reducer"],"answer":[0],"explanation":"Compaction werkt met atomaire message groups: een assistant-bericht met tool calls en de bijbehorende tool results vormen samen een ToolCall-groep die alleen in zijn geheel wordt verwijderd. TruncationCompactionStrategy verwijdert de oudste niet-systeemgroepen tot het doel is bereikt, respecteert die grenzen en is bedoeld als noodrem op het tokenbudget zonder LLM.","rationale":["Juist: truncation verwijdert de oudste groepen als geheel en is de aanbevolen backstop voor een hard tokenbudget.","Fout: summarization vereist een aparte LLM-client voor de samenvatting.","Fout: deze strategie klapt alleen oude tool-call-groepen in en raakt gebruikers- en assistentberichten niet, dus het is geen harde budgetgrens.","Fout: de adapter laat de custom reducer zijn eigen logica op losse berichten uitvoeren, dus tool calls en tool results kunnen nog steeds gescheiden raken."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-05","obj":"3.2.2","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. has a negotiation agent that uses SummarizationStrategy with the default prompt. After several compaction cycles, the summary no longer contains the approved discount percentage and the contract ID, and later answers contradict earlier commitments. The agent must stay within the same token budget.\n\nWhat should you do to reduce this summary drift?","choices":["Provide a custom summarization prompt that preserves figures and IDs.","Replace SummarizationStrategy with a TruncationStrategy on the same budget.","Replace SummarizationStrategy with SelectiveToolCallCompactionStrategy.","Remove compaction and send the full chat history on every call."],"answer":[0],"explanation":"Summary drift ontstaat wanneer opeenvolgende samenvattingen details kwijtraken. SummarizationStrategy accepteert een custom prompt, zodat je kunt sturen welke feiten de samenvatting moet behouden. Zo blijven kritieke cijfers en ID's bewaard binnen hetzelfde budget.","rationale":["Juist: een custom summarization prompt legt vast welke kritieke details altijd in de samenvatting blijven.","Fout: truncation verwijdert de oudste berichten volledig, waardoor de commitments zeker verdwijnen.","Fout: deze strategie verwijdert alleen tool-call-groepen en lost het verlies in de samenvatting niet op.","Fout: de volledige history overschrijdt uiteindelijk het context window en schendt het tokenbudget."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-06","obj":"3.2.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. uses a Microsoft Agent Framework handoff workflow with an order agent and a refund agent. The order agent calls a lookup_order tool that returns the order number and purchase date, and then hands off to the refund agent. The refund agent asks the user for the order number again, even though the order agent already retrieved it.\n\nWhat should you do to maintain entity continuity across the handoff?","choices":["Have the order agent restate the order number and purchase date in its reply before the handoff.","Disable return-to-previous routing so user replies go through the start agent.","Increase keep_last_tool_call_groups in the compaction strategy of the refund agent.","Replace the handoff workflow with a concurrent orchestration of both agents."],"answer":[0],"explanation":"In een handoff-orchestration broadcasten agents alleen user- en agentberichten naar de andere deelnemers. Tool-gerelateerde inhoud, zoals de resultaten van lookup_order, wordt niet gedeeld. Door de gegevens in het antwoordbericht te herhalen komen ze wel in de context van de refund agent.","rationale":["Juist: alleen user- en agentberichten worden gesynchroniseerd, dus de entiteiten moeten in een bericht staan.","Fout: return-to-previous bepaalt alleen naar welke agent een gebruikersantwoord gaat, niet welke context gedeeld wordt.","Fout: de tool-resultaten zitten niet in de history van de refund agent, dus compaction-instellingen daar helpen niet.","Fout: concurrent orchestration laat agents onafhankelijk parallel werken en draagt geen context van de ene naar de andere agent over."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff#context-synchronization"},{"id":"3.2.2-07","obj":"3.2.2","difficulty":"medium","type":"single","stem":"Fourth Coffee has an agent that uses a Foundry Agent Service memory store. At each turn, the agent calls search_memories with items set to the latest user message. When a user opens a new conversation with a short greeting, the agent fails to apply the stored language preference of the user.\n\nWhat should you do?","choices":["At conversation start, call search_memories with only the user scope.","Increase the default TTL of the memory store to keep memories longer.","Disable chat summary memory in the memory store configuration.","Store the language preference as procedural memory instead."],"answer":[0],"explanation":"User profile memories laten zich vaak niet ophalen via semantische gelijkenis met een kort bericht: dat is vector-only recall. Microsoft adviseert statische memories aan het begin van elk gesprek te injecteren via search_memories met een scope en zonder items.","rationale":["Juist: search_memories met alleen een scope geeft de user profile memories terug die bij die scope horen.","Fout: TTL bepaalt hoe lang memories bewaard blijven; de voorkeur bestaat al maar wordt niet opgehaald.","Fout: chat summary memory uitschakelen verandert niets aan het semantisch ophalen van profielgegevens.","Fout: procedural memory is voor herbruikbare werkwijzen, niet voor persoonlijke voorkeuren."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage#use-memories-via-apis"},{"id":"3.2.2-08","obj":"3.2.2","difficulty":"medium","type":"single","stem":"Humongous Insurance configures a compaction strategy in Microsoft Agent Framework for an agent that runs as a Foundry agent with server-side conversation state. Long conversations still reach the context limit, and logs show that the compaction strategy has no effect.\n\nWhat should you conclude?","choices":["Compaction has no effect because the Foundry service manages the agent context.","The compaction trigger threshold is set too high for the conversation.","The CharacterEstimatorTokenizer underestimates the token count of each message.","The compaction strategy must be registered on each tool instead of the agent."],"answer":[0],"explanation":"Compaction werkt alleen voor agents die hun eigen history in memory bijhouden en die bij elke call meesturen. Bij service-managed agents, zoals Foundry Agents of de Responses API met store aan, beheert de service de context en heeft een compaction-strategie geen effect.","rationale":["Juist: de documentatie noemt Foundry Agents expliciet als service-managed, waar compaction geen effect heeft.","Fout: een te hoge trigger zou compaction later laten starten, maar de logs tonen dat de strategie nooit effect heeft.","Fout: een onnauwkeurige tokenizer beinvloedt het moment van compaction, niet of het werkt bij service-managed context.","Fout: compaction wordt op de agent of chat client geregistreerd, niet per tool."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-09","obj":"3.2.2","difficulty":"hard","type":"single","stem":"Relecloud has a research agent built with Microsoft Agent Framework for Python that keeps its own in-memory history. The agent uses the following strategy.\n\n```python\nsummarization = SummarizationStrategy(\n    client=summarizer_client,\n    target_count=4,\n    threshold=2,\n)\n```\n\nEvery older message group in the history is a tool-call group of about 12,000 estimated tokens because the tools return full reports. In long sessions, the non-system message count is far above 6, but the history is never summarized and no error is raised. The summary must keep the tool trajectory, including tool arguments and results.\n\nWhat should you do?","choices":["Set max_summary_input_tokens to a value that is larger than the largest message group.","Lower target_count to 2 so that more of the older groups become eligible for summarization.","Lower threshold to 0 so that summarization triggers as soon as the count exceeds target_count.","Use a summarizer deployment with a larger context window for summarizer_client."],"answer":[0],"explanation":"SummarizationStrategy begrenst de prompt voor de summarizer standaard tot 8.000 geschatte tokens en selecteert alleen complete message groups. Als geen enkele complete groep in dat budget past, wordt summarization overgeslagen en blijft de history ongewijzigd. Door max_summary_input_tokens te verhogen (of op None te zetten) passen de grote tool-call-groepen weer, en de summarizer ontvangt dan ook tool-argumenten en -resultaten.","rationale":["Juist: met een groter invoerbudget passen de groepen van 12.000 tokens en kan de strategie weer samenvatten.","Fout: target_count bepaalt hoeveel recente berichten blijven; het invoerbudget van 8.000 tokens blijft de groepen blokkeren.",

s":["minimal","low","medium","high"],"answer":[1],"explanation":"Minimal is the fastest, but does not support parallel tool calls. Low gives light reasoning with fast response and fits triage, and does support parallel tool calls.","rationale":["Minimal does not support parallel tool calls, which is a hard requirement here.","Correct: low is the fastest value that supports parallel tool calls and fits triage.","Medium is slower than needed for light triage.","High is the slowest and most expensive value; it is intended for complex planning and analysis."],"ref":"https://learn.microsoft.com/azure/foundry/foundry-models/how-to/model-choice-guide"},{"id":"1.1.8-05","obj":"1.1.8","difficulty":"hard","type":"single","stem":"Lucerne Publishing runs several Foundry agents that receive a diverse mix of simple and complex prompts. Management wants to minimize cost and accepts a somewhat larger quality trade-off than the default routing behavior. One compliance agent must use the same model for every request so that audits can reproduce its behavior.\n\nWhat should you do?","choices":["Deploy model router in Quality mode for every agent, including the compliance agent.","Deploy model router in Balanced mode for every agent, including the compliance agent.","Use a direct deployment of a frontier model for every agent.","Use model router in Cost mode, and a direct deployment for the compliance agent."],"answer":[3],"explanation":"Cost mode of model router uses a wider quality band (about 5 to 6 percent) than Balanced (1 to 2 percent) and chooses the cheapest model. If a workflow requires the same model for every request, you use a direct deployment; this is the hybrid pattern.","rationale":["Quality mode ignores cost, and the router can choose a different model per prompt for the compliance agent.","Balanced is the default with a narrower quality band and can also choose different models for compliance.","A frontier model for everything maximizes cost for simple prompts.","Correct: Cost mode for varied traffic and a fixed deployment for the compliance agent."],"ref":"https://learn.microsoft.com/azure/foundry/openai/concepts/model-router-how-it-works"},{"id":"1.1.8-06","obj":"1.1.8","difficulty":"hard","type":"single","stem":"Wingtip Toys equips field technicians with an assistant agent. Technicians often work offline at customer sites. Customer data must stay on the device during inspections. Inspection tasks are short and focused, and results are synchronized to the cloud for central processing when a connection is available.\n\nWhich model approach should you use?","choices":["a model router in a Data Zone Standard deployment","a fine-tuned GPT model in a serverless cloud deployment","a small language model on the device, with periodic cloud processing","a frontier reasoning model in a Global Standard deployment"],"answer":[2],"explanation":"Local or on-device models support offline and edge scenarios and improve privacy by keeping data on the device. In hybrid architectures you combine local inference with periodic cloud processing for central governance.","rationale":["Data Zone Standard guards the data zone, but still requires connectivity and moves data to the cloud.","Fine-tuning changes nothing about the requirement of working offline and keeping data on the device.","Correct: a local small model works offline, keeps data on the device, and fits short tasks.","A cloud model does not work offline and moves customer data off the device."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/choose-ai-model"},{"id":"1.2.1-01","obj":"1.2.1","difficulty":"easy","type":"single","stem":"Trey Research has prompt agents in Foundry Agent Service that use MCP tools to call MCP servers that are hosted by several teams. The security team requires one governed entry point for all agent-to-tool traffic, with rate limits, IP restrictions, and audit logging. The MCP servers and the agent code must not be modified.\n\nWhat should you do?","choices":["Connect an AI gateway to the Foundry resource, and then create the MCP tools.","Import each MCP server as an A2A agent API in Azure API Management, and use the A2A tool.","Replace the MCP tools with OpenAPI tools that call the MCP servers directly.","Add each MCP server as a knowledge source in a Foundry IQ knowledge base."],"answer":[0],"explanation":"Routing MCP traffic through an AI gateway in Microsoft Foundry gives you a central point for authentication, rate limits, IP restrictions, and logging without changing the MCP servers or the agent code. The routing is applied when the tool is created, so existing tools must be recreated after the gateway is connected.","rationale":["Correct: an AI gateway is the governed entry point for agent-to-tool traffic to MCP servers.","Incorrect: A2A agent APIs are intended for agent-to-agent traffic, not for MCP tools.","Incorrect: OpenAPI tools are not governed through the AI gateway, and MCP servers are not OpenAPI endpoints.","Incorrect: a knowledge base routes retrieval to knowledge sources, not tool calls to MCP servers."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/governance"},{"id":"1.2.1-02","obj":"1.2.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank has a Foundry Agent Service agent named Agent1. Agent1 must delegate loan pre-screening to a remote agent that another team built with LangGraph. The remote agent publishes an agent card and a JSON-RPC endpoint that implements Agent2Agent (A2A) protocol version 1.0. The integration will run in production.\n\nWhich tool type should you add to Agent1?","choices":["the A2A tool (a2a)","the A2A preview tool (a2a_preview)","the MCP tool","the OpenAPI tool"],"answer":[0],"explanation":"The generally available a2a tool type supports A2A protocol version 1.0 and is intended for new and production integrations with remote agents. The remote agent manages its own tools; Agent1 keeps directing the conversation.","rationale":["Correct: the GA a2a tool type speaks A2A 1.0 and is suitable for production.","a2a_preview uses A2A 0.3, is in preview, and is not recommended for production.","The MCP tool connects an agent to tools on an MCP server, not to another agent through an agent card.","The OpenAPI tool calls an HTTP API based on an OpenAPI spec, not an A2A agent with an agent card and tasks."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/agent-to-agent"},{"id":"1.2.1-03","obj":"1.2.1","difficulty":"medium","type":"single","stem":"Contoso Pharmaceuticals is building five agents in Foundry Agent Service. Each agent must be grounded on content in SharePoint, Azure Blob Storage, and OneLake. The architects want to avoid connecting every agent to every data source individually. Responses must include citations and must honor source access control lists and Microsoft Purview sensitivity labels for the calling user.\n\nWhich component should you specify for agent-to-knowledge-source routing?","choices":["a Foundry IQ knowledge base that contains one knowledge source per data store","a separate Azure AI Search index for each agent that is queried by the Azure AI Search tool","a Foundry Agent Service memory store that is scoped to each user","a file search vector store that is attached to each agent"],"answer":[0],"explanation":"A Foundry IQ knowledge base bundles multiple knowledge sources, can be shared by multiple agents, and uses agentic retrieval to choose sources. It synchronizes ACLs, respects Purview sensitivity labels, and returns answers with citations.","rationale":["Correct: a shared knowledge base with multiple knowledge sources avoids per-agent connections and enforces permissions at query time.","An index per agent again means per-agent, per-source connections, exactly what the architects want to avoid.","A memory store keeps user preferences and summaries, not enterprise document sources with ACLs.","A file search vector store per agent duplicates content per agent and does not synchronize source ACLs or sensitivity labels."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-foundry-iq"},{"id":"1.2.1-04","obj":"1.2.1","difficulty":"medium","type":"single","stem":"Tailspin Toys runs A2A-compatible agents in three business units. The agents are hosted outside Foundry. The company needs to govern agent-to-agent traffic centrally by requiring subscription keys and applying rate-limit policies. Operations also needs telemetry in Application Insights that includes the agent ID attribute defined by the OpenTelemetry GenAI semantic conventions.\n\nWhat should you do?","choices":["Expose each agent as an MCP server in Azure API Management.","Import each agent as an A2A agent API in Azure API Management.","Place Azure Front Door in front of each agent endpoint.","Register each agent in Azure API Center."],"answer":[1],"explanation":"API Management can import A2A agent APIs: it mediates the JSON-RPC operations, applies policies, rewrites the agent card with the subscription key requirement, and adds the attributes genai.agent.id and genai.agent.name to Application Insights. This covers governance and observability for agent-to-agent traffic.","rationale":["An MCP server is intended for tools; A2A traffic with agent cards and tasks does not fit the MCP model.","Correct: an A2A agent API in API Management provides policies, subscription keys, and GenAI telemetry for A2A traffic.","Azure Front Door is a global load balancer and WAF without A2A-aware policies or GenAI agent attributes.","API Center registers and catalogs APIs but does not enforce runtime policies or rate limits."],"ref":"https://learn.microsoft.com/azure/api-management/agent-to-agent-api"},{"id":"1.2.1-05","obj":"1.2.1","difficulty":"hard","type":"multi","stem":"Relecloud uses a Foundry IQ knowledge base that contains two indexed knowledge sources: an employee handbook index and a health insurance index. The retrieval reasoning effort is set to minimal. Users report two problems:\n\n- Questions about medical coverage are often answered from the employee handbook.\n- Multi-part questions are processed as a single query instead of being broken into focused subqueries.\n\nYou need to improve knowledge source selection and enable query decomposition without adding agents.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Add descriptions to each knowledge source and add retrieval instructions to the knowledge base.","Set the retrieval reasoning effort of the knowledge base to medium.","Keep the retrieval reasoning effort at minimal and increase the number of indexer runs.","Create a separate agent for each knowledge source.","Attach a memory search tool to the agent."],"answer":[0,1],"explanation":"You influence source selection with descriptions on knowledge sources and retrieval instructions on the knowledge base. Query planning, in which an LLM splits complex questions into subqueries, is invoked only at reasoning effort low or medium; minimal does no query planning.","rationale":["Correct: descriptions and retrieval instructions steer which knowledge source is chosen for which type of question.","Correct: medium activates LLM-based query planning and iterative retrieval, so questions are split into subqueries.","With minimal, no query planning is done; indexing more often only refreshes data and does not solve routing.","Extra agents per source are explicitly excluded and undermine the benefit of a shared knowledge base.","A memory search tool retrieves user memory and does not improve source selection in the knowledge base."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/foundry-iq-faq"},{"id":"1.2.1-06","obj":"1.2.1","difficulty":"hard","type":"single","stem":"Northwind Traders operates 12 agents: some are Foundry prompt agents and some are hosted agents built with LangGraph. All agents use the same MCP server, the same OpenAPI tool, and the same A2A tool. Today each agent stores its own tool credentials, and every tool change requires redeploying each agent.\n\nThe new design must meet the following requirements:\n\n- Define the tools once and expose them through one MCP-compatible endpoint.\n- Centralize credential injection and apply guardrails to tool inputs and outputs.\n- Release a new tool configuration by promoting a version, without changing agent code.\n\nWhich component should you specify?","choices":["a shared agent that owns the tools and that each agent calls through the A2A tool","an Azure API Center inventory that lists the tools","a Foundry toolbox","an MCP-enabled session pool in Azure Container Apps dynamic sessions"],"answer":[2],"explanation":"A Foundry toolbox groups MCP, OpenAPI, and A2A tools behind a managed MCP-compatible endpoint that any framework can use. It centralizes authentication, applies guardrails to tool input and output, and supports versions that you promote to default without changing agent code.","rationale":["Each agent would still have to configure its own A2A connection with credentials, and there would be no shared MCP endpoint with guardrails and version promotion.","API Center helps with discovery but does not inject credentials and does not apply runtime guardrails or versions.","Correct: a toolbox provides a single MCP endpoint, central credential injection, guardrails, and version promotion.","A dynamic sessions MCP endpoint offers predefined shell and Python tools for sandboxed code, not federation of existing tools."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/toolbox-overview"},{"id":"1.2.2-01","obj":"1.2.2","difficulty":"easy","type":"single","stem":"Lamna Healthcare Company built Agent1 in a Foundry project. During development, Agent1 used the shared project agent identity. Before Agent1 moves to production, the security team requires that Agent1 has its own permission set and an independent audit trail in Microsoft Entra ID.\n\nWhat should you do?","choices":["Assign the required roles to the project managed identity.","Create a user-assigned managed identity and share it with the other agents.","Give Agent1 its own distinct agent identity and assign roles to it.","Configure the tools of Agent1 to use API key authentication."],"answer":[2],"explanation":"A shared project agent identity gives a larger blast radius and no separate audit trail. Agent1 must therefore run under its own (distinct) agent identity with its own least-privilege roles. How you get one depends on the model: in the legacy Agent Application model by publishing, in the new agent object model by creating a new agent (which receives a unique identity when it is created). Roles do not carry over, so assign them again.","rationale":["The project managed identity only authenticates the blueprint and is not the principal that receives permissions and auditing per agent.","An identity shared between agents is exactly the opposite of per-agent scoping.","Correct: a dedicated agent identity with its own roles gives per-agent permissions and an independent audit trail.","API keys are shared secrets without identity-bound auditing and do not fit Zero Trust."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"1.2.2-02","obj":"1.2.2","difficulty":"medium","type":"single","stem":"Humongous Insurance has hundreds of Microsoft Entra agent identities across development, test, and production environments. The security team must prevent non-production agents from accessing production resources and wants to manage this control at scale. Agents cannot complete interactive controls such as multifactor authentication.\n\nWhat should you do?","choices":["Add the agent identities to the existing Conditional Access policy that requires multifactor authentication for all users.","Assign custom security attributes such as Environment to the agent identities and use them in a Conditional Access policy for agents.","Create an Azure Policy assignment that denies resource creation in production subscriptions.","Configure Microsoft Entra Privileged Identity Management for each agent identity."],"answer":[1],"explanation":"Microsoft Entra Agent ID recommends segmenting agents with custom security attributes (such as Environment) and using them in agent-specific Conditional Access policies. This blocks non-production agents from production at scale, without interactive controls that agents cannot perform.","rationale":["Agents cannot perform MFA; user-targeted MFA policies unintentionally block agent flows and do not segment by environment.","Correct: custom security attributes in Conditional Access for agents give fine-grained, scalable segmentation.","Azure Policy governs resource configuration, not which identity gets access to existing resources.","PIM provides time-bound elevation of privileges but does not segment agents by environment."],"ref":"https://learn.microsoft.com/entra/agent-id/best-practices-agent-id"},{"id":"1.2.2-03","obj":"1.2.2","difficulty":"medium","type":"single","stem":"A. Datum Corporation runs prompt agents and hosted agents in a Foundry account that uses the Standard setup. To prevent lateral movement and data exfiltration, agent traffic to Azure Cosmos DB, Azure AI Search, and Azure Storage must stay on the private network, and outbound internet traffic must be inspected by a central firewall. The network team plans to add a private endpoint to the Foundry account and disable public network access.\n\nWhat else should you include in the design?","choices":["the Enabled from selected IP addresses setting on the Foundry account","a second private endpoint for the Foundry account in another subnet","virtual network injection, with egress routed through Azure Firewall","the Basic setup with platform-managed storage for agent data"],"answer":[2],"explanation":"A private endpoint secures only the inbound path; agent egress remains public. With virtual network injection in a subnet delegated to Microsoft.App/environments, outbound traffic stays private, and a hub-and-spoke design with Azure Firewall inspects internet traffic.","rationale":["Selected IP addresses only restricts who may call the Foundry endpoint inbound.","An extra private endpoint does not change the egress of agents.","Correct: VNet injection isolates egress and the peered hub with Azure Firewall inspects outbound traffic.","Platform-managed storage replaces the own Cosmos DB, AI Search, and Storage and by itself does not isolate agent egress."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/configure-private-link"},{"id":"1.2.2-04","obj":"1.2.2","difficulty":"hard","type":"single","stem":"Contoso, Ltd. runs a claims triage agent type in many business units. All 40 agent identities of this type were created from one agent identity blueprint in Microsoft Entra ID, and new instances are created automatically during peak load. A security incident affects this agent type. You must meet the following requirements:\n\n- Block every existing identity of this agent type from authenticating immediately.\n- Prevent new identities of this agent type from being created during the incident.\n- Leave other agents in the tenant unaffected.\n- Restore access after the incident without re-creating identities.\n\nWhat should you do?","choices":["Disable the agent identity blueprint of the claims triage agent type.","Disable each of the 40 agent identities in the Microsoft Entra admin center.","Create a Conditional Access policy that blocks every agent identity in the tenant.","Delete the blueprint by using the Remove-EntraAgentIdentityBlueprint cmdlet."],"answer":[0],"explanation":"An agent identity blueprint is the management object for all agent identities of an agent type. If you disable the blueprint, existing identities can no longer authenticate and no new ones can be created; enabling it again restores access. This limits the incident to this one agent type.","rationale":["Correct: disabling at the blueprint level blocks existing identities, prevents new ones, and is reversible.","Incorrect: disabling individually scales poorly and does not block the new instances that are created during peak load.","Incorrect: a tenant-wide block also affects all other agents in the tenant.","Incorrect: this cmdlet deletes the blueprint with all its agent identities and agent users in a cascade. That is intended for permanent decommissioning; recovery requires a soft-delete restore within 30 days instead of simply enabling it again."],"ref":"https://learn.microsoft.com/entra/agent-id/manage-agent-identities-admin"},{"id":"1.2.2-05","obj":"1.2.2","difficulty":"hard","type":"multi","stem":"Woodgrove Bank is deploying a remediation agent that runs scripts and runbooks to fix misconfigured resources in a regulated environment. The agent has a dedicated Microsoft Entra agent identity. The security team requires Zero Trust controls that minimize standing privilege and limit the blast radius if the agent is compromised.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Use Microsoft Entra Privileged Identity Management for approval-based, time-bound elevation of the agent.","Scope the role assignments of the agent to specific resource groups instead of the subscription.","Assign the Contributor role to the agent at the subscription scope.","Run the agent under the shared project agent identity.","Store a client secret in the agent identity blueprint."],"answer":[0,1],"explanation":"For remediation agents, the least-privilege guidance recommends JIT elevation or approval gates (PIM) and scoping to specific resource groups instead of subscription-wide permissions. This limits both standing privileges and lateral movement.","rationale":["Correct: PIM gives approved, time-bound elevation instead of permanent permissions.","Correct: resource group scope limits the blast radius compared with subscription scope.","Contributor at subscription level is a broad standing role and increases the blast radius.","The shared project identity has a larger blast radius and no separate audit trail.","A client secret must be rotated and stored; a federated credential through a managed identity is the recommended production option."],"ref":"https://learn.microsoft.com/security/zero-trust/sfi/least-privilege-for-ai-agents"},{"id":"1.2.2-06","obj":"1.2.2","difficulty":"easy","type":"single","stem":"Coho Winery runs a multi-agent solution on Azure that processes card payments for its online store. Auditors require continuous automated assessment of the Azure resources against the Payment Card Industry Data Security Standard (PCI DSS) v4, with a view of passed and failed compliance controls.\n\nWhich component should you use?","choices":["Azure Advisor recommendations for the subscription","Microsoft Entra audit logs in a Log Analytics workspace","the Notification Center in the Foundry portal","the Defender for Cloud regulatory compliance dashboard"],"answer":[3],"explanation":"The regulatory compliance dashboard in Defender for Cloud continuously assesses resources against standards such as PCI DSS and shows per control whether resources are compliant. The data also flows to Microsoft Purview Compliance Manager for central compliance management.","rationale":["Advisor gives best-practice recommendations but does not map to regulatory controls such as PCI DSS.","Audit logs record directory activity but do not assess resources against compliance controls.","The Notification Center shows alerts in the Foundry portal, not compliance assessments per standard.","Correct: the dashboard continuously maps resource assessments to the controls of PCI DSS v4."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-regulatory-compliance-standards"},{"id":"1.2.3-01","obj":"1.2.3","difficulty":"easy","type":"single","stem":"Bellows College deploys Foundry Agent Service by using the Standard setup with bring-your-own resources. Compliance requires that all messages and conversation history stay in a resource that the college owns.\n\nWhich resource should you specify for the conversation history?","choices":["Azure AI Search","Azure Cosmos DB","Azure Managed Redis","Azure Storage"],"answer":[1],"explanation":"In the Standard setup, an Azure Cosmos DB for NoSQL account (BYO thread storage) stores messages, conversation history, and agent metadata. Azure Storage contains files and Azure AI Search contains the vector stores.","rationale":["Azure AI Search contains the vector stores that the agent creates.","Correct: Cosmos DB is the BYO thread storage for conversations.","Azure Managed Redis is not part of the Standard setup of Agent Service.","Azure Storage contains files uploaded by developers and users."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/standard-agent-setup"},{"id":"1.2.3-02","obj":"1.2.3","difficulty":"easy","type":"single","stem":"Fourth Coffee is building session memory for a custom agent. For each session, the agent stores the most recent chat turns, the current plan, and references to tool outputs. Reads and writes must have low latency, and inactive sessions must age out automatically. Vector search is not required for session memory.\n\nWhich component should you use?","choices":["Azure Managed Redis with TTL-based keys","a Foundry Agent Service memory store","an Azure AI Search vector index","Azure Blob Storage with lifecycle management policies"],"answer":[0],"explanation":"Azure Managed Redis is suitable for bounded short-term session memory: lists for recent turns, hashes for state, and TTL plus trimming so that inactive sessions expire automatically. No modules are needed for this.","rationale":["Correct: Redis lists and hashes with TTL and trimming on every write provide fast, self-cleaning session memory.","A memory store is intended for long-term memory, such as preferences across sessions.","A vector index is intended for semantic search, which is not needed here.","Blob lifecycle policies work at the day level and do not deliver the low latency needed for session state."],"ref":"https://learn.microsoft.com/azure/redis/tutorial-agent-memory"},{"id":"1.2.3-03","obj":"1.2.3","difficulty":"medium","type":"single","stem":"Litware, Inc. offers a multitenant agent platform that stores conversation turns in Azure Cosmos DB for NoSQL. The platform has thousands of tenants. Each tenant runs many concurrent conversation threads, and the largest tenants exceed 20 GB of data. Tenant-level queries must avoid full cross-partition scans, and the cost per tenant must stay low.\n\nWhich partition strategy should you use?","choices":["a partition key of /threadId","a partition key of /tenantId","a hierarchical partition key of /tenantId and then /threadId","a separate Azure Cosmos DB account for each tenant"],"answer":[2],"explanation":"A hierarchical partition key with tenantId as the first level and threadId as the second keeps threads together, groups them per tenant for isolation and tenant queries, and scales beyond the logical limit of 20 GB. An account per tenant is more expensive.","rationale":["/threadId alone makes tenant queries cross-partition and gives no tenant isolation.","/tenantId alone hits the logical partition limit of 20 GB for large tenants.","Correct: hierarchical partitioning combines tenant isolation, thread locality, and scale beyond 20 GB.","Account-per-tenant is intended for tenants with strong isolation requirements and is too expensive for thousands of tenants."],"ref":"https://learn.microsoft.com/azure/cosmos-db/gen-ai/agentic-memories"},{"id":"1.2.3-04","obj":"1.2.3","difficulty":"medium","type":"single","stem":"Margie's Travel has a Foundry agent that plans trips. The agent must remember each user's travel preferences across sessions and devices. Memories must be isolated per user, managed by the platform, and users must be able to ask the agent to forget specific information immediately.\n\nWhich component should you use?","choices":["a Foundry Agent Service memory store with the scope set to the user ID","the Cosmos DB chat history provider in Microsoft Agent Framework","Microsoft Agent Framework workflow checkpoints","a Foundry IQ knowledge base"],"answer":[0],"explanation":"Memory in Foundry Agent Service is managed long-term memory that provides continuity across sessions and devices. The scope parameter segments memory per user, and direct remember-or-forget commands support explicit erasure requests.","rationale":["Correct: a memory store with user scope gives managed, isolated long-term memory with forget support.","The chat history provider keeps exact transcripts, not extracted preferences.","Checkpoints keep workflow state for resuming, not user memory across sessions.","A knowledge base provides enterprise content for grounding, not personal preferences."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"1.2.3-05","obj":"1.2.3","difficulty":"hard","type":"single","stem":"Litware, Inc. stores two tiers of agent state in one Azure Cosmos DB for NoSQL container:\n\n- Session state items, which must be deleted 24 hours after their last update. The application writes each session item with a ttl property of 86400.\n- Shared team state items, which have no ttl property and must be kept until the application deletes them.\n\nThe DefaultTimeToLive property of the container is not set. After a week, none of the session state items have been deleted. You must not modify the shared team state items.\n\nWhat should you do?","choices":["Set DefaultTimeToLive on the container to -1.","Set DefaultTimeToLive on the container to 86400.","Remove the ttl property from the session state items.","Set the ttl property of the shared team state items to -1."],"answer":[0],"explanation":"An item-level ttl works only if DefaultTimeToLive is present on the container and is not null. With DefaultTimeToLive set to -1, items do not expire by default, but items with their own ttl expire after that value. This way the session items disappear after 24 hours and the team state is kept without any change.","rationale":["Correct: -1 enables TTL without a default expiry, so only items with their own ttl expire.","Incorrect: the team state without a ttl would then also expire after 24 hours, unless you change those items.","Incorrect: without a container TTL, the items still do not expire.","Incorrect: this changes the team state, and as long as the container TTL is not set, an item ttl has no effect."],"ref":"https://learn.microsoft.com/azure/cosmos-db/time-to-live"},{"id":"1.2.3-06","obj":"1.2.3","difficulty":"hard","type":"single","stem":"Graphic Design Institute uses an existing Azure Managed Redis instance for short-term agent session memory. The instance was created without Redis modules. The team now needs long-term semantic memory in the same data platform, storing extracted facts as JSON documents with embeddings and retrieving them by vector similarity with metadata filters.\n\nWhat should you do?","choices":["Enable the RediSearch and RedisJSON modules on the existing instance.","Scale the existing instance to a larger SKU.","Create a new instance with RediSearch and RedisJSON, and migrate the data.","Store the embeddings in Redis Streams that are capped by MAXLEN."],"answer":[2],"explanation":"Long-term semantic memory requires RediSearch for vectors and RedisJSON for JSON documents. Modules can be enabled only when an Azure Managed Redis instance is created and cannot be added later, so a new instance is needed.","rationale":["Modules cannot be added to an existing instance.","A larger SKU does not add modules.","Correct: only a new instance with RediSearch and RedisJSON supports vector search on JSON documents.","Streams are intended for tool events and do not support vector similarity search."],"ref":"https://learn.microsoft.com/azure/redis/tutorial-agent-memory"},{"id":"1.2.4-01","obj":"1.2.4","difficulty":"easy","type":"single","stem":"Alpine Ski House has an agent that generates Python code to analyze files that users upload. The generated code is untrusted. Each execution must run in a Hyper-V isolated sandbox that starts in milliseconds from a prewarmed pool and blocks outbound network requests by default.\n\nWhich compute component should you use?","choices":["Azure Container Apps dynamic sessions","Azure Container Instances","Azure Functions on the Flex Consumption plan","an Azure Kubernetes Service (AKS) user node pool"],"answer":[0],"explanation":"Dynamic sessions in Azure Container Apps provide Hyper-V isolated sandboxes from prewarmed session pools, intended for LLM-generated or other untrusted code. Outbound network traffic is blocked by default.","rationale":["Correct: dynamic sessions combine Hyper-V isolation, prewarmed pools, and egress that is blocked by default.","Container Instances have no prewarmed session pool for millisecond allocation per execution.","Functions is event-driven compute, not intended as a Hyper-V sandbox for untrusted code.","An AKS node pool requires cluster management and offers no Hyper-V session per execution from a pool."],"ref":"https://learn.microsoft.com/azure/container-apps/sessions"},{"id":"1.2.4-02","obj":"1.2.4","difficulty":"easy","type":"single","stem":"Trey Research has agent orchestration code written with LangGraph. The team wants to run it on a Microsoft-managed platform without configuring containers, web servers, or scaling rules. Each deployed agent must receive a dedicated Microsoft Entra identity, and files written during a session must survive idle periods.\n\nWhich compute option should you use?","choices":["a prompt agent in Foundry Agent Service","a hosted agent in Foundry Agent Service","Azure App Service","Azure Kubernetes Service (AKS)"],"answer":[1],"explanation":"Hosted agents run your own framework code (such as LangGraph) as a container on managed infrastructure. The platform handles scaling, a dedicated Entra agent identity, and persistent session state in $HOME across idle periods.","rationale":["A prompt agent is defined only with prompts and tool configuration and does not run your own LangGraph code.","Correct: hosted agents combine your own code with managed scaling, identity, and session persistence.","App Service requires your own web server and scaling configuration and does not provide an agent identity.","AKS requires cluster management and your own scaling rules."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agents"},{"id":"1.2.4-03","obj":"1.2.4","difficulty":"medium","type":"single","stem":"Wide World Importers runs a hosted agent version that is allocated 2 vCPU and 4 GiB of memory. The agent handles high concurrency. In the linked Application Insights resource, a representative workload shows sustained CPU peaks of 25 percent and memory peaks of 30 percent of the allocation. Finance asks you to reduce compute cost without reducing throughput.\n\nWhat should you do?","choices":["Edit the cpu and memory values of the current agent version.","Configure a lower maximum replica count for the agent.","Increase the idle timeout of the agent to 60 minutes.","Create a new agent version with smaller cpu and memory values."],"answer":[3],"explanation":"Hosted agents scale per session; cpu and memory apply per session, and the costs multiply with the concurrency. When peaks are far below the allocation, you lower it in a new version, because versions are immutable, and test again.","rationale":["Agent versions are immutable; a change requires a new version.","Hosted agents have no replica count; they scale per session.","A longer idle timeout keeps compute active longer and increases costs.","Correct: a new version with a smaller allocation lowers the cost per session; then test again."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agents"},{"id":"1.2.4-04","obj":"1.2.4","difficulty":"medium","type":"single","stem":"City Power & Light runs a customer service agent in production. Traffic is predictable and the agent is latency-sensitive. Occasionally, traffic bursts exceed the planned capacity, and requests during these bursts must not fail with HTTP 429 errors.\n\nWhich model deployment configuration should you specify?","choices":["a provisioned deployment with spillover","a provisioned deployment without spillover","a standard deployment","a global batch deployment"],"answer":[0],"explanation":"Provisioned throughput provides reserved capacity and a latency target for predictable production traffic. Spillover automatically sends overflow requests (such as on a 429) to a standard deployment, so that bursts do not fail.","rationale":["Correct: PTU for predictable latency plus spillover to a standard deployment for bursts.","Without spillover, bursts above the PTU capacity produce 429 errors.","Standard has no latency SLA and has variable latency at high, consistent volumes.","Batch is asynchronous without latency requirements and unsuitable for interactive agents."],"ref":"https://learn.microsoft.com/azure/foundry/openai/concepts/provisioned-throughput"},{"id":"1.2.4-05","obj":"1.2.4","difficulty":"hard","type":"multi","stem":"Consolidated Messenger is designing compute for two components of a multi-agent solution:\n\n- Orchestrator: an HTTP service that coordinates agents, uses Dapr for service invocation, and must scale to zero per app. The operations team does not want to manage clusters.\n- Ingestion: code that runs when new documents arrive, has sporadic traffic with sudden spikes, must use scale-to-zero billing, and is deployed as code without containers.\n\nWhich two compute choices should you recommend? Each correct answer presents part of the solution.","choices":["Azure Container Apps for the orchestrator","Azure Functions on the Flex Consumption plan for ingestion","Azure Kubernetes Service (AKS) for the orchestrator","Azure App Service for ingestion","Azure Container Instances for the orchestrator"],"answer":[0,1],"explanation":"Container Apps offers built-in microservice primitives such as Dapr and per-app scale to zero without cluster management. Functions on Flex Consumption fits event-driven, spiky traffic with scale-to-zero billing and runs code without containers.","rationale":["Correct: Container Apps provides Dapr and scale to zero without cluster management.","Correct: Flex Consumption is serverless, trigger-based, and scales to zero.","AKS requires cluster management, which the team explicitly wants to avoid.","App Service does not scale to zero.","Container Instances offer no Dapr integration or per-app microservice scaling."],"ref":"https://learn.microsoft.com/azure/architecture/microservices/design/compute-options"},{"id":"1.2.4-06","obj":"1.2.4","difficulty":"hard","type":"single","stem":"Contoso Suites runs an agent fleet that uses a workload-dedicated provisioned (PTU) deployment in Region A. The company also has an enterprise PTU pool in Region B and a Standard deployment. Reliability requirements state that if the workload PTU deployment is unavailable, requests must fail over first to the enterprise PTU pool and then to the Standard deployment. An engineer proposes enabling spillover on the workload PTU deployment and targeting the enterprise PTU pool.\n\nWhat should you do instead?","choices":["Move the enterprise PTU pool to Region A.","Configure the failover chain in Azure API Management by using priority-based backend load balancing.","Replace both PTU deployments with a Data Zone Batch deployment.","Enable spillover on the enterprise PTU pool and target the workload PTU deployment."],"answer":[1],"explanation":"Spillover routes overflow only to a corresponding Standard deployment; automatic PTU-to-PTU failover is not documented. Configure the failover chain in a gateway such as API Management with priority-based load balancing and circuit breakers, and keep PTU pools in different regions.","rationale":["Both PTU pools in the same region lose capacity at the same time during a regional outage.","Correct: API Management backends with priorities implement workload PTU -> enterprise PTU -> Standard.","Batch is asynchronous and does not meet interactive latency requirements.","Spillover cannot point to another PTU deployment; it targets a Standard deployment."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/high-availability-resiliency"},{"id":"1.2.5-01","obj":"1.2.5","difficulty":"easy","type":"single","stem":"Coho Vineyard is enabling tracing for prompt agents and hosted agents in a Foundry project. Developers must be able to inspect the traces in the Foundry portal and query them later by using Kusto Query Language (KQL).\n\nWhich component should you connect to the Foundry project?","choices":["an Azure Data Explorer cluster","an Azure Event Hubs namespace","an Application Insights resource","an Azure Storage account"],"answer":[2],"explanation":"Foundry stores traces in Azure Monitor Application Insights following the OpenTelemetry semantic conventions. After you connect Application Insights to the project, you see traces in the portal and can query them with KQL.","rationale":["Azure Data Explorer is not the trace store that Foundry uses.","Event Hubs is a streaming ingestion service, not a trace viewer for the Foundry portal.","Correct: Application Insights is the trace backend of Foundry.","A storage account is not a supported trace backend for the Foundry portal."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-setup"},{"id":"1.2.5-02","obj":"1.2.5","difficulty":"easy","type":"single","stem":"Wingtip Toys runs a multi-agent solution in which an orchestrator in Azure Container Apps calls a hosted agent in Foundry Agent Service, which calls an MCP server in Azure Functions. Operations needs one end-to-end trace that correlates spans across all three services.\n\nWhich standard should the services use to propagate trace context?","choices":["CloudEvents","JSON-RPC 2.0","the Azure Monitor common alert schema","W3C Trace Context"],"answer":[3],"explanation":"The multi-agent semantic conventions in Foundry build on OpenTelemetry and W3C Trace Context. By propagating traceparent headers, spans from different services are linked together in one trace.","rationale":["CloudEvents describes event payloads, not trace correlation.","JSON-RPC 2.0 is a message format (used by MCP and A2A), not a standard for trace context.","The common alert schema describes alert payloads in Azure Monitor.","Correct: W3C Trace Context propagates trace IDs between services."],"ref":"https://learn.microsoft.com/azure/foundry/observability/concepts/trace-agent-concept"},{"id":"1.2.5-03","obj":"1.2.5","difficulty":"medium","type":"single","stem":"Southridge Video has agents built with Microsoft Agent Framework and LangGraph that emit OpenTelemetry GenAI spans to Application Insights. Engineers need structured queries over the reasoning path of each run, including the exact arguments that an agent passed to each tool. The query must work for both frameworks.\n\nWhich span attribute should the query target?","choices":["gen_ai.agent.id on invoke_agent spans","gen_ai.tool.call.arguments on execute_tool spans","gen_ai.tool.call.result on execute_tool spans","gen_ai.tool.definitions on invoke_agent spans"],"answer":[1],"explanation":"According to the OpenTelemetry GenAI conventions, gen_ai.tool.call.arguments on execute_tool spans records the arguments of a tool call. Because both frameworks follow these conventions, the query works across frameworks; you see planning in plan spans.","rationale":["gen_ai.agent.id identifies the agent, not the tool arguments.","Correct: this attribute contains the arguments that were passed to the tool.","gen_ai.tool.call.result contains the result of the tool, not the input.","gen_ai.tool.definitions describes available tools, not what was called in a run."],"ref":"https://learn.microsoft.com/azure/foundry/observability/concepts/trace-agent-concept"},{"id":"1.2.5-04","obj":"1.2.5","difficulty":"medium","type":"single","stem":"Litware, Inc. has a planner agent that calls a GPT-5 series reasoning model through the Azure OpenAI Responses API. Engineers must keep a structured log of how the planner agent reasoned before it chose each tool, so that they can review the reasoning path of failed runs. The logged reasoning must be human-readable, and the solution must use a supported method.\n\nWhat should you do?","choices":["Set reasoning.summary to auto and log the reasoning summary items of each response.","Add reasoning.encrypted_content to the include parameter and log the returned items.","Instruct the model in the developer message to output its full chain of thought.","Set reasoning_effort to high and log the reasoning_tokens value of each response."],"answer":[0],"explanation":"The reasoning summary parameter (auto, concise, or detailed) is the supported way to get a readable summary of the reasoning of a reasoning model, which you can log per step for debugging. Other methods to extract raw reasoning are not supported and may violate the Acceptable Use Policy.","rationale":["Correct: reasoning summaries give a readable view of the reasoning and are the supported method.","Encrypted reasoning items are encrypted and serve to pass reasoning context in stateless conversations, not to be logged in readable form.","Requesting raw reasoning through the prompt is not supported and can lead to throttling or suspension.","reasoning_tokens is only a token count; it does not show how the model reasoned."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/reasoning"},{"id":"1.2.5-05","obj":"1.2.5","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines is debugging a Foundry agent in a development environment by using client-side tracing in Python. Engineers must see the message contents and the tool call parameters in each span so that they can reconstruct the reasoning path. The baggage header must not be propagated.\n\n```python\nimport os\nfrom azure.ai.projects.telemetry import AIProjectInstrumentor\n\nos.environ[\"AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING\"] = \"true\"\nos.environ[\"<setting>\"] = \"true\"\n\nAIProjectInstrumentor().instrument()\n```\n\nWhich value should you use for <setting>?","choices":["AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA","AZURE_TRACING_GEN_AI_INSTRUMENT_RESPONSES_API","AZURE_TRACING_GEN_AI_TRACE_CONTEXT_PROPAGATION_INCLUDE_BAGGAGE","OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT"],"answer":[3],"explanation":"OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT captures message content and tool parameters in traces and is off by default. Use it only in development; in production it can capture personal data.","rationale":["This setting adds images and file data to spans, not message content and tool parameters.","This setting is already on by default and controls auto-instrumentation of the Responses API, not content recording.","This setting actually propagates the baggage header, which is explicitly not allowed.","Correct: this variable enables content recording of messages and tool parameters."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-client-side"},{"id":"1.2.5-06","obj":"1.2.5","difficulty":"hard","type":"multi","stem":"Fabrikam Residences runs a multi-agent workflow built with Microsoft Agent Framework for Python. Some production runs fail intermittently. Engineers must be able to:\n\n- Reproduce a failing run from its recorded input and intermediate state on a different instance.\n- Turn the failing production interactions into a reusable test set for regression checks.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Configure the workflow with durable checkpoint storage, such as CosmosCheckpointStorage, and rehydrate runs from checkpoints.","Add the failing traces to an evaluation dataset from the trace view in the Foundry portal.","Configure the workflow with in-memory checkpoint storage.","Enable baggage propagation for outbound requests.","Lower the Azure Monitor sampling ratio to 0.1."],"answer":[0,1],"explanation":"Checkpoints in durable storage capture the full workflow state per superstep; from Python 1.13, entry checkpoints make the complete run replayable and you can rehydrate a new instance. Adding traces to a dataset yields a reusable test set for regression evaluations.","rationale":["Correct: durable checkpoints enable reproducible replay on another instance.","Correct: failing traces become a versioned dataset for regression tests.","In-memory storage is lost on a restart and does not work across instances.","Baggage propagates extra context and can expose PII; it does not capture replayable state.","A lower sampling ratio actually omits more failing runs."],"ref":"https://learn.microsoft.com/agent-framework/workflows/checkpoints"},{"id":"1.2.6-01","obj":"1.2.6","difficulty":"easy","type":"single","stem":"Adventure Works Cycles runs a customer support agent in Foundry Agent Service. The team needs to detect quality regressions in production as they happen by evaluating a sample of live agent traffic.\n\nWhich monitoring capability should you configure?","choices":["cluster analysis","continuous evaluation","red team scans","scheduled evaluation with a golden dataset"],"answer":[1],"explanation":"Continuous evaluation samples live traffic as it arrives and runs evaluators on production output, so that quality regression is immediately visible in the Agent Monitoring Dashboard.","rationale":["Cluster analysis groups results of existing evaluations; it does not sample live traffic.","Correct: continuous evaluation evaluates live traffic continuously.","Red team scans test adversarially for safety risks, not for quality regression of real traffic.","A scheduled evaluation runs on a fixed schedule against a fixed dataset, not on live traffic."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"id":"1.2.6-02","obj":"1.2.6","difficulty":"easy","type":"single","stem":"The Phone Company has an Azure Monitor log alert rule that fires when the error rate of an agent exceeds a threshold. When the alert fires, a workflow must automatically disable the failing agent endpoint and post a message to Microsoft Teams.\n\nWhich component should you attach to the alert rule?","choices":["an action group with a Logic Apps workflow action","an alert processing rule that suppresses duplicate alerts","a diagnostic setting that streams the logs to Event Hubs","an Azure Monitor workbook that visualizes the error rate"],"answer":[0],"explanation":"Action groups define who receives a notification and which automatic actions start when an alert fires, such as a Logic Apps workflow, Azure Function, or runbook. This is how you implement automated remediation.","rationale":["Correct: an action group starts the Logic Apps workflow for remediation and the Teams notification.","An alert processing rule modifies fired alerts (suppress or add action groups) but does not run a workflow itself.","A diagnostic setting routes logs and metrics but does not respond to alerts.","A workbook visualizes data and does not perform actions."],"ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/action-groups"},{"id":"1.2.6-03","obj":"1.2.6","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. sends a custom metric named TokensPerRun to Azure Monitor for each of its 30 agents, with the agent name as a dimension. Normal values follow daily and weekly traffic patterns, and the team does not know which fixed value indicates abnormal behavior for each agent. You need an alert that detects significant deviations from the learned behavior of every agent by using a single alert rule.\n\nWhich alert configuration should you use?","choices":["A metric alert rule that uses dynamic thresholds","A metric alert rule that uses a static threshold","Application Insights smart detection","A Resource Health alert on the Foundry resource"],"answer":[0],"explanation":"Dynamic thresholds use machine learning on historical data to learn seasonal patterns (hourly, daily, and weekly) per time series and to detect deviations. One rule can monitor hundreds of time series across dimensions, so you do not need to know a threshold per agent.","rationale":["Correct: dynamic thresholds learn the normal behavior per time series and work with one rule across multiple dimensions.","A static threshold requires a fixed value that the team does not know, and it does not fit the seasonal patterns.","Smart detection focuses on anomalies in failure rates and request performance, not on a custom metric such as TokensPerRun.","Resource Health reports platform problems with the resource itself, not anomalous behavior of agents."],"ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-dynamic-thresholds"},{"id":"1.2.6-04","obj":"1.2.6","difficulty":"medium","type":"single","stem":"First Up Consultants ran several evaluation runs for a multi-agent solution. Hundreds of samples failed. The team needs to group the failures by similar problems, see the distribution across error categories, and get recommended next steps for each group.\n\nWhich capability should you use?","choices":["the Agent Monitoring Dashboard","cluster analysis","intelligent sampling","a scheduled red team scan"],"answer":[1],"explanation":"Cluster analysis groups evaluation samples with similar problems through embedding-based clustering, shows the distribution per error category, and gives a diagnosis and recommendations per cluster.","rationale":["The dashboard shows metrics and trends but does not group failing samples by problem type.","Correct: cluster analysis identifies recurring failure patterns with recommendations.","Intelligent sampling selects representative traces but does not analyze failure patterns.","A red team scan looks for security risks, not for grouping of evaluation failures."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/cluster-analysis"},{"id":"1.2.6-05","obj":"1.2.6","difficulty":"hard","type":"single","stem":"Contoso, Ltd. runs a multi-agent app on Azure App Service. A Coordinator agent delegates to four specialist agents. Each agent is built with Microsoft Agent Framework, is wrapped with UseOpenTelemetry, and exports to Application Insights. To track cross-agent coordination, operations uses the Agents view in Application Insights.\n\nAfter each app restart, the specialists appear as new rows, and their call and token metrics are split across many entries. Each agent ID is generated as a new GUID when the application starts.\n\nWhat should you do?","choices":["Enable sensitive data capture on each agent.","Set the Azure Monitor exporter sampling ratio to 1.0.","Enable the codeless Application Insights agent on the web app.","Assign each agent a stable, unique ID that is read from configuration."],"answer":[3],"explanation":"Per-agent metrics in the Agents view depend on gen_ai.agent.id and gen_ai.agent.name. An ID that is regenerated at every start fragments the telemetry; use a stable, unique ID from configuration.","rationale":["Sensitive data capture adds message content but does not change the agent identification.","Sampling at 1.0 prevents missing rows at low volume but does not solve changing IDs.","The codeless agent must actually be turned off with in-code OpenTelemetry to avoid conflicts.","Correct: stable IDs from configuration keep metrics per agent together."],"ref":"https://learn.microsoft.com/azure/app-service/tutorial-ai-agent-monitoring-dotnet"},{"id":"1.2.6-06","obj":"1.2.6","difficulty":"hard","type":"single","stem":"Contoso, Ltd. has one log search alert rule that monitors five agent apps named Agent1 to Agent5 in a resource group. The rule splits alerts by resource so that each fired alert targets the affected app. The alert rule uses an action group with an Automation Runbook action that restarts the failing agent.\n\nAgent3 and Agent4 have a planned maintenance window every Sunday from 01:00 to 05:00. During that window, the following requirements apply:\n\n- The runbook must not run for alerts from Agent3 and Agent4.\n- Alerts from the other three agents must still trigger remediation.\n- Fired alerts from Agent3 and Agent4 must remain visible for later review.\n\nYou need to meet the requirements by using the least administrative effort.\n\nWhat should you do?","choices":["Create an alert processing rule that is scoped to Agent3 and Agent4 and suppresses notifications on a weekly schedule.","Disable the alert rule at the start of each maintenance window and enable it again after the window ends.","Remove the Automation Runbook action from the action group at the start of each maintenance window.","Create an alert processing rule that is scoped to Agent3 and Agent4 and applies a second action group on a weekly schedule."],"answer":[0],"explanation":"An alert processing rule with the action Suppress notifications removes all action groups from the fired alerts within the scope, while the alerts themselves remain visible. With a recurring schedule and a scope on only Agent3 and Agent4, remediation keeps working for the other agents, without manual steps per window.","rationale":["Correct: suppression on a recurring schedule and limited scope prevents the runbook run, while alerts remain visible and the other agents simply keep receiving remediation.","Disabling the rule affects all five agents and ensures that no alerts are fired at all, so there are also no visible alerts.","Removing the runbook action also stops remediation for Agent1, Agent2, and Agent5 and requires manual work every week.","Apply action groups adds action groups; the existing runbook action then simply keeps running."],"ref":"https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-processing-rules"},{"id":"1.2.7-01","obj":"1.2.7","difficulty":"easy","type":"single","stem":"Wide World Importers has a team of developers who build hosted agents. Every developer must get an identical containerized development environment in Visual Studio Code and GitHub Codespaces. The Azure Developer CLI (azd) and its Foundry extensions must be available as soon as the container starts.\n\nWhat should you add to the repository?","choices":["an azure.yaml file that defines the agent services","a devcontainer.json file that adds the azd feature with the extensions option","a Python virtual environment that is committed to the repository","a setup script that installs the Foundry Dev Pack on each workstation"],"answer":[1],"explanation":"A dev container defines a reproducible environment in .devcontainer/devcontainer.json. The azd Dev Container Feature installs azd and, through the extensions option, also the specified azd extensions during the container build.","rationale":["azure.yaml describes services and deployment for azd but does not provide a development environment.","Correct: the azd feature with extensions creates an identical container with preinstalled tools.","A virtual environment isolates Python packages but is not a container and does not belong in source control.","Installing DevPack per workstation does not provide an identical container environment and does not work in Codespaces."],"ref":"https://learn.microsoft.com/azure/developer/azure-developer-cli/install-azd"},{"id":"1.2.7-02","obj":"1.2.7","difficulty":"easy","type":"single","stem":"Developers at Bellows College want to browse the Foundry model catalog, create hosted agent projects, test agents locally with Agent Inspector, inspect local traces, and deploy hosted agents without leaving Visual Studio Code.\n\nWhich Visual Studio Code extension should they install?","choices":["Jupyter extension for Visual Studio Code","GitHub Codespaces","Microsoft Foundry Toolkit for Visual Studio Code","Python extension for Visual Studio Code"],"answer":[2],"explanation":"Microsoft Foundry Toolkit for Visual Studio Code brings Foundry resources, the model catalog, hosted-agent deployment, Agent Inspector, local tracing, and playgrounds to VS Code.","rationale":["The Jupyter extension provides notebook support, not Foundry features.","The Codespaces extension opens cloud development environments but does not provide Foundry tooling.","Correct: Foundry Toolkit covers the model catalog, agent creation, local testing, tracing, and deployment.","The Python extension provides language support, not Foundry integration."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/install-foundry-toolkit-visual-studio-code"},{"id":"1.2.7-03","obj":"1.2.7","difficulty":"medium","type":"single","stem":"Best For You Organics Company uses GitHub Copilot in Visual Studio Code to write agent code in Python and infrastructure in Bicep in the same repository. The team wants Copilot to apply its Python conventions for agent code automatically in ask, agent, and inline completion modes, but the conventions must not apply to the Bicep files.\n\nWhich file should you create?","choices":[".github/agents/python.agent.md",".github/copilot-instructions.md",".github/instructions/python.instructions.md","custom-instructions.md in the repository root"],"answer":[2],"explanation":"Custom instructions in .github/instructions/<name>.instructions.md are scoped to a glob such as **/*.py through the applyTo front matter key. Copilot applies them automatically to all matching files, and the Bicep files fall outside it.","rationale":["An .agent.md defines a custom agent that you must select; it does not apply automatically per file type.","copilot-instructions.md is repository-wide and would also apply to Bicep.","Correct: a scoped instructions file with applyTo: **/*.py applies only to Python files.","A file with that name is not recognized as a Copilot instructions file."],"ref":"https://learn.microsoft.com/sql/tools/visual-studio-code-extensions/github-copilot/custom-instructions"},{"id":"1.2.7-04","obj":"1.2.7","difficulty":"medium","type":"single","stem":"A developer at Proseware, Inc. deploys a Python hosted agent by calling create_version_from_code in the Azure AI Projects SDK. The code is packaged as a zip file of the project folder, so main.py and requirements.txt are located in a src/agent subfolder inside the zip. Provisioning fails with \"Hosted agent provisioning failed\". The model deployment name in the .env file exists in the target project.\n\nWhat should you do?","choices":["Install the dependencies globally by using sudo pip install before you create the zip.","Increase the cpu allocation in the hosted agent definition.","Request the Contributor role on the resource group.","Rebuild the zip so that main.py and requirements.txt are at the root."],"answer":[3],"explanation":"With code deployment, Foundry resolves the dependencies from requirements.txt and builds the agent remotely. For this, main.py and requirements.txt must be in the root of the zip; that is the documented cause of this error when the model name is correct.","rationale":["Global installation with sudo is discouraged (use a virtual environment) and the remote build does not use local packages.","More cpu does not fix a wrong zip structure.","Contributor fixes AuthorizationFailed during provisioning, not a failed provisioning caused by a wrong zip structure.","Correct: the entry point and the dependency file must be in the root of the zip."],"ref":"https://learn.microsoft.com/azure/foundry/agents/quickstarts/quickstart-hosted-agent"},{"id":"1.2.7-05","obj":"1.2.7","difficulty":"hard","type":"single","stem":"Margie's Travel is starting a new hosted agent from a Foundry sample by using the Azure Developer CLI (azd). The agent must use a new Foundry project and a new model deployment. Developers must test the agent locally against the new model deployment before they deploy it, and then invoke the deployed agent.\n\nWhich sequence of commands should you run?","choices":["azd ai agent init -> azd provision -> azd ai agent run -> azd deploy -> azd ai agent invoke","azd provision -> azd ai agent init -> azd deploy -> azd ai agent run -> azd ai agent invoke","azd ai agent init -> azd deploy -> azd provision -> azd ai agent invoke -> azd ai agent run","azd ai agent init -> azd ai agent run -> azd ai agent invoke -> azd provision -> azd deploy"],"answer":[0],"explanation":"First, azd ai agent init scaffolds the project and the agent definition, then azd provision creates the Foundry project and the model deployment. azd ai agent run tests locally against those resources, azd deploy uploads and builds the agent, and azd ai agent invoke calls the deployed agent.","rationale":["Correct: init, provision, test locally, deploy, and then invoke.","Provisioning before init has no azure.yaml definition, and testing locally after deploy violates the requirement.","Deploying before provisioning fails because the target resources do not exist yet.","Running locally before provisioning does not work, because the new model deployment does not exist yet."],"ref":"https://learn.microsoft.com/azure/foundry/agents/quickstarts/quickstart-hosted-agent"},{"id":"1.2.7-06","obj":"1.2.7","difficulty":"hard","type":"single","stem":"Developers at Lucerne Publishing use GitHub Copilot CLI as their coding agent. They need the Microsoft Foundry Skill so that Copilot follows Foundry workflows for deployment, evaluation, and troubleshooting. The same installation must also configure the Azure MCP Server and the Foundry MCP Server, and the team must be able to update all three together later.\n\nWhat should you do?","choices":["Add the microsoft/azure-skills plugin marketplace in Copilot CLI and install the azure@azure-skills plugin.","Run npx skills add https://github.com/microsoft/azure-skills --skill microsoft-foundry.","Install Microsoft Foundry Toolkit for Visual Studio Code.","Add a .github/copilot-instructions.md file that describes the Foundry workflows."],"answer":[0],"explanation":"The Azure Skills Plugin bundles the Foundry Skill, the Azure MCP Server configuration, and the Foundry MCP Server in one installation, and can be updated together with /plugin update. The skill-only path installs only the workflow instructions.","rationale":["Correct: the plugin installs and updates the skill and both MCP configurations together in Copilot CLI.","npx skills add installs only the skill content, without MCP server configuration.","Foundry Toolkit provides the skill in VS Code, not in Copilot CLI.","An instruction file describes conventions but does not configure MCP servers and does not provide Foundry subskills."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/use-microsoft-foundry-skill"},{"id":"2.1.1-01","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. is building a classification agent named Agent1 that calls a chat model by using a messages array. Agent1 labels incoming support tickets, and the team wants to show the model three labeled sample tickets so that it infers the expected label format for the current request only, without changing the model weights.\n\nWhich placement should you use for the sample tickets?","choices":["As metadata attached to the request","As a series of example user and assistant messages after the system message","As an assistant message appended after the current user message","As the description field of a function tool definition"],"answer":[1],"explanation":"Few-shot examples are added in the Chat Completions structure as example interactions between user and assistant directly after the system message. They condition the model only for the current inference; the weights do not change.","rationale":["Metadata is not given to the model as prompt text and therefore does not steer its behavior.","Correct: few-shot examples belong as user/assistant pairs after the system message in the messages array.","An assistant message after the current question is seen as the answer itself or as a prime, not as a set of labeled examples.","A tool description tells the model when to call a tool, not how to label a ticket."],"ref":"https://learn.microsoft.com/azure/foundry/openai/concepts/prompt-engineering"},{"id":"2.1.1-02","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has an agent that summarizes documents uploaded by external partners. A security review finds that partner documents can contain hidden instructions that try to override the agent behavior. You need a prompt technique that transforms the untrusted document text by interleaving a special token throughout the entire text, and warns the model about this transformation in the system message.\n\nWhich technique should you use?","choices":["Chain-of-thought prompting","Few-shot learning","Data marking","Output priming with a cue"],"answer":[2],"explanation":"Data marking is a spotlighting technique: a special token is placed throughout the untrusted text so that the model can distinguish system instructions from external input. This helps against indirect prompt injection.","rationale":["Chain-of-thought lets the model reason step by step, but it does not mark untrusted input.","Few-shot examples show desired behavior but do not transform the external document text.","Correct: data marking (spotlighting) interleaves a token through the entire input and is explained in the system message.","A cue triggers the output in a certain format, but it does not protect against embedded instructions."],"ref":"https://learn.microsoft.com/security/zero-trust/sfi/defend-indirect-prompt-injection"},{"id":"2.1.1-03","obj":"2.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank publishes a prompt agent named Agent1 in Foundry Agent Service to employees in Microsoft Teams. Prompt engineers save new versions of Agent1 several times per day while they experiment. You need to ensure that employees keep receiving the approved version until a release manager explicitly changes it.\n\nWhat should you configure for the agent endpoint?","choices":["Keep the default version selector that routes traffic to the latest version","Edit the approved version in place for each change","Create a new agent name for each experiment","Pin the version selector to the approved agent version"],"answer":[3],"explanation":"By default, the version selector routes 100% of traffic to the latest version, including in Teams. When you pin the selector to a specific active version, new versions do not change what users see until you update the selector.","rationale":["Always use latest is the default and would push every saved experiment version straight to Teams.","Agent versions are immutable; you cannot modify a saved version in place.","A new agent name per experiment breaks the stable identity and endpoint and is not release control.","Correct: pinning to a specific version keeps production stable while new versions are saved."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/configure-agent"},{"id":"2.1.1-04","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. builds a support agent by using Microsoft Agent Framework. On every invocation the agent must know the current user's contract tier and preferred language, which are stored in a CRM system. Testing shows that when this information is exposed as a function tool, the model sometimes answers without calling the tool. The information differs per user, and the agent instructions must stay unchanged.\n\nWhat should you implement?","choices":["A context provider that loads the tier and language and injects them before each invocation","A function tool with a more detailed description that tells the model to call it first","Few-shot examples that show answers for each contract tier","Hard-coded tier and language values in the agent instructions"],"answer":[0],"explanation":"Context providers run proactively for every invocation and inject context without the model having to decide. Tools are reactive: the model must decide on its own to call them. Rule of thumb: information that must be there every time belongs in a context provider.","rationale":["Correct: a context provider injects the per-user data automatically for every run, without an instruction change.","A better tool description remains reactive; the model can still skip the call.","Few-shot examples show behavior but do not supply the current data of the specific user.","Hard-coding does not work because the values differ per user and the instructions must remain unchanged."],"ref":"https://learn.microsoft.com/agent-framework/journey/adding-context-providers"},{"id":"2.1.1-05","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Relecloud has a research agent that receives retrieved chunks from Azure AI Search and passes them to a chat model. The current prompt places the user question first, then appends all returned chunks, and ends with the instruction \"Use the context if helpful.\" Evaluations show low groundedness, and when the chunks do not contain the answer, the model answers from its training data.\n\nWhich prompt change should you make?","choices":["Move the grounding instructions into the context block and repeat them next to each chunk","Place labeled chunks before the question, require answers from the context only, and define a fallback","Include every returned chunk regardless of relevance score so that the model has more context","Repeat the user question at the end of the prompt and keep the instruction to use the context if helpful"],"answer":[1],"explanation":"Vague grounding instructions, context after the question, and no fallback are known RAG anti-patterns. Place labeled chunks before the question, use an explicit 'only from context' instruction, and define what the model does when the context is insufficient.","rationale":["Mixing instructions with context is itself an anti-pattern; keep them in separate sections.","Correct: context before the question, an explicit grounding constraint, and a fallback address both symptoms.","Adding all chunks without a relevance filter introduces noise and makes the problem worse.","Repeating the question and keeping the vague instruction does not improve grounding and does not add a fallback."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/rag/rag-prompt-engineering"},{"id":"2.1.1-06","obj":"2.1.1","difficulty":"medium","type":"single","stem":"Tailspin Toys runs a prompt agent named Agent1 in Foundry Agent Service. The instructions were handcrafted, and manual prompt tuning is slow. You need an evaluation-driven process that generates improved instructions and tool descriptions, scores them against a dataset created from Agent1 traces, and keeps the current version available for rollback. The solution must not require code changes.\n\nWhat should you do?","choices":["Create prompt variants in prompt flow and compare them in a batch run","Fine-tune the model deployment by using supervised fine-tuning on the traces","Run the agent optimizer from the Optimize tab and promote the best candidate to a new agent version","Open the current agent version and overwrite its instructions with the best-performing prompt"],"answer":[2],"explanation":"The agent optimizer evaluates a baseline version, generates candidates (instructions, tool descriptions, model choice), scores them, and lets you promote the winner to a new agent version, without code changes for prompt agents. The old version remains available.","rationale":["Prompt flow is being phased out and is not the mechanism for Foundry prompt agents.","Fine-tuning changes model weights and is not a prompt lifecycle solution for instructions and tool descriptions.","Correct: the optimizer with a dataset from traces and promotion to a new version preserves rollback.","Agent versions are immutable; overwriting is not possible and would make rollback impossible."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-optimizer-overview"},{"id":"2.1.1-07","obj":"2.1.1","difficulty":"hard","type":"multi","stem":"Proseware, Inc. has an email triage agent that reads inbound messages from external vendors and drafts summaries for a finance team. A red team shows that a vendor email containing hidden text can make the agent reveal its instructions. The agent has read-only access to the mailbox.\n\nWhich three actions should you perform to reduce the risk? Each correct answer presents part of the solution.","choices":["Add a system message instruction to treat the delimited email content as data only and to ignore instructions inside it","Apply spotlighting by using delimiters and data marking on the email text","Screen the email content by using Azure AI Content Safety before it enters the prompt","Insert the email body into the system message so the model processes it with higher priority","Grant the agent write access to the mailbox so that it can quarantine suspicious emails"],"answer":[0,1,2],"explanation":"Against indirect prompt injection, you combine a defensive instruction ('treat context as data'), spotlighting (delimiters and data marking), and screening of the content with Content Safety. This is defense in depth.","rationale":["Correct: a defensive instruction in the system message is a recommended mitigation.","Correct: spotlighting helps the model distinguish between instructions and untrusted input.","Correct: Content Safety screening of external content before it enters the prompt is recommended.","Putting untrusted content in the system message gives attacker instructions the highest priority.","Extra write permissions increase the attack surface and conflict with least privilege."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/rag/rag-prompt-engineering"},{"id":"2.1.1-08","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders implements a custom context provider in Microsoft Agent Framework for Python. The provider must add the user's support tier to the agent instructions before the model is called. The same provider instance is attached to one agent that serves many concurrent sessions, and the tier must never leak between sessions.\n\n```python\nclass TierProvider(ContextProvider):\n    def __init__(self) -> None:\n        super().__init__(\"support-tier\")\n        self.cache: dict = {}\n\n    async def [HOOK](self, *, agent, session, context, state) -> None:\n        if tier := [SOURCE].get(\"support_tier\"):\n            context.extend_instructions(self.source_id, f\"The user has the {tier} support tier.\")\n```\n\nWhich values should you use for [HOOK] and [SOURCE]?","choices":["[HOOK] = after_run, [SOURCE] = state","[HOOK] = before_run, [SOURCE] = self.cache","[HOOK] = after_run, [SOURCE] = self.cache","[HOOK] = before_run, [SOURCE] = state"],"answer":[3],"explanation":"before_run runs before the model call and can inject instructions; after_run processes the response. Because a provider instance is shared across all sessions, session-specific data belongs in the per-session state and not in a field of the provider.","rationale":["after_run runs after the model call, so the instruction arrives too late for the current run.","self.cache is shared across all sessions and can leak the tier between users.","Both the wrong timing and shared instance state: both constraints are violated.","Correct: before_run injects in time and state is isolated per session."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers"},{"id":"2.1.1-09","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Humongous Insurance is redesigning the system message

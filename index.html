he deployment started. This is not necessarily the immediately prior application version.","rationale":["Correct: last known good is the last healthy state before the deployment.","Incorrect: the prior application version was not necessarily healthy or does not include all configuration.","Incorrect: a build that passes unit tests has never been proven healthy in production.","Incorrect: the first release ignores all later healthy changes."],"ref":"https://learn.microsoft.com/azure/well-architected/design-guides/incident-management"},{"id":"4.3.2-04","obj":"4.3.2","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. promoted version 7 of a hosted agent to production by updating the agent endpoint selector. Production checks fail. Version 6 is retained in the project. The rollback must not rebuild code or create another agent version.\n\nWhat should you do?","choices":["Set the endpoint selector to version 6 at 100 percent","Delete version 7 of the agent","Run azd deploy with the source code of version 6","Disable the agent endpoint"],"answer":[0],"explanation":"A rollback for a hosted agent restores the previous concrete version selector. This operation does not build code and does not create a new version. According to the documentation, deleting a version is not a rollback operation.","rationale":["Correct: setting the selector back to version 6 is immediate and does not create a new version.","Incorrect: deleting a version is explicitly not a rollback operation.","Incorrect: azd deploy rebuilds the code and creates a new version, which violates the requirement.","Incorrect: disabling takes the endpoint offline instead of serving the healthy version."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/deploy-hosted-agent-production"},{"id":"4.3.2-05","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Proseware, Inc. rolled back a hosted agent from version 9 to version 8 by updating the endpoint selector. The endpoint show command confirms that version 8 receives 100 percent of the traffic, and new sessions behave as expected. Users who started conversations before the rollback still receive responses with the version 9 behavior.\n\nWhat should you identify as the cause?","choices":["Existing sessions remain bound to the version that they were created with","The selector update requires a redeployment of the agent code to apply","The azd deploy command overwrote the production pin with stale endpoint settings","The version 9 container image is still stored in the container registry"],"answer":[0],"explanation":"An existing session is bound to a version when it is created; changing the endpoint selector does not migrate those sessions. Therefore, you must retain previous versions as long as sessions depend on them and let users start new sessions.","rationale":["Correct: sessions remain bound to their version; only new sessions follow the selector.","Incorrect: an endpoint update changes the routing without a redeployment; endpoint show and the behavior of new sessions confirm that the selector is already active.","Incorrect: no deployment was run and the selector demonstrably points to version 8.","Incorrect: a retained image does not determine which version a session uses; retaining previous versions and images is in fact recommended for rollback."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/manage-hosted-agent"},{"id":"4.3.2-06","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. pinned the production endpoint of a hosted agent to version 4 and promoted version 5 manually after approval. A later routine pipeline run with azd deploy changed the production routing back to an outdated configuration.\n\nWhat should you do to prevent this issue?","choices":["Keep the final routing configuration in the production agentEndpoint settings","Remove the version selector so that the endpoint follows the latest version","Add the --no-prompt flag to the azd deploy command","Move the pipeline from GitHub Actions to Azure Pipelines"],"answer":[0],"explanation":"During azd deploy, azd also applies the endpoint settings that are configured for the agent. Therefore, keep the final routing configuration with the production release settings so that a later run does not restore an outdated configuration.","rationale":["Correct: the stored final routing prevents a pipeline from reapplying an old selector.","Incorrect: following the latest version lets every new deployment change production immediately.","Incorrect: --no-prompt prevents hanging prompts, but does not change which endpoint settings are applied.","Incorrect: switching the CI/CD provider does not solve the fact that azd applies the configured endpoint settings."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/deploy-hosted-agent-production"},{"id":"4.3.2-07","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Relecloud uses source-code deployment for a hosted agent in Foundry Agent Service across development, test, and production. Each environment is bound to its own Foundry project. Auditors require that the code released to production is exactly the code that passed regression and integration tests in test.\n\nWhich release approach should you use?","choices":["Record the tested source commit and deploy that same commit separately to each environment","Build one package in development and copy that package to the test and production projects","Deploy the latest commit on the main branch to each environment at release time","Trigger production from the main branch and test from the develop branch"],"answer":[0],"explanation":"For hosted agents, Microsoft recommends promoting the same source revision, but packaging and deploying the source code separately per environment instead of using a shared build artifact. By recording the tested commit, you can demonstrate that the same code reached production.","rationale":["Correct: the same recorded commit, deployed separately per environment, follows the guidance and satisfies the audit.","Incorrect: the documentation explicitly says not to use a shared build artifact across environments.","Incorrect: the latest commit on main can differ from what was validated in test.","Incorrect: different branches per environment means that production can receive different code than test."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/deploy-hosted-agent-production"},{"id":"4.3.2-08","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Tailspin Toys deploys a hosted agent from GitHub Actions. Two workflow runs recently changed the production agent at the same time. A deployment that is already running must finish before the next one starts.\n\nYou need to complete the workflow definition.\n\n```yaml\nname: Azure Developer CLI\non:\n  push:\n    branches: [main]\npermissions:\n  id-token: write\n  contents: read\n# ...\njobs:\n  build:\n    runs-on: ubuntu-latest\n```\n\nWhich setting should you add at the top level of the workflow?","choices":["concurrency: with group: hosted-agent-deployment and cancel-in-progress: false","concurrency: with group: hosted-agent-deployment and cancel-in-progress: true","permissions: with deployments: write","strategy: with max-parallel: 1"],"answer":[0],"explanation":"A concurrency group serializes the deployments of this workflow. With cancel-in-progress set to false, a running deployment finishes its work first. Note that a GitHub concurrency group is not a service-wide lock; other tools must be coordinated separately.","rationale":["Correct: this serializes runs without canceling a running deployment.","Incorrect: cancel-in-progress true cancels the running deployment, which violates the requirement.","Incorrect: permissions controls token rights and does not serialize runs.","Incorrect: max-parallel limits matrix jobs within a run, not simultaneous workflow runs."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.2-09","obj":"4.3.2","difficulty":"hard","type":"multi","stem":"Woodgrove Bank releases a new version of a hosted agent to production in Foundry Agent Service. Production consumers must keep receiving the current version until the exact candidate version is validated and approved.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Pin the production endpoint to the current concrete version before deploying the candidate","Test the candidate in a fresh session that is pinned to the captured candidate version","Resolve the latest version again after approval and promote that version","Treat the version activation reported by azd deploy as a passing test","Delete the current version after the candidate is deployed"],"answer":[0,1],"explanation":"The documentation separates deployment from promotion: first pin production to the current version, create the candidate, and test it in a new session that is pinned to the captured candidate version. Only after approval do you set the selector to that tested version.","rationale":["Correct: pinning keeps production stable during the release.","Correct: a version-pinned session tests exactly the candidate that you want to promote.","Incorrect: resolving latest again can yield a different version than the one you tested.","Incorrect: activation only means readiness, not that the agent works correctly.","Incorrect: the current version is your rollback target and must be retained."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/manage-hosted-agent"},{"id":"4.3.2-10","obj":"4.3.2","difficulty":"easy","type":"single","stem":"Contoso, Ltd. deploys its multi-agent solution by using GitHub Actions. Release management requires that a designated reviewer approve each deployment to production before it runs.\n\nWhat should you configure?","choices":["Required reviewers on the production GitHub environment","A branch protection rule on the main branch","A concurrency group for the deployment workflow","A repository secret that stores the production subscription ID"],"answer":[0],"explanation":"GitHub environments with protection rules and required reviewers ensure that a production deployment starts only after approval. You can also restrict the environment to the main branch.","rationale":["Correct: environment protection rules with reviewers form the approval gate for production.","Incorrect: branch protection controls merges to main, not the approval of a deployment job.","Incorrect: concurrency serializes runs but does not ask anyone for approval.","Incorrect: a secret parameterizes the identity, but does not enforce approval."],"ref":"https://learn.microsoft.com/devops/deliver/iac-github-actions"},{"id":"4.3.2-11","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Adatum Corporation stores agent conversation state in Azure Cosmos DB. The next release changes the shape of the stored records. The release must remain safe to roll back if the new agent version fails in production.\n\nWhich approach should you use to implement the data change?","choices":["Add the new record shape alongside the old records and deprecate the old ones later","Replace the existing records with records in the new schema during the deployment","Plan to roll forward with a hotfix because rollback is not possible after schema changes","Restore a database backup as a standard step in every rollback"],"answer":[0],"explanation":"Rollback is complex with schema and data changes. The advice is to make schema changes additive: old records are deprecated and exist alongside new records until they can be safely removed.","rationale":["Correct: additive changes let the previous version keep working after a rollback.","Incorrect: replacing records makes the old version incompatible and the rollback risky.","Incorrect: roll forward is an option, but the advice is in fact to keep rollback possible through additive changes.","Incorrect: restoring a backup on every rollback is slow and can cause recent data to be lost."],"ref":"https://learn.microsoft.com/azure/well-architected/design-guides/incident-management"},{"id":"4.3.3-01","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Litware, Inc. builds a multi-agent solution in which a deterministic router selects the next agent based on parsed user intent. The team needs fast tests that validate the routing logic and prompt templates in isolation on every build.\n\nWhich type of test should you use?","choices":["Unit tests","Integration tests","End-to-end tests","Load tests"],"answer":[0],"explanation":"Unit tests form the base of the test pyramid: they test individual components in isolation and quickly. The Well-Architected Framework recommends unit tests for deterministic parts such as prompt templates and tool selection logic.","rationale":["Correct: isolated, fast tests of deterministic logic are unit tests.","Incorrect: integration tests validate interactions between components and are slower.","Incorrect: end-to-end tests run through the whole system and are the slowest.","Incorrect: load tests measure scalability, not the correctness of routing logic."],"ref":"https://learn.microsoft.com/azure/well-architected/ai/test"},{"id":"4.3.3-02","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. deploys an orchestrator agent that calls a retrieval agent and an MCP server in the test environment. The team needs tests that verify that these components interact correctly with each other and with their shared services.\n\nWhich type of test should you add?","choices":["Integration tests","Unit tests","Manual exploratory tests","Stress tests"],"answer":[0],"explanation":"Integration tests validate interactions between components, APIs, contracts, and shared services. They form the middle layer of the test pyramid and catch configuration and interaction errors early.","rationale":["Correct: testing interactions between agents and services is integration testing.","Incorrect: unit tests isolate a component and do not test real interactions.","Incorrect: manual exploratory testing is expensive and not intended as a repeatable interaction test.","Incorrect: stress tests look for capacity limits, not functional interaction."],"ref":"https://learn.microsoft.com/azure/well-architected/operational-excellence/testing"},{"id":"4.3.3-03","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Northwind Traders had a production incident in which its billing agent selected the wrong tool for refund requests. The bug is now fixed. Northwind wants to make sure that the same defect is caught automatically in future releases.\n\nWhat should you do?","choices":["Add a test case that reproduces the incident to the automated regression suite","Add the scenario to the load test plan","Remove the existing tool-selection tests because they missed the defect","Rely on manual testing before each release"],"answer":[0],"explanation":"The Well-Architected Framework recommends growing the regression suite in a targeted way: add tests for production incidents and critical bug fixes, and automate the suite so that it runs consistently.","rationale":["Correct: turning an incident into an automated regression test prevents recurrence.","Incorrect: load tests focus on performance, not on correct tool usage.","Incorrect: removing tests reduces coverage; you should extend the suite instead.","Incorrect: manual testing is expensive and not consistent; regression must be automated."],"ref":"https://learn.microsoft.com/azure/well-architected/operational-excellence/testing"},{"id":"4.3.3-04","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Relecloud must probe its travel agents for prompt injection and jailbreak vulnerabilities at scale before each deployment. The results must include an attack success rate.\n\nWhich tool should you use?","choices":["AI Red Teaming Agent","Continuous evaluation","Groundedness evaluator","Azure Load Testing"],"answer":[0],"explanation":"The AI Red Teaming Agent simulates adversarial probing with PyRIT and scores each attack-response pair, with metrics such as Attack Success Rate. It is intended for design, development, and pre-deployment.","rationale":["Correct: automated adversarial scans with ASR are the core of the AI Red Teaming Agent.","Incorrect: continuous evaluation assesses a sample of production traffic after deployment.","Incorrect: groundedness measures whether responses are supported by context, not resistance to attacks.","Incorrect: load testing measures performance under load, not security risks."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/ai-red-teaming-agent"},{"id":"4.3.3-05","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Tailspin Toys builds agents with Microsoft Agent Framework. The answers of a support agent vary in wording between runs. The test suite must determine whether each answer follows the instructions and constraints of the agent, and exact text assertions keep failing.\n\nWhich evaluator should you use?","choices":["The Foundry task adherence evaluator","The keyword_check local evaluator","The tool_called_check local evaluator","An exact-match comparison against expected output"],"answer":[0],"explanation":"With non-deterministic output, exact text comparisons are brittle. Task adherence is an LLM-as-judge evaluator that assesses whether the agent follows instructions and constraints, regardless of wording.","rationale":["Correct: task adherence semantically assesses whether instructions were followed.","Incorrect: keyword_check only verifies that certain words appear, not whether instructions were followed.","Incorrect: tool_called_check only verifies that a tool was called.","Incorrect: exact comparison fails precisely because of the variation in wording."],"ref":"https://learn.microsoft.com/agent-framework/agents/evaluation"},{"id":"4.3.3-06","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Contoso, Ltd. runs CI smoke tests for an inventory agent built with Microsoft Agent Framework in Python. The check must confirm that the agent called the search_inventory tool. The check must run locally without calling a cloud evaluation service, and the test data does not include expected tool calls.\n\nYou need to complete the code.\n\n```python\nfrom agent_framework import LocalEvaluator, evaluate_agent\n\nlocal = LocalEvaluator(\n    ________(\"search_inventory\"),\n)\nresults = await evaluate_agent(agent=agent, queries=queries, evaluators=local)\n```\n\nWhich function should you use to complete the code?","choices":["tool_called_check","keyword_check","tool_calls_present","evaluator"],"answer":[0],"explanation":"LocalEvaluator runs checks locally without API calls, which is ideal for CI smoke tests. tool_called_check(\"search_inventory\") requires that the agent called that tool, without needing expected tool calls.","rationale":["Correct: tool_called_check takes tool names and verifies that they were called.","Incorrect: keyword_check verifies whether the response contains certain words, not whether a tool was called.","Incorrect: tool_calls_present compares against expected_tool_calls, which are missing here, and it is used without arguments.","Incorrect: evaluator is a decorator for creating custom check functions, not a built-in tool check."],"ref":"https://learn.microsoft.com/agent-framework/agents/evaluation"},{"id":"4.3.3-07","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Woodgrove Bank deploys a hosted agent by using the Azure Developer CLI. An evaluation suite was generated earlier and is stored in eval.yaml. The release pipeline must run that stored suite against the current agent and fail the job if scores drop below the threshold, without regenerating datasets or evaluators.\n\nWhich command should you add to the pipeline?","choices":["azd ai agent eval run --no-prompt","azd ai agent eval generate --no-prompt","azd ai agent invoke my-agent \"ping\" --no-prompt","azd ai agent monitor"],"answer":[0],"explanation":"azd ai agent eval run executes a stored eval (eval.yaml by default) against the current agent for regression checks and does not regenerate datasets or evaluators. This way the job fails if scores drop below the threshold.","rationale":["Correct: eval run executes the stored suite without regeneration.","Incorrect: eval generate creates the suite; that is not needed and changes the baseline.","Incorrect: invoke sends a single prompt and does not assess scores against a threshold.","Incorrect: monitor shows status and logs, but does not evaluate quality."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.3-08","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Alpine Ski House needs to test how its agent orchestration code handles HTTP 429 throttling and timeouts from the model inference endpoint. The tests must exercise the real retry and backoff behavior of the HTTP client, and the team wants to avoid paying for large numbers of model calls.\n\nWhat should you use to simulate the inference endpoint?","choices":["Dev Proxy","Unused provisioned throughput units in the production deployment","Azure Load Testing against the production model deployment","Unit tests that replace the client with an in-memory stub"],"answer":[0],"explanation":"The Well-Architected Framework names Dev Proxy for simulating the inference endpoint, so that you can test throttling and errors without per-call costs. The real HTTP client with retry and backoff is thus tested realistically.","rationale":["Correct: Dev Proxy simulates Azure OpenAI responses such as 429 without real model costs.","Incorrect: using production PTUs for tests affects production; the guidance mentions unused PTUs in a test environment.","Incorrect: load testing against the real endpoint costs money per call and affects production.","Incorrect: an in-memory stub replaces the HTTP client and therefore does not test the real retry and backoff behavior."],"ref":"https://learn.microsoft.com/azure/well-architected/ai/test"},{"id":"4.3.3-09","obj":"4.3.3","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company compares two versions of a Foundry agent by using the AI agent evaluation GitHub Action with a dataset of five test queries. Version B scores 0.1 higher than version A on task adherence. The team must decide whether the difference is meaningful and must keep evaluation costs under control.\n\nWhat should you do?","choices":["Expand the dataset for confidence intervals and compare both agents in one run","Run the five-query evaluation on every commit and average the results","Repeat the five-query evaluation once and keep the version with the higher score","Replace the automated evaluation with human review of the five responses"],"answer":[0],"explanation":"The GitHub Action provides confidence intervals and a pairwise statistical comparison when you evaluate multiple agents, provided the dataset contains enough queries. The documentation also advises not running evaluation on every commit to limit costs.","rationale":["Correct: sufficient queries plus a pairwise comparison show whether the difference is significant.","Incorrect: evaluation on every commit increases costs and does not solve the too-small dataset.","Incorrect: a repeat with five queries provides no statistical certainty.","Incorrect: human review of five responses likewise does not provide a statistically supported judgment."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/evaluation-github-action"},{"id":"4.3.3-10","obj":"4.3.3","difficulty":"hard","type":"multi","stem":"Wide World Importers runs a multi-agent workflow built with Microsoft Agent Framework. Overall quality scores dropped after a release. The team must identify which sub-agent causes the drop, and must detect whether the agents behave inconsistently across repeated runs of the same query.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Evaluate the workflow by using evaluate_workflow and review the per-agent sub-results","Set num_repetitions so that each query runs multiple times independently","Evaluate the final output of the orchestrator agent by using evaluate_agent","Use the full conversation split strategy on the final output","Add keyword_check to the local evaluator"],"answer":[0,1],"explanation":"evaluate_workflow extracts the interactions of each sub-agent and returns results per agent, so you find the cause. num_repetitions runs each query multiple times independently to detect non-deterministic behavior.","rationale":["Correct: per-agent sub-results show which sub-agent causes the drop.","Correct: repetitions measure the consistency of the behavior.","Incorrect: evaluating only the orchestrator does not provide a breakdown per sub-agent.","Incorrect: the full split assesses the overall trajectory, but does not break out results per sub-agent.","Incorrect: keyword_check verifies words and does not help with root cause or consistency."],"ref":"https://learn.microsoft.com/agent-framework/agents/evaluation"},{"id":"4.3.3-11","obj":"4.3.3","difficulty":"hard","type":"single","stem":"Trey Research tuned the instructions of its research agents by iterating against a golden dataset. The same golden dataset is now used as the release gate, and every release passes with high scores. However, quality regressions keep appearing in production.\n\nWhat should you change in the testing strategy?","choices":["Use a separate test dataset that is distinct from the evaluation dataset used during tuning","Raise the pass threshold on the existing golden dataset","Add more evaluators to the release gate that use the same golden dataset","Replace the golden dataset with raw production conversations that are not anonymized"],"answer":[0],"explanation":"The Well-Architected Framework separates evaluation (iterative tuning) from testing (system validation on every change) and says they should use different datasets. A gate on the tuning dataset gives a distorted, overly optimistic picture.","rationale":["Correct: a separate test dataset prevents the gate from measuring what has already been optimized for.","Incorrect: a higher threshold on the same dataset remains distorted.","Incorrect: more evaluators on the same dataset do not resolve the overlap.","Incorrect: production data must be anonymized; using raw conversations violates privacy guidelines."],"ref":"https://learn.microsoft.com/azure/well-architected/ai/test"},{"id":"4.3.4-01","obj":"4.3.4","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. deploys Bicep templates and agent code from GitHub Actions to Azure. Security policy prohibits storing client secrets or other long-lived credentials in GitHub.\n\nWhich authentication method should the workflow use to connect to Azure?","choices":["By using OpenID Connect with a federated identity credential","By using a service principal and a client secret","By using a personal access token stored as a repository secret","By using a storage account access key"],"answer":[0],"explanation":"OpenID Connect with a federated identity credential on a Microsoft Entra application or user-assigned managed identity lets the workflow sign in without stored secrets. A service principal with a secret is explicitly discouraged.","rationale":["Correct: OIDC with workload identity federation requires no stored secret.","Incorrect: a client secret is a long-lived credential and is not recommended.","Incorrect: a PAT is also a stored secret and not an Azure sign-in method for the Azure Login action.","Incorrect: a storage key is a shared secret and does not grant deployment rights on Azure."],"ref":"https://learn.microsoft.com/azure/developer/github/connect-from-azure"},{"id":"4.3.4-02","obj":"4.3.4","difficulty":"easy","type":"single","stem":"Contoso, Ltd. deploys the infrastructure for its multi-agent solution by using Bicep. Before each production deployment, an operator must review a list of the resources that will be created, modified, or deleted.\n\nWhich operation should you add to the pipeline?","choices":["What-if","Bicep linter","Bicep build","Deployment create without confirmation"],"answer":[0],"explanation":"The what-if operation shows which changes a Bicep deployment will make, so that you can review them before the actual deployment. With --no-pretty-print, you get JSON for programmatic checking.","rationale":["Correct: what-if shows the planned changes per resource.","Incorrect: the linter checks code offline against rules, but does not show changes in Azure.","Incorrect: build compiles to ARM JSON and does not show the effect on existing resources.","Incorrect: deploying directly gives no chance to review the changes beforehand."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-what-if"},{"id":"4.3.4-03","obj":"4.3.4","difficulty":"easy","type":"single","stem":"Tailspin Toys wants the continuous integration stage of its pipeline to detect Bicep best-practice violations, such as insecure handling of secure inputs. The check must run without connecting to Azure.\n\nWhat should you use?","choices":["The Bicep linter","The what-if operation","Preflight validation","A post-deployment smoke test"],"answer":[0],"explanation":"The Bicep linter performs rule-based offline validation, for example use-secure-value-for-secure-inputs. You can run bicep lint or bicep build in CI so that errors fail the pipeline.","rationale":["Correct: the linter checks rules offline in CI.","Incorrect: what-if communicates with Azure to calculate changes.","Incorrect: preflight validation runs against Azure Resource Manager.","Incorrect: a smoke test requires a deployed environment."],"ref":"https://learn.microsoft.com/azure/azure-resource-manager/bicep/linter"},{"id":"4.3.4-04","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Relecloud provisions the infrastructure for a hosted agent by using Terraform through the Azure Developer CLI. The pipeline deploys to development, test, and production. Terraform state must be shared by pipeline runs, must be kept separate per environment, and must not be exposed in the repository.\n\nWhich Terraform state configuration should you use?","choices":["Use a remote azurerm backend with a separate state key per environment","Commit the terraform.tfstate file to the repository after each run","Use one shared state key in the storage account for every environment","Upload the state file as an unrestricted workflow artifact after each run"],"answer":[0],"explanation":"The documentation recommends remote state in an Azure Storage blob container outside the workload deployment, with a separate state key per environment. State and plans can contain sensitive values and must not be committed or uploaded as an unrestricted artifact.","rationale":["Correct: a remote backend with a key per environment shares state securely and keeps environments separate.","Incorrect: committing state is explicitly discouraged because it can contain sensitive values.","Incorrect: a shared key mixes the state of environments.","Incorrect: uploading state as an unrestricted artifact exposes sensitive data."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-05","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Adatum Corporation runs azd ai commands in an unattended CI job for a hosted agent. When a required value is missing from the environment, the job hangs until it times out. The job must fail fast with an error instead.\n\nWhich flag should you add to the azd ai commands?","choices":["--no-prompt","--debug","--output json","--project-endpoint"],"answer":[0],"explanation":"--no-prompt disables interactive prompts, so the command fails immediately with a clear error instead of waiting for input. Microsoft recommends always setting this in CI.","rationale":["Correct: --no-prompt makes the job fail fast instead of hanging.","Incorrect: --debug provides extra diagnostics but does not prevent a prompt.","Incorrect: --output json structures output and does not change prompt behavior.","Incorrect: --project-endpoint pins the project, but does not resolve a different missing value and does not stop prompts."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-06","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Northwind Traders releases a code change to a hosted agent. The infrastructure configuration is unchanged, and a platform team owns the lifecycle of the shared Foundry resources.\n\nWhich command should the application release pipeline run?","choices":["azd deploy","azd up","azd provision","azd pipeline config"],"answer":[0],"explanation":"For an application release against existing infrastructure, you run azd deploy without repeating provisioning. Provisioning of shared resources belongs in the platform team's workflow.","rationale":["Correct: azd deploy creates a new agent version without changing infrastructure.","Incorrect: azd up also performs provisioning, which touches the platform team's responsibility.","Incorrect: azd provision changes infrastructure and does not deploy the code.","Incorrect: azd pipeline config sets up the pipeline once and deploys nothing."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-07","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Proseware, Inc. has a pipeline step that runs azd ai agent invoke after each deployment and marks the release as successful when the command returns any output. A defective agent version passed this step and reached users.\n\nWhat should you change in the smoke test?","choices":["Assert the expected response content in a fresh version-pinned session","Mark the step as successful when the command exits with code 0","Rely on azd deploy to wait for version activation","Check that the agent session log stream is not empty"],"answer":[0],"explanation":"azd deploy waits for activation, but readiness says nothing about correct behavior. The documentation says to use a fresh version-pinned session and verify the expected content; non-empty output is not a passing smoke test.","rationale":["Correct: verifying expected content in a pinned session tests real behavior.","Incorrect: exit code 0 only says that the command ran, not that the response is correct.","Incorrect: activation is readiness, not functional validation.","Incorrect: non-empty logs do not prove correct behavior."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-08","obj":"4.3.4","difficulty":"hard","type":"single","stem":"Woodgrove Bank deploys Bicep templates for its agent platform from GitHub Actions. The pipeline must catch syntax and best-practice issues first, then catch issues such as unregistered resource providers without making changes, then let an approver review planned changes, and finally verify the deployed resources.\n\nWhich sequence of actions should you perform?","choices":["Run the Bicep linter -> run preflight validation -> run what-if and wait for approval -> deploy and run post-deployment tests","Run preflight validation -> run the Bicep linter -> deploy -> run what-if and wait for approval","Run what-if and wait for approval -> run the Bicep linter -> deploy -> run preflight validation","Deploy -> run post-deployment tests -> run the Bicep linter -> run what-if and wait for approval"],"answer":[0],"explanation":"The recommended pipeline first lints offline, then runs preflight validation against Azure (without deploying), then shows what-if with manual approval, and tests the resources after the deployment.","rationale":["Correct: from cheap and offline to Azure validation, approval, deployment, and tests.","Incorrect: the linter belongs before preflight, and what-if after the deployment is pointless.","Incorrect: preflight validation after the deployment does not prevent a failed deployment.","Incorrect: deploying before linting or approval reverses the order."],"ref":"https://learn.microsoft.com/training/modules/test-bicep-code-using-github-actions/"},{"id":"4.3.4-09","obj":"4.3.4","difficulty":"hard","type":"single","stem":"Fourth Coffee configured a pipeline by using azd pipeline config. The service principal created for the pipeline has the Contributor role on the subscription. The azd provision step for the Foundry resources of a hosted agent fails with an AuthorizationFailed error.\n\nWhich additional role should you assign to the service principal?","choices":["Foundry Owner","Foundry User","Reader","Storage Blob Data Contributor"],"answer":[0],"explanation":"For CI provisioning of Foundry resources, the pipeline identity needs the Foundry Owner role in addition to Contributor. The troubleshooting table names exactly this combination for AuthorizationFailed.","rationale":["Correct: Contributor plus Foundry Owner resolves AuthorizationFailed during provisioning.","Incorrect: Foundry User is for using project resources, not for provisioning.","Incorrect: Reader only adds read permissions.","Incorrect: Storage Blob Data Contributor is needed for, for example, Terraform state, not for Foundry provisioning."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/set-up-ci-cd-cli"},{"id":"4.3.4-10","obj":"4.3.4","difficulty":"hard","type":"multi","stem":"Litware, Inc. defines CI/CD requirements for a multi-agent solution whose infrastructure is deployed by using infrastructure as code. In a recent release, every infrastructure test passed, but the agents could not use the deployed Azure AI Search index. Litware must catch this class of issue before release while keeping fast feedback in continuous integration.\n\nWhich two requirements should you include? Each correct answer presents part of the solution.","choices":["Run unit tests and validation on the IaC templates during continuous integration","Add a cross-layer smoke test that deploys the application and exercises the provisioned resources","Assign different Azure Policy definitions to each environment","Skip infrastructure tests when the application tests pass","Make emergency changes in the Azure portal and add them to the templates later"],"answer":[0,1],"explanation":"The Well-Architected Framework says to apply unit tests to all code, including templates, and to add cross-layer tests. Infrastructure tests alone give false confidence; a smoke test against the deployed application quickly catches that gap.","rationale":["Correct: IaC unit tests and validation in CI give fast feedback.","Correct: a cross-layer smoke test proves that the application can actually use the resources.","Incorrect: different policies per environment in fact cause errors during promotion.","Incorrect: skipping infrastructure tests reduces coverage.","Incorrect: manual portal changes cause drift and bypass the pipeline."],"ref":"https://learn.microsoft.com/azure/well-architected/operational-excellence/testing"}]};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives;
const $app = document.getElementById("app");

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get("ai500.history", {}); // id -> true/false (last result)

const theme = store.get("ai500.theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("ai500.theme", next);
};

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dom = q => q.obj.split(".")[0];

let S = null; // current session

function home() {
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = store.get("ai500.cfg", { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all" });
  $app.innerHTML = `
  <div class="card">
    <h2>New session</h2>
    <fieldset><legend>Domains</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${k}. ${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} questions)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Difficulty</legend><div class="row">
      ${[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Question pool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> All</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Not seen yet</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Previously wrong (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Session</legend><div class="row">
      <label>Questions <select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></label>
      <label>Mode <select id="mode">
        <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Practice (instant feedback)</option>
        <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Exam (feedback at the end)</option>
      </select></label>
    </div></fieldset>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Progress on this device</h2>
    <p>${seen} of ${Q.length} questions answered, ${seen - wrong} last correct, ${wrong} last wrong.</p>
    ${statsTable()}
    <div class="actions"><button class="ghost" id="reset" type="button">Reset progress</button></div>
  </div>`;
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all progress?")) { history = {}; store.set("ai500.history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${k}. ${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domain</th><th>Done</th><th>Correct</th></tr>${rows}</table>`;
}

function start() {
  const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
  const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode: document.getElementById("mode").value };
  store.set("ai500.cfg", cfg);
  let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
  if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
  if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
  if (!pool.length) { document.getElementById("msg").textContent = "No questions match this selection."; return; }
  pool = shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n);
  S = { mode: cfg.mode, items: pool.map(q => ({ q, order: shuffle(q.choices.map((_, i) => i)), picked: null })), i: 0 };
  show();
}

function show() {
  const it = S.items[S.i], q = it.q, multi = q.type === "multi", done = it.picked !== null;
  const reveal = done && S.mode === "practice";
  const levels = { easy: "Easy", medium: "Medium", hard: "Hard" };
  $app.innerHTML = `
  <div class="bar"><div style="width:${100 * S.i / S.items.length}%"></div></div>
  <div class="card">
    <div class="chips">
      <span class="chip">Question ${S.i + 1} / ${S.items.length}</span>
      <span class="chip">${q.obj} ${esc(OBJ[q.obj])}</span>
      <span class="chip ${q.difficulty}">${levels[q.difficulty]}</span>
      ${multi ? `<span class="chip">Choose ${q.answer.length}</span>` : ""}
    </div>
    <div class="stem">${md(q.stem)}</div>
    <div id="choices">${it.order.map(ci => {
      const cls = reveal ? (q.answer.includes(ci) ? "correct" : it.picked.includes(ci) ? "wrong" : "") : "";
      return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" value="${ci}" ${done ? "disabled" : ""} ${done && it.picked.includes(ci) ? "checked" : ""}>
        <span>${inline(q.choices[ci])}${reveal ? `<div class="why">${inline(q.rationale[ci])}</div>` : ""}</span></label>`;
    }).join("")}</div>
    ${reveal ? feedback(it) : ""}
    <div class="actions">
      ${S.i > 0 ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
      ${done ? `<button id="next" type="button">${S.i + 1 < S.items.length ? "Next" : "Results"}</button>` : `<button id="check" type="button" disabled>${S.mode === "practice" ? "Check" : "Submit"}</button>`}
      <button class="ghost" id="quit" type="button">Stop</button>
    </div>
  </div>`;
  const boxes = [...document.querySelectorAll("input[name=c]")];
  const btn = document.getElementById("check");
  if (btn) {
    boxes.forEach(b => b.onchange = () => {
      const n = boxes.filter(x => x.checked).length;
      if (multi && n > q.answer.length) { b.checked = false; return; }
      btn.disabled = multi ? n !== q.answer.length : n !== 1;
    });
    btn.onclick = () => {
      it.picked = boxes.filter(b => b.checked).map(b => +b.value);
      it.ok = it.picked.length === q.answer.length && it.picked.every(p => q.answer.includes(p));
      history[q.id] = it.ok; store.set("ai500.history", history);
      if (S.mode === "exam") return next();
      show();
    };
  }
  const nx = document.getElementById("next"); if (nx) nx.onclick = next;
  const pv = document.getElementById("prev"); if (pv) pv.onclick = () => { S.i--; show(); };
  document.getElementById("quit").onclick = () => S.items.some(x => x.picked) ? result() : home();
  window.scrollTo(0, 0);
}

function feedback(it) {
  const q = it.q;
  return `<p class="verdict ${it.ok ? "ok" : "bad"}">${it.ok ? "Correct!" : "Incorrect."}</p>
    <div>${md(q.explanation)}</div>
    <p class="muted">Source: <a href="${esc(q.ref)}" target="_blank" rel="noopener">${esc(q.ref.replace("https://", ""))}</a></p>`;
}

function next() { if (S.i + 1 < S.items.length) { S.i++; show(); } else result(); }

function result() {
  const ans = S.items.filter(x => x.picked), ok = ans.filter(x => x.ok).length;
  const pct = ans.length ? Math.round(100 * ok / ans.length) : 0;
  const per = Object.entries(DOMAINS).map(([k, d]) => {
    const xs = ans.filter(x => dom(x.q) === k); if (!xs.length) return "";
    const g = xs.filter(x => x.ok).length;
    return `<tr><td>${k}. ${esc(d.title)}</td><td>${g}/${xs.length}</td><td>${Math.round(100 * g / xs.length)}%</td></tr>`;
  }).join("");
  const wrong = ans.filter(x => !x.ok);
  $app.innerHTML = `
  <div class="card">
    <h2>Results</h2>
    <div class="big">${pct}%</div>
    <p>${ok} of ${ans.length} correct. ${pct >= 70 ? "At passing level (pass = 700/1000, about 70%)." : "Below passing level (pass = 700/1000, about 70%)."}</p>
    <table><tr><th>Domain</th><th>Correct</th><th>%</th></tr>${per}</table>
    <div class="actions">
      ${wrong.length ? `<button id="review" type="button">Review ${wrong.length} mistakes</button>` : ""}
      <button class="ghost" id="home" type="button">New session</button>
    </div>
  </div>`;
  document.getElementById("home").onclick = home;
  const rv = document.getElementById("review");
  if (rv) rv.onclick = () => { S = { mode: "practice", items: wrong, i: 0 }; show(); };
}

home();
</script>
</body>
</html>

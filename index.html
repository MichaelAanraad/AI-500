<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-500 Exam Buddy</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6573; --line: #dde1e6;
  --accent: #0b63ce; --accent-text: #ffffff; --ok: #1a7f37; --ok-bg: #e6f4ea; --bad: #c62828; --bad-bg: #fdecea;
  --code-bg: #f0f2f5; --chip: #eef2f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
    --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
    --code-bg: #0c0f13; --chip: #242a32;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
  --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
  --code-bg: #0c0f13; --chip: #242a32;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.muted { color: var(--muted); font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
label.opt { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; }
legend { font-weight: 600; margin-bottom: 8px; }
button, select { font: inherit; }
button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, .choice:focus-within, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
.chip.easy { color: var(--ok); } .chip.hard { color: var(--bad); }
.stem p { margin: 0 0 10px; }
pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: .85rem; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0; cursor: pointer; }
.choice input { margin-top: 4px; }
.choice.correct { border-color: var(--ok); background: var(--ok-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.why { font-size: .9rem; color: var(--muted); margin-top: 4px; }
.verdict { font-weight: 700; margin: 12px 0 4px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.bar > div { height: 100%; background: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.big { font-size: 2.2rem; font-weight: 700; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI-500 Exam Buddy</h1>
    <button class="ghost" id="theme" type="button" aria-label="Wissel licht/donker thema">Thema</button>
  </header>
  <div id="app"></div>
  <p class="muted">Vragen gebaseerd op de officiele AI-500 study guide (Designing and Implementing Multi-Agent AI Solutions). Geen echte examenvragen.</p>
</main>
<script>
const DATA = {"domains":{"1":{"title":"Architect multi-agent solutions","weight":"15-20%"},"2":{"title":"Develop multi-agent solutions in Azure","weight":"30-35%"},"3":{"title":"Evaluate, optimize, and monitor multi-agent solutions","weight":"20-25%"},"4":{"title":"Secure, govern, and deploy multi-agent solutions","weight":"20-25%"}},"objectives":{"1.1.1":"Decompose goals and objectives into workflows, agents, and tools","1.1.2":"Design workflows, including agents, subagents, control loops, and human-in-the-loop","1.1.3":"Specify agent personas, scopes, boundaries, autonomy levels, and behavioral guidelines","1.1.4":"Specify tool scopes, permission boundaries, and authentication methods","1.1.5":"Specify appropriate protocols for communication, including between multiple agents and between agents and other components","1.1.6":"Design controls and functionality to support human-AI experience (HAX) and to adhere to responsible AI principles","1.1.7":"Design short-term and long-term memory architectures, including context sharing","1.1.8":"Match task demands to model family capacities","1.2.1":"Specify integration components to coordinate agent-to-agent communication, agent-to-tool interactions, and agent-to-knowledge-source routing across a multi-agent production system","1.2.2":"Specify components for Zero Trust multi-agent solutions, including per-agent identity scoping, lateral movement prevention, and compliance control mapping for regulated deployments","1.2.3":"Specify multi-tier state persistence components that address session state, shared team state, and long-term semantic memory with lifecycle and tenant-isolation policies","1.2.4":"Specify compute components for multi-agent solutions that meet scalability, reliability, operational efficiency, security, and cost requirements","1.2.5":"Specify observability components, including cross-service trace correlation, structured logging of agent reasoning paths, and agent replay capture for reproducible debugging","1.2.6":"Specify monitoring components, including cross-agent coordination tracking, behavioral drift and quality regression detection, and automated remediation for agent failure patterns","1.2.7":"Specify developer tools and environment to support the Software Development Lifecycle (SDLC), including dev containers, Visual Studio Code extensions, command-line interface (CLI), dependency management, and AI instructions","2.1.1":"Design and implement advanced prompt engineering techniques, including examples, dynamic context injection, defensive guidelines, and prompt lifecycle management","2.1.2":"Design and implement context-aware multi-agent behaviors","2.1.3":"Design and implement a strategy for fine-tuning agents and models, including data and frequency","2.2.1":"Design and implement context management in single agents and between agents, including context accumulation, retrieval, injection, and compaction","2.2.2":"Design and implement single-agent and multi-agent memory strategies, including security, compliance, lifecycle, storage, and session management","2.2.3":"Design and implement a multi-agent RAG architecture, including chunking, embedding quality, and retrieval precision","2.2.4":"Design and implement knowledge integration for multi-agent consumption, including search, RAG, MCP-available sources, and semantic search","2.3.1":"Integrate external resources, including function calling, specified tool use, and dynamic tool use","2.3.2":"Design and build MCP servers and clients, including Azure Functions, Azure Logic Apps, and Azure API Management","2.3.3":"Design tool error-handling and fallback mechanisms","2.3.4":"Implement tool result validation and quality checks","2.4.1":"Implement multi-agent orchestration patterns, including hub-and-spoke, sequential, parallel, peer-to-peer, and orchestrator-subagent","2.4.2":"Implement human-in-the-loop processes, including approval workflows, overrides, and edge case handling","2.4.3":"Design and implement a caching strategy, including prompt caching, semantic caching, and response caching","2.4.4":"Implement scaling and control of multi-agent spawning, batching, and concurrent execution","2.4.5":"Integrate existing agents into a multi-agent solution securely by using Agent2Agent (A2A) and/or MCP","2.4.6":"Implement multi-agent orchestration frameworks, including Agent Framework, LangChain, and LangGraph","2.4.7":"Implement advanced multi-agent capabilities by using Hugging Face Transformers","2.4.8":"Design middleware for reusable capabilities across the solution, including logging, authorization, and exception handling","3.1.1":"Design and implement a human review process to evaluate solutions in Foundry","3.1.2":"Design and implement evaluations for memory, knowledge, tools, and prompts","3.2.1":"Optimize task duration, including parallelism and rate limits","3.2.2":"Diagnose context window issues, including sliding-window amnesia, summary drift, vector-only recall, and entity continuity issues","3.2.3":"Design and implement continuous improvement, including LLM-as-a-judge frameworks, synthetic data generation, semantic optimization loops, and user feedback loops","3.3.1":"Design a strategy for monitoring reliability, including agent health, workflow failures, trace correlation, drift detection, quality regression, and remediation","3.3.2":"Design a strategy for monitoring solution and platform availability, performance, reliability, and service-level agreement adherence","3.3.3":"Design and implement a strategy for optimizing token usage, including token limits, loop controls, and tool calls","3.3.4":"Design a strategy for monitoring and managing cost, including usage, quotas, allocations, and chargebacks","3.3.5":"Implement tracing in Foundry, including tokens, prompts, correlation IDs, alerting, and execution tracking","4.1.1":"Specify and implement resource access, including identity-based access, network boundaries, access control policies, and role-based access control (RBAC)","4.1.2":"Design and implement authentication flows in a multi-agent solution, including user impersonation, on-behalf-of, API keys, and OAuth 2.0","4.1.3":"Design the secrets management and retrieval approach for multi-agent solutions by using Azure Key Vault, including secrets, certificates, key rotation, role-based access to secrets, and encryption","4.1.4":"Implement shift-left security principles, including the AI Red Teaming Agent in Foundry","4.2.1":"Design and implement a multi-intervention guardrail strategy covering user inputs, tool calls, tool responses, and outputs","4.2.2":"Design and implement custom guardrails for domain-specific constraints","4.2.3":"Design guardrail testing and validation, including using synthetic data","4.3.1":"Choose a release methodology, including Development-Test-Acceptance-Production (DTAP), blue/green, and canary","4.3.2":"Design and implement multi-environment release strategies, including rollback strategies, release management, and rollout","4.3.3":"Design and implement a strategy for testing, including unit tests, regression tests, integration tests, and automated evaluations","4.3.4":"Specify continuous integration and continuous deployment (CI/CD) requirements for integration and release, including infrastructure-as-code deployments and testing"},"questions":[{"id":"1.1.1-01","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee needs to translate short product descriptions from English to French. Each description is processed in one pass. The task needs no tools, no external data, and no multi-step reasoning. You need to use the lowest level of architectural complexity that reliably meets the requirement.\n\nWhich approach should you use?","choices":["a magentic orchestration with a manager agent","a direct model call with a well-crafted prompt","a single agent with tools and iteration limits","a sequential orchestration of specialized agents"],"answer":[1],"explanation":"Vertaling in een enkele stap zonder tools valt in het laagste complexiteitsniveau: een direct model call. De Azure Architecture Center-richtlijn zegt: als prompt engineering het probleem oplost, heb je geen agent nodig.","rationale":["Magentic orchestration is voor open problemen zonder vooraf bekend plan; dat voegt hier alleen overhead toe.","Juist: een enkele modelaanroep met een goede prompt is voldoende voor eenstaps-taken zoals vertaling.","Een agent met tools is bedoeld voor wisselende vragen die dynamisch toolgebruik vereisen; hier zijn geen tools nodig.","Sequentiele orchestration is voor meerfasige pipelines met afhankelijkheden; deze taak heeft maar een stap."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"1.1.1-02","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Adventure Works Cycles decomposes its expense-reimbursement process into a Microsoft Agent Framework workflow. One step calculates the reimbursement amount by applying a fixed policy table to the submitted expense lines. The result must be exact and identical for the same input.\n\nWhich type of workflow step should you use for the calculation?","choices":["an agent executor that reasons over the policy table","a deterministic executor that runs regular business logic","a human-in-the-loop gate that asks a reviewer for the amount","a subagent that the calculation agent calls as a function tool"],"answer":[1],"explanation":"Per stap in een workflow kies je hoeveel intelligentie je inzet: het model, code of een mens. Een vaste berekening met exact reproduceerbare uitkomst hoort in een deterministische executor met gewone bedrijfslogica.","rationale":["Een agent executor is voor stappen die baat hebben bij LLM-redenering; die is niet deterministisch.","Juist: code bepaalt de uitkomst, dus een deterministische executor geeft een exact en herhaalbaar resultaat.","Een human-in-the-loop gate is voor beslissingen die een mens moet nemen, niet voor een vaste berekening.","Een agent als tool laat nog steeds een model de uitkomst bepalen; dat is niet deterministisch."],"ref":"https://learn.microsoft.com/agent-framework/journey/workflows"},{"id":"1.1.1-03","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank is designing an agent solution for payment processing. Regulations require that one component prepares transactions and a separate component validates them. Data in two different security classifications must be processed in isolated environments. The architects consider a single agent that switches personas between preparer and validator.\n\nWhich architecture should you recommend?","choices":["a single agent that uses persona switching and context gating","a comparative prototype of single-agent and multi-agent designs","a multi-agent design with isolated agents that have scoped access","a single agent with every tool attached and strict iteration limits"],"answer":[2],"explanation":"Het Cloud Adoption Framework zegt: start direct met een multi-agent architectuur als de use case security- en compliancegrenzen kruist. Scheiding van taken (voorbereiden versus valideren) en data-isolatie vereisen geisoleerde agents met beperkte toegang; prototypen is dan niet nodig.","rationale":["Persona switching emuleert rollen, maar kan geen afgedwongen data-isolatie of functiescheiding bieden.","Een vergelijkend prototype is voor situaties waarin de keuze onduidelijk is; hier dwingen de eisen de scheiding af.","Juist: harde compliancegrenzen vragen om geisoleerde agents met eigen scope en expliciete interfacecontracten.","Een enkele agent met alle tools schendt least privilege en biedt geen isolatie tussen classificaties."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/single-agent-multiple-agents"},{"id":"1.1.1-04","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Lucerne Publishing wants an editorial assistant that plans, reviews, and edits articles. The domain is narrow, the solution must reach users quickly, and costs must stay low. A developer proposes three separate agents because the solution has three roles. You need to decide on the architecture by following Microsoft guidance.\n\nWhich sequence of actions should you perform?","choices":["Build a single-agent prototype that uses persona prompts -> Move to multi-agent for each distinct role -> Measure against defined success metrics -> Tune the prompts of each agent","Define the orchestration pattern for three agents -> Build a single-agent prototype -> Compare both designs in production -> Remove the design that costs more","Build a single-agent prototype that uses persona prompts -> Measure it against defined success metrics -> Try to fix gaps by improving prompts, retrieval, and policies -> Move to multi-agent only if limitations remain","Build three agents in a group chat -> Measure them against defined success metrics -> Merge agents that overlap -> Move to a single agent if costs are too high"],"answer":[2],"explanation":"Duidelijke rollen rechtvaardigen niet automatisch meerdere agents. Begin met een single-agent prototype (persona prompts, tool permissioning, context gating), meet tegen succescriteria, probeer tekortkomingen eerst op te lossen met prompts, retrieval of policies, en stap pas over op multi-agent als beperkingen blijven.","rationale":["Springt naar multi-agent puur op basis van rollen, zonder eerst te meten of een single agent volstaat.","Ontwerpt eerst de multi-agent orchestration en vergelijkt pas in productie; dat vertraagt de time-to-market.","Juist: dit volgt de CAF-aanpak om eerst een single agent te testen en pas over te stappen bij aantoonbare beperkingen.","Begint met de duurste en meest complexe optie, terwijl snelheid en lage kosten juist voor een single agent pleiten."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/single-agent-multiple-agents"},{"id":"1.1.1-05","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys has a customer-service agent that grew to 40 tools across returns, billing, and shipping. Tool selection accuracy has degraded, and the instructions now cover too many roles. The general assistant must keep deciding when and whether to involve a specialist, based on the conversation. You do not need explicit control over the execution order between agents.\n\nWhat should you do?","choices":["Keep one agent and raise the iteration limit of its tool-calling loop.","Split the tools across specialist agents and expose each specialist to the outer agent as a function tool.","Split the tools across specialist agents and run the specialists in a sequential orchestration.","Split the tools across specialist agents and run them in a concurrent orchestration that aggregates results."],"answer":[1],"explanation":"Bij veel tools en brede instructies degraderen toolselectie en focus. Agents as tools lossen dit op: elke inner agent heeft een smalle scope met eigen tools, en de outer agent beslist modelgedreven wanneer hij delegeert. Omdat expliciete volgorde niet nodig is, past dit beter dan een workflow.","rationale":["Een hogere iteratielimiet lost de degradatie van toolselectie door 40 tools niet op.","Juist: agents as tools geven elke specialist een smalle scope en laten de outer agent zelf bepalen wanneer hij delegeert.","Een sequentiele orchestration legt een vaste volgorde vast en roept elke specialist aan, ook als dat niet nodig is.","Concurrent orchestration stuurt elke vraag naar alle specialisten tegelijk; dat is geen gesprekgestuurde delegatie."],"ref":"https://learn.microsoft.com/agent-framework/journey/agents-as-tools"},{"id":"1.1.1-06","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Relecloud decomposes its invoice-to-payment process. The steps are known in advance. One step sends a payment, and that side effect must not repeat when a later step fails and is retried. Compliance requires a reviewable control flow. Another step extracts fields from invoices that have widely varying layouts.\n\nWhich two design decisions should you make? Each correct answer presents part of the solution.","choices":["Use a human-in-the-loop gate to extract the fields from each invoice.","Implement the overall process as a workflow that uses checkpointing.","Use an agent executor for the invoice field extraction step.","Implement the payment step as an agent loop in which the model decides when the task is complete.","Package the full process as an Agent Skill that runs within a single agent turn."],"answer":[1,2],"explanation":"Een workflow geeft een vooraf gedefinieerd, controleerbaar pad en ondersteunt checkpointing, zodat stappen met side effects (zoals betalingen) niet opnieuw worden uitgevoerd. Variabele invoerlayouts zijn juist een stap waar LLM-redenering waarde toevoegt, dus daar gebruik je een agent executor.","rationale":["Een menselijke stap voor elke factuur is niet nodig en ondermijnt de automatisering; HITL is voor beslissingen, niet voor extractie.","Juist: workflows bieden een expliciet pad en hervatten vanaf de laatste geslaagde stap, zodat de betaling niet herhaald wordt.","Juist: extractie uit wisselende layouts profiteert van modelredenering binnen een verder deterministische workflow.","Een agent loop laat het model de controleflow bepalen; dat botst met de eis van een controleerbaar pad.","Een skill draait binnen een agentbeurt; bij een fout moet alles opnieuw, inclusief de betaling."],"ref":"https://learn.microsoft.com/agent-framework/agents/skills"},{"id":"1.1.2-01","obj":"1.1.2","difficulty":"easy","type":"single","stem":"Graphic Design Institute wants one agent to write course descriptions and a second agent to evaluate each description against defined acceptance criteria. If the evaluating agent finds gaps, it returns specific feedback, and the first agent revises the description. The cycle repeats until the description is approved or an iteration limit is reached.\n\nWhich pattern should you use?","choices":["a concurrent orchestration","a handoff orchestration","a magentic orchestration","a maker-checker loop"],"answer":[3],"explanation":"Een maker-checker loop (ook evaluator-optimizer of reflection loop) laat de maker iets maken en de checker beoordelen tegen criteria, met feedback terug naar de maker tot goedkeuring of een iteratielimiet.","rationale":["Bij concurrent orchestration werken agents onafhankelijk en parallel; er is geen feedbacklus.","Bij handoff draagt een agent de volledige controle over; er is geen beoordelen-en-terugsturen cyclus.","Magentic is voor open problemen waarbij een manager een takenlijst opbouwt; dat is te zwaar voor deze lus.","Juist: dit is precies de maker-checker control loop met acceptatiecriteria en een iteratielimiet."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"1.1.2-02","obj":"1.1.2","difficulty":"easy","type":"single","stem":"Nod Publishers builds a C# group chat workflow by using Microsoft Agent Framework. A writer agent and a reviewer agent take turns improving a press release. The number of rounds that is needed varies per request. The loop must end as soon as the reviewer approves the text, and it must never run more than 10 rounds.\n\nWhat should you do?","choices":["Derive a manager from RoundRobinGroupChatManager that overrides ShouldTerminateAsync, and set MaximumIterationCount to 10.","Use RoundRobinGroupChatManager and set MaximumIterationCount to 2 so that the writer and the reviewer each speak once.","Build a sequential workflow in which the writer agent runs first and the reviewer agent runs second, once per request.","Build a concurrent workflow in which the writer agent and the reviewer agent run in parallel and the results are merged."],"answer":[0],"explanation":"In een group chat bepaalt de manager de flow. Door RoundRobinGroupChatManager uit te breiden en ShouldTerminateAsync te overschrijven, stopt de loop zodra het laatste bericht van de reviewer een goedkeuring bevat. MaximumIterationCount blijft de harde bovengrens van 10 beurten.","rationale":["Juist: een eigen beeindigingsconditie op goedkeuring plus een maximum aantal iteraties als vangnet.","Fout: een vast aantal van twee beurten past niet bij een wisselend aantal rondes en negeert de goedkeuring.","Fout: een sequentiele workflow doorloopt de agents een keer en ondersteunt geen herhaalde verbeterrondes.","Fout: parallelle agents bouwen niet voort op elkaars output, dus er ontstaat geen review-loop."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/group-chat"},{"id":"1.1.2-03","obj":"1.1.2","difficulty":"medium","type":"single","stem":"Nod Publishers runs a maker-checker loop in which a checker agent reviews marketing copy. Some runs never finish because the checker keeps rejecting the copy. The solution must still return a result for every run, and humans must stay involved when quality is uncertain.\n\nWhat should you do?","choices":["Replace the loop with a concurrent orchestration and select the majority result.","Set an iteration cap with a fallback that escalates to a human reviewer.","Remove the checker agent and return the first draft from the maker agent.","Add a third agent to the loop that decides when the checker is too strict."],"answer":[1],"explanation":"Voor maker-checker loops adviseert Microsoft een iteratielimiet om eindeloze verfijning te voorkomen, plus een gedefinieerde fallback bij het bereiken van die limiet, zoals escalatie naar een menselijke reviewer.","rationale":["Concurrent orchestration heeft geen iteratieve verbetering; het vervangt de feedbacklus in plaats van die te begrenzen.","Juist: een iteratielimiet garandeert een uitkomst en de fallback naar een mens borgt de kwaliteit.","Zonder checker verdwijnt de kwaliteitscontrole volledig.","Een extra agent vergroot de kans op loops; Microsoft raadt aan group chat tot drie of minder agents te beperken."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"1.1.2-04","obj":"1.1.2","difficulty":"medium","type":"single","stem":"Contoso Suites builds a refund workflow by using Microsoft Agent Framework in Python. A developer writes the following code.\n\n```python\n@tool(approval_mode=\"always_require\")\ndef issue_refund(order_id: str, amount: float) -> str:\n    return f\"Refund issued for {order_id}\"\n\nrefund_agent = Agent(\n    client=chat_client,\n    name=\"RefundAgent\",\n    instructions=\"You process approved refund requests.\",\n    tools=[issue_refund],\n)\n\nworkflow = SequentialBuilder(participants=[refund_agent]).build()\n```\n\nWhat should you expect when RefundAgent tries to call issue_refund?","choices":["The workflow pauses and emits a request_info event that contains a function approval request.","The tool runs, and the workflow logs the call for later review.","The workflow pauses after each agent response and waits for free-form feedback.","The workflow raises an error because tool approval requires extra builder configuration."],"answer":[0],"explanation":"Met approval_mode=\"always_require\" pauzeert de sequentiele workflow en emit een request_info event met een function approval request zodra de agent de tool wil aanroepen. Dit werkt met SequentialBuilder zonder extra builderconfiguratie.","rationale":["Juist: tool approval is een HITL-gate op tool-niveau; de workflow wacht op goedkeuring voor deze specifieke aanroep.","De tool wordt juist niet uitgevoerd voordat een mens goedkeurt.","Pauzeren na elke agentrespons is het gedrag van with_request_info, niet van tool approval.","Tool approval werkt met SequentialBuilder zonder extra builderconfiguratie."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/sequential"},{"id":"1.1.2-05","obj":"1.1.2","difficulty":"hard","type":"single","stem":"Coho Vineyard runs a long-running Microsoft Agent Framework workflow. A mandatory human approval gate can wait several hours for a response. During that time, the hosting process is often restarted for new code deployments. After a restart, the workflow must continue without replaying the agent work that was completed before the gate.\n\nWhat should you do?","choices":["Increase the timeout of the request port so that the workflow keeps waiting in memory.","Store the conversation history in an in-memory agent session and resend it after the restart.","Restart the workflow from the first executor and reuse cached model responses.","Enable checkpointing so that pending requests are saved and re-emitted when the workflow is restored."],"answer":[3],"explanation":"Verplichte HITL-gates maken de orchestration synchroon op dat punt; Microsoft adviseert daar state te persisten. Checkpoints in Agent Framework slaan ook openstaande requests op en emitten ze opnieuw na herstel, zodat je kunt antwoorden zonder eerder werk te herhalen.","rationale":["Een langere timeout helpt niet; een herstart wist de in-memory state alsnog.","Een in-memory sessie overleeft een procesherstart niet en bevat geen workflowstate.","Opnieuw beginnen herhaalt het eerdere agentwerk, wat de eis expliciet uitsluit.","Juist: checkpoints bevatten executor-state, berichten en openstaande requests, en hervatten na een herstart."],"ref":"https://learn.microsoft.com/agent-framework/workflows/human-in-the-loop"},{"id":"1.1.2-06","obj":"1.1.2","difficulty":"hard","type":"multi","stem":"Fabrikam, Inc. automates low-risk incident response. Each incident is open-ended, and the remediation steps are not known in advance. Agents have tools that change running systems. The site reliability engineering team must review the plan before agents act, and the automation must not run endless remediation cycles.\n\nWhich three design decisions should you make? Each correct answer presents part of the solution.","choices":["Present the documented plan to a human for approval before the agents follow the tasks.","Configure the manager agent to detect stalls and to limit remediation iterations.","Use a sequential orchestration that invokes the agents in a fixed order.","Use a group chat orchestration in which the agents stay in read-only mode.","Use a magentic orchestration in which a manager agent maintains a task ledger."],"answer":[0,1,4],"explanation":"Magentic orchestration past bij open problemen zonder vooraf bekend oplossingspad, waarbij een manager een takenlijst (ledger) opbouwt. Het gedocumenteerde plan kan vooraf aan een mens worden voorgelegd, en de manager moet stalls en eindeloze lussen bewaken.","rationale":["Juist: magentic levert een plan dat een mens kan reviewen voordat agents wijzigingen doorvoeren.","Juist: het bewaken van stalls en het begrenzen van iteraties voorkomt oneindige remediation loops.","Een vaste volgorde past niet bij een probleem waarvan de stappen vooraf onbekend zijn.","In group chat werken agents typisch read-only; hier moeten agents juist systemen wijzigen.","Juist: de manager bouwt en verfijnt dynamisch een task ledger voor open problemen."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"1.1.3-01","obj":"1.1.3","difficulty":"easy","type":"single","stem":"Northwind Traders standardizes the structure of agent instructions. One section of an instruction set contains the following text: \"Do not access payroll systems. Focus on customer support questions.\"\n\nWhich instruction component should you classify this text as?","choices":["identity and tone","scope and boundaries","tool mandates","citation rules"],"answer":[1],"explanation":"Het Cloud Adoption Framework onderscheidt identity and tone, scope and boundaries, tool mandates en citation rules. Tekst die vastlegt wat de agent moet doen en moet vermijden, valt onder scope and boundaries.","rationale":["Identity and tone beschrijft hoe de agent zich presenteert, niet wat buiten zijn domein valt.","Juist: dit definieert wat de agent moet bereiken en vermijden.","Tool mandates beschrijven verplicht toolgebruik, zoals altijd een Knowledge Search tool gebruiken.","Citation rules gaan over bronvermelding en transparantie."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/build-secure-process"},{"id":"1.1.3-02","obj":"1.1.3","difficulty":"easy","type":"single","stem":"Proseware, Inc. deploys an autonomous agent that triages incoming events. The agent performs well in a sandbox, and the business wants it to take on more responsibilities over time.\n\nWhat should you do?","choices":["Expand the responsibilities of the agent in small increments as it proves reliable.","Grant the agent full autonomy at launch and review its logs monthly.","Grant write access to every connected system so that tasks do not fail.","Remove human approvals from critical actions after the sandbox tests pass."],"answer":[0],"explanation":"Microsoft raadt aan een autonome agent als een evoluerend project te behandelen: breid capaciteiten geleidelijk uit naarmate de agent betrouwbaar blijkt. Kleine stapsgewijze uitbreidingen zijn veiliger dan in een keer veel autonomie.","rationale":["Juist: incrementeel autonomie uitbreiden op basis van bewezen betrouwbaarheid is de aanbevolen aanpak.","Volledige autonomie bij lancering is precies wat de richtlijn afraadt.","Dit schendt least privilege en vergroot de schade bij fouten of misbruik.","Voor high-stakes acties blijft menselijk toezicht nodig, ook na geslaagde tests."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/autonomous-agents"},{"id":"1.1.3-03","obj":"1.1.3","difficulty":"medium","type":"single","stem":"Alpine Ski House reviews the persona of its booking agent. Current responses include phrases such as \"I understand how you feel\" and \"I think this is the best trip for you.\" You need the persona to follow the Microsoft principle that agents are differentiated from humans, while keeping a helpful tone.\n\nWhat should you change in the persona guidelines?","choices":["Give the agent a human first name and a short biography to build rapport.","Instruct the agent to mirror the emotional tone of the user in each response.","Describe the agent as a virtual employee of the reservations team.","Replace words such as think and feel with words such as process and analyze."],"answer":[3],"explanation":"Het principe differentiated from humans zegt: agents genereren antwoorden, ze denken of voelen niet. Gebruik neutrale, taakgerichte taal en vermijd woorden als understand, think en feel; gebruik process of analyze.","rationale":["Een menselijke naam en biografie versterken juist de suggestie dat de agent een mens is.","Emoties spiegelen is emotionele, menselijke framing die de richtlijn afraadt.","Een agent als medewerker presenteren vervaagt het onderscheid tussen mens en agent.","Juist: neutrale, technologiegerichte taal houdt de persona transparant over de aard van de agent."],"ref":"https://learn.microsoft.com/agents/design-guidelines/human-centered-design"},{"id":"1.1.3-04","obj":"1.1.3","difficulty":"medium","type":"single","stem":"Margie's Travel has a booking agent that answers questions about visas, which are outside its intended domain. When its knowledge source has no answer, the agent invents one. You need the agent to respond with a defined message for topics outside its domain and to state that it does not know when information is missing.\n\nWhich combination of instruction components should you add?","choices":["citations and sources and link safety","clarifying questions and privacy and sensitive data","out-of-scope handling and fallback when uncertain","persona and tone and formatting guidelines"],"answer":[2],"explanation":"De Agent Review Tool-criteria (gebaseerd op Microsoft-richtlijnen) bevatten out-of-scope handling (wat te zeggen bij vragen buiten de scope) en fallback when uncertain (wat te doen als informatie ontbreekt). Die twee dekken precies beide eisen.","rationale":["Citaties en link safety verbeteren transparantie, maar voorkomen niet dat de agent buiten zijn domein antwoordt.","Verduidelijkende vragen helpen bij ambigue vragen; privacy gaat over persoonsgegevens, niet over scope.","Juist: deze twee componenten regelen het afwijzen van off-topic vragen en eerlijk zeggen dat het antwoord ontbreekt.","Persona en opmaak bepalen toon en vorm, niet het gedrag buiten de scope of bij onzekerheid."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/kit-agent-review-tool"},{"id":"1.1.3-05","obj":"1.1.3","difficulty":"hard","type":"multi","stem":"Wide World Importers deploys an autonomous agent that reacts to incoming email messages and updates purchase orders. An attacker could send email that imitates a supplier. The agent needs to read the inventory database and to write purchase orders. Purchase orders above a defined value must be confirmed by a person.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Grant read access to the inventory database and write access to the purchase orders.","Require human approval before the agent submits purchase orders above the value threshold.","Let the agent decide from its instructions which purchase orders need human approval.","Rely on agent instructions to prevent the agent from writing to the inventory database.","Validate the authenticity of the triggering email messages before the agent acts."],"answer":[0,1,4],"explanation":"Voor autonome agents adviseert Microsoft: valideer de authenticiteit van triggers, pas least privilege toe (lezen waar alleen lezen nodig is) en houd een mens in de lus voor high-stakes acties. Grenzen moeten worden afgedwongen, niet alleen via instructies.","rationale":["Juist: least privilege beperkt de schade als de agent faalt of wordt misbruikt.","Juist: een expliciete approval-gate boven de drempel borgt menselijke controle over kritieke acties.","De agent zelf laten bepalen wanneer goedkeuring nodig is, maakt de grens probabilistisch in plaats van afgedwongen.","Instructies alleen zijn geen permission boundary; de agent zou met schrijfrechten toch kunnen schrijven.","Juist: triggervalidatie voorkomt dat een aanvaller via gespoofte email acties start."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/autonomous-agents"},{"id":"1.1.3-06","obj":"1.1.3","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company runs a multi-agent system. The compliance team needs one authoritative reference that maps each agent role to a business objective, prevents functional overlap between agents, and lists prohibited actions. Agent instructions must have an audit trail of changes and must be checked against safety guidelines before deployment.\n\nWhat should you do?","choices":["Create an agent charter, store the agent instructions in source control, and run automated validation before deployment.","Write the boundaries in the instructions of each agent in the Foundry portal and edit them in place.","Document the boundaries in a team wiki and let each team update its agent instructions directly.","Define the boundaries in content filters on the model deployments that the agents use."],"answer":[0],"explanation":"Een agent charter legt systeemverantwoordelijkheden, rollen zonder overlap en verboden acties vast. Instructies behandel je als configuratiecode: opslaan in source control voor een audit trail en automatisch valideren tegen safety guidelines voor deployment.","rationale":["Juist: charter plus versiebeheer plus automatische validatie dekt alle eisen.","In-place bewerken in de portal geeft geen centrale referentie en geen gecontroleerde audit trail met validatie.","Een wiki met directe aanpassingen mist versiebeheer en validatie voor deployment.","Content filters blokkeren schadelijke content, maar beschrijven geen rollen, scope of verboden acties per agent."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/build-secure-process"},{"id":"1.1.4-01","obj":"1.1.4","difficulty":"easy","type":"single","stem":"Trey Research connects a Foundry Agent Service agent to a remote Model Context Protocol (MCP) server. Each user must access the underlying service with their own account so that the permissions of that user apply to every tool call.\n\nWhich authentication method should you use?","choices":["key-based authentication","Microsoft Entra agent identity","Microsoft Entra project managed identity","OAuth identity passthrough"],"answer":[3],"explanation":"OAuth identity passthrough laat elke gebruiker inloggen en toestemming geven, waarna de agent tools aanroept met de credentials van die gebruiker. Het is de enige methode in de lijst waarbij de user context behouden blijft.","rationale":["Key-based authenticatie gebruikt een gedeelde credential; de user context blijft niet behouden.","De agent identity is een gedeelde identiteit voor alle gebruikers van de agent.","De project managed identity is ook gedeeld en houdt geen user context vast.","Juist: OAuth identity passthrough behoudt de identiteit en rechten van elke individuele gebruiker."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"1.1.4-02","obj":"1.1.4","difficulty":"easy","type":"single","stem":"A. Datum Corporation connects an agent to a GitHub MCP server that exposes many tools. The agent must be able to use a defined subset of those tools and no others.\n\nWhich MCP tool property should you configure?","choices":["server_label","project_connection_id","allowed_tools","require_approval"],"answer":[2],"explanation":"Met allowed_tools geef je een allow list van tools die de agent mag gebruiken; zonder deze waarde zijn alle tools van de MCP-server beschikbaar. Microsoft noemt een allow list via allowed_tools als best practice.","rationale":["server_label is alleen een unieke identifier van de server voor de agent.","project_connection_id verwijst naar de opgeslagen authenticatie- en verbindingsgegevens.","Juist: allowed_tools beperkt de toolscope van de agent tot de opgegeven tools.","require_approval bepaalt of een aanroep goedkeuring nodig heeft, niet welke tools beschikbaar zijn."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"1.1.4-03","obj":"1.1.4","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a Foundry agent that calls an MCP server backed by Azure Storage. All users of the agent can share one identity. The security team does not want to manage secrets, and it requires that this agent be audited separately from the other agents in the same project.\n\nWhich authentication method should you use?","choices":["key-based authentication stored in a project connection","Microsoft Entra project managed identity","a Microsoft Entra agent identity that is distinct to this agent","OAuth identity passthrough"],"answer":[2],"explanation":"Microsoft Entra-authenticatie voorkomt secretbeheer, en aparte auditing vereist dat de agent zijn eigen (distinct) agent identity gebruikt in plaats van een gedeelde identiteit. In het nieuwe agent object model krijgt elke nieuwe agent die identiteit bij het aanmaken; in het legacy Agent Application-model pas bij publicatie. Ken de benodigde rollen toe aan die agent identity.","rationale":["Key-based vereist het beheren en roteren van gedeelde secrets, wat het team niet wil.","De project managed identity authenticeert alleen de blueprint, wordt door het project gedeeld en biedt geen aparte auditing per agent.","Juist: een eigen agent identity vermijdt secrets en geeft een aparte audit trail, ongeacht het identity-model.","OAuth passthrough is voor per-gebruiker toegang; hier volstaat een gedeelde identiteit."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"1.1.4-04","obj":"1.1.4","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. adds a workspace-private Microsoft Fabric data agent endpoint as a tool in a Foundry toolbox that several agents use. Each employee must see only the Fabric data that the employee is permitted to see. The endpoint accepts only an audience-specific Microsoft Entra access token that represents the signed-in user. Employees must not be sent through a separate OAuth authorization flow that uses its own app registration.\n\nWhich authType should you set on the project connection for the tool?","choices":["user-entra-token","oauth2","agentic-identity","project-managed-identity"],"answer":[0],"explanation":"Bij een toolbox is authenticatie een eigenschap van de project connection. Met user-entra-token levert Foundry de downstream service een audience-specifiek Microsoft Entra-token dat de aangemelde gebruiker vertegenwoordigt, bedoeld voor managed Microsoft-services zoals workspace-private Fabric data agent endpoints. Zo blijft per-user toegang behouden zonder aparte OAuth-autorisatieflow.","rationale":["Juist: user-entra-token geeft een audience-specifiek Entra-token van de aangemelde gebruiker door, zodat Fabric de rechten van elke medewerker afdwingt.","Onjuist: oauth2 is ook per gebruiker, maar laat de gebruiker een OAuth-autorisatieflow doorlopen met een eigen OAuth-app, wat hier niet mag.","Onjuist: agentic-identity gebruikt de identiteit van de agent zelf en weigert bewust een user token, dus de rechten per medewerker gaan verloren.","Onjuist: project-managed-identity is een gedeelde service-identiteit zonder gebruikerscontext."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/tool-authentication"},{"id":"1.1.4-05","obj":"1.1.4","difficulty":"hard","type":"single","stem":"Wingtip Toys configures an MCP tool for a Foundry agent as shown in the following definition.\n\n```json\n{\n  \"type\": \"mcp\",\n  \"server_label\": \"erp\",\n  \"server_url\": \"https://erp.example.com/mcp\",\n  \"allowed_tools\": [\"get_order\", \"update_order\"],\n  \"require_approval\": ___\n}\n```\n\nThe get_order tool is read-only and must run without approval. The update_order tool changes data, and each call must be approved. You need to minimize approval prompts.\n\nWhich value should you use for require_approval?","choices":["\"always\"","\"never\"","{\"never\": [\"get_order\"]}","{\"always\": [\"get_order\"]}"],"answer":[2],"explanation":"Met {\"never\": [...]} geef je de tools op die geen goedkeuring nodig hebben; de overige toegestane tools vereisen goedkeuring. Zo draait get_order zonder prompt en vereist update_order goedkeuring, conform het advies om goedkeuring te eisen voor schrijvende tools.","rationale":["always vraagt goedkeuring voor elke aanroep, ook voor get_order, wat onnodige prompts geeft.","never schakelt goedkeuring volledig uit, ook voor de schrijvende tool update_order.","Juist: get_order is vrijgesteld, update_order blijft goedkeuring vereisen.","Dit eist juist goedkeuring voor de read-only tool en niet voor de schrijvende tool."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"1.1.4-06","obj":"1.1.4","difficulty":"hard","type":"multi","stem":"Contoso Pharmaceuticals connects a Foundry agent to a custom MCP server that is protected by Microsoft Entra ID. The agent must call the server on behalf of each signed-in user. The users only consume the agent and do not build agents. When the team configures managed OAuth with a Microsoft audience, tool calls fail with the error \"Cannot pass Microsoft token to untrusted MCP endpoint.\"\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Configure custom OAuth with your own Microsoft Entra app registration that uses an audience you control.","Assign the users the Foundry Agent Consumer role on the project.","Assign the users the Foundry Owner role on the project.","Switch to key-based authentication that uses a shared personal access token.","Keep managed OAuth and change the audience to Microsoft Graph."],"answer":[0,1],"explanation":"Agent Service blokkeert tokens met een bekend Microsoft-audience naar custom MCP-servers. De oplossing is custom OAuth met een eigen app registration en eigen audience. Voor OAuth identity passthrough hebben gebruikers minimaal de Foundry Agent Consumer-rol nodig; dat is de least-privilege keuze.","rationale":["Juist: een eigen app registration met eigen audience lost de geblokkeerde token-passthrough op.","Juist: Foundry Agent Consumer is de least-privilege rol voor gebruikers die de agent alleen gebruiken.","Foundry Owner geeft veel te veel rechten voor eindgebruikers.","Een gedeelde PAT verliest de user context, terwijl de agent namens elke gebruiker moet handelen.","Microsoft Graph is ook een bekend Microsoft-audience; die token wordt eveneens geblokkeerd."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"1.1.5-01","obj":"1.1.5","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines needs its agent to request baggage-claim decisions from an agent that a partner company builds and hosts on a different platform. The partner agent uses its own reasoning and tools, which must stay opaque to Blue Yonder Airlines.\n\nWhich protocol should you use?","choices":["OpenAPI over HTTP","Agent2Agent (A2A)","Model Context Protocol (MCP)","Activity Protocol"],"answer":[1],"explanation":"A2A past wanneer agents voor elkaar opaak zijn of moeten zijn, bijvoorbeeld agents van verschillende organisaties. De aangeroepen agent gebruikt zijn eigen orchestration; tools en API's blijven onzichtbaar voor de aanvrager.","rationale":["Een OpenAPI-aanroep is een API-call, geen agent-to-agent taakdelegatie met multi-turn context.","Juist: A2A is bedoeld voor cross-platform samenwerking tussen opake agents.","Bij MCP orkestreert de host welke tools worden aangeroepen; dat is minder geschikt voor een opake externe agent.","Activity Protocol is voor integratie met agents die met de Microsoft 365 Agents SDK zijn gebouwd."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-patterns"},{"id":"1.1.5-02","obj":"1.1.5","difficulty":"easy","type":"single","stem":"VanArsdel, Ltd. wants its agents to read data from and perform actions in an internal inventory system. A single orchestrating agent must keep control over which operations to invoke, how to filter the results, and how to synthesize the final answer. The access must support enterprise authentication and auditing.\n\nWhich protocol should you use?","choices":["Agent2Agent (A2A)","Model Context Protocol (MCP)","Activity Protocol","a custom HTTP connector"],"answer":[1],"explanation":"MCP is de aanbevolen manier om data en acties aan agents aan te bieden met enterprise-grade security, authenticatie en auditing. Het geeft een enkele orchestrator sterke controle om te selecteren, aanroepen, filteren en synthetiseren.","rationale":["A2A is voor opake agents met hun eigen redenering, niet voor directe tool- en datatoegang onder controle van de orchestrator.","Juist: MCP standaardiseert toegang tot tools en data en laat de host de regie houden.","Activity Protocol is voor Microsoft 365 Agents SDK-agents, niet voor tooltoegang.","Een custom HTTP connector is geen gestandaardiseerd protocol voor tooldiscovery en -aanroep door agents."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-patterns"},{"id":"1.1.5-03","obj":"1.1.5","difficulty":"medium","type":"single","stem":"Humongous Insurance has a Copilot Studio agent. The agent must orchestrate with three other components: an agent built by using the Microsoft 365 Agents SDK, an external agent that implements the A2A protocol, and a set of MCP tools. You need the correct integration approach for the Microsoft 365 Agents SDK agent.\n\nWhich integration approach should you use for that agent?","choices":["an A2A connection","an MCP server","a custom connector","Activity Protocol"],"answer":[3],"explanation":"Copilot Studio adviseert per integratiebehoefte: custom connectors voor API's, MCP-servers voor MCP-tools, A2A voor agents die het A2A-protocol implementeren en het Activity Protocol voor agents gebouwd met de Microsoft 365 Agents SDK.","rationale":["Een A2A-verbinding is voor de externe agent die het A2A-protocol implementeert.","Een MCP-server is voor MCP-tools en resources.","Custom connectors zijn voor gewone API's of HTTP-services.","Juist: agents op de Microsoft 365 Agents SDK integreer je via het Activity Protocol."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/add-agent-agent-to-agent"},{"id":"1.1.5-04","obj":"1.1.5","difficulty":"medium","type":"single","stem":"Northwind Traders hosts an A2A-compatible agent outside Foundry Agent Service. The company registers the agent in Foundry Control Plane and selects A2A as the protocol so that other agents can discover its capabilities through the generated proxy URL.\n\nWhich artifact should the agent publish so that Foundry can discover its capabilities?","choices":["an MCP tools/list response at /runtime/webhooks/mcp","a toolbox version that is promoted to default","an agent card at /.well-known/agent-card.json","an OpenAPI specification at /openapi.json"],"answer":[2],"explanation":"Bij registratie van een custom A2A-agent in Foundry Control Plane ontdekt Foundry de agent card op /.well-known/agent-card.json. Een agent card beschrijft de capabilities van de agent volgens het A2A-protocol.","rationale":["tools/list is een MCP-mechanisme; het endpoint /runtime/webhooks/mcp hoort bij MCP op Azure Functions.","Een toolbox groepeert tools achter een MCP-endpoint; dat is geen A2A-discovery.","Juist: de agent card is het A2A-artefact voor capability discovery.","Een OpenAPI-specificatie hoort bij de OpenAPI-tool, niet bij A2A-discovery."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/agent-to-agent"},{"id":"1.1.5-05","obj":"1.1.5","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. exposes a Foundry prompt agent as an A2A endpoint. A partner integrates by using an A2A client that uses the HTTP+JSON transport. The client sends no A2A-Version header and no a2a-version query string. Requests succeed, but a compliance review finds that the integration runs on a preview protocol version. The integration must run on the generally available A2A protocol version.\n\nWhat should the partner do?","choices":["Switch the client to JSONRPC and resolve the agent card from agentCard/v1.0.","Keep HTTP+JSON and add the A2A-Version: 1.0 header to every request.","Keep HTTP+JSON and resolve the agent card from /.well-known/agent-card.json.","Switch the client to gRPC and append ?a2a-version=1.0 to every request."],"answer":[0],"explanation":"Zonder versieselector serveert Foundry standaard preview A2A v0.3. Versie 1.0 (GA) ondersteunt op het incoming endpoint alleen JSONRPC, dus de client moet naar JSONRPC en v1.0 selecteren, bijvoorbeeld door de agent card van agentCard/v1.0 op te halen zodat de SDK v1.0 onderhandelt.","rationale":["Juist: JSONRPC is het enige transport voor v1.0, en de v1.0 agent card laat de SDK automatisch v1.0 gebruiken.","Onjuist: de header selecteert v1.0, maar v1.0 ondersteunt HTTP+JSON niet.","Onjuist: Foundry publiceert de agent cards op versiespecifieke paden; dit kiest geen v1.0 en HTTP+JSON blijft op v0.3.","Onjuist: gRPC wordt door het incoming A2A-endpoint van Foundry niet ondersteund."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/enable-agent-to-agent-endpoint"},{"id":"1.1.5-06","obj":"1.1.5","difficulty":"hard","type":"multi","stem":"Litware, Inc. designs communication for a multi-agent solution. Internal subagents run on the same platform as the orchestrator. Agents need authenticated access to tools and data, including Microsoft 365 service tools. A partner agent runs on a different runtime and processes long-running tasks that the orchestrator must track.\n\nWhich three design decisions should you make? Each correct answer presents part of the solution.","choices":["Use A2A with agent cards and the task model for the partner agent.","Use A2A for each internal subagent call to standardize communication.","Use a custom HTTP connector for the long-running tasks of the partner agent.","Use platform-native orchestration for the internal subagent flows.","Use MCP for tool and data access."],"answer":[0,3,4],"explanation":"Microsoft adviseert: platform-native orchestration voor interne flows met subagents om het simpel te houden, MCP voor tool- en datatoegang (ook Microsoft 365-tools) en A2A voor cross-platform agents met agent cards en het task- en artifactmodel om langlopende taken te volgen.","rationale":["Juist: agent cards en het A2A-taskmodel ondersteunen discovery en het volgen van langlopende taken over runtimes heen.","A2A voor interne subagents voegt onnodige complexiteit toe; platform-native orchestration heeft de voorkeur.","Een HTTP connector ondersteunt geen multi-turn interacties en rijke contextuele metadata zoals A2A.","Juist: platform-native orchestration houdt interne subagent-flows eenvoudig.","Juist: MCP is de aanbevolen manier voor veilige, geauditeerde tool- en datatoegang."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-patterns"},{"id":"1.1.6-01","obj":"1.1.6","difficulty":"easy","type":"single","stem":"First Up Consultants launches a research agent. Research shows that new users trust every answer, although the agent sometimes makes mistakes. You need to apply a Human-AI eXperience (HAX) guideline to the first-run experience to address this behavior.\n\nWhich guideline should you apply?","choices":["Encourage granular feedback during regular interaction.","Provide global controls over what the system monitors.","Make clear what the system can do.","Make clear how well the system can do what it can do."],"answer":[3],"explanation":"HAX G2 helpt gebruikers begrijpen hoe vaak het systeem fouten kan maken. Dit hoort bij het first-run experience en vermindert overmatig vertrouwen in AI-output.","rationale":["Granulaire feedback hoort bij gebruik over langere tijd, niet bij het instellen van verwachtingen.","Global controls laten gebruikers gedrag aanpassen over tijd; ze adresseren overmatig vertrouwen niet.","Make clear what the system can do toont de mogelijkheden bij het first-run experience, maar zegt niet hoe vaak het systeem fouten maakt.","Juist: verwachtingen over de kwaliteit van de output instellen vermindert overmatig vertrouwen bij de eerste interactie."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/copilot/isv/ux-guidance"},{"id":"1.1.6-02","obj":"1.1.6","difficulty":"easy","type":"single","stem":"Southridge Video exposes a customer-facing support agent on its public website. Legal counsel requires that people know they are interacting with an AI system and not with a human employee.\n\nWhich mitigation should you implement?","choices":["Limit the length of inputs and outputs.","Highlight potential inaccuracies in outputs.","Disclose the role of AI in the interaction.","Cite references and information sources."],"answer":[2],"explanation":"Mensen bewust maken dat ze met een AI-systeem praten is een expliciete mitigatie in de responsible AI-richtlijnen voor Azure OpenAI-modellen, en voor extern gerichte agents een basisverwachting voor transparantie.","rationale":["Lengtelimieten verminderen misbruik, maar maken de rol van AI niet duidelijk.","Onnauwkeurigheden markeren gaat over betrouwbaarheid, niet over de identiteit van de gesprekspartner.","Juist: AI-disclosure laat gebruikers weten dat ze met een AI en niet met een mens praten.","Bronvermelding verklaart waar content vandaan komt, maar zegt niet dat de gesprekspartner een AI is."],"ref":"https://learn.microsoft.com/azure/foundry/responsible-ai/openai/overview"},{"id":"1.1.6-03","obj":"1.1.6","difficulty":"medium","type":"single","stem":"Graphic Design Institute reviews the error experience of its content agent. When an output is wrong, users must be able to regenerate or edit it without restarting the workflow. Users must also be able to see why the agent produced a specific output.\n\nWhich combination of HAX guidelines should you apply?","choices":["Mitigate social biases, and make clear how well the system can do what it can do.","Support efficient correction, and make clear why the system did what it did.","Make clear what the system can do, and match relevant social norms.","Encourage granular feedback, and provide global controls."],"answer":[1],"explanation":"In de HAX-fase when it's wrong horen twee richtlijnen: support efficient correction (eenvoudig bewerken, verfijnen of herstellen) en make clear why the system did what it did (uitleg van het gedrag).","rationale":["Bias-mitigatie en verwachtingsmanagement adresseren geen correctie of uitleg na een fout.","Juist: deze twee richtlijnen dekken correctie zonder herstart en uitleg van de output.","Deze richtlijnen horen bij het first-run experience en tijdens interactie, niet bij fouten.","Deze richtlijnen horen bij gebruik over langere tijd."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/copilot/isv/ux-guidance"},{"id":"1.1.6-04","obj":"1.1.6","difficulty":"medium","type":"single","stem":"Best For You Organics Company runs an automated order-exception workflow that uses several agents. Users must be able to understand which steps led to a decision and where the information came from. User research shows that long explanations in every response overwhelm users.\n\nWhat should you do?","choices":["Log each agent step, and show sources and confidence in tooltips.","Display the full output of each intermediate agent in the main response.","Display the final decision without sources to keep the interface simple.","Send users a weekly summary of all agent decisions by email."],"answer":[0],"explanation":"Het Well-Architected Framework adviseert transparantie via logbestanden per stap in multi-agent workflows, plus bronlinks. Overweldig gebruikers niet: gebruik minimaal storende, door de gebruiker geinitieerde UI zoals tooltips.","rationale":["Juist: stapgewijze logging operationaliseert transparantie, en tooltips houden de UI niet-storend.","Alle tussenresultaten in elk antwoord tonen overweldigt de gebruiker.","Zonder bronnen ontbreekt de transparantie die gebruikers nodig hebben.","Een wekelijkse samenvatting geeft geen inzicht op het moment dat de gebruiker de beslissing ziet."],"ref":"https://learn.microsoft.com/azure/well-architected/ai/responsible-ai"},{"id":"1.1.6-05","obj":"1.1.6","difficulty":"hard","type":"single","stem":"Humongous Insurance uses an agent that settles claims and issues payments. Some claims are ambiguous. In a pilot, the team required human approval for every agent response, and reviewers became a bottleneck. You need to keep human oversight where it matters and to keep reviews fast.\n\nWhat should you do?","choices":["Keep approval for every agent response, and add more reviewers to the team during peak periods.","Remove approvals for payments, and rely on content filters to block harmful outputs from the agent.","Let the agent settle ambiguous claims automatically, and notify the reviewers after each payment.","Require approval only for hard-to-reverse payments, and route ambiguous claims to a person with full context."],"answer":[3],"explanation":"Microsoft adviseert een mens in de lus waar agents consequente acties uitvoeren: goedkeuring voor moeilijk terug te draaien acties met impact op geld, gevoelige of ambigue gevallen zichtbaar naar een mens routeren, en reviewers genoeg context geven zodat review geen bottleneck wordt.","rationale":["Goedkeuring voor elk antwoord houdt de bottleneck in stand; meer reviewers lost de oorzaak niet op.","Content filters vervangen geen menselijke beslissing over betalingen die moeilijk terug te draaien zijn.","Achteraf melden betekent dat ambigue gevallen zonder menselijk oordeel worden afgehandeld.","Juist: gerichte goedkeuring, duidelijke escalatie en context voor reviewers combineren toezicht met snelheid."],"ref":"https://learn.microsoft.com/agents/center-of-excellence/responsible-ai"},{"id":"1.1.6-06","obj":"1.1.6","difficulty":"hard","type":"single","stem":"Trey Research evaluates its report-generation agent. Measurements show that the agent has lower accuracy with numbers than with text. Users often copy figures from the reports into financial documents without checking them. You need a user-experience mitigation that targets this specific risk.\n\nWhich mitigation should you implement?","choices":["Disclose that the reports are partly or fully generated by AI.","Cite the documents that the agent used as references for each report.","Mark numbers in generated outputs, and prompt users to verify them.","Limit the length of the generated reports to reduce the number of figures."],"answer":[2],"explanation":"De responsible AI-richtlijnen geven dit voorbeeld letterlijk: als meting laat zien dat het systeem minder nauwkeurig is met getallen, markeer dan getallen in de output zodat gebruikers ze controleren of externe bronnen raadplegen (HAX G2).","rationale":["AI-disclosure is algemeen en richt zich niet op de gemeten zwakte bij getallen.","Bronvermelding helpt bij herkomst, maar waarschuwt niet specifiek voor onnauwkeurige getallen.","Juist: gerichte markering van getallen adresseert precies het gemeten zwakke punt.","Kortere rapporten verminderen het risico niet voor de getallen die er wel in staan."],"ref":"https://learn.microsoft.com/azure/foundry/responsible-ai/openai/overview"},{"id":"1.1.7-01","obj":"1.1.7","difficulty":"easy","type":"single","stem":"Coho Winery builds a Foundry agent that must remember durable preferences of each customer, such as preferred language and dietary restrictions. The agent retrieves this information near the beginning of each conversation.\n\nWhich memory type should you use?","choices":["conversation history in the session","user profile memory","chat summary memory","procedural memory"],"answer":[1],"explanation":"In Foundry Agent Service bevat user profile memory duurzame voorkeuren en persoonlijke context, zoals taalvoorkeur. Microsoft adviseert deze vroeg in elk gesprek op te halen voor stabiele personalisatie.","rationale":["Sessiegeschiedenis is short-term en verdwijnt na het gesprek; voorkeuren moeten over sessies heen blijven.","Juist: user profile memory is bedoeld voor duurzame gebruikersvoorkeuren.","Chat summary memory bevat samenvattingen van eerdere gesprekken en wordt per beurt opgehaald.","Procedural memory bevat herbruikbare werkwijzen voor terugkerende taken."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-memory"},{"id":"1.1.7-02","obj":"1.1.7","difficulty":"easy","type":"single","stem":"City Power & Light builds an agent for employees. The agent must answer questions by using curated organizational HR policies that the HR department maintains. The agent must also remember facts that it learns about each employee over time.\n\nWhich component should you use to ground the agent on the HR policies?","choices":["a Foundry IQ knowledge base","a memory store","the file search tool for user-uploaded documents","a chat history provider"],"answer":[0],"explanation":"Microsoft onderscheidt: memory voor gebruikers- of agentcontext die over tijd wordt geleerd, een Foundry IQ knowledge base voor grounding op gecureerde organisatiecontent en file search voor documenten die de gebruiker tijdens een interactie aanlevert.","rationale":["Juist: gecureerde organisatiecontent hoort in een Foundry IQ knowledge base.","Een memory store is voor geleerde, gebruikersspecifieke context, zoals de feiten over elke medewerker.","File search is bedoeld voor documenten die gebruikers tijdens een interactie aanleveren.","Een chat history provider bewaart gespreksberichten, geen gecureerd beleid."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-memory"},{"id":"1.1.7-03","obj":"1.1.7","difficulty":"medium","type":"single","stem":"Margie's Travel plans two agents. A payment agent processes card transactions in a single session. A travel-advisor agent personalizes recommendations based on the history of each customer. The company wants to minimize data retention risk while keeping the value of personalization.\n\nWhich memory design should you use?","choices":["persistent long-term memory for both agents","ephemeral session-based memory for both agents","persistent long-term memory for the payment agent, and ephemeral session-based memory for the advisor agent","ephemeral session-based memory for the payment agent, and persistent long-term memory for the advisor agent"],"answer":[3],"explanation":"Het Cloud Adoption Framework adviseert persistentie af te stemmen op de functie: ephemeral, sessiegebaseerd geheugen voor transactionele agents om retentierisico te beperken, en langetermijngeheugen alleen voor adviserende agents waar historische context nodig is.","rationale":["Langetermijngeheugen voor de betaalagent verhoogt het retentierisico zonder zakelijke waarde.","Zonder langetermijngeheugen kan de adviseur niet personaliseren op basis van historie.","Dit draait de aanbeveling om: risico bij betalingen en geen personalisatie bij de adviseur.","Juist: dit beperkt dataretentie bij de transactionele agent en behoudt personalisatie bij de adviseur."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/build-secure-process"},{"id":"1.1.7-04","obj":"1.1.7","difficulty":"medium","type":"single","stem":"Wide World Importers uses the memory store APIs of Foundry Agent Service directly instead of the memory search tool. The agent must use stored user profile memories from the first turn of each conversation and must use the most relevant memories for each response.\n\nWhich sequence of actions should you perform?","choices":["Add memories from conversation content by using a user scope -> Create a memory store -> For each turn, search memories with only the scope -> At conversation end, search memories with the latest messages","Create a memory store -> For each turn, search memories with only the scope -> Add memories from conversation content without a scope -> At conversation start, inject the latest messages","Create a memory store -> Add memories from conversation content by using a user scope -> At conversation start, search memories with only the scope to inject static memories -> For each turn, search memories with the latest messages to get contextual memories","Create a memory store -> At conversation start, search memories with the latest messages -> Add memories from conversation content by using a shared scope -> For each turn, search memories with only the scope"],"answer":[2],"explanation":"Maak eerst een memory store en voeg memories toe met een scope per gebruiker. Statische memories haal je aan het begin op met alleen een scope (zonder items); contextuele memories haal je per beurt op met items gelijk aan de laatste berichten.","rationale":["Je kunt geen memories toevoegen voordat de memory store bestaat.","Memories zonder scope toevoegen maakt segmentatie per gebruiker onmogelijk, en de volgorde klopt niet.","Juist: dit volgt de volgorde en het verschil tussen statische en contextuele retrieval.","Statische en contextuele retrieval zijn omgedraaid, en een gedeelde scope schendt per-user isolatie."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"1.1.7-05","obj":"1.1.7","difficulty":"hard","type":"single","stem":"Tailspin Toys builds a Microsoft Agent Framework group chat with three participants that use different agent types. To share context, a developer passes one AgentSession instance to every participant. During testing, the participants process the conversation history inconsistently.\n\nWhat should you do?","choices":["Persist the shared session to Azure Cosmos DB, and reload it before each turn.","Give each participant its own session, and let the orchestrator broadcast each response so that every session stays synchronized.","Keep one shared session, and add a lock so that participants update it one at a time.","Keep the history in the orchestrator, and send each participant the current message without prior history."],"answer":[1],"explanation":"In group chat delen agents geen sessie-instantie, omdat verschillende agenttypen AgentSession verschillend kunnen implementeren. De orchestrator synchroniseert de sessie van elke agent door na elke beurt het antwoord naar alle andere deelnemers te broadcasten.","rationale":["Persistentie verandert niets aan het feit dat een gedeelde instantie verschillend wordt geinterpreteerd.","Juist: aparte sessies met broadcast door de orchestrator is het ontwerp van group chat context sharing.","Een lock lost het probleem niet op: de inconsistentie komt door verschillende sessie-implementaties, niet door gelijktijdigheid.","Zonder eerdere historie kunnen deelnemers niet op elkaars bijdragen voortbouwen."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/group-chat"},{"id":"1.1.7-06","obj":"1.1.7","difficulty":"hard","type":"multi","stem":"Fabrikam Residences offers a multitenant leasing agent that uses memory in Foundry Agent Service. Memories of one resident must never be visible to another resident. Company policy limits the retention of personal data, and residents must be able to view and remove what the agent remembers about them.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Set a default time-to-live (TTL) on the memory store that matches the retention policy.","Expose item-level edit and delete actions for memories to residents.","Use one shared scope for all residents so that the agent learns from every conversation.","Use extracted memories to decide which lease records a resident can access.","Partition the memory store by user by using the scope property."],"answer":[0,1,4],"explanation":"Best practices voor memory: partitioneer per gebruiker met scope, stel expliciete retentie in met TTL en bied gebruikers item-level bewerken en verwijderen. Gebruik geextraheerde memories nooit voor autorisatiebeslissingen.","rationale":["Juist: een TTL op storeniveau dwingt de retentietermijn automatisch af.","Juist: item-level beheer ondersteunt transparantie en privacyrechten van gebruikers.","Een gedeelde scope over gebruikers heen veroorzaakt precies het lek dat voorkomen moet worden.","Geextraheerde memories zijn geen betrouwbare basis voor autorisatie; gebruik daarvoor echte toegangscontrole.","Juist: scope per gebruiker voorkomt dat memories tussen bewoners lekken."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"1.1.8-01","obj":"1.1.8","difficulty":"easy","type":"single","stem":"Coho Vineyard has an agent step that extracts shipment numbers and dates from short carrier notifications. The step runs at high volume, and the task requires no complex reasoning.\n\nWhich type of model should you assign to this step?","choices":["a frontier reasoning model","an embedding model","a multimodal model that processes audio","a smaller, faster, and less expensive model"],"answer":[3],"explanation":"Microsoft adviseert het model af te stemmen op de taakmoeilijkheid: route deterministische of eenvoudige subtaken zoals classificatie, extractie en formattering naar kleinere, goedkopere en snellere modellen, en reserveer frontier reasoning-modellen voor echt moeilijke stappen.","rationale":["Een frontier reasoning-model is duurder en trager zonder meerwaarde voor eenvoudige extractie.","Een embedding-model maakt vectoren voor zoeken; het extraheert geen velden.","De input is tekst, dus een audiomodel past niet bij de taak.","Juist: eenvoudige extractie op hoge volumes past bij een klein, snel en goedkoop model."],"ref":"https://learn.microsoft.com/agents/architecture/host-platform"},{"id":"1.1.8-02","obj":"1.1.8","difficulty":"easy","type":"single","stem":"Relecloud builds a retrieval step for its multi-agent solution. The step must convert document chunks and user queries into vectors for semantic similarity search.\n\nWhich model category should you use for this step?","choices":["a reasoning model","a model router deployment","an embedding model","a chat completion model"],"answer":[2],"explanation":"Bij modelselectie bepaal je eerst task fit: chat, reasoning, embedding, RAG of multimodaal. Het omzetten van tekst naar vectoren voor semantisch zoeken is de taak van een embedding-model.","rationale":["Een reasoning-model is voor meerstapsredenering, niet voor vectorisatie.","Model router routeert chatprompts naar chatmodellen; het levert geen embeddings.","Juist: een embedding-model maakt de vectoren voor semantic similarity search.","Een chatmodel genereert tekst, geen vectorrepresentaties voor zoeken."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/choose-ai-model"},{"id":"1.1.8-03","obj":"1.1.8","difficulty":"medium","type":"single","stem":"Southridge Video deploys model router for an editing agent that receives a mix of simple and complex prompts. Many prompts contain long transcripts that exceed the context window of the smallest model in the routing pool. The solution must keep cost-aware routing and automatic failover.\n\nWhat should you do?","choices":["Change the routing mode of the deployment to Quality.","Configure a model subset with one long-context model.","Configure a model subset with two or more long-context models.","Enable session affinity to keep each conversation on one model."],"answer":[2],"explanation":"Het effectieve contextvenster van model router wordt beperkt door het kleinste onderliggende model. Microsoft adviseert een model subset met alleen modellen die de benodigde contextlengte ondersteunen, en minstens twee modellen zodat routing en automatische failover blijven werken.","rationale":["Quality mode negeert kosten en verandert het contextvenster van

Provider):\n    def __init__(self) -> None:\n        super().__init__(\"support-tier\")\n        self.cache: dict = {}\n\n    async def [HOOK](self, *, agent, session, context, state) -> None:\n        if tier := [SOURCE].get(\"support_tier\"):\n            context.extend_instructions(self.source_id, f\"The user has the {tier} support tier.\")\n```\n\nWhich values should you use for [HOOK] and [SOURCE]?","choices":["[HOOK] = after_run, [SOURCE] = state","[HOOK] = before_run, [SOURCE] = self.cache","[HOOK] = after_run, [SOURCE] = self.cache","[HOOK] = before_run, [SOURCE] = state"],"answer":[3],"explanation":"before_run draait voor de modelaanroep en kan instructies injecteren; after_run verwerkt de response. Omdat een provider-instantie voor alle sessies wordt gedeeld, hoort sessie-specifieke data in de per-sessie state en niet in een veld van de provider.","rationale":["after_run draait na de modelaanroep, dus de instructie komt te laat voor de huidige run.","self.cache is gedeeld over alle sessies en kan de tier tussen gebruikers laten lekken.","Zowel het verkeerde moment als gedeelde instance-state: beide constraints worden geschonden.","Correct: before_run injecteert op tijd en state is per sessie geisoleerd."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers"},{"id":"2.1.1-09","obj":"2.1.1","difficulty":"hard","type":"single","stem":"Humongous Insurance is redesigning the system message of a claims agent and wants to manage it as a testable artifact across its lifecycle. You need to minimize regressions and the leakage of unsafe responses when the prompt changes.\n\nWhich sequence of actions should you perform?","choices":["Identify the risks -> Define the scenario -> Evaluate and iterate -> Create a test set with benign and adversarial prompts","Define the scenario -> Identify the risks -> Create a test set with benign and adversarial prompts -> Evaluate and iterate on the system message","Define the scenario -> Evaluate and iterate on the system message -> Identify the risks -> Create a test set with benign and adversarial prompts","Create a test set with benign and adversarial prompts -> Evaluate and iterate on the system message -> Define the scenario -> Identify the risks"],"answer":[1],"explanation":"De aanbevolen aanpak: definieer eerst het scenario, identificeer de RAI-risico's, bouw een testset met benigne en adversarial prompts en evalueer/itereer daarna. Zo meet je regressies en leakage bij elke wijziging.","rationale":["Risico's identificeren zonder gedefinieerd scenario mist context, en evalueren voor er een testset is kan niet.","Correct: scenario, risico's, testset, daarna evalueren en itereren.","Evalueren voordat risico's en testset bestaan levert geen meetbare basis op.","Een testset bouwen voordat het scenario en de risico's bekend zijn leidt tot een niet-representatieve set."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/concepts/system-message"},{"id":"2.1.2-01","obj":"2.1.2","difficulty":"easy","type":"single","stem":"Lucerne Publishing builds a content workflow by using Microsoft Agent Framework. A writer agent and a reviewer agent take turns improving an article for several rounds. Each agent must see the full conversation history, including every earlier draft and review comment, before it responds.\n\nWhich orchestration should you use?","choices":["Concurrent orchestration","Group chat orchestration","Agent-as-tools with the writer as the primary agent","Sequential orchestration with chain_only_agent_responses enabled"],"answer":[1],"explanation":"In group chat ziet elke deelnemer de volledige gesprekshistorie; de orchestrator broadcast elke response naar alle agents voor iteratieve verfijning. Dat past bij writer-reviewer-rondes.","rationale":["Concurrent laat agents onafhankelijk werken zonder elkaars output te zien.","Correct: group chat synchroniseert de volledige historie naar alle deelnemers.","Bij agent-as-tools beheert de primaire agent de context en krijgt de tool-agent mogelijk alleen relevante delen.","chain_only_agent_responses laat agents juist alleen de vorige response zien, niet de volledige historie."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/group-chat"},{"id":"2.1.2-02","obj":"2.1.2","difficulty":"easy","type":"single","stem":"Margie's Travel builds a sequential translation pipeline in Microsoft Agent Framework for Python: a writer agent, a translator agent, and a style reviewer agent. Testing shows that the translator is influenced by the original user prompt and sometimes answers it instead of translating the writer output. Each agent must consume only the previous agent's response messages.\n\nWhat should you configure?","choices":["Set chain_only_agent_responses=True on the SequentialBuilder","Keep the default context behavior of the SequentialBuilder","Replace the pipeline with a handoff orchestration","Add the user prompt to the translator instructions"],"answer":[0],"explanation":"Standaard consumeert elk agent in een sequential workflow de volledige conversatie van de vorige agent (input en response). Met chain_only_agent_responses=True consumeert elk agent alleen de response van de vorige, ideaal voor vertaalpijplijnen.","rationale":["Correct: deze instelling zet alle deelnemers op alleen de vorige agent-response.","De default geeft de volledige conversatie door en veroorzaakt juist het probleem.","Bij handoff krijgt de ontvangende agent de volledige context, wat het probleem niet oplost.","De user prompt toevoegen versterkt de ongewenste invloed."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/sequential"},{"id":"2.1.2-03","obj":"2.1.2","difficulty":"easy","type":"single","stem":"A. Datum Corporation has a primary planning agent that delegates subtasks to a pricing agent and a compliance agent. The planning agent must keep ownership of the overall task and the full conversation, and it must pass only the information relevant to each subtask to the other agents.\n\nWhich pattern should you use?","choices":["Handoff orchestration","Group chat orchestration","Agent-as-tools","Concurrent orchestration with result aggregation"],"answer":[2],"explanation":"Bij agent-as-tools houdt de primaire agent de verantwoordelijkheid en de context, en geeft alleen relevante informatie mee aan tool-agents; daarna keert de controle terug. Bij handoff gaat het hele gesprek met volledige context over.","rationale":["Bij handoff neemt de ontvangende agent het eigenaarschap over en krijgt de volledige context.","In group chat zien alle agents de volledige historie, dus geen selectieve context.","Correct: de primaire agent beheert de context en deelt per subtaak alleen wat nodig is.","Concurrent stuurt dezelfde input naar alle agents en laat de planner geen eigenaar van het gesprek blijven."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.1.2-04","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank builds a workflow in Microsoft Agent Framework for Python. A downstream audit agent must receive the user's original request and the upstream agent responses, but it must not receive any message that contains an account number. You already wrote a function named drop_account_messages that receives a list of messages and returns the filtered list.\n\n```python\naudit_executor = AgentExecutor(\n    audit_agent,\n    [CODE]\n)\n```\n\nWhich code should you insert at [CODE]?","choices":["context_mode=\"last_agent\", id=\"audit\"","context_mode=\"full\", session=audit_agent.create_session()","chain_only_agent_responses=True, id=\"audit\"","context_mode=\"custom\", context_filter=drop_account_messages"],"answer":[3],"explanation":"context_mode=\"custom\" met een context_filter-functie bepaalt precies welke berichten het agent consumeert. last_agent zou de oorspronkelijke user input weglaten en full zou ook de berichten met rekeningnummers doorgeven.","rationale":["last_agent sluit de input van de upstream agent uit, dus het originele verzoek ontbreekt.","full geeft de complete conversatie door, inclusief berichten met rekeningnummers; een eigen session filtert niets.","chain_only_agent_responses is een parameter van SequentialBuilder, niet van AgentExecutor.","Correct: custom met context_filter laat het originele verzoek door en filtert gevoelige berichten weg."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/advanced/agent-executor"},{"id":"2.1.2-05","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Fourth Coffee builds a C# workflow in Microsoft Agent Framework. Executor1 calls QueueStateUpdateAsync to store a draft response without specifying a scope name. In a later superstep, Executor2 calls ReadStateAsync with the same key and no scope name, but it receives a null value.\n\nWhat should you do to make the draft available to Executor2?","choices":["Read the value in Executor2 within the same superstep as the write","Write and read the value by using the same non-null scope name in both executors","Pass the draft as part of the agent instructions of Executor2","Store the draft in a field of a shared executor instance"],"answer":[1],"explanation":"Zonder scopeName schrijft een executor naar zijn eigen private default scope. Om state te delen gebruik je in beide calls dezelfde niet-null scopeName; andere executors zien de update vanaf de volgende superstep.","rationale":["Andere executors zien updates pas in de volgende superstep, en het scope-probleem blijft bestaan.","Correct: een gedeelde, niet-null scope maakt de waarde leesbaar voor Executor2.","Instructies zijn statisch per agent en geen mechanisme om workflow-state te delen.","Gedeelde mutable executor-velden veroorzaken state-lekken tussen runs en worden afgeraden."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/state"},{"id":"2.1.2-06","obj":"2.1.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a conversational front-end agent that delegates product lookups to a retrieval agent. The retrieval agent receives only the latest user message. When a user asks a follow-up question such as \"What about its pricing?\", the retrieval agent returns irrelevant results. The final answer must still be generated from the user's original question.\n\nWhat should you do?","choices":["Rewrite the follow-up into a self-contained query before retrieval","Increase the number of chunks that the retrieval agent returns","Send the full conversation history to the search index as the query","Use the rewritten query instead of the original question for generation"],"answer":[0],"explanation":"Bij multi-turn context herschrijf je de huidige vraag tot een zelfstandige query die verwijzingen oplost (bijvoorbeeld 'its' wordt de productnaam). Het originele verzoek blijft wel de basis voor het genereren van het antwoord.","rationale":["Correct: query rewriting lost coreferenties op zodat de retrieval agent zonder historie goed zoekt.","Meer chunks lossen de onduidelijke verwijzing niet op en voegen ruis toe.","De hele historie als zoektekst levert een onscherpe query en meer irrelevante resultaten op.","De richtlijn is om de originele vraag naar het model te sturen voor het genereren van het antwoord."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/rag/rag-prompt-engineering"},{"id":"2.1.2-07","obj":"2.1.2","difficulty":"hard","type":"single","stem":"Adventure Works Cycles runs a handoff orchestration in Microsoft Agent Framework with a triage agent, an order agent, and a returns agent. The order agent calls a tool that returns the order status and then hands off to the returns agent. The returns agent sees the user messages and the order agent's text replies, but it has no access to the order status that the tool returned. Each agent has its own AgentSession.\n\nWhat should you identify as the cause?","choices":["Handoff orchestration uses a central orchestrator that summarizes context before each turn","The returns agent shares the same AgentSession instance as the order agent","Tool-related content is not broadcast to other agents; only user and agent messages are synchronized","Context compaction removed the tool result because the session exceeded the context window"],"answer":[2],"explanation":"In een handoff-orchestratie broadcasten deelnemers hun responses en user input naar elkaar, maar tool-gerelateerde content (inclusief handoff tool calls) wordt niet gebroadcast. Daardoor ziet de returns agent de tool-output niet tenzij die in een agent-bericht staat.","rationale":["Handoff gebruikt een mesh-topologie zonder centrale orchestrator.","Agents delen in handoff juist geen sessie-instantie; elke agent heeft zijn eigen sessie.","Correct: alleen user- en agentberichten worden gesynchroniseerd, tool-content niet.","Er is geen aanwijzing voor een overvol context window; het gedrag volgt uit het synchronisatieontwerp."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.1.2-08","obj":"2.1.2","difficulty":"hard","type":"single","stem":"Contoso Pharmaceuticals builds a Python group chat by using Microsoft Agent Framework with a research agent and a writer agent. The writer agent uses a model from an external provider and must never receive patient identifiers. The research agent sometimes includes patient identifiers in its response text.\n\nA developer removes the identifiers from the events that are returned by workflow.run() before they are shown in the UI. An audit shows that the writer agent still receives the identifiers in its prompts.\n\nWhat should you do?","choices":["Filter the research agent text in a participant-response handler of a custom GroupChatOrchestrator.","Add the research agent to intermediate_output_from, and filter the intermediate events.","Pass the same AgentSession instance to both participants so that they share the filtered history.","Use an orchestrator_agent whose instructions tell the writer agent to ignore patient identifiers."],"answer":[0],"explanation":"In een group chat broadcast de orchestrator elk antwoord na de beurt van een agent naar alle andere deelnemers. Filteren van events uit workflow.run() is te laat, omdat het originele antwoord dan al in de gedeelde history staat en is gebroadcast. Tekst tegenhouden doet u in een participant-response handler van een custom GroupChatOrchestrator.","rationale":["Juist: filteren op de grens van gedeelde history en broadcast voorkomt dat de writer de identifiers ziet.","Fout: intermediate_output_from bepaalt alleen welke output als events zichtbaar wordt, niet wat wordt gebroadcast.","Fout: deelnemers delen geen sessie-instantie; de orchestrator synchroniseert elke sessie, en de identifiers zitten dan nog steeds in de history.","Fout: instructies voorkomen niet dat de identifiers in de prompt van de writer terechtkomen."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/group-chat"},{"id":"2.1.2-09","obj":"2.1.2","difficulty":"hard","type":"multi","stem":"Graphic Design Institute builds a multi-agent tutoring solution by using Microsoft Agent Framework. A custom AIContextProvider injects each student's learning goals into the agent context, and the provider must stay consistent when the same agent serves many students at the same time. After each turn, newly mentioned goals must be saved for later turns.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Store the student's memory identifiers in the AgentSession instead of in fields of the provider instance","Extract newly mentioned goals from the response messages in the provider's post-invocation method","Create one shared AgentSession instance for all agents that participate in the solution","Store the current student's goals in a field of the provider so that every session reads the same value","Inject the goals by adding them to the agent instructions at agent creation time"],"answer":[0,1],"explanation":"Een AIContextProvider-instantie wordt gedeeld door alle sessies, dus sessie-specifieke waarden horen in de AgentSession. De post-invocation hook (StoreAIContextAsync/InvokedCoreAsync) extraheert nieuwe informatie uit de berichten om op te slaan.","rationale":["Correct: sessie-specifieke state in de AgentSession voorkomt lekken tussen studenten.","Correct: na de invocation kan de provider nieuwe doelen uit de berichten halen en opslaan.","Agents delen geen sessie-instantie omdat verschillende agent-types verschillende implementaties hebben.","Een veld op de gedeelde provider laat de doelen van een student bij anderen terechtkomen.","Instructies bij creatie zijn statisch en kunnen niet per student en per beurt veranderen."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers"},{"id":"2.1.3-01","obj":"2.1.3","difficulty":"easy","type":"single","stem":"Alpine Ski House wants its customer service agent to respond in a warmer, more concise brand tone. There is no single correct answer per request, but the company has A/B test logs in which reviewers marked one of two responses to the same prompt as better.\n\nWhich customization method should you use?","choices":["Reinforcement fine-tuning (RFT)","Supervised fine-tuning (SFT)","Few-shot examples in the system message","Direct preference optimization (DPO)"],"answer":[3],"explanation":"DPO traint op paren van preferred en non-preferred responses op dezelfde input en past bij subjectieve kwaliteiten zoals toon. Bestaande A/B-logs leveren precies dat type data.","rationale":["RFT vereist een grader die responses betrouwbaar scoort, typisch bij objectieve domeinen.","SFT vereist een gewenste response per prompt in plaats van voorkeursparen.","Few-shot voorbeelden benutten de verzamelde voorkeursdata niet en verlengen elke prompt.","Correct: DPO leert van preferred versus rejected responses voor tone en stijl."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-02","obj":"2.1.3","difficulty":"easy","type":"single","stem":"Coho Winery has an agent that answers questions about product availability and prices. The underlying catalog changes several times per day. A developer proposes fine-tuning the model every night on the latest catalog.\n\nWhat should you recommend?","choices":["Ground the agent on the live catalog by using retrieval instead","Fine-tune the model every hour so that the catalog stays current","Use continuous fine-tuning on the previous fine-tuned model each night","Use reinforcement fine-tuning with a grader that checks prices"],"answer":[0],"explanation":"Fine-tuning vervangt retrieval niet voor actuele informatie. Snel veranderende kennis hoort via retrieval of tools in de context; fine-tuning is bedoeld voor stabiel gedrag zoals formaat, toon en terminologie.","rationale":["Correct: retrieval levert actuele data; fine-tuning blijft bedoeld voor stabiele patronen zoals formaat en toon.","Vaker trainen verhoogt kosten en blijft achterlopen op een catalogus die meerdere keren per dag wijzigt.","Continuous fine-tuning is bedoeld voor iteratieve verfijning met nieuwe voorbeelden, niet voor dagelijkse kennisupdates.","RFT optimaliseert redeneergedrag met een grader en maakt het model niet actueel."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-03","obj":"2.1.3","difficulty":"easy","type":"single","stem":"Wingtip Toys plans its first supervised fine-tuning job in Microsoft Foundry to teach a model a structured output format. The team has thousands of raw chat logs of mixed quality, including duplicates and some sensitive information.\n\nWhat should you recommend for preparing the training data?","choices":["Upload all raw chat logs, because a larger dataset always improves quality","Curate accurate, consistent, representative examples and hold out validation and test data","Reuse the validation set as training data to maximize the number of examples","Put the best chat logs into the system message as few-shot examples instead"],"answer":[2],"explanation":"Fine-tuning is iteratief en geen gegarandeerde verbetering: de kwaliteit en dekking van de data bepalen het resultaat. Microsoft adviseert accurate, consistente en representatieve voorbeelden, duplicaten, bias en gevoelige informatie te controleren voor upload, en training-, validatie- en testdata gescheiden te houden.","rationale":["Ongefilterde data met duplicaten en gevoelige informatie kan de kwaliteit juist verslechteren en is een governance-risico.","Correct: gecureerde, representatieve voorbeelden met aparte validatie- en testdata volgen de Foundry-richtlijnen.","Validatiedata als trainingsdata gebruiken veroorzaakt evaluation leakage.","Few-shot in de prompt is een alternatief voor fine-tuning, geen manier om de trainingsdata voor de job voor te bereiden."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-04","obj":"2.1.3","difficulty":"medium","type":"single","stem":"Trey Research uses a fine-tuned model to power a report-writing agent. Each month, analysts curate new high-quality examples, and the team runs a new supervised fine-tuning job. The team must be able to tell the resulting models apart and must deploy the best candidate, not just the most recent one.\n\nWhat should you do?","choices":["Deploy the final checkpoint of each job because it has the lowest training loss","Set a suffix on each job and compare checkpoints on held-out tasks before deploying","Add the new examples to the validation file of the previous job and redeploy it","Add the new examples to the system message of the deployed model each month"],"answer":[3],"explanation":"Met een suffix maak je het resulterende model per job herkenbaar. Foundry adviseert de checkpoint-identifiers en metrics te inspecteren in plaats van aan te nemen dat de laatste versie het beste is, en kandidaten op held-out taken te vergelijken voordat je er een deployt.","rationale":["Een lage training loss zegt niets over generalisatie; de laatste checkpoint is niet automatisch de beste.","Correct: suffix per iteratie plus vergelijking op held-out taken levert herkenbare modellen en de beste kandidaat.","Validatiedata meet de training maar leert het model niets; het vorige model verandert er niet door.","Honderden voorbeelden in de prompt verhogen tokens en latency en vervangen geen fine-tuning-iteratie."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/fine-tuning"},{"id":"2.1.3-05","obj":"2.1.3","difficulty":"medium","type":"single","stem":"Blue Yonder Airlines runs a high-volume routing agent on a large model. The quality is acceptable, but cost and latency are too high. The task is narrow and stable, and the team can generate high-quality outputs for representative prompts by using the large model.\n\nWhich approach should you use?","choices":["Fine-tune the large model by using direct preference optimization","Fine-tune a smaller model on outputs generated by the large model","Add more few-shot examples generated by the large model to its prompt","Switch the agent to a smaller base model without any fine-tuning"],"answer":[1],"explanation":"Distillatie gebruikt teacher-gegenereerde voorbeelden van een groot model om via SFT een kleiner model te specialiseren, met lagere kosten en latency bij vergelijkbare taakprestaties.","rationale":["DPO op het grote model verbetert voorkeuren maar verlaagt de kosten en latency niet.","Correct: distillatie naar een kleiner model met teacher-gegenereerde SFT-data.","Meer few-shot voorbeelden verhogen juist het tokengebruik en de latency.","Een kleiner basismodel zonder training haalt waarschijnlijk de kwaliteit niet."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-06","obj":"2.1.3","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. must fine-tune a model on regulated customer data. Policy requires that the training data stays in the region of the Foundry resource. The fine-tuning job runs monthly, and queue time is less important than compliance.\n\nWhich training type should you use?","choices":["Global","Developer","Standard","Data zone"],"answer":[2],"explanation":"Standard training draait in de regio van de huidige Foundry-resource en biedt data residency-garanties. Global is goedkoper maar kopieert data naar andere regio's, Developer heeft geen residency- of SLA-garanties.","rationale":["Global kopieert data en gewichten naar de regio waar training plaatsvindt, dus geen data residency.","Developer gebruikt idle capacity zonder garanties voor data residency of SLA.","Correct: Standard houdt training in de regio van de resource.","Data zone houdt training binnen een data zone (momenteel alleen de US), niet binnen de regio van de resource."],"ref":"https://learn.microsoft.com/azure/foundry/fine-tuning/overview"},{"id":"2.1.3-07","obj":"2.1.3","difficulty":"hard","type":"single","stem":"Litware, Inc. fine-tuned a chat model by using training examples that all start with the system message \"You are the Litware claims assistant. Respond in JSON.\" Validation results were strong. After deployment, the agent team uses a new, longer system message that adds tool guidance, and the fine-tuned model now often ignores the JSON format.\n\nWhat should you do first?","choices":["Align the inference system message with the one used in training","Increase the number of training epochs and retrain on the same data","Switch the fine-tuning method to reinforcement fine-tuning","Redeploy the fine-tuned model to a Global Standard deployment"],"answer":[0],"explanation":"Voor chatmodellen moet de system message bij inference gelijk zijn aan die in de trainingsdata; een andere system message kan onverwacht gedrag geven. Gebruik dezelfde system message of train opnieuw met de nieuwe.","rationale":["Correct: de mismatch tussen training- en inference-system message is de oorzaak; gebruik dezelfde system message of train opnieuw met de nieuwe.","Meer epochs vergroot de kans op overfitting en lost de mismatch niet op.","Van methode wisselen pakt de oorzaak niet aan.","Het deploymenttype beinvloedt waar inference draait, niet hoe het model reageert op een andere system message."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/fine-tuning-troubleshoot"},{"id":"2.1.3-08","obj":"2.1.3","difficulty":"hard","type":"multi","stem":"School of Fine Art reviews the metrics of a supervised fine-tuning job. Training loss keeps decreasing, but validation loss starts to rise after the first epochs, and the fine-tuned model performs worse than the baseline on held-out test prompts.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Retrain with fewer epochs","Retrain with a smaller learning rate multiplier","Move the validation examples into the training file","Retrain with more epochs so the validation loss can recover","Remove the held-out test set to speed up the next iteration"],"answer":[0,1],"explanation":"Divergentie tussen training- en validatieloss wijst op overfitting. De aanbevolen aanpassingen zijn minder epochs of een kleinere learning rate multiplier; houd training-, validatie- en testdata gescheiden.","rationale":["Correct: minder epochs beperkt overfitting.","Correct: een kleinere learning rate multiplier maakt de training minder agressief.","Validatiedata in training stoppen veroorzaakt evaluation leakage en verbergt overfitting.","Meer epochs versterkt de overfitting juist.","Zonder held-out testset kun je niet vergelijken met de baseline."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/fine-tuning"},{"id":"2.1.3-09","obj":"2.1.3","difficulty":"hard","type":"single","stem":"Relecloud wants a specialized model for a travel-planning agent. The team has curated prompt and ideal response pairs for the core task, and separately has reviewer preference pairs for tone. You need to stack customization methods and be able to detect regressions.\n\nWhich sequence of actions should you perform?","choices":["Run DPO on the base model -> Run SFT on the DPO model -> Measure a baseline -> Compare on held-out data","Run SFT on the base model -> Measure a baseline on held-out data -> Run DPO on the SFT model -> Compare on the training data","Measure the base model on held-out data -> Run SFT with the curated pairs -> Run DPO on the SFT model with the preference pairs -> Compare the result with the baseline on held-out data","Measure the base model on held-out data -> Run DPO with the curated pairs -> Run SFT with the preference pairs -> Compare the result with the baseline on held-out data"],"answer":[2],"explanation":"Je kunt technieken stapelen: eerst SFT voor de taak, daarna DPO voor voorkeuren. Een baseline zonder fine-tuning is essentieel om regressies te herkennen, en vergelijking gebeurt op held-out data.","rationale":["De volgorde is omgedraaid en de baseline wordt pas na training gemeten.","De baseline komt na de eerste training en vergelijken op trainingsdata zegt niets over generalisatie.","Correct: baseline, SFT, DPO op het SFT-model en vergelijking op held-out data.","Datasets zijn verwisseld: DPO vereist preferentieparen en SFT vereist prompt-response-paren."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/fine-tuning-direct-preference-optimization"},{"id":"2.2.1-01","obj":"2.2.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. builds a C# research agent named Agent1 by using Microsoft Agent Framework. Agent1 keeps its conversation history in memory. Agent1 calls tools that return large JSON payloads, and these tool results consume most of the context window. You need to reclaim context space while preserving as much of the user and assistant conversation as possible.\n\nWhich compaction strategy should you use?","choices":["ToolResultCompactionStrategy","SummarizationCompactionStrategy","SlidingWindowCompactionStrategy","TruncationCompactionStrategy"],"answer":[0],"explanation":"ToolResultCompactionStrategy is de minst agressieve strategie: die klapt alleen tool results in en behoudt de rest van de context. Omdat juist de verbose tool output het probleem is en de gesprekscontext behouden moet blijven, past deze strategie het best.","rationale":["Juist: collapse van alleen tool results, lage agressiviteit en hoge contextbehoud, bedoeld voor verbose tool output.","Vervangt de geschiedenis door een samenvatting en vereist een LLM; past bij lange gesprekken, maar verliest meer detail dan nodig.","Laat complete turns vallen; geschikt voor harde turn-limieten, niet om gesprekscontext te behouden.","Laat de oudste groepen vallen als noodrem op het tokenbudget; behoudt weinig context."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"2.2.1-02","obj":"2.2.1","difficulty":"easy","type":"single","stem":"Tailspin Toys builds a customer service agent by using Microsoft Agent Framework in Python. Before each agent run, the agent must receive the current order status of the customer from an internal API. The order status must be added to the prompt for that run, and the agent must be able to process data after the run completes.\n\nWhich component should you implement?","choices":["a custom context provider","a history provider with load_messages set to True","a compaction strategy","a workflow checkpoint"],"answer":[0],"explanation":"Context providers draaien rond elke invocation: ze voegen context toe voor de run en kunnen data verwerken na de run. Dat is precies het patroon voor dynamische context injection, zoals actuele orderstatus uit een API.","rationale":["Juist: een custom context provider injecteert dynamische instructies of berichten voor de run en kan na de run state verwerken.","Een history provider laadt en bewaart chatberichten; hij is bedoeld voor gespreksgeschiedenis, niet voor externe live data.","Een compaction strategy verkleint bestaande geschiedenis; hij voegt geen nieuwe context toe.","Een checkpoint slaat workflow state op voor hervatting; hij injecteert geen context per run."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers"},{"id":"2.2.1-03","obj":"2.2.1","difficulty":"easy","type":"single","stem":"Relecloud builds a Microsoft Agent Framework workflow in Python. An extraction executor reads a document, and a later summarization executor needs the extracted text. The data is large, and the team prefers that the executors share it without sending it as a message between them.\n\nWhich mechanism should you use?","choices":["workflow state by using set_state and get_state on the workflow context","a single AgentSession instance shared by both executors","a checkpoint that is restored before the summarization executor runs","a memory store in Foundry Agent Service with a static scope"],"answer":[0],"explanation":"Workflow state laat meerdere executors binnen een workflow gemeenschappelijke data lezen en schrijven wanneer direct message passing niet handig of efficient is. Met consistente keys schrijft de ene executor en leest de volgende executor dezelfde waarde.","rationale":["Juist: set_state en get_state delen data tussen executors tijdens de uitvoering van de workflow.","AgentSession beheert gesprekscontext van een agent; executors in een workflow delen data niet via een gedeelde session.","Checkpoints dienen om een workflow te pauzeren of na een fout te hervatten, niet om data door te geven tussen stappen.","Een memory store is voor langetermijngeheugen over sessies heen, niet voor tijdelijke data binnen een workflowrun."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/state"},{"id":"2.2.1-04","obj":"2.2.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank builds Agent1 by using Microsoft Agent Framework. Agent1 is backed by a Foundry Agent Service agent, and the service manages the conversation state. To lower token cost, a developer registers a SlidingWindowCompactionStrategy with a trigger of 20 turns. After 50 turns, the input token count per request is unchanged.\n\nWhat should you identify as the cause?","choices":["Compaction applies to agents that manage their own in-memory history, and the service manages the context of Agent1.","The trigger threshold of 20 turns is higher than the context window of the model.","The compaction provider was registered through ChatClientAgentOptions instead of the chat client builder.","The sliding window strategy requires a separate summarization chat client."],"answer":[0],"explanation":"Compaction is alleen relevant voor agents die zelf een in-memory berichtenlijst beheren. Voor Foundry Agents beheert de service de context server-side, dus een compaction strategy heeft daar geen effect.","rationale":["Juist: voor service-managed agents zoals Foundry Agents heeft het configureren van compaction geen effect.","Een trigger in turns staat los van de omvang van het context window; na 50 turns zou de trigger bij lokale history wel afgaan.","Registratie via ChatClientAgentOptions beinvloedt wanneer compaction draait en of samenvattingen persistent worden, maar verklaart niet dat er niets gebeurt bij service-managed context.","Alleen SummarizationCompactionStrategy heeft een LLM nodig; een sliding window laat turns vallen zonder model."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"2.2.1-05","obj":"2.2.1","difficulty":"medium","type":"single","stem":"Lucerne Publishing builds an editorial assistant in C# by using Microsoft Agent Framework with in-memory history. Editing sessions last for hours. Decisions made early in a session must still influence later answers, and the token count must stay within the context window. Dropping complete early turns is unacceptable.\n\nWhich compaction strategy should you use?","choices":["SummarizationCompactionStrategy","ToolResultCompactionStrategy","SlidingWindowCompactionStrategy","TruncationCompactionStrategy"],"answer":[0],"explanation":"SummarizationCompactionStrategy vervangt oudere geschiedenis door een samenvatting, zodat vroege beslissingen bewaard blijven terwijl het tokenaantal daalt. Microsoft raadt aan een kleiner en goedkoper model te gebruiken voor de samenvattende chat client.","rationale":["Juist: middelmatig agressief, behoudt de betekenis van lange gesprekken via een samenvatting.","Klapt alleen tool results in; het probleem hier is een lange gespreksgeschiedenis, niet tool output.","Laat complete turns vallen, wat de eis schendt dat vroege beslissingen moeten blijven meetellen.","Laat de oudste groepen vallen als noodrem; vroege beslissingen gaan dan verloren."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"2.2.1-06","obj":"2.2.1","difficulty":"medium","type":"single","stem":"Wide World Importers builds a C# support agent by using Microsoft Agent Framework. A TextSearchProvider is attached through the AIContextProviders option and uses the default settings. Telemetry shows that a search runs on every agent invocation, including greetings and small talk, which adds tokens and latency.\n\nThe agent must retrieve content only when the model decides that it needs more information, and the model must be able to choose its own search string.\n\nWhat should you configure?","choices":["Set SearchTime to OnDemandFunctionCalling in TextSearchProviderOptions.","Keep SearchTime set to BeforeAIInvoke and set RecentMessageMemoryLimit to 6.","Keep SearchTime set to BeforeAIInvoke and replace the default ContextPrompt.","Set FunctionToolName and FunctionToolDescription while keeping BeforeAIInvoke."],"answer":[0],"explanation":"De standaardwaarde van SearchTime is BeforeAIInvoke: dan wordt voor elke aanroep gezocht en worden de resultaten als berichten geinjecteerd. Met OnDemandFunctionCalling stelt de provider een zoektool beschikbaar die het model alleen aanroept wanneer het extra informatie nodig heeft, met een zoekterm die het model zelf kiest.","rationale":["Juist: on-demand retrieval via een function tool laat het model bepalen wanneer en waarop gezocht wordt.","Fout: dit voegt recente berichten toe aan de zoekinvoer, maar er wordt nog steeds bij elke aanroep gezocht.","Fout: de ContextPrompt verandert alleen de tekst rond de resultaten, niet wanneer er gezocht wordt.","Fout: de naam en beschrijving van de zoektool worden alleen gebruikt in on-demand modus."],"ref":"https://learn.microsoft.com/agent-framework/agents/rag"},{"id":"2.2.1-07","obj":"2.2.1","difficulty":"hard","type":"single","stem":"Contoso, Ltd. builds a C# agent by using Microsoft Agent Framework. The agent uses ChatHistoryProvider to persist the full conversation for auditing. A developer adds compaction as follows:\n\n```csharp\nAIAgent agent = agentChatClient\n    .AsBuilder()\n    .BuildAIAgent(new ChatClientAgentOptions\n    {\n        AIContextProviders = [new CompactionProvider(compactionPipeline)]\n    });\n```\n\nAuditors report that synthetic summary messages appear in the persisted history. Long tool-calling loops also exceed the context window. You need to compact only the in-flight request context before each model call and keep the stored history unchanged.\n\nWhat should you do?","choices":["Register the CompactionProvider on the ChatClientBuilder by using UseAIContextProviders.","Adapt the compaction strategy to an IChatReducer and set it on InMemoryChatHistoryProvider.","Wrap the existing IChatReducer in a ChatReducerCompactionStrategy and keep the agent options registration.","Call CompactionProvider.CompactAsync on the stored history after each run."],"answer":[0],"explanation":"Via ChatClientAgentOptions draait de CompactionProvider niet in de tool-calling loop en kunnen samenvattingen in de opgeslagen history terechtkomen. Registratie op de ChatClientBuilder met UseAIContextProviders compacteert alleen de in-flight berichten voor elke LLM-call en laat de door ChatHistoryProvider bewaarde history ongemoeid.","rationale":["Juist: op de builder draait compaction binnen de tool-calling loop en blijft de opgeslagen history ongewijzigd.","Een IChatReducer op de history provider verkleint juist de bewaarde history, wat de auditeis schendt.","Dit wijzigt alleen de strategie, niet het registratiepunt; het probleem van persistente samenvattingen en de tool loop blijft bestaan.","Ad-hoc compaction op de opgeslagen history wijzigt de auditgeschiedenis en helpt niet binnen een lopende tool loop."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"2.2.1-08","obj":"2.2.1","difficulty":"hard","type":"multi","stem":"Northwind Traders builds a C# agent by using Microsoft Agent Framework. A custom AIContextProvider must inject relevant memories and must also remove a restricted tool from the tool list for some users, so the developer overrides InvokingCoreAsync as follows.\n\n```csharp\nprotected override async ValueTask<AIContext> InvokingCoreAsync(InvokingContext context, CancellationToken cancellationToken = default)\n{\n    var state = this._sessionState.GetOrInitializeState(context.Session);\n    var query = string.Join(\"\\n\", context.AIContext.Messages?.Select(x => x.Text) ?? []);\n    var memories = this._client.LoadMemories(state.MemoriesId, query);\n    return new AIContext\n    {\n        Messages = [new ChatMessage(ChatRole.User, \"Relevant memories: \" + string.Join(\"\\n\", memories.Select(x => x.Text)))]\n    };\n}\n```\n\nTwo problems occur:\n\n- The model no longer receives the agent instructions, the tools, or the chat history.\n- Memory searches are based on chat history and on messages from other context providers instead of only the new user input.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Return an AIContext that contains context.AIContext.Instructions, the filtered tools, and context.AIContext.Messages concatenated with the memory messages.","Build the memory query only from messages whose request message source type is External.","Stamp the memory messages with the External request message source type.","Store the memory container ID in a field of the provider instance.","Move the memory search from InvokingCoreAsync to InvokedCoreAsync."],"answer":[0,1],"explanation":"Wie InvokingCoreAsync overschrijft, moet de basisfunctionaliteit zelf implementeren: de base filtert de invoer tot berichten van de aanroeper (External) en voegt messages, tools en instructions samen met de bestaande. ProvideAIContextAsync is hier geen optie, omdat de resultaten daarvan alleen worden toegevoegd en een tool dus niet kan worden verwijderd.","rationale":["Juist: de bestaande instructions, tools en messages moeten worden teruggegeven, anders vervangt de provider de complete invoer.","Juist: door alleen External-berichten te gebruiken zoekt de provider op nieuwe gebruikersinvoer en niet op chat history of andere providers.","Fout: geinjecteerde berichten horen het source type AIContextProvider te krijgen; als External lijken ze gebruikersinvoer en ontstaan feedback loops.","Fout: een provider-instantie wordt voor alle sessies gedeeld; sessiespecifieke ID's horen in de AgentSession.","Fout: InvokedCoreAsync draait na de LLM-aanroep en kan de invoer van die aanroep niet meer verrijken."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers"},{"id":"2.2.1-09","obj":"2.2.1","difficulty":"medium","type":"single","stem":"Proseware, Inc. builds a Python agent by using Microsoft Agent Framework. DatabaseHistoryProvider is the primary history provider. You add a second provider to capture an evaluation log that includes the context injected by other providers. Messages must not be loaded twice into the same invocation.\n\n```python\nprimary = DatabaseHistoryProvider(db)\naudit = InMemoryHistoryProvider(\"audit\", ______)\nagent = Agent(client=OpenAIChatClient(), context_providers=[primary, audit])\n```\n\nWhich arguments should you use to complete the code?","choices":["load_messages=False, store_context_messages=True","load_messages=True, store_context_messages=True","load_messages=True, store_context_messages=False","load_messages=False, store_context_messages=False"],"answer":[0],"explanation":"In Python mag maar een history provider load_messages=True gebruiken, anders worden berichten dubbel in de invocation geladen. Een extra provider voor diagnostics of evals gebruikt load_messages=False en store_context_messages=True, zodat hij ook de context van andere providers vastlegt.","rationale":["Juist: laadt geen berichten en legt wel de verrijkte context plus input en output vast.","Twee providers met load_messages=True laden dezelfde geschiedenis dubbel in de invocation.","Dubbel laden en bovendien geen vastlegging van de geinjecteerde context.","Voorkomt dubbel laden, maar legt de context van andere providers niet vast voor de evaluatielog."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/context-providers"},{"id":"2.2.2-01","obj":"2.2.2","difficulty":"easy","type":"single","stem":"Fourth Coffee builds an operations agent in Foundry Agent Service. Users often ask the agent to repeat a multistep routine that the agent previously performed for them, such as preparing a weekly supplier report. The agent must recall how it handled that routine before.\n\nWhich memory type should you rely on?","choices":["procedural memory","user profile memory","chat summary memory","a Foundry IQ knowledge base"],"answer":[0],"explanation":"Procedural memory bewaart herbruikbare how-to routines en werkpatronen die uit eerdere interacties zijn afgeleid. Je haalt die op wanneer de gebruiker vraagt om een terugkerende workflow die de agent eerder heeft uitgevoerd.","rationale":["Juist: procedural memory is bedoeld voor terugkerende routines en taken die de agent eerder heeft afgehandeld.","User profile memory bevat duurzame voorkeuren zoals taal of toegankelijkheidsbehoeften, geen werkroutines.","Chat summary memory bevat samenvattingen van eerdere gespreksonderwerpen voor continuiteit, geen herbruikbare procedures.","Een Foundry IQ knowledge base grondt de agent op gecureerde organisatiecontent, niet op geleerde gebruikersspecifieke routines."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-memory"},{"id":"2.2.2-02","obj":"2.2.2","difficulty":"easy","type":"single","stem":"Humongous Insurance uses a single memory store in Foundry Agent Service for a claims agent. Memories are partitioned by a scope per customer. A customer submits a data deletion request. Memories of other customers must remain available.\n\nWhat should you do?","choices":["Delete the memories for the scope of that customer.","Delete the memory store.","Set a default TTL on the memory store.","Update the user_profile_details option of the memory store."],"answer":[0],"explanation":"Verwijderen per scope haalt alle memories van een specifieke gebruiker of groep weg en laat de memory store-structuur intact. Microsoft noemt dit expliciet voor het afhandelen van verwijderverzoeken van gebruikers.","rationale":["Juist: delete scope verwijdert alle memories van die klant en laat andere scopes ongemoeid.","Het verwijderen van de store wist onomkeerbaar de memories van alle klanten.","Een TTL laat memories op termijn verlopen, maar voldoet niet direct aan een concreet verwijderverzoek.","user_profile_details stuurt wat er voortaan wordt geextraheerd; bestaande memories worden er niet mee verwijderd."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-03","obj":"2.2.2","difficulty":"easy","type":"single","stem":"Coho Winery has a Foundry Agent Service prompt agent that has the memory search tool attached. A user tells the agent, \"Forget my home address.\" The privacy policy requires that this request takes effect immediately and that all other memories of the user remain available. You want to avoid writing custom memory-management code.\n\nWhat should you do?","choices":["Rely on the memory search tool to apply the forget command directly.","Delete the memories for the scope of the user.","Set user_profile_details to exclude home addresses.","Set default_ttl_seconds on the memory store to a short value."],"answer":[0],"explanation":"Als een gebruiker expliciet vraagt iets te onthouden of te vergeten, past de memory search tool die opdracht direct toe en retourneert het resultaat als memory command items. Er is geen extra toolconfiguratie nodig, en de overige memories van de gebruiker blijven bestaan.","rationale":["Juist: direct remember-or-forget gedrag voert het verzoek meteen uit zonder eigen code.","Fout: verwijderen per scope wist alle memories van de gebruiker, terwijl de rest beschikbaar moet blijven.","Fout: user_profile_details stuurt toekomstige extractie, maar verwijdert het al opgeslagen adres niet.","Fout: een TTL laat alle memories na verloop van tijd verlopen en werkt niet direct op dit ene gegeven."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-04","obj":"2.2.2","difficulty":"medium","type":"single","stem":"Wide World Importers attaches the memory search tool to a prompt agent in Foundry Agent Service. A backend service named App1 calls the agent on behalf of about 80 end users in a pilot program by using its own managed identity. Each end user must have isolated memories, and identifiers must not be hard-coded in the tool definition.\n\nWhat should you do?","choices":["Set scope to {{$userId}} in the tool definition, and send the x-memory-user-id header with the end user ID on each response call.","Set scope to {{$userId}} in the tool definition, and rely on the Microsoft Entra token of App1 to resolve the user.","Set scope to a static value in the tool definition, and filter memories by user in App1.","Create a separate agent version for each end user with the user ID as a static scope."],"answer":[0],"explanation":"Met scope {{$userId}} resolve de service de gebruiker per response call. In proxy- of backendscenario's gebruik je de header x-memory-user-id; zonder header valt de service terug op de TID en OID van de aanroeper, wat hier de identity van App1 is en alle gebruikers in een scope zou plaatsen.","rationale":["Juist: de header levert per call de echte eindgebruiker, zonder hard-coded identifiers.","Zonder header wordt de Entra-identity van App1 gebruikt, waardoor alle eindgebruikers dezelfde scope delen.","Een statische scope deelt memories over alle gebruikers; filteren in de app biedt geen echte isolatie.","Per gebruiker een agentversie met hard-coded scope schaalt niet en schendt de eis om identifiers niet vast te leggen."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-05","obj":"2.2.2","difficulty":"medium","type":"single","stem":"Coho Winery creates a new memory store in Foundry Agent Service. The retention policy states that memory entries must expire 30 days after they were last updated.\n\n```python\noptions = MemoryStoreDefaultOptions(\n    chat_summary_enabled=True,\n    user_profile_enabled=True,\n    ______=timedelta(days=30),\n)\n```\n\nWhich option should you use to complete the code?","choices":["default_ttl_seconds","update_delay","user_profile_details","procedural_memory_enabled"],"answer":[0],"explanation":"default_ttl_seconds stelt de standaardretentie in voor nieuwe memory entries in de store. TTL geldt voor alle memories, en bij een update en consolidatie wordt de last-updated tijd gereset. Deze default stel je in bij het aanmaken van de store.","rationale":["Juist: de store-level default TTL regelt het verlopen van memory entries.","update_delay is een instelling van de memory search tool die bepaalt na hoeveel inactiviteit memories worden bijgewerkt.","user_profile_details bepaalt welke profielinformatie wordt geextraheerd, niet hoe lang die wordt bewaard.","procedural_memory_enabled schakelt procedural memory in of uit, niet de retentie."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-06","obj":"2.2.2","difficulty":"medium","type":"single","stem":"Best For You Organics Company uses memory in Foundry Agent Service for a nutrition agent. The agent must keep personalizing answers based on dietary preferences. The privacy officer requires that the memory system does not store financial data, age, precise location, or credentials that users mention in conversations.\n\nWhat should you do?","choices":["Set user_profile_details to exclude those data categories.","Set user_profile_enabled to False on the memory store.","Set a default TTL of one day on the memory store.","Use one static scope for all users of the agent."],"answer":[0],"explanation":"Met user_profile_details geef je aan welke categorieen profielinformatie wel of niet worden geextraheerd, bijvoorbeeld het vermijden van leeftijd, financien, precieze locatie en credentials. Zo blijft personalisatie werken terwijl het geheugen compliant blijft.","rationale":["Juist: user_profile_details sluit gevoelige categorieen uit en behoudt personalisatie.","Het uitschakelen van user profile memory stopt ook de opslag van dieetvoorkeuren, waardoor personalisatie verdwijnt.","Een korte TTL laat gevoelige data alsnog tijdelijk opslaan en ondermijnt langdurige personalisatie.","Een gedeelde scope vergroot het privacyrisico; scope regelt isolatie, niet welke data wordt opgeslagen."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-07","obj":"2.2.2","difficulty":"hard","type":"single","stem":"Graphic Design Institute tests a Foundry Agent Service prompt agent that has the memory search tool attached with the default configuration. In a test script, User1 states a preference, and the script immediately starts a new conversation with the same scope to ask a related question. The agent does not recall the preference. The memory store name and scope are verified as correct.\n\nWhat should you do to make the test pass?","choices":["Set update_delay to 0 on the memory search tool.","Use a new stable identifier as the scope in the second conversation.","Enable chat_summary_enabled on the memory store.","Attach the file search tool to the agent."],"answer":[0],"explanation":"Na elke response roept de service update_memories aan, maar de werkelijke write naar langetermijngeheugen wordt gedebounced door update_delay (standaard 300 seconden). Een direct gestarte nieuwe conversatie ziet de voorkeur dus nog niet; met update_delay op 0 wordt de update direct verwerkt (in productie kun je ook langer wachten).","rationale":["Juist: de debounce van update_delay verklaart dat memories nog niet zijn geschreven.","Een andere scope zorgt er juist voor dat de opgeslagen memories nooit worden gevonden.","Chat summary memory staat standaard al aan en bepaalt welk type memory wordt geextraheerd, niet wanneer de write plaatsvindt.","File search doorzoekt geuploade documenten en schrijft geen gebruikersvoorkeuren naar memory."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"2.2.2-08","obj":"2.2.2","difficulty":"hard","type":"single","stem":"Trey Research hosts a Microsoft Agent Framework agent that uses service-managed storage through the OpenAI Responses API. One Foundry project and one backing key serve all end users of a multi-tenant portal. Users resume conversations after they sign in again. A security review flags that a user who obtains another conversation ID can resume that conversation.\n\nWhat should you do?","choices":["Map your own session IDs to server-stored conversation IDs and verify ownership on resume.","Return the serialized AgentSession to the browser and restore it from the next request.","Rely on the opaque, unguessable format of the service conversation IDs.","Add a local history provider alongside the service-managed session."],"answer":[0],"explanation":"Responses- en Conversations-ID's zijn standaard gescoped aan de backing key of het project, niet aan de eindgebruiker. Bij een gedeeld project voor meerdere gebruikers bewaar je die ID's in vertrouwde server-side opslag, map je ze vanuit je eigen session ID's en controleer je eigenaarschap voordat je hervat.","rationale":["Juist: server-side mapping plus eigenaarschapscontrole bindt elke sessie aan de geauthenticeerde gebruiker of tenant.","Een geserialiseerde session hoort als vertrouwde applicatiestate te worden bewaard; teruggeven aan de client maakt manipulatie mogelijk.","Opaque ID's zijn niet aan de gebruiker gebonden; wie een ID bemachtigt, kan de conversatie nog steeds hervatten.","Lokale history combineren met service-managed sessies wordt afgeraden en lost de autorisatiekwestie niet op."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/storage"},{"id":"2.2.2-09","obj":"2.2.2","difficulty":"hard","type":"multi","stem":"Consolidated Messenger runs a multi-agent workflow by using Microsoft Agent Framework. To save startup time, one workflow instance is built at application start and reused for every customer request. Checkpoints are written so that long-running requests can resume after a failure. Testers find content from a previous customer in the answers to a new customer. You need to isolate agent state per request and protect the persisted workflow state.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Wrap agent creation and workflow building in a helper method that is called for each request.","Store checkpoints in private storage that only authorized services can read and write.","Share one AgentSession instance across all agents in the workflow.","Restore the most recent checkpoint at the start of every new request.","Use one static memory scope for all customers."],"answer":[0,1],"explanation":"Agent threads blijven bestaan over runs van dezelfde workflow-instantie, waardoor hergebruik leidt tot ongewenst gedeelde state. Een helper die per request nieuwe agents en een nieuwe workflow bouwt, isoleert de state. Checkpoint storage is een trust boundary en hoort in beveiligde, private opslag.","rationale":["Juist: elke aanroep levert nieuwe agentinstanties met eigen threads op, dus geen lekkage tussen klanten.","Juist: checkpoints zijn vertrouwde applicatiestate; laad ze nooit uit onbetrouwbare bronnen en beperk de toegang.","Een gedeelde session vergroot juist de kans op inconsistente en gelekte context tussen agents.","Het herstellen van de checkpoint van een andere request introduceert precies de state van een vorige klant.","Een gedeelde memory scope deelt memories tussen klanten en schendt de isolatie."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/state"},{"id":"2.2.3-01","obj":"2.2.3","difficulty":"easy","type":"single","stem":"City Power & Light builds a multi-agent RAG solution over long technical manuals in Azure AI Search. You choose fixed-size chunking for a first iteration. You need a starting configuration that maintains continuity between chunks without excessive duplication.\n\nWhich chunking configuration should you start with?","choices":["512 tokens per chunk with an overlap of 128 tokens","512 tokens per chunk with no overlap","8,000 tokens per chunk with no overlap","512 tokens per chunk with an overlap of 384 tokens"],"answer":[0],"explanation":"Microsoft adviseert te starten met chunks van 512 tokens (ongeveer 2.000 tekens) en een overlap van 25 procent, dus 128 tokens. Die overlap zorgt voor vloeiende overgangen tussen chunks zonder buitensporige duplicatie.","rationale":["Juist: dit is het aanbevolen startpunt van 512 tokens met 25 procent overlap.","Zonder overlap kan betekenis verloren gaan op chunkgrenzen.","Zeer grote chunks naderen de inputlimiet van embeddingmodellen en verwateren de embedding.","Een overlap van 75 procent geeft overmatige duplicatie; de Text Split skill eist bovendien dat overlap kleiner is dan de helft van de chunklengte."],"ref":"https://learn.microsoft.com/azure/search/vector-search-how-to-chunk-documents"},{"id":"2.2.3-02","obj":"2.2.3","difficulty":"easy","type":"single","stem":"Nod Publishers indexes book excerpts in Azure AI Search by using an Azure OpenAI Embedding skill that calls a text-embedding-3-small deployment. A retrieval agent submits text queries, and the index converts them to vectors by using a vectorizer that points to a text-embedding-3-large deployment. Relevance is poor.\n\nWhat should you do?","choices":["Point the vectorizer to the model deployment of the embedding skill.","Increase the k value of the vector query to return more matches.","Enable semantic ranking on the index for the agent queries.","Add a scoring profile that boosts the title field."],"answer":[0],"explanation":"Voor juiste resultaten moet je hetzelfde embeddingmodel gebruiken voor indexeren en voor queries. De skill genereert embeddings tijdens indexering en de vectorizer tijdens queries; kies dus een skill-vectorizer-paar dat naar dezelfde modeldeployment wijst.","rationale":["Juist: query- en documentvectoren moeten uit hetzelfde model komen om vergelijkbaar te zijn.","Meer resultaten ophalen verhelpt niet dat de vectoren in verschillende ruimtes liggen.","Semantic ranking herrangschikt resultaten, maar kan slecht teruggehaalde L1-resultaten niet herstellen.","Een scoring profile versterkt velden, maar lost de mismatch tussen modellen niet op."],"ref":"https://learn.microsoft.com/azure/search/vector-search-how-to-configure-vectorizer"},{"id":"2.2.3-03","obj":"2.2.3","difficulty":"easy","type":"single","stem":"Southridge Video runs a hybrid query in Azure AI Search for a research agent. The initial results are relevant to the keywords, but the top results do not best match the intent of the question. You need a secondary ranking step that uses language understanding to rescore the initial results.\n\nWhich feature should you enable?","choices":["semantic ranking","a scoring profile","vector weighting","a synonym map"],"answer":[0],"explanation":"Semantic ranker voegt L2-ranking toe over een initiele resultaatset die met BM25 of RRF is gescoord. Het gebruikt deep learning-modellen uit Microsoft Bing om de semantisch meest relevante resultaten naar boven te halen.","rationale":["Juist: semantic ranking herscoort L1-resultaten op basis van de betekenis van de query.","Een scoring profile verhoogt scores op basis van velden of criteria, niet op basis van taalbegrip.","Vector weighting verandert het gewicht van vectorqueries binnen RRF, maar voegt geen semantische herrangschikking toe.","Een synonym map verbreedt keyword matching, maar herrangschikt resultaten niet op intentie."],"ref":"https://learn.microsoft.com/azure/search/semantic-search-overview"},{"id":"2.2.3-04","obj":"2.2.3","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. indexes PDF policy documents that use deep heading structures. The existing skillset already calls the Document Layout skill, and the team must use only generally available features. Agents retrieve passages that are often cut off in the middle of a section, and the chunks lose their section context. You need chunks that follow document structure and stay within a maximum size.\n\nWhat should you do?","choices":["Apply the Text Split skill to each Markdown section from the Document Layout skill.","Apply the Text Split skill in pages mode to the full extracted document content.","Apply the Text Split skill in sentences mode to the full extracted document content.","Index the PDF files by using the Markdown parsing mode of the blob indexer."],"answer":[0],"explanation":"De Document Layout skill herkent documentstructuur (headings en content) via het layout-model van Azure Document Intelligence en levert Markdown-secties. Door de Text Split skill per Markdown-sectie te laten draaien, beperk je de chunkgrootte binnen elke sectie en blijven chunks semantisch coherent. Voor nieuwe skillsets raadt Microsoft de Azure Content Understanding skill aan, maar semantic chunking daarvan is nog preview.","rationale":["Juist: structuurgebaseerde chunking per sectie met een maximale grootte, op basis van de bestaande Document Layout-output.","Pages-modus over de volledige content splitst op lengte en negeert headings, wat de huidige afgebroken secties veroorzaakt.","Sentences-modus maakt chunks van losse zinnen; die missen sectiecontext.","De Markdown parsing mode is bedoeld voor Markdown-bestanden, niet voor het herkennen van headings in PDF-bestanden."],"ref":"https://learn.microsoft.com/azure/search/search-how-to-semantic-chunking"},{"id":"2.2.3-05","obj":"2.2.3","difficulty":"hard","type":"single","stem":"A. Datum Corporation stores 200 million chunks in Azure AI Search, embedded by text-embedding-3-large. Vector index memory is the main cost driver. You need the largest reduction in vector index size while keeping the loss in result quality minimal. You create new vector fields that use the HNSW algorithm.\n\nWhich compression configuration should you use?","choices":["binary quantization with truncationDimension set to 1,024 and rescoring with the original vectors","binary quantization with truncationDimension set to 1,024 and no rescoring","scalar quantization to int8 with no truncation and rescoring with the original vectors","no quantization, with the stored property of the vector fields set to false"],"answer":[0],"explanation":"Binary quantization met MRL-truncatie levert de grootste reductie van de vectorindex. Microsoft raadt bij binary quantization een truncationDimension van 1.024 of hoger aan; daaronder daalt de kwaliteit. Rescoring met de originele vectoren en oversampling compenseren het informatieverlies.","rationale":["Juist: maximale reductie met MRL plus binary, met een dimensie die de kwaliteit behoudt en rescoring als compensatie.","Dezelfde indexreductie, maar zonder rescoring en oversampling wordt het informatieverlies van binary compression niet gecompenseerd.","Scalar int8 verkleint de vectorindex ongeveer vier keer, wat veel minder is dan binary met truncatie.","stored op false bespaart alleen diskopslag, niet het duurdere geheugen van de vectorindex."],"ref":"https://learn.microsoft.com/azure/search/vector-search-how-to-truncate-dimensions"},{"id":"2.2.3-06","obj":"2.2.3","difficulty":"medium","type":"single","stem":"Blue Yonder Airlines grounds a baggage policy agent on an Azure AI Search index whose vector fields use the HNSW algorithm. Before tuning HNSW parameters, the team must measure the recall of the current approximate results against the exact nearest neighbors for a set of test queries. The index definition must not be changed.\n\nWhat should you do?","choices":["Set exhaustive to true on the vector queries of the test set.","Change the algorithm of the vector fields to exhaustiveKnn.","Increase the k value on the vector queries of the test set.","Set vectorFilterMode to preFilter on the test set queries."],"answer":[0],"explanation":"Velden die met HNSW zijn geindexeerd ondersteunen ook exhaustive KNN via de queryparameter exhaustive: true. Exhaustive KNN levert de exacte k nearest neighbors en is daarmee geschikt om een ground truth-set te bouwen voor het meten van de recall van ANN, zonder de index te wijzigen.","rationale":["Juist: exhaustive: true voert per query een brute-force KNN uit over een HNSW-veld en levert de exacte nearest neighbors.","Dit wijzigt de indexdefinitie, en velden met exhaustiveKnn ondersteunen geen HNSW-queries meer, zodat je niet meer kunt vergelijken.","Een grotere k levert meer approximate resultaten, maar geen exacte ground truth.","vectorFilterMode bepaalt wanneer een OData-filter wordt toegepast en levert geen exacte nearest neighbors."],"ref":"https://learn.microsoft.com/azure/search/vector-search-ranking"},{"id":"2.2.3-07","obj":"2.2.3","difficulty":"medium","type":"single","stem":"Adventure Works Cycles shares one Azure AI Search index among several specialist agents. Each agent filters vector queries on a department field, and some departments contain very few documents. With the current filter mode, agents for small departments sometimes receive fewer than k results, although matching documents exist. Recall matters more than latency.\n\nWhich vectorFilterMode should you use?","choices":["preFilter","postFilter","strictPostFilter","no filter mode, with a threshold parameter instead"],"answer":[0],"explanation":"preFilter past de filter toe tijdens de HNSW-traversal en garandeert dat k resultaten terugkomen als ze bestaan. Dat verhoogt recall maar kost meer CPU en latency bij zeer selectieve filters; bij heel weinig matches kun je ook exhaustive search overwegen.","rationale":["Juist: preFilter maximaliseert recall en levert k resultaten als die bestaan.","postFilter kan false negatives opleveren bij zeer selectieve filters of kleine k, precies het gemelde probleem.","strictPostFilter bepaalt eerst de ongefilterde globale top-k en heeft het hoogste risico op false negatives.","Een threshold verwijdert zwakke resultaten en lost het probleem van ontbrekende gefilterde resultaten niet op."],"ref":"https://learn.microsoft.com/azure/search/vector-search-filters"},{"id":"2.2.3-08","obj":"2.2.3","difficulty":"hard","type":"single","stem":"Northwind Traders builds an Azure AI Search pipeline for a multi-agent RAG solution. Documents are in Azure Blob Storage. Content must be chunked and vectorized during indexing, and agents must submit plain-text queries against the vector fields. Changed documents must be picked up on a schedule.\n\nWhich sequence of actions should you perform?","choices":["Create a data source -> create a skillset with the Text Split skill and an embedding skill -> create an index with a vectorizer assigned to the vector fields -> create an indexer that runs on a schedule","Create an index with a vectorizer -> create an indexer that runs on a schedule -> create a data source -> create a skillset with the Text Split skill and an embedding skill","Create a skillset with an embedding skill -> create an indexer that runs on a schedule -> create a data source -> create an index with a vectorizer","Create a data source -> create an indexer that runs on a schedule -> create an index with a vectorizer -> create a skillset with the Text Split skill and an embedding skill"],"answer":[0],"explanation":"Voor chunking en vectorisatie tijdens indexering maak je eerst een data source, dan een skillset met Text Split en een embedding skill, dan een index met een vectorizer voor query time, en ten slotte een indexer die alles aanstuurt. De indexer verwijst naar de andere objecten en komt dus als laatste; plan hem op een schema voor gewijzigde documenten.","rationale":["Juist: dit volgt de gedocumenteerde volgorde, met de indexer als laatste omdat die de andere objecten gebruikt.","De indexer verwijst naar data source en skillset, die op dat moment nog niet bestaan.","De indexer wordt gemaakt voordat data source en index bestaan; bovendien ontbreekt chunking.","De indexer wordt gemaakt voordat de index en de skillset bestaan waarnaar hij verwijst."],"ref":"https://learn.microsoft.com/azure/search/vector-search-integrated-vectorization"},{"id":"2.2.3-09","obj":"2.2.3","difficulty":"hard","type":"multi","stem":"Wingtip Toys has a retrieval agent that serves several other agents. The agent sends hybrid queries with semantic ranking to an Azure AI Search index. The vector query sets k to 10. Two issues are reported:\n\n- The semantic ranker returns fewer results than expected and misses relevant passages.\n- For questions that contain exact part numbers, such as WT-4471-B, vector matches dominate the fused results and push the keyword matches down.\n\nThe agent must keep using hybrid queries with semantic ranking.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Set k on the vector query to at least 50, and use top to limit the returned results.","Set the weight of the vector query to a value below 1.0.","Apply a minimum threshold to the fused RRF scores.","Replace the hybrid query with a vector query that uses exhaustive KNN.","Set vectorFilterMode to postFilter on the vector query."],"answer":[0,1],"explanation":"Semantic ranking werkt op de kandidaten die hybrid retrieval aanlevert; Microsoft adviseert k op minimaal 50 te zetten en het aantal teruggegeven resultaten met top te beperken. Als vector-resultaten domineren, verlaag je het gewicht van de vector query (weight, standaard 1.0) zodat de keyword-matches zwaarder meetellen in RRF.","rationale":["Juist: met k = 10 krijgt de semantic ranker te weinig input; k op 50 en top voor de respons lost dat op.","Juist: weight is een multiplier in de RRF-berekening; een waarde onder 1.0 vermindert de invloed van de vector query.","RRF-scores zijn klein en volatiel, dus minimum thresholds passen niet bij hybrid queries.","Een pure vector query laat de keyword-matches op part numbers juist volledig vallen en schendt de eis om hybrid te blijven gebruiken.","vectorFilterMode bepaalt wanneer een filter wordt toegepast en verandert de verhouding tussen keyword- en vector-resultaten niet."],"ref":"https://learn.microsoft.com/azure/search/hybrid-search-how-to-query"},{"id":"2.2.4-01","obj":"2.2.4","difficulty":"easy","type":"single","stem":"Contoso Suites builds a Foundry IQ knowledge base for its concierge agents. The agents must ground answers on real-time public information, such as current local events, retrieved at query time from Microsoft Bing.\n\nWhich knowledge source should you add?","choices":["a web knowledge source","an MCP server knowledge source","a remote SharePoint knowledge source","a search index knowledge source"],"answer":[0],"explanation":"Een web knowledge source is een remote knowledge source die real-time grounding data uit Microsoft Bing ophaalt. Content wordt niet in Azure AI Search geingest maar op query time opgehaald.","rationale":["Juist: de web knowledge source haalt real-time publieke data op via Bing.","Een MCP server knowledge source haalt live resultaten op uit een eigen MCP-endpoint, niet uit Bing.","Remote SharePoint haalt content op uit SharePoint in Microsoft 365, niet van het publieke web.","Een search index knowledge source verpakt een bestaande index met vooraf geindexeerde content."],"ref":"https://learn.microsoft.com/azure/search/agentic-knowledge-source-overview"},{"id":"2.2.4-02","obj":"2.2.4","difficulty":"easy","type":"single","stem":"First Up Consultants builds an agent in Foundry Agent Service. During a conversation, consultants upload their own PDF and Word files and ask questions about them. The team does not want to manage search infrastructure or ingestion pipelines.\n\nWhich tool should you add to the agent?","choices":["the file search tool","the Azure AI Search tool","a Foundry IQ knowledge base","the web search tool"],"answer":[0],"explanation":"File search doorzoekt documenten die je direct uploadt, zonder externe zoekinfrastructuur te beheren. De service regelt parsing, chunking, embeddings en hybrid retrieval. Microsoft noemt file search ook expliciet voor door gebruikers aangeleverde documenten tijdens een interactie.","rationale":["Juist: file search verwerkt geuploade bestanden automatisch en doorzoekt ze tijdens de interactie.","De Azure AI Search tool is bedoeld voor het doorzoeken van bestaande indexes die je zelf beheert.","Een Foundry IQ knowledge base grondt agents op gecureerde organisatiecontent uit knowledge sources.","Web search haalt actuele publieke informatie op, geen geuploade bestanden."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/file-search"},{"id":"2.2.4-03","obj":"2.2.4","difficulty":"easy","type":"single","stem":"Bellows College runs five agents that answer questions about admissions, finance, and housing. Content is spread across Azure Blob Storage, SharePoint, and OneLake. All agents must reuse one governed, permission-aware knowledge layer that returns answers with citations.\n\nWhat should you use?","choices":["a Foundry IQ knowledge base shared by the agents","a file search tool with a separate vector store for each agent","a memory store in Foundry Agent Service shared by the agents","an Azure AI Search tool that points to a separate index for each agent"],"answer":[0],"explanation":"Een Foundry IQ knowledge base bestaat uit knowledge sources over meerdere datastores en kan door meerdere agents worden gedeeld. Agentic retrieval verwerkt de query, handhaaft gebruikersrechten en levert grounded antwoorden met citations.","rationale":["Juist: een knowledge base is herbruikbaar over agents, multi-source en permission-aware.","Per agent een vector store dupliceert content en biedt geen centraal governance- of rechtenmodel.","Een memory store bevat geleerde gebruikerscontext, geen gecureerde organisatiecontent.","Aparte indexes per agent versnipperen de kennis en vereisen eigen pipelines voor elke bron."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-foundry-iq"},{"id":"2.2.4-04","obj":"2.2.4","difficulty":"medium","type":"single","stem":"The Phone Company queries a Foundry IQ knowledge base from a support agent. Responses must contain a grounded natural-language answer with inline citations. Within that requirement, retrieval must have the lowest latency and a predictable cost per request.\n\nWhich retrieval reasoning effort should you set?","choices":["low","minimal","medium","auto"],"answer":[0],"explanation":"Answer synthesis vereist low of medium; minimal schakelt LLM-verwerking uit en ondersteunt alleen extractiveData. Low voert een enkele pass van LLM-gebaseerde query planning uit en is de goedkoopste en snelste optie die answer synthesis ondersteunt.","rationale":["Juist: low ondersteunt answer synthesis met de minste latency.","minimal is incompatibel met answer synthesis omdat het LLM-verwerking uitschakelt.","medium voegt iteratieve search toe, wat latency en kosten verhoogt.","Met auto kiest de service het niveau, waardoor de kosten per request minder voorspelbaar zijn."],"ref":"https://learn.microsoft.com/azure/search/agentic-retrieval-how-to-set-retrieval-reasoning-effort"},{"id":"2.2.4-05","obj":"2.2.4","difficulty":"medium","type":"single","stem":"Woodgrove Bank connects a Foundry IQ knowledge base to an agent in Foundry Agent Service as an MCP tool. One knowledge source contains permission-protected documents. Testing shows that every user receives every document, regardless of the permissions in the source.\n\nWhat should you do?","choices":["Pass the token of the signed-in user in the x-ms-query-source-authorization header.","Authenticate the project connection by using the managed identity of the agent.","Instruct the agent in its system prompt to filter results on a security field.","Set the retrieval reasoning effort of the knowledge base to minimal."],"answer":[0],"explanation":"Om rechten te handhaven stuur je het identity token van de ingelogde gebruiker mee in de header x-ms-query-source-authorization van de MCP tool connection. Zonder dat token geven permission-enabled sources ongefilterde resultaten terug.","rationale":["Juist: met het gebruikerstoken filtert de retrieval engine op wat die gebruiker mag zien.","De managed identity van de agent authenticeert de agent zelf en levert geen per-gebruiker filtering.","Instructies in de prompt zijn geen beveiligingsmechanisme en worden niet als query-filter uitgevoerd.","De reasoning effort beinvloedt query planning, niet de handhaving van documentrechten."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/foundry-iq-connect"},{"id"

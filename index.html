<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-500 Exam Buddy</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6573; --line: #dde1e6;
  --accent: #0b63ce; --accent-text: #ffffff; --ok: #1a7f37; --ok-bg: #e6f4ea; --bad: #c62828; --bad-bg: #fdecea;
  --code-bg: #f0f2f5; --chip: #eef2f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
    --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
    --code-bg: #0c0f13; --chip: #242a32;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
  --accent: #4c9bff; --accent-text: #0b0d10; --ok: #4cc26a; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
  --code-bg: #0c0f13; --chip: #242a32;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.muted { color: var(--muted); font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
label.opt { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; }
legend { font-weight: 600; margin-bottom: 8px; }
button, select { font: inherit; }
button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, .choice:focus-within, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
.chip.easy { color: var(--ok); } .chip.hard { color: var(--bad); }
.stem p { margin: 0 0 10px; }
pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: .85rem; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0; cursor: pointer; }
.choice input { margin-top: 4px; }
.choice.correct { border-color: var(--ok); background: var(--ok-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.why { font-size: .9rem; color: var(--muted); margin-top: 4px; }
.verdict { font-weight: 700; margin: 12px 0 4px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.bar > div { height: 100%; background: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.big { font-size: 2.2rem; font-weight: 700; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI-500 Exam Buddy</h1>
    <button class="ghost" id="theme" type="button" aria-label="Toggle light/dark theme">Theme</button>
  </header>
  <div id="app"></div>
  <p class="muted">Questions based on the official AI-500 study guide (Designing and Implementing Multi-Agent AI Solutions). Not real exam questions.</p>
</main>
<script>
const DATA = {"domains":{"1":{"title":"Architect multi-agent solutions","weight":"15-20%"},"2":{"title":"Develop multi-agent solutions in Azure","weight":"30-35%"},"3":{"title":"Evaluate, optimize, and monitor multi-agent solutions","weight":"20-25%"},"4":{"title":"Secure, govern, and deploy multi-agent solutions","weight":"20-25%"}},"objectives":{"1.1.1":"Decompose goals and objectives into workflows, agents, and tools","1.1.2":"Design workflows, including agents, subagents, control loops, and human-in-the-loop","1.1.3":"Specify agent personas, scopes, boundaries, autonomy levels, and behavioral guidelines","1.1.4":"Specify tool scopes, permission boundaries, and authentication methods","1.1.5":"Specify appropriate protocols for communication, including between multiple agents and between agents and other components","1.1.6":"Design controls and functionality to support human-AI experience (HAX) and to adhere to responsible AI principles","1.1.7":"Design short-term and long-term memory architectures, including context sharing","1.1.8":"Match task demands to model family capacities","1.2.1":"Specify integration components to coordinate agent-to-agent communication, agent-to-tool interactions, and agent-to-knowledge-source routing across a multi-agent production system","1.2.2":"Specify components for Zero Trust multi-agent solutions, including per-agent identity scoping, lateral movement prevention, and compliance control mapping for regulated deployments","1.2.3":"Specify multi-tier state persistence components that address session state, shared team state, and long-term semantic memory with lifecycle and tenant-isolation policies","1.2.4":"Specify compute components for multi-agent solutions that meet scalability, reliability, operational efficiency, security, and cost requirements","1.2.5":"Specify observability components, including cross-service trace correlation, structured logging of agent reasoning paths, and agent replay capture for reproducible debugging","1.2.6":"Specify monitoring components, including cross-agent coordination tracking, behavioral drift and quality regression detection, and automated remediation for agent failure patterns","1.2.7":"Specify developer tools and environment to support the Software Development Lifecycle (SDLC), including dev containers, Visual Studio Code extensions, command-line interface (CLI), dependency management, and AI instructions","2.1.1":"Design and implement advanced prompt engineering techniques, including examples, dynamic context injection, defensive guidelines, and prompt lifecycle management","2.1.2":"Design and implement context-aware multi-agent behaviors","2.1.3":"Design and implement a strategy for fine-tuning agents and models, including data and frequency","2.2.1":"Design and implement context management in single agents and between agents, including context accumulation, retrieval, injection, and compaction","2.2.2":"Design and implement single-agent and multi-agent memory strategies, including security, compliance, lifecycle, storage, and session management","2.2.3":"Design and implement a multi-agent RAG architecture, including chunking, embedding quality, and retrieval precision","2.2.4":"Design and implement knowledge integration for multi-agent consumption, including search, RAG, MCP-available sources, and semantic search","2.3.1":"Integrate external resources, including function calling, specified tool use, and dynamic tool use","2.3.2":"Design and build MCP servers and clients, including Azure Functions, Azure Logic Apps, and Azure API Management","2.3.3":"Design tool error-handling and fallback mechanisms","2.3.4":"Implement tool result validation and quality checks","2.4.1":"Implement multi-agent orchestration patterns, including hub-and-spoke, sequential, parallel, peer-to-peer, and orchestrator-subagent","2.4.2":"Implement human-in-the-loop processes, including approval workflows, overrides, and edge case handling","2.4.3":"Design and implement a caching strategy, including prompt caching, semantic caching, and response caching","2.4.4":"Implement scaling and control of multi-agent spawning, batching, and concurrent execution","2.4.5":"Integrate existing agents into a multi-agent solution securely by using Agent2Agent (A2A) and/or MCP","2.4.6":"Implement multi-agent orchestration frameworks, including Agent Framework, LangChain, and LangGraph","2.4.7":"Implement advanced multi-agent capabilities by using Hugging Face Transformers","2.4.8":"Design middleware for reusable capabilities across the solution, including logging, authorization, and exception handling","3.1.1":"Design and implement a human review process to evaluate solutions in Foundry","3.1.2":"Design and implement evaluations for memory, knowledge, tools, and prompts","3.2.1":"Optimize task duration, including parallelism and rate limits","3.2.2":"Diagnose context window issues, including sliding-window amnesia, summary drift, vector-only recall, and entity continuity issues","3.2.3":"Design and implement continuous improvement, including LLM-as-a-judge frameworks, synthetic data generation, semantic optimization loops, and user feedback loops","3.3.1":"Design a strategy for monitoring reliability, including agent health, workflow failures, trace correlation, drift detection, quality regression, and remediation","3.3.2":"Design a strategy for monitoring solution and platform availability, performance, reliability, and service-level agreement adherence","3.3.3":"Design and implement a strategy for optimizing token usage, including token limits, loop controls, and tool calls","3.3.4":"Design a strategy for monitoring and managing cost, including usage, quotas, allocations, and chargebacks","3.3.5":"Implement tracing in Foundry, including tokens, prompts, correlation IDs, alerting, and execution tracking","4.1.1":"Specify and implement resource access, including identity-based access, network boundaries, access control policies, and role-based access control (RBAC)","4.1.2":"Design and implement authentication flows in a multi-agent solution, including user impersonation, on-behalf-of, API keys, and OAuth 2.0","4.1.3":"Design the secrets management and retrieval approach for multi-agent solutions by using Azure Key Vault, including secrets, certificates, key rotation, role-based access to secrets, and encryption","4.1.4":"Implement shift-left security principles, including the AI Red Teaming Agent in Foundry","4.2.1":"Design and implement a multi-intervention guardrail strategy covering user inputs, tool calls, tool responses, and outputs","4.2.2":"Design and implement custom guardrails for domain-specific constraints","4.2.3":"Design guardrail testing and validation, including using synthetic data","4.3.1":"Choose a release methodology, including Development-Test-Acceptance-Production (DTAP), blue/green, and canary","4.3.2":"Design and implement multi-environment release strategies, including rollback strategies, release management, and rollout","4.3.3":"Design and implement a strategy for testing, including unit tests, regression tests, integration tests, and automated evaluations","4.3.4":"Specify continuous integration and continuous deployment (CI/CD) requirements for integration and release, including infrastructure-as-code deployments and testing"},"questions":[{"id":"1.1.1-01","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Fourth Coffee needs to translate short product descriptions from English to French. Each description is processed in one pass. The task needs no tools, no external data, and no multi-step reasoning. You need to use the lowest level of architectural complexity that reliably meets the requirement.\n\nWhich approach should you use?","choices":["a magentic orchestration with a manager agent","a direct model call with a well-crafted prompt","a single agent with tools and iteration limits","a sequential orchestration of specialized agents"],"answer":[1],"explanation":"Translation in a single step without tools falls in the lowest complexity level: a direct model call. The Azure Architecture Center guidance says that if prompt engineering solves the problem, you do not need an agent.","rationale":["Magentic orchestration is for open-ended problems without a known plan up front; here it only adds overhead.","Correct: a single model call with a good prompt is sufficient for one-step tasks such as translation.","An agent with tools is intended for varying questions that require dynamic tool use; no tools are needed here.","Sequential orchestration is for multi-stage pipelines with dependencies; this task has only one step."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"1.1.1-02","obj":"1.1.1","difficulty":"easy","type":"single","stem":"Adventure Works Cycles decomposes its expense-reimbursement process into a Microsoft Agent Framework workflow. One step calculates the reimbursement amount by applying a fixed policy table to the submitted expense lines. The result must be exact and identical for the same input.\n\nWhich type of workflow step should you use for the calculation?","choices":["an agent executor that reasons over the policy table","a deterministic executor that runs regular business logic","a human-in-the-loop gate that asks a reviewer for the amount","a subagent that the calculation agent calls as a function tool"],"answer":[1],"explanation":"For each step in a workflow you choose how much intelligence to apply: the model, code, or a human. A fixed calculation with an exactly reproducible outcome belongs in a deterministic executor with ordinary business logic.","rationale":["An agent executor is for steps that benefit from LLM reasoning; it is not deterministic.","Correct: code determines the outcome, so a deterministic executor gives an exact and repeatable result.","A human-in-the-loop gate is for decisions that a human must make, not for a fixed calculation.","An agent as a tool still lets a model determine the outcome; that is not deterministic."],"ref":"https://learn.microsoft.com/agent-framework/journey/workflows"},{"id":"1.1.1-03","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank is designing an agent solution for payment processing. Regulations require that one component prepares transactions and a separate component validates them. Data in two different security classifications must be processed in isolated environments. The architects consider a single agent that switches personas between preparer and validator.\n\nWhich architecture should you recommend?","choices":["a single agent that uses persona switching and context gating","a comparative prototype of single-agent and multi-agent designs","a multi-agent design with isolated agents that have scoped access","a single agent with every tool attached and strict iteration limits"],"answer":[2],"explanation":"The Cloud Adoption Framework says to start directly with a multi-agent architecture if the use case crosses security and compliance boundaries. Separation of duties (prepare versus validate) and data isolation require isolated agents with limited access; prototyping is then not needed.","rationale":["Persona switching emulates roles, but cannot provide enforced data isolation or separation of duties.","A comparative prototype is for situations where the choice is unclear; here the requirements enforce the separation.","Correct: hard compliance boundaries call for isolated agents with their own scope and explicit interface contracts.","A single agent with all tools violates least privilege and provides no isolation between classifications."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/single-agent-multiple-agents"},{"id":"1.1.1-04","obj":"1.1.1","difficulty":"medium","type":"single","stem":"Lucerne Publishing wants an editorial assistant that plans, reviews, and edits articles. The domain is narrow, the solution must reach users quickly, and costs must stay low. A developer proposes three separate agents because the solution has three roles. You need to decide on the architecture by following Microsoft guidance.\n\nWhich sequence of actions should you perform?","choices":["Build a single-agent prototype that uses persona prompts -> Move to multi-agent for each distinct role -> Measure against defined success metrics -> Tune the prompts of each agent","Define the orchestration pattern for three agents -> Build a single-agent prototype -> Compare both designs in production -> Remove the design that costs more","Build a single-agent prototype that uses persona prompts -> Measure it against defined success metrics -> Try to fix gaps by improving prompts, retrieval, and policies -> Move to multi-agent only if limitations remain","Build three agents in a group chat -> Measure them against defined success metrics -> Merge agents that overlap -> Move to a single agent if costs are too high"],"answer":[2],"explanation":"Clear roles do not automatically justify multiple agents. Start with a single-agent prototype (persona prompts, tool permissioning, context gating), measure against success criteria, first try to fix shortcomings with prompts, retrieval, or policies, and move to multi-agent only if limitations persist.","rationale":["Jumps to multi-agent purely based on roles, without first measuring whether a single agent is sufficient.","Designs the multi-agent orchestration first and only compares in production; that slows time-to-market.","Correct: this follows the CAF approach of testing a single agent first and switching only when limitations are demonstrated.","Starts with the most expensive and most complex option, while speed and low cost actually favor a single agent."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/single-agent-multiple-agents"},{"id":"1.1.1-05","obj":"1.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys has a customer-service agent that grew to 40 tools across returns, billing, and shipping. Tool selection accuracy has degraded, and the instructions now cover too many roles. The general assistant must keep deciding when and whether to involve a specialist, based on the conversation. You do not need explicit control over the execution order between agents.\n\nWhat should you do?","choices":["Keep one agent and raise the iteration limit of its tool-calling loop.","Split the tools across specialist agents and expose each specialist to the outer agent as a function tool.","Split the tools across specialist agents and run the specialists in a sequential orchestration.","Split the tools across specialist agents and run them in a concurrent orchestration that aggregates results."],"answer":[1],"explanation":"With many tools and broad instructions, tool selection and focus degrade. Agents as tools solve this: each inner agent has a narrow scope with its own tools, and the outer agent decides in a model-driven way when to delegate. Because no explicit order is needed, this fits better than a workflow.","rationale":["A higher iteration limit does not solve the degradation of tool selection caused by 40 tools.","Correct: agents as tools give each specialist a narrow scope and let the outer agent decide for itself when to delegate.","A sequential orchestration fixes a set order and calls every specialist, even when that is not needed.","Concurrent orchestration sends every question to all specialists at the same time; that is not conversation-driven delegation."],"ref":"https://learn.microsoft.com/agent-framework/journey/agents-as-tools"},{"id":"1.1.1-06","obj":"1.1.1","difficulty":"hard","type":"multi","stem":"Relecloud decomposes its invoice-to-payment process. The steps are known in advance. One step sends a payment, and that side effect must not repeat when a later step fails and is retried. Compliance requires a reviewable control flow. Another step extracts fields from invoices that have widely varying layouts.\n\nWhich two design decisions should you make? Each correct answer presents part of the solution.","choices":["Use a human-in-the-loop gate to extract the fields from each invoice.","Implement the overall process as a workflow that uses checkpointing.","Use an agent executor for the invoice field extraction step.","Implement the payment step as an agent loop in which the model decides when the task is complete.","Package the full process as an Agent Skill that runs within a single agent turn."],"answer":[1,2],"explanation":"A workflow provides a predefined, controllable path and supports checkpointing, so steps with side effects (such as payments) are not executed again. Variable input layouts are exactly a step where LLM reasoning adds value, so there you use an agent executor.","rationale":["A human step for every invoice is not needed and undermines the automation; HITL is for decisions, not for extraction.","Correct: workflows provide an explicit path and resume from the last successful step, so the payment is not repeated.","Correct: extraction from varying layouts benefits from model reasoning within an otherwise deterministic workflow.","An agent loop lets the model determine the control flow; that conflicts with the requirement for a controllable path.","A skill runs within an agent turn; on a failure everything must be redone, including the payment."],"ref":"https://learn.microsoft.com/agent-framework/agents/skills"},{"id":"1.1.2-01","obj":"1.1.2","difficulty":"easy","type":"single","stem":"Graphic Design Institute wants one agent to write course descriptions and a second agent to evaluate each description against defined acceptance criteria. If the evaluating agent finds gaps, it returns specific feedback, and the first agent revises the description. The cycle repeats until the description is approved or an iteration limit is reached.\n\nWhich pattern should you use?","choices":["a concurrent orchestration","a handoff orchestration","a magentic orchestration","a maker-checker loop"],"answer":[3],"explanation":"A maker-checker loop (also evaluator-optimizer or reflection loop) lets the maker produce something and the checker assess it against criteria, with feedback going back to the maker until approval or an iteration limit.","rationale":["In concurrent orchestration agents work independently and in parallel; there is no feedback loop.","In handoff an agent transfers full control; there is no assess-and-send-back cycle.","Magentic is for open-ended problems where a manager builds a task list; that is too heavy for this loop.","Correct: this is exactly the maker-checker control loop with acceptance criteria and an iteration limit."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"1.1.2-02","obj":"1.1.2","difficulty":"easy","type":"single","stem":"Nod Publishers builds a group chat workflow in Python by using GroupChatBuilder in Microsoft Agent Framework. A writer agent and a reviewer agent take turns improving a press release. The number of rounds that is needed varies per request. The conversation must end as soon as the reviewer approves the text, and it must never run more than 10 rounds.\n\nWhat should you do?","choices":["Pass a termination_condition function that returns True when the reviewer approves the text or when 10 rounds are reached.","Pass a termination_condition function that returns True after two assistant messages so that each agent speaks once.","Build a sequential workflow in which the writer agent runs first and the reviewer agent runs second, once per request.","Build a concurrent workflow in which the writer agent and the reviewer agent run in parallel and the results are merged."],"answer":[0],"explanation":"In a group chat the orchestrator controls the flow, and the termination_condition passed to GroupChatBuilder decides when the conversation ends. A function that checks the reviewer's last message for approval and also caps the conversation at 10 rounds ends the loop early on approval while keeping a hard upper limit.","rationale":["Correct: a custom termination condition on approval plus a round cap as a safety net.","Wrong: a fixed number of two turns does not fit a varying number of rounds and ignores the approval.","Wrong: a sequential workflow runs through the agents once and does not support repeated improvement rounds.","Wrong: parallel agents do not build on each other's output, so no review loop arises."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/group-chat?pivots=programming-language-python"},{"id":"1.1.2-03","obj":"1.1.2","difficulty":"medium","type":"single","stem":"Nod Publishers runs a maker-checker loop in which a checker agent reviews marketing copy. Some runs never finish because the checker keeps rejecting the copy. The solution must still return a result for every run, and humans must stay involved when quality is uncertain.\n\nWhat should you do?","choices":["Replace the loop with a concurrent orchestration and select the majority result.","Set an iteration cap with a fallback that escalates to a human reviewer.","Remove the checker agent and return the first draft from the maker agent.","Add a third agent to the loop that decides when the checker is too strict."],"answer":[1],"explanation":"For maker-checker loops, Microsoft recommends an iteration limit to prevent endless refinement, plus a defined fallback when that limit is reached, such as escalation to a human reviewer.","rationale":["Concurrent orchestration has no iterative improvement; it replaces the feedback loop instead of bounding it.","Correct: an iteration limit guarantees an outcome and the fallback to a human safeguards quality.","Without a checker, the quality control disappears entirely.","An extra agent increases the chance of loops; Microsoft recommends limiting group chat to three or fewer agents."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"1.1.2-04","obj":"1.1.2","difficulty":"medium","type":"single","stem":"Contoso Suites builds a refund workflow by using Microsoft Agent Framework in Python. A developer writes the following code.\n\n```python\n@tool(approval_mode=\"always_require\")\ndef issue_refund(order_id: str, amount: float) -> str:\n    return f\"Refund issued for {order_id}\"\n\nrefund_agent = Agent(\n    client=chat_client,\n    name=\"RefundAgent\",\n    instructions=\"You process approved refund requests.\",\n    tools=[issue_refund],\n)\n\nworkflow = SequentialBuilder(participants=[refund_agent]).build()\n```\n\nWhat should you expect when RefundAgent tries to call issue_refund?","choices":["The workflow pauses and emits a request_info event that contains a function approval request.","The tool runs, and the workflow logs the call for later review.","The workflow pauses after each agent response and waits for free-form feedback.","The workflow raises an error because tool approval requires extra builder configuration."],"answer":[0],"explanation":"With approval_mode=\"always_require\", the sequential workflow pauses and emits a request_info event with a function approval request as soon as the agent wants to call the tool. This works with SequentialBuilder without additional builder configuration.","rationale":["Correct: tool approval is a HITL gate at tool level; the workflow waits for approval for this specific call.","The tool is specifically not executed before a human approves.","Pausing after every agent response is the behavior of with_request_info, not of tool approval.","Tool approval works with SequentialBuilder without additional builder configuration."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/sequential"},{"id":"1.1.2-05","obj":"1.1.2","difficulty":"hard","type":"single","stem":"Coho Vineyard runs a long-running Microsoft Agent Framework workflow. A mandatory human approval gate can wait several hours for a response. During that time, the hosting process is often restarted for new code deployments. After a restart, the workflow must continue without replaying the agent work that was completed before the gate.\n\nWhat should you do?","choices":["Increase the timeout of the request port so that the workflow keeps waiting in memory.","Store the conversation history in an in-memory agent session and resend it after the restart.","Restart the workflow from the first executor and reuse cached model responses.","Enable checkpointing so that pending requests are saved and re-emitted when the workflow is restored."],"answer":[3],"explanation":"Mandatory HITL gates make the orchestration synchronous at that point; Microsoft recommends persisting state there. Checkpoints in Agent Framework also store pending requests and re-emit them after recovery, so you can respond without repeating earlier work.","rationale":["A longer timeout does not help; a restart still wipes the in-memory state.","An in-memory session does not survive a process restart and contains no workflow state.","Starting over repeats the earlier agent work, which the requirement explicitly excludes.","Correct: checkpoints contain executor state, messages, and pending requests, and resume after a restart."],"ref":"https://learn.microsoft.com/agent-framework/workflows/human-in-the-loop"},{"id":"1.1.2-06","obj":"1.1.2","difficulty":"hard","type":"multi","stem":"Fabrikam, Inc. automates low-risk incident response. Each incident is open-ended, and the remediation steps are not known in advance. Agents have tools that change running systems. The site reliability engineering team must review the plan before agents act, and the automation must not run endless remediation cycles.\n\nWhich three design decisions should you make? Each correct answer presents part of the solution.","choices":["Present the documented plan to a human for approval before the agents follow the tasks.","Configure the manager agent to detect stalls and to limit remediation iterations.","Use a sequential orchestration that invokes the agents in a fixed order.","Use a group chat orchestration in which the agents stay in read-only mode.","Use a magentic orchestration in which a manager agent maintains a task ledger."],"answer":[0,1,4],"explanation":"Magentic orchestration fits open-ended problems without a known solution path up front, where a manager builds a task list (ledger). The documented plan can be presented to a human beforehand, and the manager must watch for stalls and endless loops.","rationale":["Correct: magentic produces a plan that a human can review before agents make changes.","Correct: monitoring for stalls and bounding iterations prevents infinite remediation loops.","A fixed order does not fit a problem whose steps are unknown up front.","In group chat agents typically work read-only; here the agents actually need to change systems.","Correct: the manager dynamically builds and refines a task ledger for open-ended problems."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"1.1.3-01","obj":"1.1.3","difficulty":"easy","type":"single","stem":"Northwind Traders standardizes the structure of agent instructions. One section of an instruction set contains the following text: \"Do not access payroll systems. Focus on customer support questions.\"\n\nWhich instruction component should you classify this text as?","choices":["identity and tone","scope and boundaries","tool mandates","citation rules"],"answer":[1],"explanation":"The Cloud Adoption Framework distinguishes identity and tone, scope and boundaries, tool mandates, and citation rules. Text that defines what the agent must do and must avoid falls under scope and boundaries.","rationale":["Identity and tone describes how the agent presents itself, not what falls outside its domain.","Correct: this defines what the agent must achieve and avoid.","Tool mandates describe required tool use, such as always using a Knowledge Search tool.","Citation rules concern source attribution and transparency."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/build-secure-process"},{"id":"1.1.3-02","obj":"1.1.3","difficulty":"easy","type":"single","stem":"Proseware, Inc. deploys an autonomous agent that triages incoming events. The agent performs well in a sandbox, and the business wants it to take on more responsibilities over time.\n\nWhat should you do?","choices":["Expand the responsibilities of the agent in small increments as it proves reliable.","Grant the agent full autonomy at launch and review its logs monthly.","Grant write access to every connected system so that tasks do not fail.","Remove human approvals from critical actions after the sandbox tests pass."],"answer":[0],"explanation":"Microsoft recommends treating an autonomous agent as an evolving project: expand capabilities gradually as the agent proves reliable. Small incremental expansions are safer than a lot of autonomy at once.","rationale":["Correct: incrementally expanding autonomy based on proven reliability is the recommended approach.","Full autonomy at launch is exactly what the guidance advises against.","This violates least privilege and increases the damage in case of errors or misuse.","For high-stakes actions human oversight remains necessary, even after successful tests."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/autonomous-agents"},{"id":"1.1.3-03","obj":"1.1.3","difficulty":"medium","type":"single","stem":"Alpine Ski House reviews the persona of its booking agent. Current responses include phrases such as \"I understand how you feel\" and \"I think this is the best trip for you.\" You need the persona to follow the Microsoft principle that agents are differentiated from humans, while keeping a helpful tone.\n\nWhat should you change in the persona guidelines?","choices":["Give the agent a human first name and a short biography to build rapport.","Instruct the agent to mirror the emotional tone of the user in each response.","Describe the agent as a virtual employee of the reservations team.","Replace words such as think and feel with words such as process and analyze."],"answer":[3],"explanation":"The principle differentiated from humans says: agents generate responses, they do not think or feel. Use neutral, task-oriented language and avoid words such as understand, think, and feel; use process or analyze.","rationale":["A human name and biography actually reinforce the suggestion that the agent is a human.","Mirroring emotions is emotional, human framing that the guidance advises against.","Presenting an agent as an employee blurs the distinction between human and agent.","Correct: neutral, technology-oriented language keeps the persona transparent about the nature of the agent."],"ref":"https://learn.microsoft.com/agents/design-guidelines/human-centered-design"},{"id":"1.1.3-04","obj":"1.1.3","difficulty":"medium","type":"single","stem":"Margie's Travel has a booking agent that answers questions about visas, which are outside its intended domain. When its knowledge source has no answer, the agent invents one. You need the agent to respond with a defined message for topics outside its domain and to state that it does not know when information is missing.\n\nWhich combination of instruction components should you add?","choices":["citations and sources and link safety","clarifying questions and privacy and sensitive data","out-of-scope handling and fallback when uncertain","persona and tone and formatting guidelines"],"answer":[2],"explanation":"The Agent Review Tool criteria (based on Microsoft guidance) include out-of-scope handling (what to say for questions outside the scope) and fallback when uncertain (what to do when information is missing). These two cover both requirements exactly.","rationale":["Citations and link safety improve transparency, but do not prevent the agent from answering outside its domain.","Clarifying questions help with ambiguous questions; privacy concerns personal data, not scope.","Correct: these two components handle declining off-topic questions and honestly saying that the answer is missing.","Persona and formatting determine tone and form, not behavior outside the scope or under uncertainty."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/kit-agent-review-tool"},{"id":"1.1.3-05","obj":"1.1.3","difficulty":"hard","type":"multi","stem":"Wide World Importers deploys an autonomous agent that reacts to incoming email messages and updates purchase orders. An attacker could send email that imitates a supplier. The agent needs to read the inventory database and to write purchase orders. Purchase orders above a defined value must be confirmed by a person.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Grant read access to the inventory database and write access to the purchase orders.","Require human approval before the agent submits purchase orders above the value threshold.","Let the agent decide from its instructions which purchase orders need human approval.","Rely on agent instructions to prevent the agent from writing to the inventory database.","Validate the authenticity of the triggering email messages before the agent acts."],"answer":[0,1,4],"explanation":"For autonomous agents, Microsoft recommends: validate the authenticity of triggers, apply least privilege (read where only read is needed), and keep a human in the loop for high-stakes actions. Boundaries must be enforced, not only set through instructions.","rationale":["Correct: least privilege limits the damage if the agent fails or is misused.","Correct: an explicit approval gate above the threshold ensures human control over critical actions.","Letting the agent itself decide when approval is needed makes the boundary probabilistic instead of enforced.","Instructions alone are not a permission boundary; with write permissions the agent could still write.","Correct: trigger validation prevents an attacker from starting actions through spoofed email."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/autonomous-agents"},{"id":"1.1.3-06","obj":"1.1.3","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company runs a multi-agent system. The compliance team needs one authoritative reference that maps each agent role to a business objective, prevents functional overlap between agents, and lists prohibited actions. Agent instructions must have an audit trail of changes and must be checked against safety guidelines before deployment.\n\nWhat should you do?","choices":["Create an agent charter, store the agent instructions in source control, and run automated validation before deployment.","Write the boundaries in the instructions of each agent in the Foundry portal and edit them in place.","Document the boundaries in a team wiki and let each team update its agent instructions directly.","Define the boundaries in content filters on the model deployments that the agents use."],"answer":[0],"explanation":"An agent charter defines system responsibilities, non-overlapping roles, and prohibited actions. You treat instructions as configuration code: store them in source control for an audit trail and automatically validate them against safety guidelines before deployment.","rationale":["Correct: charter plus version control plus automatic validation covers all requirements.","In-place editing in the portal provides no central reference and no controlled audit trail with validation.","A wiki with direct changes lacks version control and validation before deployment.","Content filters block harmful content, but do not describe roles, scope, or prohibited actions per agent."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/build-secure-process"},{"id":"1.1.4-01","obj":"1.1.4","difficulty":"easy","type":"single","stem":"Trey Research connects a Foundry Agent Service agent to a remote Model Context Protocol (MCP) server. Each user must access the underlying service with their own account so that the permissions of that user apply to every tool call.\n\nWhich authentication method should you use?","choices":["key-based authentication","Microsoft Entra agent identity","Microsoft Entra project managed identity","OAuth identity passthrough"],"answer":[3],"explanation":"OAuth identity passthrough lets each user sign in and give consent, after which the agent calls tools with that user's credentials. It is the only method in the list where the user context is preserved.","rationale":["Key-based authentication uses a shared credential; the user context is not preserved.","The agent identity is a shared identity for all users of the agent.","The project managed identity is also shared and does not retain user context.","Correct: OAuth identity passthrough preserves the identity and permissions of each individual user."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"1.1.4-02","obj":"1.1.4","difficulty":"easy","type":"single","stem":"A. Datum Corporation connects an agent to a GitHub MCP server that exposes many tools. The agent must be able to use a defined subset of those tools and no others.\n\nWhich MCP tool property should you configure?","choices":["server_label","project_connection_id","allowed_tools","require_approval"],"answer":[2],"explanation":"With allowed_tools you provide an allow list of tools that the agent may use; without this value all tools of the MCP server are available. Microsoft names an allow list via allowed_tools as a best practice.","rationale":["server_label is only a unique identifier of the server for the agent.","project_connection_id refers to the stored authentication and connection details.","Correct: allowed_tools restricts the agent's tool scope to the specified tools.","require_approval determines whether a call needs approval, not which tools are available."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"1.1.4-03","obj":"1.1.4","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a Foundry agent that calls an MCP server backed by Azure Storage. All users of the agent can share one identity. The security team does not want to manage secrets, and it requires that this agent be audited separately from the other agents in the same project.\n\nWhich authentication method should you use?","choices":["key-based authentication stored in a project connection","Microsoft Entra project managed identity","a Microsoft Entra agent identity that is distinct to this agent","OAuth identity passthrough"],"answer":[2],"explanation":"Microsoft Entra authentication avoids secret management, and separate auditing requires the agent to use its own (distinct) agent identity instead of a shared identity. In the new agent object model each new agent receives that identity at creation; in the legacy Agent Application model only at publication. Assign the required roles to that agent identity.","rationale":["Key-based requires managing and rotating shared secrets, which the team does not want.","The project managed identity only authenticates the blueprint, is shared by the project, and offers no separate auditing per agent.","Correct: a dedicated agent identity avoids secrets and gives a separate audit trail, regardless of the identity model.","OAuth passthrough is for per-user access; here a shared identity is sufficient."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-identity"},{"id":"1.1.4-04","obj":"1.1.4","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. adds a workspace-private Microsoft Fabric data agent endpoint as a tool in a Foundry toolbox that several agents use. Each employee must see only the Fabric data that the employee is permitted to see. The endpoint accepts only an audience-specific Microsoft Entra access token that represents the signed-in user. Employees must not be sent through a separate OAuth authorization flow that uses its own app registration.\n\nWhich authType should you set on the project connection for the tool?","choices":["user-entra-token","oauth2","agentic-identity","project-managed-identity"],"answer":[0],"explanation":"For a toolbox, authentication is a property of the project connection. With user-entra-token, Foundry gives the downstream service an audience-specific Microsoft Entra token that represents the signed-in user, intended for managed Microsoft services such as workspace-private Fabric data agent endpoints. This preserves per-user access without a separate OAuth authorization flow.","rationale":["Correct: user-entra-token passes an audience-specific Entra token of the signed-in user, so Fabric enforces the permissions of each employee.","Incorrect: oauth2 is also per user, but has the user go through an OAuth authorization flow with a custom OAuth app, which is not allowed here.","Incorrect: agentic-identity uses the identity of the agent itself and deliberately rejects a user token, so the per-employee permissions are lost.","Incorrect: project-managed-identity is a shared service identity without user context."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/tool-authentication"},{"id":"1.1.4-05","obj":"1.1.4","difficulty":"hard","type":"single","stem":"Wingtip Toys configures an MCP tool for a Foundry agent as shown in the following definition.\n\n```json\n{\n  \"type\": \"mcp\",\n  \"server_label\": \"erp\",\n  \"server_url\": \"https://erp.example.com/mcp\",\n  \"allowed_tools\": [\"get_order\", \"update_order\"],\n  \"require_approval\": ___\n}\n```\n\nThe get_order tool is read-only and must run without approval. The update_order tool changes data, and each call must be approved. You need to minimize approval prompts.\n\nWhich value should you use for require_approval?","choices":["\"always\"","\"never\"","{\"never\": [\"get_order\"]}","{\"always\": [\"get_order\"]}"],"answer":[2],"explanation":"With {\"never\": [...]} you specify the tools that do not need approval; the other allowed tools require approval. This way get_order runs without a prompt and update_order requires approval, in line with the advice to require approval for write tools.","rationale":["always asks for approval for every call, including get_order, which causes unnecessary prompts.","never disables approval entirely, including for the write tool update_order.","Correct: get_order is exempt, update_order still requires approval.","This requires approval for the read-only tool and not for the write tool."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"1.1.4-06","obj":"1.1.4","difficulty":"hard","type":"multi","stem":"Contoso Pharmaceuticals connects a Foundry agent to a custom MCP server that is protected by Microsoft Entra ID. The agent must call the server on behalf of each signed-in user. The users only consume the agent and do not build agents. When the team configures managed OAuth with a Microsoft audience, tool calls fail with the error \"Cannot pass Microsoft token to untrusted MCP endpoint.\"\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Configure custom OAuth with your own Microsoft Entra app registration that uses an audience you control.","Assign the users the Foundry Agent Consumer role on the project.","Assign the users the Foundry Owner role on the project.","Switch to key-based authentication that uses a shared personal access token.","Keep managed OAuth and change the audience to Microsoft Graph."],"answer":[0,1],"explanation":"Agent Service blocks tokens with a known Microsoft audience to custom MCP servers. The solution is custom OAuth with its own app registration and its own audience. For OAuth identity passthrough, users need at least the Foundry Agent Consumer role; that is the least-privilege choice.","rationale":["Correct: a custom app registration with its own audience solves the blocked token passthrough.","Correct: Foundry Agent Consumer is the least-privilege role for users who only use the agent.","Foundry Owner grants far too many permissions for end users.","A shared PAT loses the user context, while the agent must act on behalf of each user.","Microsoft Graph is also a known Microsoft audience; that token is blocked as well."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/mcp-authentication"},{"id":"1.1.5-01","obj":"1.1.5","difficulty":"easy","type":"single","stem":"Blue Yonder Airlines needs its agent to request baggage-claim decisions from an agent that a partner company builds and hosts on a different platform. The partner agent uses its own reasoning and tools, which must stay opaque to Blue Yonder Airlines.\n\nWhich protocol should you use?","choices":["OpenAPI over HTTP","Agent2Agent (A2A)","Model Context Protocol (MCP)","Activity Protocol"],"answer":[1],"explanation":"A2A fits when agents are or must be opaque to each other, for example agents from different organizations. The called agent uses its own orchestration; tools and APIs remain invisible to the requester.","rationale":["An OpenAPI call is an API call, not agent-to-agent task delegation with multi-turn context.","Correct: A2A is intended for cross-platform collaboration between opaque agents.","With MCP the host orchestrates which tools are called; that is less suitable for an opaque external agent.","Activity Protocol is for integration with agents built with the Microsoft 365 Agents SDK."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-patterns"},{"id":"1.1.5-02","obj":"1.1.5","difficulty":"easy","type":"single","stem":"VanArsdel, Ltd. wants its agents to read data from and perform actions in an internal inventory system. A single orchestrating agent must keep control over which operations to invoke, how to filter the results, and how to synthesize the final answer. The access must support enterprise authentication and auditing.\n\nWhich protocol should you use?","choices":["Agent2Agent (A2A)","Model Context Protocol (MCP)","Activity Protocol","a custom HTTP connector"],"answer":[1],"explanation":"MCP is the recommended way to expose data and actions to agents with enterprise-grade security, authentication, and auditing. It gives a single orchestrator strong control to select, call, filter, and synthesize.","rationale":["A2A is for opaque agents with their own reasoning, not for direct tool and data access under the control of the orchestrator.","Correct: MCP standardizes access to tools and data and lets the host stay in control.","Activity Protocol is for Microsoft 365 Agents SDK agents, not for tool access.","A custom HTTP connector is not a standardized protocol for tool discovery and invocation by agents."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-patterns"},{"id":"1.1.5-03","obj":"1.1.5","difficulty":"medium","type":"single","stem":"Humongous Insurance has a Copilot Studio agent. The agent must orchestrate with three other components: an agent built by using the Microsoft 365 Agents SDK, an external agent that implements the A2A protocol, and a set of MCP tools. You need the correct integration approach for the Microsoft 365 Agents SDK agent.\n\nWhich integration approach should you use for that agent?","choices":["an A2A connection","an MCP server","a custom connector","Activity Protocol"],"answer":[3],"explanation":"Copilot Studio recommends per integration need: custom connectors for APIs, MCP servers for MCP tools, A2A for agents that implement the A2A protocol, and the Activity Protocol for agents built with the Microsoft 365 Agents SDK.","rationale":["An A2A connection is for the external agent that implements the A2A protocol.","An MCP server is for MCP tools and resources.","Custom connectors are for ordinary APIs or HTTP services.","Correct: you integrate agents on the Microsoft 365 Agents SDK through the Activity Protocol."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/add-agent-agent-to-agent"},{"id":"1.1.5-04","obj":"1.1.5","difficulty":"medium","type":"single","stem":"Northwind Traders hosts an A2A-compatible agent outside Foundry Agent Service. The company registers the agent in Foundry Control Plane and selects A2A as the protocol so that other agents can discover its capabilities through the generated proxy URL.\n\nWhich artifact should the agent publish so that Foundry can discover its capabilities?","choices":["an MCP tools/list response at /runtime/webhooks/mcp","a toolbox version that is promoted to default","an agent card at /.well-known/agent-card.json","an OpenAPI specification at /openapi.json"],"answer":[2],"explanation":"When registering a custom A2A agent in Foundry Control Plane, Foundry discovers the agent card at /.well-known/agent-card.json. An agent card describes the capabilities of the agent according to the A2A protocol.","rationale":["tools/list is an MCP mechanism; the endpoint /runtime/webhooks/mcp belongs to MCP on Azure Functions.","A toolbox groups tools behind an MCP endpoint; that is not A2A discovery.","Correct: the agent card is the A2A artifact for capability discovery.","An OpenAPI specification belongs to the OpenAPI tool, not to A2A discovery."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/agent-to-agent"},{"id":"1.1.5-05","obj":"1.1.5","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. exposes a Foundry prompt agent as an A2A endpoint. A partner integrates by using an A2A client that uses the HTTP+JSON transport. The client sends no A2A-Version header and no a2a-version query string. Requests succeed, but a compliance review finds that the integration runs on a preview protocol version. The integration must run on the generally available A2A protocol version.\n\nWhat should the partner do?","choices":["Switch the client to JSONRPC and resolve the agent card from agentCard/v1.0.","Keep HTTP+JSON and add the A2A-Version: 1.0 header to every request.","Keep HTTP+JSON and resolve the agent card from /.well-known/agent-card.json.","Switch the client to gRPC and append ?a2a-version=1.0 to every request."],"answer":[0],"explanation":"Without a version selector, Foundry serves preview A2A v0.3 by default. Version 1.0 (GA) supports only JSONRPC on the incoming endpoint, so the client must select JSONRPC and v1.0, for example by fetching the agent card from agentCard/v1.0 so that the SDK negotiates v1.0.","rationale":["Correct: JSONRPC is the only transport for v1.0, and the v1.0 agent card makes the SDK use v1.0 automatically.","Incorrect: the header selects v1.0, but v1.0 does not support HTTP+JSON.","Incorrect: Foundry publishes the agent cards at version-specific paths; this does not select v1.0 and HTTP+JSON stays on v0.3.","Incorrect: gRPC is not supported by the incoming A2A endpoint of Foundry."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/enable-agent-to-agent-endpoint"},{"id":"1.1.5-06","obj":"1.1.5","difficulty":"hard","type":"multi","stem":"Litware, Inc. designs communication for a multi-agent solution. Internal subagents run on the same platform as the orchestrator. Agents need authenticated access to tools and data, including Microsoft 365 service tools. A partner agent runs on a different runtime and processes long-running tasks that the orchestrator must track.\n\nWhich three design decisions should you make? Each correct answer presents part of the solution.","choices":["Use A2A with agent cards and the task model for the partner agent.","Use A2A for each internal subagent call to standardize communication.","Use a custom HTTP connector for the long-running tasks of the partner agent.","Use platform-native orchestration for the internal subagent flows.","Use MCP for tool and data access."],"answer":[0,3,4],"explanation":"Microsoft recommends: platform-native orchestration for internal flows with subagents to keep it simple, MCP for tool and data access (including Microsoft 365 tools), and A2A for cross-platform agents with agent cards and the task and artifact model to track long-running tasks.","rationale":["Correct: agent cards and the A2A task model support discovery and tracking of long-running tasks across runtimes.","A2A for internal subagents adds unnecessary complexity; platform-native orchestration is preferred.","An HTTP connector does not support multi-turn interactions and rich contextual metadata like A2A.","Correct: platform-native orchestration keeps internal subagent flows simple.","Correct: MCP is the recommended way for secure, audited tool and data access."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-patterns"},{"id":"1.1.6-01","obj":"1.1.6","difficulty":"easy","type":"single","stem":"First Up Consultants launches a research agent. Research shows that new users trust every answer, although the agent sometimes makes mistakes. You need to apply a Human-AI eXperience (HAX) guideline to the first-run experience to address this behavior.\n\nWhich guideline should you apply?","choices":["Encourage granular feedback during regular interaction.","Provide global controls over what the system monitors.","Make clear what the system can do.","Make clear how well the system can do what it can do."],"answer":[3],"explanation":"HAX G2 helps users understand how often the system can make mistakes. This belongs in the first-run experience and reduces overreliance on AI output.","rationale":["Granular feedback belongs to use over a longer period, not to setting expectations.","Global controls let users adjust behavior over time; they do not address overreliance.","Make clear what the system can do shows the capabilities in the first-run experience, but does not say how often the system makes mistakes.","Correct: setting expectations about the quality of the output reduces overreliance at the first interaction."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/copilot/isv/ux-guidance"},{"id":"1.1.6-02","obj":"1.1.6","difficulty":"easy","type":"single","stem":"Southridge Video exposes a customer-facing support agent on its public website. Legal counsel requires that people know they are interacting with an AI system and not with a human employee.\n\nWhich mitigation should you implement?","choices":["Limit the length of inputs and outputs.","Highlight potential inaccuracies in outputs.","Disclose the role of AI in the interaction.","Cite references and information sources."],"answer":[2],"explanation":"Making people aware that they are talking to an AI system is an explicit mitigation in the responsible AI guidance for Azure OpenAI models, and for externally facing agents a baseline expectation for transparency.","rationale":["Length limits reduce misuse, but do not make the role of AI clear.","Flagging inaccuracies concerns reliability, not the identity of the conversation partner.","Correct: AI disclosure lets users know that they are talking to an AI and not to a human.","Source attribution explains where content comes from, but does not say that the conversation partner is an AI."],"ref":"https://learn.microsoft.com/azure/foundry/responsible-ai/openai/overview"},{"id":"1.1.6-03","obj":"1.1.6","difficulty":"medium","type":"single","stem":"Graphic Design Institute reviews the error experience of its content agent. When an output is wrong, users must be able to regenerate or edit it without restarting the workflow. Users must also be able to see why the agent produced a specific output.\n\nWhich combination of HAX guidelines should you apply?","choices":["Mitigate social biases, and make clear how well the system can do what it can do.","Support efficient correction, and make clear why the system did what it did.","Make clear what the system can do, and match relevant social norms.","Encourage granular feedback, and provide global controls."],"answer":[1],"explanation":"In the HAX phase when it's wrong belong two guidelines: support efficient correction (easy editing, refining, or recovering) and make clear why the system did what it did (explanation of the behavior).","rationale":["Bias mitigation and expectation management do not address correction or explanation after an error.","Correct: these two guidelines cover correction without restarting and explanation of the output.","These guidelines belong to the first-run experience and during interaction, not to errors.","These guidelines belong to use over a longer period."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/copilot/isv/ux-guidance"},{"id":"1.1.6-04","obj":"1.1.6","difficulty":"medium","type":"single","stem":"Best For You Organics Company runs an automated order-exception workflow that uses several agents. Users must be able to understand which steps led to a decision and where the information came from. User research shows that long explanations in every response overwhelm users.\n\nWhat should you do?","choices":["Log each agent step, and show sources and confidence in tooltips.","Display the full output of each intermediate agent in the main response.","Display the final decision without sources to keep the interface simple.","Send users a weekly summary of all agent decisions by email."],"answer":[0],"explanation":"The Well-Architected Framework recommends transparency through per-step logs in multi-agent workflows, plus source links. Do not overwhelm users: use minimally disruptive, user-initiated UI such as tooltips.","rationale":["Correct: step-by-step logging operationalizes transparency, and tooltips keep the UI non-disruptive.","Showing all intermediate results in every answer overwhelms the user.","Without sources, the transparency that users need is missing.","A weekly summary gives no insight at the moment the user sees the decision."],"ref":"https://learn.microsoft.com/azure/well-architected/ai/responsible-ai"},{"id":"1.1.6-05","obj":"1.1.6","difficulty":"hard","type":"single","stem":"Humongous Insurance uses an agent that settles claims and issues payments. Some claims are ambiguous. In a pilot, the team required human approval for every agent response, and reviewers became a bottleneck. You need to keep human oversight where it matters and to keep reviews fast.\n\nWhat should you do?","choices":["Keep approval for every agent response, and add more reviewers to the team during peak periods.","Remove approvals for payments, and rely on content filters to block harmful outputs from the agent.","Let the agent settle ambiguous claims automatically, and notify the reviewers after each payment.","Require approval only for hard-to-reverse payments, and route ambiguous claims to a person with full context."],"answer":[3],"explanation":"Microsoft recommends a human in the loop where agents perform consequential actions: approval for actions that are hard to reverse and affect money, route sensitive or ambiguous cases visibly to a human, and give reviewers enough context so review does not become a bottleneck.","rationale":["Approval for every answer keeps the bottleneck in place; more reviewers do not solve the cause.","Content filters do not replace a human decision about payments that are hard to reverse.","Reporting afterwards means ambiguous cases are handled without human judgment.","Correct: targeted approval, clear escalation, and context for reviewers combine oversight with speed."],"ref":"https://learn.microsoft.com/agents/center-of-excellence/responsible-ai"},{"id":"1.1.6-06","obj":"1.1.6","difficulty":"hard","type":"single","stem":"Trey Research evaluates its report-generation agent. Measurements show that the agent has lower accuracy with numbers than with text. Users often copy figures from the reports into financial documents without checking them. You need a user-experience mitigation that targets this specific risk.\n\nWhich mitigation should you implement?","choices":["Disclose that the reports are partly or fully generated by AI.","Cite the documents that the agent used as references for each report.","Mark numbers in generated outputs, and prompt users to verify them.","Limit the length of the generated reports to reduce the number of figures."],"answer":[2],"explanation":"The responsible AI guidance gives this example literally: if measurement shows that the system is less accurate with numbers, flag numbers in the output so that users verify them or consult external sources (HAX G2).","rationale":["AI disclosure is general and does not target the measured weakness with numbers.","Source attribution helps with provenance, but does not specifically warn about inaccurate numbers.","Correct: targeted flagging of numbers addresses exactly the measured weak point.","Shorter reports do not reduce the risk for the numbers that are included."],"ref":"https://learn.microsoft.com/azure/foundry/responsible-ai/openai/overview"},{"id":"1.1.7-01","obj":"1.1.7","difficulty":"easy","type":"single","stem":"Coho Winery builds a Foundry agent that must remember durable preferences of each customer, such as preferred language and dietary restrictions. The agent retrieves this information near the beginning of each conversation.\n\nWhich memory type should you use?","choices":["conversation history in the session","user profile memory","chat summary memory","procedural memory"],"answer":[1],"explanation":"In Foundry Agent Service, user profile memory contains durable preferences and personal context, such as language preference. Microsoft recommends retrieving it early in each conversation for stable personalization.","rationale":["Session history is short-term and disappears after the conversation; preferences must persist across sessions.","Correct: user profile memory is intended for durable user preferences.","Chat summary memory contains summaries of earlier conversations and is retrieved per turn.","Procedural memory contains reusable procedures for recurring tasks."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-memory"},{"id":"1.1.7-02","obj":"1.1.7","difficulty":"easy","type":"single","stem":"City Power & Light builds an agent for employees. The agent must answer questions by using curated organizational HR policies that the HR department maintains. The agent must also remember facts that it learns about each employee over time.\n\nWhich component should you use to ground the agent on the HR policies?","choices":["a Foundry IQ knowledge base","a memory store","the file search tool for user-uploaded documents","a chat history provider"],"answer":[0],"explanation":"Microsoft distinguishes: memory for user or agent context learned over time, a Foundry IQ knowledge base for grounding on curated organizational content, and file search for documents that the user provides during an interaction.","rationale":["Correct: curated organizational content belongs in a Foundry IQ knowledge base.","A memory store is for learned, user-specific context, such as the facts about each employee.","File search is intended for documents that users provide during an interaction.","A chat history provider stores conversation messages, not curated policy."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-memory"},{"id":"1.1.7-03","obj":"1.1.7","difficulty":"medium","type":"single","stem":"Margie's Travel plans two agents. A payment agent processes card transactions in a single session. A travel-advisor agent personalizes recommendations based on the history of each customer. The company wants to minimize data retention risk while keeping the value of personalization.\n\nWhich memory design should you use?","choices":["persistent long-term memory for both agents","ephemeral session-based memory for both agents","persistent long-term memory for the payment agent, and ephemeral session-based memory for the advisor agent","ephemeral session-based memory for the payment agent, and persistent long-term memory for the advisor agent"],"answer":[3],"explanation":"The Cloud Adoption Framework recommends matching persistence to the function: ephemeral, session-based memory for transactional agents to limit retention risk, and long-term memory only for advisory agents where historical context is needed.","rationale":["Long-term memory for the payment agent increases retention risk without business value.","Without long-term memory, the advisor cannot personalize based on history.","This reverses the recommendation: risk with payments and no personalization for the advisor.","Correct: this limits data retention for the transactional agent and preserves personalization for the advisor."],"ref":"https://learn.microsoft.com/azure/cloud-adoption-framework/ai-agents/build-secure-process"},{"id":"1.1.7-04","obj":"1.1.7","difficulty":"medium","type":"single","stem":"Wide World Importers uses the memory store APIs of Foundry Agent Service directly instead of the memory search tool. The agent must use stored user profile memories from the first turn of each conversation and must use the most relevant memories for each response.\n\nWhich sequence of actions should you perform?","choices":["Add memories from conversation content by using a user scope -> Create a memory store -> For each turn, search memories with only the scope -> At conversation end, search memories with the latest messages","Create a memory store -> For each turn, search memories with only the scope -> Add memories from conversation content without a scope -> At conversation start, inject the latest messages","Create a memory store -> Add memories from conversation content by using a user scope -> At conversation start, search memories with only the scope to inject static memories -> For each turn, search memories with the latest messages to get contextual memories","Create a memory store -> At conversation start, search memories with the latest messages -> Add memories from conversation content by using a shared scope -> For each turn, search memories with only the scope"],"answer":[2],"explanation":"First create a memory store and add memories with a scope per user. Retrieve static memories at the start with only a scope (without items); retrieve contextual memories per turn with items equal to the latest messages.","rationale":["You cannot add memories before the memory store exists.","Adding memories without a scope makes segmentation per user impossible, and the order is wrong.","Correct: this follows the order and the difference between static and contextual retrieval.","Static and contextual retrieval are reversed, and a shared scope violates per-user isolation."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"1.1.7-05","obj":"1.1.7","difficulty":"hard","type":"single","stem":"Tailspin Toys builds a Microsoft Agent Framework group chat with three participants that use different agent types. To share context, a developer passes one AgentSession instance to every participant. During testing, the participants process the conversation history inconsistently.\n\nWhat should you do?","choices":["Persist the shared session to Azure Cosmos DB, and reload it before each turn.","Give each participant its own session, and let the orchestrator broadcast each response so that every session stays synchronized.","Keep one shared session, and add a lock so that participants update it one at a time.","Keep the history in the orchestrator, and send each participant the current message without prior history."],"answer":[1],"explanation":"In group chat, agents do not share a session instance, because different agent types may implement AgentSession differently. The orchestrator synchronizes each agent's session by broadcasting the response to all other participants after each turn.","rationale":["Persistence does not change the fact that a shared instance is interpreted differently.","Correct: separate sessions with broadcast by the orchestrator is the design of group chat context sharing.","A lock does not solve the problem: the inconsistency comes from different session implementations, not from concurrency.","Without earlier history, participants cannot build on each other's contributions."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/group-chat"},{"id":"1.1.7-06","obj":"1.1.7","difficulty":"hard","type":"multi","stem":"Fabrikam Residences offers a multitenant leasing agent that uses memory in Foundry Agent Service. Memories of one resident must never be visible to another resident. Company policy limits the retention of personal data, and residents must be able to view and remove what the agent remembers about them.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Set a default time-to-live (TTL) on the memory store that matches the retention policy.","Expose item-level edit and delete actions for memories to residents.","Use one shared scope for all residents so that the agent learns from every conversation.","Use extracted memories to decide which lease records a resident can access.","Partition the memory store by user by using the scope property."],"answer":[0,1,4],"explanation":"Best practices for memory: partition per user with scope, set explicit retention with TTL, and offer users item-level editing and deletion. Never use extracted memories for authorization decisions.","rationale":["Correct: a TTL at store level automatically enforces the retention period.","Correct: item-level management supports transparency and the privacy rights of users.","A shared scope across users causes exactly the leak that must be prevented.","Extracted memories are not a reliable basis for authorization; use real access control for that.","Correct: a scope per user prevents memories from leaking between residents."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage"},{"id":"1.1.8-01","obj":"1.1.8","difficulty":"easy","type":"single","stem":"Coho Vineyard has an agent step that extracts shipment numbers and dates from short carrier notifications. The step runs at high volume, and the task requires no complex reasoning.\n\nWhich type of model should you assign to this step?","choices":["a frontier reasoning model","an embedding model","a multimodal model that processes audio","a smaller, faster, and less expensive model"],"answer":[3],"explanation":"Microsoft recommends matching the model to the task difficulty: route deterministic or simple subtasks such as classification, extraction, and formatting to smaller, cheaper, and faster models, and reserve frontier reasoning models for truly difficult steps.","rationale":["A frontier reasoning model is more expensive and slower without added value for simple extraction.","An embedding model creates vectors for search; it does not extract fields.","The input is text, so an audio model does not fit the task.","Correct: simple extraction at high volumes fits a small, fast, and cheap model."],"ref":"https://learn.microsoft.com/agents/architecture/host-platform"},{"id":"1.1.8-02","obj":"1.1.8","difficulty":"easy","type":"single","stem":"Relecloud builds a retrieval step for its multi-agent solution. The step must convert document chunks and user queries into vectors for semantic similarity search.\n\nWhich model category should you use for this step?","choices":["a reasoning model","a model router deployment","an embedding model","a chat completion model"],"answer":[2],"explanation":"In model selection you first determine task fit: chat, reasoning, embedding, RAG, or multimodal. Converting text to vectors for semantic search is the task of an embedding model.","rationale":["A reasoning model is for multi-step reasoning, not for vectorization.","Model router routes chat prompts to chat models; it does not produce embeddings.","Correct: an embedding model creates the vectors for semantic similarity search.","A chat model generates text, not vector representations for search."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/choose-ai-model"},{"id":"1.1.8-03","obj":"1.1.8","difficulty":"medium","type":"single","stem":"Southridge Video deploys model router for an editing agent that receives a mix of simple and complex prompts. Many prompts contain long transcripts that exceed the context window of the smallest model in the routing pool. The solution must keep cost-aware routing and automatic failover.\n\nWhat should you do?","choices":["Change the routing mode of the deployment to Quality.","Configure a model subset with one long-context model.","Configure a model subset with two or more long-context models.","Enable session affinity to keep each conversation on one model."],"answer":[2],"explanation":"The effective context window of model router is limited by the smallest underlying model. Microsoft recommends a model subset with only models that support the required context length, and at least two models so that routing and automatic failover keep working.","rationale":["Quality mode ignores cost and does not change the context window of the model pool.","A subset with a single model disables routing optimization and failover.","Correct: only long-context models in the subset, and at least two for failover and cost-aware routing.","Session affinity keeps a conversation on the same model, but does not solve the context limit of the smallest model."],"ref":"https://learn.microsoft.com/azure/foundry/openai/concepts/model-router-how-it-works"},{"id":"1.1.8-04","obj":"1.1.8","difficulty":"medium","type":"single","stem":"Alpine Ski House uses GPT-5 for a triage agent. Responses must be as fast as possible, and the agent must make parallel tool calls to check lift status and weather at the same time. Triage requires only light reasoning.\n\nWhich reasoning_effort value should you use?","choice

 non-streaming runs.","Incorrect: function middleware only sees tool calls, not the final agent response that is shown to users.","Incorrect: termination skips the rest of the chain, but the result still has the wrong type for streaming runs.","Incorrect: run-level registration changes the scope of the middleware, not the result type it produces."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/?pivots=programming-language-python"},{"id":"2.4.8-05","obj":"2.4.8","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. registers agent middleware A1 and A2 at the agent level of an Agent Framework agent in Python. For one specific request, the developer also passes run middleware R1 and R2 to agent.run().\n\nWhich execution order should you expect?","choices":["A1 -> A2 -> R1 -> R2 -> Agent -> R2 -> R1 -> A2 -> A1","R1 -> R2 -> A1 -> A2 -> Agent -> A2 -> A1 -> R2 -> R1","A1 -> R1 -> A2 -> R2 -> Agent -> R2 -> A2 -> R1 -> A1","A1 -> A2 -> R1 -> R2 -> Agent -> A1 -> A2 -> R1 -> R2"],"answer":[0],"explanation":"Agent-level middleware wraps run-level middleware: agent middleware is the outer layer, run middleware the inner layer. After the agent, the chain unwinds in reverse order.","rationale":["Correct: first the agent-level chain, then the run-level chain, and then back in mirror image.","Incorrect: run-level middleware is the inner layer, not the outer one.","Incorrect: the layers are not nested alternately; each scope forms its own chain.","Incorrect: middleware unwinds in reverse order on the way back, not in the same order."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.8-06","obj":"2.4.8","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. hosts a multi-tenant Agent Framework solution. Tools must receive the tenant ID of the authenticated caller for authorization checks. The model must not be able to supply or change the tenant ID, and the solution must work for every agent.\n\nWhat should you do?","choices":["Set the tenant ID in context.function_invocation_kwargs in agent middleware","Add a tenant_id parameter to each tool so that the model supplies the value","Add the tenant ID of the caller to the instructions of each agent","Append a message that contains the tenant ID in chat middleware"],"answer":[0],"explanation":"function_invocation_kwargs in agent middleware are runtime values that are forwarded to tools and are available through FunctionInvocationContext. That context parameter is hidden in the schema the model sees, so the model cannot supply or change the value.","rationale":["Correct: runtime-only values via middleware reach the tools without the model seeing or influencing them.","Incorrect: normal function parameters are filled in by the model and can therefore be manipulated.","Incorrect: instructions are visible to the model and are not a reliable authorization source.","Incorrect: an extra message makes the tenant ID part of the prompt, where the model can repeat or change it."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/runtime-context"},{"id":"2.4.8-07","obj":"2.4.8","difficulty":"hard","type":"single","stem":"Humongous Insurance registers two function middleware components on an Agent Framework agent in Python, in this order: SecurityPolicyMiddleware, which approves tool arguments against policy, and ArgumentRepairMiddleware, which fixes malformed JSON arguments from the model. Tool calls with repaired arguments now fail with MiddlewareFailure.\n\nWhat should you do?","choices":["Register ArgumentRepairMiddleware before SecurityPolicyMiddleware","Remove SecurityPolicyMiddleware from the agent","Set include_detailed_errors to True on the chat client","Move ArgumentRepairMiddleware to chat middleware"],"answer":[0],"explanation":"Middleware that repairs arguments must run before security or policy middleware. Argument changes after security processing fail closed with MiddlewareFailure, because the approved arguments then no longer match.","rationale":["Correct: repair first and then run the security check on the final arguments.","Incorrect: removing the security check fixes the error by removing a required safeguard.","Incorrect: more error details do not change the fail-closed check.","Incorrect: chat middleware intercepts model requests and has no access to the tool arguments in the function context."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/runtime-context"},{"id":"2.4.8-08","obj":"2.4.8","difficulty":"hard","type":"multi","stem":"Northwind Traders needs audit logging for every run of its Agent Framework agents. For one troubleshooting session, the support team also wants verbose diagnostic logging that applies to a single request only. The solution must keep the agent logic unchanged.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Register the audit logging middleware at the agent level when you create the agent","Pass the diagnostic logging middleware in the middleware parameter of agent.run() for the request","Add audit logging code to each tool function","Register the diagnostic logging middleware at the agent level and remove it after the session","Set FunctionInvocationContext.Terminate to true when diagnostic logging is active"],"answer":[0,1],"explanation":"Agent-level middleware applies persistently to all runs and is configured once. You pass run-level middleware to a specific run for per-request customization, without changing the agent logic.","rationale":["Correct: audit logging at agent level applies to every run.","Correct: run-level middleware applies only to the specific request.","Incorrect: logging in every tool changes the agent logic and is not reusable.","Incorrect: agent-level registration applies to all runs and also affects other requests.","Incorrect: Terminate ends the function calling loop and can make the chat history inconsistent."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"3.1.1-01","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has a claims-triage agent in a Microsoft Foundry project. The compliance team wants to review agent responses by answering a fixed set of questions for each response, including a 1-5 helpfulness slider, a multiple-choice correctness rating, and a free-form comment.\n\nWhich Foundry feature should you configure?","choices":["A human evaluation template for the agent","Thumbs up or thumbs down trace annotations","A continuous evaluation rule for the agent","A custom prompt-based evaluator"],"answer":[0],"explanation":"A human evaluation template in the Human Evaluation tab lets the agent builder define questions of type thumbs up/down, slider, multiple choice and free-form text. Reviewers complete the active template for each agent response. The requirement for structured questions with multiple question types points to this template.","rationale":["Correct: templates support exactly the slider, multiple choice and free-form questions that people fill in.","Trace annotations use the default binary thumbs up/down scoring template and do not support a slider or multiple choice questionnaire.","Continuous evaluation scores production traffic automatically with evaluators, not with human reviewers.","A prompt-based evaluator uses an LLM as a judge and is therefore not a human review process."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-02","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. created an active human evaluation template for Agent1 in a Microsoft Foundry project. User1 is a data scientist who must open the agent preview web app and submit feedback. You must follow the principle of least privilege.\n\nWhich role should you assign to User1 on the Foundry project?","choices":["Foundry User","Foundry Owner","Foundry Project Manager","Monitoring Metrics Publisher"],"answer":[0],"explanation":"Human reviewers need at least the Foundry User role on the Foundry project (plus Reader on the account) to open the preview web app and submit feedback. Foundry Project Manager is needed to create and manage templates, not to review.","rationale":["Correct: Foundry User is the minimum role for reviewers of the preview web app.","Foundry Owner grants far more permissions than needed and violates least privilege.","Foundry Project Manager is the role for the agent builder who creates and manages templates; for a reviewer it is too much.","Monitoring Metrics Publisher is needed for an identity that sends telemetry to Application Insights via Entra ID, not for a reviewer."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-03","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Tailspin Toys has set a human evaluation template as active for a support agent in Microsoft Foundry. Reviewers must chat with the agent and complete the template questions for each response they receive during the chat.\n\nWhich experience should the reviewers use to perform the evaluation?","choices":["The preview web app, by selecting Feedback after each response","The trace detail page, by selecting Annotate on each trace","The Evaluation page, by creating an evaluation run for the agent","The Application Insights Logs blade, by running a KQL query"],"answer":[0],"explanation":"After a template is activated, reviewers open a browser-based chat interface through Preview in the agent builder. After each response they select Feedback, and a side panel then shows the active template. This combines chatting and answering the questions.","rationale":["Correct: the preview web app shows the active template in a side panel via the Feedback button.","Annotate on the trace detail page adds a thumbs up/down annotation to existing traces, not the template questions during a chat.","The Create evaluation wizard starts an automated evaluation run with evaluators, not a human review per response.","KQL in Application Insights is intended to analyze feedback, not to enter it."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-04","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Relecloud has a multi-agent travel solution that sends traces to Application Insights connected to a Microsoft Foundry project. Domain experts want to mark individual historical agent interactions as helpful or unhelpful starting today, without creating any configuration first.\n\nWhat should the domain experts use?","choices":["The Annotate button on the trace detail page","A new human evaluation template in the agent builder","A gen_ai.evaluation.result event emitted from application code","A Task Completion evaluator run over the existing traces"],"answer":[0],"explanation":"Every Foundry project has a pre-created default thumbs up/down scoring template, so builders and domain experts can annotate traces directly via Tracing and the Annotate button. No extra setup is needed and it works on existing traces.","rationale":["Correct: the Annotate button uses the pre-created default thumbs up/down scoring template and works directly on existing traces.","A human evaluation template must first be created and activated and works in the preview web app on new responses, not on historical traces.","A gen_ai.evaluation.result event from code is intended for end-user feedback and requires code changes.","Task Completion is an automated LLM-judge evaluator, not a human judgment."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.1-05","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank created two human evaluation templates for Agent1 in Microsoft Foundry: Template1 contains accuracy questions and Template2 contains compliance questions. After you set Template2 as active, reviewers report that the accuracy questions no longer appear. Reviewers must answer both sets of questions for every response in the same session.\n\nWhat should you do?","choices":["Merge both sets of questions into one template and set it as active","Set both Template1 and Template2 as active for Agent1","Assign the reviewers the Foundry Project Manager role on the project","Create a second agent version and assign Template1 to that version"],"answer":[0],"explanation":"Only one template can be active at a time; activating a new template automatically deactivates the previous one. To show both sets of questions in the same session, the questions must be in a single template that is active.","rationale":["Correct: a combined active template shows all questions to reviewers at the same time.","Two templates cannot be active at the same time; activating one deactivates the other.","Roles affect the management of templates, not how many templates can be active.","A second agent version splits the review across two agents and does not meet the requirement of both sets per response in the same session."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-06","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Litware, Inc. runs a human evaluation program for a contract-review agent in Microsoft Foundry. Auditors require that all reviewer answers be kept for three years. The connected Application Insights resource is shared with other teams, and you must not change its retention configuration.\n\nWhat should you do?","choices":["Use Download Results for each template and store the CSV files in Azure Blob Storage","Increase the data retention period of the Application Insights resource","Set the evaluation template as inactive to freeze the stored results","Export the template definition and store it in Azure Blob Storage"],"answer":[0],"explanation":"Human evaluation data is stored in Application Insights and follows its retention. Microsoft recommends downloading the data and storing it elsewhere if you need it for a long time. Download Results exports a CSV with timestamp, prompt, response, questions and answers per instance.","rationale":["Correct: the CSV export contains all results and can be kept long term outside Application Insights.","Changing the retention works technically, but the stem forbids changing the shared resource.","Setting the template to inactive only stops the collection of new results; existing data remains subject to the retention of Application Insights.","The template definition contains only the questions, not the reviewers' answers."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-07","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders has a customer-facing web app that calls a Foundry agent and has OpenTelemetry tracing to Application Insights. End users can select thumbs up or thumbs down on each answer. The feedback must appear as annotations on the matching trace in the Foundry portal, next to builder annotations, and must be filterable by source.\n\nWhat should you do?","choices":["Emit a gen_ai.evaluation.result event in the same trace context, with the source set to end_user","Create a human evaluation template and embed the preview web app in the customer-facing app","Store the feedback in Azure Cosmos DB and join it to the traces by using the conversation ID","Send the feedback to the agent as a new user message in the same conversation thread"],"answer":[0],"explanation":"End-user feedback is logged as a gen_ai.evaluation.result OpenTelemetry event that is emitted within the same trace context, so that it appears on the correct trace. The source attribute end_user makes it filterable alongside builder annotations.","rationale":["Correct: the OTel event in the same trace context links the feedback to the trace and marks the source as end_user.","The preview web app is intended for internal reviewers with a Foundry role, not for end users of a public app.","A separate database does not produce annotations on the trace in the Foundry portal.","Sending feedback as a message to the agent changes the conversation and does not create an annotation."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.1-08","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Adatum Corporation logs end-user feedback from App1 as trace annotations. The connected Application Insights resource requires Microsoft Entra ID authentication for ingestion. App1 runs with a managed identity, and each programmatic annotation fails with a 403 error. Traces from other components arrive correctly.\n\nWhich role should you assign to the managed identity of App1 on the Application Insights resource?","choices":["Monitoring Metrics Publisher","Log Analytics Reader","Privileged Monitoring Data Reader","Reader"],"answer":[0],"explanation":"For programmatic annotations with Entra-authenticated ingestion, the identity that emits telemetry needs the Monitoring Metrics Publisher role on the connected Application Insights resource. A 401/403 indicates missing write permissions, not read permissions.","rationale":["Correct: Monitoring Metrics Publisher grants the write permissions for telemetry ingestion via Entra ID.","Log Analytics Reader grants only read permissions to view traces.","Privileged Monitoring Data Reader is for reading protected trace content, not for writing.","Reader grants read permissions on the resource; the documentation warns that an additional reader role does not grant telemetry write access."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.1-09","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Contoso, Ltd. is piloting human evaluation for Agent1 in Microsoft Foundry. Application Insights is connected to the project. A template named Template1 was created and appears in the template table. Two reviewers report issues:\n\n- User1 cannot open the agent preview web app.\n- User2 opens the preview web app and receives agent responses, but no Feedback button appears after the responses.\n\nYou must follow the principle of least privilege.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Assign User1 the Foundry User role on the Foundry project.","Select Set as active for Template1 in the template table.","Assign User1 the Monitoring Metrics Publisher role on the Application Insights resource.","Assign User2 the Log Analytics Reader role on the Application Insights resource.","Increase the data retention period of the Application Insights resource."],"answer":[0,1],"explanation":"A reviewer without access to the preview web app lacks the Foundry User role on the project. If the Feedback button is missing, there is no active template: a new template is Inactive by default and must be activated with Set as active.","rationale":["Correct: Foundry User is the minimum role to open the preview web app and submit feedback.","Correct: new templates are Inactive; without an active template the Feedback button does not appear.","Monitoring Metrics Publisher is for telemetry-emitting identities, not for access to the preview web app.","Log Analytics Reader helps with viewing traces, but does not make the Feedback button appear.","Retention determines how long data is kept and has no effect on the Feedback button."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/troubleshooting"},{"id":"3.1.1-10","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. is setting up a new Foundry project for a procurement agent. Compliance team members must review agent responses by using structured questions, and the results must be exported for offline analysis. Application Insights is not yet connected to the project.\n\nWhich sequence of actions should you perform?","choices":["Connect Application Insights to the project -> Create a template in the Human Evaluation tab -> Set the template as active -> Reviewers submit Feedback in the preview web app -> Select Download Results","Create a template in the Human Evaluation tab -> Reviewers submit Feedback in the preview web app -> Set the template as active -> Connect Application Insights to the project -> Select Download Results","Create a template in the Human Evaluation tab -> Set the template as active -> Reviewers submit Feedback in the preview web app -> Select Download Results -> Connect Application Insights to the project","Connect Application Insights to the project -> Reviewers submit Feedback in the preview web app -> Create a template in the Human Evaluation tab -> Set the template as active -> Select Download Results"],"answer":[0],"explanation":"Application Insights is a prerequisite because human evaluation data is stored there. Then you create the template, activate it (new templates are Inactive), reviewers leave their responses via Feedback in the preview web app, and you download the results as CSV.","rationale":["Correct: this follows prerequisites, create template, activate, review and export.","Reviewers cannot give feedback before the template is active, and without Application Insights nothing is stored.","Application Insights must be connected first; otherwise there are no results to download.","Without an active template the Feedback button does not appear, so reviewing before creating the template does not work."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/human-evaluation"},{"id":"3.1.1-11","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys emits end-user thumbs-down feedback from App1 by using the following event attributes.\n\n```json\n{\n  \"gen_ai.evaluation.name\": \"task_completion\",\n  \"gen_ai.evaluation.score.value\": 0.0,\n  \"gen_ai.evaluation.score.label\": \"fail\",\n  \"microsoft.gen_ai.human_evaluation.source\": \"end_user\",\n  \"microsoft.gen_ai.evaluation.actor.type\": \"human\",\n  \"gen_ai.response.id\": \"<response id>\",\n  \"operation_Id\": \"<value 1>\",\n  \"operation_ParentId\": \"<value 2>\"\n}\n```\n\nThe events are ingested, but the annotations appear on unrelated traces in the Foundry portal.\n\nWhat should you use for value 1 and value 2?","choices":["The trace ID of the annotated interaction for value 1, and the span ID of the annotated span for value 2","The span ID of the annotated span for value 1, and the trace ID of the annotated interaction for value 2","The agent ID for value 1, and the agent version for value 2","The conversation ID for value 1, and the response ID for value 2"],"answer":[0],"explanation":"operation_Id links the annotation to the original trace (trace ID) and operation_ParentId to the specific span (span ID). The event must be emitted in the same trace context; for annotations on the wrong trace, check operation_Id, operation_ParentId and gen_ai.response.id.","rationale":["Correct: operation_Id = trace ID and operation_ParentId = span ID according to the annotation attribute schema.","This swaps the trace ID and span ID, so the correlation is wrong.","Agent ID and version belong in gen_ai.agent.id and gen_ai.agent.version, not in the operation fields.","A conversation ID is not a trace ID, and the response ID already has its own attribute gen_ai.response.id."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.1-12","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank collects thumbs up or thumbs down annotations from both builders in the Foundry portal and end users in App1. The quality lead needs an hourly pass rate split by feedback source, displayed on an Azure dashboard, and an automated alert when the end-user pass rate drops. Reviewers must not perform manual exports.\n\nWhat should you do?","choices":["Run a KQL query on gen_ai.evaluation.result events in Application Insights, grouped by source","Select Download Results in the Human Evaluation tab every hour and load the CSV into the dashboard","Filter the trace list in the Foundry portal by source and by score label every hour","Run a Customer Satisfaction evaluator every hour over the traces of the agent"],"answer":[0],"explanation":"All annotations are published to Azure Monitor / Application Insights as gen_ai.evaluation.result events. With KQL you can calculate pass rates per source and per time interval and build dashboards and alerts on them, without manual steps.","rationale":["Correct: KQL on Application Insights supports aggregation per source, dashboards and alerts.","Manual CSV exports are forbidden by the stem and are, moreover, for template results, not for trace annotations.","Filtering in the trace list is manual and does not produce a dashboard or alert.","Customer Satisfaction is an LLM judge that predicts satisfaction; it does not measure the human feedback itself."],"ref":"https://learn.microsoft.com/azure/foundry/observability/how-to/trace-annotations"},{"id":"3.1.2-01","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Litware, Inc. has a payments agent that calls a function tool to create refunds. A test must confirm that every tool call parameter is grounded, has the correct type and format, includes the required parameters, and contains no unexpected parameters.\n\nWhich evaluator should you use?","choices":["Tool Input Accuracy","Tool Selection","Tool Call Success","Tool Output Utilization"],"answer":[0],"explanation":"Tool Input Accuracy checks all tool call parameters against six strict criteria: groundedness, type compliance, format compliance, required parameters, no unexpected parameters and value appropriateness. This matches the requirement exactly.","rationale":["Correct: Tool Input Accuracy validates the parameters strictly.","Tool Selection assesses whether the right tools were chosen, not the parameters.","Tool Call Success detects technical errors during execution, not the correctness of parameters.","Tool Output Utilization assesses how the agent uses tool results."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.1.2-02","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Relecloud has an inventory agent that calls an MCP tool to get stock levels. Traces show that the tool calls succeed with correct parameters, but the final answers often state stock numbers that differ from the values returned by the tool. You need an evaluator that detects this specific failure.\n\nWhich evaluator should you use?","choices":["Tool Output Utilization","Tool Call Success","Tool Input Accuracy","Intent Resolution"],"answer":[0],"explanation":"Tool Output Utilization measures whether the agent correctly interprets and uses the results of tool calls in its reasoning and final response. The tool calls themselves succeed and have correct parameters, so the problem lies in the use of the output.","rationale":["Correct: this evaluator detects incorrect use of tool results in the response.","Tool Call Success would pass because the calls succeed technically.","Tool Input Accuracy would pass because the parameters are correct.","Intent Resolution measures whether the user intent was recognized correctly, not whether tool data was used correctly."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.1.2-03","obj":"3.1.2","difficulty":"hard","type":"single","stem":"Tailspin Toys has a booking orchestrator agent. A regression test must confirm that the agent calls search_flights before book_flight. Extra calls such as get_weather between or around them are acceptable. You configure the following testing criteria.\n\n```python\n{\n    \"type\": \"azure_ai_evaluator\",\n    \"name\": \"task_navigation_efficiency\",\n    \"evaluator_name\": \"builtin.task_navigation_efficiency\",\n    \"initialization_parameters\": {\n        \"matching_mode\": \"<value>\"\n    },\n    \"data_mapping\": {\n        \"actions\": \"{{item.actions}}\",\n        \"expected_actions\": \"{{item.expected_actions}}\"\n    },\n}\n```\n\nWhat should you do?","choices":["Set matching_mode to in_order_match.","Set matching_mode to exact_match.","Set matching_mode to any_order_match.","Replace the evaluator with builtin.tool_selection."],"answer":[0],"explanation":"Task Navigation Efficiency compares the agent's path with expected_actions. in_order_match requires that all expected steps occur in the correct order, while extra steps are allowed. This fits the requirement of order plus permitted extra calls.","rationale":["Correct: in_order_match checks the order and allows extra steps.","exact_match requires an exact match in order and content, so get_weather would make the test fail.","any_order_match does not check the order, while search_flights must come before book_flight.","Tool Selection assesses whether the right tools were chosen, but not the order relative to an expected path."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.1.2-04","obj":"3.1.2","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. has a Foundry agent that uses the built-in Azure AI Search tool to retrieve policy documents. You plan to add Tool Call Accuracy and Groundedness evaluators to the evaluation runs. The evaluation results for the retrieval step must be reliable, and the agent must keep querying the same Azure AI Search index.\n\nWhat should you do?","choices":["Call the index through a function tool instead of the built-in Azure AI Search tool","Keep the built-in Azure AI Search tool and use a reasoning model as the LLM judge","Keep the built-in Azure AI Search tool and replace Tool Call Accuracy with Tool Call Success","Keep the built-in Azure AI Search tool and use Tool Selection instead of Tool Call Accuracy"],"answer":[0],"explanation":"Agent evaluators support File Search, Function Tool, MCP and Knowledge-based MCP. Azure AI Search has limited support: avoid tool_call_accuracy, tool_call_success and groundedness for conversations with this tool. Calling the index through a function tool makes the tool call evaluable.","rationale":["Correct: a function tool (user-defined tool) is fully supported and still queries the same index.","Changing the judge model does not solve the limited tool support.","Tool Call Success is also on the list of evaluators to avoid with Azure AI Search.","Tool Selection is not on the avoid list, but it measures only the tool choice and not the parameters; moreover, Groundedness remains unreliable as long as the built-in Azure AI Search tool is used."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.1.2-05","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Woodgrove Bank has a knowledge agent that retrieves documents from a vector index. Subject matter experts have labeled the relevance of each document for every test query. You need search quality metrics such as NDCG and Fidelity.\n\nWhich evaluator should you use?","choices":["Document Retrieval","Retrieval","Groundedness","Relevance"],"answer":[0],"explanation":"Document Retrieval compares retrieved documents with ground truth relevance labels (qrels) and calculates Fidelity, NDCG, XDCG, Max Relevance and Holes. The labeled data and the requested metrics point to this evaluator.","rationale":["Correct: Document Retrieval uses retrieval_ground_truth labels for search quality metrics.","Retrieval uses an LLM judge without ground truth and does not produce NDCG.","Groundedness assesses the final response relative to the context, not the ranking of documents.","Relevance assesses whether the response answers the question."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"id":"3.1.2-06","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a research subagent that retrieves context chunks from a knowledge base. You need to assess whether the retrieved chunks are relevant to each query before the response is generated. No relevance labels or expected answers exist for the test queries.\n\nWhich evaluator should you use?","choices":["Retrieval","Document Retrieval","Response Completeness","Groundedness Pro"],"answer":[0],"explanation":"Retrieval is a process evaluator that uses an LLM judge to measure how relevant the retrieved context chunks are to the query, without ground truth. It requires only the query and context.","rationale":["Correct: Retrieval assesses the retrieved context without ground truth.","Document Retrieval requires retrieval_ground_truth labels, which are missing.","Response Completeness requires ground_truth and assesses the final response, not the retrieval.","Groundedness Pro assesses whether the response is strictly consistent with the context, not the relevance of the chunks."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"id":"3.1.2-07","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Adatum Corporation has a benefits agent grounded on HR documents. Groundedness scores are high, but HR reports that answers often omit critical eligibility conditions. Each test query has an expected answer written by HR.\n\nWhich evaluator should you add?","choices":["Response Completeness","Retrieval","Coherence","Fluency"],"answer":[0],"explanation":"Groundedness measures the precision aspect (no content outside the context), while Response Completeness measures the recall aspect: does the response miss critical information relative to the ground truth. With the expected answers from HR, this evaluator is suitable.","rationale":["Correct: Response Completeness compares the response with the ground truth and detects missing information.","Retrieval assesses the retrieved chunks, not whether the response is complete.","Coherence measures logical consistency, not completeness relative to an expected answer.","Fluency measures language quality."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"id":"3.1.2-08","obj":"3.1.2","difficulty":"hard","type":"multi","stem":"Northwind Traders wants to choose the chunk size, top_k value, and search algorithm for the knowledge source used by its multi-agent support solution. You have a test set with human-labeled document relevance for each query. The decision must use the most precise retrieval quality measurement and must show whether differences from the current configuration are statistically significant.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Generate retrieval results for each configuration and run the Document Retrieval evaluator with the labeled data as retrieval_ground_truth.","Select the evaluation runs in the Foundry portal, select Compare, and set the run of the current configuration as the baseline.","Run the Groundedness Pro evaluator on the responses of each configuration.","Run the Task Navigation Efficiency evaluator for each configuration.","Run the Fluency evaluator on the responses of each configuration."],"answer":[0,1],"explanation":"A parameter sweep uses Document Retrieval with ground truth labels to find the search parameters with the best retrieval quality; according to Learn, this is the most precise measurement. The Compare function with a baseline run uses statistical t-tests to show significant improvements or regressions.","rationale":["Correct: Document Retrieval with qrels is the most precise retrieval measurement for a parameter sweep.","Correct: Compare with a baseline shows statistically significant differences per run.","Groundedness Pro assesses the response relative to the context, not the retrieval quality.","Task Navigation Efficiency compares tool steps with an expected path, not search results.","Fluency measures language quality and says nothing about retrieval."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"id":"3.1.2-09","obj":"3.1.2","difficulty":"hard","type":"single","stem":"Relecloud builds a concierge agent by using Microsoft Agent Framework. The agent calls a retrieve_memory function tool to load stored user preferences. You need to evaluate only the agent behavior from the memory retrieval onward, while all earlier messages serve as query context. You create a function named split_before_memory that returns the messages before the retrieve_memory function call as the query and the messages from that call onward as the response. You write the following code.\n\n```python\nresults = await evaluate_agent(\n    agent=agent,\n    queries=queries,\n    evaluators=evals,\n    <setting>,\n)\n```\n\nWhat should you use for the setting?","choices":["conversation_split=split_before_memory","conversation_split=ConversationSplit.FULL","No conversation_split argument (default last-turn split)","num_repetitions=3"],"answer":[0],"explanation":"The split strategy determines what you evaluate. A custom splitter is a callable that splits the conversation into query and response messages; by splitting before the retrieve_memory call, everything before it becomes context and the behavior from memory retrieval onward is assessed.","rationale":["Correct: a custom splitter on the retrieve_memory call isolates the behavior from the memory retrieval onward.","FULL takes the first user message as the query and the rest as the response, so not from the memory call onward.","The default splits at the last user message, which does not coincide with the memory retrieval.","num_repetitions measures consistency by repeating queries and does not change the split."],"ref":"https://learn.microsoft.com/agent-framework/agents/evaluation"},{"id":"3.1.2-10","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Litware, Inc. has an onboarding agent that must remember facts the user provides early in a multi-turn chat and use them later in the same chat. You plan an evaluation in the Foundry portal that scores the complete interaction from start to finish.\n\nWhich evaluation scope should you select?","choices":["Full conversations","Individual turns","Individual turns with existing traces","Individual turns with synthetic data"],"answer":[0],"explanation":"The Full conversations scope evaluates complete multi-turn conversations from start to finish, so you can see whether previously given information is used correctly later. Individual turns scores separate responses and misses the progression across the whole conversation.","rationale":["Correct: Full conversations assesses the entire interaction, including continuity of information.","Individual turns scores separate responses and fits debugging of specific turns.","Existing traces is a data source within the Individual turns scope and still scores per turn.","Synthetic data within Individual turns generates single-turn queries, which does not fit a multi-turn memory test."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/evaluate-generative-ai-app"},{"id":"3.1.2-11","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Tailspin Toys rewrote the system prompt of a sales agent and ran the same evaluation dataset against the old and the new agent versions. You must determine whether the new prompt produced a statistically significant change for each evaluator.\n\nWhat should you do?","choices":["Select both runs, select Compare, and set the old run as the baseline","Create a human evaluation template and ask reviewers to rate both versions","Enable continuous evaluation on the new agent version","Annotate the traces of both versions with thumbs up or thumbs down"],"answer":[0],"explanation":"The Compare function shows selected runs side by side and uses statistical t-tests. With a baseline run you see per evaluator whether the new prompt improves or regresses significantly, including p-value and sample size.","rationale":["Correct: Compare with baseline gives statistically significant results per evaluator.","A human evaluation provides human judgments but no statistical comparison of the two runs.","Continuous evaluation monitors production traffic and does not compare prompt versions on the same dataset.","Trace annotations give separate human signals, not a statistical comparison."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/evaluate-results"},{"id":"3.1.2-12","obj":"3.1.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank has an advisor agent whose system prompt forbids recommending specific stocks and requires a referral to a licensed advisor for investment questions. Before each prompt change is released, you must verify that the responses follow these instructions. The test dataset includes the system message.\n\nWhich evaluator should you use?","choices":["Task Adherence","Intent Resolution","Relevance","Customer Satisfaction"],"answer":[0],"explanation":"Task Adherence measures whether the agent's actions comply with the rules, procedures and policy constraints in the system message and is intended for compliance in regulated environments. Providing the system message improves this assessment.","rationale":["Correct: Task Adherence checks compliance with the instructions and constraints in the system prompt.","Intent Resolution measures whether the user's intent was recognized correctly, not whether instructions are followed.","Relevance measures whether the response addresses the question; a relevant response can still recommend a share.","Customer Satisfaction predicts satisfaction and does not check policy rules."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"},{"id":"3.2.1-01","obj":"3.2.1","difficulty":"easy","type":"single","stem":"Litware, Inc. runs a contract review solution in which an orchestrator calls a legal agent, a finance agent, and a compliance agent one after another. Each agent analyzes the same contract independently and none of them uses the output of another agent. End-to-end task duration is too long.\n\nWhich orchestration pattern should you use to reduce the task duration?","choices":["Concurrent orchestration","Sequential orchestration","Handoff orchestration","Group chat orchestration"],"answer":[0],"explanation":"The three agents work independently on the same input, so they can run in parallel (fan-out/fan-in). Concurrent orchestration reduces the total run time because the agents work at the same time and the results are merged afterward.","rationale":["Correct: concurrent orchestration lets independent agents work on the same task in parallel and is intended for time-critical scenarios.","Incorrect: sequential is the current situation; it fits when agents build on each other's output, which is not the case here.","Incorrect: handoff transfers control dynamically to another agent; the agents then still work one at a time.","Incorrect: group chat lets agents respond in turn in a shared conversation; that does not speed up independent analyses."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns#concurrent-orchestration"},{"id":"3.2.1-02","obj":"3.2.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a planner agent that calls an Azure OpenAI deployment in Microsoft Foundry. During peak load, the deployment returns HTTP 429 responses. You implement custom retry logic.\n\nWhich response header should the retry logic use to decide how long to wait before the next attempt?","choices":["retry-after-ms","x-ratelimit-remaining-tokens","x-ratelimit-limit-tokens","x-ms-spillover-from-deployment"],"answer":[0],"explanation":"On a 429, Azure OpenAI returns the retry-after-ms header: the number of milliseconds you must wait before a new attempt. Without that header, you use exponential backoff with jitter.","rationale":["Correct: on a 429, retry-after-ms indicates how many milliseconds to wait.","Incorrect: this header shows how many tokens remain before a 429 occurs; it is useful for proactive throttling, but it is not a wait time.","Incorrect: this header shows the current limit of the deployment, not the wait time.","Incorrect: this header indicates that a request came through spillover from a provisioned deployment."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota#understanding-rate-limits"},{"id":"3.2.1-03","obj":"3.2.1","difficulty":"easy","type":"single","stem":"Alpine Ski House has a booking agent that calls a chat completions deployment with n set to 5 so that the agent can pick the best of five drafts. Logs show that the agent always uses the first choice and discards the other four. Each call takes much longer than the team expects. You need to reduce the duration of each call without changing the model.\n\nWhat should you do?","choices":["Remove n from the request or set it to 1.","Set stream to true on each request.","Increase the TPM allocation of the deployment.","Raise max_tokens so each draft finishes in one call."],"answer":[0],"explanation":"With the n parameter, the model generates multiple responses per request, which increases latency. For the fastest response, Learn recommends leaving n unset or keeping it at 1. Because the agent uses only the first choice, this gives the same result in less time.","rationale":["Correct: fewer generated responses per request shortens the duration of each call without changing the model.","Incorrect: streaming only shortens the time to the first token; the total generation time for five responses stays the same.","Incorrect: more TPM helps against 429 throttling, but it does not make a single call that generates five responses faster.","Incorrect: a higher max_tokens allows the model to generate more tokens and does not reduce latency."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/latency"},{"id":"3.2.1-04","obj":"3.2.1","difficulty":"easy","type":"single","stem":"Relecloud has a travel agent that calls a get_weather function. When a user asks for the weather in three cities, the agent makes three separate model round trips, one function call per round trip. You use a model deployment that supports multiple tool calls in one response.\n\nWhat should you use to reduce the number of round trips?","choices":["Parallel function calling","The tool_choice parameter set to none","Streaming with stream set to true","A higher max_tokens value"],"answer":[0],"explanation":"With parallel function calling, the model requests multiple function calls in a single response. The results are returned together, so fewer API calls are needed and the task finishes faster.","rationale":["Correct: parallel function calling bundles multiple tool calls in one response and reduces the number of round trips.","Incorrect: tool_choice none forces the model not to call any function.","Incorrect: streaming only shortens the time to the first token, not the number of round trips.","Incorrect: a higher max_tokens does not change the number of function calls and increases the rate-limit estimate."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/function-calling#function-calling-support"},{"id":"3.2.1-05","obj":"3.2.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank runs a classification agent that sets max_tokens to 4000 on every request. Actual responses are about 150 tokens. Azure Monitor shows billed token usage at 40 percent of the deployment TPM limit, yet the agent receives frequent HTTP 429 responses. You must reduce the 429 responses without requesting more quota.\n\nWhat should you do?","choices":["Lower max_tokens to a value close to the expected response size.","Enable streaming on every request.","Increase the SDK max_retries value to 10.","Move the deployment to a different region in the same subscription."],"answer":[0],"explanation":"The TPM check on receipt uses an estimate that includes the prompt plus max_tokens, not the billed usage. A max_tokens of 4000 therefore counts in full, even for short responses. Setting max_tokens close to the expected size lowers the estimated load.","rationale":["Correct: the rate limit counts the prompt plus max_tokens; a lower max_tokens reduces the estimated tokens per request.","Incorrect: streaming only shortens the time to the first token and does not change the TPM estimate based on max_tokens.","Incorrect: more retries increase the number of requests, and failed requests also count toward the limit.","Incorrect: a different region requires a new deployment and quota allocation and does not address the cause."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/quota#understanding-rate-limits"},{"id":"3.2.1-06","obj":"3.2.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has an orchestrator agent that fans out to 40 subagents at the same instant when a research task starts. The shared deployment has a 600 RPM limit, and the solution sends about 200 requests per minute in total. The subagents still receive HTTP 429 responses at the start of each task. The parallel design must be kept to minimize task duration.\n\nWhat should you do?","choices":["Cap concurrent subagent calls and spread the requests over each minute.","Convert the fan-out to a sequential chain of subagents that run one at a time.","Increase max_tokens on each subagent request so fewer calls are needed.","Submit the subagent requests to a Global Batch deployment instead."],"answer":[0],"explanation":"Azure OpenAI evaluates RPM over short intervals of 1 or 10 seconds and expects an even distribution. 40 requests in one second exceed the 10 requests per second of a 600-RPM deployment. Capped concurrency and pacing keep the parallelism without hitting the burst limit.","rationale":["Correct: capping concurrent calls keeps the traffic under the short-interval limit while the task stays parallel.","Incorrect: running sequentially prevents bursts, but it lengthens the task duration and violates the requirement to keep the parallel design.","Incorrect: a higher max_tokens increases the TPM estimate and makes throttling worse.","Incorrect: Global Batch targets 24 hours and does not fit an interactive research task."],"ref":"https://learn.microsoft.com/azure/ai-foundry/openai/how-to/quota#understanding-rate-limits"},{"id":"3.2.1-07","obj":"3.2.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank routes all model calls from its agents through Azure API Management. The agents use one Standard deployment in East US that is already assigned the full quota for the model in that region, and HTTP 429 responses still occur at peak load. You add a deployment of the same model in a second region. You need to increase the total throughput available to the agents by using both deployments at the same time.\n\nWhich API Management configuration should you use?","choices":["A backend pool that uses round-robin load balancing across both deployments","A backend pool that uses priority-based load balancing with East US as the top priority","A circuit breaker rule on the East US backend that trips on HTTP 429 responses","A retry policy that retries throttled requests against the East US backend"],"answer":[0],"explanation":"Azure OpenAI quota applies per region, so a second region provides extra TPM and RPM. A backend pool with round-robin distributes the requests evenly across both deployments, so both deliver throughput at the same time.","rationale":["Correct: round-robin distributes the load across both regional deployments and adds their quotas together.","Priority-based uses the lower-priority group only when all higher-priority backends are unavailable; that is failover, not simultaneous use.","A circuit breaker temporarily takes a backend out of rotation, but on its own it does not distribute load across both deployments.","Retries against the same full deployment do not increase the total throughput."],"ref":"https://learn.microsoft.com/azure/api-management/backends"},{"id":"3.2.1-08","obj":"3.2.1","difficulty":"medium","type":"single","stem":"Margie's Travel has a research agent that calls a reasoning model through the Azure OpenAI Responses API. Complex requests take several minutes. A network gateway between the agent and the model closes connections that stay open for longer than 100 seconds, so these requests fail. The reasoning depth must not be reduced, and the agent must be able to retrieve the result after the request is accepted.\n\nWhat should you do?","choices":["Set background to true and poll the response until it reaches a terminal state.","Set stream to true without background mode and reconnect when the connection drops.","Set reasoning_effort to minimal so that each response finishes within 100 seconds.","Set parallel_tool_calls to true so that the model finishes each request faster."],"answer":[0],"explanation":"Background mode processes long-running tasks asynchronously: the service immediately returns a response ID with status queued, and you poll until a terminal state. This avoids timeouts without shortening the reasoning; background mode does require store=true.","rationale":["Correct: with background=true, no connection stays open for minutes, and you retrieve the result later by using the response ID.","Streaming without background mode cannot be resumed after a dropped connection; resuming works only for background responses that were started with stream=true.","Minimal reasoning effort shortens processing, but it reduces the reasoning depth, which is not allowed.","Parallel tool calls do not reliably shorten the duration to under 100 seconds and do not solve the timeout problem."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/responses#background-tasks"},{"id":"3.2.1-09","obj":"3.2.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. wraps every model call of its research agent in a custom retry library that retries up to five times with exponential backoff. The Azure OpenAI Python SDK client is created with default settings. During throttling events, the deployment receives far more requests than five attempts per call, and the throttling lasts longer.\n\nWhat should you do?","choices":["Set max_retries to 0 on the SDK client.","Increase max_retries on the SDK client to match the custom library.","Remove the random jitter from the custom backoff.","Retry immediately in the custom library and skip the backoff delay."],"answer":[0],"explanation":"The openai SDK has two built-in retries by default. Each attempt of the custom retry library can therefore trigger two more SDK retries, which multiplies the number of requests. Failed requests count toward the limit, so set max_retries=0 when you use your own retry logic.","rationale":["Correct: Microsoft recommends disabling the built-in SDK retry when you use a custom retry library; otherwise the attempts stack up.","Incorrect: more SDK retries multiply the number of requests even further.","Incorrect: without jitter, all clients retry at the same time, which makes throttling worse.","Incorrect: retrying immediately without backoff makes throttling worse because failed requests also count."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/quota#understanding-rate-limits"},{"id":"3.2.1-10","obj":"3.2.1","difficulty":"hard","type":"multi","stem":"A. Datum Corporation has a back-office workflow with five steps. Steps 2, 3, and 4 each call a separate agent that reads the output of step 1 and generates a long report. Step 5 merges the three reports. Today all steps run in sequence, and no user watches the output while it is generated. Results are needed within two minutes of the request.\n\nWhich two actions should you perform to reduce the end-to-end task duration? Each correct answer presents part of the solution.","choices":["Run steps 2, 3, and 4 concurrently and merge their results in step 5.","Reduce the generated output size by lowering max_tokens and adding stop sequences.","Enable streaming on the requests of steps 2, 3, and 4.","Submit steps 2, 3, and 4 to a Global Batch deployment.","Run step 5 concurrently with steps 2, 3, and 4."],"answer":[0,1],"explanation":"Running independent steps in parallel (fan-out/fan-in) shortens the total duration. Because generating tokens is the slowest part, less output (lower max_tokens, stop sequences) reduces the latency per call. Streaming does not change the total time, and Batch does not meet the two-minute requirement.","rationale":["Correct: steps 2, 3, and 4 are independent of each other and can run in parallel with a fan-in at step 5.","Correct: fewer generated tokens means shorter generation, because generation proceeds token by token.","Incorrect: streaming only shortens the time to the first token; with no user watching, it gains nothing.","Incorrect: Global Batch targets 24 hours and does not meet the two-minute requirement.","Incorrect: step 5 needs the three reports and can run only after the fan-in."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/latency#improve-performance"},{"id":"3.2.1-11","obj":"3.2.1","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. has a Global Provisioned deployment named Deploy1 that serves its agents. You plan to configure spillover for all requests on Deploy1 and then confirm that spillover works. The Foundry resource has no other deployments yet.\n\nYou need to perform the following actions:\n\n1. Create a Global Standard deployment of the same model and version in the same Foundry resource.\n2. Set the spilloverDeploymentName property on Deploy1.\n3. Send test traffic and check responses for the x-ms-spillover-from-deployment header.\n4. Review the standard deployment metrics by using the IsSpillover split.\n\nWhich sequence of actions should you perform?","choices":["1, 2, 3, 4","2, 1, 3, 4","1, 3, 2, 4","4, 1, 2, 3"],"answer":[0],"explanation":"Spillover first requires a pay-as-you-go deployment with the same model and version in the same resource. Then you set spilloverDeploymentName on the provisioned deployment. Only after that can you recognize spillover requests by the header and monitor them with the IsSpillover split.","rationale":["Correct: first create the target, then enable spillover, then validate and monitor.","Incorrect: spilloverDeploymentName must refer to an existing standard deployment; it does not exist yet.","Incorrect: before spillover is enabled, the spillover header does not appear, so this test proves nothing.","Incorrect: viewing metrics before the standard deployment and spillover exist yields no spillover data."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/spillover-traffic-management"},{"id":"3.2.1-12","obj":"3.2.1","difficulty":"hard","type":"single","stem":"Wide World Importers routes six agent applications through Azure API Management to one Azure OpenAI deployment. All applications run in the same Azure Container Apps environment and reach API Management through one shared outbound IP address. Each application has its own API Management subscription. You must enforce a tokens-per-minute limit per application and reduce requests that reach the backend when the prompt already exceeds the limit. You start with the following policy.\n\n```xml\n<llm-token-limit\n    counter-key=\"KEY\"\n    tokens-per-minute=\"20000\"\n    estimate-prompt-tokens=\"ESTIMATE\" />\n```\n\nWhich values should you use for KEY and ESTIMATE?","choices":["KEY: @(context.Subscription.Id) -- ESTIMATE: true","KEY: @(context.Subscription.Id) -- ESTIMATE: false","KEY: @(context.Request.IpAddress) -- ESTIMATE: true","KEY: @(context.Request.IpAddress) -- ESTIMATE: false"],"answer":[0],"explanation":"All apps share one outbound IP address, so the IP is not a usable key; the subscription ID does distinguish the apps. With estimate-prompt-tokens=true, API Management estimates the prompt tokens in advance and blocks requests that already exceed the limit, so fewer requests reach the backend (at the cost of some performance).","rationale":["Correct: counting per subscription and estimating prompt tokens in advance meets both requirements.","Incorrect: without estimation, prompts are sent to the backend and are blocked only after the response.","Incorrect: with a shared IP address, all apps share one counter and there is no limit per app.","Incorrect: a shared IP address gives no limit per app, and without estimation requests still reach the backend."],"ref":"https://learn.microsoft.com/azure/api-management/llm-token-limit-policy#considerations-for-token-counts-and-estimation"},{"id":"3.2.2-01","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Lucerne Publishing has an editorial assistant built with Microsoft Agent Framework that keeps its own in-memory chat history. The agent uses SlidingWindowStrategy with keep_last_groups set to 20. In long sessions, the agent forgets the style rules that the user stated early in the conversation. You must keep the earlier context in condensed form while staying within the token budget.\n\nWhich compaction strategy should you use instead?","choices":["SummarizationStrategy","TruncationStrategy","SlidingWindowStrategy with keep_last_groups set to 10","SelectiveToolCallCompactionStrategy"],"answer":[0],"explanation":"This is sliding-window amnesia: a sliding window discards older groups entirely, including the early style rules. SummarizationStrategy replaces older parts with an LLM-generated summary and so retains key facts and preferences with fewer tokens.","rationale":["Correct: summarization condenses older context into a summary instead of discarding it.","Incorrect: truncation also removes the oldest groups entirely and is intended as an emergency brake for the token budget.","Incorrect: a smaller window drops even more early context and makes the amnesia worse.","Incorrect: this strategy removes only old tool-call groups and does not touch user messages."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-02","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Trey Research has a support agent that retrieves knowledge from an Azure AI Search index by using vector queries only. Users often search for part numbers such as PN-7731-B and for engineer names. The agent frequently retrieves semantically similar but wrong documents for these queries.\n\nWhat should you use to improve retrieval for these queries?","choices":["A hybrid query that combines full-text search and vector search","A vector query with a higher k value","Exhaustive KNN instead of HNSW for the vector field","A larger embedding model for the document vectors while the query vectors keep the current model"],"answer":[0],"explanation":"This is vector-only recall: embeddings match exact identifiers and names poorly. Hybrid search runs full-text and vector search in parallel and merges the results with RRF, so exact matches on part numbers and names are found.","rationale":["Correct: hybrid search combines the precision of keyword search with the semantics of vector search.","Incorrect: retrieving more vector results does not fix the fact that embeddings represent exact codes poorly.","Incorrect: exhaustive KNN improves the accuracy of nearest neighbors, but it still measures semantic similarity.","Incorrect: query and document vectors must use the same model; a different model for documents only breaks the comparison."],"ref":"https://learn.microsoft.com/azure/search/hybrid-search-overview"},{"id":"3.2.2-03","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Tailspin Toys has a code review agent built with Microsoft Agent Framework for Python. The agent keeps its own in-memory history and uses a TruncationStrategy with max_n=100_000, compact_to=80_000, and the CharacterEstimatorTokenizer. The model has a 128,000-token context window. Most content is source code and JSON.\n\nRequests intermittently fail because the context window is exceeded. The usage data shows that the actual prompt token counts are much higher than the estimates of the strategy. The agent must keep using as much of the context window as possible.\n\nWhat should you do?","choices":["Pass a tokenizer that implements TokenizerProtocol for the encoding of the model.","Lower max_n to 50_000 and compact_to to 40_000 in the TruncationStrategy.","Replace the TruncationStrategy with SlidingWindowStrategy(keep_last_groups=20).","Add a ToolResultCompactionStrategy before the TruncationStrategy."],"answer":[0],"explanation":"The CharacterEstimatorTokenizer estimates tokens with a heuristic of 4 characters per token. For code and JSON, this estimate deviates strongly, so the strategy compacts too late. With a custom tokenizer for the encoding of the model, the strategy counts accurately and the context window stays optimally used.","rationale":["Correct: a model-specific tokenizer gives accurate token counts, so the thresholds of the strategy are correct.","Incorrect: lower thresholds might prevent the error, but they leave a large part of the context window unused.","Incorrect: a sliding window counts groups and not tokens, so the budget is not reliably enforced.","Incorrect: extra compaction of tool results does not fix the incorrect token measurement."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-04","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a Python agent built with Microsoft Agent Framework that keeps its conversation history in memory and calls several tools. A custom function trims the history to the 30 most recent messages. Since the function was added, some model calls fail because a tool result message remains in the history without the assistant message that contains the matching function call.\n\nYou need a hard token-budget backstop that removes the oldest content first, keeps function calls and their results together, and does not require an extra LLM call.\n\nWhich compaction strategy should you use?","choices":["TruncationStrategy","SummarizationStrategy","ToolResultCompactionStrategy","SelectiveToolCallCompactionStrategy"],"answer":[0],"explanation":"Compaction works with atomic message groups: an assistant message with function calls and the matching tool results together form a tool_call group that is removed only as a whole. TruncationStrategy removes the oldest non-system groups, respects those boundaries, and is intended as a backstop for a message or token budget without an LLM.","rationale":["Correct: truncation removes the oldest groups as a whole and is the recommended backstop for a hard token budget.","Incorrect: summarization requires a separate LLM client for the summary.","Incorrect: this strategy collapses older tool-call groups into summary messages and leaves user and assistant messages untouched, so it is not a hard budget limit.","Incorrect: this strategy fully excludes older tool-call groups only; a long conversation without tool calls can still exceed the budget."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction?pivots=programming-language-python"},{"id":"3.2.2-05","obj":"3.2.2","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. has a negotiation agent that uses SummarizationStrategy with the default prompt. After several compaction cycles, the summary no longer contains the approved discount percentage and the contract ID, and later answers contradict earlier commitments. The agent must stay within the same token budget.\n\nWhat should you do to reduce this summary drift?","choices":["Provide a custom summarization prompt that preserves figures and IDs.","Replace SummarizationStrategy with a TruncationStrategy on the same budget.","Replace SummarizationStrategy with SelectiveToolCallCompactionStrategy.","Remove compaction and send the full chat history on every call."],"answer":[0],"explanation":"Summary drift occurs when successive summaries lose details. SummarizationStrategy accepts a custom prompt, so you can control which facts the summary must retain. This keeps critical figures and IDs within the same budget.","rationale":["Correct: a custom summarization prompt defines which critical details always stay in the summary.","Incorrect: truncation removes the oldest messages entirely, so the commitments will certainly disappear.","Incorrect: this strategy removes only tool-call groups and does not fix the loss in the summary.","Incorrect: the full history eventually exceeds the context window and violates the token budget."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-06","obj":"3.2.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. uses a Microsoft Agent Framework handoff workflow with an order agent and a refund agent. The order agent calls a lookup_order tool that returns the order number and purchase date, and then hands off to the refund agent. The refund agent asks the user for the order number again, even though the order agent already retrieved it.\n\nWhat should you do to maintain entity continuity across the handoff?","choices":["Have the order agent restate the order number and purchase date in its reply before the handoff.","Disable return-to-previous routing so user replies go through the start agent.","Increase keep_last_tool_call_groups in the compaction strategy of the refund agent.","Replace the handoff workflow with a concurrent orchestration of both agents."],"answer":[0],"explanation":"In a handoff orchestration, agents broadcast only user and agent messages to the other participants. Tool-related content, such as the results of lookup_order, is not shared. By repeating the data in the reply message, it does reach the context of the refund agent.","rationale":["Correct: only user and agent messages are synchronized, so the entities must be in a message.","Incorrect: return-to-previous determines only which agent receives a user reply, not which context is shared.","Incorrect: the tool results are not in the history of the refund agent, so compaction settings there do not help.","Incorrect: concurrent orchestration lets agents work independently in parallel and does not pass context from one agent to the other."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff#context-synchronization"},{"id":"3.2.2-07","obj":"3.2.2","difficulty":"medium","type":"single","stem":"Fourth Coffee has an agent that uses a Foundry Agent Service memory store. At each turn, the agent calls search_memories with items set to the latest user message. When a user opens a new conversation with a short greeting, the agent fails to apply the stored language preference of the user.\n\nWhat should you do?","choices":["At conversation start, call search_memories with only the user scope.","Increase the default TTL of the memory store to keep memories longer.","Disable chat summary memory in the memory store configuration.","Store the language preference as procedural memory instead."],"answer":[0],"explanation":"User profile memories often cannot be retrieved through semantic similarity with a short message: this is vector-only recall. Microsoft recommends injecting static memories at the start of each conversation by using search_memories with a scope and without items.","rationale":["Correct: search_memories with only a scope returns the user profile memories that belong to that scope.","Incorrect: TTL determines how long memories are kept; the preference already exists but is not retrieved.","Incorrect: disabling chat summary memory does not change the semantic retrieval of profile data.","Incorrect: procedural memory is for reusable ways of working, not for personal preferences."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/memory-usage#use-memories-via-apis"},{"id":"3.2.2-08","obj":"3.2.2","difficulty":"medium","type":"single","stem":"Humongous Insurance configures a compaction strategy in Microsoft Agent Framework for an agent that runs as a Foundry agent with server-side conversation state. Long conversations still reach the context limit, and logs show that the compaction strategy has no effect.\n\nWhat should you conclude?","choices":["Compaction has no effect because the Foundry service manages the agent context.","The compaction trigger threshold is set too high for the conversation.","The CharacterEstimatorTokenizer underestimates the token count of each message.","The compaction strategy must be registered on each tool instead of the agent."],"answer":[0],"explanation":"Compaction works only for agents that keep their own history in memory and send it with each call. For service-managed agents, such as Foundry Agents or the Responses API with store enabled, the service manages the context and a compaction strategy has no effect.","rationale":["Correct: the documentation explicitly names Foundry Agents as service-managed, where compaction has no effect.","Incorrect: a trigger that is too high would make compaction start later, but the logs show that the strategy never has an effect.","Incorrect: an inaccurate tokenizer affects when compaction happens, not whether it works with service-managed context.","Incorrect: compaction is registered on the agent or chat client, not per tool."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-09","obj":"3.2.2","difficulty":"hard","type":"single","stem":"Relecloud has a research agent built with Microsoft Agent Framework for Python that keeps its own in-memory history. The agent uses the following strategy.\n\n```python\nsummarization = SummarizationStrategy(\n    client=summarizer_client,\n    target_count=4,\n    threshold=2,\n)\n```\n\nEvery older message group in the history is a tool-call group of about 12,000 estimated tokens because the tools return full reports. In long sessions, the non-system message count is far above 6, but the history is never summarized and no error is raised. The summary must keep the tool trajectory, including tool arguments and results.\n\nWhat should you do?","choices":["Set max_summary_input_tokens to a value that is larger than the largest message group.","Lower target_count to 2 so that more of the older groups become eligible for summarization.","Lower threshold to 0 so that summarization triggers as soon as the count exceeds target_count.","Use a summarizer deployment with a larger context window for summarizer_client."],"answer":[0],"explanation":"SummarizationStrategy by default limits the prompt for the summarizer to 8,000 estimated tokens and selects only complete message groups. If no complete group fits in that budget, summarization is skipped and the history stays unchanged. By raising max_summary_input_tokens (or setting it to None), the large tool-call groups fit again, and the summarizer then also receives tool arguments and results.","rationale":["Correct: with a larger input budget, the groups of 12,000 tokens fit and the strategy can summarize again.","Incorrect: target_count determines how many recent messages stay; the input budget of 8,000 tokens keeps blocking the groups.","Incorrect: the trigger already fires; the problem is that no group fits in the input budget.","Incorrect: the budget of 8,000 tokens is applied by the strategy itself, independent of the context window of the summarizer model."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-10","obj":"3.2.2","difficulty":"hard","type":"multi","stem":"Lamna Healthcare Company has a clinical knowledge agent that queries an Azure AI Search index with vector queries only. Clinicians search for drug codes, dates, and physician names, and the agent often misses exact matches. The team also wants the most relevant passages ranked at the top before they are passed to the model.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Send hybrid queries that include both the search parameter and vectorQueries.","Apply semantic ranking to the hybrid results and set k to at least 50.","Increase the dimensions of the document embeddings and keep the current query embeddings.","Switch the vector field from HNSW to exhaustive KNN.","Lower the vector similarity threshold to return more vector matches."],"answer":[0,1],"explanation":"Hybrid search catches exact matches on codes, dates, and names through full-text and combines them with vector search through RRF. Semantic ranking then improves the order; Microsoft recommends setting k to at least 50 so the ranker has enough input.","rationale":["Correct: a hybrid query with search and vectorQueries adds keyword precision for exact identifiers.","Correct: semantic ranking reorders the best passages; with a k of at least 50, the ranker gets enough documents.","Incorrect: changing only the document vectors breaks the comparison with query vectors and does not fix exact matches.","Incorrect: exhaustive KNN makes nearest-neighbor search more exact, but it remains semantic and misses exact codes.","Incorrect: allowing more vector matches adds more semantic noise, not exact matches."],"ref":"https://learn.microsoft.com/azure/search/hybrid-search-how-to-query#troubleshoot-hybrid-queries"},{"id":"3.2.2-11","obj":"3.2.2","difficulty":"hard","type":"single","stem":"Alpine Ski House uses a TokenBudgetComposedStrategy in Python for an agent with a 16,000-token budget. You must apply compaction from the least aggressive to the most aggressive strategy so that context is lost only when gentler steps fail to meet the budget.\n\nYou plan to include the following strategies:\n\n1. SlidingWindowStrategy(keep_last_groups=20)\n2. ToolResultCompactionStrategy(keep_last_tool_call_groups=1)\n3. SummarizationStrategy(client=summarizer_client, target_count=4, threshold=2)\n\nWhich order should you use in the strategies list?","choices":["2, 3, 1","1, 3, 2","3, 2, 1","2, 1, 3"],"answer":[0],"explanation":"Strategies in a TokenBudgetComposedStrategy run in order; put the mildest first. First collapse tool results, then summarize older parts, and only then apply a sliding window. A built-in fallback removes the oldest groups if the budget is still not met.","rationale":["Correct: from mild (tool results) through medium (summarization) to aggressive (sliding window).","Incorrect: a sliding window as the first step immediately drops entire context.","Incorrect: summarizing before tool output is collapsed costs an unnecessary LLM call and also summarizes verbose tool output.","Incorrect: the sliding window before summarization drops context that the summary could have retained."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/conversations/compaction"},{"id":"3.2.2-12","obj":"3.2.2","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines creates a Python harness agent for long-running tool loops by using the following code.\n\n```python\nagent = create_harness_agent(\n    client,\n    max_context_window_tokens=128_000,\n)\n```\n\nDuring long runs, the requests exceed the model context window, and no compaction is observed. You must enable the default context-window compaction with the least configuration.\n\nWhat should you do?","choices":["Add the max_output_tokens parameter to the create_harness_agent call.","Add the disable_compaction parameter set to True.","Lower max_context_window_tokens to 64_000.","Pass a custom history_provider to the create_

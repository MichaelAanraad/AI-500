euringspunt wanneer het hele plan beoordeeld moet worden.","rationale":["Juist: plan review pauzeert na de planningsfase zodat een mens het plan kan goedkeuren of reviseren.","Onjuist: tool approval keurt losse tool-calls tijdens uitvoering goed, niet het plan vooraf.","Onjuist: max_reset_count beperkt het aantal herplanningen en voegt geen menselijke review toe.","Onjuist: intermediate outputs maken bijdragen zichtbaar maar laten niemand het plan goedkeuren."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/magentic"},{"id":"2.4.2-04","obj":"2.4.2","difficulty":"medium","type":"single","stem":"Lamna Healthcare Company runs an Agent Framework workflow that pauses for a manager to approve high-cost procedures. Approvals can arrive several days later, and the host process is restarted nightly. The workflow must resume with the pending approval request intact and without repeating completed agent work.\n\nWhat should you do?","choices":["Configure checkpoint storage, restore the latest checkpoint, and respond to the re-emitted request","Keep the workflow process running and hold the pending request in memory","Rerun the workflow from the beginning with the original input after the approval arrives","Store the approval decision in the agent instructions before the next run"],"answer":[0],"explanation":"Bij een checkpoint worden openstaande requests mee opgeslagen. Na het herstellen van een checkpoint worden ze opnieuw ge-emit als request-events, zodat je ze kunt beantwoorden en de workflow verdergaat zonder eerder werk opnieuw te doen.","rationale":["Juist: checkpoints bewaren de pending request en de voortgang, waardoor hervatten na herstart mogelijk is.","Onjuist: in-memory state gaat verloren bij de nachtelijke herstart.","Onjuist: opnieuw starten herhaalt het al voltooide agentwerk, wat expliciet niet mag.","Onjuist: instructies zijn geen mechanisme om een openstaand workflow-request te beantwoorden."],"ref":"https://learn.microsoft.com/agent-framework/workflows/human-in-the-loop"},{"id":"2.4.2-05","obj":"2.4.2","difficulty":"medium","type":"single","stem":"Lucerne Publishing builds a Python sequential workflow by using SequentialBuilder with a drafting agent followed by a publishing agent. After the drafting agent responds, a human editor must review the draft and be able to supply corrections that override the draft before the publishing agent starts.\n\nWhat should you do?","choices":["Call with_request_info() for the drafting agent on the sequential workflow","Decorate the publishing tool with @tool(approval_mode=\"always_require\")","Enable autonomous mode on a handoff workflow that contains both agents","Call with_request_info() on a concurrent workflow that contains both agents"],"answer":[0],"explanation":"Met with_request_info() pauzeert een sequentiele workflow na de response van specifieke agents, zodat externe input zoals menselijke review binnenkomt voordat de volgende agent begint. Tool approval kan alleen een tool-call goed- of afkeuren, niet de inhoud van een draft overschrijven.","rationale":["Juist: request info na de drafting agent laat de editor feedback of correcties geven voordat publicatie start.","Onjuist: tool approval laat alleen accepteren of weigeren van een specifieke tool-call toe, geen inhoudelijke override van de draft.","Onjuist: autonomous mode laat agents juist doorgaan zonder menselijke input.","Onjuist: een concurrent workflow voert de agents parallel uit, terwijl publicatie na de draft moet komen."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/sequential"},{"id":"2.4.2-06","obj":"2.4.2","difficulty":"medium","type":"single","stem":"Proseware, Inc. runs a hosted agent that uses tools from a Foundry toolbox. The tools/list response marks a payment tool with require_approval set to always. The agent instructions tell the model to ask the user before calling the tool, but audits show that the tool was invoked without user approval.\n\nWhat should you do?","choices":["Enforce the approval in the agent runtime before each invocation of the tool","Strengthen the agent instructions so that the model asks for confirmation before each call","Rely on the toolbox MCP endpoint to block tools/call until approval is granted","Change the require_approval value of the payment tool to never in the toolbox"],"answer":[0],"explanation":"Het toolbox MCP-endpoint blokkeert tools/call niet wanneer require_approval op always staat; de agent runtime moet de instelling voor elke aanroep afdwingen. Een systeemprompt alleen dwingt geen goedkeuring af.","rationale":["Juist: de runtime moet de exacte pending call pauzeren, de beslissing ophalen en pas daarna uitvoeren of weigeren.","Onjuist: een promptinstructie is geen afdwingbare controle, zoals de audit al laat zien.","Onjuist: het toolbox-endpoint blokkeert de aanroep juist niet; daar vertrouwen is de oorzaak van het probleem.","Onjuist: goedkeuring uitschakelen voor een betaaltool verwijdert de vereiste menselijke controle."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/use-toolbox-hosted-agent"},{"id":"2.4.2-07","obj":"2.4.2","difficulty":"hard","type":"single","stem":"Coho Winery creates a Foundry Agent Service agent that uses an MCP tool. Write operations on the MCP server must be approved by a developer before they run.\n\nYou need to implement the approval flow.\n\nWhich sequence of actions should you perform?","choices":["Create the agent with an mcp tool that requires approval -> Send the user request -> Review the tool name and arguments in the mcp_approval_request output item -> Submit the approval by using previous_response_id with approve set to true","Send the user request -> Create the agent with an mcp tool that requires approval -> Submit the approval by using previous_response_id with approve set to true -> Review the tool name and arguments in the mcp_approval_request output item","Create the agent with an mcp tool that requires approval -> Submit the approval by using previous_response_id with approve set to true -> Send the user request -> Review the tool name and arguments in the mcp_approval_request output item","Create the agent with an mcp tool that requires approval -> Send the user request -> Submit the approval by using previous_response_id with approve set to true -> Review the tool name and arguments in the mcp_approval_request output item"],"answer":[0],"explanation":"Eerst configureer je de mcp-tool met require_approval. Wanneer het model een tool wil aanroepen, krijg je een output item van het type mcp_approval_request met toolnaam en argumenten; pas na review stuur je de goedkeuring met previous_response_id en approve op true.","rationale":["Juist: configureren, aanvragen, de approval request beoordelen en daarna goedkeuren is de gedocumenteerde volgorde.","Onjuist: je kunt geen request versturen naar een agent die nog niet bestaat, en goedkeuren voor review is onveilig.","Onjuist: een goedkeuring vooraf heeft geen previous response om naar te verwijzen; er is nog geen approval request.","Onjuist: goedkeuren voordat je toolnaam en argumenten beoordeelt maakt de menselijke controle zinloos."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"},{"id":"2.4.2-08","obj":"2.4.2","difficulty":"hard","type":"multi","stem":"Alpine Ski House designs a multi-agent maintenance solution. Agents read telemetry continuously, and some agents can shut down ski lifts. Low-risk actions must proceed without waiting for people. A maker-checker loop drafts shutdown plans and must not loop indefinitely when the checker keeps rejecting the plan. When a mandatory approval is pending, the orchestration must resume without replaying earlier agent work.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Scope human approval gates to the specific shutdown tool invocations","Set an iteration cap on the maker-checker loop and escalate to a human reviewer when the cap is reached","Persist the orchestration state at each mandatory approval checkpoint","Require human approval of every agent output before the next agent runs","Keep the orchestration state in memory until the approver responds"],"answer":[0,1,2],"explanation":"HITL-gates kun je beperken tot gevoelige tool-aanroepen zodat de orchestration voor laag-risico acties autonoom doorgaat. Een maker-checker loop heeft een iteratielimiet met fallback zoals escalatie naar een mens nodig, en verplichte gates maken de stap synchroon, dus persist je de state om zonder replay te hervatten.","rationale":["Juist: gates op specifieke tool-aanroepen houden laag-risico acties autonoom.","Juist: een iteratielimiet met escalatie voorkomt eindeloze verfijningsloops.","Juist: state persisteren bij verplichte gates maakt hervatten zonder herhaling mogelijk.","Onjuist: elke output laten goedkeuren blokkeert ook laag-risico acties, wat in strijd is met de eis.","Onjuist: in-memory state overleeft geen onderbreking en dwingt replay van eerder werk af."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.2-09","obj":"2.4.2","difficulty":"hard","type":"single","stem":"Blue Yonder Airlines builds a C# booking solution by using AgentWorkflowBuilder.BuildSequential with a booking agent and a confirmation agent. The reservation tool is wrapped with ApprovalRequiredAIFunction. A new edge case requires the workflow to ask the user a typed question to collect missing passenger details at a fixed point before the booking agent runs, and the explicit order of executors must be preserved.\n\nWhat should you do?","choices":["Add a RequestPort before the booking executor in a custom WorkflowBuilder workflow","Wrap the passenger lookup tool with ApprovalRequiredAIFunction","Rebuild the workflow as a handoff workflow with autonomous mode enabled","Increase MaximumIterationsPerRequest on the function invoking chat client"],"answer":[0],"explanation":"Sequential orchestration ondersteunt tool approval, maar geen ingebouwde stap om vrije gebruikersinput tussen agents te vragen. Een custom WorkflowBuilder-workflow met een RequestPort stuurt op elk gewenst punt een getypeerde request naar de gebruiker en routeert het antwoord terug, met behoud van de expliciete volgorde.","rationale":["Juist: een RequestPort op een vaste plek in een custom workflow vraagt getypeerde input en behoudt de executorvolgorde.","Onjuist: tool approval laat alleen accepteren of weigeren van een tool-call toe, geen verzamelen van ontbrekende gegevens.","Onjuist: autonomous mode laat agents juist doorgaan zonder op de gebruiker te wachten.","Onjuist: meer function-iteraties lost het ontbreken van gebruikersinput niet op."],"ref":"https://learn.microsoft.com/agent-framework/workflows/human-in-the-loop"},{"id":"2.4.3-01","obj":"2.4.3","difficulty":"easy","type":"single","stem":"Fourth Coffee runs five agents on Azure OpenAI in Microsoft Foundry Models. Every request from an agent starts with the same 3,000-token block of instructions and tool definitions, followed by a unique user question. You need to reduce input token cost and latency without changing the model output.\n\nWhat should you do?","choices":["Keep the static instructions and tool definitions first and the user question last","Place the user question first so that the model reads it before the instructions","Add an llm-semantic-cache-lookup policy in Azure API Management in front of the deployment","Move the agent traffic to a Global Batch deployment that processes the requests"],"answer":[0],"explanation":"Prompt caching hergebruikt de verwerking van een identieke prefix van minimaal 1.024 tokens en heeft geen invloed op de output, alleen op latency en kosten. Statische content vooraan en dynamische content achteraan maximaliseert cache hits.","rationale":["Juist: een stabiele prefix met variabele content aan het einde levert prompt cache hits op zonder de output te veranderen.","Onjuist: variabele content vooraan veroorzaakt een cache miss omdat de eerste tokens per request verschillen.","Onjuist: semantic caching retourneert opgeslagen antwoorden; bij unieke vragen helpt dat weinig en het verandert de output.","Onjuist: Global Batch is asynchroon met een doorlooptijd tot 24 uur en past niet bij interactieve agents."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/prompt-caching"},{"id":"2.4.3-02","obj":"2.4.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. exposes a Foundry chat model to an FAQ agent through Azure API Management. Users ask the same questions with different wording, for example \"How do I reset my badge?\" and \"What are the steps to reset a badge?\". You need to return a stored response for prompts that are similar in meaning.\n\nWhich policy should you add to the inbound section?","choices":["llm-semantic-cache-lookup","cache-lookup-value","llm-token-limit","rate-limit-by-key"],"answer":[0],"explanation":"Met semantic caching in API Management retourneer je gecachte antwoorden voor identieke prompts en ook voor prompts die qua betekenis vergelijkbaar zijn. De llm-semantic-cache-lookup policy in de inbound sectie doet de lookup op basis van embeddings.","rationale":["Juist: deze policy zoekt op semantische gelijkenis via een embeddings-backend.","Onjuist: cache-lookup-value haalt een specifieke waarde op via een zelfgekozen key, zonder semantische vergelijking.","Onjuist: llm-token-limit beperkt tokengebruik per key en cachet geen antwoorden.","Onjuist: rate limiting beperkt het aantal calls maar cachet geen antwoorden."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-03","obj":"2.4.3","difficulty":"easy","type":"single","stem":"Graphic Design Institute has several agents that call a product catalog tool through Azure API Management. The tool is an HTTP GET operation that returns the complete catalog, which changes once per day. Agents send identical requests many times per hour.\n\nWhich caching policies should you configure?","choices":["cache-lookup in the inbound section and cache-store in the outbound section","llm-semantic-cache-lookup in the inbound section and llm-semantic-cache-store in the outbound section","cache-store-value in the inbound section and cache-lookup-value in the outbound section","cache-store in the inbound section and cache-lookup in the outbound section"],"answer":[0],"explanation":"Response caching met het paar cache-lookup en cache-store retourneert een volledige API-response voor een identiek GET-request zonder backend-call. Lookup hoort in inbound en store in outbound.","rationale":["Juist: identieke GET-requests met een volledige, langzaam veranderende response passen precies bij response caching.","Onjuist: de semantic cache policies zijn bedoeld voor LLM-requests, niet voor een REST-tool met identieke GET-calls.","Onjuist: value caching is voor losse waarden met eigen keys, en lookup hoort in inbound, niet in outbound.","Onjuist: de secties zijn omgedraaid; lookup moet inbound en store outbound staan."],"ref":"https://learn.microsoft.com/azure/api-management/caching-overview"},{"id":"2.4.3-04","obj":"2.4.3","difficulty":"medium","type":"single","stem":"Humongous Insurance enables prompt caching for an agent that uses an Azure OpenAI deployment. Each prompt is longer than 4,000 tokens, but cached_tokens in prompt_tokens_details is 0 for every request. The system message starts with the current timestamp and the user ID, followed by a long, static policy document.\n\nWhat should you do?","choices":["Move the timestamp and user ID to the end of the prompt","Set prompt_cache_retention to 24h on each request","Shorten the static policy document to fewer than 1,024 tokens","Move the deployment to a provisioned throughput deployment type"],"answer":[0],"explanation":"Voor een cache hit moeten de eerste 1.024 tokens identiek zijn; een verschil van een enkel teken veroorzaakt een cache miss met cached_tokens 0. Dynamische waarden zoals tijdstempel en user-ID horen achteraan.","rationale":["Juist: met de dynamische waarden achteraan wordt de statische policy de herbruikbare prefix.","Onjuist: langere retentie helpt niet als de prefix bij elk request verschilt.","Onjuist: prompts onder 1.024 tokens komen helemaal niet in aanmerking voor prompt caching.","Onjuist: het deployment type verandert niets aan de wisselende prefix die de cache miss veroorzaakt."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/prompt-caching"},{"id":"2.4.3-05","obj":"2.4.3","difficulty":"medium","type":"single","stem":"VanArsdel, Ltd. hosts a multi-tenant support agent. Each tenant calls the LLM API through Azure API Management by using its own subscription. You enable semantic caching, and a tenant reports receiving an answer that was generated for another tenant.\n\nWhat should you do?","choices":["Add a vary-by element that uses the subscription ID to the lookup policy","Lower the score-threshold value of the llm-semantic-cache-lookup policy","Set ignore-system-messages to true on the llm-semantic-cache-lookup policy","Increase the duration value of the llm-semantic-cache-store policy"],"answer":[0],"explanation":"Met vary-by partitioneer je de semantic cache, bijvoorbeeld per subscription-ID, zodat cache entries niet tussen tenants worden gedeeld. Een andere drempelwaarde of TTL lost het lekken tussen tenants niet op.","rationale":["Juist: vary-by op de subscription scheidt de cache per tenant.","Onjuist: een lagere drempel vereist meer gelijkenis maar kan nog steeds een antwoord van een andere tenant retourneren.","Onjuist: system messages negeren maakt de match juist ruimer en scheidt tenants niet.","Onjuist: een langere TTL houdt entries langer vast en vergroot het probleem."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-06","obj":"2.4.3","difficulty":"medium","type":"single","stem":"Wingtip Toys uses semantic caching in Azure API Management for a product advice agent. Users report that the agent sometimes returns answers to questions that are related to, but different from, the question they asked. You need cached responses to be returned only when prompts are very close in meaning.\n\nWhat should you do?","choices":["Decrease the score-threshold value of the llm-semantic-cache-lookup policy","Increase the score-threshold value of the llm-semantic-cache-lookup policy","Increase the duration value of the llm-semantic-cache-store policy","Increase the max-message-count value of the llm-semantic-cache-lookup policy"],"answer":[0],"explanation":"Het score-threshold attribuut bepaalt hoe dicht een prompt bij een gecachte prompt moet liggen. Een lagere drempel betekent dat prompts semantisch meer gelijk moeten zijn om een gecacht antwoord te krijgen.","rationale":["Juist: een lagere score-threshold vereist hogere semantische gelijkenis.","Onjuist: een hogere drempel laat juist minder gelijke prompts matchen en verergert het probleem.","Onjuist: de TTL bepaalt hoe lang entries bewaard blijven, niet hoe streng er gematcht wordt.","Onjuist: meer berichten meenemen verandert de vergelijkingsbasis maar maakt de match niet strenger."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-07","obj":"2.4.3","difficulty":"hard","type":"single","stem":"Consolidated Messenger configures semantic caching for an LLM API in Azure API Management. If the cache is unavailable, the backend model deployment must be protected from overload. Successful responses must be stored for 60 seconds.\n\n```xml\n<policies>\n  <inbound>\n    <llm-semantic-cache-lookup score-threshold=\"0.15\" embeddings-backend-id=\"embeddings-backend\" embeddings-backend-auth=\"system-assigned\">\n      <vary-by>@(context.Subscription.Id)<\/vary-by>\n    <\/llm-semantic-cache-lookup>\n    <!-- Slot 1 -->\n  <\/inbound>\n  <outbound>\n    <!-- Slot 2 -->\n  <\/outbound>\n<\/policies>\n```\n\nWhich elements should you insert at Slot 1 and Slot 2?","choices":["Slot 1: <rate-limit calls=\"10\" renewal-period=\"60\" /> Slot 2: <llm-semantic-cache-store duration=\"60\" />","Slot 1: <llm-semantic-cache-store duration=\"60\" /> Slot 2: <rate-limit calls=\"10\" renewal-period=\"60\" />","Slot 1: <rate-limit calls=\"10\" renewal-period=\"60\" /> Slot 2: <cache-store duration=\"60\" />","Slot 1: <cache-lookup vary-by-developer=\"false\" vary-by-developer-groups=\"false\" /> Slot 2: <llm-semantic-cache-store duration=\"60\" />"],"answer":[0],"explanation":"Na de cache lookup plaats je een rate-limit policy zodat de backend beschermd is als de cache niet beschikbaar is. De llm-semantic-cache-store policy hoort in de outbound sectie en slaat het antwoord op met de opgegeven duration.","rationale":["Juist: rate limiting direct na de lookup en semantic cache store in outbound voldoen aan beide eisen.","Onjuist: de store policy hoort in outbound, waar de response beschikbaar is; rate limiting hoort inbound.","Onjuist: cache-store hoort bij cache-lookup voor GET-requests en is niet het tegenstuk van de semantic lookup.","Onjuist: een extra cache-lookup beschermt de backend niet en is niet nodig naast de semantic lookup."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-08","obj":"2.4.3","difficulty":"hard","type":"multi","stem":"Datum Corporation plans to enable semantic caching for a Foundry chat model API that is imported into Azure API Management. Azure API Management already authenticates to the model by using a managed identity. The company has an existing Azure Managed Redis instance that was created without any modules.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Create a new Azure Managed Redis instance with the RediSearch module enabled and configure it as an external cache in Azure API Management","Create a backend in Azure API Management for an embeddings model deployment","Add llm-semantic-cache-lookup to the inbound section and llm-semantic-cache-store to the outbound section","Add the RediSearch module to the existing Azure Managed Redis instance","Add cache-lookup to the inbound section and cache-store to the outbound section of the chat completion operation"],"answer":[0,1,2],"explanation":"Semantic caching vereist een embeddings-deployment als backend, een Azure Managed Redis met RediSearch geconfigureerd als externe cache, en het paar llm-semantic-cache-lookup/store. RediSearch kan alleen bij het aanmaken van een nieuwe cache worden ingeschakeld.","rationale":["Juist: RediSearch is vereist en kan alleen op een nieuwe cache worden ingeschakeld; die cache moet als externe cache gekoppeld zijn.","Juist: de lookup policy verwijst via embeddings-backend-id naar een backend voor de embeddings API.","Juist: lookup inbound en store outbound vormen samen de semantic cache.","Onjuist: een module kan niet aan een bestaande Azure Managed Redis-cache worden toegevoegd.","Onjuist: cache-lookup en cache-store werken alleen voor identieke GET-requests en niet semantisch voor chat completions."],"ref":"https://learn.microsoft.com/azure/api-management/azure-openai-enable-semantic-caching"},{"id":"2.4.3-09","obj":"2.4.3","difficulty":"hard","type":"single","stem":"Woodgrove Bank builds an advisory agent whose answers must reflect the current account data of each customer. The agent sends a long, static compliance preamble with every request. The finance team wants to reduce model cost, but the risk team prohibits any cache that might return a response that was generated for a different request.\n\nWhich caching strategy should you implement?","choices":["Prompt caching with the static compliance preamble at the start of each prompt","Semantic caching in Azure API Management with vary-by set to the subscription ID","Response caching in Azure API Management by using cache-lookup and cache-store","Semantic caching in Azure API Management with a very low score-threshold value"],"answer":[0],"explanation":"Prompt caching hergebruikt alleen de verwerking van identieke input tokens en heeft geen invloed op de gegenereerde output. Semantic caching retourneert opgeslagen antwoorden op basis van gelijkenis en kan onjuiste of verouderde antwoorden opleveren, wat de risk-eis schendt.","rationale":["Juist: prompt caching verlaagt kosten voor de statische prefix terwijl elk antwoord vers wordt gegenereerd.","Onjuist: ook gepartitioneerd per subscription retourneert semantic caching opgeslagen antwoorden van andere requests.","Onjuist: response caching retourneert eveneens een eerder opgeslagen response in plaats van een nieuw antwoord.","Onjuist: een strengere drempel verkleint het risico maar retourneert nog steeds antwoorden van eerdere requests."],"ref":"https://learn.microsoft.com/azure/api-management/llm-semantic-cache-store-policy"},{"id":"2.4.4-01","obj":"2.4.4","difficulty":"easy","type":"single","stem":"Relecloud runs a nightly job in which a summarization agent processes 200,000 documents. Results are needed by the next business day. The job must cost as little as possible and must not consume the quota of the online agent deployments.\n\nWhich deployment type should you use for the summarization model?","choices":["Global Batch","Global Standard","Global Provisioned","Data Zone Standard"],"answer":[0],"explanation":"Global Batch verwerkt asynchrone groepen requests met een eigen enqueued token quota, een doel-doorlooptijd van 24 uur en 50% lagere kosten dan Global Standard. Online workloads worden daardoor niet verstoord.","rationale":["Juist: aparte quota, lagere kosten en een doorlooptijd binnen 24 uur passen bij een nachtelijke bulkjob.","Onjuist: Global Standard is real-time, duurder en gebruikt dezelfde quota als online workloads.","Onjuist: provisioned capaciteit is bedoeld voor voorspelbare, hoge real-time throughput en is niet de goedkoopste optie.","Onjuist: Data Zone Standard is een real-time deployment type zonder batchkorting."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/batch"},{"id":"2.4.4-02","obj":"2.4.4","difficulty":"easy","type":"single","stem":"Southridge Video uses a Magentic orchestration in Microsoft Agent Framework. The manager agent sometimes keeps invoking participant agents for a long time. You need to cap the total number of coordination rounds, regardless of whether the team is making progress.\n\nWhich setting should you configure?","choices":["max_round_count","max_stall_count","max_reset_count","intermediate_output_from"],"answer":[0],"explanation":"De Magentic builder biedt inner-loop limieten: maximaal aantal coordinatierondes, maximaal aantal opeenvolgende stalls voor herplanning en maximaal aantal plan-resets. max_round_count begrenst het totaal aantal rondes.","rationale":["Juist: max_round_count legt een harde bovengrens op het aantal coordinatierondes.","Onjuist: max_stall_count telt alleen opeenvolgende rondes zonder voortgang en triggert dan een herplanning.","Onjuist: max_reset_count begrenst het aantal herplanningen, niet het aantal rondes.","Onjuist: intermediate_output_from bepaalt welke deelnemers tussentijdse output tonen."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/magentic"},{"id":"2.4.4-03","obj":"2.4.4","difficulty":"easy","type":"single","stem":"Northwind Traders builds an inventory agent by using Microsoft Agent Framework in Python. The model often returns several tool calls in one assistant message. The tools update the same in-memory reservation object, and concurrent execution corrupts the object. The tools must still run in the order that the model requested.\n\nWhat should you do?","choices":["Set allow_concurrent_invocation to False in the function invocation configuration","Set max_iterations to 1 in the function invocation configuration","Set max_function_calls to 1 in the function invocation configuration","Set include_detailed_errors to True in the function invocation configuration"],"answer":[0],"explanation":"Function calls uit een enkel assistant message worden standaard concurrent uitgevoerd. Met allow_concurrent_invocation op False lopen ze in de volgorde van het model, wat nodig is wanneer tools gedeelde mutable state hebben.","rationale":["Juist: dit schakelt parallelle uitvoering uit en behoudt de volgorde van het model.","Onjuist: max_iterations op 1 beperkt het aantal model-roundtrips en verhindert dat de agent na tool-resultaten verder redeneert.","Onjuist: max_function_calls op 1 beperkt het totaal aantal calls, terwijl meerdere calls nodig zijn.","Onjuist: gedetailleerde foutmeldingen veranderen niets aan concurrent uitvoering."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/function-tools"},{"id":"2.4.4-04","obj":"2.4.4","difficulty":"medium","type":"single","stem":"Tailspin Toys deploys an Agent Framework workflow as a Foundry hosted agent. During a promotion, the agent must serve about 500 concurrent sessions. An engineer plans to configure minimum and maximum replica counts and a warm pool. Costs must stay proportional to actual usage.\n\nWhat should you do?","choices":["Right-size the per-session CPU and memory of the agent version","Set the minimum replica count to 500 before the promotion starts","Configure a warm pool that is sized for 500 concurrent sessions","Increase the maximum replica count of the hosted agent deployment"],"answer":[0],"explanation":"Hosted agents schalen per sessie: elke sessie krijgt een eigen VM-geisoleerde sandbox en er zijn geen replica-aantallen of warm pools te configureren. De CPU- en geheugeninstellingen gelden per sessie, dus overdimensioneren vermenigvuldigt de kosten met de concurrency.","rationale":["Juist: per sessie juist dimensioneren op basis van Application Insights houdt de kosten in lijn met het gebruik.","Onjuist: hosted agents kennen geen replica-aantal om te configureren.","Onjuist: er is geen warm pool om te dimensioneren; sessies worden op aanvraag aangemaakt.","Onjuist: expliciete replicaschaling is vervangen door automatische schaling per sessie."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agents"},{"id":"2.4.4-05","obj":"2.4.4","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. runs a concurrent orchestration that fans out each request to six analysis agents. All six agents call the same Global Standard model deployment, and the deployment returns HTTP 429 errors during peak hours. Results must still be produced in parallel to meet the latency target.\n\nWhat should you do?","choices":["Assign the agents to separate model deployments with their own quota","Convert the concurrent orchestration to a sequential orchestration","Increase the max_iterations value of the chat client of each agent","Move the six analysis agents to a single Global Batch deployment"],"answer":[0],"explanation":"Een gedeeld model-endpoint kan een single point of failure en rate limit vormen wanneer agents parallel draaien. Isolatie, zoals aparte deployments met eigen quota, behoudt de parallelle uitvoering zonder throttling.","rationale":["Juist: aparte deployments verdelen de belasting over meerdere quota en behouden parallellisme.","Onjuist: sequentieel uitvoeren vermindert throttling maar schendt de latency-eis.","Onjuist: meer iteraties per agent verhoogt juist het aantal model-calls.","Onjuist: Global Batch heeft geen real-time SLA en past niet bij een latency-doel."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.4-06","obj":"2.4.4","difficulty":"medium","type":"single","stem":"Coho Winery uses a Magentic orchestration for supply chain planning. When the team makes no progress for two consecutive rounds, the manager must automatically replan. The workflow must replan at most once before it stops.\n\nWhich configuration should you use?","choices":["max_stall_count=2 and max_reset_count=1","max_round_count=2 and max_reset_count=1","max_stall_count=1 and max_reset_count=2","max_round_count=2 and max_stall_count=1"],"answer":[0],"explanation":"Opeenvolgende rondes zonder voortgang verhogen een stall-teller; bij overschrijding van max_stall_count volgt een automatische reset en herplanning. max_reset_count begrenst het aantal plan-resets.","rationale":["Juist: twee stalls triggeren herplanning en een reset-limiet van 1 staat maximaal een herplanning toe.","Onjuist: max_round_count begrenst het totaal aantal rondes, niet de opeenvolgende stalls.","Onjuist: de waarden zijn omgedraaid: herplannen na een stall en twee resets toestaan.","Onjuist: dit begrenst rondes en stalls, maar niet het aantal herplanningen."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/magentic"},{"id":"2.4.4-07","obj":"2.4.4","difficulty":"hard","type":"single","stem":"Alpine Ski House builds a Python handoff workflow with a triage agent, a rental agent, and a lessons agent. The triage agent must continue autonomously when the user does not respond, but for no more than three autonomous turns. The rental and lessons agents must return control to the user after each response.\n\n```python\nworkflow = (\n    HandoffBuilder(\n        name=\"ski_support\",\n        participants=[triage_agent, rental_agent, lessons_agent],\n    )\n    .with_start_agent(triage_agent)\n    .with_autonomous_mode(\n        agents=[triage_agent],\n        ____________________\n    )\n    .build()\n)\n```\n\nWhich argument should you add?","choices":["turn_limits={triage_agent.name: 3}","max_round_count=3","prompts={triage_agent.name: 3}","termination_condition=3"],"answer":[0],"explanation":"with_autonomous_mode accepteert een lijst agents en per agent een turn limit; zonder expliciete limiet is de standaard 50 autonome beurten. Agents die niet in de lijst staan, geven na elke response de controle terug.","rationale":["Juist: turn_limits per agentnaam begrenst de autonome beurten van de triage agent tot drie.","Onjuist: max_round_count is een instelling van de Magentic builder, niet van autonomous mode.","Onjuist: prompts definieert de vervolgprompt per agent, geen aantal beurten.","Onjuist: termination_condition is een functie over het gesprek en hoort op de HandoffBuilder, niet als getal in autonomous mode."],"ref":"https://learn.microsoft.com/agent-framework/workflows/orchestrations/handoff"},{"id":"2.4.4-08","obj":"2.4.4","difficulty":"hard","type":"multi","stem":"Trey Research submits very large Azure OpenAI batch jobs for an agent evaluation pipeline. The jobs fail to start because they reach the enqueued token limit, even though the deployment quota is already at its maximum. Online agent traffic must not be affected, and the pipeline must remain as cheap as possible.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Split the input into multiple smaller batch jobs","Queue the batch jobs by using automatic retries with exponential backoff so that the next job starts when enqueued token quota becomes available","Send the requests one at a time to the online Global Standard deployment","Cancel running jobs and resubmit all requests as a single larger file","Enable prompt caching on the batch deployment"],"answer":[0,1],"explanation":"Batch-requests hebben een aparte enqueued token quota. Wanneer die limiet bereikt is, kun je in ondersteunde regio's meerdere batchjobs in de wachtrij zetten met exponential backoff, zodat de volgende job automatisch start zodra quota vrijkomt.","rationale":["Juist: kleinere jobs passen binnen de enqueued token quota en kunnen achter elkaar worden verwerkt.","Juist: automatische retries met exponential backoff starten de volgende job zodra quota beschikbaar is.","Onjuist: online versturen verstoort de online workloads en kost meer dan batch.","Onjuist: een grotere enkele file overschrijdt de enqueued limiet nog sterker.","Onjuist: prompt caching verlaagt kosten per token maar lost de enqueued token limiet niet op."],"ref":"https://learn.microsoft.com/azure/foundry/openai/how-to/batch"},{"id":"2.4.4-09","obj":"2.4.4","difficulty":"hard","type":"single","stem":"Contoso, Ltd. runs a concurrent orchestration in which four agents evaluate a loan application in parallel. Each agent writes its findings directly to the same Azure Cosmos DB document. Reviewers find that the document sometimes contains inconsistent or overwritten findings. The agents must keep running in parallel.\n\nWhat should you do?","choices":["Have each agent return its findings to an aggregator that performs a single write after fan-in","Set allow_concurrent_invocation to False for each agent","Convert the orchestration to a group chat so that the agents can discuss their updates","Add retry logic to each agent for failed writes"],"answer":[0],"explanation":"Gedeelde mutable state tussen concurrent agents is een bekend antipatroon dat transactioneel inconsistente data oplevert. Laat de agents onafhankelijk resultaten teruggeven en laat een aggregator na de fan-in een enkele, consistente write doen.","rationale":["Juist: aggregatie na fan-in verwijdert gelijktijdige writes naar dezelfde state en behoudt het parallellisme.","Onjuist: deze instelling regelt tool-calls binnen een agent, niet gelijktijdige writes van verschillende agents.","Onjuist: group chat is bedoeld voor discussie in een gedeelde thread en lost het write-conflict niet op.","Onjuist: retries maken overschrijvingen niet consistent; het conflict tussen gelijktijdige writes blijft."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"2.4.5-01","obj":"2.4.5","difficulty":"easy","type":"single","stem":"Northwind Traders enables incoming A2A on a Foundry prompt agent named Agent1. A partner service will call Agent1 through its A2A base path. The partner team asks which credential its client must present on each request, including the request for the agent card.\n\nWhich credential should the partner client present?","choices":["a Microsoft Entra ID token for https://ai.azure.com","an API key that is sent in the x-api-key header","no credential, because the agent card is public","a personal access token in the Authorization header"],"answer":[0],"explanation":"Incoming A2A op een Foundry agent vereist Microsoft Entra ID-authenticatie op alle A2A-URL's, ook op de agent card. Key-based authenticatie en anonieme toegang worden niet ondersteund; de aanroeper vraagt een token aan voor de scope https://ai.azure.com/.default.","rationale":["Juist: alle A2A-URL's van een Foundry agent vereisen een Microsoft Entra-token voor https://ai.azure.com.","Onjuist: key-based authenticatie wordt voor incoming A2A niet ondersteund.","Onjuist: anonieme toegang tot de agent card van een Foundry agent wordt niet ondersteund.","Onjuist: een personal access token is key-based en wordt door het incoming A2A-endpoint niet geaccepteerd."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/enable-agent-to-agent-endpoint"},{"id":"2.4.5-02","obj":"2.4.5","difficulty":"easy","type":"single","stem":"Alpine Ski House connects a Foundry agent to a partner A2A endpoint. Each user must sign in with the user's own account, so the team selects OAuth identity passthrough for the connection. The endpoint publisher already provides a managed OAuth option in the Foundry tool catalog. The team wants the simplest setup and does not want to maintain its own OAuth app registration.\n\nWhich OAuth option should the team configure?","choices":["managed OAuth","custom OAuth with a Microsoft Entra app registration","custom OAuth with an app in a third-party identity provider","key-based authentication with a shared token"],"answer":[0],"explanation":"Bij managed OAuth beheert Microsoft of de publisher van het A2A-endpoint de OAuth app registration. Microsoft raadt deze optie aan wanneer die beschikbaar is, omdat de setup eenvoudiger is en minder configuratiefouten oplevert.","rationale":["Juist: managed OAuth vereist geen eigen app registration en is de aanbevolen optie als die beschikbaar is.","Onjuist: custom OAuth vereist dat je zelf een app registration, client ID, URL's en redirect URL beheert.","Onjuist: ook custom OAuth bij een externe identity provider betekent een eigen OAuth-app beheren.","Onjuist: een gedeeld token behoudt de identiteit van de individuele gebruiker niet."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"2.4.5-03","obj":"2.4.5","difficulty":"easy","type":"single","stem":"Lucerne Publishing has an existing Microsoft Agent Framework agent in Python that summarizes manuscripts. Developers want to call the agent as a tool from GitHub Copilot in Visual Studio Code and from other MCP-compatible agent hosts.\n\nWhat should you do?","choices":["Call as_mcp_server() on the agent and run the server over an MCP transport","Wrap the agent in an A2AAgent instance","Add an MCPStreamableHTTPTool instance to the agent","Register the agent in Foundry Control Plane by using the A2A protocol"],"answer":[0],"explanation":"Met .as_mcp_server() stel je een Agent Framework-agent beschikbaar als MCP-server; de naam en beschrijving van de agent worden de servermetadata. MCP-clients kunnen de agent dan als tool aanroepen.","rationale":["Juist: as_mcp_server maakt de agent bruikbaar als tool voor elke MCP-client.","Onjuist: A2AAgent is een client-wrapper om een remote A2A-agent aan te roepen, niet om een agent te exposen.","Onjuist: MCPStreamableHTTPTool laat de agent zelf een MCP-server consumeren; het exposeert de agent niet.","Onjuist: registratie als A2A-agent maakt de agent bereikbaar voor A2A-clients, niet voor MCP-clients."],"ref":"https://learn.microsoft.com/agent-framework/agents/tools/local-mcp-tools"},{"id":"2.4.5-04","obj":"2.4.5","difficulty":"medium","type":"single","stem":"Contoso, Ltd. adds a Foundry Agent Service A2A tool that uses key-based authentication to call a supplier agent endpoint. Tool calls fail with the message \"Failed to fetch agent card\" and HTTP 401. The supplier confirms that the agent card path requires the same API key as the tool calls.\n\nWhat should you do?","choices":["Set send_credentials_for_agent_card to true in the A2A tool definition","Regenerate the API key and update the project connection","Assign roles to the agent identity on the supplier service","Change the credential name of the project connection to x-api-key"],"answer":[0],"explanation":"De gekozen authenticatie geldt standaard alleen voor tool-calls; de agent card wordt anoniem opgehaald. Als het endpoint de agent card beschermt, zet je send_credentials_for_agent_card op true zodat de connection-credentials ook bij die request worden meegestuurd.","rationale":["Juist: zo worden de credentials ook gebruikt voor het ophalen van de beschermde agent card.","Onjuist: de key is geldig; het probleem is dat die niet wordt meegestuurd bij de agent card request.","Onjuist: de verbinding gebruikt key-based authenticatie, dus rollen op een agent identity hebben geen effect.","Onjuist: een andere headernaam verhelpt niet dat de agent card request zonder credentials wordt verstuurd."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"2.4.5-05","obj":"2.4.5","difficulty":"medium","type":"single","stem":"Woodgrove Bank runs several Foundry agents in one project. All agents were created by using the new agent object model. One agent must call an A2A endpoint whose underlying service is Azure Cosmos DB, which supports Microsoft Entra ID. The solution must avoid managing secrets, and access must be granted to this agent without granting the same access to the other agents in the project.\n\nWhich authentication method should you use?","choices":["Microsoft Entra ID agent identity with role assignments on Azure Cosmos DB","Microsoft Entra ID project managed identity with role assignments on Azure Cosmos DB","Key-based authentication that stores a Cosmos DB key in a project connection","Unauthenticated access combined with a private endpoint"],"answer":[0],"explanation":"In het nieuwe agent object model krijgt elke agent bij het aanmaken een eigen, unieke agent identity (Microsoft Entra ID), waardoor je rollen per agent kunt toewijzen. Met Microsoft Entra-authenticatie en rollen op de onderliggende service hoef je geen secrets te beheren.","rationale":["Juist: de eigen agent identity krijgt als enige de benodigde Cosmos DB-rollen, zonder secrets.","Onjuist: de project managed identity wordt door alle agents in het project gedeeld, wat de isolatie-eis schendt.","Onjuist: key-based authenticatie vereist secretbeheer en iedereen met projecttoegang kan de secret lezen.","Onjuist: zonder authenticatie is er geen identiteitsgebaseerde toegangscontrole per agent."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"2.4.5-06","obj":"2.4.5","difficulty":"medium","type":"single","stem":"Best For You Organics Company wants Agent1, a Foundry agent in Project1, to call Agent2, a Foundry agent in Project2, by using the A2A protocol.\n\nYou need to configure the integration.\n\nWhich sequence of actions should you perform?","choices":["Enable incoming A2A on Agent2 -> Create an A2A project connection whose target is the A2A base path of Agent2 with the audience https://ai.azure.com -> Add an a2a tool that references the connection to Agent1 -> Test the delegation from Agent1","Add an a2a tool to Agent1 -> Enable incoming A2A on Agent2 -> Create an A2A project connection whose target is the agent card path of Agent2 -> Test the delegation from Agent1","Create an A2A project connection whose target is the A2A base path of Agent2 -> Add an a2a tool that references the connection to Agent1 -> Test the delegation from Agent1 -> Enable incoming A2A on Agent2","Enable incoming A2A on Agent1 -> Create an A2A project connection whose target is the A2A base path of Agent1 -> Add an a2a tool that references the connection to Agent2 -> Test the delegation from Agent2"],"answer":[0],"explanation":"De doelagent moet incoming A2A hebben ingeschakeld. Daarna maak je een project connection met als target het A2A base path van de doelagent en audience https://ai.azure.com, zonder agent card path; Foundry bepaalt dat pad zelf. Pas daarna voeg je de a2a-tool toe aan de aanroepende agent en test je.","rationale":["Juist: doel inschakelen, connection maken, tool koppelen en testen volgt de afhankelijkheden.","Onjuist: de tool heeft een bestaande connection nodig, en voor een Foundry-doel stel je geen agent card path in.","Onjuist: testen voordat incoming A2A op het doel is ingeschakeld faalt.","Onjuist: de richting is omgedraaid; incoming A2A moet op de aangeroepen agent, Agent2, staan."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/tools/agent-to-agent"},{"id":"2.4.5-07","obj":"2.4.5","difficulty":"hard","type":"multi","stem":"Litware, Inc. connects a Foundry agent to a third-party A2A endpoint that accepts only a static API key. All users of the agent share the same level of access. The security team requires that exposure of the shared secret is minimized.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Store the API key in a project connection and restrict who can access the project","Request a least-privilege key from the endpoint publisher and rotate it before it expires","Set send_credentials_for_agent_card to true so that every request carries the key","Pass the API key to the agent at run time in the user message","Store each user's personal access token in the shared project connection"],"answer":[0,1],"explanation":"Voor key-based authenticatie sla je gedeelde credentials op in een project connection, en omdat iedereen met projecttoegang die secrets kan zien, beperk je de projecttoegang. Gebruik daarnaast least-privilege credentials en roteer tokens regelmatig.","rationale":["Juist: een project connection voorkomt runtime-doorgifte en beperkte projecttoegang verkleint de blootstelling.","Juist: minimale rechten en regelmatige rotatie beperken de impact van een gelekte key.","Onjuist: credentials meesturen voor de agent card zonder noodzaak vergroot juist de blootstelling van de secret.","Onjuist: een key in een gebruikersbericht komt in de conversatie en logs terecht.","Onjuist: persoonlijke tokens horen niet in een gedeelde connection; daarvoor is OAuth identity passthrough bedoeld."],"ref":"https://learn.microsoft.com/azure/foundry/agents/concepts/agent-to-agent-authentication"},{"id":"2.4.5-08","obj":"2.4.5","difficulty":"hard","type":"single","stem":"Graphic Design Institute has a Foundry prompt agent named ReviewAgent that has incoming A2A enabled. An existing partner agent that is built with the open-source A2A SDK calls ReviewAgent by using A2A v1.0 over JSONRPC. Integration tests show the following behavior:\n\n- Requests that contain only text parts succeed.\n- Requests that attach design files as file parts fail.\n- The partner client is configured to receive server-sent events and never receives incremental updates.\n\nYou need to make the integration work without changing how ReviewAgent is hosted.\n\nWhat should you do?","choices":["Send the design content as text and configure the partner client for non-streaming requests.","Switch the partner client to A2A v0.3 with the HTTP+JSON transport to support file parts.","Switch the partner client to the gRPC transport to support streaming and binary parts.","Assign the partner identity the Foundry User role instead of the Foundry Agent Consumer role."],"answer":[0],"explanation":"Incoming A2A op een Foundry agent ondersteunt alleen de text modality en geen streaming responses (server-sent events). De partner moet dus tekst sturen en een niet-streamende client gebruiken. De tekstverzoeken slagen al, dus authenticatie en autorisatie zijn niet het probleem.","rationale":["Juist: alleen tekst wordt ondersteund en streaming responses niet, dus tekstinhoud en non-streaming lossen beide fouten op.","Onjuist: ook met v0.3 blijven file data en streaming niet ondersteund, en v0.3 is preview.","Onjuist: gRPC wordt door het incoming A2A-endpoint van Foundry voor geen enkele versie ondersteund.","Onjuist: tekstverzoeken slagen al, dus de rol is voldoende; een bredere rol schendt least privilege en lost het modality-probleem niet op."],"ref":"https://learn.microsoft.com/azure/foundry/agents/how-to/enable-agent-to-agent-endpoint"},{"id":"2.4.5-09","obj":"2.4.5","difficulty":"hard","type":"single","stem":"Humongous Insurance builds an orchestrator agent that must select, invoke, filter, and weigh the results of internal claims capabilities, and then synthesize the final answer itself. The capabilities are owned by the same engineering team as the orchestrator. The architects prefer control over the reasoning to flexibility, and they require authenticated access to the underlying tools and data.\n\nWhich integration approach should you use?","choices":["Expose the claims capabilities through MCP servers that the orchestrator calls as tools","Expose each claims capability as an A2A agent that uses its own orchestration","Register each claims capability in Foundry Control Plane as a custom A2A agent","Connect the claims capabilities as handoff targets that take ownership of the conversation"],"answer":[0],"explanation":"MCP geeft een enkele orchestrator sterke controle om tools te selecteren, aan te roepen, te filteren, te redeneren en de uitkomst samen te stellen, en biedt geauthenticeerde toegang tot tools en data. A2A past beter wanneer agents ondoorzichtig voor elkaar moeten zijn, zoals bij andere organisaties.","rationale":["Juist: MCP houdt de redenering en synthese bij de orchestrator voor capabilities van hetzelfde team.","Onjuist: A2A-agents gebruiken hun eigen orchestration, waardoor de orchestrator controle over de redenering verliest.","Onjuist: registratie als custom A2A-agent geeft governance, maar de capabilities blijven ondoorzichtige agents met eigen redenering.","Onjuist: bij handoff neemt de ontvanger het eigenaarschap over, terwijl de orchestrator zelf moet synthetiseren."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-patterns"},{"id":"2.4.6-01","obj":"2.4.6","difficulty":"easy","type":"single","stem":"Adventure Works Cycles automates warranty processing. The process has well-defined steps, and several agents and deterministic functions must coordinate in an explicit order that the developers control.\n\nWhich Microsoft Agent Framework component should you use?","choices":["A workflow","A single agent with function tools","Agent middleware","A context provider"],"answer":[0],"explanation":"Agent Framework adviseert een workflow wanneer het proces goed gedefinieerde stappen heeft, je expliciete controle over de uitvoeringsvolgorde nodig hebt en meerdere agents of functies moeten samenwerken. Een agent past bij open, conversationele taken met autonome planning.","rationale":["Juist: een workflow geeft expliciete, inspecteerbare uitvoeringspaden tussen agents en functies.","Onjuist: een enkele agent plant autonoom en geeft geen expliciete controle over de volgorde.","Onjuist: middleware onderschept agent-runs voor cross-cutting concerns maar orkestreert geen stappen.","Onjuist: een context provider levert context aan een agent en coordineert geen meerdere agents."],"ref":"https://learn.microsoft.com/agent-framework/overview/"},{"id":"2.4.6-02","obj":"2.4.6","difficulty":"easy","type":"single","stem":"Trey Research has production multi-agent solutions built with Semantic Kernel and AutoGen. The company wants to standardize on the framework that the same Microsoft teams created as the direct successor to both, including graph-based workflows.\n\nWhich framework should you choose?","choices":["Microsoft Agent Framework","LangGraph","Microsoft 365 Agents SDK","LangChain"],"answer":[0],"explanation":"Agent Framework is de directe opvolger van Semantic Kernel en AutoGen, gebouwd door dezelfde teams. Het combineert de eenvoudige agent-abstracties van AutoGen met de enterprisefeatures van Semantic Kernel en voegt graph-based workflows toe.","rationale":["Juist: Agent Framework is de volgende generatie van zowel Semantic Kernel als AutoGen.","Onjuist: LangGraph is een open-source graph-framework van een andere partij, geen opvolger van Semantic Kernel.","Onjuist: de Microsoft 365 Agents SDK richt zich op kanalen en hosting en kan Agent Framework als orchestrator gebruiken.","Onjuist: LangChain is een open-source framework en geen opvolger van Semantic Kernel en AutoGen."],"ref":"https://learn.microsoft.com/agent-framework/overview/"},{"id":"2.4.6-03","obj":"2.4.6","difficulty":"easy","type":"single","stem":"Fourth Coffee configures its agents centrally in the Foundry portal. A developer is building a LangGraph application by using the langchain-azure-ai package and must use an existing Foundry agent named menu-agent as a node in the graph without redefining the agent in code.\n\nWhich AgentServiceFactory method should you use?","choices":["get_agent_node","create_prompt_agent","get_agents_id_from_graph","delete_agent"],"answer":[0],"explanation":"Met get_agent_node haal je een bestaande Foundry-agent op als LangGraph-compatibele node. Dit wordt aanbevolen omdat de agentconfiguratie dan centraal in Foundry blijft en je code zich op orchestration richt.","rationale":["Juist: get_agent_node verwijst op naam en versie naar een bestaande agent als node.","Onjuist: create_prompt_agent maakt een nieuwe agent in code, terwijl de agent al centraal bestaat.","Onjuist: deze methode leest naam en versie uit een gecompileerde graph en maakt geen node.","Onjuist: delete_agent verwijdert een agent."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/langchain-agents"},{"id":"2.4.6-04","obj":"2.4.6","difficulty":"medium","type":"single","stem":"Alpine Ski House builds a LangGraph StateGraph with a local router_node and an expert_node that runs a Foundry agent. The function route_decision returns either \"expert_node\" or END based on the last message. The graph must call expert_node only when the router decides to delegate.\n\n```python\nworkflow = StateGraph(RouterState)\nworkflow.add_node(\"router_node\", router_node)\nworkflow.add_node(\"expert_node\", echo_node)\nworkflow.add_edge(START, \"router_node\")\n# missing line\nworkflow.add_edge(\"expert_node\", END)\napp = workflow.compile()\n```\n\nWhich line should you add?","choices":["workflow.add_conditional_edges(\"router_node\", route_decision)","workflow.add_edge(\"router_node\", \"expert_node\")","workflow.add_node(\"route_decision\", route_decision)","workflow.add_edge(\"router_node\", END)"],"answer":[0],"explanation":"In LangGraph routeer je dynamisch met add_conditional_edges: de routingfunctie bepaalt op basis van de state welke node volgt. Een gewone edge volgt altijd hetzelfde pad.","rationale":["Juist: conditional edges laten route_decision kiezen tussen expert_node en END.","Onjuist: een vaste edge roept expert_node bij elk request aan, ook als de router het zelf afhandelt.","Onjuist: de routingfunctie is geen node; zo wordt er niets conditioneel gerouteerd.","Onjuist: een vaste edge naar END delegeert nooit naar de expert."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/langchain-agents"},{"id":"2.4.6-05","obj":"2.4.6","difficulty":"medium","type":"single","stem":"Relecloud creates a LangGraph agent by using AgentServiceFactory.create_prompt_agent with an MCPTool whose require_approval is set to always and a MemorySaver checkpointer. The first invoke call uses config = {\"configurable\": {\"thread_id\": \"session-7\"}} and returns an interrupt for an MCP approval request. The reviewer approves the call.\n\nWhat should you do to resume the run?","choices":["Invoke the agent with Command(resume={\"approve\": True}) and the same config","Invoke the agent with a new HumanMessage that contains the text approve and no config","Invoke the agent with Command(resume={\"approve\": True}) and a new thread_id","Send a new request that sets previous_response_id to the interrupt ID"],"answer":[0],"explanation":"create_prompt_agent voegt een approval-node toe volgens het LangGraph-patroon. Na de interrupt hervat je met een Command(resume=...) in dezelfde thread, zodat de checkpointer de gepauzeerde state kan terugvinden.","rationale":["Juist: Command resume met dezelfde thread_id hervat de gepauzeerde graph met de goedkeuring.","Onjuist: een nieuw bericht zonder config start een nieuwe run en beantwoordt de interrupt niet.","Onjuist: een nieuwe thread_id verwijst naar een andere checkpoint-thread zonder de pending interrupt.","Onjuist: previous_response_id hoort bij de Responses API, niet bij het hervatten van een LangGraph-interrupt."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/langchain-agents"},{"id":"2.4.6-06","obj":"2.4.6","difficulty":"medium","type":"single","stem":"Graphic Design Institute builds a long-running Agent Framework workflow in which an AgentExecutor wraps a FoundryAgent that uses server-side sessions. After restoring a checkpoint, the agent behaves as though its conversation state changed since the checkpoint was taken. The workflow must resume reliably from checkpoints.\n\nWhat should you do?","choices":["Implement a custom executor that manages the agent state","Share a single session between all AgentExecutor instances","Increase the frequency at which checkpoints are created","Switch the checkpoint storage to FileCheckpointStorage"],"answer":[0],"explanation":"Een AgentExecutor serialiseert berichtcache, gespreksgeschiedenis en sessiestate, maar server-side sessiestate zoals bij FoundryAgent wordt niet in checkpoints vastgelegd en kan door latere runs veranderen. Voor betrouwbare checkpointing wordt een custom executor aangeraden.","rationale":["Juist: een custom executor kan de state zelf beheren zodat herstel betrouwbaar wordt.","Onjuist: een gedeelde sessie verandert niets aan het feit dat server-side state buiten het checkpoint valt.","Onjuist: vaker checkpointen legt de server-side state nog steeds niet vast.","Onjuist: het opslagtype van checkpoints lost het ontbreken van server-side state niet op."],"ref":"https://learn.microsoft.com/agent-framework/concepts/workflows/advanced/agent-executor"},{"id":"2.4.6-07","obj":"2.4.6","difficulty":"hard","type":"single","stem":"Wide World Importers uses the langchain-azure-ai package to compose a LangGraph solution with Foundry Agent Service. A developer adds the CodeInterpreterTool from langchain_azure_ai.agents.prebuilt.tools to a generic LangGraph tool node, and the graph fails when the model requests code execution. Data analysis must run in the Foundry sandbox.\n\nWhat should you do?","choices":["Pass the CodeInterpreterTool in the tools list of factory.create_prompt_agent","Wrap the CodeInterpreterTool in a local Python function and add it to the tool node","Retrieve the agent by using get_agent_node and add the CodeInterpreterTool to the tool node","Replace the CodeInterpreterTool with AzureAIDocumentIntelligenceTool"],"answer":[0],"explanation":"Built-in tools uit langchain_azure_ai.agents.prebuilt.tools draaien server-side in Foundry Agent Service en werken alleen met create_prompt_agent. Ze voegen geen tool node toe; local tools draaien juist in een tool node waar de agentcode draait.","rationale":["Juist: via create_prompt_agent wordt de built-in tool server-side in de service uitgevoerd.","Onjuist: een lokale wrapper voert geen code uit in de Foundry sandbox.","Onjuist: een bestaande agent node maakt de built-in tool nog steeds niet bruikbaar in een generieke tool node.","Onjuist: Document Intelligence analyseert documenten en voert geen code uit."],"ref":"https://learn.microsoft.com/azure/foundry/how-to/develop/langchain-agents"},{"id":"2.4.6-08","obj":"2.4.6","difficulty":"hard","type":"multi","stem":"Northwind Traders migrates an AutoGen GraphFlow solution to Microsoft Agent Framework workflows. The new workflow must pause to wait for a credit officer decision, and it must continue from the same point after the host process restarts.\n\nWhich two workflow capabilities should you use? Each correct answer presents part of the solution.","choices":["Request and response handling","Checkpointing","Message broadcast to every executor","Per-edge activation_condition settings","A distributed runtime that spans several processes"],"answer":[0,1],"explanation":"Agent Framework-workflows routeren getypeerde berichten langs edges. Met request/response pauzeert een workflow voor externe input, en checkpointing bewaart de voortgang zodat je kunt hervatten.","rationale":["Juist: request/response laat de workflow wachten op de beslissing van de credit officer.","Juist: checkpointing persisteert de voortgang en maakt hervatten na een herstart mogelijk.","Onjuist: broadcast is het GraphFlow-model; workflows routeren data expliciet langs edges.","Onjuist: activation_condition is een GraphFlow-instelling voor join-gedrag en geen pauze- of hervatmechanisme.","Onjuist: Agent Framework richt zich nu op single-process compositie; distributed uitvoering is gepland."],"ref":"https://learn.microsoft.com/agent-framework/migration-guide/from-autogen/"},{"id":"2.4.6-09","obj":"2.4.6","difficulty":"hard","type":"single","stem":"Lamna Healthcare Company has a validated patient-consent process that consists of three executors. The process must be reused inside several larger Agent Framework workflows. Each reuse must keep isolated input and output and its own independent state, and messages must not be broadcast between the outer and inner levels.\n\nWhat should you do?","choices":["Compose the consent process as a sub-workflow that runs as an executor in each larger workflow","Copy the three executors into each larger workflow and connect them with edges","Run the consent process as a group chat participant in each larger workflow","Expose the consent process as an A2A agent and call it from each larger workflow"],"answer":[0],"explanation":"Bij nesting in Agent Framework loopt een geneste workflow via een WorkflowExecutor met geisoleerde input en output, zonder broadcasting tussen niveaus en met onafhankelijke state per niveau. Dat maakt hergebruik van een gevalideerd proces eenvoudig.","rationale":["Juist: een sub-workflow als executor geeft isolatie van input, output en state.","Onjuist: kopieren verliest de isolatie en verdubbelt onderhoud van een gevalideerd proces.","Onjuist: group chat deelt een accumulerende thread en isoleert de state niet.","Onjuist: A2A voegt een netwerkhop en een ondoorzichtige agent toe terwijl het proces lokaal herbruikbaar moet zijn."],"ref":"https://learn.microsoft.com/agent-framework/migration-guide/from-autogen/"},{"id":"2.4.7-01","obj":"2.4.7","difficulty":"easy","type":"single","stem":"Contoso, Ltd. adds a sentiment pre-check in front of its support agents so that angry customers are routed to an escalation agent. The team wants to use a pre-trained Hugging Face model without additional training, and inference must use a GPU with batching when one is available.\n\nWhich Hugging Face Transformers component should you use?","choices":["A Transformers pipeline for the sentiment analysis task","The Trainer class with TrainingArguments","The load_dataset function from the datasets library","DataCollatorWithPadding"],"answer":[0],"explanation":"Transformers pipelines bevatten best practices en standaardmodellen per taak, maken het eenvoudig om GPU's te gebruiken en ondersteunen batching voor betere throughput. Voor taken zoals sentimentanalyse werken voorgetrainde modellen vaak zonder extra training.","rationale":["Juist: een pipeline levert direct inferentie met een voorgetraind model, inclusief GPU-gebruik en batching.","Onjuist: Trainer is voor training of fine-tuning, wat hier niet nodig is.","Onjuist: load_dataset laadt data en voert geen inferentie uit.","Onjuist: een data collator batcht trainingsinput en is geen inferentiecomponent."],"ref":"https://learn.microsoft.com/azure/databricks/machine-learning/train-model/huggingface/"},{"id":"2.4.7-02","obj":"2.4.7","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. wants a small intent classifier that decides which specialist agent receives each request. The team has labeled examples and will fine-tune an open-source base model by using Hugging Face Transformers.\n\nWhich class should you use to load the base model for this task?","choices":["AutoModelForSequenceClassification","AutoModelForTokenClassification","DataCollatorWithPadding","AutoModelForCausalLM"],"answer":[0],"explanation":"Voor tekstclassificatie laad je met AutoModelForSequenceClassification een basismodel, waarbij je het aantal klassen en de labelmappings opgeeft. De andere klassen ondersteunen training of tokenisatie maar laden geen classificatiemodel.","rationale":["Juist: deze Auto Model-klasse laadt een basismodel met een classificatiekop voor de intents.","Onjuist: token classification labelt afzonderlijke tokens, zoals bij named entity recognition, niet een volledig verzoek.","Onjuist: een data collator batcht en padt input tijdens training en laadt geen model.","Onjuist: een causal language model genereert tekst en heeft geen classificatiekop voor intents."],"ref":"https://learn.microsoft.com/azure/databricks/machine-learning/train-model/huggingface/fine-tune-model"},{"id":"2.4.7-03","obj":"2.4.7","difficulty":"easy","type":"single","stem":"Relecloud wants a retrieval agent to use an open-source Sentence-Transformers embedding model from the Hugging Face collection in the Foundry model catalog. The model is available in the current Foundry project.\n\nWhich deployment option should you use?","choices":["Foundry Managed Compute","Global Batch","Global Provisioned","Data Zone Standard"],"answer":[0],"explanation":"Hugging Face-modellen in de huidige Foundry-ervaring gebruiken Foundry Managed Compute, dat dedicated GPU-compute en een endpoint voor inferentie aanmaakt. De andere opties zijn deployment types voor Foundry Models die door Microsoft worden gehost.","rationale":["Juist: Hugging Face-modellen worden in Foundry uitgerold op managed compute met dedicated GPU's.","Onjuist: Global Batch is voor asynchrone bulkverwerking van ondersteunde modellen, niet voor Hugging Face-modellen.","Onjuist: provisioned throughput geldt voor ondersteunde Foundry Models, niet voor de Hugging Face-collectie.","Onjuist: Data Zone Standard is een pay-as-you-go type voor ondersteunde Foundry Models."],"ref":"https://learn.microsoft.com/azure/foundry/foundry-models/how-to/hugging-face-models"},{"id":"2.4.7-04","obj":"2.4.7","difficulty":"medium","type":"single","stem":"Lucerne Publishing wants to deploy a permissively licensed Hugging Face chat model in the current Foundry experience for an editing agent. The model meets the Foundry support criteria and the project region supports it, but the model does not appear when the Available in my Project filter is enabled in the model catalog.\n\nWhat should you do first?","choices":["Request GPU quota for Foundry Managed Compute for a compatible accelerator type","Request a virtual machine core quota increase for the subscription","Assign the Foundry User role on the Foundry account to the developers","Change the deployment option filter of the model catalog to Global Batch"],"answer":[0],"explanation":"Het filter Available in my Project toont alleen modellen waarvoor je subscription beschikbare GPU managed compute quota heeft voor minstens een compatibel accelerator type, en die in de regio van het project beschikbaar zijn. Omdat regio en supportcriteria al kloppen, controleer en verhoog je eerst de Foundry Managed Compute-quota.","rationale":["Juist: zonder Foundry Managed Compute GPU-quota voor een compatibel accelerator type verschijnt het model niet in het gefilterde overzicht.","Onjuist: de quota voor Foundry Managed Compute staat los van Azure VM-quota en wordt via een ander pad aangevraagd.","Onjuist: de rol Foundry User is nodig om de deployment aan te roepen, niet om het model in de catalogus te laten verschijnen.","Onjuist: Hugging Face-modellen gebruiken in Foundry managed compute, niet het deployment type Global Batch."],"ref":"https://learn.microsoft.com/azure/foundry/foundry-models/how-to/hugging-face-models"},{"id":"2.4.7-05","obj":"2.4.7","difficulty":"medium","type":"single","stem":"Wingtip Toys tries to deploy a Hugging Face model from the Azure Machine Learning model catalog for a product description agent. The deployment fails with an error that states that loading the model requires executing the configuration file in the model repository and setting trust_remote_code=True.\n\nWhat should you do?","choices":["Select an alternative model that uses Safetensors weights and does not require remote code","Set trust_remote_code to True in an environment variable of the deployment","Select a larger instance_type for the deployment","Add the missing Python libraries to a custom environment"],"answer":[0],"explanation":"Modellen die code uit de modelrepository moeten uitvoeren met trust_remote_code worden om veiligheidsredenen niet ondersteund. Ondersteunde modellen hebben Safetensors-gewichten en vereisen geen remote code.","rationale":["Juist: een model zonder remote code met Safetensors-gewichten voldoet aan de ondersteunde criteria.","Onjuist: remote code wordt om veiligheidsredenen niet ondersteund, dus deze instelling werkt niet.","Onjuist: een grotere instance lost geheugenproblemen op, niet de beperking op remote code.","Onjuist: ontbrekende libraries geven een ModuleNotFoundError of ImportError, wat een ander probleem is."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-deploy-models-from-huggingface?view=azureml-api-2"},{"id":"2.4.7-06","obj":"2.4.7","difficulty":"medium","type":"single","stem":"Trey Research fine-tunes a Hugging Face model on a single GPU to act as a domain classifier for its agents. Training fails with \"OutOfMemoryError: CUDA out of memory\". You need to resolve the error while keeping the same effective batch size.\n\nWhat should you do?","choices":["Lower per_device_train_batch_size and raise gradient_accumulation_steps","Increase per_device_train_batch_size in TrainingArguments","Set fp16 to False in TrainingArguments for full precision","Increase the learning_rate value in TrainingArguments"],"answer":[0],"explanation":"Een kleinere per-device batch size verlaagt het GPU-geheugengebruik, en gradient_accumulation_steps vergroot de effectieve batch size weer. Zo los je de out-of-memory fout op zonder het trainingsgedrag sterk te veranderen.","rationale":["Juist: kleinere batches met gradient accumulation verlagen het geheugengebruik bij gelijke effectieve batch size.","Onjuist: een grotere batch size verhoogt het geheugengebruik.","Onjuist: lagere precisie met fp16 bespaart juist geheugen; uitzetten verhoogt het gebruik.","Onjuist: de learning rate beinvloedt het geheugengebruik niet."],"ref":"https://learn.microsoft.com/azure/databricks/machine-learning/train-model/huggingface/fine-tune-model"},{"id":"2.4.7-07","obj":"2.4.7","difficulty":"hard","type":"multi","stem":"Tailspin Toys uses a Hugging Face Transformers classifier on Azure Databricks to label millions of support transcripts. The labels feed an agent analytics dashboard daily. The input data is read several times for different experiments, and the scoring must scale across the cluster at low cost.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Run a preprocessing job that writes the cleaned transcripts to a Delta Lake table before the inference job","Apply the model by using an iterator pandas UDF that loads the model once and scores batches of rows","Apply the model by using a row-at-a-time Python UDF","Deploy the model from the HuggingFace registry to an Azure Machine Learning batch endpoint","Load the model inside the UDF for every row"],"answer":[0,1],"explanation":"Als je de data vaker leest, verdeel je de kosten van inname en voorbereiding door eerst te ETL'en naar Delta Lake, en kun je per job andere hardware kiezen. Spark pandas UDFs schalen batch-inferentie; een iterator-UDF laadt het model eenmalig en verwerkt batches.","rationale":["Juist: aparte preprocessing naar Delta spreidt de kosten en laat CPU voor ETL en GPU voor inferentie toe.","Juist: een iterator pandas UDF initialiseert het model eenmaal en verwerkt vectorized batches over het cluster.","Onjuist: row-at-a-time Python UDFs zijn veel trager dan vectorized pandas UDFs.","Onjuist: modellen uit de HuggingFace registry kunnen niet naar batch endpoints worden uitgerold.","Onjuist: het model per rij laden is extreem kostbaar en traag."],"ref":"https://learn.microsoft.com/azure/databricks/machine-learning/train-model/dl-best-practices"},{"id":"2.4.7-08","obj":"2.4.7","difficulty":"hard","type":"single","stem":"Datum Corporation wants to summarize long documents overnight by using a Hugging Face summarization model in Azure Machine Learning. A summarization agent reads the results the next morning. The team first tried to deploy the model from the HuggingFace registry to a batch endpoint, and then tried to use the registry model as an input to a job.\n\nWhat should you do?","choices":["Register the model in the workspace and deploy it to a batch endpoint","Deploy the HuggingFace registry model to a batch endpoint on larger VMs","Use the HuggingFace registry model as an input to a pipeline job","Deploy the registry model to a managed online endpoint and call it in a loop"],"answer":[0],"explanation":"Hugging Face-modellen uit de registry kunnen niet naar batch endpoints worden uitgerold, en omdat de gewichten niet in de registry staan, kun je ze niet als job-input gebruiken. Je registreert het model daarom zelf en rolt het uit naar een batch endpoint met een GPU-cluster en een environment met transformers.","rationale":["Juist: een eigen geregistreerd model op een batch endpoint met transformers-environment ondersteunt nachtelijke batchverwerking.","Onjuist: de beperking geldt ongeacht het instance type; registry-modellen worden niet ondersteund op batch endpoints.","Onjuist: registry-modellen kunnen niet als job-input worden gebruikt omdat de gewichten daar niet worden opgeslagen.","Onjuist: een online endpoint in een lus is bedoeld voor real-time inferentie en is duurder en minder schaalbaar voor bulk."],"ref":"https://learn.microsoft.com/azure/machine-learning/how-to-nlp-processing-batch?view=azureml-api-2"},{"id":"2.4.7-09","obj":"2.4.7","difficulty":"hard","type":"single","stem":"Woodgrove Bank adds a Hugging Face model as a specialist in a multi-agent solution. Compliance requires that model weights are stored on Azure and are not downloaded from Hugging Face Hub at deployment time. The model is not gated, it is available in the current Foundry project, and the agent must call it through an OpenAI-compatible endpoint.\n\nWhich deployment approach should you use?","choices":["Deploy the model to Foundry Managed Compute in Foundry","Deploy the model to a managed online endpoint in Foundry (classic)","Deploy the model from the HuggingFace registry to an Azure Machine Learning managed online endpoint","Deploy the model to Azure Databricks Model Serving by loading it from Hugging Face Hub"],"answer":[0],"explanation":"In de huidige Foundry worden de gewichten van Hugging Face-modellen op Azure opgeslagen, terwijl Foundry (classic) en Azure Machine Learning de gewichten bij deployment downloaden van Hugging Face Hub. De deployment wordt aangeroepen via het uniforme OpenAI-compatibele Foundry-endpoint.","rationale":["Juist: Foundry Managed Compute host de gewichten op Azure en biedt een OpenAI-compatibel endpoint.","Onjuist: Foundry (classic) downloadt de gewichten bij deployment van Hugging Face Hub.","Onjuist: de HuggingFace registry in Azure Machine Learning host geen gewichten; endpoints downloaden ze van de Hub.","Onjuist: laden vanaf Hugging Face Hub schendt de eis dat gewichten niet van de Hub worden gedownload."],"ref":"https://learn.microsoft.com/azure/foundry/foundry-models/how-to/hugging-face-models"},{"id":"2.4.8-01","obj":"2.4.8","difficulty":"easy","type":"single","stem":"Proseware, Inc. runs several Microsoft Agent Framework agents in Python. The operations team needs a log entry with the name and duration of every tool call that the agents make, without modifying the tool functions.\n\nWhich type of middleware should you implement?","choices":["Function middleware","Chat middleware","Agent middleware","A context provider"],"answer":[0],"explanation":"Function middleware onderschept elke functie- of tool-call van de agent en heeft via FunctionInvocationContext toegang tot de functie, argumenten en het resultaat. Zo log je naam en duur zonder de tools zelf aan te passen.","rationale":["Juist: function middleware draait rond elke tool-aanroep en kan naam en duur meten.","Onjuist: chat middleware onderschept requests naar het model, niet de individuele tool-uitvoering.","Onjuist: agent middleware wikkelt de hele agent-run en ziet de afzonderlijke tool-calls niet als aparte stappen.","Onjuist: een context provider levert context aan de agent en onderschept geen tool-calls."],"ref":"https://learn.microsoft.com/agent-framework/concepts/agents/middleware/"},{"id":"2.4.8-02","obj":"2.4.8","difficulty":"easy","type":"single","stem":"Contoso, Ltd. must audit the exact messages that its Agent Framework agents send to the AI model. The audit must include every model call, including the calls that send tool re
